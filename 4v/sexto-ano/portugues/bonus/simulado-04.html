<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["A sopa estava muito quente.", "A girafa é muito alta.", "Havia muita gente na praia.", "O cachorro late muito.", "Manuela canta muito bem."], "certa": 2, "explicacao": "c) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O goleiro defendeu o pênalti.", "O juiz anula o gol.", "O menino quebrou o vaso.", "Vendem-se ingressos na portaria.", "Nós nos vestimos rapidamente."], "certa": 3, "explicacao": "d) Vendem-se ingressos na portaria."}, {"enunciado": "Ontem eu ___ (verbo <b>prever</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["prevejei", "prevei", "preveru", "preveu", "previ"], "certa": 4, "explicacao": "e) previ — prever segue ver: eu vi → eu previ."}, {"enunciado": "O que quer dizer <b>empírico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que vem da experiência, da observação", "onde é muito difícil viver", "que governa um império", "breve e direto", "pouco, escasso"], "certa": 0, "explicacao": "a) que vem da experiência, da observação. Não é “que governa um império”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "Comi meia pizza.", "Helena ficou meia tímida.", "As portas estavam meio abertas.", "Comprei meio quilo de uva."], "certa": 2, "explicacao": "c) — o certo é “Helena ficou meio tímida”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Assistimos a aula juntos.", "Vamos no parque amanhã.", "Prefiro mais suco do que refrigerante.", "Prefiro mais verão do que inverno.", "Prefiro cachorro a gato."], "certa": 4, "explicacao": "e) Prefiro cachorro a gato."}, {"enunciado": "“— Eu gosto de chocolate agora — explicou Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca explicou que gostava de chocolate naquele momento.", "Bianca explicou que gostava de chocolate agora.", "Bianca explicou que gosta de chocolate agora.", "Bianca explicou que eu gostava de chocolate naquele momento.", "Bianca explicou que eu gosto de chocolate agora."], "certa": 0, "explicacao": "a) Bianca explicou que gostava de chocolate naquele momento."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Nevou no sul.", "A vovó e o vovô acordaram cedo.", "Escrevemos uma carta.", "As amigas de Lívia comeram pizza.", "As crianças da escola pintaram um quadro."], "certa": 0, "explicacao": "a) Nevou no sul."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "firme e calmo diante do sofrimento", "o público que assiste a um espetáculo", "sem medo, destemido", "chorão, que reclama de tudo"], "certa": 1, "explicacao": "b) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Mamãe trouxe a receita para mim guardar.", "Ela deu o recado para eu levar.", "Para mim, fazer isso é fácil.", "Isso é para eu ler.", "Sem mim, a festa não teria graça."], "certa": 0, "explicacao": "a) — o certo é “para eu guardar”."}, {"enunciado": "Como se escreve <b>55º</b> por extenso? Responda com a letra.", "alternativas": ["quinquagésimo quinto", "cinquentésimo quinto", "sexagésimo quinto", "quinquagésimo sexto", "quadragésimo quinto"], "certa": 0, "explicacao": "a) quinquagésimo quinto"}, {"enunciado": "Amanhã, eles ___ pizza. Qual forma completa a frase? Responda com a letra.", "alternativas": ["comeram", "comerão", "comiam", "comem", "comeriam"], "certa": 1, "explicacao": "b) comerão — futuro: -ão."}, {"enunciado": "Ontem ele ___ (verbo <b>estar</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["está", "estava", "esteu", "esteve", "estará"], "certa": 3, "explicacao": "d) esteve"}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito diferente, desigual", "que passa num instante", "onde é muito difícil viver", "que brilha muito forte", "descuidado, que cai fácil em armadilhas"], "certa": 1, "explicacao": "b) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>bônus</b> tem acento? Responda com a letra.", "alternativas": ["éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona terminada em o leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "paroxítona terminada em us leva acento"], "certa": 4, "explicacao": "e) paroxítona terminada em us leva acento (bô-nus)."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A menina cujas ideias ganharam o prêmio veio à festa.", "A professora cuja a bicicleta quebrou veio à festa.", "O vizinho cujas as irmãs moram longe veio à festa.", "A menina cujos os irmãos estudam aqui veio à festa.", "A professora cuja a mãe é médica veio à festa."], "certa": 0, "explicacao": "a) A menina cujas ideias ganharam o prêmio veio à festa."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["atualizar · expressão · legalizar", "impressão · bizar · organizar", "agonizar · modernizar · conceção", "organização · admissão · repreção", "expanção · colonizar · discussão"], "certa": 0, "explicacao": "a"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["É perigoso acender fogo dentro de casa.", "O docente da classe é o professor.", "Ele tem um ótimo censo de humor.", "A rosa fragrante perfumou a sala.", "O calor faz o metal dilatar."], "certa": 2, "explicacao": "c) — o certo é “senso” (juízo)."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "pálido, sem cor", "investigar com cuidado para descobrir a verdade", "sem medo, destemido", "onde é muito difícil viver"], "certa": 3, "explicacao": "d) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém sabe por que Theo faltou à aula de Educação Física.", "A excursão ao aquário foi cancelada porque?", "Ninguém sabe por que Lia faltou à aula de Geografia.", "O experimento deu errado, e a turma inteira quis saber por quê.", "Ninguém sabe por que Caio faltou à aula de Geografia."], "certa": 1, "explicacao": "b) — o certo é “A excursão ao aquário foi cancelada por quê?”: está no fim da frase, logo antes do ponto: aí ganha acento."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Bia guardou mal o caderno e não acha mais.", "Davi quer saber aonde o ônibus do zoológico vai levar a turma.", "Davi quer saber aonde o ônibus do museu vai levar a turma.", "Não a motivo para desistir antes de tentar de novo.", "Theo quer saber aonde o ônibus do parque estadual vai levar a turma."], "certa": 3, "explicacao": "d) o certo é “há”"}, {"enunciado": "Qual destas frases é <b>exclamativa</b>? Responda com a letra.", "alternativas": ["Bianca resistiu ao doce?", "Quem comeu pizza?", "Que dia lindo!", "As crianças da escola tocaram violão.", "Decida o jogo."], "certa": 2, "explicacao": "c) Que dia lindo!"}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "caro, que custa muito", "que não faz efeito", "comum, do dia a dia; sem importância", "que não deixa dúvida, claríssimo"], "certa": 0, "explicacao": "a) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As crianças da escola varreram o quintal.", "As crianças da escola varri o quintal.", "As crianças da escola varremos o quintal.", "As crianças da escola varre o quintal.", "As crianças da escola varreu o quintal."], "certa": 0, "explicacao": "a) As crianças da escola varreram o quintal. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["Fazia muito frio.", "Faz dez minutos que o ônibus passou.", "Faz dois anos que moro aqui.", "É proibido a entrada de bicicletas.", "Precisamos de menos tempo."], "certa": 3, "explicacao": "d) — o certo é “É proibida a entrada”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Voltei a biblioteca.", "Entreguei o presente a ela.", "Aprendi a nadar.", "Vire à esquerda.", "Viajei a Roma e à Itália."], "certa": 0, "explicacao": "a) — o certo é “à biblioteca”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "“Nicolas viu três animais <span class=\"caixa\"></span> tigre, elefante e leão.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto de interrogação", "reticências", "dois-pontos", "vírgula", "ponto final"], "certa": 2, "explicacao": "c) dois-pontos — vem uma lista."}, {"enunciado": "O que quer dizer <b>intrépido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["corajoso, que não tem medo", "que fala sem parar", "dos antepassados, muito antigo, passado de geração em geração", "que se prepara antes, que se previne", "esperto, que percebe tudo rápido"], "certa": 0, "explicacao": "a) corajoso, que não tem medo. Não é “que fala sem parar”: essa é a pegadinha."}, {"enunciado": "Na frase “O guia do parque estadual explicou o <b>porquê</b> das regras de visita.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por isso", "porém", "o motivo", "pelo qual / pela qual", "motivo para"], "certa": 2, "explicacao": "c) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Em qual frase há <b>onomatopeia</b>? Responda com a letra.", "alternativas": ["O gato pediu leite: miau!", "O relógio corria apressado.", "A professora é uma luz para a turma.", "O menino é esperto como uma raposa.", "Ele é mais alto que um prédio de dez andares."], "certa": 0, "explicacao": "a) O gato pediu leite: miau!"}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
