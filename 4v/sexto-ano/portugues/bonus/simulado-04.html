<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["A sopa estava muito quente.", "A girafa é muito alta.", "Havia muita gente na praia.", "O cachorro late muito.", "Manuela canta muito bem."], "certa": 2, "explicacao": "c) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O goleiro defendeu o pênalti.", "O juiz anula o gol.", "O menino quebrou o vaso.", "Vendem-se ingressos na portaria.", "Nós nos vestimos rapidamente."], "certa": 3, "explicacao": "d) Vendem-se ingressos na portaria."}, {"enunciado": "Ontem eu ___ (verbo <b>prever</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["prevejei", "prevei", "preveru", "preveu", "previ"], "certa": 4, "explicacao": "e) previ — prever segue ver: eu vi → eu previ."}, {"enunciado": "O que quer dizer <b>empírico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que vem da experiência, da observação", "onde é muito difícil viver", "que governa um império", "breve e direto", "pouco, escasso"], "certa": 0, "explicacao": "a) que vem da experiência, da observação. Não é “que governa um império”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "Comi meia pizza.", "Lívia ficou meia tímida.", "As portas estavam meio abertas.", "Comprei meio quilo de uva."], "certa": 2, "explicacao": "c) — o certo é “Lívia ficou meio tímida”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Os alunos chegaram no museu cedo.", "Ela namora com o Pedro.", "Assistimos a aula juntos.", "Fui ao mercado comprar pão.", "Prefiro mais praia do que piscina."], "certa": 3, "explicacao": "d) Fui ao mercado comprar pão."}, {"enunciado": "“— Eu adoro dinossauros agora — contou Manuela.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Manuela contou que eu adorava dinossauros naquele momento.", "Manuela contou que adorava dinossauros naquele momento.", "Manuela contou que adora dinossauros agora.", "Manuela contou que adorava dinossauros agora.", "Manuela contou que eu adoro dinossauros agora."], "certa": 1, "explicacao": "b) Manuela contou que adorava dinossauros naquele momento."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio sonhou com dragões.", "Ventou forte a noite toda.", "Manuela e Bianca plantaram uma árvore.", "Vendi limonada.", "O cachorro e o gato varreram o quintal."], "certa": 3, "explicacao": "d) Vendi limonada."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pedir algo a que se tem direito", "o público que assiste a um espetáculo", "firme e calmo diante do sofrimento", "fora da época certa", "chorão, que reclama de tudo"], "certa": 2, "explicacao": "c) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela deu o recado para eu levar.", "Isso é para eu ler.", "Isso é fácil demais para eu.", "Trouxe o lápis para eu desenhar.", "Sem mim, a festa não teria graça."], "certa": 2, "explicacao": "c) — o certo é “para mim”."}, {"enunciado": "Como se escreve <b>91º</b> por extenso? Responda com a letra.", "alternativas": ["nonagésimo segundo", "centésimo primeiro", "noventésimo primeiro", "nonagésimo primeiro", "octogésimo primeiro"], "certa": 3, "explicacao": "d) nonagésimo primeiro"}, {"enunciado": "Na semana passada, eles ___ violão. Qual forma completa a frase? Responda com a letra.", "alternativas": ["tocam", "tocariam", "tocavam", "tocarão", "tocaram"], "certa": 4, "explicacao": "e) tocaram — passado: -am."}, {"enunciado": "Ontem eles ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["fazeram", "faziam", "fizeram", "farão", "fazem"], "certa": 2, "explicacao": "c) fizeram"}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "que brilha muito forte", "investigar com cuidado para descobrir a verdade", "que passa num instante", "onde é muito difícil viver"], "certa": 3, "explicacao": "d) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>bíceps</b> tem acento? Responda com a letra.", "alternativas": ["toda proparoxítona (a força na antepenúltima sílaba) tem acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "paroxítona terminada em ps leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona (força na última sílaba) terminada em a leva acento"], "certa": 2, "explicacao": "c) paroxítona terminada em ps leva acento (bí-ceps)."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["O vizinho cujas as ideias ganharam o prêmio veio à festa.", "A bicicleta onde ganhei é azul.", "A bicicleta que ganhei é azul.", "A professora cujo o cachorro fugiu veio à festa.", "A escritora que a mãe é médica veio à festa."], "certa": 2, "explicacao": "c) A bicicleta que ganhei é azul."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["apreensão · compreção · concessão", "emição · discussão · extensão", "colonizar · catalizar · frisar", "sintetizar · utilizar · realização", "pretensão · realizar · progreção"], "certa": 3, "explicacao": "d"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A festa será na sexta-feira.", "O submarino vai emergir e aparecer na superfície.", "O prazo foi cumprido à risca.", "O cachorro abanou a calda de alegria.", "Ao dormir, é preciso cerrar os olhos."], "certa": 3, "explicacao": "d) — o certo é “cauda” (rabo)."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["proveitoso, que dá bons resultados", "a razão que se dá para defender uma ideia", "que está em toda parte", "sem medo, destemido", "pálido, sem cor"], "certa": 3, "explicacao": "d) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém sabe por que Nina faltou à aula de Educação Física.", "Ninguém sabe por que Davi faltou à aula de Geografia.", "Ninguém sabe por que Bia faltou à aula de História.", "Lia faltou à aula de Arte por quê estava com febre.", "O experimento deu errado, e a turma inteira quis saber por quê."], "certa": 3, "explicacao": "d) — o certo é “Lia faltou à aula de Arte porque estava com febre.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Bia quer estudar mais para a prova de Arte.", "Theo tirou nota boa em Educação Física, mas achou a prova difícil.", "O ônibus para a excursão sai daqui a meia hora.", "Davi dormiu mal e chegou cansado à aula de Arte.", "Bia não sabe aonde deixou o mapa do zoológico."], "certa": 4, "explicacao": "e) o certo é “onde”"}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Responda às perguntas!", "Por que minhas tias escreveram uma carta?", "A professora de música viajou para a praia?", "Que dia lindo!", "O time de Felipe andou de bicicleta."], "certa": 4, "explicacao": "e) O time de Felipe andou de bicicleta."}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "aliviar, diminuir (uma dor, um problema)", "que não faz efeito", "tão bom que não dá para descrever com palavras", "caro, que custa muito"], "certa": 3, "explicacao": "d) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os alunos e a diretora abre a janela.", "Os alunos e a diretora abri a janela.", "Os alunos e a diretora abrimos a janela.", "Os alunos e a diretora abriu a janela.", "Os alunos e a diretora abriram a janela."], "certa": 4, "explicacao": "e) Os alunos e a diretora abriram a janela. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["É proibida a entrada de cachorros.", "Faz dez minutos que o ônibus passou.", "Houve um acidente na esquina.", "Tinha menas gente hoje.", "Houve duas festas no sábado."], "certa": 3, "explicacao": "d) — o certo é “menos”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo vai a piscina.", "Entreguei o presente a ela.", "Chegamos ao meio-dia.", "Aprendi a nadar.", "Ficaram frente a frente."], "certa": 0, "explicacao": "a) — o certo é “à piscina”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "“João comprou três frutas <span class=\"caixa\"></span> maçã, uva e banana.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto de interrogação", "vírgula", "ponto final", "dois-pontos", "reticências"], "certa": 3, "explicacao": "d) dois-pontos — vem uma lista."}, {"enunciado": "O que quer dizer <b>intrépido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se apaga", "corajoso, que não tem medo", "difícil e cansativo", "dizer o contrário do que se quer dizer, para criticar ou fazer rir", "que fala sem parar"], "certa": 1, "explicacao": "b) corajoso, que não tem medo. Não é “que fala sem parar”: essa é a pegadinha."}, {"enunciado": "Na frase “<b>Por que</b> Nina faltou à aula de Arte ontem?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "por isso", "por qual motivo", "por qual", "pois"], "certa": 2, "explicacao": "c) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Em qual frase há <b>personificação</b>? Responda com a letra.", "alternativas": ["Toc-toc! Era o carteiro.", "Aquela feira era um formigueiro.", "Tenho um milhão de coisas para fazer.", "A cidade acordou cedo.", "Ele ficou vermelho como um tomate."], "certa": 3, "explicacao": "d) A cidade acordou cedo."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
