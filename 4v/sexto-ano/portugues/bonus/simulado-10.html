<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>grande</b>? Responda com a letra.", "alternativas": ["difícil", "ausente", "feio", "pequeno", "comprido"], "certa": 3, "explicacao": "d) pequeno"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["mendigo · beneficência · prazerosa", "excessão · xícara · exceder", "iogurte · acessor · cuspir", "paralelepipedo · esquisito · seja", "irrequieto · bicabornato · cidadãos"], "certa": 0, "explicacao": "a"}, {"enunciado": "Por que a palavra <b>proíbe</b> tem acento? Responda com a letra.", "alternativas": ["i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "paroxítona terminada em ão ou ã leva acento", "paroxítona terminada em x leva acento", "paroxítona terminada em ps leva acento", "oxítona terminada em o leva acento"], "certa": 0, "explicacao": "a) i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento (pro-í-be)."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["farto, abundante", "que fala bem e convence", "que parece verdade, que poderia acontecer", "bem ligado, unido", "pouco, escasso"], "certa": 4, "explicacao": "e) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["bate-papo → bates-papo", "quebra-cabeça → quebras-cabeça", "segunda-feira → segunda-feiras", "segunda-feira → segundas-feira", "segunda-feira → segundas-feiras"], "certa": 4, "explicacao": "e) segunda-feira → segundas-feiras"}, {"enunciado": "Quem nasce na <b>Suíça</b> é… Responda com a letra.", "alternativas": ["cubano", "florianopolitano", "chinês", "teresinense", "suíço"], "certa": 4, "explicacao": "e) suíço"}, {"enunciado": "Ontem ele ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["queria", "quereu", "quer", "quererá", "quis"], "certa": 4, "explicacao": "e) quis"}, {"enunciado": "O que quer dizer <b>pôr lenha na fogueira</b>? Responda com a letra.", "alternativas": ["exagerar um problema pequeno", "piorar uma briga", "levar a culpa sozinho", "finalmente entender", "resolver duas coisas de uma vez"], "certa": 1, "explicacao": "b) piorar uma briga"}, {"enunciado": "O que quer dizer <b>persuadir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["convencer alguém a pensar ou fazer alguma coisa", "combinado sem precisar falar, subentendido", "verso improvisado na hora, cantado pelos repentistas do Nordeste", "seguir alguém escondido", "dizer o contrário do que se quer dizer, para criticar ou fazer rir"], "certa": 0, "explicacao": "a) convencer alguém a pensar ou fazer alguma coisa. Não é “seguir alguém escondido”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["Os alunos pediram <b>ajuda</b> ao vizinho.", "Minha prima leu <b>o livro</b>.", "Meu avô plantou <b>uma árvore</b>.", "O vizinho deu <b>um presente</b> à avó.", "Os alunos acreditam <b>na vitória</b>."], "certa": 4, "explicacao": "e) Os alunos acreditam <b>na vitória</b>."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["A artista fez a escultura.", "O incêndio será apagado pelos bombeiros.", "Meu pai consertou a bicicleta.", "O cachorro morde o osso.", "A chuva molhará as roupas."], "certa": 1, "explicacao": "b) O incêndio será apagado pelos bombeiros."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Trouxe o lápis para eu desenhar.", "Ela deu o recado para eu levar.", "Entre mim e você, tudo bem.", "O bolo é para mim.", "A professora trouxe o mapa para mim ler."], "certa": 4, "explicacao": "e) — o certo é “para eu ler”."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "urgente", "a razão que se dá para defender uma ideia", "que acontece fora de hora", "que está em toda parte"], "certa": 1, "explicacao": "b) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Em qual frase há <b>hipérbole</b>? Responda com a letra.", "alternativas": ["Miau! A gata queria entrar.", "Seus cabelos são macios como algodão.", "Já te falei mil vezes!", "A árvore chorou suas folhas.", "O pátio era um forno ao meio-dia."], "certa": 2, "explicacao": "c) Já te falei mil vezes!"}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Quem procurou a bola?", "Que dia lindo!", "As amigas de Lívia tocaram violão.", "Pinte um quadro.", "Como você cresceu!"], "certa": 0, "explicacao": "a) Quem procurou a bola?"}, {"enunciado": "“A girafa do zoológico olhou as estrelas.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["girafa", "as estrelas", "olhou as estrelas", "zoológico", "A girafa do zoológico"], "certa": 4, "explicacao": "e) A girafa do zoológico — cuidado: “girafa” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Volte cedo, porque amanhã tem aula.", "O bolo era bonito, contudo estava sem açúcar.", "Vamos à praia se fizer sol.", "O pneu furou, por isso chegamos atrasados.", "O gato pulou e derrubou o vaso."], "certa": 1, "explicacao": "b) O bolo era bonito, contudo estava sem açúcar."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["gênio, muito inteligente", "dizer o contrário do que se quer dizer, para criticar ou fazer rir", "esbanjador, que gasta demais", "texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "mínimo, o menor de todos"], "certa": 2, "explicacao": "c) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os alunos e a diretora une as peças.", "Os alunos e a diretora uni as peças.", "Os alunos e a diretora uniram as peças.", "Os alunos e a diretora unimos as peças.", "Os alunos e a diretora uniu as peças."], "certa": 2, "explicacao": "c) Os alunos e a diretora uniram as peças. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Eles riram muito.", "Vi muitos pássaros.", "As meninas estavam muito felizes.", "Choveu muito ontem.", "Ela corre muito rápido."], "certa": 1, "explicacao": "b) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["herois · voo · plateia", "creem · leem · magôo", "rainha · dêem · reúne", "caír · lençóis · ruim", "anzóis · campainha · saída"], "certa": 4, "explicacao": "e"}, {"enunciado": "Qual é o plural de <b>cristão</b>? Responda com a letra.", "alternativas": ["cristoes", "cristãoes", "cristões", "cristães", "cristãos"], "certa": 4, "explicacao": "e) cristãos — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>sagaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem sabor forte", "remédio para todos os males", "que passa num instante", "esperto, que percebe as coisas rápido", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 3, "explicacao": "d) esperto, que percebe as coisas rápido. Não é “que tem sabor forte”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["órfã", "herói", "saúde", "hífen", "baínha"], "certa": 4, "explicacao": "e) baínha — o certo é bainha: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Lívia, minha melhor amiga, chegou cedo.", "A girafa do zoológico, andou de bicicleta.", "Felipe, venha jantar!", "Comprei maçã, laranja e pera.", "São Paulo, 16 de outubro de 2026."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (A girafa do zoológico) do verbo com vírgula."}, {"enunciado": "“Felipe queria jogar, todavia estava com febre.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["caso", "contudo", "e", "logo", "pois"], "certa": 1, "explicacao": "b) contudo — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>trocadilho</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["brincadeira com palavras de som parecido ou de dois sentidos", "uma troca de figurinhas", "dos antepassados, muito antigo, passado de geração em geração", "respeito a quem pensa ou é diferente de nós", "muito esquisito, absurdo"], "certa": 0, "explicacao": "a) brincadeira com palavras de som parecido ou de dois sentidos. Não é “uma troca de figurinhas”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles venderão limonada.", "Na semana passada, eles pintaram um quadro.", "Ontem, eles sonharão com dragões.", "Hoje de manhã, eles decidiram o jogo.", "Ontem, eles falaram com a vovó."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["minimercado · re-educar · hiperativo", "contrarrevolução · vice-governador · ultrassecreto", "auto-afirmação · micro-ônibus · pré-natal", "super-interessante · pós-guerra · antiaderente", "super-atleta · ultrarresistente · semiárido"], "certa": 1, "explicacao": "b"}, {"enunciado": "“Kátia comprou três frutas <span class=\"caixa\"></span> uva, pera e maçã.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto de interrogação", "ponto final", "dois-pontos", "reticências", "vírgula"], "certa": 2, "explicacao": "c) dois-pontos — vem uma lista."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
