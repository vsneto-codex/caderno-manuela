<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>alto</b>? Responda com a letra.", "alternativas": ["ausente", "fim", "elevado", "baixo", "dormindo"], "certa": 3, "explicacao": "d) baixo — cuidado: “elevado” é sinônimo, não antônimo."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["mendigo · beneficência · prazerosa", "excessão · xícara · exceder", "iogurte · acessor · cuspir", "paralelepipedo · esquisito · seja", "irrequieto · bicabornato · cidadãos"], "certa": 0, "explicacao": "a"}, {"enunciado": "Por que a palavra <b>proíbe</b> tem acento? Responda com a letra.", "alternativas": ["i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "paroxítona terminada em ão ou ã leva acento", "paroxítona terminada em x leva acento", "paroxítona terminada em ps leva acento", "oxítona terminada em o leva acento"], "certa": 0, "explicacao": "a) i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento (pro-í-be)."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["farto, abundante", "que fala bem e convence", "que parece verdade, que poderia acontecer", "bem ligado, unido", "pouco, escasso"], "certa": 4, "explicacao": "e) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["batata-doce → batata-doces", "obra-prima → obras-prima", "porta-retrato → portas-retratos", "porta-retrato → portas-retrato", "porta-retrato → porta-retratos"], "certa": 4, "explicacao": "e) porta-retrato → porta-retratos"}, {"enunciado": "Quem nasce na <b>Bolívia</b> é… Responda com a letra.", "alternativas": ["capixaba", "suíço", "peruano", "boliviano", "paraense"], "certa": 3, "explicacao": "d) boliviano"}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["quero", "quererei", "queria", "quis", "queri"], "certa": 3, "explicacao": "d) quis"}, {"enunciado": "O que quer dizer <b>dar uma de João sem braço</b>? Responda com a letra.", "alternativas": ["fingir que não é com ele", "ajudar num aperto", "não reagir a nada", "contar um segredo", "estar distraído"], "certa": 0, "explicacao": "a) fingir que não é com ele"}, {"enunciado": "O que quer dizer <b>persuadir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["convencer alguém a pensar ou fazer alguma coisa", "que mostra os sentimentos com muita animação", "seguir alguém escondido", "brincadeira com palavras de som parecido ou de dois sentidos", "que parece verdade, que poderia acontecer"], "certa": 0, "explicacao": "a) convencer alguém a pensar ou fazer alguma coisa. Não é “seguir alguém escondido”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["O menino precisa <b>de ajuda</b>.", "Meu avô encontrou <b>a chave</b>.", "Os alunos comeram <b>a maçã</b>.", "As crianças lavaram <b>a louça</b>.", "A menina entregou <b>o livro</b> ao professor."], "certa": 0, "explicacao": "a) O menino precisa <b>de ajuda</b>."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["As cartas são entregadas pelo carteiro.", "A chuva molhará as roupas.", "O cachorro morde o osso.", "A prefeitura construirá a ponte.", "A artista fez a escultura."], "certa": 0, "explicacao": "a) As cartas são entregadas pelo carteiro."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Entre mim e você, tudo bem.", "Para mim, estudar à noite é melhor.", "O vovô trouxe o mapa para mim ver.", "Trouxe o lápis para eu desenhar."], "certa": 3, "explicacao": "d) — o certo é “para eu ver”."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "urgente", "a razão que se dá para defender uma ideia", "que acontece fora de hora", "que está em toda parte"], "certa": 1, "explicacao": "b) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Em qual frase há <b>metáfora</b>? Responda com a letra.", "alternativas": ["Esperei um século na fila.", "O sol se escondeu atrás das nuvens, envergonhado.", "Meu avô é uma enciclopédia.", "A menina era corajosa como uma leoa.", "Cocoricó! Amanheceu no sítio."], "certa": 2, "explicacao": "c) Meu avô é uma enciclopédia."}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["A girafa do zoológico nadou na piscina.", "Por que Manuela e Bianca sonharam com dragões?", "Que gol bonito!", "Quem uniu as peças?", "Guarde os brinquedos."], "certa": 4, "explicacao": "e) Guarde os brinquedos."}, {"enunciado": "“Os meninos da rua resistiram ao doce.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Os meninos da rua", "rua", "meninos", "ao doce", "resistiram ao doce"], "certa": 0, "explicacao": "a) Os meninos da rua — cuidado: “meninos” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["Esqueci o guarda-chuva, portanto fiquei molhado.", "Desligue a luz, já que vamos economizar energia.", "Eu te ajudo caso você peça.", "Felipe cantou e Bianca dançou.", "A sopa estava quente, mas comi rapidinho."], "certa": 3, "explicacao": "d) Felipe cantou e Bianca dançou."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dizer o contrário do que se quer dizer, para criticar ou fazer rir", "gênio, muito inteligente", "lento para entender", "esbanjador, que gasta demais", "defesa, elogio de uma ideia"], "certa": 3, "explicacao": "d) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["A vovó e o vovô mandamos uma mensagem.", "A vovó e o vovô mandei uma mensagem.", "A vovó e o vovô manda uma mensagem.", "A vovó e o vovô mandou uma mensagem.", "A vovó e o vovô mandaram uma mensagem."], "certa": 4, "explicacao": "e) A vovó e o vovô mandaram uma mensagem. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Ele tem muitos amigos.", "Eles riram muito.", "O cachorro late muito.", "As meninas estavam muito felizes.", "O filme era muito longo."], "certa": 0, "explicacao": "a) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["lençóis · creem · ruim", "caído · assembleia · herois", "magoo · viúva · lêem", "raínha · voo · deem", "bainha · cair · saude"], "certa": 0, "explicacao": "a"}, {"enunciado": "Qual é o plural de <b>verão</b>? Responda com a letra.", "alternativas": ["veroes", "verães", "verões", "verãos", "verãoes"], "certa": 2, "explicacao": "c) verões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>sagaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe as coisas rápido", "que faz tudo com muito cuidado e atenção aos detalhes", "que tem sabor forte", "resumido, dito em poucas palavras", "sem medo, destemido"], "certa": 0, "explicacao": "a) esperto, que percebe as coisas rápido. Não é “que tem sabor forte”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["lápis", "jóia", "ideia", "juiz", "países"], "certa": 1, "explicacao": "b) jóia — o certo é joia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Meu avô, trabalhou na horta.", "São Paulo, 16 de outubro de 2026.", "Ricardo, cuidado com o degrau!", "Ontem, choveu muito.", "Lívia, minha melhor amiga, chegou cedo."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Meu avô) do verbo com vírgula."}, {"enunciado": "“O dia estava nublado, contudo não choveu.”<br>Qual conjunção pode ficar no lugar de <b>contudo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["entretanto", "já que", "porque", "caso", "portanto"], "certa": 0, "explicacao": "a) entretanto — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>trocadilho</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["convencer alguém a pensar ou fazer alguma coisa", "comum, do dia a dia; sem importância", "brincadeira com palavras de som parecido ou de dois sentidos", "que produz muito", "uma troca de figurinhas"], "certa": 2, "explicacao": "c) brincadeira com palavras de som parecido ou de dois sentidos. Não é “uma troca de figurinhas”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles dançarão na quadrilha.", "Daqui a dois dias, eles lavarão o carro.", "Amanhã, eles compraram pão.", "Amanhã, eles aprenderão uma música nova.", "Daqui a dois dias, eles guardarão os brinquedos."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["contra-regra · neoliberal · ultrarrápido", "contraataque · contraindicação · ultraleve", "pré-histórico · vice-presidente · pós-graduação", "antiaderente · macrorregião · exdiretor", "extraterrestre · semi-integral · mega-operação"], "certa": 2, "explicacao": "c"}, {"enunciado": "“Júlia viu três animais <span class=\"caixa\"></span> girafa, tigre e leão.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto final", "dois-pontos", "vírgula", "reticências", "ponto de interrogação"], "certa": 1, "explicacao": "b) dois-pontos — vem uma lista."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
