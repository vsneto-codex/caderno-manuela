<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>chorar pelo leite derramado</b>? Responda com a letra.", "alternativas": ["estar distraído", "fazer com facilidade", "ficar muito surpreso", "agir de um jeito estranho", "lamentar o que não tem volta"], "certa": 4, "explicacao": "e) lamentar o que não tem volta"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O senso de 2022 contou a população do Brasil.", "Na meteorologia, querem prever o tempo de amanhã.", "A sessão de cinema começa às oito.", "Tomei um chá de camomila.", "O ladrão quis delatar o colega à polícia."], "certa": 0, "explicacao": "a) — o certo é “censo” (contagem da população)."}, {"enunciado": "Quem nasce na <b>Itália</b> é… Responda com a letra.", "alternativas": ["italiano", "mineiro", "argentino", "maceioense", "baiano"], "certa": 0, "explicacao": "a) italiano"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Queríamos ir à praia, mas choveu o fim de semana inteiro.", "Nina quer estudar mais para a prova de Arte.", "Davi quer estudar mais para a prova de Ciências.", "O museu fica há duas quadras da estação de metrô.", "Nina quer saber aonde o ônibus do museu vai levar a turma."], "certa": 3, "explicacao": "d) o certo é “a”"}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "que não tem habilidade", "mentira, golpe para enganar", "mínimo, o menor de todos", "excelente, muito habilidoso"], "certa": 4, "explicacao": "e) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Havia muitas estrelas no céu.", "Muitas pessoas vieram à festa.", "O cachorro late muito.", "Comprei muitos livros.", "Comemos muitos pastéis."], "certa": 2, "explicacao": "c) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Ontem eu ___ (verbo <b>desfazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["desfez", "desfazei", "desfiz", "desfazi", "desfazeru"], "certa": 2, "explicacao": "c) desfiz — desfazer segue fazer: eu fiz → eu desfiz."}, {"enunciado": "“Ele treinou todo dia, logo ganhou a corrida.”<br>Qual conjunção pode ficar no lugar de <b>logo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["pois", "já que", "e", "portanto", "porque"], "certa": 3, "explicacao": "d) portanto — as duas dão ideia de conclusão."}, {"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se nós quiséssemos ajuda, nós contaremos a novidade para todos.", "Se nós quisermos ajuda, nós contaríamos a novidade para todos.", "Se nós quisermos ajuda, nós contamos a novidade para todos.", "Se nós quisermos ajuda, nós contaremos a novidade para todos.", "Se nós quiséssemos ajuda, nós contamos a novidade para todos."], "certa": 3, "explicacao": "d) Se nós quisermos ajuda, nós contaremos a novidade para todos."}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "arrogância, ar de superioridade", "texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "um tipo de comida italiana", "ligado à vida simples e tranquila do campo"], "certa": 0, "explicacao": "a) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Ricardo e a irmã decidiram o jogo.", "Havia três gatos no telhado.", "Faz frio no inverno.", "Respondemos às perguntas.", "Felipe escutou música."], "certa": 0, "explicacao": "a) Ricardo e a irmã decidiram o jogo."}, {"enunciado": "“Fui ao cinema <b>com</b> a vovó.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["falta", "matéria", "causa", "lugar", "companhia"], "certa": 4, "explicacao": "e) companhia"}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Sonhe com dragões!", "Como você cresceu!", "As amigas de Lívia dançaram na quadrilha.", "Aprenda uma música nova!", "Quem bebeu suco?"], "certa": 2, "explicacao": "c) As amigas de Lívia dançaram na quadrilha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles comprarão pão.", "No ano que vem, eles limparam o quarto.", "Amanhã, eles comerão pizza.", "No ano que vem, eles falarão com a vovó.", "Na semana passada, eles receberam visitas."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "arrogância, ar de superioridade", "cuidadoso, precavido", "descuidado, que cai fácil em armadilhas", "excelente, muito habilidoso"], "certa": 3, "explicacao": "d) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "“Samuel escolheu três cores <span class=\"caixa\"></span> azul, laranja e verde.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto de interrogação", "reticências", "vírgula", "ponto final", "dois-pontos"], "certa": 4, "explicacao": "e) dois-pontos — vem uma lista."}, {"enunciado": "Na frase “Ninguém sabe <b>por que</b> Lia faltou à aula de Geografia.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual", "por qual motivo", "porém", "pois", "pelo qual / pela qual"], "certa": 1, "explicacao": "b) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Ontem ele ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trouxe", "trazia", "trará", "trazeu", "traz"], "certa": 0, "explicacao": "a) trouxe"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>dentro</b>? Responda com a letra.", "alternativas": ["morrer", "fora", "pequeno", "impossível", "molhado"], "certa": 1, "explicacao": "b) fora"}, {"enunciado": "O que quer dizer <b>inerte</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que entende tudo", "mínimo, o menor de todos", "preciso, feito com muito cuidado", "parado, sem movimento", "mentira, golpe para enganar"], "certa": 3, "explicacao": "d) parado, sem movimento. Não é “que entende tudo”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Bebi meia garrafa de água.", "Já é meio-dia e meia.", "Alice estava meio assustada.", "Helena ficou meia sonolenta.", "Comi meia pizza."], "certa": 3, "explicacao": "d) — o certo é “Helena ficou meio sonolenta”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Como se escreve <b>55º</b> por extenso? Responda com a letra.", "alternativas": ["quinquagésimo sexto", "quadragésimo quinto", "sexagésimo quinto", "cinquentésimo quinto", "quinquagésimo quinto"], "certa": 4, "explicacao": "e) quinquagésimo quinto"}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["perigoso, venenoso", "que se prepara antes, que se previne", "totalmente fechado; difícil de entender", "que dura muito, que não acaba", "que não faz mal, sem efeito"], "certa": 4, "explicacao": "e) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "“Manuela e Bianca limparam o quarto.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["o quarto", "Bianca", "Manuela, Bianca", "Manuela e Bianca", "limparam o quarto"], "certa": 3, "explicacao": "d) Manuela e Bianca — cuidado: “Manuela, Bianca” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Qual é o plural de <b>bênção</b>? Responda com a letra.", "alternativas": ["bênções", "bênçãoes", "bênçãos", "bênçoes", "bênçães"], "certa": 2, "explicacao": "c) bênçãos — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["O livro onde li é ótimo.", "O vizinho cuja bicicleta quebrou veio à festa.", "O menino que as ideias ganharam o prêmio veio à festa.", "A escritora que a avó faz bolos veio à festa.", "O menino cuja a mãe é médica veio à festa."], "certa": 1, "explicacao": "b) O vizinho cuja bicicleta quebrou veio à festa."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["Os cientistas descobrirão a vacina.", "A diretora recebe os pais.", "O carteiro entrega as cartas.", "A polícia prendeu os ladrões.", "O hino é tocado pela banda."], "certa": 4, "explicacao": "e) O hino é tocado pela banda."}, {"enunciado": "O que quer dizer <b>loquaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que é muito lento", "que fala muito e com facilidade", "esbanjador, que gasta demais", "a expressão dos sentimentos de quem fala no poema", "dispensar, não precisar de algo"], "certa": 1, "explicacao": "b) que fala muito e com facilidade. Não é “que é muito lento”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["O vizinho pintou <b>o muro</b>.", "Minha prima entregou <b>o livro</b> ao professor.", "Minha prima obedece <b>aos pais</b>.", "O vizinho plantou <b>uma árvore</b>.", "O vizinho comprou <b>o pão</b>."], "certa": 2, "explicacao": "c) Minha prima obedece <b>aos pais</b>."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Felipe, venha jantar!", "Felipe, cuidado com o degrau!", "O vizinho do lado, acordou cedo.", "Ontem, choveu muito.", "Otávio, o goleiro, chegou cedo."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (O vizinho do lado) do verbo com vírgula."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
