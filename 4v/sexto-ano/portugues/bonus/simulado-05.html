<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>estar com a corda toda</b>? Responda com a letra.", "alternativas": ["confiar totalmente", "acertar em cheio", "ficar muito surpreso", "lamentar o que não tem volta", "estar cheio de energia"], "certa": 4, "explicacao": "e) estar cheio de energia"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Os caçadores foram cassar na floresta.", "Na meteorologia, querem prever o tempo de amanhã.", "A sessão de cinema começa às oito.", "Tomei um chá de camomila.", "O ladrão quis delatar o colega à polícia."], "certa": 0, "explicacao": "a) — o certo é “caçar” (perseguir animal)."}, {"enunciado": "Quem nasce na <b>Itália</b> é… Responda com a letra.", "alternativas": ["italiano", "mineiro", "argentino", "maceioense", "baiano"], "certa": 0, "explicacao": "a) italiano"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Bia dormiu mal e chegou cansado à aula de Arte.", "Há muitas espécies de aves que só vivem na Mata Atlântica.", "Davi dormiu mal e chegou cansado à aula de História.", "Há duas semanas que Caio não vai ao museu.", "A duas semanas que Lia não vai ao zoológico."], "certa": 4, "explicacao": "e) o certo é “Há”"}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não tem habilidade", "confirmar, reforçar uma ideia", "preciso, feito com muito cuidado", "mentira, golpe para enganar", "excelente, muito habilidoso"], "certa": 4, "explicacao": "e) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["O filme era muito longo.", "Comprei muitos livros.", "Estudei muito ontem.", "Choveu muito ontem.", "A sopa estava muito quente."], "certa": 1, "explicacao": "b) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Ontem eu ___ (verbo <b>advir</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["adviu", "advim", "adviru", "advei", "advi"], "certa": 1, "explicacao": "b) advim — advir segue vir: eu vim → eu advim."}, {"enunciado": "“Choveu a noite toda, logo a rua alagou.”<br>Qual conjunção pode ficar no lugar de <b>logo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["já que", "todavia", "mas", "por isso", "e"], "certa": 3, "explicacao": "d) por isso — as duas dão ideia de conclusão."}, {"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se ela chegar cedo, ela mandaria uma mensagem para a avó.", "Se ela chegasse cedo, ela manda uma mensagem para a avó.", "Se ela chegar cedo, ela mandou uma mensagem para a avó.", "Se ela chegasse cedo, ela mandará uma mensagem para a avó.", "Se ela chegasse cedo, ela mandaria uma mensagem para a avó."], "certa": 4, "explicacao": "e) Se ela chegasse cedo, ela mandaria uma mensagem para a avó."}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "confusão, situação enrolada", "muito esquisito, absurdo", "resumido, dito em poucas palavras", "um tipo de comida italiana"], "certa": 1, "explicacao": "b) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Viajei para a praia.", "Ricardo e a irmã voltaram para casa.", "Faz frio no inverno.", "Ricardo e a irmã responderam às perguntas.", "A professora de música sonhou com dragões."], "certa": 0, "explicacao": "a) Viajei para a praia."}, {"enunciado": "“Lívia ficou na festa <b>até</b> as dez.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["falta", "matéria", "causa", "lugar", "tempo"], "certa": 4, "explicacao": "e) tempo"}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Sonhe com dragões!", "Como você cresceu!", "As amigas de Lívia dançaram na quadrilha.", "Aprenda uma música nova!", "Quem bebeu suco?"], "certa": 2, "explicacao": "c) As amigas de Lívia dançaram na quadrilha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles comprarão pão.", "No ano que vem, eles limparam o quarto.", "Amanhã, eles comerão pizza.", "No ano que vem, eles falarão com a vovó.", "Na semana passada, eles receberam visitas."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "arrogância, ar de superioridade", "cuidadoso, precavido", "descuidado, que cai fácil em armadilhas", "excelente, muito habilidoso"], "certa": 3, "explicacao": "d) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "“Alice viu três animais <span class=\"caixa\"></span> zebra, macaco e leão.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["dois-pontos", "ponto de interrogação", "vírgula", "ponto final", "reticências"], "certa": 0, "explicacao": "a) dois-pontos — vem uma lista."}, {"enunciado": "Na frase “Ninguém sabe <b>por que</b> Lia faltou à aula de Ciências.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por isso", "porém", "pelo qual / pela qual", "por qual motivo", "pois"], "certa": 3, "explicacao": "d) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["caberam", "cabiam", "cabem", "couberam", "caberão"], "certa": 3, "explicacao": "d) couberam"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>aberto</b>? Responda com a letra.", "alternativas": ["fechado", "descer", "escuro", "silêncio", "difícil"], "certa": 0, "explicacao": "a) fechado"}, {"enunciado": "O que quer dizer <b>inerte</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["parado, sem movimento", "que entende tudo", "sem nenhum machucado, ileso", "muito diferente, desigual", "isca, armadilha para enganar"], "certa": 0, "explicacao": "a) parado, sem movimento. Não é “que entende tudo”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["As portas estavam meio abertas.", "A professora ficou meia assustada.", "Clara estava meio nervosa.", "Bebi meia garrafa de água.", "Já é meio-dia e meia."], "certa": 1, "explicacao": "b) — o certo é “A professora ficou meio assustada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Como se escreve <b>70º</b> por extenso? Responda com a letra.", "alternativas": ["setentésimo", "sexagésimo", "septuagésimo", "septuagésimo primeiro", "octogésimo"], "certa": 2, "explicacao": "c) septuagésimo"}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "breve e direto", "vencer, controlar (um incêndio, uma crise)", "oportunidade, ocasião", "perigoso, venenoso"], "certa": 0, "explicacao": "a) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "“As amigas de Lívia resistiram ao doce.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["resistiram ao doce", "amigas", "As amigas de Lívia", "ao doce", "Lívia"], "certa": 2, "explicacao": "c) As amigas de Lívia — cuidado: “amigas” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Qual é o plural de <b>cão</b>? Responda com a letra.", "alternativas": ["cães", "cãos", "cões", "cãoes", "coes"], "certa": 0, "explicacao": "a) cães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["O aluno que o cachorro fugiu veio à festa.", "O bolo onde você fez acabou.", "A menina que as ideias ganharam o prêmio veio à festa.", "O vizinho cujas ideias ganharam o prêmio veio à festa.", "O jogo onde comprei é de estratégia."], "certa": 3, "explicacao": "d) O vizinho cujas ideias ganharam o prêmio veio à festa."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O suco foi servido pelo garçom.", "O mecânico troca o pneu.", "Os bombeiros apagam o incêndio.", "Os vizinhos organizam a festa.", "A cozinheira prepara o almoço."], "certa": 0, "explicacao": "a) O suco foi servido pelo garçom."}, {"enunciado": "O que quer dizer <b>loquaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito pequeno, escasso", "mentira, golpe para enganar", "que é muito lento", "defesa, elogio de uma ideia", "que fala muito e com facilidade"], "certa": 4, "explicacao": "e) que fala muito e com facilidade. Não é “que é muito lento”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["A professora arrumou <b>a mochila</b>.", "Minha prima entregou <b>o livro</b> ao professor.", "Meu avô acredita <b>na vitória</b>.", "Os alunos escreveram <b>uma carta</b>.", "O vizinho esqueceu <b>o guarda-chuva</b>."], "certa": 2, "explicacao": "c) Meu avô acredita <b>na vitória</b>."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio, varreu o quintal.", "Dona Lúcia, a vizinha, chegou cedo.", "São Paulo, 16 de outubro de 2026.", "Manuela, cuidado com o degrau!", "Manuela, venha jantar!"], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (O irmão mais velho de Otávio) do verbo com vírgula."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
