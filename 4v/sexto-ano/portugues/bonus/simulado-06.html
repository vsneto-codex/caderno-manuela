<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se eu trouxer o lanche, eu ficaria muito feliz.", "Se eu trouxer o lanche, eu ficarei muito feliz.", "Se eu trouxer o lanche, eu fiquei muito feliz.", "Se eu trouxesse o lanche, eu ficarei muito feliz.", "Se eu trouxesse o lanche, eu fico muito feliz."], "certa": 1, "explicacao": "b) Se eu trouxer o lanche, eu ficarei muito feliz."}, {"enunciado": "Ontem eu ___ (verbo <b>propor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["propus", "proponhei", "propôs", "propori", "propi"], "certa": 0, "explicacao": "a) propus — propor segue pôr: eu pus → eu propus."}, {"enunciado": "“A ponte caiu, por isso tivemos de voltar.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["e", "caso", "mas", "portanto", "porque"], "certa": 3, "explicacao": "d) portanto — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito educado e gentil", "inconveniente; fora do assunto", "confirmar, reforçar uma ideia", "a sequência dos acontecimentos de uma história", "novato, iniciante"], "certa": 1, "explicacao": "b) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>régua</b> tem acento? Responda com a letra.", "alternativas": ["éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "oxítona (força na última sílaba) terminada em a leva acento", "paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento", "oxítona terminada em o leva acento"], "certa": 3, "explicacao": "d) paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento (ré-gua)."}, {"enunciado": "Na frase «A planta murchou <b>porque</b> ninguém a regou.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["quando", "visto que", "portanto", "se", "mas"], "certa": 1, "explicacao": "b) visto que"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>noite</b>? Responda com a letra.", "alternativas": ["anoitecer", "pernoite", "noitada", "noturno", "notícia"], "certa": 4, "explicacao": "e) notícia — parece, mas não vem de “noite”."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Ventou forte a noite toda.", "Mostrei o desenho.", "Os alunos e a diretora escutaram música.", "Ricardo e a irmã jogaram bola.", "Os primos de Ricardo aprenderam uma música nova."], "certa": 1, "explicacao": "b) Mostrei o desenho."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "que não se apaga", "fácil de apagar", "intenso, enérgico", "convencer alguém a pensar ou fazer alguma coisa"], "certa": 1, "explicacao": "b) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["poderei", "pude", "podia", "posso", "podi"], "certa": 1, "explicacao": "b) pude"}, {"enunciado": "O que quer dizer <b>ficar de molho</b>? Responda com a letra.", "alternativas": ["falar demais", "admitir que errou", "fazer com facilidade", "descansar para se recuperar", "lamentar o que não tem volta"], "certa": 3, "explicacao": "d) descansar para se recuperar"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["O cachorro e o gato manda uma mensagem.", "O cachorro e o gato mandei uma mensagem.", "O cachorro e o gato mandou uma mensagem.", "O cachorro e o gato mandaram uma mensagem.", "O cachorro e o gato mandamos uma mensagem."], "certa": 3, "explicacao": "d) O cachorro e o gato mandaram uma mensagem. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que causa tempestade", "caro, que custa muito", "que acontece fora de hora", "feito com muito cuidado, prestando atenção a cada detalhe", "o público que assiste a um espetáculo"], "certa": 2, "explicacao": "c) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui a farmácia.", "Vire à esquerda.", "Falei a pessoas da fila.", "Viajei a Roma e à Itália.", "Chegamos ao meio-dia."], "certa": 0, "explicacao": "a) — o certo é “à farmácia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Quem nasce na <b>Espanha</b> é… Responda com a letra.", "alternativas": ["cuiabano", "potiguar", "espanhol", "porto-alegrense", "sergipano"], "certa": 2, "explicacao": "c) espanhol"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["idealizar · suavizar · fiscalisar", "humanisar · percussão · bisar", "analizar · modernizar · pretensão", "realizasão · impressão · inversão", "agressão · memorizar · diversão"], "certa": 4, "explicacao": "e"}, {"enunciado": "Qual é o plural de <b>vulcão</b>? Responda com a letra.", "alternativas": ["vulcães", "vulcãoes", "vulcões", "vulcoes", "vulcãos"], "certa": 2, "explicacao": "c) vulcões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>ironia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não deixa dúvida, claríssimo", "investigar com cuidado para descobrir a verdade", "sem medo, destemido", "dizer o contrário do que se quer dizer, para criticar ou fazer rir", "um metal muito duro"], "certa": 3, "explicacao": "d) dizer o contrário do que se quer dizer, para criticar ou fazer rir. Não é “um metal muito duro”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Vamos no clube amanhã.", "Os alunos chegaram ao museu cedo.", "Prefiro mais suco do que refrigerante.", "Vamos no parque amanhã.", "Assistimos o jogo juntos."], "certa": 1, "explicacao": "b) Os alunos chegaram ao museu cedo."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Theo não sabe aonde deixou o mapa do parque estadual.", "Bia dormiu mal e chegou cansado à aula de Ciências.", "Lia não sabe onde deixou o mapa do museu.", "Theo dormiu mal e chegou cansado à aula de Arte.", "Caio guardou mal a garrafa de água e não acha mais."], "certa": 0, "explicacao": "a) o certo é “onde”"}, {"enunciado": "“Ricardo e a irmã abriram a janela.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["irmã", "abriram a janela", "Ricardo, irmã", "a janela", "Ricardo e a irmã"], "certa": 4, "explicacao": "e) Ricardo e a irmã — cuidado: “Ricardo, irmã” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["guarda-chuva → guarda-chuvas", "guarda-chuva → guardas-chuvas", "ex-aluno → exs-aluno", "guarda-noturno → guardas-noturno", "guarda-chuva → guardas-chuva"], "certa": 0, "explicacao": "a) guarda-chuva → guarda-chuvas"}, {"enunciado": "O que quer dizer <b>meticuloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem medo de tudo", "urgente", "isca, armadilha para enganar", "que faz tudo com muito cuidado e atenção aos detalhes", "desonesto; ou trabalho cansativo demais"], "certa": 3, "explicacao": "d) que faz tudo com muito cuidado e atenção aos detalhes. Não é “que tem medo de tudo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Felipe dormiu muito.", "Comprei muitos livros.", "A sopa estava muito quente.", "O bolo estava muito gostoso.", "A prova foi muito fácil."], "certa": 1, "explicacao": "b) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Os caçadores foram caçar na floresta.", "O imigrante chegou ao Brasil vindo da Itália.", "O cabelo dela é cumprido e liso.", "A letra estava ilegível: ninguém entendia.", "O prazo foi cumprido à risca."], "certa": 2, "explicacao": "c) — o certo é “comprido” (longo)."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["problema · ansiedade · expectativa", "adivinhar · pesquiza · caranguejo", "mexerica · prazeirosa · frustrado", "ansioso · espontâneo · beneficiente", "frustração · estupidez · sugeira"], "certa": 0, "explicacao": "a"}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mentira, golpe para enganar", "esperto, que entende rápido", "urgente", "lento para entender", "que acontece fora de hora"], "certa": 3, "explicacao": "d) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>lembrar</b>? Responda com a letra.", "alternativas": ["recordar", "esquecer", "terminar", "agitado", "partir"], "certa": 1, "explicacao": "b) esquecer — cuidado: “recordar” é sinônimo, não antônimo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["Precisamos de menas pessoas.", "Houve muitos problemas na viagem.", "Faz uma semana que ele viajou.", "É proibida a pesca neste lago.", "Há muitos livros na estante."], "certa": 0, "explicacao": "a) — o certo é “menos”."}, {"enunciado": "“Igor viu três animais <span class=\"caixa\"></span> macaco, girafa e elefante.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["dois-pontos", "reticências", "ponto de interrogação", "ponto final", "vírgula"], "certa": 0, "explicacao": "a) dois-pontos — vem uma lista."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
