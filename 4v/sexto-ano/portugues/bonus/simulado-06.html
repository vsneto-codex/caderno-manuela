<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se eu trouxer o lanche, eu ficaria muito feliz.", "Se eu trouxer o lanche, eu ficarei muito feliz.", "Se eu trouxer o lanche, eu fiquei muito feliz.", "Se eu trouxesse o lanche, eu ficarei muito feliz.", "Se eu trouxesse o lanche, eu fico muito feliz."], "certa": 1, "explicacao": "b) Se eu trouxer o lanche, eu ficarei muito feliz."}, {"enunciado": "Ontem eu ___ (verbo <b>propor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["propus", "proponhei", "propôs", "propori", "propi"], "certa": 0, "explicacao": "a) propus — propor segue pôr: eu pus → eu propus."}, {"enunciado": "“Plantamos a semente, por isso nasceu uma árvore.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["e", "porque", "mas", "logo", "caso"], "certa": 3, "explicacao": "d) logo — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "inconveniente; fora do assunto", "muito educado e gentil", "comum, do dia a dia; sem importância", "que vem da experiência, da observação"], "certa": 1, "explicacao": "b) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>pirâmide</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em us leva acento", "oxítona terminada em em ou ens leva acento", "paroxítona terminada em r leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "paroxítona terminada em x leva acento"], "certa": 3, "explicacao": "d) toda proparoxítona (a força na antepenúltima sílaba) tem acento (pi-râ-mi-de)."}, {"enunciado": "Na frase «O bolo ficou bonito, <b>porém</b> estava sem açúcar.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["entretanto", "se", "conforme", "portanto", "para que"], "certa": 0, "explicacao": "a) entretanto"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>leite</b>? Responda com a letra.", "alternativas": ["leitoso", "leiteira", "leitura", "laticínio", "leiteiro"], "certa": 2, "explicacao": "c) leitura — parece, mas não vem de “leite”."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["As amigas de Lívia estudaram para a prova.", "Faz muito calor no verão.", "Havia um bilhete na mesa.", "Mostrei o desenho.", "Os alunos e a diretora varreram o quintal."], "certa": 4, "explicacao": "e) Os alunos e a diretora varreram o quintal."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "que não se apaga", "intenso, enérgico", "rigoroso e sem luxo", "fácil de apagar"], "certa": 1, "explicacao": "b) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["diziam", "dizeram", "dirão", "disseram", "dizem"], "certa": 3, "explicacao": "d) disseram"}, {"enunciado": "O que quer dizer <b>ter um parafuso a menos</b>? Responda com a letra.", "alternativas": ["implicar com alguém", "não gostar de gastar dinheiro", "fingir que não é com ele", "lembrar de tudo", "agir de um jeito estranho"], "certa": 4, "explicacao": "e) agir de um jeito estranho"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["A vovó e o vovô procura a bola.", "A vovó e o vovô procurou a bola.", "A vovó e o vovô procurei a bola.", "A vovó e o vovô procuramos a bola.", "A vovó e o vovô procuraram a bola."], "certa": 4, "explicacao": "e) A vovó e o vovô procuraram a bola. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "nunca visto antes, extraordinário", "que causa tempestade", "que acontece fora de hora", "incomum, surpreendente"], "certa": 3, "explicacao": "d) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos às oito horas.", "Vou à Bahia.", "Fui ao clube e à piscina.", "Entreguei o bilhete a médica.", "Aprendi a nadar."], "certa": 3, "explicacao": "d) — o certo é “à médica”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Quem nasce no <b>Egito</b> é… Responda com a letra.", "alternativas": ["curitibano", "peruano", "egípcio", "recifense", "uruguaio"], "certa": 2, "explicacao": "c) egípcio"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["inversão · discussão · utilisar", "humanizar · omissão · idealisar", "suavizar · fiscalizar · percussão", "harmonisar · bisar · analisar", "pretensão · legalisar · realização"], "certa": 2, "explicacao": "c"}, {"enunciado": "Qual é o plural de <b>bênção</b>? Responda com a letra.", "alternativas": ["bênçães", "bênçãoes", "bênções", "bênçãos", "bênçoes"], "certa": 3, "explicacao": "d) bênçãos — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>ironia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dizer o contrário do que se quer dizer, para criticar ou fazer rir", "que produz muito", "que dá para acreditar, razoável", "um metal muito duro", "sem medo, destemido"], "certa": 0, "explicacao": "a) dizer o contrário do que se quer dizer, para criticar ou fazer rir. Não é “um metal muito duro”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Fui ao mercado comprar pão.", "Os alunos obedecem as regras.", "Assistimos o jogo juntos.", "Ela namora com o Pedro.", "Cheguei na escola atrasado."], "certa": 0, "explicacao": "a) Fui ao mercado comprar pão."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Lia dormiu mal e chegou cansado à aula de Ciências.", "Theo quer estudar mais para a prova de História.", "Caio dormiu mal e chegou cansado à aula de Arte.", "Theo guardou mal o livro e não acha mais.", "Caio guardou mau a garrafa de água e não acha mais."], "certa": 4, "explicacao": "e) o certo é “mal”"}, {"enunciado": "“Os meninos da rua voltaram para casa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Os meninos da rua", "voltaram para casa", "meninos", "para casa", "rua"], "certa": 0, "explicacao": "a) Os meninos da rua — cuidado: “meninos” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["abaixo-assinado → abaixos-assinados", "quebra-cabeça → quebras-cabeça", "cachorro-quente → cachorros-quente", "cachorro-quente → cachorros-quentes", "cachorro-quente → cachorro-quentes"], "certa": 3, "explicacao": "d) cachorro-quente → cachorros-quentes"}, {"enunciado": "O que quer dizer <b>meticuloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que faz tudo com muito cuidado e atenção aos detalhes", "a sequência dos acontecimentos de uma história", "nunca visto antes, extraordinário", "que tem medo de tudo", "firme e calmo diante do sofrimento"], "certa": 0, "explicacao": "a) que faz tudo com muito cuidado e atenção aos detalhes. Não é “que tem medo de tudo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["As meninas estavam muito felizes.", "Muitas pessoas vieram à festa.", "O filme era muito longo.", "Manuela canta muito bem.", "Ela corre muito rápido."], "certa": 1, "explicacao": "b) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A chuva era iminente: o céu escureceu.", "Esqueci o acento da palavra “avó”.", "O cavalheiro montou o cavalo e partiu.", "A inflação deixou tudo mais caro no mercado.", "Dei um laço no presente."], "certa": 2, "explicacao": "c) — o certo é “cavaleiro” (quem anda a cavalo)."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["depedrar · bicarbonato · cabeleireiro", "estrangeiro · espectativa · salsicha", "adivinhar · previlégio · ideia", "mortadela · mixirica · assessor", "prazerosa · enxaqueca · espontâneo"], "certa": 4, "explicacao": "e"}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que entende rápido", "incomum, surpreendente", "lento para entender", "espantado, sem reação", "o público que assiste a um espetáculo"], "certa": 2, "explicacao": "c) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>forte</b>? Responda com a letra.", "alternativas": ["molhado", "partir", "sujo", "robusto", "fraco"], "certa": 4, "explicacao": "e) fraco — cuidado: “robusto” é sinônimo, não antônimo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["É proibido entrar.", "É proibida a entrada de cachorros.", "Faz dois anos que moro aqui.", "Faz dez minutos que o ônibus passou.", "Houveram muitos problemas na viagem."], "certa": 4, "explicacao": "e) — o certo é “Houve”."}, {"enunciado": "“Beatriz escolheu três cores <span class=\"caixa\"></span> azul, amarelo e laranja.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["vírgula", "ponto de interrogação", "ponto final", "dois-pontos", "reticências"], "certa": 3, "explicacao": "d) dois-pontos — vem uma lista."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
