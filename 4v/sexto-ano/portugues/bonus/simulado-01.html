<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>sagrado</b>? Responda com a letra.", "alternativas": ["sacrérrimo", "amabilíssimo", "sacratíssimo", "sagradérrimo", "tristíssimo"], "certa": 2, "explicacao": "c) sacratíssimo"}, {"enunciado": "Em qual alternativa há um período composto por orações coordenadas <b>sem conjunção</b>, separadas só por vírgula? Responda com a letra.", "alternativas": ["O carteiro parou a moto e tocou a campainha.", "O carteiro parou a moto.", "O goleiro correu, pulou, defendeu a bola.", "O carteiro parou a moto, mas não tocou a campainha.", "Parabéns pela vitória!"], "certa": 2, "explicacao": "c) O goleiro correu, pulou, defendeu a bola."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fiz uma visita àquele museu.", "Cheguei a quadra.", "Entreguei o presente a ela.", "Passeamos a cavalo.", "Vire à esquerda."], "certa": 1, "explicacao": "b) — o certo é “à quadra”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["remédio para todos os males", "que discute e argumenta demais", "que fala muito e com facilidade", "esperto, que percebe tudo rápido", "desonesto; ou trabalho cansativo demais"], "certa": 3, "explicacao": "d) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Nina faltou à aula de Educação Física por que?", "A cientista descobriu por que as abelhas estão sumindo das cidades.", "Por que motivo a festa junina mudou de data este ano?", "Ninguém sabe por que Bia faltou à aula de História.", "Não sei por que o computador da sala desliga sozinho toda tarde."], "certa": 0, "explicacao": "a) — o certo é “Nina faltou à aula de Educação Física por quê?”: está no fim da frase, logo antes do ponto: aí ganha acento."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["autoafirmação · coautor · superhomem", "subsolo · auto-ajuda · antissocial", "subtítulo · autoobservação · megaloja", "hiper-resistente · vice-presidente · anti-aéreo", "ex-diretor · ultravioleta · ultrassecreto"], "certa": 4, "explicacao": "e"}, {"enunciado": "Em qual frase há <b>hipérbole</b>? Responda com a letra.", "alternativas": ["Vrum! O carro passou rápido.", "Choramos rios de saudade.", "O rio cantava baixinho.", "Aquela professora é um anjo.", "O gato é leve como uma pluma."], "certa": 1, "explicacao": "b) Choramos rios de saudade."}, {"enunciado": "Em qual frase o sujeito é <b>simples</b>? Responda com a letra.", "alternativas": ["Corri no parque.", "Ventou forte a noite toda.", "Trovejou e relampejou.", "Manuela e Bianca nadaram na piscina.", "A turma do quinto ano jogou bola."], "certa": 4, "explicacao": "e) A turma do quinto ano jogou bola."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "pedir algo a que se tem direito", "triste, melancólico", "muito esquisito, absurdo", "grosseiro, muito grave (um erro)"], "certa": 0, "explicacao": "a) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>chorar pelo leite derramado</b>? Responda com a letra.", "alternativas": ["fazer as coisas fora de ordem", "vigiar", "contar um segredo", "ficar muito bravo", "lamentar o que não tem volta"], "certa": 4, "explicacao": "e) lamentar o que não tem volta"}, {"enunciado": "“— Eu vou visitar a vovó amanhã — avisou Manuela.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Manuela avisou que ia visitar a vovó amanhã.", "Manuela avisou que eu ia visitar a vovó no dia seguinte.", "Manuela avisou que vai visitar a vovó amanhã.", "Manuela avisou que ia visitar a vovó no dia seguinte.", "Manuela avisou que eu vou visitar a vovó amanhã."], "certa": 3, "explicacao": "d) Manuela avisou que ia visitar a vovó no dia seguinte."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ele tem um ótimo senso de humor.", "A chuva era iminente: o céu escureceu.", "O imigrante saiu de Portugal para morar no Brasil.", "A cesta de piquenique estava cheia de frutas.", "Paguei a conta com um cheque."], "certa": 2, "explicacao": "c) — o certo é “emigrante” (quem sai do país)."}, {"enunciado": "Na frase “Nina faltou à aula de Educação Física <b>porque</b> estava com febre.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "por qual motivo", "pois", "o motivo", "por isso"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>corriqueiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "oportunidade, ocasião", "que corre muito", "dispensar, não precisar de algo", "comum, que acontece todo dia"], "certa": 4, "explicacao": "e) comum, que acontece todo dia. Não é “que corre muito”: essa é a pegadinha."}, {"enunciado": "Ontem ele ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizia", "dirá", "diz", "dizeu", "disse"], "certa": 4, "explicacao": "e) disse"}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Que gol bonito!", "Por que as crianças da escola discutiram o assunto?", "Como você cresceu!", "Plante uma árvore!", "Os meninos da rua estudaram para a prova."], "certa": 1, "explicacao": "b) Por que as crianças da escola discutiram o assunto?"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["heroico · hotéis · traido", "caracóis · estreia · idéia", "joia · ruim · saude", "raiz · tainha · saída", "lençóis · sauva · campainha"], "certa": 3, "explicacao": "d"}, {"enunciado": "O que quer dizer <b>díspar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "muito diferente, desigual", "que dura pouco tempo", "tão bom que não dá para descrever com palavras", "que dispara rápido"], "certa": 1, "explicacao": "b) muito diferente, desigual. Não é “que dispara rápido”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Cheguei na rodoviária atrasado.", "Prefiro verão a inverno.", "Fui no mercado comprar pão.", "Vamos na feira amanhã.", "Vamos na praia amanhã."], "certa": 1, "explicacao": "b) Prefiro verão a inverno."}, {"enunciado": "Quem nasce em <b>João Pessoa</b> é… Responda com a letra.", "alternativas": ["maceioense", "goiano", "russo", "pessoense", "paulistano"], "certa": 3, "explicacao": "d) pessoense"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["O gato pulou e derrubou o vaso.", "A ponte caiu, por isso tivemos de voltar.", "O bolo era bonito, entretanto estava sem açúcar.", "Não fui à aula, já que estava com febre.", "Vamos à praia caso faça sol."], "certa": 3, "explicacao": "d) Não fui à aula, já que estava com febre."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["A menina pintou <b>o muro</b>.", "O menino entregou <b>o livro</b> ao professor.", "O vizinho arrumou <b>a mochila</b>.", "As crianças acreditam <b>na vitória</b>.", "Os alunos pediram <b>ajuda</b> ao vizinho."], "certa": 3, "explicacao": "d) As crianças acreditam <b>na vitória</b>."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pena, compaixão pelos outros", "aliviar, diminuir (uma dor, um problema)", "que faz tudo com muito cuidado e atenção aos detalhes", "arrogância, ar de superioridade", "que não se apaga"], "certa": 3, "explicacao": "d) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se nós comprássemos o ingresso, nós mandamos uma mensagem para a avó.", "Se nós comprássemos o ingresso, nós mandaríamos uma mensagem para a avó.", "Se nós comprarmos o ingresso, nós mandamos uma mensagem para a avó.", "Se nós comprássemos o ingresso, nós mandaremos uma mensagem para a avó.", "Se nós comprarmos o ingresso, nós mandaríamos uma mensagem para a avó."], "certa": 1, "explicacao": "b) Se nós comprássemos o ingresso, nós mandaríamos uma mensagem para a avó."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>flor</b>? Responda com a letra.", "alternativas": ["florido", "florescer", "floresta", "flúor", "florista"], "certa": 3, "explicacao": "d) flúor — parece, mas não vem de “flor”."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["A bibliotecária guarda os livros.", "O juiz anulou o gol.", "O pneu é trocado pelo mecânico.", "Minha avó costurará os vestidos.", "O carteiro entrega as cartas."], "certa": 2, "explicacao": "c) O pneu é trocado pelo mecânico."}, {"enunciado": "O que quer dizer <b>estapafúrdio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "muito esquisito, absurdo", "no teatro, a indicação entre parênteses de lugar, gesto ou tom de voz", "muito apressado", "que vem da experiência, da observação"], "certa": 1, "explicacao": "b) muito esquisito, absurdo. Não é “muito apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A menina cujo cachorro fugiu veio à festa.", "A professora cujos os primos vieram de longe veio à festa.", "O menino cuja a bicicleta quebrou veio à festa.", "O aluno que a mãe é médica veio à festa.", "A professora cuja a mãe é médica veio à festa."], "certa": 0, "explicacao": "a) A menina cujo cachorro fugiu veio à festa."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo, meu primo, chegou cedo.", "Comprei manga, banana e maçã.", "Manuela e Bianca, mostraram o desenho.", "Ontem, choveu muito.", "Bianca, cuidado com o degrau!"], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O vovô trouxe o mapa para mim ver.", "Ela deu o recado para eu levar.", "Para mim, estudar à noite é melhor.", "O bolo é para mim.", "Trouxe o lápis para eu desenhar."], "certa": 0, "explicacao": "a) — o certo é “para eu ver”."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
