<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>ágil</b>? Responda com a letra.", "alternativas": ["agilérrimo", "ótimo", "agílimo", "sacratíssimo", "dificílimo"], "certa": 2, "explicacao": "c) agílimo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Às vezes, durmo à tarde.", "Viajei a Roma e à Itália.", "Vou à Bahia.", "Ricardo vai a floresta.", "Fui ao clube e à piscina."], "certa": 3, "explicacao": "d) — o certo é “à floresta”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "isca, armadilha para enganar", "sem medo, destemido", "que discute e argumenta demais", "dos antepassados, muito antigo, passado de geração em geração"], "certa": 0, "explicacao": "a) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém sabe por que Nina faltou à aula de História.", "Ninguém sabe por que Lia faltou à aula de Ciências.", "Os vizinhos reclamaram do barulho e ninguém entendeu por quê.", "Ninguém sabe por que Bia faltou à aula de Arte.", "Bia faltou à aula de Educação Física por que?"], "certa": 4, "explicacao": "e) — o certo é “Bia faltou à aula de Educação Física por quê?”: está no fim da frase, logo antes do ponto: aí ganha acento."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["mega-loja · ultravioleta · supermercado", "infravermelho · super-homem · antiherói", "super-resistente · contra-mão · hiperativo", "antiaéreo · auto-observação · anti-horário", "ultraleve · semi-círculo · neoliberal"], "certa": 3, "explicacao": "d"}, {"enunciado": "Em qual frase há <b>comparação</b>? Responda com a letra.", "alternativas": ["O vento cantava na janela.", "Tenho um milhão de coisas para fazer.", "Ele nada feito um peixe.", "Meu coração é um tambor.", "Au-au! O cachorro recebeu a família."], "certa": 2, "explicacao": "c) Ele nada feito um peixe."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["A turma do quinto ano comprou pão.", "Anoiteceu cedo.", "O cachorro e o gato viajaram para a praia.", "Cantei na festa.", "Olhei as estrelas."], "certa": 2, "explicacao": "c) O cachorro e o gato viajaram para a praia."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que julga com cuidado, seguindo regras claras", "ligado à vida simples e tranquila do campo", "esforço, vontade forte de fazer algo", "firme e calmo diante do sofrimento", "triste, melancólico"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>dormir no ponto</b>? Responda com a letra.", "alternativas": ["passar por muita dificuldade", "aguentar algo ruim calado", "contar um segredo", "perder a chance por distração", "ficar muito bravo"], "certa": 3, "explicacao": "d) perder a chance por distração"}, {"enunciado": "“— Eu adoro dinossauros aqui — respondeu Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo respondeu que eu adoro dinossauros aqui.", "Ricardo respondeu que adora dinossauros aqui.", "Ricardo respondeu que eu adorava dinossauros ali.", "Ricardo respondeu que adorava dinossauros aqui.", "Ricardo respondeu que adorava dinossauros ali."], "certa": 4, "explicacao": "e) Ricardo respondeu que adorava dinossauros ali."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A cesta de piquenique estava cheia de frutas.", "O mergulhador vai imergir no mar profundo.", "O emigrante chegou ao Brasil vindo da Itália.", "É perigoso acender fogo dentro de casa.", "Na meteorologia, querem prever o tempo de amanhã."], "certa": 2, "explicacao": "c) — o certo é “imigrante” (quem entra no país)."}, {"enunciado": "Na frase “A excursão ao planetário foi cancelada <b>porque</b> o ônibus quebrou.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "por isso", "o motivo", "motivo para", "pelo qual / pela qual"], "certa": 0, "explicacao": "a) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>corriqueiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["comum, que acontece todo dia", "que corre muito", "ligado à vida simples e tranquila do campo", "isca, armadilha para enganar", "a sequência dos acontecimentos de uma história"], "certa": 0, "explicacao": "a) comum, que acontece todo dia. Não é “que corre muito”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["terei", "tinha", "tenho", "tive", "ti"], "certa": 3, "explicacao": "d) tive"}, {"enunciado": "Qual destas frases é <b>exclamativa</b>? Responda com a letra.", "alternativas": ["Por que Felipe estudou para a prova?", "Que bolo gostoso!", "Estude para a prova.", "Bianca resistiu ao doce?", "Manuela e Bianca guardaram os brinquedos."], "certa": 1, "explicacao": "b) Que bolo gostoso!"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["assembléia · campainha · troféu", "tainha · europeia · destrói", "hotéis · saida · colmeia", "constrói · paranoia · enjôo", "juízes · anéis · caido"], "certa": 1, "explicacao": "b"}, {"enunciado": "O que quer dizer <b>díspar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito diferente, desigual", "arrependido", "que dispara rápido", "que fala pouco, de poucas palavras", "pouco, escasso"], "certa": 0, "explicacao": "a) muito diferente, desigual. Não é “que dispara rápido”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Prefiro ler do que jogar videogame.", "Obedeça aos sinais de trânsito.", "Prefiro mais verão do que inverno.", "Cheguei na festa atrasado.", "Cheguei na escola atrasado."], "certa": 1, "explicacao": "b) Obedeça aos sinais de trânsito."}, {"enunciado": "Quem nasce em <b>Santa Catarina</b> é… Responda com a letra.", "alternativas": ["brasileiro", "suíço", "mineiro", "tocantinense", "catarinense"], "certa": 4, "explicacao": "e) catarinense"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Ele treinou todo dia, logo ganhou a corrida.", "Beba água, já que está muito calor.", "O bolo era bonito, mas estava sem açúcar.", "Lavei a louça e varri a cozinha.", "Eu levo o bolo caso você leve o suco."], "certa": 1, "explicacao": "b) Beba água, já que está muito calor."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["O vizinho plantou <b>uma árvore</b>.", "O menino deu <b>um presente</b> à avó.", "Os alunos desenharam <b>um mapa</b>.", "Meu avô duvida <b>da história</b>.", "Minha prima comprou <b>o pão</b>."], "certa": 3, "explicacao": "d) Meu avô duvida <b>da história</b>."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que acontece por acaso", "arrogância, ar de superioridade", "pena, compaixão pelos outros", "confusão, situação enrolada"], "certa": 2, "explicacao": "c) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se ela estiver em casa, ela ligou para o meu primo.", "Se ela estivesse em casa, ela liga para o meu primo.", "Se ela estivesse em casa, ela ligará para o meu primo.", "Se ela estiver em casa, ela ligaria para o meu primo.", "Se ela estivesse em casa, ela ligaria para o meu primo."], "certa": 4, "explicacao": "e) Se ela estivesse em casa, ela ligaria para o meu primo."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>mar</b>? Responda com a letra.", "alternativas": ["maresia", "maré", "marinheiro", "marrom", "marujo"], "certa": 3, "explicacao": "d) marrom — parece, mas não vem de “mar”."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O gato derruba o copo.", "Nós nos vestimos rapidamente.", "Você se arrumou cedo.", "O vento derruba a árvore.", "Fazem-se bolos por encomenda."], "certa": 4, "explicacao": "e) Fazem-se bolos por encomenda."}, {"enunciado": "O que quer dizer <b>estapafúrdio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito apressado", "fora da época certa", "urgente", "que tem a ver com o assunto, adequado", "muito esquisito, absurdo"], "certa": 4, "explicacao": "e) muito esquisito, absurdo. Não é “muito apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A escritora cujas ideias ganharam o prêmio veio à festa.", "A escritora que os livros sumiram veio à festa.", "A menina cujos os primos vieram de longe veio à festa.", "O vizinho que a avó faz bolos veio à festa.", "A professora que o pai é piloto veio à festa."], "certa": 0, "explicacao": "a) A escritora cujas ideias ganharam o prêmio veio à festa."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Felipe, o mais alto da turma, chegou cedo.", "Bianca, cuidado com o degrau!", "São Paulo, 16 de outubro de 2026.", "A vovó e o vovô, voltaram para casa."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (A vovó e o vovô) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Trouxe o lápis para eu desenhar.", "Sem mim, a festa não teria graça.", "O bolo é para mim.", "A professora trouxe o mapa para mim ler.", "Entre mim e você, tudo bem."], "certa": 3, "explicacao": "d) — o certo é “para eu ler”."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["firme e calmo diante do sofrimento", "fora da época certa", "que acontece por acaso", "gratuito, de graça", "que não faz mal, sem efeito"], "certa": 2, "explicacao": "c) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
