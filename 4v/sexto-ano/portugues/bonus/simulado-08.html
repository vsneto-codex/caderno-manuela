<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quem nasce em <b>Teresina</b> é… Responda com a letra.", "alternativas": ["moçambicano", "natalense", "mato-grossense", "português", "teresinense"], "certa": 4, "explicacao": "e) teresinense"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["juízes · lencois · joia", "cair · campainha · perdôo", "proíbe · faísca · conteúdo", "heroico · heroina · destrói", "releem · saida · herói"], "certa": 2, "explicacao": "c"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>cruel</b>? Responda com a letra.", "alternativas": ["cruélimo", "mínimo", "sacratíssimo", "crudelíssimo", "capacíssimo"], "certa": 3, "explicacao": "d) crudelíssimo"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["pré-escola · coautor · bem-vindo", "microrregião · proativo · mini-mercado", "megaloja · autossustentável · interregional", "antitérmico · interestadual · expresidente", "ex-diretor · ex-aluno · anti-social"], "certa": 0, "explicacao": "a"}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que vem da experiência, da observação", "comum, do dia a dia; sem importância", "acolhedor, confortável", "onde é muito difícil viver", "que fala ou escreve demais, enrolando"], "certa": 3, "explicacao": "d) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "Comi meia pizza.", "Clara estava meio preocupada.", "Já é meio-dia e meia.", "A vovó ficou meia nervosa."], "certa": 4, "explicacao": "e) — o certo é “A vovó ficou meio nervosa”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "“O gato dormiu <b>sob</b> a mesa.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["lugar", "matéria", "companhia", "falta", "tempo"], "certa": 0, "explicacao": "a) lugar"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ela guardou o segredo com discrição.", "O cavaleiro montou o cavalo e partiu.", "Que cavaleiro: abriu a porta para a vovó!", "É perigoso acender fogo dentro de casa.", "O emigrante saiu de Portugal para morar no Brasil."], "certa": 2, "explicacao": "c) — o certo é “cavalheiro” (homem educado)."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "generoso, de coração grande", "comum, que acontece todo dia", "muito rico e poderoso", "o público que assiste a um espetáculo"], "certa": 1, "explicacao": "b) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Nina guardou mal a mochila e não acha mais.", "Caio tirou nota boa em Ciências, mas achou a prova difícil.", "Lia quer saber onde o ônibus do zoológico vai levar a turma.", "Nina tirou nota boa em Educação Física, mas achou a prova difícil.", "Theo quer saber aonde o ônibus do planetário vai levar a turma."], "certa": 2, "explicacao": "c) o certo é “aonde”"}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A menina que o pai é piloto veio à festa.", "O vizinho cuja a mãe é médica veio à festa.", "O menino cujo o cachorro fugiu veio à festa.", "O menino cujas ideias ganharam o prêmio veio à festa.", "O menino que as irmãs moram longe veio à festa."], "certa": 3, "explicacao": "d) O menino cujas ideias ganharam o prêmio veio à festa."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["Desligue a luz, já que vamos economizar energia.", "O filme era longo, porém ninguém dormiu.", "A planta cresce caso receba água.", "O sorvete ficou no sol, por isso derreteu.", "Lavei a louça e varri a cozinha."], "certa": 4, "explicacao": "e) Lavei a louça e varri a cozinha."}, {"enunciado": "“O irmão mais velho de Otávio limpou o quarto.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["o quarto", "O irmão mais velho de Otávio", "irmão", "Otávio", "limpou o quarto"], "certa": 1, "explicacao": "b) O irmão mais velho de Otávio — cuidado: “irmão” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "O que quer dizer <b>obsoleto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se usa mais; ultrapassado", "que é muito caro", "difícil e cansativo", "nunca visto antes, extraordinário", "esfriar, perder a força"], "certa": 0, "explicacao": "a) que não se usa mais; ultrapassado. Não é “que é muito caro”: essa é a pegadinha."}, {"enunciado": "Ontem ele ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trouxe", "trará", "trazia", "trazeu", "traz"], "certa": 0, "explicacao": "a) trouxe"}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Obedeça aos sinais de trânsito.", "Vamos na farmácia amanhã.", "Cheguei na festa atrasado.", "Assistimos a aula juntos.", "Eles foram no cinema ontem."], "certa": 0, "explicacao": "a) Obedeça aos sinais de trânsito."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["Faz uma semana que ele viajou.", "Houve duas festas no sábado.", "Já é meio-dia e meia.", "Precisamos de menas pessoas.", "Há muitos livros na estante."], "certa": 3, "explicacao": "d) — o certo é “menos”."}, {"enunciado": "O que quer dizer <b>paródia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "combinado sem precisar falar, subentendido", "que tem a ver com o assunto, adequado", "uma festa de aniversário", "que não faz mal, sem efeito"], "certa": 0, "explicacao": "a) texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar. Não é “uma festa de aniversário”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>predizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["predizi", "predisse", "prediz", "predizei", "predizeru"], "certa": 1, "explicacao": "b) predisse — predizer segue dizer: eu disse → eu predisse."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O vento derruba a árvore.", "O público aplaudiu a peça.", "A menina se olhou no espelho.", "A festa será organizada pelos vizinhos.", "O garçom serviu o suco."], "certa": 3, "explicacao": "d) A festa será organizada pelos vizinhos."}, {"enunciado": "Em qual frase há <b>comparação</b>? Responda com a letra.", "alternativas": ["Comi um boi inteiro na festa.", "O vento assobiava entre as árvores.", "Vrum! O carro passou rápido.", "O menino é esperto como uma raposa.", "A vida é uma viagem."], "certa": 3, "explicacao": "d) O menino é esperto como uma raposa."}, {"enunciado": "O que quer dizer <b>pertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem a ver com o assunto, adequado", "que parece verdade, que poderia acontecer", "que pertence a alguém", "comum, que acontece todo dia", "a sequência dos acontecimentos de uma história"], "certa": 0, "explicacao": "a) que tem a ver com o assunto, adequado. Não é “que pertence a alguém”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["O menino depende <b>da chuva</b>.", "O menino leu <b>o livro</b>.", "Minha prima lavou <b>a louça</b>.", "O vizinho comeu <b>a maçã</b>.", "Minha prima pediu <b>ajuda</b> ao vizinho."], "certa": 0, "explicacao": "a) O menino depende <b>da chuva</b>."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["exceder · cataclisma · jiló", "estouro · empecilho · caranguejo", "frustração · adivinhar · obcessão", "vasoura · mortadela · bicarbonato", "trouxe · pneu · freiada"], "certa": 1, "explicacao": "b"}, {"enunciado": "“— Eu vou assistir ao jogo amanhã — respondeu Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo respondeu que ia assistir ao jogo amanhã.", "Ricardo respondeu que vai assistir ao jogo amanhã.", "Ricardo respondeu que eu vou assistir ao jogo amanhã.", "Ricardo respondeu que eu ia assistir ao jogo no dia seguinte.", "Ricardo respondeu que ia assistir ao jogo no dia seguinte."], "certa": 4, "explicacao": "e) Ricardo respondeu que ia assistir ao jogo no dia seguinte."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vou à Bahia.", "Às vezes, durmo à tarde.", "Ricardo vai a quadra.", "Entreguei o presente a ela.", "Fiz uma visita àquele museu."], "certa": 2, "explicacao": "c) — o certo é “à quadra”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "dispensar, não precisar de algo", "que não se apaga", "precisar muito de algo", "proveitoso, que dá bons resultados"], "certa": 1, "explicacao": "b) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Unimos as peças.", "Nevou no sul.", "O cachorro e o gato decidiram o jogo.", "Minhas tias pularam corda.", "Mandei uma mensagem."], "certa": 2, "explicacao": "c) O cachorro e o gato decidiram o jogo."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>entrar</b>? Responda com a letra.", "alternativas": ["feio", "fechado", "sujo", "empurrar", "sair"], "certa": 4, "explicacao": "e) sair"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["veem", "sací", "raiz", "jiboia", "baú"], "certa": 1, "explicacao": "b) sací — o certo é saci: oxítona terminada em i ou u não leva acento (caju, saci)."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
