<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quem nasce em <b>João Pessoa</b> é… Responda com a letra.", "alternativas": ["moçambicano", "natalense", "mato-grossense", "português", "pessoense"], "certa": 4, "explicacao": "e) pessoense"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["juízes · lencois · joia", "cair · campainha · perdôo", "proíbe · faísca · conteúdo", "heroico · heroina · destrói", "releem · saida · herói"], "certa": 2, "explicacao": "c"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>amigo</b>? Responda com a letra.", "alternativas": ["sapientíssimo", "agradabilíssimo", "mínimo", "amigérrimo", "amicíssimo"], "certa": 4, "explicacao": "e) amicíssimo"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["microrregião · proativo · mini-mercado", "megaloja · autossustentável · inter-regional", "antitérmico · interestadual · expresidente", "ex-diretor · ex-aluno · anti-social", "contramão · vice-diretor · super-aquecimento"], "certa": 1, "explicacao": "b"}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["fora da época certa", "acolhedor, confortável", "onde é muito difícil viver", "caro, que custa muito", "lento para entender"], "certa": 2, "explicacao": "c) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["A professora ficou meia confusa.", "Comi meia pizza.", "As portas estavam meio abertas.", "Clara estava meio tímida.", "Comprei meio quilo de uva."], "certa": 0, "explicacao": "a) — o certo é “A professora ficou meio confusa”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "“A turma ganhou um barco <b>de</b> papel.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["meio", "matéria", "lugar", "falta", "causa"], "certa": 1, "explicacao": "b) matéria"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Com 18 anos, ele já é ilegível para vereador.", "Depois do almoço, o vovô tira uma sesta.", "Ela guardou o segredo com discrição.", "A letra estava ilegível: ninguém entendia.", "A loja vai sortir o estoque de doces."], "certa": 0, "explicacao": "a) — o certo é “elegível” (que pode ser eleito)."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que produz muito", "generoso, de coração grande", "dispensar, não precisar de algo", "muito rico e poderoso", "resumido, dito em poucas palavras"], "certa": 1, "explicacao": "b) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Davi guardou mal a garrafa de água e não acha mais.", "Nina dormiu mal e chegou cansado à aula de História.", "Onde vocês vão depois da visita ao aquário?", "Caio dormiu mal e chegou cansado à aula de Geografia.", "Nina dormiu mal e chegou cansado à aula de Arte."], "certa": 2, "explicacao": "c) o certo é “Aonde”"}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A escola onde estudo tem horta.", "O bolo onde você fez acabou.", "A professora cuja a bicicleta quebrou veio à festa.", "O vizinho cuja a mãe é médica veio à festa.", "A escritora que a bicicleta quebrou veio à festa."], "certa": 0, "explicacao": "a) A escola onde estudo tem horta."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["A casa é velha, mas é muito bonita.", "A ponte caiu, por isso tivemos de voltar.", "Estudamos a lição e fizemos o desenho.", "Você chega cedo caso pegue o ônibus das sete.", "Guarde os brinquedos, pois a visita vai chegar."], "certa": 3, "explicacao": "d) Você chega cedo caso pegue o ônibus das sete."}, {"enunciado": "“As amigas de Lívia pularam corda.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Lívia", "amigas", "As amigas de Lívia", "corda", "pularam corda"], "certa": 2, "explicacao": "c) As amigas de Lívia — cuidado: “amigas” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "O que quer dizer <b>obsoleto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "muito pequeno, escasso", "sem medo, destemido", "que não se usa mais; ultrapassado", "que é muito caro"], "certa": 3, "explicacao": "d) que não se usa mais; ultrapassado. Não é “que é muito caro”: essa é a pegadinha."}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["terão", "tinham", "têm", "tiveram", "teram"], "certa": 3, "explicacao": "d) tiveram"}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Prefiro ler do que jogar videogame.", "Prefiro mais suco do que refrigerante.", "Prefiro verão a inverno.", "Cheguei na festa atrasado.", "Vamos no clube amanhã."], "certa": 2, "explicacao": "c) Prefiro verão a inverno."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["Faz dez minutos que o ônibus passou.", "Faziam muitos dias de sol.", "É proibido entrar.", "É proibida a pesca neste lago.", "Comprei menos balas do que você."], "certa": 1, "explicacao": "b) — o certo é “Fazia”."}, {"enunciado": "O que quer dizer <b>paródia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["impulso forte e repentino", "difícil e cansativo", "texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "uma festa de aniversário", "nunca visto antes, extraordinário"], "certa": 2, "explicacao": "c) texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar. Não é “uma festa de aniversário”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>antever</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["antevei", "anteveu", "antevejei", "anteveru", "antevi"], "certa": 4, "explicacao": "e) antevi — antever segue ver: eu vi → eu antevi."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["A festa é organizada pelos vizinhos.", "Meu pai consertará a bicicleta.", "Os bombeiros apagam o incêndio.", "O vento derruba a árvore.", "O mecânico trocará o pneu."], "certa": 0, "explicacao": "a) A festa é organizada pelos vizinhos."}, {"enunciado": "Em qual frase há <b>comparação</b>? Responda com a letra.", "alternativas": ["As flores sorriam para o sol.", "Meu avô é um livro de histórias.", "Plim! Chegou uma mensagem.", "Essa mochila pesa uma tonelada.", "A menina era corajosa como uma leoa."], "certa": 4, "explicacao": "e) A menina era corajosa como uma leoa."}, {"enunciado": "O que quer dizer <b>pertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pertence a alguém", "respeito a quem pensa ou é diferente de nós", "comum, que acontece todo dia", "que tem a ver com o assunto, adequado", "esfriar, perder a força"], "certa": 3, "explicacao": "d) que tem a ver com o assunto, adequado. Não é “que pertence a alguém”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["A professora desenhou <b>um mapa</b>.", "Minha prima lavou <b>a louça</b>.", "O vizinho duvida <b>da história</b>.", "Meu avô plantou <b>uma árvore</b>.", "A professora pintou <b>o muro</b>."], "certa": 2, "explicacao": "c) O vizinho duvida <b>da história</b>."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["idéia · cinquenta · exceder", "giló · frustração · estouro", "caranguejo · adivinhar · empecilho", "vasoura · mortadela · bicarbonato", "trouxe · pneu · freiada"], "certa": 2, "explicacao": "c"}, {"enunciado": "“— Eu vou assistir ao jogo amanhã — respondeu Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo respondeu que ia assistir ao jogo amanhã.", "Ricardo respondeu que vai assistir ao jogo amanhã.", "Ricardo respondeu que eu vou assistir ao jogo amanhã.", "Ricardo respondeu que eu ia assistir ao jogo no dia seguinte.", "Ricardo respondeu que ia assistir ao jogo no dia seguinte."], "certa": 4, "explicacao": "e) Ricardo respondeu que ia assistir ao jogo no dia seguinte."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vou à Bahia.", "Às vezes, durmo à tarde.", "Ricardo vai a farmácia.", "Entreguei o presente a ela.", "Fiz uma visita àquele museu."], "certa": 2, "explicacao": "c) — o certo é “à farmácia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "dispensar, não precisar de algo", "que não se apaga", "precisar muito de algo", "proveitoso, que dá bons resultados"], "certa": 1, "explicacao": "b) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Choveu muito ontem.", "Os alunos e a diretora venderam limonada.", "Os alunos e a diretora aprenderam uma música nova.", "A turma do quinto ano pulou corda.", "Comi pizza."], "certa": 0, "explicacao": "a) Choveu muito ontem."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>cheio</b>? Responda com a letra.", "alternativas": ["idoso", "perder", "longe", "fraco", "vazio"], "certa": 4, "explicacao": "e) vazio"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ruim", "voo", "abacaxí", "rainha", "heroico"], "certa": 2, "explicacao": "c) abacaxí — o certo é abacaxi: oxítona terminada em i ou u não leva acento (caju, saci)."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
