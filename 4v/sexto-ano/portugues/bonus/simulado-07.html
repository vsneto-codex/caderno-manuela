<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["lêem · paranoia · herói", "saúva · aneis · cair", "jibóia · faísca · tainha", "chapeus · hotéis · ruim", "anzóis · veem · bainha"], "certa": 4, "explicacao": "e"}, {"enunciado": "Na frase «O bolo ficou bonito, <b>todavia</b> estava sem açúcar.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["embora", "entretanto", "e", "porque", "quando"], "certa": 1, "explicacao": "b) entretanto"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Davi tirou nota boa em Geografia, mas achou a prova difícil.", "Nina não sabe onde deixou o mapa do zoológico.", "Caio não sabe onde deixou o mapa do planetário.", "Davi guardou mau a garrafa de água e não acha mais.", "Theo tirou nota boa em Arte, mas achou a prova difícil."], "certa": 3, "explicacao": "d) o certo é “mal”"}, {"enunciado": "O que quer dizer <b>inequívoco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["investigar com cuidado para descobrir a verdade", "arrependido", "aliviar, diminuir (uma dor, um problema)", "que não deixa dúvida, claríssimo", "que tem um erro"], "certa": 3, "explicacao": "d) que não deixa dúvida, claríssimo. Não é “que tem um erro”: essa é a pegadinha."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["pluri-celular · ultraleve · antiético", "minimercado · bem-vindo · anti-inflamatório", "pré-histórico · superpopulação · ultra-resistente", "semirreta · inter-escolar · semi-internato", "ex-presidente · prénatal · proativo"], "certa": 1, "explicacao": "b"}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["têm", "tinham", "tiveram", "terão", "teram"], "certa": 2, "explicacao": "c) tiveram"}, {"enunciado": "O que quer dizer <b>dar uma mãozinha</b>? Responda com a letra.", "alternativas": ["ajudar um pouco", "acertar em cheio", "fingir que não é com ele", "ser muito caro", "passar por muita dificuldade"], "certa": 0, "explicacao": "a) ajudar um pouco"}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "isca, armadilha para enganar", "onde é muito difícil viver", "que nunca foi usado, novinho", "mentira, golpe para enganar"], "certa": 0, "explicacao": "a) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>biquíni</b> tem acento? Responda com a letra.", "alternativas": ["oxítona (força na última sílaba) terminada em a leva acento", "paroxítona terminada em i ou is leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "oxítona terminada em em ou ens leva acento"], "certa": 1, "explicacao": "b) paroxítona terminada em i ou is leva acento (bi-quí-ni)."}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["beija-flor → beija-flores", "beija-flor → beijas-flores", "pé de moleque → pé de moleques", "beija-flor → beijas-flor", "pão de queijo → pães de queijos"], "certa": 0, "explicacao": "a) beija-flor → beija-flores"}, {"enunciado": "“Sofia viu três animais <span class=\"caixa\"></span> elefante, girafa e zebra.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto de interrogação", "dois-pontos", "reticências", "vírgula", "ponto final"], "certa": 1, "explicacao": "b) dois-pontos — vem uma lista."}, {"enunciado": "O que quer dizer <b>lirismo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "a sequência dos acontecimentos de uma história", "a música tocada na lira", "a expressão dos sentimentos de quem fala no poema", "muito pequeno, escasso"], "certa": 3, "explicacao": "d) a expressão dos sentimentos de quem fala no poema. Não é “a música tocada na lira”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["Meu pai consertou a bicicleta.", "Minha avó costurou os vestidos.", "Minha avó costurará os vestidos.", "O menino quebra o vaso.", "Procuram-se voluntários."], "certa": 4, "explicacao": "e) Procuram-se voluntários."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Minhas tias guardaram os brinquedos.", "Minhas tias guarda os brinquedos.", "Minhas tias guardamos os brinquedos.", "Minhas tias guardou os brinquedos.", "Minhas tias guardei os brinquedos."], "certa": 0, "explicacao": "a) Minhas tias guardaram os brinquedos. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["sujeira · mortadela · acessor", "ansiedade · reivindicar · pobrema", "mendigo · frustração · caranguejo", "chícara · exceder · esquisito", "privilégio · cincoenta · frustrado"], "certa": 2, "explicacao": "c"}, {"enunciado": "“O sorvete ficou no sol, por isso derreteu.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["todavia", "mas", "portanto", "contudo", "porém"], "certa": 2, "explicacao": "c) portanto — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aumentar, piorar", "aliviar, diminuir (uma dor, um problema)", "remédio para todos os males", "desonesto; ou trabalho cansativo demais", "vencer, controlar (um incêndio, uma crise)"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>magro</b>? Responda com a letra.", "alternativas": ["magrélimo", "magríssimo", "magrérrimo", "facílimo", "fidelíssimo"], "certa": 1, "explicacao": "b) magríssimo"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["suspensão · atualisar · memorizar", "analizar · conversão · avisar", "utilizar · admissão · catalisar", "organizar · idealizar · improvizar", "expressão · educasão · socializar"], "certa": 2, "explicacao": "c"}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Vamos na farmácia amanhã.", "Assistimos a aula juntos.", "Eles foram ao cinema ontem.", "Cheguei na praça atrasado.", "Vamos no parque amanhã."], "certa": 2, "explicacao": "c) Eles foram ao cinema ontem."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "esperto, que percebe tudo rápido", "doença sem cura", "esperto, que percebe as coisas rápido", "remédio para todos os males"], "certa": 4, "explicacao": "e) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "Quem nasce na <b>Grécia</b> é… Responda com a letra.", "alternativas": ["acriano", "grego", "português", "soteropolitano", "marroquino"], "certa": 1, "explicacao": "b) grego"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comprei borracha, tesoura e régua.", "Felipe, cuidado com o degrau!", "Bianca, a capitã do time, chegou cedo.", "Bianca, varreu o quintal.", "Felipe, venha jantar!"], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Bianca) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Isso é para eu ler.", "Isso é para eu.", "O bolo é para mim.", "Trouxe o lápis para eu desenhar."], "certa": 2, "explicacao": "c) — o certo é “para mim”."}, {"enunciado": "O que quer dizer <b>perspicaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["no teatro, a indicação entre parênteses de lugar, gesto ou tom de voz", "que não deixa dúvida, claríssimo", "que fala muito alto", "arrogância, ar de superioridade", "que percebe as coisas com rapidez e inteligência"], "certa": 4, "explicacao": "e) que percebe as coisas com rapidez e inteligência. Não é “que fala muito alto”: essa é a pegadinha."}, {"enunciado": "Em qual alternativa há um período composto por orações coordenadas <b>sem conjunção</b>, separadas só por vírgula? Responda com a letra.", "alternativas": ["O cachorro latiu.", "A turma chegou ao museu, viu os fósseis, anotou tudo.", "Silêncio!", "O cachorro latiu, mas não pulou o portão.", "O cachorro latiu e pulou o portão."], "certa": 1, "explicacao": "b) A turma chegou ao museu, viu os fósseis, anotou tudo."}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["O time de Felipe pintou um quadro.", "Os alunos e a diretora limparam o quarto.", "Minhas tias venderam limonada?", "Como está quente hoje!", "Acorde cedo!"], "certa": 4, "explicacao": "e) Acorde cedo!"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>terra</b>? Responda com a letra.", "alternativas": ["terrível", "aterrissar", "terreno", "térreo", "enterrar"], "certa": 0, "explicacao": "a) terrível — parece, mas não vem de “terra”."}, {"enunciado": "Como se escreve <b>30º</b> por extenso? Responda com a letra.", "alternativas": ["quadragésimo", "vigésimo", "trigésimo primeiro", "trigésimo", "trintésimo"], "certa": 3, "explicacao": "d) trigésimo"}, {"enunciado": "O que quer dizer <b>precavido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala muito e com facilidade", "que não desiste; persistente", "que se prepara antes, que se previne", "preciso, feito com muito cuidado", "que é muito apressado"], "certa": 2, "explicacao": "c) que se prepara antes, que se previne. Não é “que é muito apressado”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
