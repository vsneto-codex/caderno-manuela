<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["lêem · paranoia · herói", "saúva · aneis · cair", "jibóia · faísca · tainha", "chapeus · hotéis · ruim", "anzóis · veem · bainha"], "certa": 4, "explicacao": "e"}, {"enunciado": "Na frase «O bolo ficou bonito, <b>todavia</b> estava sem açúcar.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["embora", "entretanto", "e", "porque", "quando"], "certa": 1, "explicacao": "b) entretanto"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Nina quer saber aonde o ônibus do zoológico vai levar a turma.", "Há duas semanas que Davi não vai ao zoológico.", "Theo quer saber aonde o ônibus do museu vai levar a turma.", "Aonde vocês vão depois da apresentação do coral?", "Caio guardou mau o livro e não acha mais."], "certa": 4, "explicacao": "e) o certo é “mal”"}, {"enunciado": "O que quer dizer <b>inequívoco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["investigar com cuidado para descobrir a verdade", "arrependido", "aliviar, diminuir (uma dor, um problema)", "que não deixa dúvida, claríssimo", "que tem um erro"], "certa": 3, "explicacao": "d) que não deixa dúvida, claríssimo. Não é “que tem um erro”: essa é a pegadinha."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["pluri-celular · ultraleve · antiético", "minimercado · bem-vindo · anti-inflamatório", "pré-histórico · superpopulação · ultra-resistente", "semirreta · inter-escolar · semi-internato", "ex-presidente · prénatal · proativo"], "certa": 1, "explicacao": "b"}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizem", "diziam", "disseram", "dirão", "dizeram"], "certa": 2, "explicacao": "c) disseram"}, {"enunciado": "O que quer dizer <b>ter uma memória de elefante</b>? Responda com a letra.", "alternativas": ["ajudar um pouco", "resolver duas coisas de uma vez", "fazer com facilidade", "lembrar de tudo", "falar demais"], "certa": 3, "explicacao": "d) lembrar de tudo"}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode ter mais de um sentido", "que não desiste; persistente", "incomum, surpreendente", "que nunca foi usado, novinho", "espantado, sem reação"], "certa": 2, "explicacao": "c) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>pôs</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em x leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento"], "certa": 4, "explicacao": "e) monossílabo forte terminado em a, e ou o (com ou sem s) leva acento (pôs)."}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["guarda-noturno → guardas-noturno", "guarda-noturno → guarda-noturnos", "guarda-roupa → guardas-roupas", "guarda-noturno → guardas-noturnos", "tira-gosto → tiras-gosto"], "certa": 3, "explicacao": "d) guarda-noturno → guardas-noturnos"}, {"enunciado": "“Manuela levou três materiais <span class=\"caixa\"></span> caderno, cola e régua.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto final", "ponto de interrogação", "reticências", "vírgula", "dois-pontos"], "certa": 4, "explicacao": "e) dois-pontos — vem uma lista."}, {"enunciado": "O que quer dizer <b>lirismo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito pequeno, escasso", "pedir algo a que se tem direito", "a música tocada na lira", "quem compra ou usa um produto ou serviço", "a expressão dos sentimentos de quem fala no poema"], "certa": 4, "explicacao": "e) a expressão dos sentimentos de quem fala no poema. Não é “a música tocada na lira”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O público aplaudirá a peça.", "O pneu foi trocado pelo mecânico.", "Meu pai conserta a bicicleta.", "Os alunos pintarão o mural.", "O público aplaude a peça."], "certa": 1, "explicacao": "b) O pneu foi trocado pelo mecânico."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As amigas de Lívia acordamos cedo.", "As amigas de Lívia acordaram cedo.", "As amigas de Lívia acordou cedo.", "As amigas de Lívia acorda cedo.", "As amigas de Lívia acordei cedo."], "certa": 1, "explicacao": "b) As amigas de Lívia acordaram cedo. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["assessor · carangueijo · lagartixa", "excessão · cuspir · privilégio", "adivinhar · reivindicação · entretido", "cidadãos · esquisito · mortandela", "xícara · seje · bandeja"], "certa": 2, "explicacao": "c"}, {"enunciado": "“Choveu, mas fomos à praia.”<br>Qual conjunção pode ficar no lugar de <b>mas</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porque", "logo", "caso", "pois", "todavia"], "certa": 4, "explicacao": "e) todavia — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "parado, sem movimento", "convencer alguém a pensar ou fazer alguma coisa", "que pode ter mais de um sentido", "aumentar, piorar"], "certa": 0, "explicacao": "a) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>feliz</b>? Responda com a letra.", "alternativas": ["felicíssimo", "dificílimo", "felizíssimo", "altíssimo", "felizérrimo"], "certa": 0, "explicacao": "a) felicíssimo"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["diverção · socializar · compressão", "atualizar · suavizar · pizar", "colonisar · analisar · organização", "canalizar · civilizar · humanisar", "bisar · modernizar · memorizar"], "certa": 4, "explicacao": "e"}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Obedeça os sinais de trânsito.", "Os alunos obedecem o regulamento.", "Assistimos à aula juntos.", "Os alunos chegaram no museu cedo.", "Prefiro mais suco do que refrigerante."], "certa": 2, "explicacao": "c) Assistimos à aula juntos."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["doença sem cura", "quem compra ou usa um produto ou serviço", "remédio para todos os males", "tão bom que não dá para descrever com palavras", "ligado à vida simples e tranquila do campo"], "certa": 2, "explicacao": "c) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "Quem nasce na <b>Suíça</b> é… Responda com a letra.", "alternativas": ["suíço", "maceioense", "canadense", "paulista", "maranhense"], "certa": 0, "explicacao": "a) suíço"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo e a irmã, procuraram a bola.", "Ontem, choveu muito.", "Comprei manga, pera e laranja.", "Felipe, o mais alto da turma, chegou cedo.", "São Paulo, 16 de outubro de 2026."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Ricardo e a irmã) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "Para mim, estudar à noite é melhor.", "A professora deu a tarefa para mim fazer.", "O bolo é para mim.", "Entre mim e você, tudo bem."], "certa": 2, "explicacao": "c) — o certo é “para eu fazer”."}, {"enunciado": "O que quer dizer <b>perspicaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que percebe as coisas com rapidez e inteligência", "urgente", "generoso, de coração grande", "que fala muito alto", "dispensar, não precisar de algo"], "certa": 0, "explicacao": "a) que percebe as coisas com rapidez e inteligência. Não é “que fala muito alto”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["Ande de bicicleta.", "O cachorro e o gato brincaram no parque.", "O irmão mais velho de Otávio pintou um quadro.", "Que susto!", "O vizinho do lado bebeu suco?"], "certa": 0, "explicacao": "a) Ande de bicicleta."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>mar</b>? Responda com a letra.", "alternativas": ["mármore", "marinho", "maré", "marujo", "maresia"], "certa": 0, "explicacao": "a) mármore — parece, mas não vem de “mar”."}, {"enunciado": "Como se escreve <b>21º</b> por extenso? Responda com a letra.", "alternativas": ["décimo primeiro", "vintésimo primeiro", "vigésimo primeiro", "trigésimo primeiro", "vigésimo segundo"], "certa": 2, "explicacao": "c) vigésimo primeiro"}, {"enunciado": "O que quer dizer <b>precavido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito pequeno, escasso", "que é muito apressado", "pouco, escasso", "comum, do dia a dia; sem importância", "que se prepara antes, que se previne"], "certa": 4, "explicacao": "e) que se prepara antes, que se previne. Não é “que é muito apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Andei dois quilômetros: dei mais um passo.", "O médico deu despensa da aula para o menino doente.", "O preso dormia na cela.", "O cavaleiro montou o cavalo e partiu.", "Vou serrar a tábua com o serrote."], "certa": 1, "explicacao": "b) — o certo é “dispensa” (liberação)."}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
