<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Como você cresceu!", "Que bolo gostoso!", "Meu avô pulou corda.", "Quem procurou a bola?", "Acorde cedo!"], "certa": 2, "explicacao": "c) Meu avô pulou corda."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["cinquenta · paralizar · cidadãos", "anciedade · lagartixa · prazeroso", "cabeleireiro · frustração · mendigo", "iorgute · empecilho · bicarbonato", "freada · beneficente · frustado"], "certa": 2, "explicacao": "c"}, {"enunciado": "Ontem eu ___ (verbo <b>reter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["reteu", "retei", "reteru", "retive", "reti"], "certa": 3, "explicacao": "d) retive — reter segue ter: eu tive → eu retive."}, {"enunciado": "“Cecília levou três materiais <span class=\"caixa\"></span> cola, caderno e lápis.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["ponto final", "reticências", "ponto de interrogação", "vírgula", "dois-pontos"], "certa": 4, "explicacao": "e) dois-pontos — vem uma lista."}, {"enunciado": "O que quer dizer <b>minucioso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "digno de confiança, verdadeiro", "rigoroso e sem luxo", "feito com muito cuidado, prestando atenção a cada detalhe", "muito pequeno, minúsculo"], "certa": 3, "explicacao": "d) feito com muito cuidado, prestando atenção a cada detalhe. Não é “muito pequeno, minúsculo”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos ao meio-dia.", "Aprendi a nadar.", "Às vezes, durmo à tarde.", "Visitei à loja.", "Passeamos a cavalo."], "certa": 3, "explicacao": "d) — o certo é “a loja”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Bia quer estudar mas para a prova de Ciências.", "O vendedor tratou mal os clientes e perdeu muitas vendas.", "Davi tirou nota boa em História, mas achou a prova difícil.", "Caio dormiu mal e chegou cansado à aula de Ciências.", "Lia quer saber aonde o ônibus do parque estadual vai levar a turma."], "certa": 0, "explicacao": "a) o certo é “mais”"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>fogo</b>? Responda com a letra.", "alternativas": ["fogão", "fogoso", "fofoca", "fogueteiro", "fogueira"], "certa": 2, "explicacao": "c) fofoca — parece, mas não vem de “fogo”."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles partirão cedo.", "Amanhã, eles discutiram o assunto.", "Na semana passada, eles jogaram bola.", "No ano que vem, eles dançarão na quadrilha.", "Daqui a dois dias, eles baterão na porta."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "que não se usa mais; ultrapassado", "honroso, que dá orgulho", "a razão que se dá para defender uma ideia", "caro, que custa muito"], "certa": 4, "explicacao": "e) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["canalizar · idealisar · revisar", "comunicação · realização · apreensão", "extenção · precisar · catalisar", "visualizar · colonizar · paralizar", "explicasão · sintetizar · agonizar"], "certa": 1, "explicacao": "b"}, {"enunciado": "Ontem ele ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["caberá", "cabeu", "coube", "cabia", "cabe"], "certa": 2, "explicacao": "c) coube"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Esqueci o guarda-chuva, logo fiquei molhado.", "O time ganha se treinar bastante.", "Feche a janela, já que vai chover.", "Corri muito, mas perdi o ônibus.", "Lavei a louça e varri a cozinha."], "certa": 3, "explicacao": "d) Corri muito, mas perdi o ônibus."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "dizer o contrário do que se quer dizer, para criticar ou fazer rir", "que tem as pernas compridas", "que dá para acreditar, razoável", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 4, "explicacao": "e) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>alemão</b>? Responda com a letra.", "alternativas": ["alemãoes", "alemões", "alemãos", "alemães", "alemoes"], "certa": 3, "explicacao": "d) alemães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Por que a palavra <b>pântano</b> tem acento? Responda com a letra.", "alternativas": ["éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "paroxítona terminada em x leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento"], "certa": 4, "explicacao": "e) toda proparoxítona (a força na antepenúltima sílaba) tem acento (pân-ta-no)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Estudei muito ontem.", "Vi muitos pássaros.", "Eles riram muito.", "O bolo estava muito gostoso.", "A prova foi muito fácil."], "certa": 1, "explicacao": "b) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "que merece aplausos", "arrependido", "que pode ter mais de um sentido", "que dá para acreditar, razoável"], "certa": 4, "explicacao": "e) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Cheguei na escola atrasado.", "Cheguei na praça atrasado.", "Os alunos obedecem os sinais.", "Cheguei na festa atrasado.", "Eles foram ao cinema ontem."], "certa": 4, "explicacao": "e) Eles foram ao cinema ontem."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O mergulhador vai emergir no mar profundo.", "Ao dormir, é preciso cerrar os olhos.", "Os brinquedos ficam na seção infantil da loja.", "O balão começou a ascender até as nuvens.", "Ele fez um cumprimento para a plateia."], "certa": 0, "explicacao": "a) — o certo é “imergir” (mergulhar)."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["juiz", "chapéu", "caju", "voo", "assembléia"], "certa": 4, "explicacao": "e) assembléia — o certo é assembleia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "resistente (ao calor, a mudanças)", "caprichado e bem-arrumado", "que fala ou escreve demais, enrolando", "rigoroso e sem luxo"], "certa": 3, "explicacao": "d) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>calmo</b>? Responda com a letra.", "alternativas": ["desligar", "molhado", "recusar", "agitado", "tranquilo"], "certa": 3, "explicacao": "d) agitado — cuidado: “tranquilo” é sinônimo, não antônimo."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["semi-novo · anti-horário · contraindicação", "contrarregra · antiético · anti-imperialista", "subsolo · anti-aderente · auto-observação", "ultra-rápido · neoliberal · super-resistente", "bem-vindo · auto-ajuda · pluricelular"], "certa": 1, "explicacao": "b"}, {"enunciado": "Na frase «Ele não foi à escola <b>pois</b> estava gripado.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["para que", "quando", "conforme", "visto que", "mas"], "certa": 3, "explicacao": "d) visto que"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["constroi · raiz · saúde", "ceu · ateísmo · enjoo", "cair · heróis · destrói", "trofeu · caracóis · leem", "tainha · traído · jóia"], "certa": 2, "explicacao": "c"}, {"enunciado": "O que quer dizer <b>repente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "exibido, que usa palavras difíceis só para se mostrar", "nunca visto antes, extraordinário", "verso improvisado na hora, cantado pelos repentistas do Nordeste", "uma corrida rápida"], "certa": 3, "explicacao": "d) verso improvisado na hora, cantado pelos repentistas do Nordeste. Não é “uma corrida rápida”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["O menino se escondeu atrás da porta.", "O público aplaudiu a peça.", "O osso foi mordido pelo cachorro.", "A banda toca o hino.", "A professora corrigiu as provas."], "certa": 2, "explicacao": "c) O osso foi mordido pelo cachorro."}, {"enunciado": "“Fale baixo, pois o bebê está dormindo.”<br>Qual conjunção pode ficar no lugar de <b>pois</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["portanto", "contudo", "logo", "já que", "e"], "certa": 3, "explicacao": "d) já que — as duas dão ideia de explicação."}, {"enunciado": "Em qual frase há <b>onomatopeia</b>? Responda com a letra.", "alternativas": ["Andei milhões de quilômetros hoje.", "As estrelas piscavam para o menino.", "O galo cantou: cocoricó!", "A vida é uma viagem.", "O menino é esperto como uma raposa."], "certa": 2, "explicacao": "c) O galo cantou: cocoricó!"}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
