<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Como você cresceu!", "Que bolo gostoso!", "Meu avô pulou corda.", "Quem procurou a bola?", "Acorde cedo!"], "certa": 2, "explicacao": "c) Meu avô pulou corda."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["cinquenta · paralizar · cidadãos", "anciedade · lagartixa · prazeroso", "cabeleireiro · frustração · mendigo", "iorgute · empecilho · bicarbonato", "freada · beneficente · frustado"], "certa": 2, "explicacao": "c"}, {"enunciado": "Ontem eu ___ (verbo <b>reter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["reteu", "retei", "reteru", "retive", "reti"], "certa": 3, "explicacao": "d) retive — reter segue ter: eu tive → eu retive."}, {"enunciado": "“Bernardo levou três materiais <span class=\"caixa\"></span> cola, caderno e lápis.”<br>Que sinal falta no quadradinho? Responda com a letra.", "alternativas": ["vírgula", "ponto de interrogação", "dois-pontos", "ponto final", "reticências"], "certa": 2, "explicacao": "c) dois-pontos — vem uma lista."}, {"enunciado": "O que quer dizer <b>minucioso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a expressão dos sentimentos de quem fala no poema", "o público que assiste a um espetáculo", "rigoroso e sem luxo", "muito pequeno, minúsculo", "feito com muito cuidado, prestando atenção a cada detalhe"], "certa": 4, "explicacao": "e) feito com muito cuidado, prestando atenção a cada detalhe. Não é “muito pequeno, minúsculo”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fiz uma visita àquele museu.", "Dei um abraço a médica.", "Comemos bife à milanesa.", "Entreguei o presente a ela.", "Viajei a Roma e à Itália."], "certa": 1, "explicacao": "b) — o certo é “à médica”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Há duas semanas que Bia não vai ao parque estadual.", "Caio não sabe onde deixou o mapa do museu.", "O dia estava mau para a visita ao museu: chovia muito.", "Onde vocês vão depois da visita ao aquário?", "O guia não disse aonde o grupo vai chegar ao fim da trilha."], "certa": 3, "explicacao": "d) o certo é “Aonde”"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>livro</b>? Responda com a letra.", "alternativas": ["livraria", "livrar", "livreto", "livrinho", "livreiro"], "certa": 1, "explicacao": "b) livrar — parece, mas não vem de “livro”."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles assistiram a um filme.", "Daqui a dois dias, eles cantarão na festa.", "Na semana passada, eles discutiram o assunto.", "Na semana passada, eles responderão às perguntas.", "No ano que vem, eles unirão as peças."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "parado, sem movimento", "texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "honroso, que dá orgulho", "caro, que custa muito"], "certa": 4, "explicacao": "e) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["legalisar · pretensão · bisar", "pesquisar · utilisar · progressão", "organizar · atualizar · canalizar", "revisar · extenção · comunicação", "apreenção · realização · precisar"], "certa": 2, "explicacao": "c"}, {"enunciado": "Ontem eu ___ (verbo <b>estar</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["esti", "estava", "estive", "estarei", "estou"], "certa": 2, "explicacao": "c) estive"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["O cachorro latiu a noite toda, por isso ninguém dormiu.", "O filme era longo, todavia ninguém dormiu.", "Guarde os brinquedos, já que a visita vai chegar.", "O cachorro latiu e o gato miou.", "Eu te ajudo se você pedir."], "certa": 3, "explicacao": "d) O cachorro latiu e o gato miou."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a sequência dos acontecimentos de uma história", "parado, sem movimento", "texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "exibido, que usa palavras difíceis só para se mostrar", "que tem as pernas compridas"], "certa": 3, "explicacao": "d) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>escrivão</b>? Responda com a letra.", "alternativas": ["escrivões", "escrivãoes", "escrivoes", "escrivãos", "escrivães"], "certa": 4, "explicacao": "e) escrivães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Por que a palavra <b>úteis</b> tem acento? Responda com a letra.", "alternativas": ["i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "paroxítona terminada em ei ou eis leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona terminada em em ou ens leva acento"], "certa": 1, "explicacao": "b) paroxítona terminada em ei ou eis leva acento (ú-teis)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Felipe dormiu muito.", "Eles riram muito.", "Ganhei muitos presentes.", "A prova foi muito fácil.", "A sopa estava muito quente."], "certa": 2, "explicacao": "c) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "que muda de ideia toda hora", "que dá para acreditar, razoável", "que não toma partido, que é justo com todos os lados", "que merece aplausos"], "certa": 2, "explicacao": "c) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Os alunos obedecem as regras.", "Prefiro ler a ver televisão.", "Prefiro mais cachorro do que gato.", "Cheguei na biblioteca atrasado.", "Vamos no parque amanhã."], "certa": 1, "explicacao": "b) Prefiro ler a ver televisão."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "Faziam muitos dias de sol.", "Precisamos de menos tempo.", "Comprei menos balas do que você.", "Faz uma semana que ele viajou."], "certa": 1, "explicacao": "b) — o certo é “Fazia”."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O calor faz o metal dilatar.", "A rosa fragrante perfumou a sala.", "O cavaleiro pôs a sela no cavalo.", "A inflação deixou tudo mais caro no mercado.", "A loja vai surtir o estoque de doces."], "certa": 4, "explicacao": "e) — o certo é “sortir” (abastecer)."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["herói", "vírus", "lêem", "órfã", "voo"], "certa": 2, "explicacao": "c) lêem — o certo é leem: oo e eem NÃO levam acento (voo, enjoo, leem, veem) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se usa mais; ultrapassado", "que faz tudo com muito cuidado e atenção aos detalhes", "caprichado e bem-arrumado", "que tem a ver com o assunto, adequado", "que fala ou escreve demais, enrolando"], "certa": 4, "explicacao": "e) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>paz</b>? Responda com a letra.", "alternativas": ["silêncio", "difícil", "tarde", "comprido", "guerra"], "certa": 4, "explicacao": "e) guerra"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["micro-organismo · contraargumento · ultrarrápido", "pré-escola · autoajuda · superatleta", "megaevento · semirreta · auto-controle", "co-autor · micro-ondas · vice-governador", "superinteressante · hiperrealista · autoavaliação"], "certa": 1, "explicacao": "b"}, {"enunciado": "Na frase «Choveu demais; <b>logo</b>, a rua alagou.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["se", "portanto", "para que", "e", "porque"], "certa": 1, "explicacao": "b) portanto"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["creem · céu · idéia", "saída · miúdo · abençoo", "sair · destroi · lençóis", "paranoia · ruim · juizes", "cair · sauva · estreia"], "certa": 1, "explicacao": "b"}, {"enunciado": "O que quer dizer <b>repente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["verso improvisado na hora, cantado pelos repentistas do Nordeste", "respeito a quem pensa ou é diferente de nós", "comum, do dia a dia; sem importância", "uma corrida rápida", "que faz tudo com muito cuidado e atenção aos detalhes"], "certa": 0, "explicacao": "a) verso improvisado na hora, cantado pelos repentistas do Nordeste. Não é “uma corrida rápida”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["A empresa contratará os técnicos.", "A artista faz a escultura.", "A banda tocou o hino.", "Os livros serão guardados pela bibliotecária.", "O carteiro entrega as cartas."], "certa": 3, "explicacao": "d) Os livros serão guardados pela bibliotecária."}, {"enunciado": "“Feche a janela, já que vai chover.”<br>Qual conjunção pode ficar no lugar de <b>já que</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["se", "porém", "porque", "portanto", "contudo"], "certa": 2, "explicacao": "c) porque — as duas dão ideia de explicação."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
