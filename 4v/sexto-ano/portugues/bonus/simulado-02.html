<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu quero brincar hoje — avisou Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca avisou que quer brincar hoje.", "Bianca avisou que queria brincar naquele dia.", "Bianca avisou que eu queria brincar naquele dia.", "Bianca avisou que eu quero brincar hoje.", "Bianca avisou que queria brincar hoje."], "certa": 1, "explicacao": "b) Bianca avisou que queria brincar naquele dia."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Nina guardou mal o estojo e não acha mais.", "Theo quer estudar mais para a prova de Ciências.", "Davi não sabe onde deixou o mapa do zoológico.", "Aonde vocês vão depois da visita ao museu?", "A visita ao aquário será daqui há três dias."], "certa": 4, "explicacao": "e) o certo é “a”"}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "que traz boas notícias", "breve e direto", "a expressão dos sentimentos de quem fala no poema", "cheio de detalhes"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Os alunos obedecem as regras.", "Os alunos obedecem aos pais.", "Prefiro mais verão do que inverno.", "Assistimos o jogo juntos.", "Assisti o jogo na televisão."], "certa": 1, "explicacao": "b) Os alunos obedecem aos pais."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles unirão as peças.", "Hoje de manhã, eles trabalharam na horta.", "Hoje de manhã, eles esconderam o presente.", "Amanhã, eles procurarão a bola.", "Daqui a dois dias, eles brincarão no parque."], "certa": 0, "explicacao": "a) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["repreção · humanizar · modernizar", "visualisar · colonizar · permissão", "agonizar · conversão · comunicação", "socialisar · vaporizar · idealizar", "simbolizar · organizasão · apreensão"], "certa": 2, "explicacao": "c"}, {"enunciado": "Como se escreve <b>75º</b> por extenso? Responda com a letra.", "alternativas": ["septuagésimo sexto", "septuagésimo quinto", "octogésimo quinto", "sexagésimo quinto", "setentésimo quinto"], "certa": 1, "explicacao": "b) septuagésimo quinto"}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["nunca visto antes, extraordinário", "grosseiro, muito grave (um erro)", "generoso, de coração grande", "inconveniente; fora do assunto", "pequeno, sem importância"], "certa": 1, "explicacao": "b) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["quis", "quero", "queri", "quererei", "queria"], "certa": 0, "explicacao": "a) quis"}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["cirurgião-dentista → cirurgiões-dentistas", "cirurgião-dentista → cirurgião-dentistas", "alto-falante → altos-falante", "dona de casa → dona de casas", "cirurgião-dentista → cirurgiões-dentista"], "certa": 0, "explicacao": "a) cirurgião-dentista → cirurgiões-dentistas"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["São Paulo, 16 de outubro de 2026.", "Ricardo e a irmã, sonharam com dragões.", "Felipe, cuidado com o degrau!", "Comprei manga, laranja e banana.", "Lívia, minha melhor amiga, chegou cedo."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (Ricardo e a irmã) do verbo com vírgula."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["O cachorro e o gato abriram a janela.", "O cachorro e o gato abre a janela.", "O cachorro e o gato abrimos a janela.", "O cachorro e o gato abri a janela.", "O cachorro e o gato abriu a janela."], "certa": 0, "explicacao": "a) O cachorro e o gato abriram a janela. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que é frágil, que quebra fácil", "que dura pouco tempo", "nunca visto antes, extraordinário", "pedir algo a que se tem direito", "arrependido"], "certa": 1, "explicacao": "b) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase há <b>personificação</b>? Responda com a letra.", "alternativas": ["Estou morrendo de fome.", "O lago parecia um espelho.", "Zum, zum, fazia a abelha.", "O vento assobiava entre as árvores.", "Meu avô é uma enciclopédia."], "certa": 3, "explicacao": "d) O vento assobiava entre as árvores."}, {"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se nós déssemos uma ajuda, nós escreveremos no diário.", "Se nós dermos uma ajuda, nós escrevemos no diário.", "Se nós dermos uma ajuda, nós escreveríamos no diário.", "Se nós déssemos uma ajuda, nós escrevemos no diário.", "Se nós dermos uma ajuda, nós escreveremos no diário."], "certa": 4, "explicacao": "e) Se nós dermos uma ajuda, nós escreveremos no diário."}, {"enunciado": "O que quer dizer <b>dormir no ponto</b>? Responda com a letra.", "alternativas": ["não reagir a nada", "contar um segredo", "acertar em cheio", "perder a chance por distração", "desistir de tudo com raiva"], "certa": 3, "explicacao": "d) perder a chance por distração"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Lavei a louça e varri a cozinha.", "O sorvete ficou no sol, portanto derreteu.", "Você chega cedo se pegar o ônibus das sete.", "A sopa estava quente, todavia comi rapidinho.", "Volte cedo, já que amanhã tem aula."], "certa": 4, "explicacao": "e) Volte cedo, já que amanhã tem aula."}, {"enunciado": "O que quer dizer <b>engodo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "caro, que custa muito", "comida que engorda", "arrependido", "que percebe as coisas com rapidez e inteligência"], "certa": 0, "explicacao": "a) isca, armadilha para enganar. Não é “comida que engorda”: essa é a pegadinha."}, {"enunciado": "Na frase «Treinamos bastante, <b>contudo</b> perdemos a final.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["para que", "portanto", "conforme", "se", "todavia"], "certa": 4, "explicacao": "e) todavia"}, {"enunciado": "“Os primos de Ricardo mostraram o desenho.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Os primos de Ricardo", "primos", "mostraram o desenho", "Ricardo", "o desenho"], "certa": 0, "explicacao": "a) Os primos de Ricardo — cuidado: “primos” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém sabe por que Caio faltou à aula de Ciências.", "Você desistiu do campeonato de xadrez porque?", "Ninguém sabe por que Caio faltou à aula de Educação Física.", "A estrada por que seguimos até a fazenda tinha muitas curvas.", "O experimento deu errado, e a turma inteira quis saber por quê."], "certa": 1, "explicacao": "b) — o certo é “Você desistiu do campeonato de xadrez por quê?”: está no fim da frase, logo antes do ponto: aí ganha acento."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exigente", "vencer, controlar (um incêndio, uma crise)", "muito pequeno, escasso", "confusão, situação enrolada", "confirmar, reforçar uma ideia"], "certa": 2, "explicacao": "c) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "“Tremia <b>de</b> frio.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["posse", "causa", "falta", "meio", "finalidade"], "certa": 1, "explicacao": "b) causa"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O cozinheiro despejou a calda de chocolate no sorvete.", "Na meteorologia, querem prever o tempo de amanhã.", "A sessão de cinema começa às oito.", "O censo de 2022 contou a população do Brasil.", "Guardei o arroz na dispensa."], "certa": 4, "explicacao": "e) — o certo é “despensa” (lugar de guardar comida)."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["Minha prima arrumou <b>a mochila</b>.", "Meu avô comeu <b>a maçã</b>.", "O menino encontrou <b>a chave</b>.", "Os alunos compraram <b>o pão</b>.", "Os alunos mostraram o desenho <b>à mãe</b>."], "certa": 4, "explicacao": "e) Os alunos mostraram o desenho <b>à mãe</b>."}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["novato, iniciante", "aberto e fácil de entender", "totalmente fechado; difícil de entender", "convencer alguém a pensar ou fazer alguma coisa", "sem nenhum machucado, ileso"], "certa": 2, "explicacao": "c) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos às oito horas.", "Chegamos ao meio-dia.", "Assisti a novela com a avó.", "Fiz uma visita àquele museu.", "Entreguei o presente a ela."], "certa": 2, "explicacao": "c) — o certo é “à novela”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "“Ele treinou todo dia, portanto ganhou a corrida.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porém", "porque", "mas", "todavia", "logo"], "certa": 4, "explicacao": "e) logo — as duas dão ideia de conclusão."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["A professora de música lavou o carro.", "Choveu muito ontem.", "O cachorro e o gato desenharam um castelo.", "Desenhei um castelo.", "Bianca acordou cedo."], "certa": 1, "explicacao": "b) Choveu muito ontem."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Entre mim e você, tudo bem.", "Entre eu e você não há segredos.", "Para mim, estudar à noite é melhor.", "O bolo é para mim."], "certa": 2, "explicacao": "c) — o certo é “entre mim e você”."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
