<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu quero brincar hoje — avisou Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca avisou que quer brincar hoje.", "Bianca avisou que queria brincar naquele dia.", "Bianca avisou que eu queria brincar naquele dia.", "Bianca avisou que eu quero brincar hoje.", "Bianca avisou que queria brincar hoje."], "certa": 1, "explicacao": "b) Bianca avisou que queria brincar naquele dia."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Caio não sabe onde deixou o mapa do planetário.", "Há duas semanas que Lia não vai ao planetário.", "Caio quer saber onde o ônibus do zoológico vai levar a turma.", "Há duas semanas que Theo não vai ao aquário.", "Davi quer saber aonde o ônibus do museu vai levar a turma."], "certa": 2, "explicacao": "c) o certo é “aonde”"}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "que traz boas notícias", "breve e direto", "a expressão dos sentimentos de quem fala no poema", "cheio de detalhes"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "Qual frase está de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Os alunos obedecem ao professor.", "Assistimos a aula juntos.", "Vamos no parque amanhã.", "Prefiro mais suco do que refrigerante.", "Prefiro mais verão do que inverno."], "certa": 0, "explicacao": "a) Os alunos obedecem ao professor."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles beberam suco.", "Hoje de manhã, eles pescaram no lago.", "Ontem, eles resistiram ao doce.", "Hoje de manhã, eles partiram cedo.", "No ano que vem, eles brincaram no parque."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["admição · repressão · economizar", "finalisar · paralisar · avisar", "emissão · suavizar · revizar", "improvisar · conceção · discussão", "educação · humanizar · permissão"], "certa": 4, "explicacao": "e"}, {"enunciado": "Como se escreve <b>32º</b> por extenso? Responda com a letra.", "alternativas": ["quadragésimo segundo", "trigésimo terceiro", "trigésimo segundo", "vigésimo segundo", "trintésimo segundo"], "certa": 2, "explicacao": "c) trigésimo segundo"}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pequeno, sem importância", "grosseiro, muito grave (um erro)", "que se prepara antes, que se previne", "que vem da experiência, da observação", "que está em toda parte"], "certa": 1, "explicacao": "b) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "Ontem ele ___ (verbo <b>estar</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["esteu", "estará", "esteve", "está", "estava"], "certa": 2, "explicacao": "c) esteve"}, {"enunciado": "Em qual alternativa o plural está <b>certo</b>? Responda com a letra.", "alternativas": ["bem-te-vi → bem-te-vis", "bem-te-vi → bens-te-vi", "mão de obra → mão de obras", "bem-te-vi → bens-tes-vis", "tira-gosto → tiras-gosto"], "certa": 0, "explicacao": "a) bem-te-vi → bem-te-vis"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Felipe, venha jantar!", "Felipe, cuidado com o degrau!", "Comprei laranja, banana e manga.", "A turma do quinto ano, respondeu às perguntas.", "São Paulo, 16 de outubro de 2026."], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (A turma do quinto ano) do verbo com vírgula."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Minhas tias voltaram para casa.", "Minhas tias volta para casa.", "Minhas tias voltamos para casa.", "Minhas tias voltou para casa.", "Minhas tias voltei para casa."], "certa": 0, "explicacao": "a) Minhas tias voltaram para casa. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "muito pequeno, escasso", "resumido, dito em poucas palavras", "que é frágil, que quebra fácil", "que dura pouco tempo"], "certa": 4, "explicacao": "e) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase há <b>metáfora</b>? Responda com a letra.", "alternativas": ["Esperei um século na fila.", "A pipa subiu feito um foguete.", "Aquela professora é um anjo.", "Bum! O balão estourou.", "O sol abraçou a cidade."], "certa": 2, "explicacao": "c) Aquela professora é um anjo."}, {"enunciado": "Em qual frase os tempos verbais combinam de acordo com a norma-padrão? Responda com a letra.", "alternativas": ["Se nós formos à praia, nós contaríamos a novidade para todos.", "Se nós fôssemos à praia, nós contamos a novidade para todos.", "Se nós formos à praia, nós contaremos a novidade para todos.", "Se nós fôssemos à praia, nós contaremos a novidade para todos.", "Se nós formos à praia, nós contamos a novidade para todos."], "certa": 2, "explicacao": "c) Se nós formos à praia, nós contaremos a novidade para todos."}, {"enunciado": "O que quer dizer <b>engolir sapo</b>? Responda com a letra.", "alternativas": ["falar demais", "aguentar algo ruim calado", "estar distraído", "desistir de tudo com raiva", "exagerar"], "certa": 1, "explicacao": "b) aguentar algo ruim calado"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["O time ganha caso treine bastante.", "A ponte caiu, portanto tivemos de voltar.", "Ricardo é tímido, entretanto adora cantar.", "Desligue a luz, pois vamos economizar energia.", "O sol saiu e as flores abriram."], "certa": 1, "explicacao": "b) A ponte caiu, portanto tivemos de voltar."}, {"enunciado": "O que quer dizer <b>engodo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "isca, armadilha para enganar", "que fala ou escreve demais, enrolando", "firme e calmo diante do sofrimento", "comida que engorda"], "certa": 1, "explicacao": "b) isca, armadilha para enganar. Não é “comida que engorda”: essa é a pegadinha."}, {"enunciado": "Na frase «<b>Embora</b> estivesse cansada, ela terminou a corrida.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["quando", "e", "porque", "ainda que", "mas"], "certa": 3, "explicacao": "d) ainda que"}, {"enunciado": "“As crianças da escola discutiram o assunto.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["crianças", "As crianças da escola", "o assunto", "escola", "discutiram o assunto"], "certa": 1, "explicacao": "b) As crianças da escola — cuidado: “crianças” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém sabe porquê Davi faltou à aula de Geografia.", "Ninguém sabe por que Caio faltou à aula de História.", "Ninguém sabe por que Lia faltou à aula de Educação Física.", "Ninguém sabe por que Theo faltou à aula de Arte.", "Ninguém sabe por que Lia faltou à aula de Geografia."], "certa": 0, "explicacao": "a) — o certo é “Ninguém sabe por que Davi faltou à aula de Geografia.”: é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "muito pequeno, escasso", "generoso, de coração grande", "exigente", "que não deixa dúvida, claríssimo"], "certa": 1, "explicacao": "b) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "“Lívia mora <b>em</b> um prédio alto.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["tempo", "lugar", "finalidade", "falta", "posse"], "certa": 1, "explicacao": "b) lugar"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A festa será na cesta-feira.", "O imigrante chegou ao Brasil vindo da Itália.", "A cesta de piquenique estava cheia de frutas.", "Furar o sinal vermelho é uma infração.", "Com 18 anos, ele já é elegível para vereador."], "certa": 0, "explicacao": "a) — o certo é “sexta” (dia ou número)."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["Minha prima leu <b>o livro</b>.", "Os alunos lavaram <b>a louça</b>.", "Meu avô escreveu <b>uma carta</b>.", "Os alunos confiam <b>no amigo</b>.", "Minha prima visitou <b>o museu</b>."], "certa": 3, "explicacao": "d) Os alunos confiam <b>no amigo</b>."}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode ter mais de um sentido", "dos antepassados, muito antigo, passado de geração em geração", "aberto e fácil de entender", "totalmente fechado; difícil de entender", "que julga com cuidado, seguindo regras claras"], "certa": 3, "explicacao": "d) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "“A sopa estava quente, contudo comi rapidinho.”<br>Qual conjunção pode ficar no lugar de <b>contudo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["portanto", "por isso", "pois", "todavia", "logo"], "certa": 3, "explicacao": "d) todavia — as duas dão ideia de oposição."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Trovejou durante o jogo.", "Ricardo e a irmã correram no parque.", "Há duas laranjas na fruteira.", "O time de Felipe brincou no parque.", "Desenhei um castelo."], "certa": 1, "explicacao": "b) Ricardo e a irmã correram no parque."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Trouxe o lápis para eu desenhar.", "O vovô trouxe o caderno para mim estudar.", "O bolo é para mim.", "Isso é para eu ler.", "Para mim, fazer isso é fácil."], "certa": 1, "explicacao": "b) — o certo é “para eu estudar”."}, {"enunciado": "O que quer dizer <b>inaudito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["texto que imita outro, mudando o sentido, quase sempre para fazer rir ou criticar", "baixo demais para ouvir", "rigoroso e sem luxo", "nunca visto antes, extraordinário", "fora da época certa"], "certa": 3, "explicacao": "d) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
