<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>dia</b>? Responda com a letra.", "alternativas": ["impossível", "frio", "molhado", "noite", "empurrar"], "certa": 3, "explicacao": "d) noite"}, {"enunciado": "Quem nasce em <b>Aracaju</b> é… Responda com a letra.", "alternativas": ["argentino", "paranaense", "aracajuano", "espanhol", "palmense"], "certa": 2, "explicacao": "c) aracajuano"}, {"enunciado": "O que quer dizer <b>pagar o pato</b>? Responda com a letra.", "alternativas": ["levar a culpa sozinho", "fazer igual", "ajudar num aperto", "exagerar um problema pequeno", "aguentar algo ruim calado"], "certa": 0, "explicacao": "a) levar a culpa sozinho"}, {"enunciado": "Qual é o plural de <b>cidadão</b>? Responda com a letra.", "alternativas": ["cidadães", "cidadões", "cidadoes", "cidadãos", "cidadãoes"], "certa": 3, "explicacao": "d) cidadãos — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["começar, provocar", "resumido, dito em poucas palavras", "verso improvisado na hora, cantado pelos repentistas do Nordeste", "vencer, controlar (um incêndio, uma crise)", "caro, que custa muito"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["Faz dois anos que moro aqui.", "Comprei menos balas do que você.", "Faz uma semana que ele viajou.", "Houveram dois acidentes na esquina.", "Havia dois bilhetes na mesa."], "certa": 3, "explicacao": "d) — o certo é “Houve”."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>difícil</b>? Responda com a letra.", "alternativas": ["dificílimo", "dificilérrimo", "libérrimo", "amicíssimo", "máximo"], "certa": 0, "explicacao": "a) dificílimo"}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["A vovó ficou meia assustada.", "Já é meio-dia e meia.", "As portas estavam meio abertas.", "Alice estava meio cansada.", "Bebi meia garrafa de água."], "certa": 0, "explicacao": "a) — o certo é “A vovó ficou meio assustada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Por que a palavra <b>tríceps</b> tem acento? Responda com a letra.", "alternativas": ["monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "oxítona terminada em e leva acento", "paroxítona terminada em ps leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento"], "certa": 3, "explicacao": "d) paroxítona terminada em ps leva acento (trí-ceps)."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "mentira, golpe para enganar", "muito diferente, desigual", "empurrão", "que não faz mal, sem efeito"], "certa": 1, "explicacao": "b) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A professora que os livros sumiram veio à festa.", "A menina que o cachorro fugiu veio à festa.", "A menina cuja a mãe é médica veio à festa.", "O menino que o cachorro fugiu veio à festa.", "O bolo que você fez acabou."], "certa": 4, "explicacao": "e) O bolo que você fez acabou."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["A cientista descobriu por que as abelhas estão sumindo das cidades.", "Ninguém sabe por que Lia faltou à aula de Educação Física.", "Ninguém sabe por que Davi faltou à aula de História.", "O guia do zoológico explicou o por que das regras de visita.", "Ninguém sabe por que Bia faltou à aula de Arte."], "certa": 3, "explicacao": "d) — o certo é “O guia do zoológico explicou o porquê das regras de visita.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Com 18 anos, ele já é elegível para vereador.", "O mergulhador vai imergir no mar profundo.", "O rei da Pérsia era chamado de xá.", "O cabelo dela é cumprido e liso.", "Dei um laço no presente."], "certa": 3, "explicacao": "d) — o certo é “comprido” (longo)."}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "desejo, vontade", "que parece verdade, que poderia acontecer", "respeito a quem pensa ou é diferente de nós", "oportunidade, ocasião"], "certa": 4, "explicacao": "e) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>mar</b>? Responda com a letra.", "alternativas": ["marinheiro", "maré", "mármore", "maresia", "marinho"], "certa": 2, "explicacao": "c) mármore — parece, mas não vem de “mar”."}, {"enunciado": "Ontem eles ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["poderam", "puderam", "podem", "poderão", "podiam"], "certa": 1, "explicacao": "b) puderam"}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["As cartas são entregadas pelo carteiro.", "Ela se machucou no recreio.", "O goleiro defende o pênalti.", "O técnico escalará os jogadores.", "A cozinheira prepara o almoço."], "certa": 0, "explicacao": "a) As cartas são entregadas pelo carteiro."}, {"enunciado": "“O vovô mandou o recado <b>por</b> e-mail.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["causa", "meio", "finalidade", "tempo", "falta"], "certa": 1, "explicacao": "b) meio"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se apaga", "digno de confiança, verdadeiro", "que não desiste; persistente", "duvidoso, suspeito", "novato, iniciante"], "certa": 1, "explicacao": "b) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["O filme era muito longo.", "O cachorro late muito.", "A sopa estava muito quente.", "Muitas crianças brincavam no parque.", "A prova foi muito fácil."], "certa": 3, "explicacao": "d) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "“Bianca leu o livro inteiro, por isso sabe a história de cor.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["e", "logo", "contudo", "todavia", "já que"], "certa": 1, "explicacao": "b) logo — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "que está pela metade", "que fala muito e com facilidade", "excelente, muito habilidoso", "muito diferente, desigual"], "certa": 0, "explicacao": "a) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "Em qual alternativa há um período composto por orações coordenadas <b>sem conjunção</b>, separadas só por vírgula? Responda com a letra.", "alternativas": ["O cachorro latiu.", "A atleta aqueceu, largou na frente, venceu a prova.", "O cachorro latiu e pulou o portão.", "O cachorro latiu, mas não pulou o portão.", "Parabéns pela vitória!"], "certa": 1, "explicacao": "b) A atleta aqueceu, largou na frente, venceu a prova."}, {"enunciado": "Na frase «A planta murchou <b>porque</b> ninguém a regou.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["mas", "embora", "portanto", "visto que", "quando"], "certa": 3, "explicacao": "d) visto que"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou a chover à noite.", "Às vezes, durmo à tarde.", "Comemos bife à milanesa.", "Entreguei o presente a ela.", "Fui a escola de bicicleta."], "certa": 4, "explicacao": "e) — o certo é “à escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem cor, incolor", "sem medo, destemido", "desonesto; ou trabalho cansativo demais", "sem nenhum machucado, ileso", "difícil e cansativo"], "certa": 3, "explicacao": "d) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Comprei laranja, banana e pera.", "O dono da padaria, uniu as peças.", "São Paulo, 16 de outubro de 2026.", "Bianca, a capitã do time, chegou cedo."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (O dono da padaria) do verbo com vírgula."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Davi quer estudar mais para a prova de Geografia.", "Há duas semanas que Davi não vai ao planetário.", "Não seja mal com o cachorro do vizinho, que é muito manso.", "Há duas semanas que Nina não vai ao zoológico.", "Há duas semanas que Caio não vai ao parque estadual."], "certa": 2, "explicacao": "c) o certo é “mau”"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["mortandela · enxaqueca · beneficente", "esquisito · excursão · cabelereiro", "cidadãos · paralisar · xícara", "exeder · problema · irrequieto", "exceção · impecilho · cinquenta"], "certa": 2, "explicacao": "c"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["civilizar · legalizar · suavizar", "sintetizar · impressão · progreção", "valorizar · fiscalizar · simbolisar", "paralisar · agreção · catalisar", "pesquisar · suspensão · canalisar"], "certa": 0, "explicacao": "a"}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
