<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>dia</b>? Responda com a letra.", "alternativas": ["impossível", "frio", "molhado", "noite", "empurrar"], "certa": 3, "explicacao": "d) noite"}, {"enunciado": "Quem nasce em <b>Maceió</b> é… Responda com a letra.", "alternativas": ["argentino", "paranaense", "maceioense", "espanhol", "palmense"], "certa": 2, "explicacao": "c) maceioense"}, {"enunciado": "O que quer dizer <b>matar dois coelhos com uma cajadada só</b>? Responda com a letra.", "alternativas": ["estar distraído", "desconfiar de algo", "levar a culpa sozinho", "estar distraído ou muito feliz", "resolver duas coisas de uma vez"], "certa": 4, "explicacao": "e) resolver duas coisas de uma vez"}, {"enunciado": "Qual é o plural de <b>pão</b>? Responda com a letra.", "alternativas": ["poes", "pões", "pãos", "pães", "pãoes"], "certa": 3, "explicacao": "d) pães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "generoso, de coração grande", "que faz tudo com muito cuidado e atenção aos detalhes", "começar, provocar", "vencer, controlar (um incêndio, uma crise)"], "certa": 4, "explicacao": "e) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro de concordância? Responda com a letra.", "alternativas": ["É proibida a pesca neste lago.", "Houve muitos problemas na viagem.", "Comprei menos balas do que você.", "Precisamos de menos tempo.", "Houveram muitos problemas na viagem."], "certa": 4, "explicacao": "e) — o certo é “Houve”."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>difícil</b>? Responda com a letra.", "alternativas": ["dificilérrimo", "amicíssimo", "dificílimo", "celebérrimo", "magríssimo"], "certa": 2, "explicacao": "c) dificílimo"}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Clara estava meio triste.", "Bianca ficou meia confusa.", "Comprei meio quilo de uva.", "As portas estavam meio abertas.", "Bebi meia garrafa de água."], "certa": 1, "explicacao": "b) — o certo é “Bianca ficou meio confusa”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Por que a palavra <b>sofá</b> tem acento? Responda com a letra.", "alternativas": ["oxítona terminada em e leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "paroxítona terminada em um ou uns leva acento", "oxítona terminada em o leva acento", "oxítona (força na última sílaba) terminada em a leva acento"], "certa": 4, "explicacao": "e) oxítona (força na última sílaba) terminada em a leva acento (so-fá)."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["firme e calmo diante do sofrimento", "empurrão", "impulso forte e repentino", "nunca visto antes, extraordinário", "mentira, golpe para enganar"], "certa": 4, "explicacao": "e) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Em qual frase o pronome relativo está empregado <b>de acordo com a norma-padrão</b>? Responda com a letra.", "alternativas": ["A escritora cujas as ideias ganharam o prêmio veio à festa.", "A professora que os primos vieram de longe veio à festa.", "A escritora cujos os irmãos estudam aqui veio à festa.", "A professora cujo pai é piloto veio à festa.", "O menino cujos os primos vieram de longe veio à festa."], "certa": 3, "explicacao": "d) A professora cujo pai é piloto veio à festa."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém sabe por que Theo faltou à aula de Geografia.", "Porquê Bia faltou à aula de Arte ontem?", "O experimento deu errado, e a turma inteira quis saber por quê.", "Ninguém sabe por que Caio faltou à aula de Arte.", "Ninguém sabe por que Theo faltou à aula de Educação Física."], "certa": 1, "explicacao": "b) — o certo é “Por que Bia faltou à aula de Arte ontem?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Paguei a conta com um cheque.", "A chuva era iminente: o céu escureceu.", "O cachorro abanou a cauda de alegria.", "O corpo docente é formado pelos alunos.", "O espectador assistiu ao jogo da arquibancada."], "certa": 3, "explicacao": "d) — o certo é “discente” (aluno)."}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "fora da época certa", "que dura pouco tempo", "desejo, vontade", "oportunidade, ocasião"], "certa": 4, "explicacao": "e) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é da família de <b>sol</b>? Responda com a letra.", "alternativas": ["ensolarado", "solar", "solteiro", "guarda-sol", "solzinho"], "certa": 2, "explicacao": "c) solteiro — parece, mas não vem de “sol”."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabiam", "caberão", "caberam", "couberam", "cabem"], "certa": 3, "explicacao": "d) couberam"}, {"enunciado": "Em qual frase o verbo está na <b>voz passiva</b>? Responda com a letra.", "alternativas": ["A chuva molha as roupas.", "O garçom servirá o suco.", "A escultura será feita pela artista.", "A polícia prende os ladrões.", "O mecânico troca o pneu."], "certa": 2, "explicacao": "c) A escultura será feita pela artista."}, {"enunciado": "“Otávio se escondeu <b>entre</b> as cortinas.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["matéria", "meio", "causa", "lugar", "finalidade"], "certa": 3, "explicacao": "d) lugar"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["duvidoso, suspeito", "muito diferente, desigual", "muito esquisito, absurdo", "que produz muito", "digno de confiança, verdadeiro"], "certa": 4, "explicacao": "e) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Comprei muitos livros.", "Estudei muito ontem.", "Muitas pessoas vieram à festa.", "Ela leu muitos livros.", "Muitas crianças brincavam no parque."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "“Corri muito, todavia perdi o ônibus.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["logo", "pois", "portanto", "porque", "entretanto"], "certa": 4, "explicacao": "e) entretanto — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "que tem a ver com o assunto, adequado", "que está pela metade", "sem nenhum machucado, ileso", "que não toma partido, que é justo com todos os lados"], "certa": 4, "explicacao": "e) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "Na frase «Choveu demais; <b>por isso</b>, a rua alagou.», qual conjunção pode substituir a destacada <b>sem mudar a relação de sentido</b>? Responda com a letra.", "alternativas": ["mas", "se", "logo", "e", "quando"], "certa": 2, "explicacao": "c) logo"}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "firme e calmo diante do sofrimento", "desonesto; ou trabalho cansativo demais", "que arma truques para enganar", "sem cor, incolor"], "certa": 0, "explicacao": "a) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Minhas tias, limparam o quarto.", "Felipe, cuidado com o degrau!", "São Paulo, 16 de outubro de 2026.", "Ontem, choveu muito.", "Comprei manga, laranja e maçã."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Minhas tias) do verbo com vírgula."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Lia quer saber onde o ônibus do zoológico vai levar a turma.", "Nina não sabe onde deixou o mapa do zoológico.", "Bia não sabe onde deixou o mapa do planetário.", "Há duas semanas que Theo não vai ao planetário.", "Caio tirou nota boa em Educação Física, mas achou a prova difícil."], "certa": 0, "explicacao": "a) o certo é “aonde”"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["bicarbonato · berinjela · paralelepipedo", "extraordinário · iogurte · acessor", "depredar · beneficente · próprio", "bandeja · enchaqueca · problema", "meteorologia · prazerosa · frustação"], "certa": 2, "explicacao": "c"}, {"enunciado": "Em qual grupo <b>todas</b> as palavras estão escritas do jeito certo? Responda com a letra.", "alternativas": ["vaporizar · percução · finalizar", "simbolizar · utilizar · sintetisar", "sucessão · extensão · agressão", "inversão · conceção · legalizar", "pisar · diversão · apreenção"], "certa": 2, "explicacao": "c"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["solitário, sozinho", "estranho, fora do comum", "nunca visto antes, extraordinário", "esbanjador, que gasta demais", "que fala muito e com facilidade"], "certa": 1, "explicacao": "b) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase o termo em negrito é <b>objeto indireto</b>? Responda com a letra.", "alternativas": ["Os alunos compraram <b>o pão</b>.", "A professora pintou <b>o muro</b>.", "Minha prima desenhou <b>um mapa</b>.", "Meu avô acredita <b>na vitória</b>.", "A menina pintou <b>o muro</b>."], "certa": 3, "explicacao": "d) Meu avô acredita <b>na vitória</b>."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
