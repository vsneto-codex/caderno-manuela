<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Numa gincana de raciocínio, a equipe de Nicolas tinha 3 minutos para responder. Um gráfico de colunas mostra os acidentes de trânsito por mês: jan. 12, fev. 39, mar. 48, abr. 59, maio 67, jun. 35. Em quantos meses houve mais de 30 acidentes? Responda com a letra.", "alternativas": ["5", "6", "4", "7", "1"], "certa": 0, "explicacao": "a) 5"}, {"enunciado": "Qual destes números é divisor de 96? Responda com a letra.", "alternativas": ["6", "288", "36", "192", "27"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Numa fila de bandeirinhas, as cores se repetem sempre nesta ordem: amarelo, azul, vermelho, verde. De que cor é a 108ª bandeirinha? Responda com a letra.", "alternativas": ["amarelo", "preto", "vermelho", "verde", "azul"], "certa": 3, "explicacao": "d) verde"}, {"enunciado": "Júlia achou este problema num caderno de desafios e levou para a turma. Quanto é 20 ÷ 0,8? Responda com a letra.", "alternativas": ["250", "25", "2,5", "0,25", "16"], "certa": 1, "explicacao": "b) 25"}, {"enunciado": "Leia: “A fração <span class=\"fr\"><span>3</span><span>4</span></span> é irredutível: só o 1 divide 3 e 4 ao mesmo tempo.” Nessa frase, <b>irredutível</b> quer dizer… Responda com a letra.", "alternativas": ["a medida do contorno de uma figura", "quantas vezes o desenho é maior ou menor que o tamanho real", "o resultado da subtração", "a fração que não dá para escrever com números", "a fração que não dá mais para simplificar"], "certa": 4, "explicacao": "e) a fração que não dá mais para simplificar. Não é “a fração que não dá para escrever com números”: essa é a pegadinha."}, {"enunciado": "Marina achou este problema num caderno de desafios e levou para a turma. Num salão com piso em forma de polígono de 11 lados, Bernardo quer esticar fitas ligando dois cantos que não são vizinhos (as diagonais). Quantas fitas, no máximo, sem repetir? Responda com a letra.", "alternativas": ["11", "8", "44", "49", "55"], "certa": 2, "explicacao": "c) 44"}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["179", "77", "161", "111", "209"], "certa": 0, "explicacao": "a) 179"}, {"enunciado": "Num cofrinho há 2 moedas de 5 centavos, 6 de 10, 10 de 25 e 9 de 50 centavos. Quanto dinheiro há? Responda com a letra.", "alternativas": ["R$ 3,20", "R$ 27,00", "R$ 7,70", "R$ 8,70", "R$ 77,00"], "certa": 2, "explicacao": "c) R$ 7,70"}, {"enunciado": "Num quadro de 100 quadradinhos (10 linhas de 10), foram pintadas 5 linhas inteiras e mais 3 quadradinhos. Que porcentagem foi pintada? Responda com a letra.", "alternativas": ["53%", "50%", "15%", "8%", "35%"], "certa": 0, "explicacao": "a) 53%"}, {"enunciado": "Leia: “O dobro de 15 é 30.” Nessa frase, <b>dobro</b> quer dizer… Responda com a letra.", "alternativas": ["a linha onde duas faces de um sólido se encontram", "um número com exatamente dois divisores: o 1 e ele mesmo", "duas vezes o número", "o número mais 2", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer"], "certa": 2, "explicacao": "c) duas vezes o número. Não é “o número mais 2”: essa é a pegadinha."}, {"enunciado": "Como se escreve “cinquenta e seis bilhões trezentos e dezoito milhões e noventa e três mil” com algarismos? Responda com a letra.", "alternativas": ["5.631.893", "56.318.093.000.000", "56.093.318.000", "56.318.093.000", "56.318.093"], "certa": 3, "explicacao": "d) 56.318.093.000"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Numa pesquisa com 40 alunos da turma, 14 escolheram o cinema para o passeio. Qual frase é uma conclusão correta? Responda com a letra.", "alternativas": ["A maioria não gostou de o cinema.", "65% dos alunos escolheram o cinema.", "Todos os alunos da escola preferem o cinema.", "14% dos alunos escolheram o cinema.", "35% dos alunos escolheram o cinema."], "certa": 4, "explicacao": "e) 35% dos alunos escolheram o cinema."}, {"enunciado": "Numa reta, o espaço de 2 a 3 foi dividido em 100 partes iguais. Onde fica o número 2 inteiros e <span class=\"fr\"><span>3</span><span>25</span></span>? Responda com o número decimal da marquinha. Responda com a letra.", "alternativas": ["0,12", "2,25", "2,13", "21,2", "2,12"], "certa": 4, "explicacao": "e) 2,12"}, {"enunciado": "Qual é o MMC de 9 e 15? Responda com a letra.", "alternativas": ["45", "90", "15", "24", "135"], "certa": 0, "explicacao": "a) 45"}, {"enunciado": "O que quer dizer <b>herança</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o menor de todos", "o par de números que diz onde um ponto está", "tabela que cruza duas informações, uma nas linhas e outra nas colunas", "um presente de aniversário", "o que uma pessoa deixa para a família depois de morrer"], "certa": 4, "explicacao": "e) o que uma pessoa deixa para a família depois de morrer. Não é “um presente de aniversário”: essa é a pegadinha."}, {"enunciado": "Qual é o MDC de 27 e 45? Responda com a letra.", "alternativas": ["9", "3", "18", "135", "1"], "certa": 0, "explicacao": "a) 9"}, {"enunciado": "Um aquário com fundo de 25 cm por 20 cm recebeu 4 L de água. Que altura a água alcança? Responda com a letra.", "alternativas": ["4.000 cm", "80 cm", "8 cm", "0,8 cm", "9 cm"], "certa": 2, "explicacao": "c) 8 cm"}, {"enunciado": "Quanto vale o algarismo 8 no número 9.035.875.220? Responda com a letra.", "alternativas": ["800.000", "875.220", "80.000", "8", "8.000.000"], "certa": 0, "explicacao": "a) 800.000"}, {"enunciado": "Qual é a decomposição de 396 em fatores primos? Responda com a letra.", "alternativas": ["2<sup>2</sup> × 99", "2 × 3 × 11", "2<sup>3</sup> × 3<sup>2</sup> × 11", "2<sup>2</sup> × 3<sup>2</sup> × 11", "2 × 3<sup>2</sup> × 11"], "certa": 3, "explicacao": "d) 2<sup>2</sup> × 3<sup>2</sup> × 11"}, {"enunciado": "Leia: “Os dados da pesquisa mostraram que a banana venceu.” Nessa frase, <b>dados</b> quer dizer… Responda com a letra.", "alternativas": ["os cubinhos numerados usados em jogos", "escrever a fração com números menores, sem mudar o valor", "as informações que juntamos numa pesquisa", "cada uma das 1.000 partes iguais de um inteiro", "que cresce ou diminui na mesma razão que outra grandeza"], "certa": 2, "explicacao": "c) as informações que juntamos numa pesquisa. Não é “os cubinhos numerados usados em jogos”: essa é a pegadinha."}, {"enunciado": "Otávio achou este problema num caderno de desafios e levou para a turma. Numa maquete, tudo é 50 vezes menor que o real. Uma torre tem 38 cm na maquete. Quantos metros ela tem de verdade? Responda com a letra.", "alternativas": ["38 m", "190 m", "1900 m", "19 m", "88 m"], "certa": 3, "explicacao": "d) 19 m"}, {"enunciado": "Numa promoção de 20% de desconto, uma pessoa pagou R$ 592,00 num relógio. Qual era o preço sem desconto? Responda com a letra.", "alternativas": ["R$ 710,40", "R$ 612,00", "R$ 740,00", "R$ 473,60", "R$ 1.184,00"], "certa": 2, "explicacao": "c) R$ 740,00"}, {"enunciado": "Pensei num número, somei 26 e multipliquei o resultado por 4. Deu 140. Em que número pensei? Responda com a letra.", "alternativas": ["61", "10", "114", "9", "28"], "certa": 3, "explicacao": "d) 9"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Num bairro planejado, cada rua nova é perpendicular à anterior. Foram abertas 6 ruas, uma depois da outra. A última rua é: Responda com a letra.", "alternativas": ["concorrente, mas sem canto reto", "a mesma rua que a primeira", "impossível saber", "paralela à primeira", "perpendicular à primeira"], "certa": 4, "explicacao": "e) perpendicular à primeira"}, {"enunciado": "Leia: “Na sequência 5, 8, 11, o 2º termo é 8.” Nessa frase, <b>termo</b> quer dizer… Responda com a letra.", "alternativas": ["um valor aproximado, achado com contas fáceis", "cada número de uma sequência", "tabela que cruza duas informações, uma nas linhas e outra nas colunas", "o último número de uma sequência", "o que se soma a um valor (um aumento)"], "certa": 1, "explicacao": "b) cada número de uma sequência. Não é “o último número de uma sequência”: essa é a pegadinha."}, {"enunciado": "A soma das idades de uma mãe e de seu filho é 61 anos, e a mãe tem 31 anos a mais. Qual é a idade da mãe? Responda com a letra.", "alternativas": ["15", "47", "30", "31", "46"], "certa": 4, "explicacao": "e) 46"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Um terreno triangular tem 7 m de base e 18 m de altura. Qual é a área? Responda com a letra.", "alternativas": ["50 m²", "63 m²", "126 m²", "25 m²", "70 m²"], "certa": 1, "explicacao": "b) 63 m²"}, {"enunciado": "Quatro amigos têm juntos 129 figurinhas. Três deles têm 59, 34 e 16. Quantas tem o quarto? Responda com a letra.", "alternativas": ["109", "129", "238", "30", "20"], "certa": 4, "explicacao": "e) 20"}, {"enunciado": "8 barras de cereal iguais vão ser repartidas igualmente entre 3 amigos. Quanto cada amigo recebe? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>3</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>11</span></span>", "<span class=\"fr\"><span>5</span><span>3</span></span>", "<span class=\"fr\"><span>8</span><span>3</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>8</span><span>3</span></span>"}, {"enunciado": "Leia: “A frequência do azul na pesquisa foi 8: oito pessoas escolheram azul.” Nessa frase, <b>frequência</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 2 partes iguais de um inteiro", "a velocidade de alguma coisa", "quantas vezes algo aparece", "a linha que dá a volta inteira numa figura", "a área de um quadrado de 1 m de lado"], "certa": 2, "explicacao": "c) quantas vezes algo aparece. Não é “a velocidade de alguma coisa”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
