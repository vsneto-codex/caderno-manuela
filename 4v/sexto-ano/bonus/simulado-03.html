<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto vale o algarismo 8 no número 7.846.522.904? Responda com a letra.", "alternativas": ["846.522.904", "8.000.000.000", "80.000.000", "8", "800.000.000"], "certa": 4, "explicacao": "e) 800.000.000"}, {"enunciado": "Uma loja vende um jogo de tabuleiro por R$ 92 e dá desconto de <span class=\"fr\"><span>1</span><span>4</span></span> do preço para pagamento à vista. Quanto se paga à vista? Responda com a letra.", "alternativas": ["R$ 23", "R$ 69", "R$ 88", "R$ 115", "R$ 46"], "certa": 1, "explicacao": "b) R$ 69"}, {"enunciado": "Quanto é 2.569.586.946 arredondado para a centena de milhão mais próxima? Responda com a letra.", "alternativas": ["2.560.000.000", "2.500.000.000", "2.600.000.000", "3.000.000.000", "2.570.000.000"], "certa": 2, "explicacao": "c) 2.600.000.000"}, {"enunciado": "Qual destes números é divisível por 10? Responda com a letra.", "alternativas": ["9.065", "1.029", "1.500", "6.485", "1.062"], "certa": 2, "explicacao": "c) 1.500"}, {"enunciado": "Leia: “Na turma, 40 por cento dos alunos vão de ônibus: 40 de cada 100.” Nessa frase, <b>por cento</b> quer dizer… Responda com a letra.", "alternativas": ["o tempo que passa entre dois momentos", "de cada 100 (o sinal % quer dizer “por cento”)", "de cada 10", "o quanto existe de alguma coisa, contado ou medido", "escrever a fração com números menores, sem mudar o valor"], "certa": 1, "explicacao": "b) de cada 100 (o sinal % quer dizer “por cento”). Não é “de cada 10”: essa é a pegadinha."}, {"enunciado": "Num grupo de funcionários, 64 trabalham de casa, e eles são 40% do total. Quantos funcionários há no grupo? Responda com a letra.", "alternativas": ["25,6", "2560", "164", "224", "160"], "certa": 4, "explicacao": "e) 160"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Numa eleição, 35 alunos votaram em 3 candidatos, e o vencedor teve mais votos que cada um dos outros. Qual é o menor número de votos que o vencedor pode ter tido? Responda com a letra.", "alternativas": ["33", "11", "13", "12", "14"], "certa": 2, "explicacao": "c) 13"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Ricardo tinha 3 minutos para responder. Uma loja tem 24 pacotes de café, cada um com <span class=\"fr\"><span>7</span><span>8</span></span> de quilo. Quantos quilos de café há? Responda com a letra.", "alternativas": ["21", "168", "22", "<span class=\"fr\"><span>7</span><span>8</span></span>", "24"], "certa": 0, "explicacao": "a) 21"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Entre as frações <span class=\"fr\"><span>11</span><span>12</span></span>, <span class=\"fr\"><span>1</span><span>5</span></span>, <span class=\"fr\"><span>5</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span>, qual é a menor? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span>", "<span class=\"fr\"><span>11</span><span>12</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "Leia: “Paguei com R$ 50,00 uma conta de R$ 37,85 e recebi R$ 12,15 de troco.” Nessa frase, <b>troco</b> quer dizer… Responda com a letra.", "alternativas": ["polígono com todos os lados iguais e todos os ângulos iguais", "o preço da compra", "cada número que se soma numa adição (ou cada pagamento de uma compra a prazo)", "cada uma das 10 partes iguais de um inteiro", "o dinheiro que volta quando se paga mais que o preço"], "certa": 4, "explicacao": "e) o dinheiro que volta quando se paga mais que o preço. Não é “o preço da compra”: essa é a pegadinha."}, {"enunciado": "Num jogo de tabuleiro, um paralelogramo ABCD foi desenhado no plano. A está em (2, 2), B em (6, 2) e C em (8, 6). Em que par ordenado fica D? Responda com a letra.", "alternativas": ["(6, 6)", "(6, 4)", "(4, 6)", "(7, 6)", "(2, 6)"], "certa": 2, "explicacao": "c) (4, 6)"}, {"enunciado": "Igor achou este problema num caderno de desafios e levou para a turma. Uma pista contorna um campo retangular de 100 m por 100 m. Quantas voltas completas dá quem corre 2 km? Responda com a letra.", "alternativas": ["10", "9", "8", "6", "5"], "certa": 4, "explicacao": "e) 5"}, {"enunciado": "Qual é a decomposição de 675 em fatores primos? Responda com a letra.", "alternativas": ["3<sup>3</sup> × 5<sup>2</sup>", "3<sup>2</sup> × 5<sup>3</sup>", "3<sup>2</sup> × 5<sup>2</sup>", "3<sup>4</sup> × 5<sup>2</sup>", "3 × 5"], "certa": 0, "explicacao": "a) 3<sup>3</sup> × 5<sup>2</sup>"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Marina tinha 3 minutos para responder. Qual é o algarismo das unidades de 3<sup>1128</sup>? Responda com a letra.", "alternativas": ["6", "4", "5", "8", "1"], "certa": 4, "explicacao": "e) 1"}, {"enunciado": "O que quer dizer <b>metade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["uma regra que serve para decidir alguma coisa", "a porcentagem cobrada ou paga sobre um valor", "o segmento que liga dois vértices que não são vizinhos", "cada uma das 2 partes iguais de um inteiro", "um pedaço qualquer"], "certa": 3, "explicacao": "d) cada uma das 2 partes iguais de um inteiro. Não é “um pedaço qualquer”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Nicolas tinha 3 minutos para responder. Um ladrilho tem forma de hexágono regular com 9 cm de lado. Qual é o perímetro do ladrilho? Responda com a letra.", "alternativas": ["15 cm", "45 cm", "54 cm", "36 cm", "81 cm"], "certa": 2, "explicacao": "c) 54 cm"}, {"enunciado": "Uma tabela de temperaturas mostra: Cuiabá: mínima 20 °C e máxima 33 °C; Belém: mínima 11 °C e máxima 26 °C; Recife: mínima 18 °C e máxima 32 °C. Em qual cidade a temperatura variou mais? Responda com a letra.", "alternativas": ["Recife", "todas iguais", "Cuiabá", "Belém", "impossível saber"], "certa": 3, "explicacao": "d) Belém"}, {"enunciado": "Num quadro de 100 quadradinhos (10 linhas de 10), foram pintadas 4 linhas inteiras e mais 1 quadradinhos. Que porcentagem foi pintada? Responda com a letra.", "alternativas": ["41%", "4%", "59%", "5%", "14%"], "certa": 0, "explicacao": "a) 41%"}, {"enunciado": "Helena achou este problema num caderno de desafios e levou para a turma. Às 7 horas em ponto, qual é o menor ângulo entre os ponteiros do relógio? Responda com a letra.", "alternativas": ["30°", "210°", "150°", "120°", "180°"], "certa": 2, "explicacao": "c) 150°"}, {"enunciado": "O que quer dizer <b>vértice</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número com uma parte inteira e uma fração", "cada número que se soma numa adição (ou cada pagamento de uma compra a prazo)", "o ponto onde dois lados (ou arestas) se encontram", "o meio de um lado", "escrever um número como multiplicação de números primos"], "certa": 2, "explicacao": "c) o ponto onde dois lados (ou arestas) se encontram. Não é “o meio de um lado”: essa é a pegadinha."}, {"enunciado": "Como se escreve 197 em algarismos romanos? Responda com a letra.", "alternativas": ["CXCVIII", "CLXXXXVII", "CXCVII", "CCVII", "CCXCVII"], "certa": 2, "explicacao": "c) CXCVII"}, {"enunciado": "Um tênis custava R$ 280 e passou a custar R$ 252,00. Qual foi a porcentagem de desconto? Responda com a letra.", "alternativas": ["10%", "20%", "90%", "15%", "5%"], "certa": 0, "explicacao": "a) 10%"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Quantos cubos de 2 cm de aresta cabem, encaixados, numa caixa de 12 cm por 8 cm por 6 cm? Responda com a letra.", "alternativas": ["144", "576", "24", "72", "288"], "certa": 3, "explicacao": "d) 72"}, {"enunciado": "Quantos números com 2 casas depois da vírgula existem entre 2,7 e 2,9, sem contar esses dois? Responda com a letra.", "alternativas": ["21", "20", "9", "1", "19"], "certa": 4, "explicacao": "e) 19"}, {"enunciado": "Leia: “Em 2.305.048, a classe dos milhares é 305.” Nessa frase, <b>classe</b> quer dizer… Responda com a letra.", "alternativas": ["a sala de aula", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "a parte de um grupo escolhida para responder a uma pesquisa", "cada uma das 1.000 partes iguais de um inteiro", "quem coletou ou publicou os dados de um gráfico ou tabela"], "certa": 1, "explicacao": "b) cada grupo de 3 ordens de um número: unidades, milhares, milhões. Não é “a sala de aula”: essa é a pegadinha."}, {"enunciado": "Manuela achou este problema num caderno de desafios e levou para a turma. Um gráfico de colunas mostra os acidentes de trânsito por mês: jan. 52, fev. 59, mar. 21, abr. 43, maio 12, jun. 40. Em quantos meses houve mais de 45 acidentes? Responda com a letra.", "alternativas": ["2", "1", "3", "6", "4"], "certa": 0, "explicacao": "a) 2"}, {"enunciado": "Qual é o MDC de 16 e 34? Responda com a letra.", "alternativas": ["2", "1", "18", "272", "16"], "certa": 0, "explicacao": "a) 2"}, {"enunciado": "Elisa tem 4 vezes as selos de João, e a diferença entre eles é 45. Quantas selos tem Elisa? Responda com a letra.", "alternativas": ["15", "75", "60", "45", "180"], "certa": 2, "explicacao": "c) 60"}, {"enunciado": "Numa turma de 60 alunos, 40% preferem Matemática, 20% preferem Português e os outros, Ciências. Quantos preferem Ciências? Responda com a letra.", "alternativas": ["40", "12", "36", "26", "24"], "certa": 4, "explicacao": "e) 24"}, {"enunciado": "Leia: “O mínimo múltiplo comum de 4 e 6 é 12.” Nessa frase, <b>mínimo</b> quer dizer… Responda com a letra.", "alternativas": ["o do meio, nem grande nem pequeno", "a medida de uma ponta à outra", "o tempo que passa entre dois momentos", "quanto uma medida mudou", "o menor de todos"], "certa": 4, "explicacao": "e) o menor de todos. Não é “o do meio, nem grande nem pequeno”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
