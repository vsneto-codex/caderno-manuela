<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o valor de 11 + 14<sup>2</sup> × 2? Responda com a letra.", "alternativas": ["39", "413", "403", "67", "399"], "certa": 2, "explicacao": "c) 403"}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["77", "169", "187", "73", "69"], "certa": 3, "explicacao": "d) 73"}, {"enunciado": "Yasmin achou este problema num caderno de desafios e levou para a turma. Uma família vai viajar 304 km num carro que faz 8 km por litro. O litro de gasolina custa R$ 5,10. Quanto vai gastar de gasolina? Responda com a letra.", "alternativas": ["R$ 40,80", "R$ 1.550,40", "R$ 198,90", "R$ 193,80", "R$ 19,38"], "certa": 3, "explicacao": "d) R$ 193,80"}, {"enunciado": "Uma caixa de 25 cm por 10 cm por 30 cm está cheia de água. Quantas garrafas de 250 mL dá para encher? Responda com a letra.", "alternativas": ["31", "30", "60", "300", "7.500"], "certa": 1, "explicacao": "b) 30"}, {"enunciado": "O que quer dizer <b>numerador</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de cima da fração: quantas partes foram pegas", "o número de baixo da fração", "o que se ganha a mais: o preço de venda menos o que custou", "a comparação de duas quantidades por divisão", "cada parte de um problema, resolvida uma de cada vez"], "certa": 0, "explicacao": "a) o número de cima da fração: quantas partes foram pegas. Não é “o número de baixo da fração”: essa é a pegadinha."}, {"enunciado": "Quanto é 2.226.557.724 arredondado para a centena de milhão mais próxima? Responda com a letra.", "alternativas": ["2.200.000.000", "2.300.000.000", "2.000.000.000", "2.220.000.000", "2.230.000.000"], "certa": 0, "explicacao": "a) 2.200.000.000"}, {"enunciado": "Davi tinha 40 balas e dividiu com os amigos <span class=\"fr\"><span>3</span><span>5</span></span> delas. Quantas balas ficaram? Responda com a letra.", "alternativas": ["24", "32", "16", "37", "8"], "certa": 2, "explicacao": "c) 16"}, {"enunciado": "Qual é o MMC de 35 e 40? Responda com a letra.", "alternativas": ["5", "1.400", "280", "40", "560"], "certa": 2, "explicacao": "c) 280"}, {"enunciado": "Numa aula prática, uma apresentação começou às 15h08 e durou 2 h 9 min. A que horas terminou? Responda com a letra.", "alternativas": ["17h17", "18h17", "17h08", "17h07", "16h17"], "certa": 0, "explicacao": "a) 17h17"}, {"enunciado": "O que quer dizer <b>taxa</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a porcentagem cobrada ou paga sobre um valor", "o que uma pessoa deixa para a família depois de morrer", "o dinheiro que sobra no fim do mês", "cada resultado que pode acontecer", "o valor a mais que se paga por usar o dinheiro no tempo (parcelar ou pegar emprestado)"], "certa": 0, "explicacao": "a) a porcentagem cobrada ou paga sobre um valor. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}, {"enunciado": "No número 8,548, quanto vale o algarismo que está na casa dos milésimos? Responda com a letra.", "alternativas": ["0,08", "0,008", "0,8", "80", "8"], "certa": 1, "explicacao": "b) 0,008"}, {"enunciado": "Manuela achou este problema num caderno de desafios e levou para a turma. Uma figura foi ampliada sem deformar, e a área passou de 14 cm² para 126 cm². Quantas vezes cada lado aumentou? Responda com a letra.", "alternativas": ["9", "3", "42", "4", "10"], "certa": 1, "explicacao": "b) 3"}, {"enunciado": "Duas paredes iguais, de 7 m por 3 m, vão ser pintadas. Cada lata pinta 10 m². Quantas latas, no mínimo? Responda com a letra.", "alternativas": ["5", "6", "2", "42", "3"], "certa": 0, "explicacao": "a) 5"}, {"enunciado": "Uma mochila custa R$ 220 à vista ou 5 parcelas de R$ 50. Qual é a forma mais barata e quanto se economiza? Responda com a letra.", "alternativas": ["à vista, economizando R$ 30", "parcelado, economizando R$ 30", "tanto faz", "à vista, economizando R$ 50", "à vista, economizando R$ 80"], "certa": 0, "explicacao": "a) à vista, economizando R$ 30"}, {"enunciado": "Leia: “No número 4.705.312, o 7 está na ordem das centenas de milhar.” Nessa frase, <b>ordem</b> quer dizer… Responda com a letra.", "alternativas": ["cada um dos símbolos de 0 a 9 que usamos para escrever os números", "cada número de uma sequência", "um pedido de alguém que manda", "a casa que um algarismo ocupa no número", "o dinheiro que volta quando se paga mais que o preço"], "certa": 3, "explicacao": "d) a casa que um algarismo ocupa no número. Não é “um pedido de alguém que manda”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Elisa tinha 3 minutos para responder. Num paralelogramo, um ângulo mede 65°. Quanto mede um ângulo vizinho a ele (que divide um lado com ele)? Responda com a letra.", "alternativas": ["25°", "125°", "115°", "57°", "65°"], "certa": 2, "explicacao": "c) 115°"}, {"enunciado": "Quanto é √400? Responda com a letra.", "alternativas": ["19", "20", "21", "200", "40"], "certa": 1, "explicacao": "b) 20"}, {"enunciado": "Pense em a idade e a altura de uma pessoa. Essas duas grandezas são proporcionais? (Exemplo de teste: 1 unidade custa R$ 11; 2 custam R$ 22?) Responda com a letra.", "alternativas": ["nunca dá para saber", "só é proporcional quando dobra", "depende do dia da semana", "não é proporcional", "é proporcional"], "certa": 3, "explicacao": "d) não é proporcional"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Miguel tinha 3 minutos para responder. Um triângulo foi arrastado 2 casas para a direita e 3 para cima, sem girar. Depois disso, um vértice ficou no ponto (5, 9). Onde esse vértice estava antes? Responda com a letra.", "alternativas": ["(7, 12)", "(3, 6)", "(2, 7)", "(5, 6)", "(3, 9)"], "certa": 1, "explicacao": "b) (3, 6)"}, {"enunciado": "Leia: “A fonte do gráfico é a Companhia de Água, 2025.” Nessa frase, <b>fonte</b> quer dizer… Responda com a letra.", "alternativas": ["o tamanho das letras do gráfico", "números em ordem, seguindo uma regra", "o número de cima da fração: quantas partes foram pegas", "quem coletou ou publicou os dados de um gráfico ou tabela", "a coisa toda, sem faltar nenhuma parte"], "certa": 3, "explicacao": "d) quem coletou ou publicou os dados de um gráfico ou tabela. Não é “o tamanho das letras do gráfico”: essa é a pegadinha."}, {"enunciado": "Cada um custa R$ 1,46. Com R$ 50,00, quantos litros dá para comprar, no máximo? Responda com a letra.", "alternativas": ["25", "35", "34", "50", "33"], "certa": 2, "explicacao": "c) 34"}, {"enunciado": "Quanto é 4<sup>6</sup>? Responda com a letra.", "alternativas": ["1.296", "1.024", "10", "16.384", "4.096"], "certa": 4, "explicacao": "e) 4.096"}, {"enunciado": "Qual fração equivalente a <span class=\"fr\"><span>1</span><span>4</span></span> tem: a soma de cima com o de baixo resulta em 25? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>16</span></span>", "<span class=\"fr\"><span>21</span><span>4</span></span>", "<span class=\"fr\"><span>20</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>20</span></span>", "<span class=\"fr\"><span>6</span><span>9</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>5</span><span>20</span></span>"}, {"enunciado": "Quanto é 24 + 4 × 9? Responda com a letra.", "alternativas": ["37", "64", "60", "252", "864"], "certa": 2, "explicacao": "c) 60"}, {"enunciado": "Leia: “Parcelando em 5 vezes, a geladeira sai com 8% de juros.” Nessa frase, <b>juros</b> quer dizer… Responda com a letra.", "alternativas": ["o desconto que a loja dá", "o resultado de juntar tudo", "a linha que dá a volta inteira numa figura", "o valor a mais que se paga por usar o dinheiro no tempo (parcelar ou pegar emprestado)", "o volume de um cubo de 1 m de aresta; cabem 1.000 litros"], "certa": 3, "explicacao": "d) o valor a mais que se paga por usar o dinheiro no tempo (parcelar ou pegar emprestado). Não é “o desconto que a loja dá”: essa é a pegadinha."}, {"enunciado": "Uma loja vende um violão por R$ 56 e dá desconto de <span class=\"fr\"><span>1</span><span>4</span></span> do preço para pagamento à vista. Quanto se paga à vista? Responda com a letra.", "alternativas": ["R$ 28", "R$ 70", "R$ 42", "R$ 52", "R$ 14"], "certa": 2, "explicacao": "c) R$ 42"}, {"enunciado": "Numa festa junina, os votos foram: C B A A A A B C A A A A A C B A B B B. Quantos votos teve a opção C? Responda com a letra.", "alternativas": ["3", "4", "2", "19", "10"], "certa": 0, "explicacao": "a) 3"}, {"enunciado": "Luana achou este problema num caderno de desafios e levou para a turma. Num desenho, 9 retas se cruzam: não há duas paralelas e nunca três passam pelo mesmo ponto. Quantos pontos de cruzamento há? Responda com a letra.", "alternativas": ["36", "18", "45", "72", "9"], "certa": 0, "explicacao": "a) 36"}, {"enunciado": "Numa máquina, um número foi multiplicado por 2 e depois somado com 25, dando 55. Que número entrou? Responda com a letra.", "alternativas": ["30", "15", "55", "2", "40"], "certa": 1, "explicacao": "b) 15"}, {"enunciado": "O que quer dizer <b>diferença</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece ao mesmo tempo", "o resultado da adição", "o resultado da subtração", "as informações que juntamos numa pesquisa", "a fração que não dá mais para simplificar"], "certa": 2, "explicacao": "c) o resultado da subtração. Não é “o resultado da adição”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
