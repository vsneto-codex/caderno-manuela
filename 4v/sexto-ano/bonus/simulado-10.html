<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é a fração mais simples que vale 50%? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>51</span><span>100</span></span>", "<span class=\"fr\"><span>50</span><span>100</span></span>", "<span class=\"fr\"><span>2</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>50</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>1</span><span>2</span></span>"}, {"enunciado": "Uma mochila de R$ 700 teve 20% de desconto e, depois, mais 10% sobre o novo preço. Quanto ficou? Responda com a letra.", "alternativas": ["R$ 514,00", "R$ 560,00", "R$ 504,00", "R$ 670,00", "R$ 14,00"], "certa": 2, "explicacao": "c) R$ 504,00"}, {"enunciado": "Quanto é 190 × 45? Responda com a letra.", "alternativas": ["1.710", "5.150", "8.550", "950", "7.600"], "certa": 2, "explicacao": "c) 8.550"}, {"enunciado": "Uma caixa foi enchida com cubinhos: 5 de comprimento, 2 de largura e 3 de altura. Quantos cubinhos cabem? Responda com a letra.", "alternativas": ["10", "62", "30", "29", "20"], "certa": 2, "explicacao": "c) 30"}, {"enunciado": "O que quer dizer <b>máximo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o maior de todos", "quadrilátero com só 1 par de lados paralelos", "o primeiro que aparece", "cada uma das 10 partes iguais de um inteiro"], "certa": 1, "explicacao": "b) o maior de todos. Não é “o primeiro que aparece”: essa é a pegadinha."}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["121", "209", "169", "81", "137"], "certa": 4, "explicacao": "e) 137"}, {"enunciado": "Olívia achou este problema num caderno de desafios e levou para a turma. Um quarto de 6 m por 5 m vai receber piso vendido em caixas que cobrem 4 m² cada. Quantas caixas, no mínimo? Responda com a letra.", "alternativas": ["120", "10", "6", "7", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Ricardo tinha 3 minutos para responder. Uma luminária custa R$ 270 e está com 30% de desconto. Quanto se paga? Responda com a letra.", "alternativas": ["R$ 240,00", "R$ 189,00", "R$ 351,00", "R$ 81,00", "R$ 18,90"], "certa": 1, "explicacao": "b) R$ 189,00"}, {"enunciado": "Igor achou este problema num caderno de desafios e levou para a turma. O número de 5 algarismos 4<span class=\"caixa\"></span>.650 é divisível por 9 e por 10. Qual algarismo está no quadradinho? Responda com a letra.", "alternativas": ["4", "0", "2", "3", "7"], "certa": 3, "explicacao": "d) 3"}, {"enunciado": "O que quer dizer <b>conversão</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["de cada 100 (o sinal % quer dizer “por cento”)", "a mudança do tamanho da medida", "a parte de um grupo escolhida para responder a uma pesquisa", "a troca de uma unidade por outra, sem mudar a medida", "o par de números que diz onde um ponto está"], "certa": 3, "explicacao": "d) a troca de uma unidade por outra, sem mudar a medida. Não é “a mudança do tamanho da medida”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Rafaela tinha 3 minutos para responder. Num bairro, 5 ruas paralelas cortam 4 avenidas paralelas, todas perpendiculares às ruas, formando quarteirões retangulares. Quantos quarteirões ficam totalmente cercados por ruas e avenidas? Responda com a letra.", "alternativas": ["15", "12", "20", "7", "30"], "certa": 1, "explicacao": "b) 12"}, {"enunciado": "15 bolos iguais vão ser repartidos igualmente entre 7 mesas. Quanto cada mesa recebe? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>15</span><span>22</span></span>", "<span class=\"fr\"><span>8</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>15</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>15</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>15</span><span>7</span></span>"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Um ginásio tem 1.620 livros. Quanto é 15% desse total? Faça de cabeça, pelo 10%. Responda com a letra.", "alternativas": ["1.377", "2.430", "243", "108", "162"], "certa": 2, "explicacao": "c) 243"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Um triângulo tem ângulos de 45°, 15° e 120°. Pelos ângulos, ele é: Responda com a letra.", "alternativas": ["equilátero", "retângulo", "acutângulo", "obtusângulo", "isósceles"], "certa": 3, "explicacao": "d) obtusângulo"}, {"enunciado": "O que quer dizer <b>comum</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número que está na tabuada de outro", "o que é igual para todos os números comparados", "duas expressões que valem o mesmo, ligadas pelo sinal =", "pago de uma vez, na hora da compra", "o que é simples, sem nada de especial"], "certa": 1, "explicacao": "b) o que é igual para todos os números comparados. Não é “o que é simples, sem nada de especial”: essa é a pegadinha."}, {"enunciado": "Um robô sai de (3, 3) (norte = para cima, leste = para a direita) e anda 1 para o oeste, 1 para o norte, 3 para o norte. Onde para? Responda com a letra.", "alternativas": ["(8, 3)", "(7, 2)", "(2, 3)", "(3, 7)", "(2, 7)"], "certa": 4, "explicacao": "e) (2, 7)"}, {"enunciado": "Qual é a decomposição de 90 em fatores primos? Responda com a letra.", "alternativas": ["2 × 45", "2 × 3 × 5", "2<sup>2</sup> × 3 × 5", "2 × 3<sup>3</sup> × 5", "2 × 3<sup>2</sup> × 5"], "certa": 4, "explicacao": "e) 2 × 3<sup>2</sup> × 5"}, {"enunciado": "Quanto é 6<sup>5</sup>? Responda com a letra.", "alternativas": ["7.776", "46.656", "1.296", "15.625", "11"], "certa": 0, "explicacao": "a) 7.776"}, {"enunciado": "Leia: “As linhas do sinal + são perpendiculares.” Nessa frase, <b>perpendiculares</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da subtração", "que cruza outra reta formando um ângulo reto", "um período de 100 anos", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "que nunca encontra a outra reta"], "certa": 1, "explicacao": "b) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Qual é o MMC de 15 e 35? Responda com a letra.", "alternativas": ["35", "210", "50", "525", "105"], "certa": 4, "explicacao": "e) 105"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Bianca tinha 3 minutos para responder. Um jardim quadrado tem 3 m de lado. O lado foi multiplicado por 3. Qual é a nova área do jardim, em m²? Responda com a letra.", "alternativas": ["27", "12", "36", "243", "81"], "certa": 4, "explicacao": "e) 81"}, {"enunciado": "Laura comeu um pedaço de uma pizza. Depois o irmão comeu <span class=\"fr\"><span>1</span><span>4</span></span> e sobrou <span class=\"fr\"><span>1</span><span>3</span></span>. Que fração Laura comeu? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>12</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>5</span><span>12</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>5</span><span>12</span></span>"}, {"enunciado": "Quanto é √64? Responda com a letra.", "alternativas": ["9", "8", "7", "16", "32"], "certa": 1, "explicacao": "b) 8"}, {"enunciado": "O que quer dizer <b>razão</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o dinheiro que volta quando se paga mais que o preço", "a comparação de duas quantidades por divisão", "a resposta certa de um problema", "de cada 100 (o sinal % quer dizer “por cento”)", "dois números, em ordem, que dão o endereço de um ponto no plano"], "certa": 1, "explicacao": "b) a comparação de duas quantidades por divisão. Não é “a resposta certa de um problema”: essa é a pegadinha."}, {"enunciado": "A loja vendeu 5 <span class=\"fr\"><span>1</span><span>6</span></span> quilos de queijo. Escrito como uma fração só, isso é: Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>31</span><span>6</span></span>", "<span class=\"fr\"><span>31</span><span>30</span></span>", "<span class=\"fr\"><span>11</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>6</span></span>", "<span class=\"fr\"><span>30</span><span>6</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>31</span><span>6</span></span>"}, {"enunciado": "Às 6h fazia 12 °C. Até o meio-dia subiu 5 °C e, à noite, caiu 14 °C. Quanto fazia à noite? Responda com a letra.", "alternativas": ["17 °C", "3 °C", "31 °C", "21 °C", "-2 °C"], "certa": 1, "explicacao": "b) 3 °C"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Rafaela tinha 3 minutos para responder. No mercado, o mesmo arroz é vendido assim: pacote de 0,5 kg por R$ 4,82; pacote de 1 kg por R$ 11,24; pacote de 2 kg por R$ 23,54; pacote de 3 kg por R$ 30,50; pacote de 5 kg por R$ 53,50. Qual é a compra mais vantajosa (menor preço do quilo)? Responda com a letra.", "alternativas": ["pacote de 1 kg por R$ 11,24", "pacote de 5 kg por R$ 53,50", "pacote de 2 kg por R$ 23,54", "pacote de 0,5 kg por R$ 4,82", "pacote de 3 kg por R$ 30,50"], "certa": 3, "explicacao": "d) pacote de 0,5 kg por R$ 4,82"}, {"enunciado": "O litro de gasolina custa R$ 6,23. Quanto se paga por 21 litros? Responda com a letra.", "alternativas": ["R$ 130,83", "R$ 137,06", "R$ 126,00", "R$ 1.308,30", "R$ 13,08"], "certa": 0, "explicacao": "a) R$ 130,83"}, {"enunciado": "O que quer dizer <b>unidade de medida</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a quantidade escolhida para medir, como o metro, o grama e o litro", "o número que aparece na resposta", "cada uma das 10 partes iguais de um inteiro", "do maior para o menor", "a unidade de medida dos ângulos; a volta inteira tem 360"], "certa": 0, "explicacao": "a) a quantidade escolhida para medir, como o metro, o grama e o litro. Não é “o número que aparece na resposta”: essa é a pegadinha."}, {"enunciado": "Numa sequência, cada número é o anterior vezes 2: 2, 4, 8, 16, … Qual é o 7º número? Responda com a letra.", "alternativas": ["256", "24", "40", "128", "64"], "certa": 3, "explicacao": "d) 128"}];
const CHAVE='simulado-bonus-mat-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
