<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O litro de gasolina custa R$ 5,46. Quanto se paga por 24 litros? Responda com a letra.", "alternativas": ["R$ 131,04", "R$ 13,10", "R$ 120,00", "R$ 136,50", "R$ 1.310,40"], "certa": 0, "explicacao": "a) R$ 131,04"}, {"enunciado": "Quanto vale o algarismo 8 no número 1.182.027.561? Responda com a letra.", "alternativas": ["8.000.000", "8", "82.027.561", "80.000.000", "800.000.000"], "certa": 3, "explicacao": "d) 80.000.000"}, {"enunciado": "Numa gincana, uma figura de 4 lados tem só 1 par de lados paralelos. Qual é o nome mais exato dessa figura? Responda com a letra.", "alternativas": ["quadrado", "retângulo", "trapézio", "paralelogramo", "quadrilátero sem lados paralelos"], "certa": 2, "explicacao": "c) trapézio"}, {"enunciado": "O pacote A tem 3 sabonetes por R$ 21; o pacote B tem 10 por R$ 30. Em qual deles cada sabonete sai mais barato? Responda com a letra.", "alternativas": ["os dois custam igual por unidade", "o pacote A", "não dá para saber", "o pacote maior", "o pacote B"], "certa": 4, "explicacao": "e) o pacote B"}, {"enunciado": "O que quer dizer <b>volume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um dos números 0, 1, 2, 3, 4…", "a área de uma das faces", "a medida de quanto um objeto pesa, em gramas, quilos ou toneladas", "o que uma pessoa deixa para a família depois de morrer", "o espaço que um objeto ocupa"], "certa": 4, "explicacao": "e) o espaço que um objeto ocupa. Não é “a área de uma das faces”: essa é a pegadinha."}, {"enunciado": "Um retângulo tem área de 30 m² e um dos lados mede 5 m. Quanto mede o outro lado? Responda com a letra.", "alternativas": ["5 m", "15 m", "6 m", "30 m", "7 m"], "certa": 2, "explicacao": "c) 6 m"}, {"enunciado": "Rafaela tinha uma caixa com 18 lápis de cor e usou 3. Que fração dos lápis de cor sobrou? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>15</span></span>", "<span class=\"fr\"><span>3</span><span>18</span></span>", "<span class=\"fr\"><span>15</span><span>3</span></span>", "<span class=\"fr\"><span>15</span><span>18</span></span>", "<span class=\"fr\"><span>18</span><span>15</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>15</span><span>18</span></span>"}, {"enunciado": "Enzo achou este problema num caderno de desafios e levou para a turma. Num quadriculado, um retângulo tem dois cantos opostos nos pontos (1, 1) e (8, 6). Quantos quadradinhos ele cobre? Responda com a letra.", "alternativas": ["24", "36", "48", "35", "12"], "certa": 3, "explicacao": "d) 35"}, {"enunciado": "Matheus achou este problema num caderno de desafios e levou para a turma. Um azulejo quadrado tem 76 cm de contorno. Qual é a área do azulejo, em cm²? Responda com a letra.", "alternativas": ["76", "304", "1444", "380", "361"], "certa": 4, "explicacao": "e) 361"}, {"enunciado": "Leia: “As coordenadas do ponto são (4, 2).” Nessa frase, <b>coordenadas</b> quer dizer… Responda com a letra.", "alternativas": ["o quadrilátero que tem 2 pares de lados paralelos", "o par de números que diz onde um ponto está", "as cores de um mapa", "o resultado de uma divisão", "um número que está na tabuada de outro"], "certa": 1, "explicacao": "b) o par de números que diz onde um ponto está. Não é “as cores de um mapa”: essa é a pegadinha."}, {"enunciado": "Laura deu <span class=\"fr\"><span>10</span><span>3</span></span> voltas, Clara deu 2 <span class=\"fr\"><span>2</span><span>3</span></span> voltas, Davi deu <span class=\"fr\"><span>4</span><span>3</span></span> voltas, Caio deu 4 <span class=\"fr\"><span>2</span><span>3</span></span> voltas e Helena deu <span class=\"fr\"><span>17</span><span>3</span></span> voltas. Quem deu mais? Responda com a letra.", "alternativas": ["Caio", "Davi", "Clara", "Laura", "Helena"], "certa": 4, "explicacao": "e) Helena"}, {"enunciado": "A chance de chuva amanhã é 35%. Como se escreve essa chance em número decimal? Responda com a letra.", "alternativas": ["350", "0,35", "35", "3,5", "0,65"], "certa": 1, "explicacao": "b) 0,35"}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["171", "49", "197", "77", "119"], "certa": 2, "explicacao": "c) 197"}, {"enunciado": "Num jogo de tabuleiro, uma urna tem 6 bolas verdes, 6 brancas e 7 vermelhas. Tirando uma sem olhar, qual é a chance de ser vermelha? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>7</span><span>10</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>12</span><span>19</span></span>", "<span class=\"fr\"><span>7</span><span>19</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>7</span><span>19</span></span>"}, {"enunciado": "Leia: “A igualdade 3 × 9 + 7 = 34 está certa: os dois lados valem 34.” Nessa frase, <b>igualdade</b> quer dizer… Responda com a letra.", "alternativas": ["a coisa toda, sem faltar nenhuma parte", "uma conta que sempre dá zero", "duas expressões que valem o mesmo, ligadas pelo sinal =", "o número que divide outro sem deixar resto", "cada número de uma sequência"], "certa": 2, "explicacao": "c) duas expressões que valem o mesmo, ligadas pelo sinal =. Não é “uma conta que sempre dá zero”: essa é a pegadinha."}, {"enunciado": "Qual fração equivalente a <span class=\"fr\"><span>4</span><span>5</span></span> tem: somando numerador e denominador o resultado é 45? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>25</span><span>20</span></span>", "<span class=\"fr\"><span>16</span><span>20</span></span>", "<span class=\"fr\"><span>40</span><span>5</span></span>", "<span class=\"fr\"><span>20</span><span>25</span></span>", "<span class=\"fr\"><span>9</span><span>10</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>20</span><span>25</span></span>"}, {"enunciado": "Cada um custa R$ 2,76. Com R$ 20,00, quantos picolés dá para comprar, no máximo? Responda com a letra.", "alternativas": ["20", "8", "10", "7", "6"], "certa": 3, "explicacao": "d) 7"}, {"enunciado": "Qual número é 30 + 5 + 0,4 + 0,05? Responda com a letra.", "alternativas": ["35,54", "305,45", "35,045", "35,45", "8,45"], "certa": 3, "explicacao": "d) 35,45"}, {"enunciado": "O que quer dizer <b>concorrentes</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["retas que nunca se encontram", "uma multiplicação de fatores iguais, escrita com base e expoente", "retas que se cruzam num ponto", "a fração que não dá mais para simplificar", "o que sobra numa divisão que não é exata"], "certa": 2, "explicacao": "c) retas que se cruzam num ponto. Não é “retas que nunca se encontram”: essa é a pegadinha."}, {"enunciado": "Pedro recebeu R$ 60,00 de mesada e gastou <span class=\"fr\"><span>1</span><span>4</span></span> dela num livro. Quanto custou o livro? Responda com a letra.", "alternativas": ["R$ 16,00", "R$ 15,00", "R$ 45,00", "R$ 6,00", "R$ 30,00"], "certa": 1, "explicacao": "b) R$ 15,00"}, {"enunciado": "Quanto é 3<sup>4</sup>? Responda com a letra.", "alternativas": ["81", "243", "12", "7", "64"], "certa": 0, "explicacao": "a) 81"}, {"enunciado": "Um aquário mede 50 cm × 25 cm × 20 cm. Sabendo que 1.000 cm³ = 1 litro, quantos litros cabem nele? Responda com a letra.", "alternativas": ["1,25 L", "2,5 L", "26 L", "25.000 L", "25 L"], "certa": 4, "explicacao": "e) 25 L"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Valentina tinha 3 minutos para responder. Num cartão retangular de 27 cm por 13 cm, foi feito um recorte retangular de 13 cm de largura e 10 cm de profundidade no meio do lado maior. Qual é o perímetro da figura? Responda com a letra.", "alternativas": ["100 cm", "90 cm", "221 cm", "67 cm", "106 cm"], "certa": 0, "explicacao": "a) 100 cm"}, {"enunciado": "O que quer dizer <b>centésimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 100 partes iguais de um inteiro", "o número 100", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "a linha que dá a volta inteira numa figura", "a medida de uma ponta à outra"], "certa": 0, "explicacao": "a) cada uma das 100 partes iguais de um inteiro. Não é “o número 100”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Sofia tinha 3 minutos para responder. Algoritmo: comece com 9. Repita: some 4. Pare quando o valor passar de 80. Quantas vezes você somou? Responda com a letra.", "alternativas": ["81", "19", "17", "20", "18"], "certa": 4, "explicacao": "e) 18"}, {"enunciado": "A viagem de ônibus durou <span class=\"fr\"><span>7</span><span>3</span></span> horas. Quanto tempo é isso em horas e minutos? Responda com a letra.", "alternativas": ["7 h 3 min", "2 h 1 min", "2 h 20 min", "3 h 20 min", "2 h 10 min"], "certa": 2, "explicacao": "c) 2 h 20 min"}, {"enunciado": "Quanto é 94.295.948 arredondado para o milhão mais próximo? Responda com a letra.", "alternativas": ["94.200.000", "94.300.000", "90.000.000", "94.000.000", "95.000.000"], "certa": 3, "explicacao": "d) 94.000.000"}, {"enunciado": "Esta pergunta apareceu numa prova de seleção para o 6º ano. Entre as frações <span class=\"fr\"><span>2</span><span>5</span></span>, <span class=\"fr\"><span>7</span><span>12</span></span>, <span class=\"fr\"><span>3</span><span>4</span></span>, <span class=\"fr\"><span>1</span><span>6</span></span>, qual é a menor? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>7</span><span>12</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>6</span></span>"}, {"enunciado": "Leia: “No experimento, a moeda foi lançada 50 vezes e deu cara 28 vezes.” Nessa frase, <b>experimento</b> quer dizer… Responda com a letra.", "alternativas": ["o maior de todos", "a linha que dá a volta inteira numa figura", "uma ação repetida várias vezes para ver o que acontece", "o número que, multiplicado por ele mesmo, dá o número dado", "uma pergunta feita a uma pessoa"], "certa": 2, "explicacao": "c) uma ação repetida várias vezes para ver o que acontece. Não é “uma pergunta feita a uma pessoa”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Alice tinha 3 minutos para responder. Um remédio deve ter 11,617 mL de xarope por dose, mas a seringa só marca os centésimos de mililitro. Arredondando para o centésimo, quanto deve ser marcado? Responda com a letra.", "alternativas": ["12", "11,63", "11,62", "11,6", "11,61"], "certa": 2, "explicacao": "c) 11,62"}];
const CHAVE='simulado-bonus-mat-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
