<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "É preciso levar 93 ovos em bandejas de 8 ovos. Quantas bandejas são necessárias, no mínimo, para caber tudo? Responda com a letra.", "alternativas": ["744", "5", "11", "85", "12"], "certa": 4, "explicacao": "e) 12"}, {"enunciado": "Numa gincana, a tabela de visitantes foi: janeiro, 287; fevereiro, 126; março, 217; abril, 210. Qual foi o total dos quatro meses? Responda com a letra.", "alternativas": ["850", "287", "840", "210", "1148"], "certa": 2, "explicacao": "c) 840"}, {"enunciado": "6 pães custam R$ 108. Quanto custam 15 pães iguais? Responda com a letra.", "alternativas": ["R$ 117", "R$ 1620", "R$ 33", "R$ 252", "R$ 270"], "certa": 4, "explicacao": "e) R$ 270"}, {"enunciado": "O que quer dizer <b>potência</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado de uma multiplicação", "uma multiplicação de fatores iguais, escrita com base e expoente", "a força de uma máquina", "desenho de uma construção vista de cima, em escala", "a quantidade escolhida para medir, como o metro, o grama e o litro"], "certa": 1, "explicacao": "b) uma multiplicação de fatores iguais, escrita com base e expoente. Não é “a força de uma máquina”: essa é a pegadinha."}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Um pasto retangular de 28 m por 11 m vai ser cercado com 3 fios de arame (cada fio dá uma volta inteira). Quantos metros de arame? Responda com a letra.", "alternativas": ["81 m", "117 m", "924 m", "78 m", "234 m"], "certa": 4, "explicacao": "e) 234 m"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Gabriela tinha 3 minutos para responder. Igor pagou R$ 20,00 por 0,5 kg de queijo. Quanto custa o quilo desse queijo? Responda com a letra.", "alternativas": ["R$ 10,00", "R$ 40,00", "R$ 41,00", "R$ 20,00", "R$ 0,03"], "certa": 1, "explicacao": "b) R$ 40,00"}, {"enunciado": "Numa feira de ciências, a balança ficou equilibrada: <span class=\"caixa\"></span> + 58 = 71 + 24. Que número vai no quadradinho? Responda com a letra.", "alternativas": ["47", "58", "37", "13", "95"], "certa": 2, "explicacao": "c) 37"}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["119", "77", "151", "221", "129"], "certa": 2, "explicacao": "c) 151"}, {"enunciado": "O que quer dizer <b>total</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["uma das partes", "um dos números 0, 1, 2, 3, 4…", "um período de 100 anos", "o número de cima da fração: quantas partes foram pegas", "o resultado de juntar tudo"], "certa": 4, "explicacao": "e) o resultado de juntar tudo. Não é “uma das partes”: essa é a pegadinha."}, {"enunciado": "Numa promoção de 50% de desconto, uma pessoa pagou R$ 390,00 num relógio. Qual era o preço sem desconto? Responda com a letra.", "alternativas": ["R$ 440,00", "R$ 195,00", "R$ 1.170,00", "R$ 780,00", "R$ 1.950,00"], "certa": 3, "explicacao": "d) R$ 780,00"}, {"enunciado": "13 pizzas iguais vão ser repartidas igualmente entre 4 crianças. Quanto cada criança recebe? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>13</span><span>17</span></span>", "<span class=\"fr\"><span>4</span><span>13</span></span>", "<span class=\"fr\"><span>13</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>9</span><span>4</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>13</span><span>4</span></span>"}, {"enunciado": "Qual destes números é divisível por 3? Responda com a letra.", "alternativas": ["7.726", "5.379", "9.926", "2.459", "9.949"], "certa": 1, "explicacao": "b) 5.379"}, {"enunciado": "No grupo A, 10% dos 400 funcionários trabalham de casa. No grupo B, 50% dos 200 funcionários. Em qual grupo há mais funcionários nessa situação? Responda com a letra.", "alternativas": ["os dois têm o mesmo número", "o grupo com mais pessoas", "o grupo A", "não dá para saber", "o grupo B"], "certa": 4, "explicacao": "e) o grupo B"}, {"enunciado": "O que quer dizer <b>perímetro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["uma ação repetida várias vezes para ver o que acontece", "a medida do contorno de uma figura", "retas que se cruzam num ponto", "o espaço de dentro de uma figura", "o que sobra numa divisão que não é exata"], "certa": 1, "explicacao": "b) a medida do contorno de uma figura. Não é “o espaço de dentro de uma figura”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Manuela tinha 3 minutos para responder. Num esquema, “A → B” quer dizer “A coordena B”: Fábio → Elisa; Elisa → Gabi; Gabi → Davi; Gabi → Heitor; Gabi → Ana. Quantas pessoas Fábio coordena, direta ou indiretamente? Responda com a letra.", "alternativas": ["2", "5", "1", "4", "6"], "certa": 1, "explicacao": "b) 5"}, {"enunciado": "Numa feira de ciências, há três caixas: caixa A com 1 bolas premiadas em 12; caixa B com 5 bolas premiadas em 7; caixa C com 2 bolas premiadas em 8. Em qual a chance de ganhar é maior? Responda com a letra.", "alternativas": ["caixa B", "caixa C", "todas iguais", "a que tem mais bolas premiadas", "caixa A"], "certa": 0, "explicacao": "a) caixa B"}, {"enunciado": "É preciso levar 97 livros em caixas em que cabem 10 livros. Quantas caixas são necessárias, no mínimo, para caber tudo? Responda com a letra.", "alternativas": ["10", "7", "970", "9", "87"], "certa": 0, "explicacao": "a) 10"}, {"enunciado": "Como se escreve 3.143 em algarismos romanos? Responda com a letra.", "alternativas": ["MMMCCXLIII", "MMMCLXIII", "MMMCXXXXIII", "MMMCXLIII", "MMMCXLIV"], "certa": 3, "explicacao": "d) MMMCXLIII"}, {"enunciado": "O que quer dizer <b>orçamento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o plano do dinheiro que entra e do que vai ser gasto", "o dinheiro que sobrou no fim do mês", "trocar um número por outro próximo, terminado em zeros", "cada parte de um problema, resolvida uma de cada vez", "cada uma das 2 partes iguais de um inteiro"], "certa": 0, "explicacao": "a) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobrou no fim do mês”: essa é a pegadinha."}, {"enunciado": "Quanto é 9<sup>5</sup>? Responda com a letra.", "alternativas": ["1.953.125", "531.441", "6.561", "14", "59.049"], "certa": 4, "explicacao": "e) 59.049"}, {"enunciado": "Felipe achou este problema num caderno de desafios e levou para a turma. Numa pesquisa com 20 alunos da turma, 9 escolheram o parque para o passeio. Qual frase é uma conclusão correta? Responda com a letra.", "alternativas": ["45% dos alunos escolheram o parque.", "A maioria não gostou de o parque.", "55% dos alunos escolheram o parque.", "Todos os alunos da escola preferem o parque.", "9% dos alunos escolheram o parque."], "certa": 0, "explicacao": "a) 45% dos alunos escolheram o parque."}, {"enunciado": "Num aplicativo de mapa, um sólido tem 5 faces, 6 vértices e 9 arestas. Qual é ele? Responda com a letra.", "alternativas": ["pirâmide de base pentagonal", "prisma de base pentagonal", "pirâmide de base triangular", "prisma de base triangular", "prisma de base quadrada"], "certa": 3, "explicacao": "d) prisma de base triangular"}, {"enunciado": "Para comprar uma régua de R$ 286,29, uma criança guarda R$ 24,91 por semana. Em quantas semanas, no mínimo, terá o dinheiro? Responda com a letra.", "alternativas": ["13", "12", "28", "11", "286"], "certa": 1, "explicacao": "b) 12"}, {"enunciado": "O que quer dizer <b>ampliação</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cópia maior de uma figura, com todas as medidas multiplicadas pelo mesmo número", "pago de uma vez, na hora da compra", "que acontece ao mesmo tempo", "cópia com os ângulos maiores", "números em ordem, seguindo uma regra"], "certa": 0, "explicacao": "a) cópia maior de uma figura, com todas as medidas multiplicadas pelo mesmo número. Não é “cópia com os ângulos maiores”: essa é a pegadinha."}, {"enunciado": "Num condomínio, 23% das pessoas preferem praia, 27% preferem campo e as outras preferem cidade. Que porcentagem prefere cidade? Responda com a letra.", "alternativas": ["77%", "50%", "60%", "4%", "96%"], "certa": 1, "explicacao": "b) 50%"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Manuela tinha 3 minutos para responder. Num telhado em forma de triângulo isósceles, o ângulo do alto mede 50°, e os dois ângulos de baixo são iguais. Quanto mede cada ângulo de baixo? Responda com a letra.", "alternativas": ["65°", "130°", "43°", "50°", "155°"], "certa": 0, "explicacao": "a) 65°"}, {"enunciado": "Qual é a decomposição de 3.500 em fatores primos? Responda com a letra.", "alternativas": ["2 × 5 × 7", "2<sup>3</sup> × 5<sup>2</sup> × 7", "2<sup>2</sup> × 5<sup>3</sup> × 7", "2<sup>2</sup> × 875", "2<sup>2</sup> × 5<sup>4</sup> × 7"], "certa": 2, "explicacao": "c) 2<sup>2</sup> × 5<sup>3</sup> × 7"}, {"enunciado": "Um quintal retangular mede 3 m por 13 m. Qual é a área do quintal? Responda com a letra.", "alternativas": ["39 m²", "40 m²", "16 m²", "32 m²", "78 m²"], "certa": 0, "explicacao": "a) 39 m²"}, {"enunciado": "Leia: “O fluxograma começa na oval, segue pelos retângulos e decide no losango.” Nessa frase, <b>fluxograma</b> quer dizer… Responda com a letra.", "alternativas": ["um gráfico de colunas", "cada parte de um problema, resolvida uma de cada vez", "o valor que se tira do preço", "desenho de um passo a passo, com caixas ligadas por setas", "a coisa toda, sem faltar nenhuma parte"], "certa": 3, "explicacao": "d) desenho de um passo a passo, com caixas ligadas por setas. Não é “um gráfico de colunas”: essa é a pegadinha."}, {"enunciado": "A sequência 3, 14, 25, 36, … continua sempre igual. Qual é o 30º termo? Responda com a letra.", "alternativas": ["90", "322", "333", "330", "311"], "certa": 1, "explicacao": "b) 322"}];
const CHAVE='simulado-bonus-mat-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
