<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Nicolas achou este problema num caderno de desafios e levou para a turma. Uma máquina multiplica o número que entra por 4 e depois soma 1. Saiu 65. Que número entrou? Responda com a letra.", "alternativas": ["16", "64", "261", "17", "15"], "certa": 0, "explicacao": "a) 16"}, {"enunciado": "No número 4,721, quanto vale o algarismo que está na casa dos centésimos? Responda com a letra.", "alternativas": ["4,721", "0,002", "0,02", "0,2", "2"], "certa": 2, "explicacao": "c) 0,02"}, {"enunciado": "Quanto é 2<sup>5</sup>? Responda com a letra.", "alternativas": ["25", "64", "16", "32", "7"], "certa": 3, "explicacao": "d) 32"}, {"enunciado": "6 bolas custam R$ 78. Quanto custam 9 bolas iguais? Responda com a letra.", "alternativas": ["R$ 702", "R$ 104", "R$ 22", "R$ 81", "R$ 117"], "certa": 4, "explicacao": "e) R$ 117"}, {"enunciado": "Leia: “A expressão (45 − 15) ÷ 6 + 3 × 4 dá 17.” Nessa frase, <b>expressão</b> quer dizer… Responda com a letra.", "alternativas": ["na Matemática, uma conta com várias operações", "uma cara feita para mostrar o que sente", "o plano do dinheiro que entra e do que vai ser gasto", "o resultado da subtração", "mil milhões: o 1 seguido de 9 zeros"], "certa": 0, "explicacao": "a) na Matemática, uma conta com várias operações. Não é “uma cara feita para mostrar o que sente”: essa é a pegadinha."}, {"enunciado": "Como se escreve “oitenta e seis bilhões setenta e dois mil e noventa e sete” com algarismos? Responda com a letra.", "alternativas": ["86.000.072.097", "86.000.072", "867.297", "86.072.000.097", "95.000.072.097"], "certa": 0, "explicacao": "a) 86.000.072.097"}, {"enunciado": "Quanto vale o algarismo 1 no número 8.512.689.808? Responda com a letra.", "alternativas": ["1.000.000", "12.689.808", "1", "100.000.000", "10.000.000"], "certa": 4, "explicacao": "e) 10.000.000"}, {"enunciado": "Um retângulo tem área de 42 m² e um dos lados mede 6 m. Quanto mede o outro lado? Responda com a letra.", "alternativas": ["7 m", "36 m", "21 m", "42 m", "8 m"], "certa": 0, "explicacao": "a) 7 m"}, {"enunciado": "Num desenho, 10 retas se cruzam: não há duas paralelas e nunca três passam pelo mesmo ponto. Quantos pontos de cruzamento há? Responda com a letra.", "alternativas": ["20", "45", "90", "10", "55"], "certa": 1, "explicacao": "b) 45"}, {"enunciado": "Leia: “A cidade gastou um bilhão de reais: R$ 1.000.000.000.” Nessa frase, <b>bilhão</b> quer dizer… Responda com a letra.", "alternativas": ["os sinais [ ] que agrupam contas e são resolvidos depois dos parênteses", "a parte de um grupo escolhida para responder a uma pesquisa", "o número que, multiplicado por ele mesmo, dá o número dado", "mil milhões: o 1 seguido de 9 zeros", "um milhão de milhões"], "certa": 3, "explicacao": "d) mil milhões: o 1 seguido de 9 zeros. Não é “um milhão de milhões”: essa é a pegadinha."}, {"enunciado": "Na sequência 1,2; 1,45; 1,7; 1,95; …, qual é o 8º termo? Responda com a letra.", "alternativas": ["9,6", "2,95", "2,7", "2", "3,05"], "certa": 1, "explicacao": "b) 2,95"}, {"enunciado": "Na votação do representante de turma, 36 alunos votaram e Lívia recebeu 21 votos. Que fração dos votos Lívia recebeu, na forma mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>12</span></span>", "<span class=\"fr\"><span>21</span><span>36</span></span>", "<span class=\"fr\"><span>7</span><span>12</span></span>", "<span class=\"fr\"><span>36</span><span>21</span></span>", "<span class=\"fr\"><span>21</span><span>15</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>7</span><span>12</span></span>"}, {"enunciado": "O carro gastou 3 <span class=\"fr\"><span>1</span><span>5</span></span> tanques de combustível no mês. Escrito como uma fração só, isso é: Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>8</span><span>5</span></span>", "<span class=\"fr\"><span>16</span><span>15</span></span>", "<span class=\"fr\"><span>15</span><span>5</span></span>", "<span class=\"fr\"><span>16</span><span>5</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>16</span><span>5</span></span>"}, {"enunciado": "Qual é o MDC de 10 e 46? Responda com a letra.", "alternativas": ["1", "36", "2", "10", "230"], "certa": 2, "explicacao": "c) 2"}, {"enunciado": "O que quer dizer <b>colchetes</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 10 partes iguais de um inteiro", "sólido com duas bases iguais e paralelas e faces laterais retangulares", "os sinais que deixam um número negativo", "os sinais [ ] que agrupam contas e são resolvidos depois dos parênteses", "o tempo que passa entre dois momentos"], "certa": 3, "explicacao": "d) os sinais [ ] que agrupam contas e são resolvidos depois dos parênteses. Não é “os sinais que deixam um número negativo”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisível por 9? Responda com a letra.", "alternativas": ["1.338", "4.203", "9.869", "4.819", "5.896"], "certa": 1, "explicacao": "b) 4.203"}, {"enunciado": "Um aquário mede 40 cm × 30 cm × 40 cm. Sabendo que 1.000 cm³ = 1 litro, quantos litros cabem nele? Responda com a letra.", "alternativas": ["1,2 L", "48.000 L", "48 L", "4,8 L", "480 L"], "certa": 2, "explicacao": "c) 48 L"}, {"enunciado": "Para uma feira de ciências, Bianca montou o esqueleto de uma pirâmide de base quadrada com canudos de 8 cm, um em cada aresta. Quantos centímetros de canudo usou? Responda com a letra.", "alternativas": ["64 cm", "32 cm", "96 cm", "16 cm", "40 cm"], "certa": 0, "explicacao": "a) 64 cm"}, {"enunciado": "Num gráfico de setores de uma pesquisa com 80 pessoas, futebol tem 50%, vôlei 25% e natação o resto. Quantas pessoas preferem natação? Responda com a letra.", "alternativas": ["60", "20", "26", "25", "40"], "certa": 1, "explicacao": "b) 20"}, {"enunciado": "O que quer dizer <b>simplificar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["perto de, mais ou menos", "escrever a fração com números menores, sem mudar o valor", "o que é igual para todos os números comparados", "duas vezes o número", "deixar a conta mais curta trocando o resultado"], "certa": 1, "explicacao": "b) escrever a fração com números menores, sem mudar o valor. Não é “deixar a conta mais curta trocando o resultado”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisor de 32? Responda com a letra.", "alternativas": ["11", "16", "96", "3", "64"], "certa": 1, "explicacao": "b) 16"}, {"enunciado": "Qual é o MMC de 4 e 46? Responda com a letra.", "alternativas": ["50", "184", "46", "2", "92"], "certa": 4, "explicacao": "e) 92"}, {"enunciado": "Um café vem em pacote de 500 g por R$ 6 ou em pacote de 1 kg por R$ 5. Qual sai mais barato por quilo? Responda com a letra.", "alternativas": ["não dá para comparar", "o mais pesado sempre", "o pacote de 500 g", "os dois saem iguais", "o pacote de 1 kg"], "certa": 4, "explicacao": "e) o pacote de 1 kg"}, {"enunciado": "Num cofrinho há 7 moedas de 5 centavos, 11 de 10, 8 de 25 e 2 de 50 centavos. Quanto dinheiro há? Responda com a letra.", "alternativas": ["R$ 28,00", "R$ 44,50", "R$ 5,45", "R$ 3,45", "R$ 4,45"], "certa": 4, "explicacao": "e) R$ 4,45"}, {"enunciado": "Leia: “O ano 1900 ainda faz parte do século XIX.” Nessa frase, <b>século</b> quer dizer… Responda com a letra.", "alternativas": ["o mesmo sentido em que giram os ponteiros do relógio", "um período de 1.000 anos", "a fração que vale 1 inteiro ou mais", "a coisa toda, sem faltar nenhuma parte", "um período de 100 anos"], "certa": 4, "explicacao": "e) um período de 100 anos. Não é “um período de 1.000 anos”: essa é a pegadinha."}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Um tanque mede 8 m por 2 m por 2 m. Quantos litros cabem nele? Responda com a letra.", "alternativas": ["16.000 L", "12.000 L", "32.000 L", "32.000.000 L", "3.200 L"], "certa": 2, "explicacao": "c) 32.000 L"}, {"enunciado": "Como se escreve 3.900 em algarismos romanos? Responda com a letra.", "alternativas": ["MMMMC", "MMMCM", "MMMCMI", "MMMDCCC", "MMMDCCCC"], "certa": 1, "explicacao": "b) MMMCM"}, {"enunciado": "Quanto é 9 × 8 − 5 × 5? Responda com a letra.", "alternativas": ["42", "335", "62", "135", "47"], "certa": 4, "explicacao": "e) 47"}, {"enunciado": "Gabriela caminhou <span class=\"fr\"><span>3</span><span>4</span></span> de hora e depois correu 50 minutos. Qual a diferença entre os dois tempos? Responda com a letra.", "alternativas": ["95 minutos", "45 minutos", "47 minutos", "35 minutos", "5 minutos"], "certa": 4, "explicacao": "e) 5 minutos"}, {"enunciado": "O que quer dizer <b>critério</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dois números, em ordem, que dão o endereço de um ponto no plano", "a divisão de alguma coisa entre pessoas", "uma regra que serve para decidir alguma coisa", "o número que está sendo dividido", "uma conta de dividir bem grande"], "certa": 2, "explicacao": "c) uma regra que serve para decidir alguma coisa. Não é “uma conta de dividir bem grande”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
