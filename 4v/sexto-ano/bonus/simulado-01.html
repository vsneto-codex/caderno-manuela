<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Yasmin comeu <span class=\"fr\"><span>9</span><span>25</span></span> de uma barra de chocolate. Que número decimal representa essa parte? Responda com a letra.", "alternativas": ["0,9", "3,4", "0,036", "0,36", "0,25"], "certa": 3, "explicacao": "d) 0,36"}, {"enunciado": "A costureira usou <span class=\"fr\"><span>10</span><span>3</span></span> rolos de fita na fantasia. Quantos rolos inteiros ela usou? Responda com a letra.", "alternativas": ["1", "2", "3", "10", "4"], "certa": 2, "explicacao": "c) 3"}, {"enunciado": "Helena achou este problema num caderno de desafios e levou para a turma. Um pedaço de tecido tem 3,6 m de comprimento e cada metro custa R$ 5,70. Quanto custa o pedaço, em reais? Responda com a letra.", "alternativas": ["205,2", "9,3", "20,52", "15,42", "2,052"], "certa": 2, "explicacao": "c) 20,52"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Uma parede de 0,9 m por 0,9 m vai ser coberta com azulejos quadrados de 15 cm de lado. Quantos azulejos? Responda com a letra.", "alternativas": ["12", "36", "0", "72", "30"], "certa": 1, "explicacao": "b) 36"}, {"enunciado": "Leia: “Em <span class=\"fr\"><span>3</span><span>8</span></span>, o denominador é 8.” Nessa frase, <b>denominador</b> quer dizer… Responda com a letra.", "alternativas": ["a comparação de duas quantidades por divisão", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "cada uma das 100 partes iguais de um inteiro", "a fração que vale 1 inteiro ou mais", "o número de cima da fração"], "certa": 1, "explicacao": "b) o número de baixo da fração: em quantas partes iguais o inteiro foi dividido. Não é “o número de cima da fração”: essa é a pegadinha."}, {"enunciado": "Qual é a decomposição de 2.376 em fatores primos? Responda com a letra.", "alternativas": ["2 × 3 × 11", "2<sup>3</sup> × 3<sup>3</sup> × 11", "2<sup>4</sup> × 3<sup>3</sup> × 11", "2<sup>3</sup> × 297", "2<sup>2</sup> × 3<sup>3</sup> × 11"], "certa": 1, "explicacao": "b) 2<sup>3</sup> × 3<sup>3</sup> × 11"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Numa gincana, as equipes juntaram 34,2 kg, 0,871 kg e 23 kg de alimentos. Quantos quilos juntaram ao todo? Responda com a letra.", "alternativas": ["58,071", "1,236", "57,971", "59,071", "37,371"], "certa": 0, "explicacao": "a) 58,071"}, {"enunciado": "Um ônibus anda 80 km por hora e saiu às 9h22 para uma viagem de 160 km. A que horas chega? Responda com a letra.", "alternativas": ["11h52", "10h42", "10h22", "11h22", "12h22"], "certa": 3, "explicacao": "d) 11h22"}, {"enunciado": "Bruno achou este problema num caderno de desafios e levou para a turma. Um ginásio tem 300 lugares. Quanto é 35% desse total? Faça de cabeça, pelo 10%. Responda com a letra.", "alternativas": ["105", "8,571428571428571428571428571", "195", "30", "1.050"], "certa": 0, "explicacao": "a) 105"}, {"enunciado": "O que quer dizer <b>crescente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["do menor para o maior", "duas expressões que valem o mesmo, ligadas pelo sinal =", "do maior para o menor", "um número com exatamente dois divisores: o 1 e ele mesmo", "uma regra que serve para decidir alguma coisa"], "certa": 0, "explicacao": "a) do menor para o maior. Não é “do maior para o menor”: essa é a pegadinha."}, {"enunciado": "Numa promoção de 10% de desconto, uma pessoa pagou R$ 126,00 num relógio. Qual era o preço sem desconto? Responda com a letra.", "alternativas": ["R$ 138,60", "R$ 252,00", "R$ 136,00", "R$ 126,00", "R$ 140,00"], "certa": 4, "explicacao": "e) R$ 140,00"}, {"enunciado": "Pedro achou este problema num caderno de desafios e levou para a turma. Um aquário com fundo de 40 cm por 40 cm recebeu 25,6 L de água. Que altura a água alcança? Responda com a letra.", "alternativas": ["16 cm", "160 cm", "17 cm", "1,6 cm", "25.600 cm"], "certa": 0, "explicacao": "a) 16 cm"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Felipe tinha 3 minutos para responder. Cada câmera de um prédio vigia um ângulo de 120°. Qual é o menor número de câmeras, presas no mesmo poste, para vigiar a volta inteira? Responda com a letra.", "alternativas": ["3", "4", "1", "240", "12"], "certa": 0, "explicacao": "a) 3"}, {"enunciado": "Numa feira de ciências, num gráfico de colunas, cada quadradinho vale 2. As colunas têm segunda: 7 quadradinhos, terça: 4 quadradinhos, quarta: 2 quadradinhos, quinta: 2 quadradinhos. Qual é o valor de segunda? Responda com a letra.", "alternativas": ["14", "7", "30", "8", "16"], "certa": 0, "explicacao": "a) 14"}, {"enunciado": "O que quer dizer <b>duração</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a casa que um algarismo ocupa no número", "o quadrilátero que tem 2 pares de lados paralelos", "a hora em que algo começa", "o número de cima da fração: quantas partes foram pegas", "quanto tempo algo dura, do começo ao fim"], "certa": 4, "explicacao": "e) quanto tempo algo dura, do começo ao fim. Não é “a hora em que algo começa”: essa é a pegadinha."}, {"enunciado": "Quanto é 17.157 ÷ 19? Responda com a letra.", "alternativas": ["93", "930", "903", "9.003", "90"], "certa": 2, "explicacao": "c) 903"}, {"enunciado": "Bianca e Thiago repartiram 176 cartas, e Bianca ficou com o triplo do que Thiago ficou. Com quantas Bianca ficou? Responda com a letra.", "alternativas": ["88", "133", "132", "58", "44"], "certa": 2, "explicacao": "c) 132"}, {"enunciado": "Numa empresa, 35% das pessoas preferem praia, 32% preferem campo e as outras preferem cidade. Que porcentagem prefere cidade? Responda com a letra.", "alternativas": ["3%", "33%", "43%", "67%", "65%"], "certa": 1, "explicacao": "b) 33%"}, {"enunciado": "Num aplicativo de mapa, uma placa tem a forma de um losango com lados de 11 cm. Quanto mede o contorno da placa? Responda com a letra.", "alternativas": ["55 cm", "46 cm", "44 cm", "121 cm", "22 cm"], "certa": 2, "explicacao": "c) 44 cm"}, {"enunciado": "O que quer dizer <b>decrescente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["do maior para o menor", "a fração que não dá mais para simplificar", "do menor para o maior", "cada resultado que pode acontecer", "cópia maior de uma figura, com todas as medidas multiplicadas pelo mesmo número"], "certa": 0, "explicacao": "a) do maior para o menor. Não é “do menor para o maior”: essa é a pegadinha."}, {"enunciado": "Uma mesa retangular mede 2,2 m por 43 cm. Qual é o perímetro do tampo, em centímetros? Responda com a letra.", "alternativas": ["9.460 cm", "130 cm", "5,26 cm", "526 cm", "263 cm"], "certa": 3, "explicacao": "d) 526 cm"}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["39", "43", "121", "161", "49"], "certa": 1, "explicacao": "b) 43"}, {"enunciado": "Clara já colou 8 das 14 figurinhas do álbum. Que fração do álbum já foi colada, na forma mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>14</span></span>", "<span class=\"fr\"><span>7</span><span>4</span></span>", "<span class=\"fr\"><span>8</span><span>14</span></span>", "<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>5</span><span>7</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>4</span><span>7</span></span>"}, {"enunciado": "Leia: “O preço do pão é proporcional à quantidade: 2 pães custam o dobro de 1.” Nessa frase, <b>proporcional</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "um período de 100 anos", "que cresce sempre de 1 em 1", "que cresce ou diminui na mesma razão que outra grandeza"], "certa": 4, "explicacao": "e) que cresce ou diminui na mesma razão que outra grandeza. Não é “que cresce sempre de 1 em 1”: essa é a pegadinha."}, {"enunciado": "6 litros de suco iguais vão ser repartidos igualmente entre 7 garrafas. Quanto cada garrafa recebe? Responda com a letra.", "alternativas": ["[-1/7]", "<span class=\"fr\"><span>7</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>13</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>6</span><span>7</span></span>"}, {"enunciado": "Quantos divisores tem o número 54? Responda com a letra.", "alternativas": ["4", "8", "7", "9", "6"], "certa": 1, "explicacao": "b) 8"}, {"enunciado": "Num sorteio da turma, joga-se um dado comum. Qual é a chance de sair um número par? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>4</span><span>6</span></span>", "<span class=\"fr\"><span>3</span><span>12</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>3</span><span>6</span></span>"}, {"enunciado": "Qual é o valor de (7 + 9)<sup>2</sup> − 15? Responda com a letra.", "alternativas": ["238", "1", "17", "241", "73"], "certa": 3, "explicacao": "d) 241"}, {"enunciado": "O que quer dizer <b>aproximadamente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o mesmo sentido em que giram os ponteiros do relógio", "que cruza outra reta formando um ângulo reto", "exatamente, sem errar nada", "uma ação repetida várias vezes para ver o que acontece", "perto de, mais ou menos"], "certa": 4, "explicacao": "e) perto de, mais ou menos. Não é “exatamente, sem errar nada”: essa é a pegadinha."}, {"enunciado": "Qual é a decomposição de 3.993 em fatores primos? Responda com a letra.", "alternativas": ["3 × 11", "3 × 1.331", "3<sup>3</sup> × 11", "3 × 11<sup>3</sup>", "3 × 11<sup>2</sup>"], "certa": 3, "explicacao": "d) 3 × 11<sup>3</sup>"}];
const CHAVE='simulado-bonus-mat-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
