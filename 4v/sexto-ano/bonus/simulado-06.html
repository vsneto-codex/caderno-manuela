<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quantos divisores tem o número 186? Responda com a letra.", "alternativas": ["7", "9", "6", "4", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Qual é o MDC de 8 e 44? Responda com a letra.", "alternativas": ["36", "8", "4", "2", "88"], "certa": 2, "explicacao": "c) 4"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Gael tinha 3 minutos para responder. Numa pesquisa com 44 alunos, 25 eram meninas. 9 meninos disseram que gostam de xadrez. Quantos meninos disseram que não gostam? Responda com a letra.", "alternativas": ["11", "19", "35", "9", "10"], "certa": 4, "explicacao": "e) 10"}, {"enunciado": "Na receita, João precisa de <span class=\"fr\"><span>5</span><span>16</span></span> de litro de leite, mas o copo medidor só mostra decimais. Qual número deve aparecer no copo? Responda com a letra.", "alternativas": ["3,2", "3,125", "0,3", "5,16", "0,3125"], "certa": 4, "explicacao": "e) 0,3125"}, {"enunciado": "Leia: “<span class=\"fr\"><span>1</span><span>2</span></span> e <span class=\"fr\"><span>2</span><span>4</span></span> são frações equivalentes.” Nessa frase, <b>equivalentes</b> quer dizer… Responda com a letra.", "alternativas": ["que tem os mesmos números", "o quanto existe de alguma coisa, contado ou medido", "o par de números que diz onde um ponto está", "que vale o mesmo", "uma regra que serve para decidir alguma coisa"], "certa": 3, "explicacao": "d) que vale o mesmo. Não é “que tem os mesmos números”: essa é a pegadinha."}, {"enunciado": "Um desenho de 8 cm por 3 cm foi ampliado 4 vezes. Quais são as novas medidas? Responda com a letra.", "alternativas": ["96 cm por 96 cm", "32 cm por 12 cm", "12 cm por 7 cm", "32 cm por 3 cm", "128 cm por 48 cm"], "certa": 1, "explicacao": "b) 32 cm por 12 cm"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Quanto vale a expressão <span class=\"fr\"><span>3</span><span>5</span></span> + 4,3 × 3? Responda com a letra.", "alternativas": ["13,5", "16,4", "14,5", "6,1", "7,9"], "certa": 0, "explicacao": "a) 13,5"}, {"enunciado": "Valentina achou este problema num caderno de desafios e levou para a turma. Valentina mediu um cano: 2,5 m. Quanto é isso em centímetros? Responda com a letra.", "alternativas": ["250 cm", "0,025 cm", "2.500 cm", "25 cm", "102,5 cm"], "certa": 0, "explicacao": "a) 250 cm"}, {"enunciado": "Cecília já leu 5 das 30 páginas do livro. Que fração do livro já foi lida, na forma mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>1</span></span>", "<span class=\"fr\"><span>25</span><span>30</span></span>", "<span class=\"fr\"><span>2</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>30</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>1</span><span>6</span></span>"}, {"enunciado": "Leia: “Comprou por R$ 20 e vendeu por R$ 35: o lucro foi de R$ 15.” Nessa frase, <b>lucro</b> quer dizer… Responda com a letra.", "alternativas": ["cada número que se soma numa adição (ou cada pagamento de uma compra a prazo)", "o que se ganha a mais: o preço de venda menos o que custou", "todo o dinheiro recebido na venda", "sólido com duas bases iguais e paralelas e faces laterais retangulares", "mil milhões: o 1 seguido de 9 zeros"], "certa": 1, "explicacao": "b) o que se ganha a mais: o preço de venda menos o que custou. Não é “todo o dinheiro recebido na venda”: essa é a pegadinha."}, {"enunciado": "Uma caixa tem 5 cubinhos de comprimento, 4 de largura e 2 de altura. Quantos cubinhos cabem? Responda com a letra.", "alternativas": ["76 cubinhos", "11 cubinhos", "45 cubinhos", "40 cubinhos", "20 cubinhos"], "certa": 3, "explicacao": "d) 40 cubinhos"}, {"enunciado": "Júlia achou este problema num caderno de desafios e levou para a turma. Qual é o menor número natural pelo qual se deve multiplicar 1.800 para obter um quadrado perfeito? Responda com a letra.", "alternativas": ["4", "2", "60", "1800", "30"], "certa": 1, "explicacao": "b) 2"}, {"enunciado": "A chuva de três meses foi: janeiro, 241,1 mm; fevereiro, 198,3 mm; março, 321,8 mm. Qual é a diferença entre o mês mais chuvoso e o menos chuvoso? Responda com a letra.", "alternativas": ["123,5", "124,5", "761,2", "520,1", "321,8"], "certa": 0, "explicacao": "a) 123,5"}, {"enunciado": "Leia: “O comprimento da mesa é 1,5 m.” Nessa frase, <b>comprimento</b> quer dizer… Responda com a letra.", "alternativas": ["a medida de quanto um objeto pesa, em gramas, quilos ou toneladas", "os sinais [ ] que agrupam contas e são resolvidos depois dos parênteses", "o peso de um objeto", "a medida de uma ponta à outra", "a propriedade de trocar a ordem dos números sem mudar o resultado"], "certa": 3, "explicacao": "d) a medida de uma ponta à outra. Não é “o peso de um objeto”: essa é a pegadinha."}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Um trem noturno saiu às 20h25 e chegou às 5h10 do dia seguinte. Quanto tempo durou a viagem? Responda com a letra.", "alternativas": ["5 h 10 min", "8 h 45 min", "9 h 45 min", "15 h 15 min", "3 h 35 min"], "certa": 1, "explicacao": "b) 8 h 45 min"}, {"enunciado": "Elisa achou este problema num caderno de desafios e levou para a turma. Um quarto tem 5 m por 4 m. Cada caixa de piso cobre 3 m², e não se vende meia caixa. Qual é o menor número de caixas para cobrir o chão? Responda com a letra.", "alternativas": ["6", "60", "7", "20", "8"], "certa": 2, "explicacao": "c) 7"}, {"enunciado": "Com palitos, forma-se uma fila de quadrados grudados, um ao lado do outro (cada novo usa o lado do anterior). Quantos palitos são necessários para 20 quadrados? Responda com a letra.", "alternativas": ["80", "58", "61", "62", "60"], "certa": 2, "explicacao": "c) 61"}, {"enunciado": "Como se escreve 791 em algarismos romanos? Responda com a letra.", "alternativas": ["DCCCI", "DCCXCII", "DCCLXXXXI", "DCCXCI", "DCCCXI"], "certa": 3, "explicacao": "d) DCCXCI"}, {"enunciado": "Leia: “O intervalo entre 8h50 e 12h15 é de 3 h 25 min.” Nessa frase, <b>intervalo</b> quer dizer… Responda com a letra.", "alternativas": ["desenho de uma construção vista de cima, em escala", "cada parte de um problema, resolvida uma de cada vez", "a hora em que algo começa", "o tempo que passa entre dois momentos", "o menor de todos"], "certa": 3, "explicacao": "d) o tempo que passa entre dois momentos. Não é “a hora em que algo começa”: essa é a pegadinha."}, {"enunciado": "Uma conta de restaurante de R$ 108,42 foi dividida igualmente entre 6 amigos. Quanto pagou cada um? Responda com a letra.", "alternativas": ["R$ 180,70", "R$ 18,07", "R$ 1,81", "R$ 102,42", "R$ 19,07"], "certa": 1, "explicacao": "b) R$ 18,07"}, {"enunciado": "Num quadro de 100 quadradinhos (10 linhas de 10), foram pintadas 1 linhas inteiras e mais 2 quadradinhos. Que porcentagem foi pintada? Responda com a letra.", "alternativas": ["12%", "10%", "21%", "88%", "2%"], "certa": 0, "explicacao": "a) 12%"}, {"enunciado": "João quer juntar R$ 3.109 e guarda R$ 195 por mês. Em quantos meses junta o dinheiro? Responda com a letra.", "alternativas": ["15 meses", "30 meses", "16 meses", "184 meses", "17 meses"], "certa": 2, "explicacao": "c) 16 meses"}, {"enunciado": "Ana tinha um saquinho com 24 balas e comeu 8. Que fração dos balas sobrou? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>24</span><span>16</span></span>", "<span class=\"fr\"><span>16</span><span>24</span></span>", "<span class=\"fr\"><span>16</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>16</span></span>", "<span class=\"fr\"><span>8</span><span>24</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>16</span><span>24</span></span>"}, {"enunciado": "O que quer dizer <b>comutativa</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quadrilátero com só 1 par de lados paralelos", "a comparação de duas quantidades por divisão", "a propriedade de trocar a ordem dos números sem mudar o resultado", "um número com exatamente dois divisores: o 1 e ele mesmo", "a propriedade de trocar o sinal da conta"], "certa": 2, "explicacao": "c) a propriedade de trocar a ordem dos números sem mudar o resultado. Não é “a propriedade de trocar o sinal da conta”: essa é a pegadinha."}, {"enunciado": "Qual destes números é primo? Responda com a letra.", "alternativas": ["151", "209", "171", "203", "247"], "certa": 0, "explicacao": "a) 151"}, {"enunciado": "Quanto é 23.785.668 arredondado para o milhão mais próximo? Responda com a letra.", "alternativas": ["23.700.000", "20.000.000", "23.000.000", "24.000.000", "23.800.000"], "certa": 3, "explicacao": "d) 24.000.000"}, {"enunciado": "Enzo achou este problema num caderno de desafios e levou para a turma. Três lojas dão desconto no mesmo produto: Loja A: <span class=\"fr\"><span>3</span><span>4</span></span> do preço; Loja B: <span class=\"fr\"><span>1</span><span>5</span></span> do preço; Loja C: <span class=\"fr\"><span>1</span><span>6</span></span> do preço. Em qual loja o desconto é maior? Responda com a letra.", "alternativas": ["Loja B", "a que tem o maior número de baixo", "Loja A", "Loja C", "as três dão o mesmo desconto"], "certa": 2, "explicacao": "c) Loja A"}, {"enunciado": "Quanto é √576? Responda com a letra.", "alternativas": ["288", "24", "331.776", "23", "25"], "certa": 1, "explicacao": "b) 24"}, {"enunciado": "Leia: “O antecessor de 40.000 é 39.999.” Nessa frase, <b>antecessor</b> quer dizer… Responda com a letra.", "alternativas": ["o número que vem logo antes", "a casa que um algarismo ocupa no número", "a coisa toda, sem faltar nenhuma parte", "tabela que cruza duas informações, uma nas linhas e outra nas colunas", "o número que vem logo depois"], "certa": 0, "explicacao": "a) o número que vem logo antes. Não é “o número que vem logo depois”: essa é a pegadinha."}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Numa promoção de 20% de desconto, uma pessoa pagou R$ 480,00 num relógio. Qual era o preço sem desconto? Responda com a letra.", "alternativas": ["R$ 576,00", "R$ 960,00", "R$ 600,00", "R$ 500,00", "R$ 384,00"], "certa": 2, "explicacao": "c) R$ 600,00"}];
const CHAVE='simulado-bonus-mat-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
