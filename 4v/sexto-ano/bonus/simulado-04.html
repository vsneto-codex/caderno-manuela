<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Matemática 6º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Matemática 6º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é √841? Responda com a letra.", "alternativas": ["58", "30", "420", "29", "28"], "certa": 3, "explicacao": "d) 29"}, {"enunciado": "Um caminhão carrega até 11,5 t. Quantos sacos de cimento de 50 kg ele leva, no máximo? Responda com a letra.", "alternativas": ["460", "11.450", "230", "2.300", "23"], "certa": 2, "explicacao": "c) 230"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Igor tinha 3 minutos para responder. Um xarope de 260 mL é tomado 2 vezes por dia, 10 mL de cada vez. Dura quantos dias? Responda com a letra.", "alternativas": ["2", "26", "130", "13", "12"], "certa": 3, "explicacao": "d) 13"}, {"enunciado": "Elisa achou este problema num caderno de desafios e levou para a turma. Na pesquisa da escola, 0,3125 dos alunos disseram que preferem futebol. Que fração dos alunos, na forma mais simples, prefere futebol? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3125</span><span>1000</span></span>", "<span class=\"fr\"><span>5</span><span>16</span></span>", "<span class=\"fr\"><span>5</span><span>17</span></span>", "<span class=\"fr\"><span>3125</span><span>4</span></span>", "<span class=\"fr\"><span>6</span><span>16</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>5</span><span>16</span></span>"}, {"enunciado": "Leia: “O produto de 3,6 por 2,5 é 9.” Nessa frase, <b>produto</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado de uma multiplicação", "o quadrilátero que tem 2 pares de lados paralelos", "o valor a mais que se paga por usar o dinheiro no tempo (parcelar ou pegar emprestado)", "o resultado de uma soma", "o mesmo sentido em que giram os ponteiros do relógio"], "certa": 0, "explicacao": "a) o resultado de uma multiplicação. Não é “o resultado de uma soma”: essa é a pegadinha."}, {"enunciado": "Numa gincana de raciocínio, a equipe de Laura tinha 3 minutos para responder. Qual é o melhor tipo de gráfico para mostrar o número de alunos de cada turma? Responda com a letra.", "alternativas": ["gráfico de colunas", "gráfico de linha", "tabela de dupla entrada", "pictograma", "gráfico de setores"], "certa": 0, "explicacao": "a) gráfico de colunas"}, {"enunciado": "Quanto é 4.700 × 200? Responda com a letra.", "alternativas": ["940.000", "9.400", "94", "9.400.000", "94.000"], "certa": 0, "explicacao": "a) 940.000"}, {"enunciado": "Qual destes números é divisível por 8? Responda com a letra.", "alternativas": ["2.428", "7.628", "3.908", "1.352", "7.342"], "certa": 3, "explicacao": "d) 1.352"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Pedro tinha 3 minutos para responder. Ana já pintou <span class=\"fr\"><span>7</span><span>8</span></span> do muro e Beto, <span class=\"fr\"><span>11</span><span>12</span></span> de outro muro igual. Quem está mais perto de terminar? Responda com a letra.", "alternativas": ["Beto", "Ana", "nenhum dos dois", "não dá para saber", "quem tem o menor número de baixo"], "certa": 0, "explicacao": "a) Beto"}, {"enunciado": "Leia: “Na conta 4 × <span class=\"fr\"><span>2</span><span>9</span></span>, o 4 é um número natural.” Nessa frase, <b>natural</b> quer dizer… Responda com a letra.", "alternativas": ["algo que vem da natureza", "uma ação repetida várias vezes para ver o que acontece", "o ponto onde dois lados (ou arestas) se encontram", "um dos números 0, 1, 2, 3, 4…", "o resultado de juntar tudo"], "certa": 3, "explicacao": "d) um dos números 0, 1, 2, 3, 4…. Não é “algo que vem da natureza”: essa é a pegadinha."}, {"enunciado": "Num cofrinho há 8 moedas de 5 centavos, 10 de 10, 11 de 25 e 11 de 50 centavos. Quanto dinheiro há? Responda com a letra.", "alternativas": ["R$ 10,65", "R$ 40,00", "R$ 4,15", "R$ 9,65", "R$ 96,50"], "certa": 3, "explicacao": "d) R$ 9,65"}, {"enunciado": "Com quadradinhos, a figura 1 tem 13, a figura 2 tem 20 e a figura 3 tem 27. Seguindo assim, quantos quadradinhos tem a figura 31? Responda com a letra.", "alternativas": ["217", "403", "216", "223", "230"], "certa": 3, "explicacao": "d) 223"}, {"enunciado": "Qual é o MMC de 4 e 38? Responda com a letra.", "alternativas": ["42", "76", "2", "38", "152"], "certa": 1, "explicacao": "b) 76"}, {"enunciado": "Rafaela achou este problema num caderno de desafios e levou para a turma. Um ingresso de R$ 1.950 subiu 10% e, na semana seguinte, baixou 10%. Qual é o preço final? Responda com a letra.", "alternativas": ["R$ 1.950,00", "R$ 1.755,00", "R$ 1.920,50", "R$ 1.930,50", "R$ 2.145,00"], "certa": 3, "explicacao": "d) R$ 1.930,50"}, {"enunciado": "O que quer dizer <b>milésimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida do contorno de uma figura", "cada uma das 1.000 partes iguais de um inteiro", "um número que está na tabuada de outro", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "o número que vem depois do 999"], "certa": 1, "explicacao": "b) cada uma das 1.000 partes iguais de um inteiro. Não é “o número que vem depois do 999”: essa é a pegadinha."}, {"enunciado": "Num relatório, a medida de uma mesa foi escrita por extenso: “nove inteiros e dois centésimos metros”. Como fica esse número com algarismos? Responda com a letra.", "alternativas": ["902", "2,09", "9,002", "9,02", "9,2"], "certa": 3, "explicacao": "d) 9,02"}, {"enunciado": "Na linha do 6º A de uma tabela, 14 dos 40 alunos preferem vôlei. Que porcentagem do 6º A prefere vôlei? Responda com a letra.", "alternativas": ["17%", "40%", "26%", "14%", "35%"], "certa": 4, "explicacao": "e) 35%"}, {"enunciado": "Cada envelope tem 12 figurinhas. Há 17 figurinhas. Isso dá quantos envelopes, como número misto? Responda com a letra.", "alternativas": ["1 <span class=\"fr\"><span>5</span><span>12</span></span>", "2 <span class=\"fr\"><span>5</span><span>12</span></span>", "5 <span class=\"fr\"><span>1</span><span>12</span></span>", "1 <span class=\"fr\"><span>7</span><span>12</span></span>", "1 <span class=\"fr\"><span>5</span><span>17</span></span>"], "certa": 0, "explicacao": "a) 1 <span class=\"fr\"><span>5</span><span>12</span></span>"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Rafaela tinha 3 minutos para responder. Uma parede de 3,9 m por 2,1 m vai ser coberta com azulejos quadrados de 30 cm de lado. Quantos azulejos? Responda com a letra.", "alternativas": ["91", "20", "78", "40", "182"], "certa": 0, "explicacao": "a) 91"}, {"enunciado": "Leia: “O hexágono dos favos de mel é um polígono regular: 6 lados e 6 ângulos iguais.” Nessa frase, <b>polígono regular</b> quer dizer… Responda com a letra.", "alternativas": ["polígono com todos os lados iguais e todos os ângulos iguais", "o número de cima da fração: quantas partes foram pegas", "polígono que tem 4 lados", "um valor aproximado, achado com contas fáceis", "um dos números 0, 1, 2, 3, 4…"], "certa": 0, "explicacao": "a) polígono com todos os lados iguais e todos os ângulos iguais. Não é “polígono que tem 4 lados”: essa é a pegadinha."}, {"enunciado": "Na votação do livro do mês, 40 alunos votaram e Valentina recebeu 22 votos. Que fração dos votos Valentina recebeu, na forma mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>40</span><span>22</span></span>", "<span class=\"fr\"><span>22</span><span>18</span></span>", "<span class=\"fr\"><span>22</span><span>40</span></span>", "<span class=\"fr\"><span>11</span><span>20</span></span>", "<span class=\"fr\"><span>9</span><span>20</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>11</span><span>20</span></span>"}, {"enunciado": "Como se escreve “vinte e nove bilhões quarenta e seis milhões cinco mil e um” com algarismos? Responda com a letra.", "alternativas": ["29.005.046.001", "29.046.005.001", "38.046.005.001", "29.046.005.001.000", "294.651"], "certa": 1, "explicacao": "b) 29.046.005.001"}, {"enunciado": "Como se escreve 2.549 em algarismos romanos? Responda com a letra.", "alternativas": ["MMDXLVIII", "MMDXLXI", "MMDCXLIX", "MMDXLIX", "MMDLIX"], "certa": 3, "explicacao": "d) MMDXLIX"}, {"enunciado": "Numa gincana de raciocínio, a equipe de Vitor tinha 3 minutos para responder. 4 kg de feijão custam R$ 8. Quanto custam 11 kg? Responda com a letra.", "alternativas": ["R$ 2,00", "R$ 88,00", "R$ 15,00", "R$ 22,00", "R$ 24,00"], "certa": 3, "explicacao": "d) R$ 22,00"}, {"enunciado": "Leia: “O quadrado tem 2 diagonais.” Nessa frase, <b>diagonais</b> quer dizer… Responda com a letra.", "alternativas": ["de cada 100 (o sinal % quer dizer “por cento”)", "qualquer linha torta", "a fração que não dá mais para simplificar", "o segmento que liga dois vértices que não são vizinhos", "a fração que vale 1 inteiro ou mais"], "certa": 3, "explicacao": "d) o segmento que liga dois vértices que não são vizinhos. Não é “qualquer linha torta”: essa é a pegadinha."}, {"enunciado": "Numa aula de arte, uma figura de 4 lados tem 2 pares de lados paralelos, 4 cantos retos e lados que não são todos iguais. Qual é o nome mais exato dessa figura? Responda com a letra.", "alternativas": ["paralelogramo", "quadrado", "retângulo", "trapézio", "losango"], "certa": 2, "explicacao": "c) retângulo"}, {"enunciado": "Esta questão caiu numa olimpíada de Matemática. Uma luminária custa R$ 1.070 e está com 20% de desconto. Quanto se paga? Responda com a letra.", "alternativas": ["R$ 1.284,00", "R$ 856,00", "R$ 214,00", "R$ 85,60", "R$ 749,00"], "certa": 1, "explicacao": "b) R$ 856,00"}, {"enunciado": "Uma receita pede <span class=\"fr\"><span>3</span><span>4</span></span> de quilo de farinha, mas o medidor só tem marcas de <span class=\"fr\"><span>1</span><span>8</span></span> de quilo. Quantas marcas de <span class=\"fr\"><span>1</span><span>8</span></span> devem ser usadas? Responda com a letra.", "alternativas": ["3", "6", "8", "5", "7"], "certa": 1, "explicacao": "b) 6"}, {"enunciado": "Qual destas contas tem o MAIOR resultado? 7 × <span class=\"fr\"><span>3</span><span>4</span></span>; 5 × <span class=\"fr\"><span>3</span><span>5</span></span>; 3 × <span class=\"fr\"><span>2</span><span>3</span></span>; 8 × <span class=\"fr\"><span>1</span><span>3</span></span>; 2 × <span class=\"fr\"><span>1</span><span>5</span></span>. Responda com a letra.", "alternativas": ["8 × <span class=\"fr\"><span>1</span><span>3</span></span>", "2 × <span class=\"fr\"><span>1</span><span>5</span></span>", "3 × <span class=\"fr\"><span>2</span><span>3</span></span>", "5 × <span class=\"fr\"><span>3</span><span>5</span></span>", "7 × <span class=\"fr\"><span>3</span><span>4</span></span>"], "certa": 4, "explicacao": "e) 7 × <span class=\"fr\"><span>3</span><span>4</span></span>"}, {"enunciado": "O que quer dizer <b>par ordenado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "quem coletou ou publicou os dados de um gráfico ou tabela", "dois números, em ordem, que dão o endereço de um ponto no plano", "desenho de uma construção vista de cima, em escala", "dois números iguais escritos lado a lado"], "certa": 2, "explicacao": "c) dois números, em ordem, que dão o endereço de um ponto no plano. Não é “dois números iguais escritos lado a lado”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
