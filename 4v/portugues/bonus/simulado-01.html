<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “A planta murchou <b>porque</b> ficou sem água.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "o motivo", "por qual", "pois", "por qual motivo"], "certa": 3, "explicacao": "d) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>imigrante</b>? Responda com a letra.", "alternativas": ["quem sai do país", "ato de ceder", "soneca depois do almoço", "quem entra no país", "anular um direito"], "certa": 3, "explicacao": "d) quem entra no país — não confunda com “emigrante” (quem sai do país)."}, {"enunciado": "Como se diz o macho da <b>cobra</b>? Responda com a letra.", "alternativas": ["a cobra macho", "o cobro", "o cobra", "a cobrazinho", "o cobra macho"], "certa": 0, "explicacao": "a) a cobra macho — cobra é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["triste, melancólico", "ligado à vida simples e tranquila do campo", "que dá para acreditar, razoável", "rigoroso e sem luxo", "que fala pouco, de poucas palavras"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o indivíduo</b> é… Responda com a letra.", "alternativas": ["comum de dois", "epiceno", "tem feminino diferente (biforme)", "não tem gênero", "sobrecomum"], "certa": 4, "explicacao": "e) sobrecomum — o indivíduo serve para menino e menina, sem mudar nada."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jiboia", "papéis", "juiz", "países", "assembléia"], "certa": 4, "explicacao": "e) assembléia — o certo é assembleia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o guaraná", "a couve", "a foto", "o mapa", "o cal"], "certa": 4, "explicacao": "e) o cal — o certo é “a cal”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Atenção!</b> expressa? Responda com a letra.", "alternativas": ["advertência", "alívio", "chamado", "afastamento", "medo"], "certa": 0, "explicacao": "a) advertência"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "começar, provocar", "que traz boas notícias", "mínimo, o menor de todos", "onde é muito difícil viver"], "certa": 0, "explicacao": "a) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["A sopa estava quente, porém comi rapidinho.", "Lavei a louça e varri a cozinha.", "Plantamos a semente, logo nasceu uma árvore.", "Eu levo o bolo caso você leve o suco.", "Feche a janela, pois vai chover."], "certa": 4, "explicacao": "e) Feche a janela, pois vai chover."}, {"enunciado": "Qual é o plural de <b>abaixo-assinado</b>? Responda com a letra.", "alternativas": ["abaixos-assinado", "abaixo-assinados", "abaixo-assinadoes", "abaixo-assinado", "abaixos-assinados"], "certa": 1, "explicacao": "b) abaixo-assinados"}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Viaje para a praia!", "O cachorro e o gato tocaram violão?", "Que dia lindo!", "Esconda o presente!", "Felipe vendeu limonada."], "certa": 4, "explicacao": "e) Felipe vendeu limonada."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um amigo</b>? Responda com a letra.", "alternativas": ["Vossa Excelência", "Vossa Alteza", "você", "Vossa Majestade", "Vossa Santidade"], "certa": 2, "explicacao": "c) você"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "esfriar, perder a força", "desejo, vontade", "oportunidade, ocasião", "arrogância, ar de superioridade"], "certa": 3, "explicacao": "d) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["espirro", "honestidade", "preguiça", "riso", "dragão"], "certa": 4, "explicacao": "e) dragão — existe por si, mesmo que seja imaginário."}, {"enunciado": "Ontem ele ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["podia", "poderá", "podeu", "pode", "pôde"], "certa": 4, "explicacao": "e) pôde"}, {"enunciado": "Ontem eu ___ (verbo <b>advir</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["advim", "adviu", "advi", "adviru", "advei"], "certa": 0, "explicacao": "a) advim — advir segue vir: eu vim → eu advim."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "Alice estava meio confusa.", "Manuela ficou meia preocupada.", "Comprei meio quilo de uva.", "Bebi meia garrafa de água."], "certa": 2, "explicacao": "c) — o certo é “Manuela ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["duvidoso, suspeito", "preciso, feito com muito cuidado", "o público que assiste a um espetáculo", "digno de confiança, verdadeiro", "que traz boas notícias"], "certa": 3, "explicacao": "d) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Maceió</b> é… Responda com a letra.", "alternativas": ["maceioense", "marroquino", "argentino", "estadunidense", "amapaense"], "certa": 0, "explicacao": "a) maceioense"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente desenha muito bem.", "A gente brinca no parque.", "Nós cantamos no coral da escola.", "Nós estudamos juntos todo dia.", "A gente comemos muita fruta."], "certa": 4, "explicacao": "e) — o certo é “A gente come”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["vândalo", "príncipe", "discípulo", "máximo", "bênçãos"], "certa": 4, "explicacao": "e) bênçãos — bên-çãos: é paroxítona."}, {"enunciado": "— Psiu! Moça, esqueceu a sacola!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar dor", "mostrar alegria", "mostrar nojo", "pedir silêncio", "chamar alguém"], "certa": 4, "explicacao": "e) chamar alguém — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "espantado, sem reação", "que está pela metade", "confusão, situação enrolada", "que não toma partido, que é justo com todos os lados"], "certa": 4, "explicacao": "e) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "“O bebê tem pezinhos minúsculos.”<br>Que sentido tem <b>pezinhos</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "pressa", "admiração", "carinho", "tamanho"], "certa": 4, "explicacao": "e) tamanho"}, {"enunciado": "“Plantamos a semente, logo nasceu uma árvore.”<br>Qual conjunção pode ficar no lugar de <b>logo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porém", "contudo", "pois", "por isso", "já que"], "certa": 3, "explicacao": "d) por isso — as duas dão ideia de conclusão."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>alegre</b>? Responda com a letra.", "alternativas": ["contente", "empurrar", "triste", "chorar", "noite"], "certa": 2, "explicacao": "c) triste — cuidado: “contente” é sinônimo, não antônimo."}, {"enunciado": "Como se lê <b>século XV</b>? Responda com a letra.", "alternativas": ["15", "catorze", "dezesseis", "décimo quinto", "quinze"], "certa": 4, "explicacao": "e) quinze — depois do décimo, lê-se como cardinal."}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "sem cor, incolor", "sem nenhum machucado, ileso", "aliviar, diminuir (uma dor, um problema)", "intenso, enérgico"], "certa": 2, "explicacao": "c) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
