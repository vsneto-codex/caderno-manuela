<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “Não há <b>por que</b> correr: ainda é cedo.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "motivo para", "por qual", "por qual motivo", "o motivo"], "certa": 1, "explicacao": "b) motivo para — “não há por que” quer dizer “não há motivo para”: troque e veja que dá certo."}, {"enunciado": "O que quer dizer <b>cumprimento</b>? Responda com a letra.", "alternativas": ["quem entra no país", "saudação", "ato de ceder", "bebida", "medida"], "certa": 1, "explicacao": "b) saudação — não confunda com “comprimento” (medida)."}, {"enunciado": "Como se diz o macho da <b>pantera</b>? Responda com a letra.", "alternativas": ["o pantero", "o pantera", "a panterazinho", "o pantera macho", "a pantera macho"], "certa": 4, "explicacao": "e) a pantera macho — pantera é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "triste, melancólico", "oportunidade, ocasião", "que dá para acreditar, razoável", "que acontece fora de hora"], "certa": 0, "explicacao": "a) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a pantera</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "epiceno", "comum de dois", "não tem gênero"], "certa": 2, "explicacao": "c) epiceno — animal: a pantera macho / a pantera fêmea."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["voo", "papéis", "ítem", "heroico", "ruim"], "certa": 2, "explicacao": "c) ítem — o certo é item: paroxítona terminada em em ou ens não leva acento (item, itens, jovem)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o dia", "a derme", "a dinamite", "o guaraná", "o foto"], "certa": 4, "explicacao": "e) o foto — o certo é “a foto”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Socorro!</b> expressa? Responda com a letra.", "alternativas": ["pedido de silêncio", "decepção", "aplauso", "medo", "alegria"], "certa": 3, "explicacao": "d) medo"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["começar, provocar", "que arma truques para enganar", "confusão, situação enrolada", "vencer, controlar (um incêndio, uma crise)", "aliviar, diminuir (uma dor, um problema)"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["A ponte caiu, portanto tivemos de voltar.", "O filme era longo, contudo ninguém dormiu.", "Desligue a luz, porque vamos economizar energia.", "Eu levo o bolo se você levar o suco.", "O sol saiu e as flores abriram."], "certa": 4, "explicacao": "e) O sol saiu e as flores abriram."}, {"enunciado": "Qual é o plural de <b>vaivém</b>? Responda com a letra.", "alternativas": ["vaivémis", "os vaivém", "vaivémes", "vaivéms", "vaivéns"], "certa": 4, "explicacao": "e) vaivéns"}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["Pinte um quadro!", "Que bolo gostoso!", "Por que o cachorro e o gato pescaram no lago?", "Nossa, que frio!", "O irmão mais velho de Otávio desenhou um castelo."], "certa": 0, "explicacao": "a) Pinte um quadro!"}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>o presidente</b>? Responda com a letra.", "alternativas": ["Vossa Excelência", "Vossa Magnificência", "você", "Vossa Senhoria", "Vossa Reverendíssima"], "certa": 0, "explicacao": "a) Vossa Excelência"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["desejo, vontade", "o público que assiste a um espetáculo", "pouco, escasso", "oportunidade, ocasião", "nunca visto antes, extraordinário"], "certa": 3, "explicacao": "d) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["amor", "fada", "calor", "felicidade", "riso"], "certa": 1, "explicacao": "b) fada — existe por si, mesmo que seja imaginário."}, {"enunciado": "Ontem ele ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["disse", "diz", "dizeu", "dizia", "dirá"], "certa": 0, "explicacao": "a) disse"}, {"enunciado": "Ontem eu ___ (verbo <b>propor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["proponhei", "propôs", "propori", "propi", "propus"], "certa": 4, "explicacao": "e) propus — propor segue pôr: eu pus → eu propus."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "Lívia ficou meia nervosa.", "As portas estavam meio abertas.", "Alice estava meio preocupada.", "Comprei meio quilo de uva."], "certa": 1, "explicacao": "b) — o certo é “Lívia ficou meio nervosa”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "resistente (ao calor, a mudanças)", "duvidoso, suspeito", "defesa, elogio de uma ideia", "digno de confiança, verdadeiro"], "certa": 4, "explicacao": "e) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Quem nasce na <b>Irlanda</b> é… Responda com a letra.", "alternativas": ["colombiano", "irlandês", "aracajuano", "pessoense", "indiano"], "certa": 1, "explicacao": "b) irlandês"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente escrevemos cartas para a vovó.", "Nós desenhamos muito bem.", "A gente come muita fruta.", "A gente ajuda a vovó na cozinha.", "Nós assistimos ao jogo pela televisão."], "certa": 0, "explicacao": "a) — o certo é “A gente escreve”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["olhar", "herói", "excepcional", "balão", "melancia"], "certa": 4, "explicacao": "e) melancia — me-lan-ci-a: é paroxítona."}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["pedir silêncio", "chamar alguém", "mostrar nojo", "mostrar dor", "mostrar alegria"], "certa": 1, "explicacao": "b) chamar alguém — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "que passa num instante", "aliviar, diminuir (uma dor, um problema)", "confirmar, reforçar uma ideia", "que está pela metade"], "certa": 0, "explicacao": "a) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "“O bebê tem pezinhos minúsculos.”<br>Que sentido tem <b>pezinhos</b> nessa frase? Responda com a letra.", "alternativas": ["carinho", "desprezo", "tamanho", "admiração", "pressa"], "certa": 2, "explicacao": "c) tamanho"}, {"enunciado": "“Choveu, todavia fomos à praia.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["se", "e", "porque", "logo", "mas"], "certa": 4, "explicacao": "e) mas — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>acender</b>? Responda com a letra.", "alternativas": ["terminar", "esconder", "frio", "mentira", "apagar"], "certa": 4, "explicacao": "e) apagar"}, {"enunciado": "Como se lê <b>século XXI</b>? Responda com a letra.", "alternativas": ["vinte", "vigésimo primeiro", "21", "vinte e dois", "vinte e um"], "certa": 4, "explicacao": "e) vinte e um — depois do décimo, lê-se como cardinal."}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece por acaso", "sem cor, incolor", "sem nenhum machucado, ileso", "esbanjador, que gasta demais", "oportunidade, ocasião"], "certa": 2, "explicacao": "c) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
