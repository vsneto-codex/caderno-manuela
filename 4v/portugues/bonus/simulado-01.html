<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “O sorvete derreteu <b>porque</b> ficou no sol.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "o motivo", "por qual", "pois", "por qual motivo"], "certa": 3, "explicacao": "d) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>elegível</b>? Responda com a letra.", "alternativas": ["que não dá para ler", "ato de ceder", "soneca depois do almoço", "que pode ser eleito", "anular um direito"], "certa": 3, "explicacao": "d) que pode ser eleito — não confunda com “ilegível” (que não dá para ler)."}, {"enunciado": "Como se diz o macho da <b>cobra</b>? Responda com a letra.", "alternativas": ["a cobra macho", "o cobro", "o cobra", "a cobrazinho", "o cobra macho"], "certa": 0, "explicacao": "a) a cobra macho — cobra é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["triste, melancólico", "ligado à vida simples e tranquila do campo", "que dá para acreditar, razoável", "rigoroso e sem luxo", "que fala pouco, de poucas palavras"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o/a gerente</b> é… Responda com a letra.", "alternativas": ["comum de dois", "não tem gênero", "sobrecomum", "tem feminino diferente (biforme)", "epiceno"], "certa": 0, "explicacao": "a) comum de dois — o gerente / a gerente: a palavra é igual, o artigo muda."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["heroico", "açúcar", "bambú", "lápis", "tórax"], "certa": 2, "explicacao": "c) bambú — o certo é bambu: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o dia", "a derme", "a dinamite", "o guaraná", "o foto"], "certa": 4, "explicacao": "e) o foto — o certo é “a foto”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Socorro!</b> expressa? Responda com a letra.", "alternativas": ["pedido de silêncio", "decepção", "aplauso", "medo", "alegria"], "certa": 3, "explicacao": "d) medo"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["começar, provocar", "que arma truques para enganar", "confusão, situação enrolada", "vencer, controlar (um incêndio, uma crise)", "aliviar, diminuir (uma dor, um problema)"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["A ponte caiu, portanto tivemos de voltar.", "O filme era longo, contudo ninguém dormiu.", "Desligue a luz, porque vamos economizar energia.", "Eu levo o bolo se você levar o suco.", "O sol saiu e as flores abriram."], "certa": 4, "explicacao": "e) O sol saiu e as flores abriram."}, {"enunciado": "Qual é o plural de <b>vaivém</b>? Responda com a letra.", "alternativas": ["vaivémis", "os vaivém", "vaivémes", "vaivéms", "vaivéns"], "certa": 4, "explicacao": "e) vaivéns"}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["Que gol bonito!", "Mostre o desenho!", "A turma do quinto ano escreveu uma carta.", "Por que o irmão mais velho de Otávio respondeu às perguntas?", "Por que minhas tias mandaram uma mensagem?"], "certa": 1, "explicacao": "b) Mostre o desenho!"}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>o diretor de uma empresa</b>? Responda com a letra.", "alternativas": ["Vossa Senhoria", "Vossa Alteza", "Vossa Majestade", "Vossa Magnificência", "Vossa Excelência"], "certa": 0, "explicacao": "a) Vossa Senhoria"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "descuidado, que cai fácil em armadilhas", "resistente (ao calor, a mudanças)", "muito esquisito, absurdo", "desejo, vontade"], "certa": 0, "explicacao": "a) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["saci", "sol", "dragão", "janela", "grito"], "certa": 4, "explicacao": "e) grito — só existe se alguém fizer ou sentir."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["caberão", "caberam", "cabiam", "couberam", "cabem"], "certa": 3, "explicacao": "d) couberam"}, {"enunciado": "Ontem eu ___ (verbo <b>supor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["supi", "supori", "supus", "supôs", "suponhei"], "certa": 2, "explicacao": "c) supus — supor segue pôr: eu pus → eu supus."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Alice estava meio assustada.", "Bebi meia garrafa de água.", "Comprei meio quilo de uva.", "Comi meia pizza.", "Bianca ficou meia preocupada."], "certa": 4, "explicacao": "e) — o certo é “Bianca ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que não se apaga", "duvidoso, suspeito", "defesa, elogio de uma ideia", "que passa num instante"], "certa": 0, "explicacao": "a) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Salvador</b> é… Responda com a letra.", "alternativas": ["paraense", "belo-horizontino", "soteropolitano", "mineiro", "porto-alegrense"], "certa": 2, "explicacao": "c) soteropolitano"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente aprendemos rápido.", "A gente brinca no parque.", "A gente come muita fruta.", "Nós acordamos cedo no domingo.", "Nós ajudamos a vovó na cozinha."], "certa": 0, "explicacao": "a) — o certo é “A gente aprende”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["órfã", "músico", "médico", "príncipe", "tímido"], "certa": 0, "explicacao": "a) órfã — ór-fã: é paroxítona."}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar nojo", "mostrar alegria", "pedir silêncio", "mostrar dor", "chamar alguém"], "certa": 4, "explicacao": "e) chamar alguém — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "pouco, escasso", "que traz boas notícias", "que está pela metade", "esforço, vontade forte de fazer algo"], "certa": 0, "explicacao": "a) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "“Que empreguinho chato!”<br>Que sentido tem <b>empreguinho</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "admiração", "pressa", "carinho", "tamanho"], "certa": 0, "explicacao": "a) desprezo"}, {"enunciado": "“O gato é pequeno, entretanto é muito corajoso.”<br>Qual conjunção pode ficar no lugar de <b>entretanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["caso", "e", "por isso", "contudo", "já que"], "certa": 3, "explicacao": "d) contudo — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>jovem</b>? Responda com a letra.", "alternativas": ["noite", "partir", "triste", "estreito", "idoso"], "certa": 4, "explicacao": "e) idoso"}, {"enunciado": "Como se lê <b>capítulo IV</b>? Responda com a letra.", "alternativas": ["quinto", "quatro", "terceiro", "quarto", "4"], "certa": 3, "explicacao": "d) quarto — até o décimo, lê-se como ordinal."}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["firme e calmo diante do sofrimento", "sem nenhum machucado, ileso", "totalmente fechado; difícil de entender", "defesa, elogio de uma ideia", "sem cor, incolor"], "certa": 1, "explicacao": "b) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
