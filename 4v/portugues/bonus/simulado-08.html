<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente escreve cartas para a vovó.", "Nós dançamos na festa junina.", "A gente joga bola no recreio.", "Nós aprendemos rápido.", "A gente gostamos de pizza."], "certa": 4, "explicacao": "e) — o certo é “A gente gosta”: a gente pede o verbo como “ele”."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Bianca ficou meia assustada.", "Comprei meio quilo de uva.", "Comi meia pizza.", "Já é meio-dia e meia.", "Alice estava meio preocupada."], "certa": 0, "explicacao": "a) — o certo é “Bianca ficou meio assustada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["São Paulo, 16 de outubro de 2026.", "Ontem, choveu muito.", "Comprei uva, laranja e manga.", "As crianças da escola, desenharam um castelo.", "Rex, o cachorro de Manuela, chegou cedo."], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (As crianças da escola) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Diga por que você está triste.", "Você está bravo porque perdeu o jogo?", "Ele chorou porque caiu da bicicleta?", "Ninguém explicou por que a aula acabou mais cedo.", "O cachorro latiu por que ouviu a campainha."], "certa": 4, "explicacao": "e) — o certo é “O cachorro latiu porque ouviu a campainha.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["gênio, muito inteligente", "que fala ou escreve demais, enrolando", "esbanjador, que gasta demais", "que está em toda parte", "muitas vezes, com frequência"], "certa": 2, "explicacao": "c) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["cerejeira", "melancia", "biblioteca", "glacial", "cientista"], "certa": 0, "explicacao": "a) cerejeira — ce-re-jei-ra"}, {"enunciado": "A palavra <b>a formiga</b> é… Responda com a letra.", "alternativas": ["epiceno", "tem feminino diferente (biforme)", "sobrecomum", "não tem gênero", "comum de dois"], "certa": 0, "explicacao": "a) epiceno — animal: a formiga macho / a formiga fêmea."}, {"enunciado": "Como se lê <b>século XV</b>? Responda com a letra.", "alternativas": ["catorze", "dezesseis", "décimo quinto", "quinze", "15"], "certa": 3, "explicacao": "d) quinze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um amigo</b>? Responda com a letra.", "alternativas": ["Vossa Excelência", "Vossa Santidade", "Vossa Reverendíssima", "Vossa Senhoria", "você"], "certa": 4, "explicacao": "e) você"}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "arrogância, ar de superioridade", "mínimo, o menor de todos", "infinito, enorme", "oportunidade, ocasião"], "certa": 2, "explicacao": "c) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Viajei a Roma e à Itália.", "Falei a pessoas da fila.", "Vire a direita na esquina.", "Começou a chover à noite.", "Passeamos a cavalo."], "certa": 2, "explicacao": "c) — o certo é “à direita”: expressões com palavra feminina como às vezes, à noite, à direita, à milanesa têm crase."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Os meninos da rua correram no parque.", "Chuviscou no fim da tarde.", "A vovó e o vovô cantaram na festa.", "Andamos de bicicleta.", "Aprendi uma música nova."], "certa": 2, "explicacao": "c) A vovó e o vovô cantaram na festa."}, {"enunciado": "Ontem, eles ___ ao doce. Qual forma completa a frase? Responda com a letra.", "alternativas": ["resistiram", "resistiam", "resistem", "resistirão", "resistiriam"], "certa": 0, "explicacao": "a) resistiram — passado: -am."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["xanpu", "boxecha", "pagé", "coxilo", "berinjela"], "certa": 4, "explicacao": "e) berinjela — com j, de cor."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito antigo e valioso", "novato, iniciante", "isca, armadilha para enganar", "fora da época certa", "o público que assiste a um espetáculo"], "certa": 3, "explicacao": "d) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Bianca trouxe o mapa para mim desenhar.", "Para mim, estudar à noite é melhor.", "Ela deu o recado para eu levar.", "Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil."], "certa": 0, "explicacao": "a) — o certo é “para eu desenhar”."}, {"enunciado": "Ontem eles ___ (verbo <b>saber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["saberão", "sabiam", "saberam", "souberam", "sabem"], "certa": 3, "explicacao": "d) souberam"}, {"enunciado": "— Psiu! Moça, esqueceu a sacola!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["pedir silêncio", "mostrar nojo", "mostrar alegria", "mostrar dor", "chamar alguém"], "certa": 4, "explicacao": "e) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["saúde", "papéis", "hifens", "veem", "abacaxí"], "certa": 4, "explicacao": "e) abacaxí — o certo é abacaxi: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "confirmar, reforçar uma ideia", "atento, prestando atenção", "que dá para acreditar, razoável", "sem medo, destemido"], "certa": 0, "explicacao": "a) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>concerto</b>? Responda com a letra.", "alternativas": ["apresentação musical", "evidente, na hora do ato", "liberação", "pôr fogo", "reparo"], "certa": 0, "explicacao": "a) apresentação musical — não confunda com “conserto” (reparo)."}, {"enunciado": "Na frase “<b>Por que</b> o cachorro abana o rabo?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "por isso", "pelo qual / pela qual", "pois", "porém"], "certa": 0, "explicacao": "a) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>pegar no pé</b>? Responda com a letra.", "alternativas": ["procurar defeito onde não há", "ser muito caro", "descansar para se recuperar", "exagerar", "implicar com alguém"], "certa": 4, "explicacao": "e) implicar com alguém"}, {"enunciado": "“Coma a salada, porque faz bem à saúde.”<br>Qual conjunção pode ficar no lugar de <b>porque</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["e", "por isso", "contudo", "já que", "logo"], "certa": 3, "explicacao": "d) já que — as duas dão ideia de explicação."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "novato, iniciante", "desmentir, contradizer", "que passa num instante", "confirmar, reforçar uma ideia"], "certa": 4, "explicacao": "e) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pa-la-vra", "as-so-biar", "re-crei-o", "ex-ce-ção", "te-sou-ro"], "certa": 1, "explicacao": "b) as-so-biar — o certo é as-so-bi-ar: no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os lápis", "os tórax", "os fósseis", "os cidadões", "os répteis"], "certa": 3, "explicacao": "d) os cidadões — o certo é os cidadãos."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Daqui a dois dias, eles baterão na porta.", "No ano que vem, eles escreverão uma carta.", "Ontem, eles acordaram cedo.", "Daqui a dois dias, eles brincarão no parque.", "Daqui a dois dias, eles varreram o quintal."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vamos a piscina.", "Fiz uma visita àquele museu.", "Vou à Bahia.", "Começou a chover à noite.", "Ficaram frente a frente."], "certa": 0, "explicacao": "a) — o certo é “à piscina”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "muito pequeno, escasso", "novato, iniciante", "pena, compaixão pelos outros", "arrogância, ar de superioridade"], "certa": 4, "explicacao": "e) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
