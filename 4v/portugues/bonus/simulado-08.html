<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós precisamos de ajuda.", "A gente canta no coral da escola.", "Nós estudamos juntos todo dia.", "A gente come muita fruta.", "A gente escrevemos cartas para a vovó."], "certa": 4, "explicacao": "e) — o certo é “A gente escreve”: a gente pede o verbo como “ele”."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Bebi meia garrafa de água.", "Alice estava meio sonolenta.", "As portas estavam meio abertas.", "Comprei meio quilo de uva.", "A professora ficou meia preocupada."], "certa": 4, "explicacao": "e) — o certo é “A professora ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Manuela, cuidado com o degrau!", "Comprei borracha, caderno e tesoura.", "Manuela, venha jantar!", "O cachorro e o gato, discutiram o assunto."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (O cachorro e o gato) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O túnel por que o trem passa é escuro.", "— Hoje não tem aula. — Por quê?", "Diga porquê você está triste.", "Quero entender por que a Lua muda de forma.", "O cachorro fugiu porque o portão estava aberto?"], "certa": 2, "explicacao": "c) — o certo é “Diga por que você está triste.”: é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "aliviar, diminuir (uma dor, um problema)", "mentira, golpe para enganar", "oportunidade, ocasião", "gênio, muito inteligente"], "certa": 0, "explicacao": "a) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["fantasia", "rouxinol", "sair", "voar", "assobiar"], "certa": 1, "explicacao": "b) rouxinol — rou-xi-nol"}, {"enunciado": "A palavra <b>o condor</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "comum de dois", "não tem gênero", "epiceno", "tem feminino diferente (biforme)"], "certa": 3, "explicacao": "d) epiceno — animal: o condor macho / o condor fêmea."}, {"enunciado": "Como se lê <b>século III</b>? Responda com a letra.", "alternativas": ["quarto", "3", "segundo", "três", "terceiro"], "certa": 4, "explicacao": "e) terceiro — até o décimo, lê-se como ordinal."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>o reitor de uma universidade</b>? Responda com a letra.", "alternativas": ["Vossa Alteza", "Vossa Magnificência", "Vossa Senhoria", "Vossa Reverendíssima", "você"], "certa": 1, "explicacao": "b) Vossa Magnificência"}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "nunca visto antes, extraordinário", "fora da época certa", "infinito, enorme", "descuidado, que cai fácil em armadilhas"], "certa": 0, "explicacao": "a) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Às vezes, durmo à tarde.", "Chegamos às oito horas.", "Entreguei o presente a ela.", "Fui a escola de bicicleta.", "Chegamos ao meio-dia."], "certa": 3, "explicacao": "d) — o certo é “à escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Escureceu de repente.", "Toquei violão.", "A professora de música resistiu ao doce.", "As amigas de Lívia estudaram para a prova.", "O cachorro e o gato bateram na porta."], "certa": 1, "explicacao": "b) Toquei violão."}, {"enunciado": "Ontem, eles ___ cedo. Qual forma completa a frase? Responda com a letra.", "alternativas": ["acordavam", "acordarão", "acordaram", "acordam", "acordariam"], "certa": 2, "explicacao": "c) acordaram — passado: -am."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["xuveiro", "faxina", "berinjela", "salgado", "chimarrão"], "certa": 0, "explicacao": "a) xuveiro — o certo é chuveiro: com ch, de cor."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "espantado, sem reação", "generoso, de coração grande", "fora da época certa", "muito antigo e valioso"], "certa": 3, "explicacao": "d) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem.", "Mamãe trouxe a revista para mim copiar.", "O bolo é para mim."], "certa": 3, "explicacao": "d) — o certo é “para eu copiar”."}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["têm", "teram", "terão", "tiveram", "tinham"], "certa": 3, "explicacao": "d) tiveram"}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar alegria", "chamar alguém", "pedir silêncio", "mostrar nojo", "mostrar dor"], "certa": 1, "explicacao": "b) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["hífen", "veem", "rainha", "ideia", "heróico"], "certa": 4, "explicacao": "e) heróico — o certo é heroico: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "totalmente fechado; difícil de entender", "que traz boas notícias", "descuidado, que cai fácil em armadilhas", "atento, prestando atenção"], "certa": 0, "explicacao": "a) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>cela</b>? Responda com a letra.", "alternativas": ["assento do cavalo", "apresentação musical", "quarto de prisão", "reserva, ser discreto", "bebida"], "certa": 2, "explicacao": "c) quarto de prisão — não confunda com “sela” (assento do cavalo)."}, {"enunciado": "Na frase “Cada regra tem um <b>porquê</b> para existir.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "porém", "o motivo", "pois", "por qual"], "certa": 2, "explicacao": "c) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "O que quer dizer <b>abrir o jogo</b>? Responda com a letra.", "alternativas": ["levar a culpa sozinho", "contar a verdade", "confiar totalmente", "falar demais", "ter tudo para resolver"], "certa": 1, "explicacao": "b) contar a verdade"}, {"enunciado": "“A loja fechou, por isso voltamos para casa.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["portanto", "mas", "todavia", "caso", "porque"], "certa": 0, "explicacao": "a) portanto — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "confirmar, reforçar uma ideia", "arrependido", "que dura muito, que não acaba", "desmentir, contradizer"], "certa": 1, "explicacao": "b) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["le-o-par-do", "ob-je-to", "li-vro", "la-ran-je-i-ra", "cha-péu"], "certa": 3, "explicacao": "d) la-ran-je-i-ra — o certo é la-ran-jei-ra: no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os pires", "os cidadãos", "os hifens", "os funis", "os capitões"], "certa": 4, "explicacao": "e) os capitões — o certo é os capitães."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles estudaram para a prova.", "Na semana passada, eles tocaram violão.", "Daqui a dois dias, eles comprarão pão.", "Na semana passada, eles voltarão para casa.", "No ano que vem, eles andarão de bicicleta."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Viajei a Roma e à Itália.", "Falei a pessoas da fila.", "Entreguei o bilhete a amiga.", "Começou a chover à noite.", "Passeamos a cavalo."], "certa": 2, "explicacao": "c) — o certo é “à amiga”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "pena, compaixão pelos outros", "sem medo, destemido", "arrogância, ar de superioridade", "mentira, golpe para enganar"], "certa": 3, "explicacao": "d) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
