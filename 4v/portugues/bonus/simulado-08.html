<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós precisamos de ajuda.", "A gente canta no coral da escola.", "Nós estudamos juntos todo dia.", "A gente escreve cartas para a vovó.", "A gente comemos muita fruta."], "certa": 4, "explicacao": "e) — o certo é “A gente come”: a gente pede o verbo como “ele”."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Bebi meia garrafa de água.", "Alice estava meio sonolenta.", "As portas estavam meio abertas.", "Comprei meio quilo de uva.", "A professora ficou meia preocupada."], "certa": 4, "explicacao": "e) — o certo é “A professora ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Manuela, cuidado com o degrau!", "Comprei borracha, caderno e tesoura.", "Manuela, venha jantar!", "Manuela e Bianca, discutiram o assunto."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O túnel por que o trem passa é escuro.", "— Hoje não tem aula. — Por quê?", "Porquê a Lua muda de forma", "Quero entender por que a Lua muda de forma.", "O cachorro fugiu porque o portão estava aberto?"], "certa": 2, "explicacao": "c) — o certo é “Por que a Lua muda de forma”: é uma pergunta em forma de título: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "aliviar, diminuir (uma dor, um problema)", "mentira, golpe para enganar", "oportunidade, ocasião", "gênio, muito inteligente"], "certa": 0, "explicacao": "a) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["fantasia", "rouxinol", "sair", "voar", "assobiar"], "certa": 1, "explicacao": "b) rouxinol — rou-xi-nol"}, {"enunciado": "A palavra <b>o pernilongo</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "comum de dois", "não tem gênero", "epiceno", "tem feminino diferente (biforme)"], "certa": 3, "explicacao": "d) epiceno — animal: o pernilongo macho / o pernilongo fêmea."}, {"enunciado": "Como se lê <b>capítulo XII</b>? Responda com a letra.", "alternativas": ["treze", "12", "onze", "décimo segundo", "doze"], "certa": 4, "explicacao": "e) doze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um amigo</b>? Responda com a letra.", "alternativas": ["Vossa Majestade", "Vossa Magnificência", "você", "Vossa Reverendíssima", "Vossa Senhoria"], "certa": 2, "explicacao": "c) você"}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o público que assiste a um espetáculo", "infinito, enorme", "grosseiro, muito grave (um erro)", "mínimo, o menor de todos", "totalmente fechado; difícil de entender"], "certa": 3, "explicacao": "d) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Vire à esquerda.", "As vezes, o gato dorme no sofá.", "Começou a chover à noite.", "Fui ao clube e à piscina."], "certa": 2, "explicacao": "c) — o certo é “Às vezes”: expressões com palavra feminina como às vezes, à noite, à direita, à milanesa têm crase."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Manuela e Bianca brincaram no parque.", "A turma do quinto ano acordou cedo.", "Ricardo e a irmã andaram de bicicleta.", "Lavamos o carro.", "Ventou muito na praia."], "certa": 3, "explicacao": "d) Lavamos o carro."}, {"enunciado": "Daqui a dois dias, eles ___ música. Qual forma completa a frase? Responda com a letra.", "alternativas": ["escutariam", "escutam", "escutarão", "escutaram", "escutavam"], "certa": 2, "explicacao": "c) escutarão — futuro: -ão."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["beringela", "enchergar", "jiboia", "xapéu", "tijela"], "certa": 2, "explicacao": "c) jiboia — palavra de origem tupi: j."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "arrogância, ar de superioridade", "muito antigo e valioso", "proveitoso, que dá bons resultados", "fora da época certa"], "certa": 4, "explicacao": "e) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "Mamãe trouxe o livro para eu.", "Trouxe o lápis para eu desenhar.", "Para mim, fazer isso é fácil.", "Para mim, estudar à noite é melhor."], "certa": 1, "explicacao": "b) — o certo é “para mim”."}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["queri", "quererei", "quis", "queria", "quero"], "certa": 2, "explicacao": "c) quis"}, {"enunciado": "— Psiu! Não acorde o vovô.<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar nojo", "mostrar alegria", "pedir silêncio", "mostrar dor", "chamar alguém"], "certa": 2, "explicacao": "c) pedir silêncio — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["chapéu", "feiura", "veem", "lêem", "caju"], "certa": 3, "explicacao": "d) lêem — o certo é leem: oo e eem NÃO levam acento (voo, enjoo, leem, veem) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "mínimo, o menor de todos", "caro, que custa muito", "atento, prestando atenção", "breve e direto"], "certa": 0, "explicacao": "a) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>cerrar</b>? Responda com a letra.", "alternativas": ["que pode ser eleito", "fechar", "líquido doce", "ordem de pagamento", "cortar com serra"], "certa": 1, "explicacao": "b) fechar — não confunda com “serrar” (cortar com serra)."}, {"enunciado": "Na frase “<b>Por que</b> você não veio à festa?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "pelo qual / pela qual", "motivo para", "porém", "por isso"], "certa": 0, "explicacao": "a) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>dar uma mãozinha</b>? Responda com a letra.", "alternativas": ["passar por muita dificuldade", "não gostar de gastar dinheiro", "fazer com facilidade", "desconfiar de algo", "ajudar um pouco"], "certa": 4, "explicacao": "e) ajudar um pouco"}, {"enunciado": "“O sorvete ficou no sol, por isso derreteu.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["contudo", "mas", "portanto", "porém", "caso"], "certa": 2, "explicacao": "c) portanto — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "que fala ou escreve demais, enrolando", "pouco, escasso", "confirmar, reforçar uma ideia", "desmentir, contradizer"], "certa": 3, "explicacao": "d) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ca-bri-to", "o-bser-var", "di-nos-sau-ro", "ad-vo-ga-do", "te-a-tro"], "certa": 1, "explicacao": "b) o-bser-var — o certo é ob-ser-var: a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os lápis", "os cidadãos", "os arco-íris", "os guardas-chuvas", "os hifens"], "certa": 3, "explicacao": "d) os guardas-chuvas — o certo é os guarda-chuvas."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles mostrarão o desenho.", "No ano que vem, eles pularão corda.", "Hoje de manhã, eles abriram a janela.", "Hoje de manhã, eles brincarão no parque.", "Hoje de manhã, eles aprenderam uma música nova."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Viajei a Roma e à Itália.", "Chegamos às oito horas.", "Às vezes, durmo à tarde.", "Conheci à escola."], "certa": 4, "explicacao": "e) — o certo é “a escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pena, compaixão pelos outros", "novato, iniciante", "isca, armadilha para enganar", "arrogância, ar de superioridade", "o público que assiste a um espetáculo"], "certa": 3, "explicacao": "d) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
