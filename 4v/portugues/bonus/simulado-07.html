<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["saugado", "geito", "gorgeta", "xampu", "boxecha"], "certa": 3, "explicacao": "d) xampu — com x, de cor; m antes de p."}, {"enunciado": "“Venceu o campeonato o dono da padaria.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Venceu", "o", "o dono da padaria", "o sujeito está escondido (oculto)"], "certa": 3, "explicacao": "d) o dono da padaria — o sujeito veio depois do verbo. Pergunte: quem venceu?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Os alunos têm aula hoje.", "A pera estava madura.", "A caixa contém doze lápis.", "Elas vêem o mar da janela.", "Ele tem dois irmãos."], "certa": 3, "explicacao": "d) — o certo é “Elas veem…”."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "exibido, que usa palavras difíceis só para se mostrar", "totalmente fechado; difícil de entender", "que tem as pernas compridas", "novato, iniciante"], "certa": 1, "explicacao": "b) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["ce-i-a", "as-sun-to", "o-sso", "su-bso-lo", "deg-rau"], "certa": 1, "explicacao": "b) as-sun-to — rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Ontem eles ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["puderam", "podiam", "poderão", "poderam", "podem"], "certa": 0, "explicacao": "a) puderam"}, {"enunciado": "No ano que vem, eles ___ cedo. Qual forma completa a frase? Responda com a letra.", "alternativas": ["partiram", "partiam", "partirão", "partiriam", "partem"], "certa": 2, "explicacao": "c) partirão — futuro: -ão."}, {"enunciado": "“O pneu furou, portanto chegamos atrasados.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["caso", "todavia", "mas", "por isso", "já que"], "certa": 3, "explicacao": "d) por isso — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inútil, perda de tempo", "fora da época certa", "que dá para acreditar, razoável", "proveitoso, que dá bons resultados", "totalmente fechado; difícil de entender"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["O gato pulou e derrubou o vaso.", "Desligue a luz, porque vamos economizar energia.", "Plantamos a semente, logo nasceu uma árvore.", "O gato é pequeno, porém é muito corajoso.", "O time ganha caso treine bastante."], "certa": 2, "explicacao": "c) Plantamos a semente, logo nasceu uma árvore."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["mangueira", "quintal", "guizo", "aquilo", "consequência"], "certa": 4, "explicacao": "e) consequência — em “consequência” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que o mar tem ondas", "E você foi embora por que motivo?", "Ninguém sabe o por que do sumiço do gato.", "Ninguém explicou por que a aula acabou mais cedo.", "Não sei por que motivo ele saiu."], "certa": 2, "explicacao": "c) — o certo é “Ninguém sabe o porquê do sumiço do gato.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Qual é o coletivo de <b>ovelhas</b>? Responda com a letra.", "alternativas": ["cardume", "cordilheira", "manada", "rebanho", "bando"], "certa": 3, "explicacao": "d) rebanho — manada é de outro grupo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "que está em toda parte", "que não está em lugar nenhum", "mentira, golpe para enganar", "sem medo, destemido"], "certa": 1, "explicacao": "b) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "Mamãe trouxe o caderno para eu.", "Sem mim, a festa não teria graça.", "Ela deu o recado para eu levar.", "Trouxe o lápis para eu desenhar."], "certa": 1, "explicacao": "b) — o certo é “para mim”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitos peixes nadavam no lago.", "Ela leu muitos livros.", "Havia muitas estrelas no céu.", "Muitos alunos faltaram.", "As meninas estavam muito felizes."], "certa": 4, "explicacao": "e) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["lápis", "voo", "idéia", "polens", "álbum"], "certa": 2, "explicacao": "c) idéia — o certo é ideia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "“Comprei pera, banana e manga.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o aposto (uma explicação sobre o nome)", "separa o sujeito do verbo", "separa o vocativo (quem é chamado)", "separa os itens de uma lista", "separa o lugar e a data"], "certa": 3, "explicacao": "d) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "pouco, escasso", "mínimo, o menor de todos", "que traz boas notícias", "que traz más notícias"], "certa": 3, "explicacao": "d) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>vou entender</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "os dois são principais", "vou", "o sujeito", "entender"], "certa": 4, "explicacao": "e) entender — o principal é o último, o que diz a ação."}, {"enunciado": "Se eu ___ a resposta, ficaria contente. (verbo saber)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["saiba", "soube", "soubesse", "saber", "sei"], "certa": 2, "explicacao": "c) soubesse"}, {"enunciado": "Quem nasce em <b>Pernambuco</b> é… Responda com a letra.", "alternativas": ["florianopolitano", "coreano", "cuiabano", "sul-mato-grossense", "pernambucano"], "certa": 4, "explicacao": "e) pernambucano"}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que discute e argumenta demais", "grosseiro, muito grave (um erro)", "exibido, que usa palavras difíceis só para se mostrar", "lento para entender", "esperto, que percebe tudo rápido"], "certa": 4, "explicacao": "e) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>abaixo-assinado</b>? Responda com a letra.", "alternativas": ["abaixos-assinados", "abaixo-assinadoes", "abaixo-assinados", "abaixo-assinado", "abaixos-assinado"], "certa": 2, "explicacao": "c) abaixo-assinados"}, {"enunciado": "Por que a palavra <b>laço</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç pode aparecer no começo da palavra", "antes de e e i se usa ç", "ç só se usa antes de a, o e u", "antes de e e i, o c já tem som de s", "antes de a, o e u, o c tem som de k"], "certa": 2, "explicacao": "c) ç só se usa antes de a, o e u"}, {"enunciado": "Como se lê <b>Henrique VIII</b>? Responda com a letra.", "alternativas": ["sétimo", "oitavo", "8", "nono", "oito"], "certa": 1, "explicacao": "b) oitavo — até o décimo, lê-se como ordinal."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Aprendi a nadar.", "Cheguei a feira.", "Ficaram frente a frente.", "Fui ao clube e à piscina."], "certa": 2, "explicacao": "c) — o certo é “à feira”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "firme e calmo diante do sofrimento", "breve e direto", "cheio de detalhes", "fora da época certa"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>exortar</b>? Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "muito cuidadoso com os detalhes", "pouco, escasso", "encorajar, aconselhar com insistência", "com muita vontade"], "certa": 3, "explicacao": "d) encorajar, aconselhar com insistência"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
