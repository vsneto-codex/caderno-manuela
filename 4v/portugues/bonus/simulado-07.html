<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["saugado", "geito", "gorgeta", "xampu", "boxecha"], "certa": 3, "explicacao": "d) xampu — com x, de cor; m antes de p."}, {"enunciado": "“Venceu o campeonato o irmão mais velho de Otávio.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Venceu", "o", "o irmão mais velho de Otávio", "o sujeito está escondido (oculto)"], "certa": 3, "explicacao": "d) o irmão mais velho de Otávio — o sujeito veio depois do verbo. Pergunte: quem venceu?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["O polo norte é gelado.", "Elas vêem o mar da janela.", "Ontem ele não pôde sair.", "Eles creem em fadas.", "Meu avô é pescador."], "certa": 1, "explicacao": "b) — o certo é “Elas veem…”."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "exibido, que usa palavras difíceis só para se mostrar", "descuidado, que cai fácil em armadilhas", "inconveniente; fora do assunto", "que tem as pernas compridas"], "certa": 1, "explicacao": "b) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["as-sus-ta-do", "e-cli-pse", "man-dio-ca", "gen-gib-re", "o-sso"], "certa": 0, "explicacao": "a) as-sus-ta-do — rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Ontem eu ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabi", "caberei", "caibo", "cabia", "coube"], "certa": 4, "explicacao": "e) coube"}, {"enunciado": "Na semana passada, eles ___ uma mensagem. Qual forma completa a frase? Responda com a letra.", "alternativas": ["mandariam", "mandarão", "mandavam", "mandam", "mandaram"], "certa": 4, "explicacao": "e) mandaram — passado: -am."}, {"enunciado": "“A loja fechou, logo voltamos para casa.”<br>Qual conjunção pode ficar no lugar de <b>logo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["mas", "todavia", "porque", "porém", "por isso"], "certa": 4, "explicacao": "e) por isso — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "novato, iniciante", "inútil, perda de tempo", "proveitoso, que dá bons resultados", "urgente"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Ricardo é tímido, contudo adora cantar.", "Fale baixo, porque o bebê está dormindo.", "O sol saiu e as flores abriram.", "Plantamos a semente, por isso nasceu uma árvore.", "A gente joga bola se a lição acabar cedo."], "certa": 0, "explicacao": "a) Ricardo é tímido, contudo adora cantar."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["queijo", "pinguim", "quintal", "esquilo", "mosquito"], "certa": 1, "explicacao": "b) pinguim — em “pinguim” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O caminho por que passei estava cheio de flores.", "Não sei porquê ela saiu tão cedo.", "Por que a Lua muda de forma", "Ninguém sabe por que o gato sumiu.", "Você está bravo porque perdeu o jogo?"], "certa": 1, "explicacao": "b) — o certo é “Não sei por que ela saiu tão cedo.”: é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Qual é o coletivo de <b>abelhas</b>? Responda com a letra.", "alternativas": ["bando", "enxame", "nuvem", "cardume", "tropilha"], "certa": 1, "explicacao": "b) enxame — cardume é de outro grupo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não está em lugar nenhum", "caro, que custa muito", "que está em toda parte", "arrogância, ar de superioridade", "breve e direto"], "certa": 2, "explicacao": "c) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Entre mim e você, tudo bem.", "Sem mim, a festa não teria graça.", "Mamãe trouxe o caderno para eu.", "Para mim, estudar à noite é melhor."], "certa": 3, "explicacao": "d) — o certo é “para mim”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Comprei muitos livros.", "A prova foi muito fácil.", "Ele tem muitos amigos.", "Bebi muita água.", "Havia muita gente na praia."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["tórax", "heroico", "polens", "jóia", "chapéu"], "certa": 3, "explicacao": "d) jóia — o certo é joia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "“Comprei régua, caderno e borracha.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o sujeito do verbo", "separa o vocativo (quem é chamado)", "separa os itens de uma lista", "separa o lugar e a data", "separa o aposto (uma explicação sobre o nome)"], "certa": 2, "explicacao": "c) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "esfriar, perder a força", "que está em toda parte", "que traz más notícias", "que traz boas notícias"], "certa": 4, "explicacao": "e) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>estou insistindo</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "o sujeito", "estou", "os dois são principais", "insistindo"], "certa": 4, "explicacao": "e) insistindo — o principal é o último, o que diz a ação."}, {"enunciado": "Se eu ___ em casa, ficaria contente. (verbo estar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["estive", "esteja", "estar", "estivesse", "estou"], "certa": 3, "explicacao": "d) estivesse"}, {"enunciado": "Quem nasce em <b>Palmas</b> é… Responda com a letra.", "alternativas": ["japonês", "natalense", "maranhense", "piauiense", "palmense"], "certa": 4, "explicacao": "e) palmense"}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "vencer, controlar (um incêndio, uma crise)", "que discute e argumenta demais", "esperto, que percebe tudo rápido", "intenso, enérgico"], "certa": 3, "explicacao": "d) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>segunda-feira</b>? Responda com a letra.", "alternativas": ["segundas-feiras", "segunda-feiraes", "segunda-feira", "segundas-feira", "segunda-feiras"], "certa": 0, "explicacao": "a) segundas-feiras"}, {"enunciado": "Por que a palavra <b>maçã</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["antes de e e i, o c já tem som de s", "ç só se usa antes de a, o e u", "antes de a, o e u, o c tem som de k", "antes de e e i se usa ç", "ç pode aparecer no começo da palavra"], "certa": 1, "explicacao": "b) ç só se usa antes de a, o e u"}, {"enunciado": "Como se lê <b>D. João VI</b>? Responda com a letra.", "alternativas": ["sétimo", "sexto", "6", "quinto", "seis"], "certa": 1, "explicacao": "b) sexto — até o décimo, lê-se como ordinal."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Dei um abraço a bibliotecária.", "Chegamos ao meio-dia.", "Vou à Bahia.", "Fiz uma visita àquele museu.", "Entreguei o presente a ela."], "certa": 0, "explicacao": "a) — o certo é “à bibliotecária”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "remédio para todos os males", "que não faz mal, sem efeito", "totalmente fechado; difícil de entender", "cheio de detalhes"], "certa": 0, "explicacao": "a) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>estapafúrdio</b>? Responda com a letra.", "alternativas": ["muito esquisito, absurdo", "começar", "excelente, muito habilidoso", "arrogância, ar de superioridade", "proveitoso, que dá bons resultados"], "certa": 0, "explicacao": "a) muito esquisito, absurdo"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
