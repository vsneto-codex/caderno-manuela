<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["enchuto", "enchurrada", "larangeira", "ameixa", "cangica"], "certa": 3, "explicacao": "d) ameixa — depois de ditongo se usa x."}, {"enunciado": "“Sumiram do quintal as crianças da escola.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "não tem sujeito", "Sumiram", "do", "as crianças da escola"], "certa": 4, "explicacao": "e) as crianças da escola — o sujeito veio depois do verbo. Pergunte: quem sumiram?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["O voo atrasou.", "Hoje ela pode jogar.", "Eles creem em fadas.", "Elas vêem o mar da janela.", "A pera estava madura."], "certa": 3, "explicacao": "d) — o certo é “Elas veem…”."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem as pernas compridas", "aliviar, diminuir (uma dor, um problema)", "exibido, que usa palavras difíceis só para se mostrar", "esperto, que percebe tudo rápido", "sem medo, destemido"], "certa": 2, "explicacao": "c) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["le-ão", "o-bser-var", "sob-ran-ce-lha", "pa-ssa-tem-po", "po-li-cial"], "certa": 0, "explicacao": "a) le-ão — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Ontem eu ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabi", "caberei", "caibo", "cabia", "coube"], "certa": 4, "explicacao": "e) coube"}, {"enunciado": "Na semana passada, eles ___ uma mensagem. Qual forma completa a frase? Responda com a letra.", "alternativas": ["mandariam", "mandarão", "mandavam", "mandam", "mandaram"], "certa": 4, "explicacao": "e) mandaram — passado: -am."}, {"enunciado": "“O pneu furou, portanto chegamos atrasados.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porém", "porque", "todavia", "logo", "mas"], "certa": 3, "explicacao": "d) logo — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "firme e calmo diante do sofrimento", "inútil, perda de tempo", "proveitoso, que dá bons resultados", "esperto, que percebe tudo rápido"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["Eu levo o bolo caso você leve o suco.", "O dia estava nublado, porém não choveu.", "Volte cedo, pois amanhã tem aula.", "Bianca comprou pão e Felipe comprou leite.", "O sorvete ficou no sol, portanto derreteu."], "certa": 0, "explicacao": "a) Eu levo o bolo caso você leve o suco."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["quente", "guizo", "linguiça", "guitarra", "mangueira"], "certa": 2, "explicacao": "c) linguiça — em “linguiça” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que a Lua muda de forma", "O bolo afundou e ninguém sabe por que.", "O cachorro fugiu porque o portão estava aberto?", "Não há por que correr: ainda é cedo.", "E você foi embora por que motivo?"], "certa": 1, "explicacao": "b) — o certo é “O bolo afundou e ninguém sabe por quê.”: vem logo antes de uma pausa (vírgula ou ponto): aí ganha acento."}, {"enunciado": "Qual é o coletivo de <b>ilhas</b>? Responda com a letra.", "alternativas": ["continente", "arquipélago", "tropa", "constelação", "cordilheira"], "certa": 1, "explicacao": "b) arquipélago — cordilheira é de outro grupo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "firme e calmo diante do sofrimento", "muito pequeno, escasso", "que não está em lugar nenhum", "que fala ou escreve demais, enrolando"], "certa": 0, "explicacao": "a) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "Ela deu o recado para eu levar.", "Felipe trouxe o jogo para eu.", "Trouxe o lápis para eu desenhar.", "Isso é para eu ler."], "certa": 2, "explicacao": "c) — o certo é “para mim”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Havia muitas estrelas no céu.", "Comprei muitos livros.", "Muitos peixes nadavam no lago.", "Havia muita gente na praia.", "Manuela canta muito bem."], "certa": 4, "explicacao": "e) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["açúcar", "polens", "herói", "moínho", "juiz"], "certa": 3, "explicacao": "d) moínho — o certo é moinho: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "“Comprei maçã, banana e uva.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o sujeito do verbo", "separa o aposto (uma explicação sobre o nome)", "separa o lugar e a data", "separa o vocativo (quem é chamado)", "separa os itens de uma lista"], "certa": 4, "explicacao": "e) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "que está em toda parte", "que traz boas notícias", "que traz más notícias", "dispensar, não precisar de algo"], "certa": 2, "explicacao": "c) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>preciso partir</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "o sujeito", "preciso", "os dois são principais", "partir"], "certa": 4, "explicacao": "e) partir — o principal é o último, o que diz a ação."}, {"enunciado": "Tomara que nós ___ à festa. (verbo vir)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["vir", "venhamos", "viemos", "viéssemos", "vimos"], "certa": 1, "explicacao": "b) venhamos"}, {"enunciado": "Quem nasce na <b>Austrália</b> é… Responda com a letra.", "alternativas": ["australiano", "brasileiro", "russo", "chinês", "acriano"], "certa": 0, "explicacao": "a) australiano"}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "inconveniente; fora do assunto", "que discute e argumenta demais", "esperto, que percebe tudo rápido", "o público que assiste a um espetáculo"], "certa": 3, "explicacao": "d) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>arco-íris</b>? Responda com a letra.", "alternativas": ["arcos-íris", "arco-íris", "arco-íriss", "arcos-íriss", "arco-írises"], "certa": 1, "explicacao": "b) arco-íris"}, {"enunciado": "Por que a palavra <b>beleza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["o final -esa sempre se escreve com z", "palavras que indicam país terminam em -eza", "substantivos que vêm de adjetivos terminam em -eza", "femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem"], "certa": 2, "explicacao": "c) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Como se lê <b>Luís XIV</b>? Responda com a letra.", "alternativas": ["quinze", "catorze", "décimo quarto", "14", "treze"], "certa": 1, "explicacao": "b) catorze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Fiz uma visita àquele museu.", "Começou à cantar.", "Chegamos ao meio-dia.", "Vou à Bahia."], "certa": 2, "explicacao": "c) — o certo é “a cantar”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "que traz boas notícias", "fora da época certa", "generoso, de coração grande", "cheio de detalhes"], "certa": 0, "explicacao": "a) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>impávido</b>? Responda com a letra.", "alternativas": ["fora da época certa", "fraco, fino, delicado", "que se coloca no lugar do outro", "apagar, destruir por completo", "sem medo, destemido"], "certa": 4, "explicacao": "e) sem medo, destemido"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
