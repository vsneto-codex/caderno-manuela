<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>catarse</b>? Responda com a letra.", "alternativas": ["urgente", "pouco, escasso", "único, sem igual", "alívio emocional profundo", "enganoso, feito para induzir ao erro"], "certa": 3, "explicacao": "d) alívio emocional profundo"}, {"enunciado": "Por que a palavra <b>japonesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["substantivos que vêm de adjetivos terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "femininos e palavras de origem terminam em -esa"], "certa": 4, "explicacao": "e) femininos e palavras de origem terminam em -esa"}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os capitões", "os ônibus", "os pires", "os pães", "os guarda-chuvas"], "certa": 0, "explicacao": "a) os capitões — o certo é os capitães."}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — explicou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo explicou que vai plantar uma árvore amanhã.", "Ricardo explicou que eu ia plantar uma árvore no dia seguinte.", "Ricardo explicou que ia plantar uma árvore no dia seguinte.", "Ricardo explicou que eu vou plantar uma árvore amanhã.", "Ricardo explicou que ia plantar uma árvore amanhã."], "certa": 2, "explicacao": "c) Ricardo explicou que ia plantar uma árvore no dia seguinte."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "aliviar, diminuir (uma dor, um problema)", "intenso, enérgico", "que arma truques para enganar", "aumentar, piorar"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>vento</b>? Responda com a letra.", "alternativas": ["vozeirão", "amigão", "dentão", "ventania", "fogaréu"], "certa": 3, "explicacao": "d) ventania"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os alunos e a diretora responderam às perguntas.", "Os alunos e a diretora respondemos às perguntas.", "Os alunos e a diretora respondeu às perguntas.", "Os alunos e a diretora responde às perguntas.", "Os alunos e a diretora respondi às perguntas."], "certa": 0, "explicacao": "a) Os alunos e a diretora responderam às perguntas. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Rafaela, levou três materiais: borracha, caderno e cola.", "Rafaela levou três materiais: borracha, caderno e cola.", "Rafaela levou três materiais borracha, caderno e cola.", "Rafaela levou três materiais: borracha caderno e cola.", "Rafaela levou três materiais: borracha, caderno, e cola."], "certa": 1, "explicacao": "b) Rafaela levou três materiais: borracha, caderno e cola. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Rafaela e o verbo."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["farto, abundante", "sem medo, destemido", "combinado sem precisar falar, subentendido", "pouco, escasso", "novato, iniciante"], "certa": 3, "explicacao": "d) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["princesa", "princeza", "prinscesa", "prinsesa", "princessa"], "certa": 0, "explicacao": "a) princesa — feminino em -esa: s."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente dançamos na festa junina.", "Nós chegamos cedo à escola.", "A gente precisa de ajuda.", "A gente brinca no parque.", "Nós ajudamos a vovó na cozinha."], "certa": 0, "explicacao": "a) — o certo é “A gente dança”: a gente pede o verbo como “ele”."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["telefone", "chuva", "chute", "duende", "alma"], "certa": 2, "explicacao": "c) chute — só existe se alguém fizer ou sentir."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Passamos por uma ponte.", "Elas veem o mar da janela.", "Vou pôr o casaco.", "Os guardas mantém a calma.", "O voo atrasou."], "certa": 3, "explicacao": "d) — o certo é “Os guardas mantêm…”."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "confusão, situação enrolada", "urgente", "totalmente fechado; difícil de entender", "preciso, feito com muito cuidado"], "certa": 2, "explicacao": "c) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>condor</b>? Responda com a letra.", "alternativas": ["o condorzinha", "a condora", "o condor fêmea", "a condor fêmea", "a condor"], "certa": 2, "explicacao": "c) o condor fêmea — condor é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Como se escreve <b>65º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo sexto", "sessentésimo quinto", "sexagésimo quinto", "quinquagésimo quinto", "septuagésimo quinto"], "certa": 2, "explicacao": "c) sexagésimo quinto"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou à correr.", "Passeamos a cavalo.", "Entreguei o presente a ela.", "Vire à esquerda.", "Comemos bife à milanesa."], "certa": 0, "explicacao": "a) — o certo é “a correr”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "Qual palavra quer dizer “totalmente fechado; difícil de entender”? Responda com a letra.", "alternativas": ["incólume", "inusitado", "hermético", "dissipar", "profícuo"], "certa": 2, "explicacao": "c) hermético"}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "que derrete fácil", "resistente (ao calor, a mudanças)", "intenso, enérgico", "tão bom que não dá para descrever com palavras"], "certa": 2, "explicacao": "c) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Por que o time de Felipe vendeu limonada?", "Procure a bola.", "Nossa, que frio!", "Minhas tias pintaram um quadro.", "Abra a janela!"], "certa": 3, "explicacao": "d) Minhas tias pintaram um quadro."}, {"enunciado": "Se eu ___ o primeiro da fila, ficaria contente. (verbo ser)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["fui", "seja", "ser", "fosse", "sou"], "certa": 3, "explicacao": "d) fosse"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O imigrante chegou ao Brasil vindo da Itália.", "A orquestra fez um lindo conserto no teatro.", "Os caçadores foram caçar na floresta.", "Ele fez um cumprimento para a plateia.", "O prazo foi cumprido à risca."], "certa": 1, "explicacao": "b) — o certo é “concerto” (apresentação musical)."}, {"enunciado": "Ontem eu ___ (verbo <b>decompor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["decompus", "decompori", "decompi", "decompôs", "decomponhei"], "certa": 0, "explicacao": "a) decompus — decompor segue pôr: eu pus → eu decompus."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["curado de uma doença", "rigoroso e sem luxo", "que passa num instante", "preciso, feito com muito cuidado", "proveitoso, que dá bons resultados"], "certa": 3, "explicacao": "d) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["mandioca", "contribuinte", "cócegas", "órfão", "ímã"], "certa": 2, "explicacao": "c) cócegas — có-ce-gas: é proparoxítona."}, {"enunciado": "Se “ele tem”, então… Responda com a letra.", "alternativas": ["eles teem", "eles têm", "eles têem", "eles tens", "eles tem"], "certa": 1, "explicacao": "b) eles têm — ter, vir e os que vêm deles ganham chapeuzinho no plural (têm, vêm, contêm)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Ricardo e a irmã, correram no parque.", "Comprei maçã, uva e manga.", "Felipe, cuidado com o degrau!", "São Paulo, 16 de outubro de 2026."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (Ricardo e a irmã) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>comecei a viajar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["viajar", "não há verbo principal", "comecei", "os dois são principais", "o sujeito"], "certa": 0, "explicacao": "a) viajar — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "que traz boas notícias", "crítica, ataque", "sem nenhum machucado, ileso", "muito pequeno, escasso"], "certa": 0, "explicacao": "a) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["enxuto", "jiboia", "mecherica", "enxaqueca", "pajé"], "certa": 2, "explicacao": "c) mecherica — o certo é mexerica: com x, de cor."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
