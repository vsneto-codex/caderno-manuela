<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>conciso</b>? Responda com a letra.", "alternativas": ["urgente", "pouco, escasso", "único, sem igual", "breve e direto", "enganoso, feito para induzir ao erro"], "certa": 3, "explicacao": "d) breve e direto"}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "substantivos que vêm de adjetivos terminam em -eza"], "certa": 4, "explicacao": "e) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os capitões", "os ônibus", "os pires", "os pães", "os guarda-chuvas"], "certa": 0, "explicacao": "a) os capitões — o certo é os capitães."}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — explicou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo explicou que vai plantar uma árvore amanhã.", "Ricardo explicou que eu ia plantar uma árvore no dia seguinte.", "Ricardo explicou que ia plantar uma árvore no dia seguinte.", "Ricardo explicou que eu vou plantar uma árvore amanhã.", "Ricardo explicou que ia plantar uma árvore amanhã."], "certa": 2, "explicacao": "c) Ricardo explicou que ia plantar uma árvore no dia seguinte."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "aliviar, diminuir (uma dor, um problema)", "intenso, enérgico", "que arma truques para enganar", "aumentar, piorar"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>barco</b>? Responda com a letra.", "alternativas": ["vozeirão", "amigão", "dentão", "barcaça", "fogaréu"], "certa": 3, "explicacao": "d) barcaça"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As amigas de Lívia responderam às perguntas.", "As amigas de Lívia respondemos às perguntas.", "As amigas de Lívia respondeu às perguntas.", "As amigas de Lívia responde às perguntas.", "As amigas de Lívia respondi às perguntas."], "certa": 0, "explicacao": "a) As amigas de Lívia responderam às perguntas. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Lucas, levou três materiais: borracha, caderno e cola.", "Lucas levou três materiais: borracha, caderno e cola.", "Lucas levou três materiais borracha, caderno e cola.", "Lucas levou três materiais: borracha caderno e cola.", "Lucas levou três materiais: borracha, caderno, e cola."], "certa": 1, "explicacao": "b) Lucas levou três materiais: borracha, caderno e cola. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Lucas e o verbo."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["farto, abundante", "sem medo, destemido", "combinado sem precisar falar, subentendido", "pouco, escasso", "novato, iniciante"], "certa": 3, "explicacao": "d) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["proceço", "processo", "proscesso", "prossesso", "prosesso"], "certa": 1, "explicacao": "b) processo — com c (antes de e) e ss (entre vogais)."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente dançamos na festa junina.", "Nós aprendemos rápido.", "Nós desenhamos muito bem.", "A gente precisa de ajuda.", "A gente desenha muito bem."], "certa": 0, "explicacao": "a) — o certo é “A gente dança”: a gente pede o verbo como “ele”."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["fada", "honestidade", "grito", "sede", "medo"], "certa": 0, "explicacao": "a) fada — existe por si, mesmo que seja imaginário."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Elas veem o mar da janela.", "Que eles deem o recado.", "Ontem ele não pode sair.", "Passamos por uma ponte.", "Eles creem em fadas."], "certa": 2, "explicacao": "c) — o certo é “Ontem ele não pôde…”."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "que está em toda parte", "urgente", "breve e direto", "que dura pouco tempo"], "certa": 2, "explicacao": "c) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>formiga</b>? Responda com a letra.", "alternativas": ["a formigazinho", "a formiga macho", "o formigo", "o formiga", "o formiga macho"], "certa": 1, "explicacao": "b) a formiga macho — formiga é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Como se escreve <b>31º</b> por extenso? Responda com a letra.", "alternativas": ["trigésimo segundo", "trintésimo primeiro", "quadragésimo primeiro", "vigésimo primeiro", "trigésimo primeiro"], "certa": 4, "explicacao": "e) trigésimo primeiro"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos ao meio-dia.", "Aprendi a nadar.", "Chegamos às oito horas.", "Vamos a floresta.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à floresta”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “enganoso, feito para induzir ao erro”? Responda com a letra.", "alternativas": ["impoluto", "zeloso", "obliterar", "capcioso", "inepto"], "certa": 3, "explicacao": "d) capcioso"}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "esforço, vontade forte de fazer algo", "que derrete fácil", "resistente (ao calor, a mudanças)", "preciso, feito com muito cuidado"], "certa": 3, "explicacao": "d) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>exclamativa</b>? Responda com a letra.", "alternativas": ["Como está quente hoje!", "Meu avô comeu pizza.", "O irmão mais velho de Otávio correu no parque?", "Viaje para a praia!", "Plante uma árvore!"], "certa": 0, "explicacao": "a) Como está quente hoje!"}, {"enunciado": "Se vocês ___ a lição, avisem. (verbo fazer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["fazer", "fizeram", "fizerem", "fazem", "façam"], "certa": 2, "explicacao": "c) fizerem"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A cesta de piquenique estava cheia de frutas.", "O calor faz o metal delatar.", "Que cavalheiro: abriu a porta para a vovó!", "Dei um laço no presente.", "O prazo foi cumprido à risca."], "certa": 1, "explicacao": "b) — o certo é “dilatar” (aumentar)."}, {"enunciado": "Ontem eu ___ (verbo <b>decompor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["decompori", "decomponhei", "decompus", "decompôs", "decompi"], "certa": 2, "explicacao": "c) decompus — decompor segue pôr: eu pus → eu decompus."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "curado de uma doença", "preciso, feito com muito cuidado", "intenso, enérgico", "tão bom que não dá para descrever com palavras"], "certa": 2, "explicacao": "c) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["sonhar", "nêutron", "metrô", "recém", "entender"], "certa": 1, "explicacao": "b) nêutron — nêu-tron: é paroxítona."}, {"enunciado": "Se “ele lê”, então… Responda com a letra.", "alternativas": ["eles lêem", "eles lêm", "eles leen", "eles leem", "eles lê"], "certa": 3, "explicacao": "d) eles leem — ler, ver, crer e os que vêm deles têm “ee” sem acento no plural (leem, veem, creem)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O dono da padaria, discutiu o assunto.", "Ontem, choveu muito.", "Manuela, venha jantar!", "Comprei pera, banana e uva.", "São Paulo, 16 de outubro de 2026."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (O dono da padaria) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>devo partir</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "partir", "devo", "os dois são principais", "o sujeito"], "certa": 1, "explicacao": "b) partir — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["resistente (ao calor, a mudanças)", "defesa, elogio de uma ideia", "crítica, ataque", "fora da época certa", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 1, "explicacao": "b) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["chimarrão", "lagartixa", "magestade", "xampu", "gesto"], "certa": 2, "explicacao": "c) magestade — o certo é majestade: com j, de cor."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
