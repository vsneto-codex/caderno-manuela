<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>conciso</b>? Responda com a letra.", "alternativas": ["urgente", "pouco, escasso", "único, sem igual", "breve e direto", "enganoso, feito para induzir ao erro"], "certa": 3, "explicacao": "d) breve e direto"}, {"enunciado": "Por que a palavra <b>pobreza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "substantivos que vêm de adjetivos terminam em -eza"], "certa": 4, "explicacao": "e) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os irmões", "os álbuns", "as couves-flores", "os lápis", "os ônibus"], "certa": 0, "explicacao": "a) os irmões — o certo é os irmãos."}, {"enunciado": "“— Eu gosto de chocolate aqui — respondeu a professora.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["A professora respondeu que eu gostava de chocolate ali.", "A professora respondeu que gostava de chocolate ali.", "A professora respondeu que eu gosto de chocolate aqui.", "A professora respondeu que gostava de chocolate aqui.", "A professora respondeu que gosta de chocolate aqui."], "certa": 1, "explicacao": "b) A professora respondeu que gostava de chocolate ali."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aumentar, piorar", "aliviar, diminuir (uma dor, um problema)", "que está em toda parte", "confusão, situação enrolada", "que arma truques para enganar"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>copo</b>? Responda com a letra.", "alternativas": ["meninão", "mesão", "facão", "portão", "copázio"], "certa": 4, "explicacao": "e) copázio"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os primos de Ricardo acordaram cedo.", "Os primos de Ricardo acorda cedo.", "Os primos de Ricardo acordei cedo.", "Os primos de Ricardo acordamos cedo.", "Os primos de Ricardo acordou cedo."], "certa": 0, "explicacao": "a) Os primos de Ricardo acordaram cedo. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Beatriz comprou três frutas: uva, laranja e banana.", "Beatriz comprou três frutas: uva, laranja, e banana.", "Beatriz comprou três frutas uva, laranja e banana.", "Beatriz comprou três frutas: uva laranja e banana.", "Beatriz, comprou três frutas: uva, laranja e banana."], "certa": 0, "explicacao": "a) Beatriz comprou três frutas: uva, laranja e banana. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Beatriz e o verbo."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "farto, abundante", "que acontece por acaso", "sem medo, destemido", "esforço, vontade forte de fazer algo"], "certa": 0, "explicacao": "a) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["suscesso", "sucesso", "suceso", "susesso", "sussesso"], "certa": 1, "explicacao": "b) sucesso — com c (antes de e) e ss (entre vogais)."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós brincamos no parque.", "A gente aprende rápido.", "Nós dançamos na festa junina.", "A gente ajudamos a vovó na cozinha.", "A gente viaja nas férias."], "certa": 3, "explicacao": "d) — o certo é “A gente ajuda”: a gente pede o verbo como “ele”."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["frio", "grito", "raiva", "anjo", "esperança"], "certa": 3, "explicacao": "d) anjo — existe por si, mesmo que seja imaginário."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Os alunos têm aula hoje.", "As andorinhas vêm no verão.", "Que eles deem o recado.", "Ontem ele não pode sair.", "Eles leem um livro por semana."], "certa": 3, "explicacao": "d) — o certo é “Ontem ele não pôde…”."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "que dura pouco tempo", "urgente", "que pode esperar", "fora da época certa"], "certa": 2, "explicacao": "c) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>rinoceronte</b>? Responda com a letra.", "alternativas": ["a rinoceronte", "o rinoceronte fêmea", "o rinocerontezinha", "a rinocerontea", "a rinoceronte fêmea"], "certa": 1, "explicacao": "b) o rinoceronte fêmea — rinoceronte é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Como se escreve <b>60º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo", "sessentésimo", "sexagésimo primeiro", "quinquagésimo", "septuagésimo"], "certa": 0, "explicacao": "a) sexagésimo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Chegamos às oito horas.", "Mandei um recado a prima.", "Passeamos a cavalo.", "Chegamos ao meio-dia."], "certa": 2, "explicacao": "c) — o certo é “à prima”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “sem medo, destemido”? Responda com a letra.", "alternativas": ["impávido", "incólume", "perspicaz", "perene", "inusitado"], "certa": 0, "explicacao": "a) impávido"}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["resistente (ao calor, a mudanças)", "tão bom que não dá para descrever com palavras", "esforço, vontade forte de fazer algo", "incomum, surpreendente", "que derrete fácil"], "certa": 0, "explicacao": "a) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Minhas tias pintaram um quadro?", "Varra o quintal!", "Aprenda uma música nova.", "A vovó e o vovô abriram a janela.", "Nossa, que frio!"], "certa": 3, "explicacao": "d) A vovó e o vovô abriram a janela."}, {"enunciado": "Se eu ___ a resposta, ficaria contente. (verbo saber)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["soube", "saiba", "saber", "soubesse", "sei"], "certa": 3, "explicacao": "d) soubesse"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O imigrante chegou ao Brasil vindo da Itália.", "A orquestra fez um lindo conserto no teatro.", "Os caçadores foram caçar na floresta.", "Ele fez um cumprimento para a plateia.", "O prazo foi cumprido à risca."], "certa": 1, "explicacao": "b) — o certo é “concerto” (apresentação musical)."}, {"enunciado": "Ontem eu ___ (verbo <b>sobrepor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["sobrepus", "sobrepori", "sobrepi", "sobrepôs", "sobreponhei"], "certa": 0, "explicacao": "a) sobrepus — sobrepor segue pôr: eu pus → eu sobrepus."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["curado de uma doença", "rigoroso e sem luxo", "que passa num instante", "preciso, feito com muito cuidado", "proveitoso, que dá bons resultados"], "certa": 3, "explicacao": "d) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["mandioca", "contribuinte", "cócegas", "órfão", "ímã"], "certa": 2, "explicacao": "c) cócegas — có-ce-gas: é proparoxítona."}, {"enunciado": "Se “ele contém”, então… Responda com a letra.", "alternativas": ["eles contêm", "eles contêem", "eles contém", "eles contens", "eles contem"], "certa": 0, "explicacao": "a) eles contêm — ter, vir e os que vêm deles ganham chapeuzinho no plural (têm, vêm, contêm)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Felipe, o mais alto da turma, chegou cedo.", "Felipe, cuidado com o degrau!", "Felipe, venha jantar!", "Manuela e Bianca, decidiram o jogo.", "São Paulo, 16 de outubro de 2026."], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>estou lavando</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["estou", "lavando", "não há verbo principal", "o sujeito", "os dois são principais"], "certa": 1, "explicacao": "b) lavando — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "o público que assiste a um espetáculo", "crítica, ataque", "oportunidade, ocasião", "que fala pouco, de poucas palavras"], "certa": 0, "explicacao": "a) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["berinjela", "mexerica", "gengibre", "engrachate", "salgado"], "certa": 3, "explicacao": "d) engrachate — o certo é engraxate: vem de graxa: x."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
