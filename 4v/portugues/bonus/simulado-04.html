<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Felipe voltou a sorveteria.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à sorveteria”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A prova vai ser daqui a uma semana.", "Onde a tartaruga bota os ovos?", "Nenhum cachorro é mau por natureza.", "O cachorro estava de mau humor por causa do calor.", "Aonde caiu o meu brinco?"], "certa": 4, "explicacao": "e) o certo é “Onde”"}, {"enunciado": "Como se lê <b>D. Pedro II</b>? Responda com a letra.", "alternativas": ["primeiro", "2", "terceiro", "segundo", "dois"], "certa": 3, "explicacao": "d) segundo — até o décimo, lê-se como ordinal."}, {"enunciado": "Por que a palavra <b>vírus</b> tem acento? Responda com a letra.", "alternativas": ["oxítona terminada em e leva acento", "oxítona terminada em o leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "paroxítona terminada em us leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)"], "certa": 3, "explicacao": "d) paroxítona terminada em us leva acento (ví-rus)."}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito educado e gentil", "remédio para todos os males", "onde é muito difícil viver", "que está em toda parte", "inconveniente; fora do assunto"], "certa": 4, "explicacao": "e) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>rápido</b>? Responda com a letra.", "alternativas": ["rapidérrimo", "mínimo", "rapidíssimo", "rapidílimo", "tristíssimo"], "certa": 2, "explicacao": "c) rapidíssimo"}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["caixa", "raiva", "melancia", "faixa", "troféu"], "certa": 2, "explicacao": "c) melancia — me-lan-ci-a"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["São Paulo, 16 de outubro de 2026.", "Felipe, o mais alto da turma, chegou cedo.", "Ricardo, venha jantar!", "Manuela e Bianca, falaram com a vovó.", "Ricardo, cuidado com o degrau!"], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>81º</b> por extenso? Responda com a letra.", "alternativas": ["oitentésimo primeiro", "nonagésimo primeiro", "octogésimo primeiro", "septuagésimo primeiro", "octogésimo segundo"], "certa": 2, "explicacao": "c) octogésimo primeiro"}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "novato, iniciante", "fácil de apagar", "que não se apaga", "vencer, controlar (um incêndio, uma crise)"], "certa": 3, "explicacao": "d) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Ele treinou todo dia, logo ganhou a corrida.", "O time ganha caso treine bastante.", "Lavei a louça e varri a cozinha.", "Coma a salada, já que faz bem à saúde.", "O gato é pequeno, contudo é muito corajoso."], "certa": 0, "explicacao": "a) Ele treinou todo dia, logo ganhou a corrida."}, {"enunciado": "Quem nasce no <b>Espírito Santo</b> é… Responda com a letra.", "alternativas": ["escocês", "capixaba", "mato-grossense", "potiguar", "mineiro"], "certa": 1, "explicacao": "b) capixaba"}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["mecherica", "cangica", "pagé", "enxurrada", "enchaqueca"], "certa": 3, "explicacao": "d) enxurrada — depois de en- se usa x; som forte entre vogais: rr."}, {"enunciado": "Qual é a junção de <b>de + isso</b>? Responda com a letra.", "alternativas": ["disso", "àisso", "nisso", "doisso", "de isso"], "certa": 0, "explicacao": "a) disso"}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "mínimo, o menor de todos", "que não faz mal, sem efeito", "perigoso, venenoso", "que acontece fora de hora"], "certa": 2, "explicacao": "c) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "“Que mulheraça!”<br>Que sentido tem <b>mulheraça</b> nessa frase? Responda com a letra.", "alternativas": ["pressa", "admiração", "desprezo", "tamanho", "carinho"], "certa": 1, "explicacao": "b) admiração"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["casinha", "gatinho", "livrinho", "florzinha", "espinho"], "certa": 4, "explicacao": "e) espinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["receber", "relampejar", "varrer", "tocar", "escutar"], "certa": 1, "explicacao": "b) relampejar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>calmo</b>? Responda com a letra.", "alternativas": ["ausente", "magro", "triste", "agitado", "tranquilo"], "certa": 3, "explicacao": "d) agitado — cuidado: “tranquilo” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["novato, iniciante", "rigoroso e sem luxo", "especialista, veterano", "esfriar, perder a força", "arrependido"], "certa": 0, "explicacao": "a) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Aprendemos uma música nova.", "Manuela e Bianca varreram o quintal.", "O irmão mais velho de Otávio acordou cedo.", "Faz frio no inverno.", "O irmão mais velho de Otávio voltou para casa."], "certa": 1, "explicacao": "b) Manuela e Bianca varreram o quintal."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["A professora ficou meia triste.", "Alice estava meio nervosa.", "Já é meio-dia e meia.", "Comi meia pizza.", "Bebi meia garrafa de água."], "certa": 0, "explicacao": "a) — o certo é “A professora ficou meio triste”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>o reitor de uma universidade</b>? Responda com a letra.", "alternativas": ["você", "Vossa Reverendíssima", "Vossa Majestade", "Vossa Senhoria", "Vossa Magnificência"], "certa": 4, "explicacao": "e) Vossa Magnificência"}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "incomum, surpreendente", "grosseiro, muito grave (um erro)", "que dura pouco, passageiro", "aliviar, diminuir (uma dor, um problema)"], "certa": 0, "explicacao": "a) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["sapato", "pulo", "alma", "saci", "lua"], "certa": 1, "explicacao": "b) pulo — só existe se alguém fizer ou sentir."}, {"enunciado": "“Chegaram cedo Ricardo e a irmã.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Chegaram", "cedo", "Ricardo e a irmã", "o sujeito está escondido (oculto)", "não tem sujeito"], "certa": 2, "explicacao": "c) Ricardo e a irmã — o sujeito veio depois do verbo. Pergunte: quem chegaram?"}, {"enunciado": "Qual é o coletivo de <b>uvas</b>? Responda com a letra.", "alternativas": ["ramo", "cacho", "penca", "júri", "buquê"], "certa": 1, "explicacao": "b) cacho — penca é de outro grupo."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Vi muitos pássaros.", "Muitas pessoas vieram à festa.", "Muitas crianças brincavam no parque.", "Manuela canta muito bem.", "Ganhei muitos presentes."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["precisar muito de algo", "que dá para acreditar, razoável", "dispensar, não precisar de algo", "que traz boas notícias", "resistente (ao calor, a mudanças)"], "certa": 2, "explicacao": "c) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "“Felipe queria jogar, todavia estava com febre.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["já que", "mas", "por isso", "porque", "se"], "certa": 1, "explicacao": "b) mas — as duas dão ideia de oposição."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
