<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Felipe voltou a piscina.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à piscina”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O gato é pequeno, mas é muito corajoso.", "Quem treina mas costuma jogar melhor.", "Manuela estudou, mas esqueceu o caderno em casa.", "O mau cheiro vinha da lata de lixo.", "Onde você guardou o guarda-chuva?"], "certa": 1, "explicacao": "b) o certo é “mais”"}, {"enunciado": "Como se lê <b>século XV</b>? Responda com a letra.", "alternativas": ["catorze", "15", "décimo quinto", "dezesseis", "quinze"], "certa": 4, "explicacao": "e) quinze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Por que a palavra <b>início</b> tem acento? Responda com a letra.", "alternativas": ["oxítona (força na última sílaba) terminada em a leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "oxítona terminada em em ou ens leva acento", "oxítona terminada em e leva acento", "paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento"], "certa": 4, "explicacao": "e) paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento (i-ní-ci-o)."}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "onde é muito difícil viver", "inconveniente; fora do assunto", "muito educado e gentil", "remédio para todos os males"], "certa": 2, "explicacao": "c) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>amável</b>? Responda com a letra.", "alternativas": ["amavelíssimo", "tristíssimo", "magríssimo", "amabilíssimo", "amavélimo"], "certa": 3, "explicacao": "d) amabilíssimo"}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["caixa", "raiva", "melancia", "faixa", "troféu"], "certa": 2, "explicacao": "c) melancia — me-lan-ci-a"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["São Paulo, 16 de outubro de 2026.", "Felipe, o mais alto da turma, chegou cedo.", "Ricardo, venha jantar!", "Felipe, falou com a vovó.", "Ricardo, cuidado com o degrau!"], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Felipe) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>81º</b> por extenso? Responda com a letra.", "alternativas": ["oitentésimo primeiro", "nonagésimo primeiro", "octogésimo primeiro", "septuagésimo primeiro", "octogésimo segundo"], "certa": 2, "explicacao": "c) octogésimo primeiro"}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "novato, iniciante", "fácil de apagar", "que não se apaga", "vencer, controlar (um incêndio, uma crise)"], "certa": 3, "explicacao": "d) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Ele treinou todo dia, logo ganhou a corrida.", "O time ganha caso treine bastante.", "Lavei a louça e varri a cozinha.", "Coma a salada, já que faz bem à saúde.", "O gato é pequeno, contudo é muito corajoso."], "certa": 0, "explicacao": "a) Ele treinou todo dia, logo ganhou a corrida."}, {"enunciado": "Quem nasce na <b>Escócia</b> é… Responda com a letra.", "alternativas": ["escocês", "sergipano", "paraibano", "gaúcho", "coreano"], "certa": 0, "explicacao": "a) escocês"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["chapéu", "canjica", "engrachate", "mexerica", "relâmpago"], "certa": 2, "explicacao": "c) engrachate — o certo é engraxate: vem de graxa: x."}, {"enunciado": "Qual é a junção de <b>em + esta</b>? Responda com a letra.", "alternativas": ["àesta", "desta", "nesta", "eoesta", "em esta"], "certa": 2, "explicacao": "c) nesta"}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "mentira, golpe para enganar", "onde é muito difícil viver", "muitas vezes, com frequência", "perigoso, venenoso"], "certa": 0, "explicacao": "a) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "“O bebê tem pezinhos minúsculos.”<br>Que sentido tem <b>pezinhos</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "admiração", "desprezo", "pressa", "carinho"], "certa": 0, "explicacao": "a) tamanho"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["gatinho", "mesinha", "pezinho", "padrinho", "florzinha"], "certa": 3, "explicacao": "d) padrinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["relampejar", "unir", "mandar", "brincar", "pintar"], "certa": 0, "explicacao": "a) relampejar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>acender</b>? Responda com a letra.", "alternativas": ["infeliz", "inimigo", "fechado", "apagar", "sair"], "certa": 3, "explicacao": "d) apagar"}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "resistente (ao calor, a mudanças)", "especialista, veterano", "novato, iniciante", "oportunidade, ocasião"], "certa": 3, "explicacao": "d) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>simples</b>? Responda com a letra.", "alternativas": ["Havia um bilhete na mesa.", "Manuela e Bianca esconderam o presente.", "A girafa do zoológico respondeu às perguntas.", "Escrevemos uma carta.", "Ventou muito na praia."], "certa": 2, "explicacao": "c) A girafa do zoológico respondeu às perguntas."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "Já é meio-dia e meia.", "Bebi meia garrafa de água.", "Manuela ficou meia preocupada.", "Alice estava meio sonolenta."], "certa": 3, "explicacao": "d) — o certo é “Manuela ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>o presidente</b>? Responda com a letra.", "alternativas": ["Vossa Santidade", "Vossa Excelência", "Vossa Alteza", "você", "Vossa Reverendíssima"], "certa": 1, "explicacao": "b) Vossa Excelência"}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "confusão, situação enrolada", "que dura pouco, passageiro", "que dura muito, que não acaba", "mentira, golpe para enganar"], "certa": 3, "explicacao": "d) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["pulo", "livro", "árvore", "saci", "Deus"], "certa": 0, "explicacao": "a) pulo — só existe se alguém fizer ou sentir."}, {"enunciado": "“Sumiram do quintal a vovó e o vovô.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["do", "o sujeito está escondido (oculto)", "não tem sujeito", "Sumiram", "a vovó e o vovô"], "certa": 4, "explicacao": "e) a vovó e o vovô — o sujeito veio depois do verbo. Pergunte: quem sumiram?"}, {"enunciado": "Qual é o coletivo de <b>montanhas</b>? Responda com a letra.", "alternativas": ["constelação", "arquipélago", "boiada", "serra", "cordilheira"], "certa": 4, "explicacao": "e) cordilheira — arquipélago é de outro grupo."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Estudei muito ontem.", "A prova foi muito fácil.", "Havia muita gente na praia.", "Felipe dormiu muito.", "A sopa estava muito quente."], "certa": 2, "explicacao": "c) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "esfriar, perder a força", "que não toma partido, que é justo com todos os lados", "dispensar, não precisar de algo", "precisar muito de algo"], "certa": 3, "explicacao": "d) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "“Não corra no corredor, pois o chão está molhado.”<br>Qual conjunção pode ficar no lugar de <b>pois</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["contudo", "mas", "todavia", "se", "já que"], "certa": 4, "explicacao": "e) já que — as duas dão ideia de explicação."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
