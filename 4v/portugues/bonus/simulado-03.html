<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["João comprou três frutas: maçã laranja e pera.", "João comprou três frutas: maçã, laranja, e pera.", "João comprou três frutas: maçã, laranja e pera.", "João comprou três frutas maçã, laranja e pera.", "João, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) João comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre João e o verbo."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["florzinha", "bolinha", "gatinho", "pezinho", "vinho"], "certa": 4, "explicacao": "e) vinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "De que duas palavras se forma <b>àquele</b>? Responda com a letra.", "alternativas": ["a + aqueles", "àq + aquele", "de + aquele", "a + aquele", "a + aquilo"], "certa": 3, "explicacao": "d) a + aquele"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Assisti a novela com a avó.", "Fui à praia a pé.", "Falei a pessoas da fila.", "Começou a chover à noite.", "Vire à esquerda."], "certa": 0, "explicacao": "a) — o certo é “à novela”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "lento para entender", "que não tem habilidade", "confirmar, reforçar uma ideia", "excelente, muito habilidoso"], "certa": 4, "explicacao": "e) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["figueira", "requeijão", "guizo", "tranquilo", "aquilo"], "certa": 3, "explicacao": "d) tranquilo — em “tranquilo” a gente fala o u"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós moramos perto da praia.", "A gente acordamos cedo no domingo.", "Nós assistimos ao jogo pela televisão.", "A gente mora perto da praia.", "A gente escreve cartas para a vovó."], "certa": 1, "explicacao": "b) — o certo é “A gente acorda”: a gente pede o verbo como “ele”."}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["queria", "queri", "quero", "quererei", "quis"], "certa": 4, "explicacao": "e) quis"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>amável</b>? Responda com a letra.", "alternativas": ["amabilíssimo", "comuníssimo", "amavélimo", "dulcíssimo", "amavelíssimo"], "certa": 0, "explicacao": "a) amabilíssimo"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um tipo de comida italiana", "confusão, situação enrolada", "arrependido", "arrogância, ar de superioridade", "que não se apaga"], "certa": 1, "explicacao": "b) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>muro</b>? Responda com a letra.", "alternativas": ["copázio", "gatão", "fogaréu", "muralha", "chapelão"], "certa": 3, "explicacao": "d) muralha"}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitas crianças brincavam no parque.", "Vi muitos pássaros.", "Ela leu muitos livros.", "O bolo estava muito gostoso.", "Ele tem muitos amigos."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Porquê você não veio à festa?", "— Não vou à praia. — Por quê?", "Saiu sem dizer por quê.", "Não sei por que ela saiu tão cedo.", "O gato fugiu, não sei por quê, e voltou à noite."], "certa": 0, "explicacao": "a) — o certo é “Por que você não veio à festa?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles compraram pão.", "Daqui a dois dias, eles resistirão ao doce.", "Ontem, eles voltaram para casa.", "Amanhã, eles venderam limonada.", "Hoje de manhã, eles jogaram bola."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cuidadoso, precavido", "descuidado, que cai fácil em armadilhas", "que não toma partido, que é justo com todos os lados", "que fala pouco, de poucas palavras", "que dá para acreditar, razoável"], "certa": 1, "explicacao": "b) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Na frase “Aquele <b>porquê</b> era o mais estranho de todos.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["o motivo", "pois", "motivo para", "porém", "pelo qual / pela qual"], "certa": 0, "explicacao": "a) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["As amigas de Lívia, guardaram os brinquedos.", "Ricardo, venha jantar!", "Ricardo, cuidado com o degrau!", "Comprei manga, laranja e maçã.", "São Paulo, 16 de outubro de 2026."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (As amigas de Lívia) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Bianca trouxe o jogo para eu.", "Sem mim, a festa não teria graça.", "O bolo é para mim.", "Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar."], "certa": 0, "explicacao": "a) — o certo é “para mim”."}, {"enunciado": "A palavra <b>o/a turista</b> é… Responda com a letra.", "alternativas": ["epiceno", "tem feminino diferente (biforme)", "sobrecomum", "comum de dois", "não tem gênero"], "certa": 3, "explicacao": "d) comum de dois — o turista / a turista: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "que acontece fora de hora", "estranho, fora do comum", "digno de confiança, verdadeiro", "que causa tempestade"], "certa": 1, "explicacao": "b) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Quem nasce no <b>Paraguai</b> é… Responda com a letra.", "alternativas": ["argentino", "baiano", "português", "angolano", "paraguaio"], "certa": 4, "explicacao": "e) paraguaio"}, {"enunciado": "“Que livrinho fraco, nem vale a pena!”<br>Que sentido tem <b>livrinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "desprezo", "pressa", "carinho", "admiração"], "certa": 1, "explicacao": "b) desprezo"}, {"enunciado": "Como se diz o macho da <b>formiga</b>? Responda com a letra.", "alternativas": ["o formigo", "o formiga macho", "a formigazinho", "o formiga", "a formiga macho"], "certa": 4, "explicacao": "e) a formiga macho — formiga é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito rico e poderoso", "fora da época certa", "que não se apaga", "breve e direto", "generoso, de coração grande"], "certa": 4, "explicacao": "e) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>cavalo-marinho</b>? Responda com a letra.", "alternativas": ["cavalos-marinho", "cavalo-marinhoes", "cavalo-marinhos", "cavalo-marinho", "cavalos-marinhos"], "certa": 4, "explicacao": "e) cavalos-marinhos"}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["unir", "amanhecer", "abrir", "começar", "voltar"], "certa": 1, "explicacao": "b) amanhecer — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual é o coletivo de <b>cães</b>? Responda com a letra.", "alternativas": ["rebanho", "bando", "alcateia", "manada", "matilha"], "certa": 4, "explicacao": "e) matilha — alcateia é de outro grupo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["A pera estava madura.", "Que eles dêem o recado.", "A caixa contém doze lápis.", "Passamos por uma ponte.", "O polo norte é gelado."], "certa": 1, "explicacao": "b) — o certo é “Que eles deem…”."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "remédio para todos os males", "oportunidade, ocasião", "espantado, sem reação", "doença sem cura"], "certa": 1, "explicacao": "b) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou a chover à noite.", "Viajei a Roma e à Itália.", "Vire à esquerda.", "Vou à Bahia.", "Bianca foi a praia."], "certa": 4, "explicacao": "e) — o certo é “à praia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
