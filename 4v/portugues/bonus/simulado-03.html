<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Pedro comprou três frutas: maçã laranja e pera.", "Pedro comprou três frutas: maçã, laranja, e pera.", "Pedro comprou três frutas: maçã, laranja e pera.", "Pedro comprou três frutas maçã, laranja e pera.", "Pedro, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Pedro comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Pedro e o verbo."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["florzinha", "bolinha", "gatinho", "pezinho", "carinho"], "certa": 4, "explicacao": "e) carinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "De que duas palavras se forma <b>daquilo</b>? Responda com a letra.", "alternativas": ["de + aquila", "da + aquilo", "em + aquilo", "de + aquilo", "de + isso"], "certa": 3, "explicacao": "d) de + aquilo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Fui à praia a pé.", "Chegamos às oito horas.", "Vire a direita na esquina.", "Vire à esquerda."], "certa": 3, "explicacao": "d) — o certo é “à direita”: expressões com palavra feminina como às vezes, à noite, à direita, à milanesa têm crase."}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não tem habilidade", "que acontece fora de hora", "excelente, muito habilidoso", "arrogância, ar de superioridade", "esfriar, perder a força"], "certa": 2, "explicacao": "c) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["sequência", "queijo", "pequeno", "figueira", "guizo"], "certa": 0, "explicacao": "a) sequência — em “sequência” a gente fala o u"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente viaja nas férias.", "A gente joga bola no recreio.", "Nós precisamos de ajuda.", "Nós aprendemos rápido.", "A gente gostamos de pizza."], "certa": 4, "explicacao": "e) — o certo é “A gente gosta”: a gente pede o verbo como “ele”."}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizem", "disseram", "diziam", "dizeram", "dirão"], "certa": 1, "explicacao": "b) disseram"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>fácil</b>? Responda com a letra.", "alternativas": ["fidelíssimo", "facílimo", "felicíssimo", "facilíssimo", "facilérrimo"], "certa": 1, "explicacao": "b) facílimo"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "um tipo de comida italiana", "mínimo, o menor de todos", "confusão, situação enrolada", "resistente (ao calor, a mudanças)"], "certa": 3, "explicacao": "d) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>caixa</b>? Responda com a letra.", "alternativas": ["cestão", "bocarra", "muralha", "barcaça", "caixote"], "certa": 4, "explicacao": "e) caixote"}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Havia muitas estrelas no céu.", "Ele tem muitos amigos.", "Ganhei muitos presentes.", "Muitos alunos faltaram.", "A prova foi muito fácil."], "certa": 4, "explicacao": "e) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["As cidades por que viajamos eram lindas.", "Não entendi por que o filme acabou daquele jeito.", "Vocês saíram tão cedo porque?", "O pneu furou; eis por que chegamos atrasados.", "Você faltou porque estava doente?"], "certa": 2, "explicacao": "c) — o certo é “Vocês saíram tão cedo por quê?”: está no fim da frase, logo antes do ponto: aí ganha acento."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles beberão suco.", "Ontem, eles lavarão o carro.", "Na semana passada, eles pintaram um quadro.", "Amanhã, eles guardarão os brinquedos.", "Na semana passada, eles brincaram no parque."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cuidadoso, precavido", "que arma truques para enganar", "preciso, feito com muito cuidado", "exibido, que usa palavras difíceis só para se mostrar", "descuidado, que cai fácil em armadilhas"], "certa": 4, "explicacao": "e) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Na frase “Ela perguntou <b>por que</b> o céu é azul.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por isso", "motivo para", "o motivo", "por qual motivo", "porém"], "certa": 3, "explicacao": "d) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Os meninos da rua, pularam corda.", "Manuela, venha jantar!", "São Paulo, 16 de outubro de 2026.", "Lívia, minha melhor amiga, chegou cedo.", "Ontem, choveu muito."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Os meninos da rua) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Ela deu o recado para eu levar.", "Entre mim e você, tudo bem.", "O vovô trouxe o livro para mim copiar.", "Para mim, estudar à noite é melhor."], "certa": 3, "explicacao": "d) — o certo é “para eu copiar”."}, {"enunciado": "A palavra <b>o/a agente</b> é… Responda com a letra.", "alternativas": ["comum de dois", "sobrecomum", "epiceno", "tem feminino diferente (biforme)", "não tem gênero"], "certa": 0, "explicacao": "a) comum de dois — o agente / a agente: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "que fala ou escreve demais, enrolando", "remédio para todos os males", "que causa tempestade", "resistente (ao calor, a mudanças)"], "certa": 0, "explicacao": "a) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Sergipe</b> é… Responda com a letra.", "alternativas": ["russo", "grego", "fluminense", "chileno", "sergipano"], "certa": 4, "explicacao": "e) sergipano"}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "desprezo", "admiração", "carinho", "pressa"], "certa": 1, "explicacao": "b) desprezo"}, {"enunciado": "Como se diz o macho da <b>mosca</b>? Responda com a letra.", "alternativas": ["o mosca", "a mosca macho", "a moscazinho", "o mosca macho", "o mosco"], "certa": 1, "explicacao": "b) a mosca macho — mosca é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "generoso, de coração grande", "lento para entender", "muito rico e poderoso", "esforço, vontade forte de fazer algo"], "certa": 1, "explicacao": "b) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>cavalo-marinho</b>? Responda com a letra.", "alternativas": ["cavalo-marinho", "cavalo-marinhos", "cavalo-marinhoes", "cavalos-marinho", "cavalos-marinhos"], "certa": 4, "explicacao": "e) cavalos-marinhos"}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["comer", "mostrar", "gostar", "amanhecer", "beber"], "certa": 3, "explicacao": "d) amanhecer — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual é o coletivo de <b>chaves</b>? Responda com a letra.", "alternativas": ["penca", "molho", "feixe", "cacho", "manada"], "certa": 1, "explicacao": "b) molho — penca é de outro grupo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["A caixa contém doze lápis.", "Meu avô é pescador.", "Ela têm um gato.", "As andorinhas vêm no verão.", "Eles leem um livro por semana."], "certa": 2, "explicacao": "c) — o certo é “Ela tem…”."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "que traz boas notícias", "doença sem cura", "arrependido", "remédio para todos os males"], "certa": 4, "explicacao": "e) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui ao clube e à piscina.", "Começou à estudar.", "Fui à praia a pé.", "Entreguei o presente a ela.", "Começou a chover à noite."], "certa": 1, "explicacao": "b) — o certo é “a estudar”: antes de verbo (andar, chover, nadar) nunca tem crase."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
