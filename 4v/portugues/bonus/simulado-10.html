<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“Os alunos e a diretora cantaram na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Os alunos e a diretora", "diretora", "na festa", "cantaram na festa", "alunos, diretora"], "certa": 0, "explicacao": "a) Os alunos e a diretora — cuidado: “alunos, diretora” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>barriga</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, o som forte do r se escreve com rr", "depois de n, l e s, o r tem som forte com uma letra só", "no começo da palavra, o r já tem som forte", "entre vogais, um r só tem som forte", "rr aparece só no começo das palavras"], "certa": 0, "explicacao": "a) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chova.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esquentar, ficar mais forte", "muito esquisito, absurdo", "esfriar, perder a força", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["livrinho", "focinho", "florzinha", "gatinho", "cafezinho"], "certa": 1, "explicacao": "b) focinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "A palavra <b>o crocodilo</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "comum de dois", "tem feminino diferente (biforme)", "epiceno", "sobrecomum"], "certa": 3, "explicacao": "d) epiceno — animal: o crocodilo macho / o crocodilo fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Às vezes, durmo à tarde.", "Fiz uma visita àquele museu.", "Conheci à feira.", "Começou a chover à noite."], "certa": 3, "explicacao": "d) — o certo é “a feira”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Daqui a dois dias, eles ___ suco. Qual forma completa a frase? Responda com a letra.", "alternativas": ["bebiam", "beberão", "beberam", "beberiam", "bebem"], "certa": 1, "explicacao": "b) beberão — futuro: -ão."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "arrependido", "que passa num instante", "que está em toda parte", "do contra, teimoso"], "certa": 1, "explicacao": "b) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>obra-prima</b>? Responda com a letra.", "alternativas": ["obra-primas", "obras-primas", "obra-primaes", "obra-prima", "obras-prima"], "certa": 1, "explicacao": "b) obras-primas"}, {"enunciado": "“Escove os dentes, pois você comeu doce.”<br>Qual conjunção pode ficar no lugar de <b>pois</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["portanto", "mas", "contudo", "por isso", "porque"], "certa": 4, "explicacao": "e) porque — as duas dão ideia de explicação."}, {"enunciado": "Qual é o diminutivo de <b>burro</b>? Responda com a letra.", "alternativas": ["gotícula", "cafezinho", "flautim", "burrico", "copinho"], "certa": 3, "explicacao": "d) burrico"}, {"enunciado": "Por que a palavra <b>armazém</b> tem acento? Responda com a letra.", "alternativas": ["monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona terminada em em ou ens leva acento", "paroxítona terminada em um ou uns leva acento", "paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento", "paroxítona terminada em l leva acento"], "certa": 1, "explicacao": "b) oxítona terminada em em ou ens leva acento (ar-ma-zém)."}, {"enunciado": "Leia: “O “remédio milagroso” era um embuste.” Nessa frase, <b>embuste</b> quer dizer… Responda com a letra.", "alternativas": ["que acontece fora de hora", "mínimo, o menor de todos", "empurrão", "esfriar, perder a força", "mentira, golpe para enganar"], "certa": 4, "explicacao": "e) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os lápis", "os hifens", "os guarda-chuvas", "os fósseis", "as couve-flores"], "certa": 4, "explicacao": "e) as couve-flores — o certo é as couves-flores."}, {"enunciado": "Quem nasce em <b>Alagoas</b> é… Responda com a letra.", "alternativas": ["catarinense", "venezuelano", "alagoano", "macapaense", "marroquino"], "certa": 2, "explicacao": "c) alagoano"}, {"enunciado": "Qual é o coletivo de <b>ovelhas</b>? Responda com a letra.", "alternativas": ["bando", "cardume", "manada", "coro", "rebanho"], "certa": 4, "explicacao": "e) rebanho — manada é de outro grupo."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["O time de Felipe mostrou o desenho.", "Havia três gatos no telhado.", "A vovó e o vovô beberam suco.", "As amigas de Lívia correram no parque.", "Batemos na porta."], "certa": 1, "explicacao": "b) Havia três gatos no telhado."}, {"enunciado": "Leia: “Manuela foi estoica: tomou a vacina sem dar um pio.” Nessa frase, <b>estoica</b> quer dizer… Responda com a letra.", "alternativas": ["que dura pouco tempo", "aliviar, diminuir (uma dor, um problema)", "firme e calmo diante do sofrimento", "totalmente fechado; difícil de entender", "chorão, que reclama de tudo"], "certa": 2, "explicacao": "c) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>vaso</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O jogador deu xeque no rei adversário.", "Ao dormir, é preciso cerrar os olhos.", "Os brinquedos ficam na seção infantil da loja.", "A sessão de cinema começa às oito.", "Ele tem um ótimo censo de humor."], "certa": 4, "explicacao": "e) — o certo é “senso” (juízo)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitas crianças brincavam no parque.", "Ganhei muitos presentes.", "Muitos alunos faltaram.", "Eles riram muito.", "Fizemos muitas perguntas."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Leia: “A estrela cadente deixou um brilho fugaz no céu.” Nessa frase, <b>fugaz</b> quer dizer… Responda com a letra.", "alternativas": ["que brilha muito forte", "dispensar, não precisar de algo", "que passa num instante", "que dá para acreditar, razoável", "remédio para todos os males"], "certa": 2, "explicacao": "c) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "“Venceram o campeonato a vovó e o vovô.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Venceram", "o", "o sujeito está escondido (oculto)", "a vovó e o vovô", "não tem sujeito"], "certa": 3, "explicacao": "d) a vovó e o vovô — o sujeito veio depois do verbo. Pergunte: quem venceram?"}, {"enunciado": "Como se lê <b>Luís XIV</b>? Responda com a letra.", "alternativas": ["décimo quarto", "treze", "14", "quinze", "catorze"], "certa": 4, "explicacao": "e) catorze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Na frase “Você faltou <b>porque</b> estava doente?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "o motivo", "por qual motivo", "pelo qual / pela qual", "por qual"], "certa": 0, "explicacao": "a) pois — a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "Ontem eles ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["podem", "puderam", "poderam", "podiam", "poderão"], "certa": 1, "explicacao": "b) puderam"}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["sem medo, destemido", "muito esquisito, absurdo", "que não se apaga", "pálido, sem cor", "resistente (ao calor, a mudanças)"], "certa": 0, "explicacao": "a) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Trouxe o lápis para eu desenhar.", "Traga o caderno para mim copiar a lição.", "O bolo é para mim.", "Para mim, fazer isso é fácil."], "certa": 2, "explicacao": "c) — o certo é “para eu copiar”."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
