<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“O dono da padaria cantou na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["O dono da padaria", "padaria", "na festa", "cantou na festa", "dono"], "certa": 0, "explicacao": "a) O dono da padaria — cuidado: “dono” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>ombro</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["antes de p e b se usa m", "no fim da palavra se usa n", "antes de qualquer consoante se usa n", "antes de t e d se usa n", "depois de vogal com acento se usa m"], "certa": 0, "explicacao": "a) antes de p e b se usa m"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chova.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esquentar, ficar mais forte", "muito esquisito, absurdo", "esfriar, perder a força", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["livrinho", "espinho", "florzinha", "gatinho", "cafezinho"], "certa": 1, "explicacao": "b) espinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "A palavra <b>o crocodilo</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "comum de dois", "tem feminino diferente (biforme)", "epiceno", "sobrecomum"], "certa": 3, "explicacao": "d) epiceno — animal: o crocodilo macho / o crocodilo fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Às vezes, durmo à tarde.", "Fiz uma visita àquele museu.", "Conheci à praia.", "Começou a chover à noite."], "certa": 3, "explicacao": "d) — o certo é “a praia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Daqui a dois dias, eles ___ de bicicleta. Qual forma completa a frase? Responda com a letra.", "alternativas": ["andavam", "andarão", "andaram", "andariam", "andam"], "certa": 1, "explicacao": "b) andarão — futuro: -ão."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "arrependido", "que passa num instante", "que está em toda parte", "do contra, teimoso"], "certa": 1, "explicacao": "b) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>segunda-feira</b>? Responda com a letra.", "alternativas": ["segundas-feiras", "segunda-feira", "segundas-feira", "segunda-feiraes", "segunda-feiras"], "certa": 0, "explicacao": "a) segundas-feiras"}, {"enunciado": "“A casa é velha, mas é muito bonita.”<br>Qual conjunção pode ficar no lugar de <b>mas</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["pois", "por isso", "e", "todavia", "porque"], "certa": 3, "explicacao": "d) todavia — as duas dão ideia de oposição."}, {"enunciado": "Qual é o diminutivo de <b>burro</b>? Responda com a letra.", "alternativas": ["livrinho", "burrico", "ovinho", "riacho", "copinho"], "certa": 1, "explicacao": "b) burrico"}, {"enunciado": "Por que a palavra <b>vírus</b> tem acento? Responda com a letra.", "alternativas": ["oxítona terminada em o leva acento", "paroxítona terminada em us leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "toda proparoxítona (a força na antepenúltima sílaba) tem acento"], "certa": 1, "explicacao": "b) paroxítona terminada em us leva acento (ví-rus)."}, {"enunciado": "Leia: “O “remédio milagroso” era um embuste.” Nessa frase, <b>embuste</b> quer dizer… Responda com a letra.", "alternativas": ["muitas vezes, com frequência", "dispensar, não precisar de algo", "mentira, golpe para enganar", "empurrão", "arrependido"], "certa": 2, "explicacao": "c) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os lápises", "os tórax", "os pastéis", "os cidadãos", "os arco-íris"], "certa": 0, "explicacao": "a) os lápises — o certo é os lápis."}, {"enunciado": "Quem nasce no <b>Piauí</b> é… Responda com a letra.", "alternativas": ["gaúcho", "recifense", "piauiense", "paulista", "paranaense"], "certa": 2, "explicacao": "c) piauiense"}, {"enunciado": "Qual é o coletivo de <b>músicos</b>? Responda com a letra.", "alternativas": ["time", "banda", "dentadura", "coro", "elenco"], "certa": 1, "explicacao": "b) banda — coro é de outro grupo."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Pulamos corda.", "A vovó e o vovô decidiram o jogo.", "Felipe olhou as estrelas.", "Procurei a bola.", "Trovejou durante o jogo."], "certa": 4, "explicacao": "e) Trovejou durante o jogo."}, {"enunciado": "Leia: “Manuela foi estoica: tomou a vacina sem dar um pio.” Nessa frase, <b>estoica</b> quer dizer… Responda com a letra.", "alternativas": ["chorão, que reclama de tudo", "que passa num instante", "firme e calmo diante do sofrimento", "sem nenhum machucado, ileso", "pouco, escasso"], "certa": 2, "explicacao": "c) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>pobreza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["toda palavra terminada em -eza é feminino de origem", "o final -esa sempre se escreve com z", "femininos e palavras de origem terminam em -esa", "substantivos que vêm de adjetivos terminam em -eza", "palavras que indicam país terminam em -eza"], "certa": 3, "explicacao": "d) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O rei da Pérsia era chamado de xá.", "Guardei o arroz na despensa.", "Esqueci o acento da palavra “avó”.", "O senso de 2022 contou a população do Brasil.", "Medi o comprimento da mesa com a fita métrica."], "certa": 3, "explicacao": "d) — o certo é “censo” (contagem da população)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["A prova foi muito fácil.", "As flores eram muito cheirosas.", "Ela leu muitos livros.", "A sopa estava muito quente.", "A girafa é muito alta."], "certa": 2, "explicacao": "c) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Leia: “A estrela cadente deixou um brilho fugaz no céu.” Nessa frase, <b>fugaz</b> quer dizer… Responda com a letra.", "alternativas": ["que brilha muito forte", "sem medo, destemido", "resistente (ao calor, a mudanças)", "que passa num instante", "esforço, vontade forte de fazer algo"], "certa": 3, "explicacao": "d) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "“Chegaram cedo as crianças da escola.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["as crianças da escola", "cedo", "Chegaram", "não tem sujeito", "o sujeito está escondido (oculto)"], "certa": 0, "explicacao": "a) as crianças da escola — o sujeito veio depois do verbo. Pergunte: quem chegaram?"}, {"enunciado": "Como se lê <b>século XXI</b>? Responda com a letra.", "alternativas": ["vigésimo primeiro", "vinte e um", "vinte e dois", "vinte", "21"], "certa": 1, "explicacao": "b) vinte e um — depois do décimo, lê-se como cardinal."}, {"enunciado": "Na frase “Explique <b>por que</b> a planta precisa de sol.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["o motivo", "motivo para", "pois", "por qual motivo", "porém"], "certa": 3, "explicacao": "d) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Ontem eles ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["fizeram", "fazeram", "farão", "fazem", "faziam"], "certa": 0, "explicacao": "a) fizeram"}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["proveitoso, que dá bons resultados", "que fala ou escreve demais, enrolando", "pálido, sem cor", "ligado à vida simples e tranquila do campo", "sem medo, destemido"], "certa": 4, "explicacao": "e) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "Entre mim e você, tudo bem.", "Ela deu o recado para eu levar.", "Felipe trouxe a receita para mim estudar."], "certa": 4, "explicacao": "e) — o certo é “para eu estudar”."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
