<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“O irmão mais velho de Otávio cantou na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio", "Otávio", "na festa", "cantou na festa", "irmão"], "certa": 0, "explicacao": "a) O irmão mais velho de Otávio — cuidado: “irmão” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>ombro</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["antes de p e b se usa m", "no fim da palavra se usa n", "antes de qualquer consoante se usa n", "antes de t e d se usa n", "depois de vogal com acento se usa m"], "certa": 0, "explicacao": "a) antes de p e b se usa m"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chova.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esquentar, ficar mais forte", "muito esquisito, absurdo", "esfriar, perder a força", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["livrinho", "espinho", "florzinha", "gatinho", "cafezinho"], "certa": 1, "explicacao": "b) espinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "A palavra <b>a pantera</b> é… Responda com a letra.", "alternativas": ["comum de dois", "tem feminino diferente (biforme)", "epiceno", "não tem gênero", "sobrecomum"], "certa": 2, "explicacao": "c) epiceno — animal: a pantera macho / a pantera fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Às vezes, durmo à tarde.", "Fiz uma visita àquele museu.", "Bianca foi a biblioteca.", "Começou a chover à noite."], "certa": 3, "explicacao": "d) — o certo é “à biblioteca”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Daqui a dois dias, eles ___ suco. Qual forma completa a frase? Responda com a letra.", "alternativas": ["bebiam", "beberão", "beberam", "beberiam", "bebem"], "certa": 1, "explicacao": "b) beberão — futuro: -ão."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "arrependido", "que passa num instante", "que está em toda parte", "do contra, teimoso"], "certa": 1, "explicacao": "b) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>mula sem cabeça</b>? Responda com a letra.", "alternativas": ["mula sem cabeçaes", "mula sem cabeças", "mulas sem cabeça", "mulas sem cabeças", "mula sem cabeça"], "certa": 2, "explicacao": "c) mulas sem cabeça"}, {"enunciado": "“A ponte caiu, por isso tivemos de voltar.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["caso", "mas", "porque", "se", "portanto"], "certa": 4, "explicacao": "e) portanto — as duas dão ideia de conclusão."}, {"enunciado": "Qual é o aumentativo de <b>time</b>? Responda com a letra.", "alternativas": ["timaço", "garrafão", "casarão", "baldão", "salão"], "certa": 0, "explicacao": "a) timaço"}, {"enunciado": "Por que a palavra <b>lágrima</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em ei ou eis leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "paroxítona terminada em us leva acento", "paroxítona terminada em um ou uns leva acento"], "certa": 2, "explicacao": "c) toda proparoxítona (a força na antepenúltima sílaba) tem acento (lá-gri-ma)."}, {"enunciado": "Leia: “O “remédio milagroso” era um embuste.” Nessa frase, <b>embuste</b> quer dizer… Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "mentira, golpe para enganar", "empurrão", "esforço, vontade forte de fazer algo", "isca, armadilha para enganar"], "certa": 1, "explicacao": "b) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os hifens", "os pires", "os lápises", "os guarda-chuvas", "os pastéis"], "certa": 2, "explicacao": "c) os lápises — o certo é os lápis."}, {"enunciado": "Quem nasce no <b>México</b> é… Responda com a letra.", "alternativas": ["mexicano", "angolano", "natalense", "paraibano", "tocantinense"], "certa": 0, "explicacao": "a) mexicano"}, {"enunciado": "Qual é o coletivo de <b>ovelhas</b>? Responda com a letra.", "alternativas": ["cardume", "bando", "manada", "nuvem", "rebanho"], "certa": 4, "explicacao": "e) rebanho — manada é de outro grupo."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Os meninos da rua jogaram bola.", "Ventou muito na praia.", "Ricardo e a irmã viajaram para a praia.", "Anoiteceu cedo.", "Abrimos a janela."], "certa": 4, "explicacao": "e) Abrimos a janela."}, {"enunciado": "Leia: “Manuela foi estoica: tomou a vacina sem dar um pio.” Nessa frase, <b>estoica</b> quer dizer… Responda com a letra.", "alternativas": ["chorão, que reclama de tudo", "remédio para todos os males", "lento para entender", "firme e calmo diante do sofrimento", "que traz boas notícias"], "certa": 3, "explicacao": "d) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>braço</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç só se usa antes de a, o e u", "antes de a, o e u, o c tem som de k", "antes de e e i, o c já tem som de s", "antes de e e i se usa ç", "ç pode aparecer no começo da palavra"], "certa": 0, "explicacao": "a) ç só se usa antes de a, o e u"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Os pais devem prover o sustento dos filhos.", "A loja vai sortir o estoque de doces.", "A polícia combate o tráfico de animais silvestres.", "O cozinheiro despejou a calda de chocolate no sorvete.", "O piano foi para o concerto porque estava desafinado."], "certa": 4, "explicacao": "e) — o certo é “conserto” (reparo)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Ela leu muitos livros.", "Ganhei muitos presentes.", "Vi muitos pássaros.", "Comemos muitos pastéis.", "O bolo estava muito gostoso."], "certa": 4, "explicacao": "e) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Leia: “A estrela cadente deixou um brilho fugaz no céu.” Nessa frase, <b>fugaz</b> quer dizer… Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "que passa num instante", "que brilha muito forte", "vencer, controlar (um incêndio, uma crise)", "digno de confiança, verdadeiro"], "certa": 1, "explicacao": "b) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "“Venceram o campeonato Ricardo e a irmã.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "Venceram", "Ricardo e a irmã", "não tem sujeito", "o"], "certa": 2, "explicacao": "c) Ricardo e a irmã — o sujeito veio depois do verbo. Pergunte: quem venceram?"}, {"enunciado": "Como se lê <b>capítulo XII</b>? Responda com a letra.", "alternativas": ["doze", "décimo segundo", "12", "treze", "onze"], "certa": 0, "explicacao": "a) doze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Na frase “O cientista descobriu <b>por que</b> os vulcões entram em erupção.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "pelo qual / pela qual", "por isso", "o motivo", "por qual motivo"], "certa": 4, "explicacao": "e) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Ontem ele ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["faz", "fazeu", "fará", "fez", "fazia"], "certa": 3, "explicacao": "d) fez"}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "sem medo, destemido", "defesa, elogio de uma ideia", "pálido, sem cor", "o público que assiste a um espetáculo"], "certa": 1, "explicacao": "b) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "Isso é para eu ler.", "Bianca trouxe o jogo para mim copiar.", "Trouxe o lápis para eu desenhar.", "Para mim, estudar à noite é melhor."], "certa": 2, "explicacao": "c) — o certo é “para eu copiar”."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
