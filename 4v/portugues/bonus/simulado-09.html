<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>comprido</b>? Responda com a letra.", "alternativas": ["nó", "longo", "prestes a acontecer", "realizado", "aumento de preços"], "certa": 1, "explicacao": "b) longo — não confunda com “cumprido” (realizado)."}, {"enunciado": "Qual é o plural de <b>cachorro-quente</b>? Responda com a letra.", "alternativas": ["cachorro-quentes", "cachorro-quentees", "cachorros-quentes", "cachorros-quente", "cachorro-quente"], "certa": 2, "explicacao": "c) cachorros-quentes"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["tônica", "relâmpago", "países", "mágoa", "plástico"], "certa": 2, "explicacao": "c) países — pa-í-ses: é paroxítona."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "que dá para acreditar, razoável", "que acontece fora de hora", "esforço, vontade forte de fazer algo", "dispensar, não precisar de algo"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>engolir sapo</b>? Responda com a letra.", "alternativas": ["estar distraído", "descansar para se recuperar", "aguentar algo ruim calado", "sentir muita dor", "contar um segredo"], "certa": 2, "explicacao": "c) aguentar algo ruim calado"}, {"enunciado": "Quando eu ___ o filme, conto para você. (verbo ver)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["ver", "vi", "veja", "vir", "vejo"], "certa": 3, "explicacao": "d) vir"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Faz frio no inverno.", "Manuela e Bianca desenharam um castelo.", "O time de Felipe tocou violão.", "A turma do quinto ano sonhou com dragões.", "Pescamos no lago."], "certa": 1, "explicacao": "b) Manuela e Bianca desenharam um castelo."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["chapél", "sujeira", "gengibre", "chuchu", "gorjeta"], "certa": 0, "explicacao": "a) chapél — o certo é chapéu: com ch e u no fim (chapeuzinho)."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arma truques para enganar", "que arde, que queima", "breve e direto", "que passa num instante", "que não toma partido, que é justo com todos os lados"], "certa": 0, "explicacao": "a) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Felipe dormiu muito.", "Havia muitas estrelas no céu.", "Muitos alunos faltaram.", "Comemos muitos pastéis.", "Havia muita gente na praia."], "certa": 0, "explicacao": "a) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a alface", "o clima", "o moto", "a couve", "o guaraná"], "certa": 2, "explicacao": "c) o moto — o certo é “a moto”."}, {"enunciado": "A palavra <b>o indivíduo</b> é… Responda com a letra.", "alternativas": ["comum de dois", "epiceno", "sobrecomum", "não tem gênero", "tem feminino diferente (biforme)"], "certa": 2, "explicacao": "c) sobrecomum — o indivíduo serve para menino e menina, sem mudar nada."}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "ligado à vida simples e tranquila do campo", "triste, melancólico", "muitas vezes, com frequência", "oportunidade, ocasião"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["carrinho", "pinho", "casinha", "florzinha", "cafezinho"], "certa": 1, "explicacao": "b) pinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "— Psiu! Moça, esqueceu a sacola!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar dor", "mostrar nojo", "chamar alguém", "pedir silêncio", "mostrar alegria"], "certa": 2, "explicacao": "c) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Por que a palavra <b>mensagem</b> se escreve com <b>g</b>? Responda com a letra.", "alternativas": ["palavras de origem tupi costumam ter j", "substantivos terminados em -agem se escrevem com g", "é o verbo viajar (que eles viajem), que se escreve com j", "substantivos terminados em -ajem levam j", "antes de e e i, g e j têm o mesmo som, então tanto faz"], "certa": 1, "explicacao": "b) substantivos terminados em -agem se escrevem com g"}, {"enunciado": "Por que a palavra <b>vaso</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "depois de consoante, um s só já tem som de s", "entre vogais, o s tem som de z", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s"], "certa": 2, "explicacao": "c) entre vogais, o s tem som de z"}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "que dura muito, que não acaba", "isca, armadilha para enganar", "vencer, controlar (um incêndio, uma crise)", "começar, provocar"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["a-rei-a", "ter-ra", "e-cli-pse", "ze-bra", "as-pec-to"], "certa": 2, "explicacao": "c) e-cli-pse — o certo é e-clip-se: a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Na locução verbal <b>vamos plantar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["os dois são principais", "não há verbo principal", "vamos", "o sujeito", "plantar"], "certa": 4, "explicacao": "e) plantar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce no <b>Egito</b> é… Responda com a letra.", "alternativas": ["capixaba", "egípcio", "paraense", "italiano", "potiguar"], "certa": 1, "explicacao": "b) egípcio"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vou à Bahia.", "Comemos bife à milanesa.", "Viajei a Roma e à Itália.", "Aprendi a nadar.", "Assisti a novela com a avó."], "certa": 4, "explicacao": "e) — o certo é “à novela”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["lento para entender", "oportunidade, ocasião", "desejo, vontade", "caro, que custa muito", "firme e calmo diante do sofrimento"], "certa": 1, "explicacao": "b) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "“Saiu correndo a professora de música.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["a professora de música", "não tem sujeito", "Saiu", "correndo", "o sujeito está escondido (oculto)"], "certa": 0, "explicacao": "a) a professora de música — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["necessário", "aceçório", "açúcar", "excelente", "pesquisa"], "certa": 1, "explicacao": "b) aceçório — o certo é acessório: com c (antes de e) e ss (entre vogais)."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles falarão com a vovó.", "Hoje de manhã, eles partiram cedo.", "Na semana passada, eles uniram as peças.", "Daqui a dois dias, eles comeram pizza.", "Amanhã, eles aprenderão uma música nova."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>camisa</b>? Responda com a letra.", "alternativas": ["livrinho", "riacho", "maleta", "camiseta", "aviãozinho"], "certa": 3, "explicacao": "d) camiseta"}, {"enunciado": "Leia: “Procure informações em sites fidedignos.” Nessa frase, <b>fidedignos</b> quer dizer… Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que não se apaga", "duvidoso, suspeito", "muitas vezes, com frequência", "mínimo, o menor de todos"], "certa": 0, "explicacao": "a) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Quem comprou pão?", "Por que minhas tias pescaram no lago?", "Que gol bonito!", "Manuela e Bianca estudaram para a prova.", "Resista ao doce."], "certa": 3, "explicacao": "d) Manuela e Bianca estudaram para a prova."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "O bolo é para mim.", "Bianca trouxe o livro para eu.", "Ela deu o recado para eu levar."], "certa": 3, "explicacao": "d) — o certo é “para mim”."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
