<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>cumprido</b>? Responda com a letra.", "alternativas": ["nó", "realizado", "prestes a acontecer", "longo", "aumento de preços"], "certa": 1, "explicacao": "b) realizado — não confunda com “comprido” (longo)."}, {"enunciado": "Qual é o plural de <b>cachorro-quente</b>? Responda com a letra.", "alternativas": ["cachorro-quentes", "cachorro-quentees", "cachorros-quentes", "cachorros-quente", "cachorro-quente"], "certa": 2, "explicacao": "c) cachorros-quentes"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["tônica", "relâmpago", "países", "mágoa", "plástico"], "certa": 2, "explicacao": "c) países — pa-í-ses: é paroxítona."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "que dá para acreditar, razoável", "que acontece fora de hora", "esforço, vontade forte de fazer algo", "dispensar, não precisar de algo"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>engolir sapo</b>? Responda com a letra.", "alternativas": ["estar distraído", "descansar para se recuperar", "aguentar algo ruim calado", "sentir muita dor", "contar um segredo"], "certa": 2, "explicacao": "c) aguentar algo ruim calado"}, {"enunciado": "Se vocês ___ tempo, avisem. (verbo ter)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["ter", "tiveram", "tenham", "têm", "tiverem"], "certa": 4, "explicacao": "e) tiverem"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Faz frio no inverno.", "Manuela e Bianca desenharam um castelo.", "O time de Felipe tocou violão.", "A turma do quinto ano sonhou com dragões.", "Pescamos no lago."], "certa": 1, "explicacao": "b) Manuela e Bianca desenharam um castelo."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jesto", "enxurrada", "cochilo", "jiboia", "sujeira"], "certa": 0, "explicacao": "a) jesto — o certo é gesto: com g, de cor."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "mínimo, o menor de todos", "que arde, que queima", "que arma truques para enganar", "inconveniente; fora do assunto"], "certa": 3, "explicacao": "d) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Havia muita gente na praia.", "A girafa é muito alta.", "A prova foi muito fácil.", "Felipe dormiu muito.", "Manuela canta muito bem."], "certa": 0, "explicacao": "a) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o sistema", "o omelete", "a tribo", "a couve", "a cal"], "certa": 1, "explicacao": "b) o omelete — o certo é “a omelete”."}, {"enunciado": "A palavra <b>o/a colega</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "não tem gênero", "tem feminino diferente (biforme)", "comum de dois", "epiceno"], "certa": 3, "explicacao": "d) comum de dois — o colega / a colega: a palavra é igual, o artigo muda."}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "triste, melancólico", "que dura pouco tempo", "esperto, que percebe tudo rápido", "ligado à vida simples e tranquila do campo"], "certa": 4, "explicacao": "e) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["cafezinho", "pezinho", "livrinho", "casinha", "padrinho"], "certa": 4, "explicacao": "e) padrinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "— Psiu! Não acorde o vovô.<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar alegria", "chamar alguém", "mostrar nojo", "mostrar dor", "pedir silêncio"], "certa": 4, "explicacao": "e) pedir silêncio — o contexto decide o sentido."}, {"enunciado": "Por que a palavra <b>viagem</b> se escreve com <b>g</b>? Responda com a letra.", "alternativas": ["substantivos terminados em -ajem levam j", "é o verbo viajar (que eles viajem), que se escreve com j", "antes de e e i, g e j têm o mesmo som, então tanto faz", "substantivos terminados em -agem se escrevem com g", "palavras de origem tupi costumam ter j"], "certa": 3, "explicacao": "d) substantivos terminados em -agem se escrevem com g"}, {"enunciado": "Por que a palavra <b>laço</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç só se usa antes de a, o e u", "antes de e e i, o c já tem som de s", "antes de e e i se usa ç", "antes de a, o e u, o c tem som de k", "ç pode aparecer no começo da palavra"], "certa": 0, "explicacao": "a) ç só se usa antes de a, o e u"}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["começar, provocar", "novato, iniciante", "vencer, controlar (um incêndio, uma crise)", "resistente (ao calor, a mudanças)", "sem medo, destemido"], "certa": 2, "explicacao": "c) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["ne-gro", "pê-sse-go", "a-leg-re", "bis-co-i-to", "pa-cto"], "certa": 0, "explicacao": "a) ne-gro — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Na locução verbal <b>tenho de tocar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["tenho", "não há verbo principal", "os dois são principais", "tocar", "o sujeito"], "certa": 3, "explicacao": "d) tocar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>Mato Grosso do Sul</b> é… Responda com a letra.", "alternativas": ["sul-mato-grossense", "argentino", "tocantinense", "florianopolitano", "boliviano"], "certa": 0, "explicacao": "a) sul-mato-grossense"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Viajei à Roma no verão.", "Vire à esquerda.", "Vou à Bahia.", "Aprendi a nadar.", "Passeamos a cavalo."], "certa": 0, "explicacao": "a) — o certo é “a Roma”: macete: “vou a, volto de: crase pra quê?”."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "caro, que custa muito", "inconveniente; fora do assunto", "desejo, vontade", "oportunidade, ocasião"], "certa": 4, "explicacao": "e) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "“Sumiu do quintal o irmão mais velho de Otávio.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "Sumiu", "o irmão mais velho de Otávio", "do", "não tem sujeito"], "certa": 2, "explicacao": "c) o irmão mais velho de Otávio — o sujeito veio depois do verbo. Pergunte: quem sumiu?"}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["prinssesa", "princeza", "prinsesa", "princessa", "princesa"], "certa": 4, "explicacao": "e) princesa — feminino em -esa: s."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles escreveram uma carta.", "Daqui a dois dias, eles abriram a janela.", "Hoje de manhã, eles estudaram para a prova.", "Hoje de manhã, eles trabalharam na horta.", "Ontem, eles cantaram na festa."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o aumentativo de <b>barco</b>? Responda com a letra.", "alternativas": ["casarão", "barcaça", "portão", "pezão", "papelão"], "certa": 1, "explicacao": "b) barcaça"}, {"enunciado": "Leia: “Procure informações em sites fidedignos.” Nessa frase, <b>fidedignos</b> quer dizer… Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "digno de confiança, verdadeiro", "o público que assiste a um espetáculo", "duvidoso, suspeito", "novato, iniciante"], "certa": 1, "explicacao": "b) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Por que a turma do quinto ano dançou na quadrilha?", "Como você cresceu!", "Procure a bola!", "Jogue bola.", "A girafa do zoológico tocou violão."], "certa": 0, "explicacao": "a) Por que a turma do quinto ano dançou na quadrilha?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Entre mim e você, tudo bem.", "O bolo é para mim.", "Ela deu o recado para eu levar.", "A professora trouxe a receita para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
