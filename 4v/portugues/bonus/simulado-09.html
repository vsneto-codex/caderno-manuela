<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>eminente</b>? Responda com a letra.", "alternativas": ["nó", "ilustre", "mergulhar", "prestes a acontecer", "aumento de preços"], "certa": 1, "explicacao": "b) ilustre — não confunda com “iminente” (prestes a acontecer)."}, {"enunciado": "Qual é o plural de <b>cachorro-quente</b>? Responda com a letra.", "alternativas": ["cachorro-quentes", "cachorro-quentees", "cachorros-quentes", "cachorros-quente", "cachorro-quente"], "certa": 2, "explicacao": "c) cachorros-quentes"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["tônica", "relâmpago", "países", "mágoa", "plástico"], "certa": 2, "explicacao": "c) países — pa-í-ses: é paroxítona."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "que dá para acreditar, razoável", "que acontece fora de hora", "esforço, vontade forte de fazer algo", "dispensar, não precisar de algo"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>pôr a mão no fogo por alguém</b>? Responda com a letra.", "alternativas": ["aguentar algo ruim calado", "ficar muito surpreso", "confiar totalmente", "fazer igual", "sentir muita dor"], "certa": 2, "explicacao": "c) confiar totalmente"}, {"enunciado": "Se vocês ___ a resposta, avisem. (verbo saber)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["saber", "souberam", "saibam", "sabem", "souberem"], "certa": 4, "explicacao": "e) souberem"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Faz frio no inverno.", "Manuela e Bianca desenharam um castelo.", "O time de Felipe tocou violão.", "A turma do quinto ano sonhou com dragões.", "Pescamos no lago."], "certa": 1, "explicacao": "b) Manuela e Bianca desenharam um castelo."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jeito", "chuchu", "boxecha", "chuveiro", "xampu"], "certa": 2, "explicacao": "c) boxecha — o certo é bochecha: com ch nas duas sílabas."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "remédio para todos os males", "que arde, que queima", "que arma truques para enganar", "que dá para acreditar, razoável"], "certa": 3, "explicacao": "d) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Ela leu muitos livros.", "Manuela canta muito bem.", "Estudei muito ontem.", "A girafa é muito alta.", "A sopa estava muito quente."], "certa": 0, "explicacao": "a) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o cometa", "a clã", "a sentinela", "a foto", "o mapa"], "certa": 1, "explicacao": "b) a clã — o certo é “o clã”."}, {"enunciado": "A palavra <b>o cônjuge</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "comum de dois", "tem feminino diferente (biforme)", "não tem gênero", "epiceno"], "certa": 0, "explicacao": "a) sobrecomum — o cônjuge serve para menino e menina, sem mudar nada."}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["nunca visto antes, extraordinário", "ligado à vida simples e tranquila do campo", "triste, melancólico", "generoso, de coração grande", "que não toma partido, que é justo com todos os lados"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["pinho", "casinha", "carrinho", "livrinho", "dedinho"], "certa": 0, "explicacao": "a) pinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "Por que a palavra <b>viajem</b> se escreve com <b>j</b>? Responda com a letra.", "alternativas": ["é o verbo viajar (que eles viajem), que se escreve com j", "substantivos terminados em -agem se escrevem com g", "substantivos terminados em -ajem levam j", "palavras de origem tupi costumam ter j", "antes de e e i, g e j têm o mesmo som, então tanto faz"], "certa": 0, "explicacao": "a) é o verbo viajar (que eles viajem), que se escreve com j"}, {"enunciado": "Por que a palavra <b>casa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o s tem som de z", "ss pode começar uma palavra", "entre vogais, o som de s se escreve com ss", "no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s"], "certa": 0, "explicacao": "a) entre vogais, o s tem som de z"}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["começar, provocar", "digno de confiança, verdadeiro", "vencer, controlar (um incêndio, uma crise)", "esbanjador, que gasta demais", "confusão, situação enrolada"], "certa": 2, "explicacao": "c) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["con-vic-ção", "cei-a", "fai-xa", "le-i-te", "a-le-gre"], "certa": 3, "explicacao": "d) le-i-te — o certo é lei-te: no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Na locução verbal <b>estou desenhando</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["o sujeito", "estou", "os dois são principais", "desenhando", "não há verbo principal"], "certa": 3, "explicacao": "d) desenhando — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce nos <b>Estados Unidos</b> é… Responda com a letra.", "alternativas": ["peruano", "estadunidense", "acriano", "recifense", "venezuelano"], "certa": 1, "explicacao": "b) estadunidense"}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "oportunidade, ocasião", "que dá para acreditar, razoável", "exibido, que usa palavras difíceis só para se mostrar", "desejo, vontade"], "certa": 1, "explicacao": "b) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "“Apareceu de repente a professora de música.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Apareceu", "de", "a professora de música", "o sujeito está escondido (oculto)", "não tem sujeito"], "certa": 2, "explicacao": "c) a professora de música — o sujeito veio depois do verbo. Pergunte: quem apareceu?"}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["picina", "pesquissa", "cansasso", "travesseiro", "princessa"], "certa": 3, "explicacao": "d) travesseiro — som de s entre vogais: ss."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles mandarão uma mensagem.", "Ontem, eles pintarão um quadro.", "Na semana passada, eles guardaram os brinquedos.", "Na semana passada, eles andaram de bicicleta.", "Amanhã, eles viajarão para a praia."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o aumentativo de <b>fogo</b>? Responda com a letra.", "alternativas": ["mulherão", "carrão", "olhão", "bichão", "fogaréu"], "certa": 4, "explicacao": "e) fogaréu"}, {"enunciado": "Leia: “Procure informações em sites fidedignos.” Nessa frase, <b>fidedignos</b> quer dizer… Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "esbanjador, que gasta demais", "duvidoso, suspeito", "muitas vezes, com frequência", "mínimo, o menor de todos"], "certa": 0, "explicacao": "a) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Meu avô escreveu uma carta.", "Quem resistiu ao doce?", "Que dia lindo!", "Estude para a prova!", "Nossa, que frio!"], "certa": 1, "explicacao": "b) Quem resistiu ao doce?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "Trouxe o lápis para eu desenhar.", "O bolo é para mim.", "Ela deu o recado para eu levar.", "A professora trouxe o mapa para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>antes</b>? Responda com a letra.", "alternativas": ["sujo", "velho", "agitado", "depois", "lento"], "certa": 3, "explicacao": "d) depois"}, {"enunciado": "Leia: “O juiz precisa ser imparcial: não pode torcer para nenhum time.” Nessa frase, <b>imparcial</b> quer dizer… Responda com a letra.", "alternativas": ["que está pela metade", "que passa num instante", "firme e calmo diante do sofrimento", "que não toma partido, que é justo com todos os lados", "confirmar, reforçar uma ideia"], "certa": 3, "explicacao": "d) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
