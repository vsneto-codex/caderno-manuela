<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Hoje de manhã, eles ___ na horta. Qual forma completa a frase? Responda com a letra.", "alternativas": ["trabalharam", "trabalhariam", "trabalham", "trabalhavam", "trabalharão"], "certa": 0, "explicacao": "a) trabalharam — passado: -am."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente moramos perto da praia.", "A gente brinca no parque.", "A gente chega cedo à escola.", "Nós acordamos cedo no domingo.", "Nós gostamos de pizza."], "certa": 0, "explicacao": "a) — o certo é “A gente mora”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual é a junção de <b>em + aquela</b>? Responda com a letra.", "alternativas": ["em aquela", "àaquela", "eoaquela", "daquela", "naquela"], "certa": 4, "explicacao": "e) naquela"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "vencer, controlar (um incêndio, uma crise)", "solitário, sozinho", "preciso, feito com muito cuidado", "estranho, fora do comum"], "certa": 4, "explicacao": "e) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>acordado</b>? Responda com a letra.", "alternativas": ["velho", "difícil", "magro", "dormindo", "pobre"], "certa": 3, "explicacao": "d) dormindo"}, {"enunciado": "O que quer dizer <b>inerente</b>? Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "que faz parte da natureza de algo", "onde é muito difícil viver", "esperto, astuto", "espalhar-se (doença, boato)"], "certa": 1, "explicacao": "b) que faz parte da natureza de algo"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ca-cho-ei-ra", "at-mos-fe-ra", "tos-se", "fa-sci-nan-te", "a-tlas"], "certa": 3, "explicacao": "d) fa-sci-nan-te — o certo é fas-ci-nan-te: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["raiva", "caixa", "fantasia", "faixa", "baixo"], "certa": 2, "explicacao": "c) fantasia — fan-ta-si-a"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "sem nenhum machucado, ileso", "feito de leite", "grosseiro, muito grave (um erro)", "o público que assiste a um espetáculo"], "certa": 0, "explicacao": "a) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que razão o bolo afundou?", "— Não vou à praia. — Por quê?", "Ele riu e, não sei por quê, todos riram junto.", "Você faltou porque estava doente?", "Choveu muito; eis porque o jogo parou."], "certa": 4, "explicacao": "e) — o certo é “Choveu muito; eis por que o jogo parou.”: “eis por que” quer dizer “eis o motivo pelo qual”: troque por “por qual motivo”."}, {"enunciado": "Como se escreve <b>42º</b> por extenso? Responda com a letra.", "alternativas": ["quadragésimo terceiro", "quinquagésimo segundo", "quadragésimo segundo", "trigésimo segundo", "quarentésimo segundo"], "certa": 2, "explicacao": "c) quadragésimo segundo"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ideia", "leem", "rainha", "heróico", "países"], "certa": 3, "explicacao": "d) heróico — o certo é heroico: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["O gato é pequeno, todavia é muito corajoso.", "O cachorro latiu e o gato miou.", "A gente joga bola caso a lição acabe cedo.", "Volte cedo, já que amanhã tem aula.", "Choveu a noite toda, logo a rua alagou."], "certa": 4, "explicacao": "e) Choveu a noite toda, logo a rua alagou."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "honroso, que dá orgulho", "caro, que custa muito", "onde é muito difícil viver", "lento para entender"], "certa": 2, "explicacao": "c) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>arco-íris</b>? Responda com a letra.", "alternativas": ["arcos-íris", "arco-írises", "arco-íris", "arcos-íriss", "arco-íriss"], "certa": 2, "explicacao": "c) arco-íris"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["A caixa contém doze lápis.", "Passamos por uma ponte.", "Os guardas mantém a calma.", "Que eles deem o recado.", "Eles leem um livro por semana."], "certa": 2, "explicacao": "c) — o certo é “Os guardas mantêm…”."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A festa vai ser daqui a três dias.", "Onde ficam os menores ossos do corpo?", "Há um ninho de passarinho na varanda.", "Aquele foi um mal sinal: o céu ficou preto.", "Onde fica o maior deserto do mundo?"], "certa": 3, "explicacao": "d) o certo é “mau”"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["casinha", "gatinho", "campainha", "carrinho", "dedinho"], "certa": 2, "explicacao": "c) campainha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "O que quer dizer <b>plateia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "o público que assiste a um espetáculo", "generoso, de coração grande", "onde é muito difícil viver", "o palco onde os atores se apresentam"], "certa": 1, "explicacao": "b) o público que assiste a um espetáculo. Não é “o palco onde os atores se apresentam”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["fome", "vento", "calor", "justiça", "raiva"], "certa": 1, "explicacao": "b) vento — existe por si, mesmo que seja imaginário."}, {"enunciado": "A palavra <b>o/a pianista</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "sobrecomum", "tem feminino diferente (biforme)", "epiceno", "comum de dois"], "certa": 4, "explicacao": "e) comum de dois — o pianista / a pianista: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>cumprimento</b>? Responda com a letra.", "alternativas": ["saudação", "antigo rei do Irã", "reserva, ser discreto", "mergulhar", "medida"], "certa": 0, "explicacao": "a) saudação — não confunda com “comprimento” (medida)."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os hifens", "as couves-flores", "os cidadãos", "os ônibus", "os papels"], "certa": 4, "explicacao": "e) os papels — o certo é os papéis."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "que fala ou escreve demais, enrolando", "caprichado e bem-arrumado", "urgente", "confusão, situação enrolada"], "certa": 1, "explicacao": "b) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>baleia</b>? Responda com a letra.", "alternativas": ["a baleiazinho", "o baleia", "o baleia macho", "a baleia macho", "o baleio"], "certa": 3, "explicacao": "d) a baleia macho — baleia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["A professora trouxe o mapa para mim ler.", "Ela deu o recado para eu levar.", "Para mim, estudar à noite é melhor.", "Isso é para eu ler.", "Para mim, fazer isso é fácil."], "certa": 0, "explicacao": "a) — o certo é “para eu ler”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Ele foi à pé para a escola.", "Vou à Bahia.", "Ficaram frente a frente.", "Começou a chover à noite."], "certa": 1, "explicacao": "b) — o certo é “a pé”: antes de palavra masculina nunca tem crase."}, {"enunciado": "O verbo <b>transpor</b> é de que conjugação? Responda com a letra.", "alternativas": ["não tem conjugação", "4ª conjugação (-or)", "1ª conjugação (-ar)", "3ª conjugação (-ir)", "2ª conjugação (-er)"], "certa": 4, "explicacao": "e) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "o público que assiste a um espetáculo", "intenso, enérgico", "sem medo, destemido", "veloz, apressado"], "certa": 2, "explicacao": "c) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["É perigoso acender fogo dentro de casa.", "Paguei a conta com um cheque.", "O cachorro abanou a cauda de alegria.", "Faça uma discrição do personagem: como ele é?", "O cabelo dela é comprido e liso."], "certa": 3, "explicacao": "d) — o certo é “descrição” (ato de descrever)."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
