<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Amanhã, eles ___ para casa. Qual forma completa a frase? Responda com a letra.", "alternativas": ["voltam", "voltarão", "voltaram", "voltariam", "voltavam"], "certa": 1, "explicacao": "b) voltarão — futuro: -ão."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente acorda cedo no domingo.", "A gente gosta de pizza.", "A gente moramos perto da praia.", "Nós assistimos ao jogo pela televisão.", "Nós viajamos nas férias."], "certa": 2, "explicacao": "c) — o certo é “A gente mora”: a gente pede o verbo como “ele”."}, {"enunciado": "De que duas palavras se forma <b>nesta</b>? Responda com a letra.", "alternativas": ["ne + esta", "em + aquilo", "de + esta", "em + esta", "em + estas"], "certa": 3, "explicacao": "d) em + esta"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "solitário, sozinho", "proveitoso, que dá bons resultados", "estranho, fora do comum", "grosseiro, muito grave (um erro)"], "certa": 3, "explicacao": "d) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>sim</b>? Responda com a letra.", "alternativas": ["não", "impossível", "pequeno", "tarde", "fechado"], "certa": 0, "explicacao": "a) não"}, {"enunciado": "O que quer dizer <b>engodo</b>? Responda com a letra.", "alternativas": ["que não se apaga", "tolerante demais, brando", "apagar, destruir por completo", "submisso", "isca, armadilha para enganar"], "certa": 4, "explicacao": "e) isca, armadilha para enganar"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["os-so", "dis-ci-pli-na", "af-ta", "i-gno-ran-te", "rai-o"], "certa": 3, "explicacao": "d) i-gno-ran-te — o certo é ig-no-ran-te: a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["mãe", "assobio", "zoológico", "cereal", "passear"], "certa": 0, "explicacao": "a) mãe — mãe"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "que não se apaga", "que está em toda parte", "feito de leite", "isca, armadilha para enganar"], "certa": 0, "explicacao": "a) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você não comeu porque estava sem fome?", "Porque o mar tem ondas", "Ela estava feliz, não sei por quê.", "Não há por que ter medo do escuro.", "Ela chorou e não disse por quê."], "certa": 1, "explicacao": "b) — o certo é “Por que o mar tem ondas”: é uma pergunta em forma de título: troque por “por qual motivo”."}, {"enunciado": "Como se escreve <b>95º</b> por extenso? Responda com a letra.", "alternativas": ["nonagésimo quinto", "centésimo quinto", "noventésimo quinto", "nonagésimo sexto", "octogésimo quinto"], "certa": 0, "explicacao": "a) nonagésimo quinto"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["assembléia", "polens", "chapéu", "pólen", "hifens"], "certa": 0, "explicacao": "a) assembléia — o certo é assembleia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A casa é velha, contudo é muito bonita.", "Eu te ajudo se você pedir.", "Bianca leu o livro inteiro, portanto sabe a história de cor.", "Não fui à aula, porque estava com febre.", "Lavei a louça e varri a cozinha."], "certa": 0, "explicacao": "a) A casa é velha, contudo é muito bonita."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "incomum, surpreendente", "nunca visto antes, extraordinário", "honroso, que dá orgulho", "esforço, vontade forte de fazer algo"], "certa": 0, "explicacao": "a) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>abaixo-assinado</b>? Responda com a letra.", "alternativas": ["abaixo-assinado", "abaixo-assinadoes", "abaixo-assinados", "abaixos-assinado", "abaixos-assinados"], "certa": 2, "explicacao": "c) abaixo-assinados"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Eles mantêm a calma.", "Ele tem dois irmãos.", "Eles creem em fadas.", "As andorinhas vêm no verão.", "Ontem ele não pode sair."], "certa": 4, "explicacao": "e) — o certo é “Ontem ele não pôde…”."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A casa onde moro tem um jardim.", "O gigante mau prendeu a princesa na torre.", "Tentei abrir o pote, mas a tampa estava presa.", "Onde o cachorro enterrou o osso?", "Tentei ligar, mais ninguém atendeu."], "certa": 4, "explicacao": "e) o certo é “mas”"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["livrinho", "carrinho", "bolinha", "vizinho", "florzinha"], "certa": 3, "explicacao": "d) vizinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "O que quer dizer <b>plateia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "muitas vezes, com frequência", "o palco onde os atores se apresentam", "o público que assiste a um espetáculo", "que dura pouco tempo"], "certa": 3, "explicacao": "d) o público que assiste a um espetáculo. Não é “o palco onde os atores se apresentam”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["anjo", "tristeza", "espirro", "calor", "choro"], "certa": 0, "explicacao": "a) anjo — existe por si, mesmo que seja imaginário."}, {"enunciado": "A palavra <b>o condor</b> é… Responda com a letra.", "alternativas": ["epiceno", "sobrecomum", "não tem gênero", "tem feminino diferente (biforme)", "comum de dois"], "certa": 0, "explicacao": "a) epiceno — animal: o condor macho / o condor fêmea."}, {"enunciado": "O que quer dizer <b>tráfico</b>? Responda com a letra.", "alternativas": ["liberação", "trânsito", "subir", "antigo rei do Irã", "comércio ilegal"], "certa": 4, "explicacao": "e) comércio ilegal — não confunda com “tráfego” (trânsito)."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os funis", "os pires", "os mãos", "os arco-íris", "os mamões"], "certa": 2, "explicacao": "c) os mãos — o certo é as mãos."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caprichado e bem-arrumado", "que fala pouco, de poucas palavras", "pouco, escasso", "que fala ou escreve demais, enrolando", "esbanjador, que gasta demais"], "certa": 3, "explicacao": "d) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>crocodilo</b>? Responda com a letra.", "alternativas": ["a crocodila", "o crocodilo fêmea", "a crocodilo fêmea", "o crocodilozinha", "a crocodilo"], "certa": 1, "explicacao": "b) o crocodilo fêmea — crocodilo é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "O bolo é para mim.", "Ela deu o recado para eu levar.", "Felipe trouxe o caderno para mim desenhar.", "Entre mim e você, tudo bem."], "certa": 3, "explicacao": "d) — o certo é “para eu desenhar”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Viajei a Roma e à Itália.", "Chegamos ao meio-dia.", "Ele foi à pé para a escola.", "Vou à Bahia.", "Fiz uma visita àquele museu."], "certa": 2, "explicacao": "c) — o certo é “a pé”: antes de palavra masculina nunca tem crase."}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem medo, destemido", "esfriar, perder a força", "resistente (ao calor, a mudanças)", "veloz, apressado", "intenso, enérgico"], "certa": 4, "explicacao": "e) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Dei um laço no presente.", "A loja vai sortir o estoque de doces.", "Que cavaleiro: abriu a porta para a vovó!", "O calor faz o metal dilatar.", "O espectador assistiu ao jogo da arquibancada."], "certa": 2, "explicacao": "c) — o certo é “cavalheiro” (homem educado)."}, {"enunciado": "“Que filmeco sem graça!”<br>Que sentido tem <b>filmeco</b> nessa frase? Responda com a letra.", "alternativas": ["pressa", "carinho", "desprezo", "admiração", "tamanho"], "certa": 2, "explicacao": "c) desprezo"}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
