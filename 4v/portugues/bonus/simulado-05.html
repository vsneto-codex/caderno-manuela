<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Ontem, eles ___ bola. Qual forma completa a frase? Responda com a letra.", "alternativas": ["jogaram", "jogam", "jogarão", "jogariam", "jogavam"], "certa": 0, "explicacao": "a) jogaram — passado: -am."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente acorda cedo no domingo.", "Nós chegamos cedo à escola.", "Nós jogamos bola no recreio.", "A gente aprende rápido.", "A gente estudamos juntos todo dia."], "certa": 4, "explicacao": "e) — o certo é “A gente estuda”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual é a junção de <b>em + aquela</b>? Responda com a letra.", "alternativas": ["daquela", "em aquela", "eoaquela", "àaquela", "naquela"], "certa": 4, "explicacao": "e) naquela"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "lento para entender", "que passa num instante", "mentira, golpe para enganar", "solitário, sozinho"], "certa": 0, "explicacao": "a) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>mais</b>? Responda com a letra.", "alternativas": ["molhado", "partir", "menos", "último", "fora"], "certa": 2, "explicacao": "c) menos"}, {"enunciado": "O que quer dizer <b>exortar</b>? Responda com a letra.", "alternativas": ["espantado, sem reação", "que pode sofrer algo; melindroso", "excelente, muito habilidoso", "incomum, surpreendente", "encorajar, aconselhar com insistência"], "certa": 4, "explicacao": "e) encorajar, aconselhar com insistência"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["deg-rau", "pes-so-a", "as-so-biar", "fe-i-ra", "pa-cto"], "certa": 1, "explicacao": "b) pes-so-a — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["aeroporto", "queixo", "joelho", "cair", "cientista"], "certa": 1, "explicacao": "b) queixo — quei-xo"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "feito de leite", "que fala pouco, de poucas palavras", "muito esquisito, absurdo", "sem nenhum machucado, ileso"], "certa": 2, "explicacao": "c) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Porque o céu é azul?", "A rua por que ele passa todo dia é barulhenta.", "Ninguém explicou por que a aula acabou mais cedo.", "Choveu muito; eis por que o jogo parou.", "— Hoje não tem aula. — Por quê?"], "certa": 0, "explicacao": "a) — o certo é “Por que o céu é azul?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Como se escreve <b>41º</b> por extenso? Responda com a letra.", "alternativas": ["quadragésimo segundo", "trigésimo primeiro", "quinquagésimo primeiro", "quarentésimo primeiro", "quadragésimo primeiro"], "certa": 4, "explicacao": "e) quadragésimo primeiro"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["cajú", "polens", "saúde", "açúcar", "herói"], "certa": 0, "explicacao": "a) cajú — o certo é caju: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Não fui à aula, pois estava com febre.", "A festa será no quintal se não chover.", "Bianca comprou pão e Felipe comprou leite.", "O sorvete ficou no sol, logo derreteu.", "Treinamos bastante, contudo perdemos o jogo."], "certa": 4, "explicacao": "e) Treinamos bastante, contudo perdemos o jogo."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito esquisito, absurdo", "honroso, que dá orgulho", "digno de confiança, verdadeiro", "caro, que custa muito", "onde é muito difícil viver"], "certa": 3, "explicacao": "d) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>segunda-feira</b>? Responda com a letra.", "alternativas": ["segunda-feiraes", "segunda-feira", "segundas-feira", "segundas-feiras", "segunda-feiras"], "certa": 3, "explicacao": "d) segundas-feiras"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Vou pôr o casaco.", "Hoje ela pode jogar.", "Ela têm um gato.", "O voo atrasou.", "Eles leem um livro por semana."], "certa": 2, "explicacao": "c) — o certo é “Ela tem…”."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela estudou, mas esqueceu o caderno em casa.", "A cidade onde nasci é pequena.", "Ricardo comeu mais pipoca do que todo mundo.", "A prova vai ser daqui há uma semana.", "Aonde você vai depois da aula?"], "certa": 3, "explicacao": "d) o certo é “a”"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["casinha", "gatinho", "rainha", "carrinho", "dedinho"], "certa": 2, "explicacao": "c) rainha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "O que quer dizer <b>plateia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "o público que assiste a um espetáculo", "generoso, de coração grande", "onde é muito difícil viver", "o palco onde os atores se apresentam"], "certa": 1, "explicacao": "b) o público que assiste a um espetáculo. Não é “o palco onde os atores se apresentam”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["fome", "vento", "calor", "justiça", "raiva"], "certa": 1, "explicacao": "b) vento — existe por si, mesmo que seja imaginário."}, {"enunciado": "A palavra <b>o/a turista</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "epiceno", "não tem gênero", "comum de dois", "sobrecomum"], "certa": 3, "explicacao": "d) comum de dois — o turista / a turista: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>imergir</b>? Responda com a letra.", "alternativas": ["mergulhar", "antigo rei do Irã", "liberação", "reserva, ser discreto", "vir à tona"], "certa": 0, "explicacao": "a) mergulhar — não confunda com “emergir” (vir à tona)."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os álbuns", "os hífens", "os ônibus", "os pires", "os cidadãos"], "certa": 1, "explicacao": "b) os hífens — o certo é os hifens."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "que arma truques para enganar", "que dá para acreditar, razoável", "caprichado e bem-arrumado", "esfriar, perder a força"], "certa": 0, "explicacao": "a) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>sardinha</b>? Responda com a letra.", "alternativas": ["o sardinho", "o sardinha macho", "o sardinha", "a sardinhazinho", "a sardinha macho"], "certa": 4, "explicacao": "e) a sardinha macho — sardinha é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Trouxe o lápis para eu desenhar.", "Isso é para eu ler.", "O bolo é para mim.", "Mamãe trouxe a revista para eu.", "Ela deu o recado para eu levar."], "certa": 3, "explicacao": "d) — o certo é “para mim”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui ao clube e à piscina.", "Ele foi à pé para a escola.", "Vou à Bahia.", "Às vezes, durmo à tarde.", "Comemos bife à milanesa."], "certa": 1, "explicacao": "b) — o certo é “a pé”: antes de palavra masculina nunca tem crase."}, {"enunciado": "O verbo <b>transpor</b> é de que conjugação? Responda com a letra.", "alternativas": ["não tem conjugação", "4ª conjugação (-or)", "1ª conjugação (-ar)", "3ª conjugação (-ir)", "2ª conjugação (-er)"], "certa": 4, "explicacao": "e) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "o público que assiste a um espetáculo", "intenso, enérgico", "sem medo, destemido", "veloz, apressado"], "certa": 2, "explicacao": "c) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A polícia combate o tráfico de animais silvestres.", "Furar o sinal vermelho é uma infração.", "O ladrão foi pego em flagrante.", "O calor faz o metal dilatar.", "Esqueci o assento da palavra “avó”."], "certa": 4, "explicacao": "e) — o certo é “acento” (sinal gráfico)."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
