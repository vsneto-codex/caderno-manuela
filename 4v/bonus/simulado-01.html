<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 2,3 + 5,75? Responda com a letra.", "alternativas": ["0,805", "80,5", "598", "5,98", "8,05"], "certa": 4, "explicacao": "e) 8,05"}, {"enunciado": "Arredonde 82.341 para o milhar mais próximo. Responda com a letra.", "alternativas": ["83.000", "82.340", "82.300", "82.000", "80.000"], "certa": 3, "explicacao": "d) 82.000"}, {"enunciado": "Saindo do ponto (1, 5), ande 5 para a direita e 3 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(5, 3)", "(6, 5)", "(6, 8)", "(8, 6)", "(4, 10)"], "certa": 2, "explicacao": "c) (6, 8)"}, {"enunciado": "8 canetas custam R$ 104. Quanto custam 9 canetas iguais? Responda com a letra.", "alternativas": ["R$ 117", "R$ 13", "R$ 105", "R$ 113", "R$ 936"], "certa": 0, "explicacao": "a) R$ 117"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número que tem vírgula", "o resultado da subtração", "o espaço que um objeto ocupa", "um número com uma parte inteira e uma fração", "quantas vezes o desenho é maior ou menor que o tamanho real"], "certa": 3, "explicacao": "d) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "Como se escreve 6% em número decimal? Responda com a letra.", "alternativas": ["6", "0,6", "0,006", "0,06", "0,94"], "certa": 3, "explicacao": "d) 0,06"}, {"enunciado": "Quanto é 21.295 − 13.119? Responda com a letra.", "alternativas": ["8.176", "12.184", "8.186", "18.186", "34.414"], "certa": 0, "explicacao": "a) 8.176"}, {"enunciado": "O jogo começou às 11h18 e durou 1h43. A que horas terminou? Responda com a letra.", "alternativas": ["13h18", "12h01", "13h01", "9h35", "12h61"], "certa": 2, "explicacao": "c) 13h01"}, {"enunciado": "Uma pizza foi dividida em 4 pedaços iguais e 1 foi comido. Que fração da pizza foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>1</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "Leia: “Na partilha das 12 balas, cada um dos 3 irmãos ficou com 4.” Nessa frase, <b>partilha</b> quer dizer… Responda com a letra.", "alternativas": ["cada um dos símbolos de 0 a 9 que usamos para escrever os números", "a soma de várias partes", "a divisão de alguma coisa entre pessoas", "cada resultado que pode acontecer", "um número que está na tabuada de outro"], "certa": 2, "explicacao": "c) a divisão de alguma coisa entre pessoas. Não é “a soma de várias partes”: essa é a pegadinha."}, {"enunciado": "Quantos lados tem um heptágono? Responda com a letra.", "alternativas": ["9", "8", "7", "14", "6"], "certa": 2, "explicacao": "c) 7"}, {"enunciado": "Simplifique <span class=\"fr\"><span>27</span><span>36</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>9</span><span>12</span></span>", "<span class=\"fr\"><span>3</span><span>36</span></span>", "<span class=\"fr\"><span>3</span><span>12</span></span>", "<span class=\"fr\"><span>4</span><span>3</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>3</span><span>4</span></span>"}, {"enunciado": "Um patinete custa R$ 245 e está com 20% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 196", "R$ 294", "R$ 49", "R$ 225", "R$ 147"], "certa": 0, "explicacao": "a) R$ 196"}, {"enunciado": "A turma votou no animal preferido. Resultado — gato, 6; coelho, 13; peixe, 15; cachorro, 17. Quantos alunos votaram? Responda com a letra.", "alternativas": ["51", "45", "61", "4", "17"], "certa": 0, "explicacao": "a) 51"}, {"enunciado": "Leia: “Pela legenda, a cor cinza mostra os meninos.” Nessa frase, <b>legenda</b> quer dizer… Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o título do gráfico", "quantas vezes o desenho é maior ou menor que o tamanho real", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "a divisão de alguma coisa entre pessoas"], "certa": 3, "explicacao": "d) o texto que explica o que cada cor ou símbolo do gráfico quer dizer. Não é “o título do gráfico”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisor de 24? Responda com a letra.", "alternativas": ["18", "8", "48", "10", "72"], "certa": 1, "explicacao": "b) 8"}, {"enunciado": "Como se escreve “dezessete inteiros e cinco milésimos” com algarismos? Responda com a letra.", "alternativas": ["17.005", "17,05", "17,0005", "17,005", "18,005"], "certa": 3, "explicacao": "d) 17,005"}, {"enunciado": "O termômetro marcava 20 °C e a temperatura subiu 4 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["20 °C", "16 °C", "25 °C", "4 °C", "24 °C"], "certa": 4, "explicacao": "e) 24 °C"}, {"enunciado": "Qual destes números é o maior? 2,371, 2,314, 2,48, 2,5 e 2,21 Responda com a letra.", "alternativas": ["2,371", "2,21", "2,5", "2,314", "2,48"], "certa": 2, "explicacao": "c) 2,5"}, {"enunciado": "Leia: “O antecessor de 40.000 é 39.999.” Nessa frase, <b>antecessor</b> quer dizer… Responda com a letra.", "alternativas": ["a divisão de alguma coisa entre pessoas", "o número que vem logo depois", "o número que vem logo antes", "cada uma das 10 partes iguais de um inteiro", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer"], "certa": 2, "explicacao": "c) o número que vem logo antes. Não é “o número que vem logo depois”: essa é a pegadinha."}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 45 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["45%", "100%", "1%", "4,5%", "55%"], "certa": 0, "explicacao": "a) 45%"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>33</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["0,033", "3,3", "33,100", "0,33", "33"], "certa": 3, "explicacao": "d) 0,33"}, {"enunciado": "Bianca tem 4 camisetas e 3 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["4", "24", "12", "7", "11"], "certa": 2, "explicacao": "c) 12"}, {"enunciado": "Qual é o perímetro de um retângulo de 2 m por 12 m? Responda com a letra.", "alternativas": ["16 m", "24 m²", "14 m", "28 m²", "28 m"], "certa": 4, "explicacao": "e) 28 m"}, {"enunciado": "O que quer dizer <b>classe</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada grupo de 3 ordens de um número: unidades, milhares, milhões", "quantas vezes o desenho é maior ou menor que o tamanho real", "o número de cima da fração: quantas partes foram pegas", "a medida de uma ponta à outra", "a sala de aula"], "certa": 0, "explicacao": "a) cada grupo de 3 ordens de um número: unidades, milhares, milhões. Não é “a sala de aula”: essa é a pegadinha."}, {"enunciado": "Felipe quer comprar um jogo de R$ 300 e guarda R$ 25 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["7.500", "275", "13", "325", "12"], "certa": 4, "explicacao": "e) 12"}, {"enunciado": "Um retângulo de 3 cm por 6 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é o perímetro do retângulo novo? Responda com a letra.", "alternativas": ["162 cm²", "18 cm", "162 cm", "27 cm", "54 cm"], "certa": 4, "explicacao": "e) 54 cm"}, {"enunciado": "Quanto é 324 × 54? Responda com a letra.", "alternativas": ["5.286", "16.200", "1.296", "17.496", "2.916"], "certa": 3, "explicacao": "d) 17.496"}, {"enunciado": "A festa começou às 15h26 e durou 2h52. A que horas terminou? Responda com a letra.", "alternativas": ["12h34", "17h18", "17h78", "18h26", "18h18"], "certa": 4, "explicacao": "e) 18h18"}, {"enunciado": "O que quer dizer <b>variação</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 1.000 partes iguais de um inteiro", "quantas vezes o desenho é maior ou menor que o tamanho real", "o quadrilátero que tem 2 pares de lados paralelos", "quanto uma medida mudou", "o valor da medida no fim"], "certa": 3, "explicacao": "d) quanto uma medida mudou. Não é “o valor da medida no fim”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
