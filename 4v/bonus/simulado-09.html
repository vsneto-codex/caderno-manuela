<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o perímetro de um retângulo de 8 m por 6 m? Responda com a letra.", "alternativas": ["48 m²", "28 m²", "22 m", "28 m", "14 m"], "certa": 3, "explicacao": "d) 28 m"}, {"enunciado": "A turma votou na fruta preferida. Resultado — maçã, 12; manga, 3; banana, 7; uva, 23. Quantos votos uva teve a mais que manga? Responda com a letra.", "alternativas": ["20", "26", "3", "23", "21"], "certa": 0, "explicacao": "a) 20"}, {"enunciado": "O termômetro marcava 35 °C e a temperatura subiu 7 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["35 °C", "42 °C", "7 °C", "28 °C", "43 °C"], "certa": 1, "explicacao": "b) 42 °C"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 11; amarelo, 17; verde, 3. Quantos votos roxo teve a mais que verde? Responda com a letra.", "alternativas": ["14", "9", "8", "3", "11"], "certa": 2, "explicacao": "c) 8"}, {"enunciado": "Leia: “Em 2.305.048, a classe dos milhares é 305.” Nessa frase, <b>classe</b> quer dizer… Responda com a letra.", "alternativas": ["cada grupo de 3 ordens de um número: unidades, milhares, milhões", "quanto tempo algo dura, do começo ao fim", "a sala de aula", "o dinheiro que volta quando se paga mais que o preço", "a medida do contorno de uma figura"], "certa": 0, "explicacao": "a) cada grupo de 3 ordens de um número: unidades, milhares, milhões. Não é “a sala de aula”: essa é a pegadinha."}, {"enunciado": "Pensei num número, multipliquei por 6 e tirei 13. Deu 47. Em que número pensei? Responda com a letra.", "alternativas": ["295", "10", "282", "41", "60"], "certa": 1, "explicacao": "b) 10"}, {"enunciado": "Como se escreve “quinze inteiros e quatro centésimos” com algarismos? Responda com a letra.", "alternativas": ["15,4", "15,0004", "15,004", "16,04", "15,04"], "certa": 4, "explicacao": "e) 15,04"}, {"enunciado": "Quanto é 324 × 63? Responda com a letra.", "alternativas": ["972", "2.916", "9.202", "20.412", "19.440"], "certa": 3, "explicacao": "d) 20.412"}, {"enunciado": "O que quer dizer <b>perímetro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["as informações que juntamos numa pesquisa", "a medida do contorno de uma figura", "cada uma das 10 partes iguais de um inteiro", "o espaço de dentro de uma figura", "a chance de algo acontecer"], "certa": 1, "explicacao": "b) a medida do contorno de uma figura. Não é “o espaço de dentro de uma figura”: essa é a pegadinha."}, {"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>12</span></span> + <span class=\"fr\"><span>2</span><span>12</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>12</span></span>", "<span class=\"fr\"><span>3</span><span>144</span></span>", "<span class=\"fr\"><span>3</span><span>24</span></span>", "<span class=\"fr\"><span>2</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>3</span><span>12</span></span>"}, {"enunciado": "Arredonde 54.411 para o milhar mais próximo. Responda com a letra.", "alternativas": ["54.000", "54.410", "55.000", "54.400", "50.000"], "certa": 0, "explicacao": "a) 54.000"}, {"enunciado": "Qual destes números é divisor de 40? Responda com a letra.", "alternativas": ["4", "120", "19", "6", "80"], "certa": 0, "explicacao": "a) 4"}, {"enunciado": "Quantos vértices tem um eneágono? Responda com a letra.", "alternativas": ["11", "10", "8", "9", "18"], "certa": 3, "explicacao": "d) 9"}, {"enunciado": "O que quer dizer <b>perpendicular</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto tempo algo dura, do começo ao fim", "que nunca encontra a outra reta", "que cruza outra reta formando um ângulo reto", "o resultado da divisão", "o valor que se tira do preço"], "certa": 2, "explicacao": "c) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Complete: 9.008 mm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["9,008", "9.008.000", "9.008", "90,08", "0,9008"], "certa": 0, "explicacao": "a) 9,008"}, {"enunciado": "Complete: 940 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["9.400.000", "94.000", "0,94", "940.000", "940"], "certa": 3, "explicacao": "d) 940.000"}, {"enunciado": "Uma parede foi dividida em 5 partes iguais e 1 está pintada. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>1</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "Qual destes números é o maior? 4,8, 4,684, 4,26, 4,366 e 4,41 Responda com a letra.", "alternativas": ["4,684", "4,26", "4,366", "4,8", "4,41"], "certa": 3, "explicacao": "d) 4,8"}, {"enunciado": "O que quer dizer <b>algarismo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o par de números que diz onde um ponto está", "o mesmo que número", "o segmento que liga dois vértices que não são vizinhos", "na Matemática, uma conta com várias operações", "cada um dos símbolos de 0 a 9 que usamos para escrever os números"], "certa": 4, "explicacao": "e) cada um dos símbolos de 0 a 9 que usamos para escrever os números. Não é “o mesmo que número”: essa é a pegadinha."}, {"enunciado": "Uma compra custou R$ 40,47 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 9,53", "R$ 10,00", "R$ 90,47", "R$ 10,53", "R$ 10,47"], "certa": 0, "explicacao": "a) R$ 9,53"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (5, 9)? Responda com a letra.", "alternativas": ["5 para a direita e 9 para cima", "14 para a direita", "5 para a direita e 9 para baixo", "9 para a direita e 5 para cima", "5 para a esquerda e 9 para baixo"], "certa": 0, "explicacao": "a) 5 para a direita e 9 para cima"}, {"enunciado": "Numa caixa há 7 bolas brancas e 9 bolas verdes. Tirando uma sem olhar, qual é a chance de sair branca? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>7</span><span>9</span></span>", "<span class=\"fr\"><span>9</span><span>16</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>7</span><span>16</span></span>", "<span class=\"fr\"><span>1</span><span>16</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>7</span><span>16</span></span>"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["26.774", "27.764", "9.114", "27.476", "46.277"], "certa": 4, "explicacao": "e) 46.277"}, {"enunciado": "Leia: “De 12 °C para 27 °C, a variação foi de 15 °C.” Nessa frase, <b>variação</b> quer dizer… Responda com a letra.", "alternativas": ["cada resultado que pode acontecer", "que vale o mesmo", "quanto uma medida mudou", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o valor da medida no fim"], "certa": 2, "explicacao": "c) quanto uma medida mudou. Não é “o valor da medida no fim”: essa é a pegadinha."}, {"enunciado": "6 figurinhas custam R$ 42. Quanto custam 5 figurinhas iguais? Responda com a letra.", "alternativas": ["R$ 35", "R$ 47", "R$ 7", "R$ 210", "R$ 41"], "certa": 0, "explicacao": "a) R$ 35"}, {"enunciado": "Quanto é 7,53 × 9? Responda com a letra.", "alternativas": ["67,77", "6.777", "63,477", "677,7", "6,777"], "certa": 0, "explicacao": "a) 67,77"}, {"enunciado": "A aula de natação começou às 11h25 e durou 2h36. A que horas terminou? Responda com a letra.", "alternativas": ["14h01", "8h49", "13h01", "13h61", "14h25"], "certa": 0, "explicacao": "a) 14h01"}, {"enunciado": "Quanto é 20% de 140? Responda com a letra.", "alternativas": ["2.800", "28", "160", "120", "112"], "certa": 1, "explicacao": "b) 28"}, {"enunciado": "Leia: “O quadrado tem 2 diagonais.” Nessa frase, <b>diagonais</b> quer dizer… Responda com a letra.", "alternativas": ["o segmento que liga dois vértices que não são vizinhos", "que vale o mesmo", "perto de, mais ou menos", "o número de cima da fração: quantas partes foram pegas", "qualquer linha torta"], "certa": 0, "explicacao": "a) o segmento que liga dois vértices que não são vizinhos. Não é “qualquer linha torta”: essa é a pegadinha."}, {"enunciado": "Um retângulo de 9 cm por 6 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["54 cm²", "162 cm²", "486 cm", "486 cm²", "90 cm"], "certa": 3, "explicacao": "d) 486 cm²"}];
const CHAVE='simulado-bonus-mat-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
