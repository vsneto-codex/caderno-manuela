<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Num quadro de 100 quadradinhos iguais, 78 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "78%", "22%", "7,8%", "100%"], "certa": 1, "explicacao": "b) 78%"}, {"enunciado": "Qual destes números é divisível por 2? Responda com a letra.", "alternativas": ["5.240", "8.003", "8.935", "8.975", "4.483"], "certa": 0, "explicacao": "a) 5.240"}, {"enunciado": "Numa caixa há 6 bolas verdes e 9 bolas amarelas. Tirando uma sem olhar, qual é a chance de sair verde? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>15</span></span>", "<span class=\"fr\"><span>6</span><span>15</span></span>", "<span class=\"fr\"><span>15</span><span>6</span></span>", "<span class=\"fr\"><span>9</span><span>15</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>6</span><span>15</span></span>"}, {"enunciado": "Entre as frações <span class=\"fr\"><span>4</span><span>9</span></span>, <span class=\"fr\"><span>4</span><span>12</span></span>, <span class=\"fr\"><span>4</span><span>15</span></span>, <span class=\"fr\"><span>4</span><span>6</span></span> e <span class=\"fr\"><span>4</span><span>10</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>4</span><span>6</span></span>", "<span class=\"fr\"><span>4</span><span>10</span></span>", "<span class=\"fr\"><span>4</span><span>12</span></span>", "<span class=\"fr\"><span>4</span><span>15</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>4</span><span>6</span></span>"}, {"enunciado": "Leia: “A frequência do azul na pesquisa foi 8: oito pessoas escolheram azul.” Nessa frase, <b>frequência</b> quer dizer… Responda com a letra.", "alternativas": ["a velocidade de alguma coisa", "o segmento que liga dois vértices que não são vizinhos", "quanto uma medida mudou", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "quantas vezes algo aparece"], "certa": 4, "explicacao": "e) quantas vezes algo aparece. Não é “a velocidade de alguma coisa”: essa é a pegadinha."}, {"enunciado": "Calcule 4 × 28 de cabeça, separando 28 em 20 + 8. Quanto dá? Responda com a letra.", "alternativas": ["40", "32", "112", "88", "640"], "certa": 2, "explicacao": "c) 112"}, {"enunciado": "A turma votou no esporte preferido. Resultado — futebol, 15; vôlei, 21; basquete, 5; natação, 11. Quantos alunos votaram? Responda com a letra.", "alternativas": ["47", "21", "62", "4", "52"], "certa": 4, "explicacao": "e) 52"}, {"enunciado": "Quantos lados tem um octógono? Responda com a letra.", "alternativas": ["16", "9", "10", "7", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Uma torta foi dividida em 7 pedaços iguais e 1 foi comido. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>7</span><span>1</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>1</span><span>7</span></span>"}, {"enunciado": "O que quer dizer <b>estimativa</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["do menor para o maior", "cada uma das 10 partes iguais de um inteiro", "um valor aproximado, calculado de cabeça", "três vezes o número", "o resultado exato da conta"], "certa": 2, "explicacao": "c) um valor aproximado, calculado de cabeça. Não é “o resultado exato da conta”: essa é a pegadinha."}, {"enunciado": "Quantos cubinhos enchem uma caixa de 3 cubinhos de comprimento, 4 de largura e 6 de altura? Responda com a letra.", "alternativas": ["108", "13", "72", "60", "12"], "certa": 2, "explicacao": "c) 72"}, {"enunciado": "Uma compra custou R$ 29,96 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 79,96", "R$ 21,00", "R$ 21,04", "R$ 20,04", "R$ 39,96"], "certa": 3, "explicacao": "d) R$ 20,04"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>419</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["419", "0,0419", "419,1000", "0,419", "4,19"], "certa": 3, "explicacao": "d) 0,419"}, {"enunciado": "O filme começou às 12h33 e durou 1h48. A que horas terminou? Responda com a letra.", "alternativas": ["14h33", "14h21", "10h45", "13h81", "13h21"], "certa": 1, "explicacao": "b) 14h21"}, {"enunciado": "Leia: “A operação inversa de somar 15 é subtrair 15.” Nessa frase, <b>operação inversa</b> quer dizer… Responda com a letra.", "alternativas": ["quanto uma medida mudou", "a linha onde duas faces de um sólido se encontram", "a mesma conta feita de novo", "a medida de uma ponta à outra", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×"], "certa": 4, "explicacao": "e) a conta que desfaz a outra: − desfaz +, ÷ desfaz ×. Não é “a mesma conta feita de novo”: essa é a pegadinha."}, {"enunciado": "Como se escreve “dezenove inteiros e noventa e dois milésimos” com algarismos? Responda com a letra.", "alternativas": ["19.092", "19,0092", "19,029", "19,92", "19,092"], "certa": 4, "explicacao": "e) 19,092"}, {"enunciado": "Quanto é 30,1 − 5,64? Responda com a letra.", "alternativas": ["35,74", "2,446", "24,46", "244,6", "24,54"], "certa": 2, "explicacao": "c) 24,46"}, {"enunciado": "Quantos vértices tem um octógono? Responda com a letra.", "alternativas": ["10", "16", "7", "9", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Complete: 926 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["0,926", "9.260", "926.000", "926", "9.260.000"], "certa": 2, "explicacao": "c) 926.000"}, {"enunciado": "O que quer dizer <b>diagonal</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a troca de uma unidade por outra, sem mudar a medida", "qualquer linha torta", "perto de, mais ou menos", "o segmento que liga dois vértices que não são vizinhos", "o resultado da multiplicação"], "certa": 3, "explicacao": "d) o segmento que liga dois vértices que não são vizinhos. Não é “qualquer linha torta”: essa é a pegadinha."}, {"enunciado": "Complete: 4,41 km = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["44,1", "0,00441", "4.410", "4,41", "44.100"], "certa": 2, "explicacao": "c) 4.410"}, {"enunciado": "O aluguel da quadra custava R$ 370 e teve um aumento de 30%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 400", "R$ 259", "R$ 111", "R$ 481", "R$ 592"], "certa": 3, "explicacao": "d) R$ 481"}, {"enunciado": "De manhã fazia 9 °C. À tarde, 19 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["19 °C", "28 °C", "9 °C", "11 °C", "10 °C"], "certa": 4, "explicacao": "e) 10 °C"}, {"enunciado": "Ricardo quer comprar uma camiseta de R$ 140 e guarda R$ 20 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["2.800", "160", "120", "7", "8"], "certa": 3, "explicacao": "d) 7"}, {"enunciado": "Leia: “Em 25 ÷ 4 = 6, o resto é 1.” Nessa frase, <b>resto</b> quer dizer… Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "quanto cabe dentro de um recipiente", "o que sobra numa divisão que não é exata", "o resultado da divisão", "um número com uma parte inteira e uma fração"], "certa": 2, "explicacao": "c) o que sobra numa divisão que não é exata. Não é “o resultado da divisão”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 9 bolas vermelhas e 3 bolas verdes. Tirando uma sem olhar, qual é a chance de sair vermelha? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>9</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>3</span><span>12</span></span>", "<span class=\"fr\"><span>9</span><span>12</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>9</span><span>12</span></span>"}, {"enunciado": "Quanto vale o algarismo destacado em 865.<span class=\"dest\">4</span>12? Responda com a letra.", "alternativas": ["4.000", "400", "40", "412", "4"], "certa": 1, "explicacao": "b) 400"}, {"enunciado": "Como se escreve 5% em número decimal? Responda com a letra.", "alternativas": ["0,5", "0,95", "0,005", "5", "0,05"], "certa": 4, "explicacao": "e) 0,05"}, {"enunciado": "Saindo do ponto (2, 4), ande 1 para a direita e 3 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(3, 4)", "(6, 4)", "(7, 3)", "(5, 5)", "(3, 7)"], "certa": 4, "explicacao": "e) (3, 7)"}, {"enunciado": "O que quer dizer <b>múltiplo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número que está na tabuada de outro", "uma parte de cada 100", "o que se ganha a mais: o preço de venda menos o que custou", "um número que divide o outro sem sobrar nada", "cada número que se soma numa adição"], "certa": 0, "explicacao": "a) um número que está na tabuada de outro. Não é “um número que divide o outro sem sobrar nada”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
