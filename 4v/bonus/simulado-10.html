<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> + 69 = 154 Responda com a letra.", "alternativas": ["69", "223", "85", "95", "154"], "certa": 2, "explicacao": "c) 85"}, {"enunciado": "Numa caixa há 6 bolas brancas e 2 bolas vermelhas. Tirando uma sem olhar, qual é a chance de sair branca? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>6</span><span>2</span></span>", "<span class=\"fr\"><span>6</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>6</span><span>8</span></span>"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (5, 7)? Responda com a letra.", "alternativas": ["5 para a direita e 7 para cima", "7 para a direita e 5 para cima", "12 para a direita", "5 para a esquerda e 7 para baixo", "5 para a direita e 7 para baixo"], "certa": 0, "explicacao": "a) 5 para a direita e 7 para cima"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>13</span><span>4</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["3 <span class=\"fr\"><span>3</span><span>4</span></span>", "1 <span class=\"fr\"><span>3</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>13</span></span>", "4 <span class=\"fr\"><span>1</span><span>4</span></span>"], "certa": 2, "explicacao": "c) 3 <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "O que quer dizer <b>orçamento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado da multiplicação", "um valor aproximado, calculado de cabeça", "o plano do dinheiro que entra e do que vai ser gasto", "o dinheiro que sobra no fim do mês", "o número que vem logo antes"], "certa": 2, "explicacao": "c) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}, {"enunciado": "Entre as frações <span class=\"fr\"><span>1</span><span>7</span></span>, <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>12</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span> e <span class=\"fr\"><span>1</span><span>2</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>2</span></span>"}, {"enunciado": "A turma votou no esporte preferido. Resultado — natação, 4; basquete, 6; futebol, 23. Quantos alunos votaram? Responda com a letra.", "alternativas": ["29", "23", "43", "33", "3"], "certa": 3, "explicacao": "d) 33"}, {"enunciado": "Quanto é 2,221 × 1.000? Responda com a letra.", "alternativas": ["0,002221", "22.210", "2.221", "222,1", "2,221000"], "certa": 2, "explicacao": "c) 2.221"}, {"enunciado": "Quanto é 39 + 8 × 7? Responda com a letra.", "alternativas": ["95", "54", "103", "329", "2.184"], "certa": 0, "explicacao": "a) 95"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um valor aproximado, calculado de cabeça", "o dinheiro que volta quando se paga mais que o preço", "um número com uma parte inteira e uma fração", "um número que tem vírgula", "que aumenta ou diminui na mesma medida"], "certa": 2, "explicacao": "c) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "Complete: 633 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["633", "6.330.000", "6.330", "63.300", "633.000"], "certa": 4, "explicacao": "e) 633.000"}, {"enunciado": "Arredonde 30.884 para a centena mais próxima. Responda com a letra.", "alternativas": ["30.984", "30.900", "30.880", "31.000", "30.000"], "certa": 1, "explicacao": "b) 30.900"}, {"enunciado": "Quanto é 73.362 − 28.400? Responda com a letra.", "alternativas": ["101.762", "55.162", "44.962", "55.962", "45.962"], "certa": 2, "explicacao": "c) 44.962"}, {"enunciado": "Quantos vértices tem um octógono? Responda com a letra.", "alternativas": ["10", "16", "8", "9", "7"], "certa": 2, "explicacao": "c) 8"}, {"enunciado": "Leia: “Na conversão, 2 m viram 200 cm.” Nessa frase, <b>conversão</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "a mudança do tamanho da medida", "o valor que se tira do preço", "a troca de uma unidade por outra, sem mudar a medida", "o que se ganha a mais: o preço de venda menos o que custou"], "certa": 3, "explicacao": "d) a troca de uma unidade por outra, sem mudar a medida. Não é “a mudança do tamanho da medida”: essa é a pegadinha."}, {"enunciado": "Quantas faces tem um cubo? Responda com a letra.", "alternativas": ["6", "8", "12", "14", "5"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Complete: 90 km = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["9.000", "90.000", "900.000", "90", "0,09"], "certa": 1, "explicacao": "b) 90.000"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 62 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["38%", "1%", "62%", "6,2%", "100%"], "certa": 2, "explicacao": "c) 62%"}, {"enunciado": "O que quer dizer <b>quociente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado da multiplicação", "o resultado da divisão", "a linha onde duas faces de um sólido se encontram", "que cruza outra reta formando um ângulo reto", "o que sobra na divisão"], "certa": 1, "explicacao": "b) o resultado da divisão. Não é “o que sobra na divisão”: essa é a pegadinha."}, {"enunciado": "Quanto é 3.300 × 300? Responda com a letra.", "alternativas": ["9.900.000", "99", "990.000", "99.000", "9.900"], "certa": 2, "explicacao": "c) 990.000"}, {"enunciado": "Quanto é 188 × 97? Responda com a letra.", "alternativas": ["1.316", "16.920", "9.986", "18.236", "3.008"], "certa": 3, "explicacao": "d) 18.236"}, {"enunciado": "Qual destes números é o maior? 4,39, 4,237, 4,21, 4,289 e 4,4 Responda com a letra.", "alternativas": ["4,4", "4,237", "4,39", "4,21", "4,289"], "certa": 0, "explicacao": "a) 4,4"}, {"enunciado": "Numa caixa há 2 bolas azuis e 8 bolas amarelas. Tirando uma sem olhar, qual é a chance de sair azul? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>10</span></span>", "<span class=\"fr\"><span>8</span><span>10</span></span>", "<span class=\"fr\"><span>2</span><span>10</span></span>", "<span class=\"fr\"><span>10</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>10</span></span>"}, {"enunciado": "O que quer dizer <b>triplo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["três vezes o número", "na Matemática, uma conta com várias operações", "quanto uma medida mudou", "o número mais 3", "o resultado de juntar tudo"], "certa": 0, "explicacao": "a) três vezes o número. Não é “o número mais 3”: essa é a pegadinha."}, {"enunciado": "Como se escreve “vinte inteiros e noventa e três milésimos” com algarismos? Responda com a letra.", "alternativas": ["20.093", "20,093", "20,0093", "20,039", "20,93"], "certa": 1, "explicacao": "b) 20,093"}, {"enunciado": "Uma compra custou R$ 13,17 e foi paga com uma nota de R$ 20,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 7,83", "R$ 33,17", "R$ 13,17", "R$ 7,00", "R$ 6,83"], "certa": 4, "explicacao": "e) R$ 6,83"}, {"enunciado": "Uma lanchonete tem 4 tipos de pão, 3 de recheio e 2 de suco. Quantos lanches diferentes dá para montar com 1 pão, 1 recheio e 1 suco? Responda com a letra.", "alternativas": ["12", "14", "23", "9", "24"], "certa": 4, "explicacao": "e) 24"}, {"enunciado": "A viagem começou às 13h52 e durou 3h53. A que horas terminou? Responda com a letra.", "alternativas": ["16h45", "17h45", "16h105", "17h52", "9h59"], "certa": 1, "explicacao": "b) 17h45"}, {"enunciado": "O que quer dizer <b>denominador</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto uma medida mudou", "o número de cima da fração", "o número que vem logo antes", "o valor que se tira do preço", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido"], "certa": 4, "explicacao": "e) o número de baixo da fração: em quantas partes iguais o inteiro foi dividido. Não é “o número de cima da fração”: essa é a pegadinha."}, {"enunciado": "A turma votou na cor preferida. Resultado — verde, 22; amarelo, 9; azul, 6; roxo, 15. Quantos alunos votaram? Responda com a letra.", "alternativas": ["62", "22", "46", "4", "52"], "certa": 4, "explicacao": "e) 52"}];
const CHAVE='simulado-bonus-mat-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
