<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 922 × 57? Responda com a letra.", "alternativas": ["52.554", "46.100", "5.344", "11.064", "6.454"], "certa": 0, "explicacao": "a) 52.554"}, {"enunciado": "Quanto é 50% de 52? Responda com a letra.", "alternativas": ["26", "102", "260", "2", "2.600"], "certa": 0, "explicacao": "a) 26"}, {"enunciado": "Quanto é 190 × 700? Responda com a letra.", "alternativas": ["1.330.000", "13.300", "133.000", "133", "1.330"], "certa": 2, "explicacao": "c) 133.000"}, {"enunciado": "Pensei num número, multipliquei por 5 e tirei 6. Deu 94. Em que número pensei? Responda com a letra.", "alternativas": ["476", "20", "470", "89", "100"], "certa": 1, "explicacao": "b) 20"}, {"enunciado": "Leia: “Em <span class=\"fr\"><span>3</span><span>8</span></span>, o numerador é 3.” Nessa frase, <b>numerador</b> quer dizer… Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o número de cima da fração: quantas partes foram pegas", "o que sobra numa divisão que não é exata", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o número de baixo da fração"], "certa": 1, "explicacao": "b) o número de cima da fração: quantas partes foram pegas. Não é “o número de baixo da fração”: essa é a pegadinha."}, {"enunciado": "Quanto é 8 × 8 − 9 × 3? Responda com a letra.", "alternativas": ["165", "52", "28", "91", "37"], "certa": 4, "explicacao": "e) 37"}, {"enunciado": "A turma votou no animal preferido. Resultado — cachorro, 24; coelho, 17; peixe, 14. Quantos alunos votaram? Responda com a letra.", "alternativas": ["55", "24", "41", "3", "65"], "certa": 0, "explicacao": "a) 55"}, {"enunciado": "Quanto é 7,012 ÷ 100? Responda com a letra.", "alternativas": ["0,7012", "0,007012", "701,2", "7,012", "0,07012"], "certa": 4, "explicacao": "e) 0,07012"}, {"enunciado": "6 cadernos custam R$ 30. Quanto custam 9 cadernos iguais? Responda com a letra.", "alternativas": ["R$ 45", "R$ 5", "R$ 39", "R$ 270", "R$ 33"], "certa": 0, "explicacao": "a) R$ 45"}, {"enunciado": "O que quer dizer <b>coordenadas</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada grupo de 3 ordens de um número: unidades, milhares, milhões", "o par de números que diz onde um ponto está", "o quadrilátero que tem 2 pares de lados paralelos", "as cores de um mapa", "quantas vezes algo aparece"], "certa": 1, "explicacao": "b) o par de números que diz onde um ponto está. Não é “as cores de um mapa”: essa é a pegadinha."}, {"enunciado": "Complete: 64,2 m = <span class=\"caixa\"></span> cm. Responda com a letra.", "alternativas": ["642", "64.200", "6.420", "642.000", "64,2"], "certa": 2, "explicacao": "c) 6.420"}, {"enunciado": "Quanto é 4.576 ÷ 22? Responda com a letra.", "alternativas": ["20", "2.008", "208", "280", "28"], "certa": 2, "explicacao": "c) 208"}, {"enunciado": "Quanto é 69.246 + 29.485? Responda com a letra.", "alternativas": ["81.861.211", "98.731", "39.761", "98.821", "88.621"], "certa": 1, "explicacao": "b) 98.731"}, {"enunciado": "Bianca tem 4 camisetas e 7 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["7", "27", "28", "11", "56"], "certa": 2, "explicacao": "c) 28"}, {"enunciado": "Leia: “A duração do filme foi de 1h50.” Nessa frase, <b>duração</b> quer dizer… Responda com a letra.", "alternativas": ["quanto tempo algo dura, do começo ao fim", "a hora em que algo começa", "o plano do dinheiro que entra e do que vai ser gasto", "cada número de uma sequência", "o segmento que liga dois vértices que não são vizinhos"], "certa": 0, "explicacao": "a) quanto tempo algo dura, do começo ao fim. Não é “a hora em que algo começa”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>1</span><span>10</span></span> em número decimal? Responda com a letra.", "alternativas": ["0,01", "10", "1", "0,1", "1,10"], "certa": 3, "explicacao": "d) 0,1"}, {"enunciado": "Entre as frações <span class=\"fr\"><span>1</span><span>4</span></span>, <span class=\"fr\"><span>1</span><span>5</span></span>, <span class=\"fr\"><span>1</span><span>6</span></span>, <span class=\"fr\"><span>1</span><span>3</span></span> e <span class=\"fr\"><span>1</span><span>11</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>11</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>3</span></span>"}, {"enunciado": "Uma barra foi dividida em 12 pedaços iguais e 3 estão pintados. Que fração da barra foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>15</span></span>", "<span class=\"fr\"><span>3</span><span>12</span></span>", "<span class=\"fr\"><span>3</span><span>9</span></span>", "<span class=\"fr\"><span>9</span><span>12</span></span>", "<span class=\"fr\"><span>12</span><span>3</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>3</span><span>12</span></span>"}, {"enunciado": "Saindo do ponto (5, 3), ande 1 para a direita e 4 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(10, 3)", "(6, 7)", "(9, 4)", "(7, 6)", "(6, 3)"], "certa": 1, "explicacao": "b) (6, 7)"}, {"enunciado": "O que quer dizer <b>proporcional</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o que sobra numa divisão que não é exata", "que aumenta sempre somando o mesmo tanto", "cada uma das 2 partes iguais de um inteiro", "que aumenta ou diminui na mesma medida", "quanto cabe dentro de um recipiente"], "certa": 3, "explicacao": "d) que aumenta ou diminui na mesma medida. Não é “que aumenta sempre somando o mesmo tanto”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 1 bola preta e 7 bolas vermelhas. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>8</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>7</span><span>8</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>1</span><span>8</span></span>"}, {"enunciado": "Quantas faces tem um paralelepípedo? Responda com a letra.", "alternativas": ["7", "6", "5", "14", "8"], "certa": 1, "explicacao": "b) 6"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>7</span><span>4</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["1 <span class=\"fr\"><span>3</span><span>7</span></span>", "2 <span class=\"fr\"><span>3</span><span>4</span></span>", "1 <span class=\"fr\"><span>3</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>4</span></span>", "1 <span class=\"fr\"><span>1</span><span>4</span></span>"], "certa": 2, "explicacao": "c) 1 <span class=\"fr\"><span>3</span><span>4</span></span>"}, {"enunciado": "A turma votou na fruta preferida. Resultado — maçã, 11; banana, 19; manga, 9. Quantos alunos votaram? Responda com a letra.", "alternativas": ["39", "19", "3", "30", "49"], "certa": 0, "explicacao": "a) 39"}, {"enunciado": "Leia: “As linhas do sinal + são perpendiculares.” Nessa frase, <b>perpendiculares</b> quer dizer… Responda com a letra.", "alternativas": ["que nunca encontra a outra reta", "que cruza outra reta formando um ângulo reto", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o valor que se tira do preço", "o que sobra numa divisão que não é exata"], "certa": 1, "explicacao": "b) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 15 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["85%", "1,5%", "1%", "100%", "15%"], "certa": 4, "explicacao": "e) 15%"}, {"enunciado": "Quanto é <span class=\"fr\"><span>5</span><span>9</span></span> + <span class=\"fr\"><span>1</span><span>9</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>18</span></span>", "<span class=\"fr\"><span>6</span><span>9</span></span>", "<span class=\"fr\"><span>5</span><span>9</span></span>", "<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>6</span><span>81</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>6</span><span>9</span></span>"}, {"enunciado": "Complete: 9,77 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["9,77", "97.700", "0,00977", "97,7", "9.770"], "certa": 4, "explicacao": "e) 9.770"}, {"enunciado": "Quantos lados tem um quadrilátero? Responda com a letra.", "alternativas": ["5", "8", "4", "3", "6"], "certa": 2, "explicacao": "c) 4"}, {"enunciado": "Leia: “O corredor ganhou por três milésimos de segundo: 0,003 s.” Nessa frase, <b>milésimos</b> quer dizer… Responda com a letra.", "alternativas": ["uma parte de cada 100", "cada uma das 1.000 partes iguais de um inteiro", "um valor aproximado, calculado de cabeça", "cada uma das 10 partes iguais de um inteiro", "o número 1.000"], "certa": 1, "explicacao": "b) cada uma das 1.000 partes iguais de um inteiro. Não é “o número 1.000”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
