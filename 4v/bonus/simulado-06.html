<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (4, 5)? Responda com a letra.", "alternativas": ["5 para a direita e 4 para cima", "9 para a direita", "4 para a esquerda e 5 para baixo", "4 para a direita e 5 para baixo", "4 para a direita e 5 para cima"], "certa": 4, "explicacao": "e) 4 para a direita e 5 para cima"}, {"enunciado": "Calcule 8 × 13 de cabeça, separando 13 em 10 + 3. Quanto dá? Responda com a letra.", "alternativas": ["83", "32", "21", "240", "104"], "certa": 4, "explicacao": "e) 104"}, {"enunciado": "Quanto é 20% de 40? Responda com a letra.", "alternativas": ["60", "32", "800", "2", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "A turma votou no esporte preferido. Resultado — natação, 24; basquete, 12; vôlei, 16; futebol, 4. Quantos votos vôlei teve a mais que basquete? Responda com a letra.", "alternativas": ["12", "16", "4", "28", "5"], "certa": 2, "explicacao": "c) 4"}, {"enunciado": "O que quer dizer <b>troco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o preço da compra", "cada número de uma sequência", "as informações que juntamos numa pesquisa", "o dinheiro que volta quando se paga mais que o preço"], "certa": 4, "explicacao": "e) o dinheiro que volta quando se paga mais que o preço. Não é “o preço da compra”: essa é a pegadinha."}, {"enunciado": "Quantos lados tem um eneágono? Responda com a letra.", "alternativas": ["8", "9", "11", "18", "10"], "certa": 1, "explicacao": "b) 9"}, {"enunciado": "Quanto é 93.268 − 46.349? Responda com a letra.", "alternativas": ["57.929", "46.919", "139.617", "46.929", "53.121"], "certa": 1, "explicacao": "b) 46.919"}, {"enunciado": "De manhã fazia 12 °C. À tarde, 18 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["12 °C", "6 °C", "7 °C", "18 °C", "30 °C"], "certa": 1, "explicacao": "b) 6 °C"}, {"enunciado": "Quanto é 792 × 93? Responda com a letra.", "alternativas": ["71.280", "73.656", "9.504", "2.376", "3.356"], "certa": 1, "explicacao": "b) 73.656"}, {"enunciado": "O que quer dizer <b>diferença</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado da adição", "o resultado da subtração", "quanto tempo algo dura, do começo ao fim", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "o resultado de juntar tudo"], "certa": 1, "explicacao": "b) o resultado da subtração. Não é “o resultado da adição”: essa é a pegadinha."}, {"enunciado": "Complete: 25,4 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["2.540", "25,4", "25.400", "254", "0,0254"], "certa": 2, "explicacao": "c) 25.400"}, {"enunciado": "Na sequência 20; 26; 32; 38; … qual é o 13º número? Responda com a letra.", "alternativas": ["98", "44", "78", "86", "92"], "certa": 4, "explicacao": "e) 92"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["9.427", "16.409", "19.336", "9.274", "9.247"], "certa": 4, "explicacao": "e) 9.247"}, {"enunciado": "3 sorvetes custam R$ 9. Quanto custam 4 sorvetes iguais? Responda com a letra.", "alternativas": ["R$ 10", "R$ 13", "R$ 12", "R$ 36", "R$ 3"], "certa": 2, "explicacao": "c) R$ 12"}, {"enunciado": "O que quer dizer <b>sequência</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o dinheiro que volta quando se paga mais que o preço", "números escolhidos ao acaso", "as informações que juntamos numa pesquisa", "a medida do contorno de uma figura", "números em ordem, seguindo uma regra"], "certa": 4, "explicacao": "e) números em ordem, seguindo uma regra. Não é “números escolhidos ao acaso”: essa é a pegadinha."}, {"enunciado": "Quantos vértices tem um hexágono? Responda com a letra.", "alternativas": ["6", "12", "7", "5", "8"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>2</span><span>10</span></span> em número decimal? Responda com a letra.", "alternativas": ["2", "0,02", "20", "0,2", "2,10"], "certa": 3, "explicacao": "d) 0,2"}, {"enunciado": "Numa caixa há 3 bolas brancas e 2 bolas verdes. Tirando uma sem olhar, qual é a chance de sair branca? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>5</span><span>3</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>3</span><span>5</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>3</span><span>5</span></span>"}, {"enunciado": "Quanto vale o algarismo destacado em 16<span class=\"dest\">4</span>.953? Responda com a letra.", "alternativas": ["4.000", "4.953", "400", "40.000", "4"], "certa": 0, "explicacao": "a) 4.000"}, {"enunciado": "Leia: “Comprou por R$ 20 e vendeu por R$ 35: o lucro foi de R$ 15.” Nessa frase, <b>lucro</b> quer dizer… Responda com a letra.", "alternativas": ["o quadrilátero que tem 2 pares de lados paralelos", "cada resultado que pode acontecer", "todo o dinheiro recebido na venda", "o que se ganha a mais: o preço de venda menos o que custou", "cada uma das 10 partes iguais de um inteiro"], "certa": 3, "explicacao": "d) o que se ganha a mais: o preço de venda menos o que custou. Não é “todo o dinheiro recebido na venda”: essa é a pegadinha."}, {"enunciado": "Quanto é 6,62 × 3? Responda com a letra.", "alternativas": ["1.986", "18,186", "198,6", "1,986", "19,86"], "certa": 4, "explicacao": "e) 19,86"}, {"enunciado": "Um retângulo de 2 cm por 3 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["24 cm²", "24 cm", "12 cm²", "20 cm", "6 cm²"], "certa": 0, "explicacao": "a) 24 cm²"}, {"enunciado": "Simplifique <span class=\"fr\"><span>8</span><span>20</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>20</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>10</span></span>", "<span class=\"fr\"><span>5</span><span>2</span></span>", "<span class=\"fr\"><span>2</span><span>10</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>2</span><span>5</span></span>"}, {"enunciado": "Numa caixa há 6 bolas verdes e 7 bolas vermelhas. Tirando uma sem olhar, qual é a chance de sair verde? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>13</span></span>", "<span class=\"fr\"><span>7</span><span>13</span></span>", "<span class=\"fr\"><span>13</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>13</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>6</span><span>13</span></span>"}, {"enunciado": "O que quer dizer <b>dados</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o ponto onde dois lados (ou arestas) se encontram", "o segmento que liga dois vértices que não são vizinhos", "três vezes o número", "os cubinhos numerados usados em jogos", "as informações que juntamos numa pesquisa"], "certa": 4, "explicacao": "e) as informações que juntamos numa pesquisa. Não é “os cubinhos numerados usados em jogos”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisor de 60? Responda com a letra.", "alternativas": ["4", "38", "180", "40", "120"], "certa": 0, "explicacao": "a) 4"}, {"enunciado": "Como se escreve “seis inteiros e sessenta e nove milésimos” com algarismos? Responda com a letra.", "alternativas": ["6,096", "6,069", "6.069", "6,69", "6,0069"], "certa": 1, "explicacao": "b) 6,069"}, {"enunciado": "Qual destes números é o maior? 4,9, 4,72, 4,45, 4,55 e 4,12 Responda com a letra.", "alternativas": ["4,12", "4,55", "4,45", "4,9", "4,72"], "certa": 3, "explicacao": "d) 4,9"}, {"enunciado": "O jogo começou às 18h46 e durou 2h26. A que horas terminou? Responda com a letra.", "alternativas": ["20h12", "20h72", "16h20", "21h46", "21h12"], "certa": 4, "explicacao": "e) 21h12"}, {"enunciado": "Leia: “25% é uma porcentagem: 25 de cada 100.” Nessa frase, <b>porcentagem</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "um número que está na tabuada de outro", "o espaço que um objeto ocupa", "uma parte de cada 10", "uma parte de cada 100"], "certa": 4, "explicacao": "e) uma parte de cada 100. Não é “uma parte de cada 10”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
