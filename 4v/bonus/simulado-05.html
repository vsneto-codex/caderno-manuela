<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é <span class=\"fr\"><span>3</span><span>4</span></span> + <span class=\"fr\"><span>1</span><span>2</span></span>? (A resposta está simplificada.) Responda com a letra.", "alternativas": ["1", "<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>5</span><span>4</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>4</span><span>7</span></span> de 21? Responda com a letra.", "alternativas": ["9", "3", "7", "12", "84"], "certa": 3, "explicacao": "d) 12"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 56 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["56%", "1%", "5,6%", "100%", "44%"], "certa": 0, "explicacao": "a) 56%"}, {"enunciado": "2 figurinhas custam R$ 30. Quanto custam 7 figurinhas iguais? Responda com a letra.", "alternativas": ["R$ 35", "R$ 105", "R$ 15", "R$ 37", "R$ 210"], "certa": 1, "explicacao": "b) R$ 105"}, {"enunciado": "O que quer dizer <b>aresta</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de cima da fração: quantas partes foram pegas", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "a linha onde duas faces de um sólido se encontram", "a parte plana de um sólido", "o valor que se tira do preço"], "certa": 2, "explicacao": "c) a linha onde duas faces de um sólido se encontram. Não é “a parte plana de um sólido”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 59<span class=\"dest\">8</span>.673? Responda com a letra.", "alternativas": ["80.000", "800", "8.673", "8", "8.000"], "certa": 4, "explicacao": "e) 8.000"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["17.958", "59.871", "57.198", "79.851", "9.943"], "certa": 3, "explicacao": "d) 79.851"}, {"enunciado": "Como se escreve 29% em número decimal? Responda com a letra.", "alternativas": ["0,71", "2,9", "29", "0,029", "0,29"], "certa": 4, "explicacao": "e) 0,29"}, {"enunciado": "Uma lanchonete tem 2 tipos de pão, 3 de recheio e 3 de suco. Quantos lanches diferentes dá para montar com 1 pão, 1 recheio e 1 suco? Responda com a letra.", "alternativas": ["8", "9", "18", "6", "17"], "certa": 2, "explicacao": "c) 18"}, {"enunciado": "Leia: “O retângulo é um paralelogramo: os lados de frente são paralelos.” Nessa frase, <b>paralelogramo</b> quer dizer… Responda com a letra.", "alternativas": ["o quadrilátero que tem 2 pares de lados paralelos", "qualquer figura de 4 lados", "o resultado da multiplicação", "o segmento que liga dois vértices que não são vizinhos", "o que sobra numa divisão que não é exata"], "certa": 0, "explicacao": "a) o quadrilátero que tem 2 pares de lados paralelos. Não é “qualquer figura de 4 lados”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>2167</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["2.167", "0,2167", "2167,1000", "2,167", "21,67"], "certa": 3, "explicacao": "d) 2,167"}, {"enunciado": "Quanto é 18 + 8 × 2? Responda com a letra.", "alternativas": ["288", "34", "52", "28", "42"], "certa": 1, "explicacao": "b) 34"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["63.723", "32.367", "9.602", "37.362", "37.326"], "certa": 0, "explicacao": "a) 63.723"}, {"enunciado": "O que quer dizer <b>dobro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "números em ordem, seguindo uma regra", "o número mais 2", "duas vezes o número", "quantas vezes o desenho é maior ou menor que o tamanho real"], "certa": 3, "explicacao": "d) duas vezes o número. Não é “o número mais 2”: essa é a pegadinha."}, {"enunciado": "A mensalidade do clube custava R$ 180 e teve um aumento de 30%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 288", "R$ 210", "R$ 234", "R$ 54", "R$ 126"], "certa": 2, "explicacao": "c) R$ 234"}, {"enunciado": "Como se escreve “doze inteiros e dois milésimos” com algarismos? Responda com a letra.", "alternativas": ["12,02", "12,2", "13,002", "12,002", "12,0002"], "certa": 3, "explicacao": "d) 12,002"}, {"enunciado": "Saindo do ponto (4, 3), ande 2 para a direita e 5 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(2, 5)", "(6, 3)", "(8, 6)", "(6, 8)", "(11, 3)"], "certa": 3, "explicacao": "d) (6, 8)"}, {"enunciado": "60 balas foram divididas entre dois irmãos. Um ficou com o quádruplo (4 vezes) do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["60", "12", "15", "30", "10"], "certa": 1, "explicacao": "b) 12"}, {"enunciado": "O que quer dizer <b>capacidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de cima da fração: quantas partes foram pegas", "quanto cabe dentro de um recipiente", "quanto o recipiente pesa", "na Matemática, uma conta com várias operações", "quanto tempo algo dura, do começo ao fim"], "certa": 1, "explicacao": "b) quanto cabe dentro de um recipiente. Não é “quanto o recipiente pesa”: essa é a pegadinha."}, {"enunciado": "Uma parede foi dividida em 6 partes iguais e 5 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>11</span></span>", "<span class=\"fr\"><span>6</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>5</span><span>6</span></span>"}, {"enunciado": "A turma votou na fruta preferida. Resultado — manga, 13; banana, 17; uva, 5. Quantos alunos votaram? Responda com a letra.", "alternativas": ["35", "17", "30", "3", "45"], "certa": 0, "explicacao": "a) 35"}, {"enunciado": "Quanto é 43,7 + 4,72? Responda com a letra.", "alternativas": ["9,09", "484,2", "48,42", "909", "4,842"], "certa": 2, "explicacao": "c) 48,42"}, {"enunciado": "A turma votou na fruta preferida. Resultado — maçã, 22; uva, 5; manga, 7. Quantos votos maçã teve a mais que uva? Responda com a letra.", "alternativas": ["5", "22", "27", "17", "18"], "certa": 3, "explicacao": "d) 17"}, {"enunciado": "O que quer dizer <b>termo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto cabe dentro de um recipiente", "quantas vezes o desenho é maior ou menor que o tamanho real", "o plano do dinheiro que entra e do que vai ser gasto", "o último número da sequência", "cada número de uma sequência"], "certa": 4, "explicacao": "e) cada número de uma sequência. Não é “o último número da sequência”: essa é a pegadinha."}, {"enunciado": "Simplifique <span class=\"fr\"><span>8</span><span>64</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>32</span></span>", "<span class=\"fr\"><span>4</span><span>32</span></span>", "<span class=\"fr\"><span>1</span><span>64</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>1</span><span>8</span></span>"}, {"enunciado": "Qual destes números é o maior? 7,58, 7,52, 7,687, 7,7 e 7,35 Responda com a letra.", "alternativas": ["7,35", "7,687", "7,58", "7,7", "7,52"], "certa": 3, "explicacao": "d) 7,7"}, {"enunciado": "Pensei num número, multipliquei por 5 e tirei 13. Deu 122. Em que número pensei? Responda com a letra.", "alternativas": ["27", "117", "135", "610", "623"], "certa": 0, "explicacao": "a) 27"}, {"enunciado": "Um retângulo de 2 cm por 9 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["18 cm²", "72 cm", "44 cm", "72 cm²", "36 cm²"], "certa": 3, "explicacao": "d) 72 cm²"}, {"enunciado": "Leia: “<span class=\"fr\"><span>1</span><span>2</span></span> e <span class=\"fr\"><span>2</span><span>4</span></span> são frações equivalentes.” Nessa frase, <b>equivalentes</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 100 partes iguais de um inteiro", "que vale o mesmo", "a linha onde duas faces de um sólido se encontram", "o dinheiro que volta quando se paga mais que o preço", "que tem os mesmos números"], "certa": 1, "explicacao": "b) que vale o mesmo. Não é “que tem os mesmos números”: essa é a pegadinha."}, {"enunciado": "Quanto é 2.500 × 300? Responda com a letra.", "alternativas": ["750.000", "75", "7.500", "7.500.000", "75.000"], "certa": 0, "explicacao": "a) 750.000"}];
const CHAVE='simulado-bonus-mat-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
