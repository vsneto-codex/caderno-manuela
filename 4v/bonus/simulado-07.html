<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://colecaosuperbase.com.br/4v/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "A turma votou na fruta preferida. Resultado — uva, 22; banana, 12; maçã, 11. Quantos alunos votaram? Responda com a letra.", "alternativas": ["34", "45", "22", "55", "3"], "certa": 1, "explicacao": "b) 45"}, {"enunciado": "120 figurinhas foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["120", "90", "30", "60", "24"], "certa": 2, "explicacao": "c) 30"}, {"enunciado": "9 cadernos custam R$ 117. Quanto custam 4 cadernos iguais? Responda com a letra.", "alternativas": ["R$ 468", "R$ 112", "R$ 121", "R$ 13", "R$ 52"], "certa": 4, "explicacao": "e) R$ 52"}, {"enunciado": "Quanto é 75% de 92? Responda com a letra.", "alternativas": ["69", "690", "17", "6.900", "167"], "certa": 0, "explicacao": "a) 69"}, {"enunciado": "Leia: “O triângulo tem 3 vértices.” Nessa frase, <b>vértices</b> quer dizer… Responda com a letra.", "alternativas": ["o valor que se tira do preço", "cada número que se soma numa adição", "que aumenta ou diminui na mesma medida", "o ponto onde dois lados (ou arestas) se encontram", "o meio de um lado"], "certa": 3, "explicacao": "d) o ponto onde dois lados (ou arestas) se encontram. Não é “o meio de um lado”: essa é a pegadinha."}, {"enunciado": "Calcule 8 × 46 de cabeça, separando 46 em 40 + 6. Quanto dá? Responda com a letra.", "alternativas": ["1.920", "326", "54", "80", "368"], "certa": 4, "explicacao": "e) 368"}, {"enunciado": "Um retângulo de 3 cm por 8 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["44 cm", "96 cm²", "48 cm²", "96 cm", "24 cm²"], "certa": 1, "explicacao": "b) 96 cm²"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["37.406", "9.718", "63.047", "64.037", "73.064"], "certa": 4, "explicacao": "e) 73.064"}, {"enunciado": "Um ventilador custa R$ 209 à vista, ou 6 vezes de R$ 36. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 425", "R$ 216", "R$ 7", "R$ 209", "R$ 173"], "certa": 2, "explicacao": "c) R$ 7"}, {"enunciado": "O que quer dizer <b>possibilidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada resultado que pode acontecer", "o que se ganha a mais: o preço de venda menos o que custou", "que aumenta ou diminui na mesma medida", "o resultado que vai acontecer com certeza", "a coisa toda, sem faltar nenhuma parte"], "certa": 0, "explicacao": "a) cada resultado que pode acontecer. Não é “o resultado que vai acontecer com certeza”: essa é a pegadinha."}, {"enunciado": "Um retângulo de 8 cm por 7 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["224 cm²", "224 cm", "56 cm²", "112 cm²", "60 cm"], "certa": 0, "explicacao": "a) 224 cm²"}, {"enunciado": "Qual fração é equivalente a <span class=\"fr\"><span>3</span><span>7</span></span> (vale o mesmo)? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>14</span></span>", "<span class=\"fr\"><span>7</span><span>3</span></span>", "<span class=\"fr\"><span>4</span><span>8</span></span>", "<span class=\"fr\"><span>3</span><span>14</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>6</span><span>14</span></span>"}, {"enunciado": "Qual é o número que falta? 7 × <span class=\"caixa\"></span> = 70 Responda com a letra.", "alternativas": ["490", "11", "10", "63", "70"], "certa": 2, "explicacao": "c) 10"}, {"enunciado": "A aula de natação começou às 15h18 e durou 2h44. A que horas terminou? Responda com a letra.", "alternativas": ["17h02", "12h34", "17h62", "18h18", "18h02"], "certa": 4, "explicacao": "e) 18h02"}, {"enunciado": "Leia: “A probabilidade de sair 6 num dado é <span class=\"fr\"><span>1</span><span>6</span></span>.” Nessa frase, <b>probabilidade</b> quer dizer… Responda com a letra.", "alternativas": ["a certeza de que vai acontecer", "o resultado de juntar tudo", "a chance de algo acontecer", "um valor aproximado, calculado de cabeça", "as informações que juntamos numa pesquisa"], "certa": 2, "explicacao": "c) a chance de algo acontecer. Não é “a certeza de que vai acontecer”: essa é a pegadinha."}, {"enunciado": "Qual é o perímetro de um retângulo de 7 cm por 13 cm? Responda com a letra.", "alternativas": ["20 cm", "40 cm²", "91 cm²", "27 cm", "40 cm"], "certa": 4, "explicacao": "e) 40 cm"}, {"enunciado": "Uma jaqueta custa R$ 140 e está com 30% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 56", "R$ 182", "R$ 42", "R$ 98", "R$ 110"], "certa": 3, "explicacao": "d) R$ 98"}, {"enunciado": "Como se escreve “oitocentos e cinquenta e oito mil e noventa e quatro” com algarismos? Responda com a letra.", "alternativas": ["85.894", "858.094", "858.940", "858.000.094", "94.858"], "certa": 1, "explicacao": "b) 858.094"}, {"enunciado": "Uma parede foi dividida em 5 partes iguais e 2 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>7</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>5</span><span>2</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>5</span></span>"}, {"enunciado": "O que quer dizer <b>aproximadamente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a chance de algo acontecer", "uma parte de cada 100", "que aumenta ou diminui na mesma medida", "exatamente, sem errar nada", "perto de, mais ou menos"], "certa": 4, "explicacao": "e) perto de, mais ou menos. Não é “exatamente, sem errar nada”: essa é a pegadinha."}, {"enunciado": "Como se escreve 23% em número decimal? Responda com a letra.", "alternativas": ["0,23", "23", "2,3", "0,023", "0,77"], "certa": 0, "explicacao": "a) 0,23"}, {"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 13; natação, 17; vôlei, 11. Quantos alunos votaram? Responda com a letra.", "alternativas": ["41", "51", "17", "3", "30"], "certa": 0, "explicacao": "a) 41"}, {"enunciado": "Quanto é 24.452 + 6.773? Responda com a letra.", "alternativas": ["17.679", "21.011.125", "31.225", "32.125", "20.125"], "certa": 2, "explicacao": "c) 31.225"}, {"enunciado": "Na sequência 29; 38; 47; 56; … qual é o 17º número? Responda com a letra.", "alternativas": ["65", "173", "164", "153", "182"], "certa": 1, "explicacao": "b) 173"}, {"enunciado": "Leia: “Uma pizza inteira tem <span class=\"fr\"><span>8</span><span>8</span></span>.” Nessa frase, <b>inteira</b> quer dizer… Responda com a letra.", "alternativas": ["um número muito grande", "o mesmo sentido em que giram os ponteiros do relógio", "que aumenta ou diminui na mesma medida", "a coisa toda, sem faltar nenhuma parte", "o resultado da multiplicação"], "certa": 3, "explicacao": "d) a coisa toda, sem faltar nenhuma parte. Não é “um número muito grande”: essa é a pegadinha."}, {"enunciado": "Quantos cubinhos enchem uma caixa de 3 cubinhos de comprimento, 3 de largura e 7 de altura? Responda com a letra.", "alternativas": ["54", "9", "102", "63", "13"], "certa": 3, "explicacao": "d) 63"}, {"enunciado": "Como se escreve “quatrocentos e vinte e dois mil e cinco” com algarismos? Responda com a letra.", "alternativas": ["5.422", "422.005", "422.000.005", "422.500", "4.225"], "certa": 1, "explicacao": "b) 422.005"}, {"enunciado": "Quanto é <span class=\"fr\"><span>3</span><span>5</span></span> de 70? Responda com a letra.", "alternativas": ["17", "42", "14", "28", "210"], "certa": 1, "explicacao": "b) 42"}, {"enunciado": "Como se escreve “dez inteiros e vinte e oito milésimos” com algarismos? Responda com a letra.", "alternativas": ["10.028", "10,028", "10,28", "10,082", "10,0028"], "certa": 1, "explicacao": "b) 10,028"}, {"enunciado": "Leia: “O comprimento da mesa é 1,5 m.” Nessa frase, <b>comprimento</b> quer dizer… Responda com a letra.", "alternativas": ["o peso de um objeto", "a medida de uma ponta à outra", "cada uma das 100 partes iguais de um inteiro", "três vezes o número", "a medida do contorno de uma figura"], "certa": 1, "explicacao": "b) a medida de uma ponta à outra. Não é “o peso de um objeto”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
