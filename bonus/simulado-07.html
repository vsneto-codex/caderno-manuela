<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "A turma votou na fruta preferida. Resultado — uva, 22; banana, 12; maçã, 11. Quantos alunos votaram? Responda com a letra.", "alternativas": ["34", "45", "22", "55", "3"], "certa": 1, "explicacao": "b) 45"}, {"enunciado": "120 figurinhas foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["120", "90", "30", "60", "24"], "certa": 2, "explicacao": "c) 30"}, {"enunciado": "9 cadernos custam R$ 117. Quanto custam 4 cadernos iguais? Responda com a letra.", "alternativas": ["R$ 468", "R$ 112", "R$ 121", "R$ 13", "R$ 52"], "certa": 4, "explicacao": "e) R$ 52"}, {"enunciado": "Quanto é 40% de 45? Responda com a letra.", "alternativas": ["27", "5", "85", "180", "18"], "certa": 4, "explicacao": "e) 18"}, {"enunciado": "O que quer dizer <b>perpendicular</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada número de uma sequência", "que cruza outra reta formando um ângulo reto", "números em ordem, seguindo uma regra", "o quadrilátero que tem 2 pares de lados paralelos", "que nunca encontra a outra reta"], "certa": 1, "explicacao": "b) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Calcule 8 × 45 de cabeça, separando 45 em 40 + 5. Quanto dá? Responda com a letra.", "alternativas": ["1.600", "360", "53", "325", "72"], "certa": 1, "explicacao": "b) 360"}, {"enunciado": "Quantas faces tem uma pirâmide de base pentagonal? Responda com a letra.", "alternativas": ["12", "7", "5", "6", "10"], "certa": 3, "explicacao": "d) 6"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["29.808", "80.289", "9.502", "20.898", "80.892"], "certa": 4, "explicacao": "e) 80.892"}, {"enunciado": "Davi quer comprar uma camiseta de R$ 60 e guarda R$ 20 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["4", "40", "3", "80", "1.200"], "certa": 2, "explicacao": "c) 3"}, {"enunciado": "O que quer dizer <b>resto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o que sobra numa divisão que não é exata", "o quadrilátero que tem 2 pares de lados paralelos", "que cruza outra reta formando um ângulo reto", "o resultado da divisão", "a coisa toda, sem faltar nenhuma parte"], "certa": 0, "explicacao": "a) o que sobra numa divisão que não é exata. Não é “o resultado da divisão”: essa é a pegadinha."}, {"enunciado": "Um retângulo de 8 cm por 7 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["224 cm²", "224 cm", "56 cm²", "112 cm²", "60 cm"], "certa": 0, "explicacao": "a) 224 cm²"}, {"enunciado": "Simplifique <span class=\"fr\"><span>32</span><span>56</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>56</span></span>", "<span class=\"fr\"><span>16</span><span>28</span></span>", "<span class=\"fr\"><span>4</span><span>28</span></span>", "<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>4</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>4</span><span>7</span></span>"}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> + 81 = 120 Responda com a letra.", "alternativas": ["39", "81", "120", "49", "201"], "certa": 0, "explicacao": "a) 39"}, {"enunciado": "O jogo começou às 12h30 e durou 2h37. A que horas terminou? Responda com a letra.", "alternativas": ["15h07", "14h67", "15h30", "14h07", "9h53"], "certa": 0, "explicacao": "a) 15h07"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o quadrilátero que tem 2 pares de lados paralelos", "o mesmo sentido em que giram os ponteiros do relógio", "o dinheiro que volta quando se paga mais que o preço", "um número que tem vírgula", "um número com uma parte inteira e uma fração"], "certa": 4, "explicacao": "e) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "A aula de natação começou às 15h18 e durou 2h44. A que horas terminou? Responda com a letra.", "alternativas": ["17h02", "12h34", "17h62", "18h18", "18h02"], "certa": 4, "explicacao": "e) 18h02"}, {"enunciado": "Um tênis custa R$ 160 e está com 30% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 112", "R$ 48", "R$ 208", "R$ 130", "R$ 64"], "certa": 0, "explicacao": "a) R$ 112"}, {"enunciado": "Como se escreve “duzentos e vinte e três mil e cinquenta e quatro” com algarismos? Responda com a letra.", "alternativas": ["223.000.054", "223.540", "22.354", "54.223", "223.054"], "certa": 4, "explicacao": "e) 223.054"}, {"enunciado": "Uma parede foi dividida em 12 partes iguais e 8 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>20</span></span>", "<span class=\"fr\"><span>8</span><span>12</span></span>", "<span class=\"fr\"><span>4</span><span>12</span></span>", "<span class=\"fr\"><span>8</span><span>4</span></span>", "<span class=\"fr\"><span>12</span><span>8</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>8</span><span>12</span></span>"}, {"enunciado": "Leia: “Na sequência 5, 10, 15, 20, a regra é somar 5.” Nessa frase, <b>sequência</b> quer dizer… Responda com a letra.", "alternativas": ["números escolhidos ao acaso", "números em ordem, seguindo uma regra", "que aumenta ou diminui na mesma medida", "o plano do dinheiro que entra e do que vai ser gasto", "quantas vezes algo aparece"], "certa": 1, "explicacao": "b) números em ordem, seguindo uma regra. Não é “números escolhidos ao acaso”: essa é a pegadinha."}, {"enunciado": "Qual fração é igual a 20%? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>20</span><span>1000</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>20</span><span>10</span></span>", "<span class=\"fr\"><span>1</span><span>20</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 5; amarelo, 7; azul, 12. Quantos alunos votaram? Responda com a letra.", "alternativas": ["24", "34", "19", "12", "3"], "certa": 0, "explicacao": "a) 24"}, {"enunciado": "Quanto é 8.827 + 27.590? Responda com a letra.", "alternativas": ["37.317", "21.513.117", "25.317", "-18.763", "36.417"], "certa": 4, "explicacao": "e) 36.417"}, {"enunciado": "Na sequência 15; 21; 27; 33; … qual é o 12º número? Responda com a letra.", "alternativas": ["81", "75", "87", "72", "39"], "certa": 0, "explicacao": "a) 81"}, {"enunciado": "Leia: “A diferença entre 50 e 38 é 12.” Nessa frase, <b>diferença</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "quando os dois lados do sinal = valem o mesmo", "o resultado da subtração", "uma parte de cada 100", "o resultado da adição"], "certa": 2, "explicacao": "c) o resultado da subtração. Não é “o resultado da adição”: essa é a pegadinha."}, {"enunciado": "Quantos cubinhos enchem uma caixa de 3 cubinhos de comprimento, 4 de largura e 7 de altura? Responda com a letra.", "alternativas": ["14", "12", "122", "84", "72"], "certa": 3, "explicacao": "d) 84"}, {"enunciado": "Como se escreve “novecentos e cinquenta e oito mil e noventa e cinco” com algarismos? Responda com a letra.", "alternativas": ["95.958", "958.950", "958.000.095", "958.095", "95.895"], "certa": 3, "explicacao": "d) 958.095"}, {"enunciado": "Quanto é <span class=\"fr\"><span>4</span><span>5</span></span> de 40? Responda com a letra.", "alternativas": ["50", "8", "32", "160", "12"], "certa": 2, "explicacao": "c) 32"}, {"enunciado": "Como se escreve “dezoito inteiros e noventa e um milésimos” com algarismos? Responda com a letra.", "alternativas": ["18,0091", "18,019", "18,091", "18.091", "18,91"], "certa": 2, "explicacao": "c) 18,091"}, {"enunciado": "Leia: “O perímetro do quadrado de lado 3 cm é 12 cm.” Nessa frase, <b>perímetro</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da multiplicação", "uma parte de cada 100", "a medida do contorno de uma figura", "o que sobra numa divisão que não é exata", "o espaço de dentro de uma figura"], "certa": 2, "explicacao": "c) a medida do contorno de uma figura. Não é “o espaço de dentro de uma figura”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
