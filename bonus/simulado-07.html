<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Um retângulo de 5 cm por 7 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["140 cm", "70 cm²", "48 cm", "35 cm²", "140 cm²"], "certa": 4, "explicacao": "e) 140 cm²"}, {"enunciado": "5 pães custam R$ 35. Quanto custam 7 pães iguais? Responda com a letra.", "alternativas": ["R$ 49", "R$ 7", "R$ 42", "R$ 37", "R$ 245"], "certa": 0, "explicacao": "a) R$ 49"}, {"enunciado": "Na sequência 23; 28; 33; 38; … qual é o 15º número? Responda com a letra.", "alternativas": ["93", "88", "98", "43", "75"], "certa": 0, "explicacao": "a) 93"}, {"enunciado": "Como se escreve 37% em número decimal? Responda com a letra.", "alternativas": ["0,37", "0,037", "3,7", "0,63", "37"], "certa": 0, "explicacao": "a) 0,37"}, {"enunciado": "O que quer dizer <b>numerador</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de cima da fração: quantas partes foram pegas", "o número de baixo da fração", "quantas vezes o desenho é maior ou menor que o tamanho real", "uma parte de cada 100", "o ponto onde dois lados (ou arestas) se encontram"], "certa": 0, "explicacao": "a) o número de cima da fração: quantas partes foram pegas. Não é “o número de baixo da fração”: essa é a pegadinha."}, {"enunciado": "Quanto é 25% de 92? Responda com a letra.", "alternativas": ["23", "67", "69", "2.300", "117"], "certa": 0, "explicacao": "a) 23"}, {"enunciado": "56 figurinhas foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["70", "14", "42", "56", "53"], "certa": 1, "explicacao": "b) 14"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["6.019", "9.160", "6.910", "12.402", "11.262"], "certa": 0, "explicacao": "a) 6.019"}, {"enunciado": "Uma jaqueta custa R$ 164 e está com 25% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 139", "R$ 82", "R$ 41", "R$ 123", "R$ 205"], "certa": 3, "explicacao": "d) R$ 123"}, {"enunciado": "O que quer dizer <b>metade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um pedaço qualquer", "o plano do dinheiro que entra e do que vai ser gasto", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "cada uma das 1.000 partes iguais de um inteiro", "cada uma das 2 partes iguais de um inteiro"], "certa": 4, "explicacao": "e) cada uma das 2 partes iguais de um inteiro. Não é “um pedaço qualquer”: essa é a pegadinha."}, {"enunciado": "De manhã fazia 9 °C. À tarde, 14 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["6 °C", "23 °C", "14 °C", "5 °C", "9 °C"], "certa": 3, "explicacao": "d) 5 °C"}, {"enunciado": "Simplifique <span class=\"fr\"><span>6</span><span>48</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>48</span></span>", "<span class=\"fr\"><span>8</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>3</span><span>24</span></span>", "<span class=\"fr\"><span>1</span><span>24</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>8</span></span>"}, {"enunciado": "Numa caixa há 1 bola amarela e 4 bolas azuis. Tirando uma sem olhar, qual é a chance de sair amarela? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "O filme começou às 19h51 e durou 3h49. A que horas terminou? Responda com a letra.", "alternativas": ["23h40", "23h51", "16h02", "22h40", "22h100"], "certa": 0, "explicacao": "a) 23h40"}, {"enunciado": "Leia: “Em 2.305.048, a classe dos milhares é 305.” Nessa frase, <b>classe</b> quer dizer… Responda com a letra.", "alternativas": ["o que sobra numa divisão que não é exata", "a sala de aula", "quanto cabe dentro de um recipiente", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "cada uma das 1.000 partes iguais de um inteiro"], "certa": 3, "explicacao": "d) cada grupo de 3 ordens de um número: unidades, milhares, milhões. Não é “a sala de aula”: essa é a pegadinha."}, {"enunciado": "Complete: 301 cm = <span class=\"caixa\"></span> mm. Responda com a letra.", "alternativas": ["30.100", "30,1", "3.010.000", "301", "3.010"], "certa": 4, "explicacao": "e) 3.010"}, {"enunciado": "Quanto é 30% de 340? Responda com a letra.", "alternativas": ["370", "1.020", "310", "102", "10.200"], "certa": 3, "explicacao": "d) 102"}, {"enunciado": "Como se escreve “quatrocentos e oitenta e sete mil e treze” com algarismos? Responda com a letra.", "alternativas": ["487.130", "48.713", "13.487", "487.000.013", "487.013"], "certa": 4, "explicacao": "e) 487.013"}, {"enunciado": "Uma torta foi dividida em 7 pedaços iguais e 1 foi comido. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>7</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>7</span></span>"}, {"enunciado": "Leia: “O triângulo tem 3 vértices.” Nessa frase, <b>vértices</b> quer dizer… Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o meio de um lado", "o ponto onde dois lados (ou arestas) se encontram", "a troca de uma unidade por outra, sem mudar a medida", "quantas vezes algo aparece"], "certa": 2, "explicacao": "c) o ponto onde dois lados (ou arestas) se encontram. Não é “o meio de um lado”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> − 92 = 47 Responda com a letra.", "alternativas": ["47", "92", "45", "139", "129"], "certa": 3, "explicacao": "d) 139"}, {"enunciado": "Numa caixa há 8 bolas pretas e 9 bolas azuis. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>17</span><span>8</span></span>", "<span class=\"fr\"><span>9</span><span>17</span></span>", "<span class=\"fr\"><span>8</span><span>17</span></span>", "<span class=\"fr\"><span>8</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>8</span><span>17</span></span>"}, {"enunciado": "Quanto é 77.951 − 23.075? Responda com a letra.", "alternativas": ["54.876", "54.886", "54.924", "101.026", "54.986"], "certa": 0, "explicacao": "a) 54.876"}, {"enunciado": "Quantas faces tem um cubo? Responda com a letra.", "alternativas": ["6", "5", "8", "14", "7"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "O que quer dizer <b>igualdade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quando os dois lados têm os mesmos números", "quantas vezes algo aparece", "que aumenta ou diminui na mesma medida", "quando os dois lados do sinal = valem o mesmo", "um número com uma parte inteira e uma fração"], "certa": 3, "explicacao": "d) quando os dois lados do sinal = valem o mesmo. Não é “quando os dois lados têm os mesmos números”: essa é a pegadinha."}, {"enunciado": "Como se escreve “novecentos e seis mil e sete” com algarismos? Responda com a letra.", "alternativas": ["906.000.007", "906.700", "9.067", "7.906", "906.007"], "certa": 4, "explicacao": "e) 906.007"}, {"enunciado": "Quanto é <span class=\"fr\"><span>3</span><span>5</span></span> de 20? Responda com a letra.", "alternativas": ["8", "7", "12", "60", "4"], "certa": 2, "explicacao": "c) 12"}, {"enunciado": "Como se escreve “cinco inteiros e dois centésimos” com algarismos? Responda com a letra.", "alternativas": ["5,0002", "5,02", "5,002", "6,02", "5,2"], "certa": 1, "explicacao": "b) 5,02"}, {"enunciado": "Quanto é 15 + 7 × 7? Responda com a letra.", "alternativas": ["735", "154", "64", "71", "29"], "certa": 2, "explicacao": "c) 64"}, {"enunciado": "O que quer dizer <b>termo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o último número da sequência", "cada número de uma sequência", "o resultado da subtração", "que aumenta ou diminui na mesma medida", "cada grupo de 3 ordens de um número: unidades, milhares, milhões"], "certa": 1, "explicacao": "b) cada número de uma sequência. Não é “o último número da sequência”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
