<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 7 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Um retângulo de 5 cm por 7 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["140 cm", "70 cm²", "48 cm", "35 cm²", "140 cm²"], "certa": 4, "explicacao": "e) 140 cm²"}, {"enunciado": "5 pães custam R$ 35. Quanto custam 7 pães iguais? Responda com a letra.", "alternativas": ["R$ 49", "R$ 7", "R$ 42", "R$ 37", "R$ 245"], "certa": 0, "explicacao": "a) R$ 49"}, {"enunciado": "Na sequência 23; 28; 33; 38; … qual é o 15º número? Responda com a letra.", "alternativas": ["93", "88", "98", "43", "75"], "certa": 0, "explicacao": "a) 93"}, {"enunciado": "Como se escreve 37% em número decimal? Responda com a letra.", "alternativas": ["0,37", "0,037", "3,7", "0,63", "37"], "certa": 0, "explicacao": "a) 0,37"}, {"enunciado": "O que quer dizer <b>metade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 2 partes iguais de um inteiro", "um pedaço qualquer", "quantas vezes o desenho é maior ou menor que o tamanho real", "uma parte de cada 100", "o ponto onde dois lados (ou arestas) se encontram"], "certa": 0, "explicacao": "a) cada uma das 2 partes iguais de um inteiro. Não é “um pedaço qualquer”: essa é a pegadinha."}, {"enunciado": "Uma mochila custa R$ 115 e está com 20% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 95", "R$ 23", "R$ 138", "R$ 69", "R$ 92"], "certa": 4, "explicacao": "e) R$ 92"}, {"enunciado": "132 bolinhas de gude foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["99", "33", "66", "44", "165"], "certa": 1, "explicacao": "b) 33"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["78.901", "18.907", "70.198", "9.698", "18.790"], "certa": 0, "explicacao": "a) 78.901"}, {"enunciado": "A conta de luz custava R$ 200 e teve um aumento de 10%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 180", "R$ 240", "R$ 210", "R$ 20", "R$ 220"], "certa": 4, "explicacao": "e) R$ 220"}, {"enunciado": "O que quer dizer <b>classe</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada número que se soma numa adição", "a coisa toda, sem faltar nenhuma parte", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "o número que vem logo antes", "a sala de aula"], "certa": 2, "explicacao": "c) cada grupo de 3 ordens de um número: unidades, milhares, milhões. Não é “a sala de aula”: essa é a pegadinha."}, {"enunciado": "O termômetro marcava 31 °C e a temperatura caiu 5 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["36 °C", "26 °C", "31 °C", "25 °C", "5 °C"], "certa": 1, "explicacao": "b) 26 °C"}, {"enunciado": "Simplifique <span class=\"fr\"><span>18</span><span>45</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>45</span></span>", "<span class=\"fr\"><span>6</span><span>15</span></span>", "<span class=\"fr\"><span>2</span><span>15</span></span>", "<span class=\"fr\"><span>5</span><span>2</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>2</span><span>5</span></span>"}, {"enunciado": "Numa caixa há 6 bolas pretas e 1 bola vermelha. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>1</span></span>", "<span class=\"fr\"><span>7</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>6</span><span>7</span></span>"}, {"enunciado": "O jogo começou às 16h22 e durou 3h46. A que horas terminou? Responda com a letra.", "alternativas": ["19h08", "20h22", "12h36", "19h68", "20h08"], "certa": 4, "explicacao": "e) 20h08"}, {"enunciado": "Leia: “Em <span class=\"fr\"><span>3</span><span>8</span></span>, o denominador é 8.” Nessa frase, <b>denominador</b> quer dizer… Responda com a letra.", "alternativas": ["três vezes o número", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o número de cima da fração", "cada uma das 1.000 partes iguais de um inteiro", "quantas vezes algo aparece"], "certa": 1, "explicacao": "b) o número de baixo da fração: em quantas partes iguais o inteiro foi dividido. Não é “o número de cima da fração”: essa é a pegadinha."}, {"enunciado": "Complete: 3.876 m = <span class=\"caixa\"></span> km. Responda com a letra.", "alternativas": ["3.876.000", "387,6", "3,876", "38,76", "3.876"], "certa": 2, "explicacao": "c) 3,876"}, {"enunciado": "Quanto é 30% de 40? Responda com a letra.", "alternativas": ["12", "28", "1.200", "10", "120"], "certa": 0, "explicacao": "a) 12"}, {"enunciado": "Quanto vale o algarismo destacado em 1<span class=\"dest\">5</span>4.623? Responda com a letra.", "alternativas": ["500.000", "5.000", "5", "54.623", "50.000"], "certa": 4, "explicacao": "e) 50.000"}, {"enunciado": "Um chocolate foi dividido em 11 pedaços iguais e 5 foram comidos. Que fração do chocolate foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>11</span></span>", "<span class=\"fr\"><span>5</span><span>16</span></span>", "<span class=\"fr\"><span>11</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>11</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>5</span><span>11</span></span>"}, {"enunciado": "Leia: “O tênis de R$ 200 teve R$ 50 de desconto e saiu por R$ 150.” Nessa frase, <b>desconto</b> quer dizer… Responda com a letra.", "alternativas": ["o preço que se paga no fim", "cada uma das 1.000 partes iguais de um inteiro", "quantas vezes algo aparece", "o valor que se tira do preço", "que vale o mesmo"], "certa": 3, "explicacao": "d) o valor que se tira do preço. Não é “o preço que se paga no fim”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? 8 × <span class=\"caixa\"></span> = 88 Responda com a letra.", "alternativas": ["704", "80", "88", "11", "12"], "certa": 3, "explicacao": "d) 11"}, {"enunciado": "Numa caixa há 4 bolas pretas e 9 bolas vermelhas. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>13</span></span>", "<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>9</span><span>13</span></span>", "<span class=\"fr\"><span>13</span><span>4</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>4</span><span>13</span></span>"}, {"enunciado": "Quanto é 22.418 + 18.673? Responda com a letra.", "alternativas": ["30.081", "41.091", "41.181", "3.745", "31.010.811"], "certa": 1, "explicacao": "b) 41.091"}, {"enunciado": "Um retângulo de 4 cm por 5 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["20 cm²", "180 cm²", "54 cm", "60 cm²", "180 cm"], "certa": 1, "explicacao": "b) 180 cm²"}, {"enunciado": "Leia: “A operação inversa de somar 15 é subtrair 15.” Nessa frase, <b>operação inversa</b> quer dizer… Responda com a letra.", "alternativas": ["a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "quando os dois lados do sinal = valem o mesmo", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "a mesma conta feita de novo", "do menor para o maior"], "certa": 0, "explicacao": "a) a conta que desfaz a outra: − desfaz +, ÷ desfaz ×. Não é “a mesma conta feita de novo”: essa é a pegadinha."}, {"enunciado": "Como se escreve “seiscentos e dezesseis mil e sessenta” com algarismos? Responda com a letra.", "alternativas": ["616.000.060", "616.060", "61.660", "60.616", "616.600"], "certa": 1, "explicacao": "b) 616.060"}, {"enunciado": "Quanto é <span class=\"fr\"><span>4</span><span>5</span></span> de 20? Responda com a letra.", "alternativas": ["8", "25", "80", "4", "16"], "certa": 4, "explicacao": "e) 16"}, {"enunciado": "Como se escreve “oito inteiros e um centésimo” com algarismos? Responda com a letra.", "alternativas": ["8,1", "8,01", "8,0001", "8,001", "9,01"], "certa": 1, "explicacao": "b) 8,01"}, {"enunciado": "Quanto é 7 × 6 − 3 × 5? Responda com a letra.", "alternativas": ["105", "195", "27", "24", "34"], "certa": 2, "explicacao": "c) 27"}, {"enunciado": "O que quer dizer <b>sentido horário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a hora que o relógio marca", "perto de, mais ou menos", "cada uma das 10 partes iguais de um inteiro", "o mesmo sentido em que giram os ponteiros do relógio", "o que sobra numa divisão que não é exata"], "certa": 3, "explicacao": "d) o mesmo sentido em que giram os ponteiros do relógio. Não é “a hora que o relógio marca”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
