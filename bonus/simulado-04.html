<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quantos lados tem um pentágono? Responda com a letra.", "alternativas": ["4", "7", "10", "6", "5"], "certa": 4, "explicacao": "e) 5"}, {"enunciado": "Bianca tem 6 camisetas e 7 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["84", "42", "41", "13", "7"], "certa": 1, "explicacao": "b) 42"}, {"enunciado": "Quanto é 40% de 105? Responda com a letra.", "alternativas": ["420", "4.200", "42", "63", "145"], "certa": 2, "explicacao": "c) 42"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>20</span><span>8</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["3 <span class=\"fr\"><span>4</span><span>8</span></span>", "4 <span class=\"fr\"><span>2</span><span>8</span></span>", "2 <span class=\"fr\"><span>4</span><span>9</span></span>", "2 <span class=\"fr\"><span>4</span><span>8</span></span>", "2 <span class=\"fr\"><span>4</span><span>20</span></span>"], "certa": 3, "explicacao": "d) 2 <span class=\"fr\"><span>4</span><span>8</span></span>"}, {"enunciado": "O que quer dizer <b>denominador</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["três vezes o número", "a medida do contorno de uma figura", "a linha onde duas faces de um sólido se encontram", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o número de cima da fração"], "certa": 3, "explicacao": "d) o número de baixo da fração: em quantas partes iguais o inteiro foi dividido. Não é “o número de cima da fração”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>47</span><span>9</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["5 <span class=\"fr\"><span>2</span><span>9</span></span>", "2 <span class=\"fr\"><span>5</span><span>9</span></span>", "5 <span class=\"fr\"><span>2</span><span>47</span></span>", "6 <span class=\"fr\"><span>2</span><span>9</span></span>", "5 <span class=\"fr\"><span>7</span><span>9</span></span>"], "certa": 0, "explicacao": "a) 5 <span class=\"fr\"><span>2</span><span>9</span></span>"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["7.289", "9.782", "15.411", "14.103", "9.287"], "certa": 0, "explicacao": "a) 7.289"}, {"enunciado": "Complete: 37,1 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["0,0371", "37,1", "371.000", "37.100", "3.710"], "certa": 3, "explicacao": "d) 37.100"}, {"enunciado": "O termômetro marcava 21 °C e a temperatura subiu 10 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["11 °C", "32 °C", "21 °C", "10 °C", "31 °C"], "certa": 4, "explicacao": "e) 31 °C"}, {"enunciado": "O que quer dizer <b>inteiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a linha onde duas faces de um sólido se encontram", "o resultado da subtração", "a coisa toda, sem faltar nenhuma parte", "um número muito grande", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido"], "certa": 2, "explicacao": "c) a coisa toda, sem faltar nenhuma parte. Não é “um número muito grande”: essa é a pegadinha."}, {"enunciado": "Qual fração é equivalente a <span class=\"fr\"><span>4</span><span>5</span></span> (vale o mesmo)? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>12</span><span>15</span></span>", "<span class=\"fr\"><span>7</span><span>8</span></span>", "<span class=\"fr\"><span>12</span><span>5</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>12</span><span>15</span></span>"}, {"enunciado": "A passagem de ônibus do mês custava R$ 340 e teve um aumento de 30%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 442", "R$ 544", "R$ 370", "R$ 102", "R$ 238"], "certa": 0, "explicacao": "a) R$ 442"}, {"enunciado": "Quanto é 134.463 ÷ 19? Responda com a letra.", "alternativas": ["7.077", "707", "7.770", "70.077", "777"], "certa": 0, "explicacao": "a) 7.077"}, {"enunciado": "Uma parede foi dividida em 5 partes iguais e 4 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "Leia: “Pela estimativa, 4.980 + 3.020 dá perto de 8.000.” Nessa frase, <b>estimativa</b> quer dizer… Responda com a letra.", "alternativas": ["cada um dos símbolos de 0 a 9 que usamos para escrever os números", "um valor aproximado, calculado de cabeça", "o resultado exato da conta", "quanto tempo algo dura, do começo ao fim", "o par de números que diz onde um ponto está"], "certa": 1, "explicacao": "b) um valor aproximado, calculado de cabeça. Não é “o resultado exato da conta”: essa é a pegadinha."}, {"enunciado": "Entre as frações <span class=\"fr\"><span>1</span><span>3</span></span>, <span class=\"fr\"><span>1</span><span>10</span></span>, <span class=\"fr\"><span>1</span><span>5</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span> e <span class=\"fr\"><span>1</span><span>9</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>10</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>3</span></span>"}, {"enunciado": "Quantos cubinhos enchem uma caixa de 4 cubinhos de comprimento, 5 de largura e 7 de altura? Responda com a letra.", "alternativas": ["140", "120", "166", "20", "16"], "certa": 0, "explicacao": "a) 140"}, {"enunciado": "A turma votou na cor preferida. Resultado — azul, 3; roxo, 15; verde, 17; amarelo, 20. Quantos alunos votaram? Responda com a letra.", "alternativas": ["52", "4", "20", "55", "65"], "certa": 3, "explicacao": "d) 55"}, {"enunciado": "Qual destes números é o maior? 0,187, 0,246, 0,29, 0,244 e 0,3 Responda com a letra.", "alternativas": ["0,246", "0,3", "0,244", "0,29", "0,187"], "certa": 1, "explicacao": "b) 0,3"}, {"enunciado": "Leia: “Em 25 ÷ 4, o quociente é 6 e o resto é 1.” Nessa frase, <b>quociente</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da divisão", "o segmento que liga dois vértices que não são vizinhos", "o par de números que diz onde um ponto está", "as informações que juntamos numa pesquisa", "o que sobra na divisão"], "certa": 0, "explicacao": "a) o resultado da divisão. Não é “o que sobra na divisão”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 2 bolas verdes e 5 bolas vermelhas. Tirando uma sem olhar, qual é a chance de sair verde? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>2</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>7</span><span>2</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>7</span></span>"}, {"enunciado": "2 cadernos custam R$ 28. Quanto custam 7 cadernos iguais? Responda com a letra.", "alternativas": ["R$ 33", "R$ 196", "R$ 98", "R$ 35", "R$ 14"], "certa": 2, "explicacao": "c) R$ 98"}, {"enunciado": "Quanto é 80,73 ÷ 1.000? Responda com a letra.", "alternativas": ["0,8073", "80,73", "0,08073", "80.730", "0,008073"], "certa": 2, "explicacao": "c) 0,08073"}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> + 59 = 124 Responda com a letra.", "alternativas": ["183", "124", "65", "75", "59"], "certa": 2, "explicacao": "c) 65"}, {"enunciado": "Leia: “O total da compra foi R$ 45.” Nessa frase, <b>total</b> quer dizer… Responda com a letra.", "alternativas": ["uma das partes", "o resultado de juntar tudo", "que cruza outra reta formando um ângulo reto", "cada uma das 1.000 partes iguais de um inteiro", "cada resultado que pode acontecer"], "certa": 1, "explicacao": "b) o resultado de juntar tudo. Não é “uma das partes”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (2, 9)? Responda com a letra.", "alternativas": ["2 para a direita e 9 para baixo", "2 para a direita e 9 para cima", "11 para a direita", "9 para a direita e 2 para cima", "2 para a esquerda e 9 para baixo"], "certa": 1, "explicacao": "b) 2 para a direita e 9 para cima"}, {"enunciado": "Pensei num número, multipliquei por 3 e tirei 3. Deu 42. Em que número pensei? Responda com a letra.", "alternativas": ["129", "14", "45", "13", "15"], "certa": 4, "explicacao": "e) 15"}, {"enunciado": "Qual é a área de um retângulo de 11 m por 17 m? Responda com a letra.", "alternativas": ["187 m²", "187 m", "374 m²", "56 m", "28 m²"], "certa": 0, "explicacao": "a) 187 m²"}, {"enunciado": "Felipe quer comprar um fone de R$ 45 e guarda R$ 15 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["3", "4", "30", "60", "675"], "certa": 0, "explicacao": "a) 3"}, {"enunciado": "O que quer dizer <b>conversão</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["uma parte de cada 100", "a mudança do tamanho da medida", "o dinheiro que volta quando se paga mais que o preço", "cada número que se soma numa adição", "a troca de uma unidade por outra, sem mudar a medida"], "certa": 4, "explicacao": "e) a troca de uma unidade por outra, sem mudar a medida. Não é “a mudança do tamanho da medida”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
