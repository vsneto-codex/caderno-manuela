<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Saindo do ponto (1, 4), ande 2 para a direita e 1 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(3, 5)", "(4, 4)", "(2, 6)", "(3, 4)", "(5, 3)"], "certa": 0, "explicacao": "a) (3, 5)"}, {"enunciado": "Bianca tem 6 camisetas e 7 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["84", "42", "41", "13", "7"], "certa": 1, "explicacao": "b) 42"}, {"enunciado": "Quanto é 40% de 105? Responda com a letra.", "alternativas": ["420", "4.200", "42", "63", "145"], "certa": 2, "explicacao": "c) 42"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>20</span><span>8</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["3 <span class=\"fr\"><span>4</span><span>8</span></span>", "4 <span class=\"fr\"><span>2</span><span>8</span></span>", "2 <span class=\"fr\"><span>4</span><span>9</span></span>", "2 <span class=\"fr\"><span>4</span><span>8</span></span>", "2 <span class=\"fr\"><span>4</span><span>20</span></span>"], "certa": 3, "explicacao": "d) 2 <span class=\"fr\"><span>4</span><span>8</span></span>"}, {"enunciado": "O que quer dizer <b>denominador</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número com uma parte inteira e uma fração", "a medida do contorno de uma figura", "a linha onde duas faces de um sólido se encontram", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o número de cima da fração"], "certa": 3, "explicacao": "d) o número de baixo da fração: em quantas partes iguais o inteiro foi dividido. Não é “o número de cima da fração”: essa é a pegadinha."}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>2</span><span>12</span></span>, <span class=\"fr\"><span>2</span><span>7</span></span>, <span class=\"fr\"><span>2</span><span>3</span></span>, <span class=\"fr\"><span>2</span><span>9</span></span> e <span class=\"fr\"><span>2</span><span>8</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>9</span></span>", "<span class=\"fr\"><span>2</span><span>7</span></span>", "<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>12</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>2</span><span>3</span></span>"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["78.495", "58.947", "47.958", "9.786", "48.579"], "certa": 0, "explicacao": "a) 78.495"}, {"enunciado": "A festa começou às 8h40 e durou 3h37. A que horas terminou? Responda com a letra.", "alternativas": ["12h17", "12h40", "11h17", "11h77", "5h03"], "certa": 0, "explicacao": "a) 12h17"}, {"enunciado": "De manhã fazia 15 °C. À tarde, 28 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["28 °C", "43 °C", "15 °C", "14 °C", "13 °C"], "certa": 4, "explicacao": "e) 13 °C"}, {"enunciado": "O que quer dizer <b>escala</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o ponto onde dois lados (ou arestas) se encontram", "a troca de uma unidade por outra, sem mudar a medida", "quando os dois lados do sinal = valem o mesmo", "quantas vezes o desenho é maior ou menor que o tamanho real", "uma escada pequena"], "certa": 3, "explicacao": "d) quantas vezes o desenho é maior ou menor que o tamanho real. Não é “uma escada pequena”: essa é a pegadinha."}, {"enunciado": "Qual fração é equivalente a <span class=\"fr\"><span>4</span><span>5</span></span> (vale o mesmo)? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>10</span></span>", "<span class=\"fr\"><span>4</span><span>10</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>", "<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>8</span><span>5</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>8</span><span>10</span></span>"}, {"enunciado": "Uma jaqueta custa R$ 44 e está com 25% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 22", "R$ 33", "R$ 11", "R$ 19", "R$ 55"], "certa": 1, "explicacao": "b) R$ 33"}, {"enunciado": "Quanto é 134.463 ÷ 19? Responda com a letra.", "alternativas": ["7.077", "707", "7.770", "70.077", "777"], "certa": 0, "explicacao": "a) 7.077"}, {"enunciado": "Uma parede foi dividida em 5 partes iguais e 4 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "Leia: “Pela estimativa, 4.980 + 3.020 dá perto de 8.000.” Nessa frase, <b>estimativa</b> quer dizer… Responda com a letra.", "alternativas": ["cada um dos símbolos de 0 a 9 que usamos para escrever os números", "um valor aproximado, calculado de cabeça", "o resultado exato da conta", "quanto uma medida mudou", "o par de números que diz onde um ponto está"], "certa": 1, "explicacao": "b) um valor aproximado, calculado de cabeça. Não é “o resultado exato da conta”: essa é a pegadinha."}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>1</span><span>3</span></span>, <span class=\"fr\"><span>1</span><span>10</span></span>, <span class=\"fr\"><span>1</span><span>5</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span> e <span class=\"fr\"><span>1</span><span>9</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>10</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>3</span></span>"}, {"enunciado": "Quantos cubinhos enchem uma caixa de 4 cubinhos de comprimento, 5 de largura e 7 de altura? Responda com a letra.", "alternativas": ["140", "120", "166", "20", "16"], "certa": 0, "explicacao": "a) 140"}, {"enunciado": "A turma votou na cor preferida. Resultado — azul, 3; roxo, 15; verde, 17; amarelo, 20. Quantos alunos votaram? Responda com a letra.", "alternativas": ["52", "4", "20", "55", "65"], "certa": 3, "explicacao": "d) 55"}, {"enunciado": "Qual destes números é o maior? 0,187, 0,246, 0,29, 0,244 e 0,3 Responda com a letra.", "alternativas": ["0,246", "0,3", "0,244", "0,29", "0,187"], "certa": 1, "explicacao": "b) 0,3"}, {"enunciado": "Leia: “A probabilidade de sair 6 num dado é <span class=\"fr\"><span>1</span><span>6</span></span>.” Nessa frase, <b>probabilidade</b> quer dizer… Responda com a letra.", "alternativas": ["a chance de algo acontecer", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o plano do dinheiro que entra e do que vai ser gasto", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "a certeza de que vai acontecer"], "certa": 0, "explicacao": "a) a chance de algo acontecer. Não é “a certeza de que vai acontecer”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 1 bola azul e 4 bolas pretas. Tirando uma sem olhar, qual é a chance de sair azul? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "5 lápis custam R$ 65. Quanto custam 3 lápis iguais? Responda com a letra.", "alternativas": ["R$ 68", "R$ 13", "R$ 63", "R$ 195", "R$ 39"], "certa": 4, "explicacao": "e) R$ 39"}, {"enunciado": "Quanto é 94,52 × 10? Responda com a letra.", "alternativas": ["94,52", "945,2", "9.452", "94,520", "9,452"], "certa": 1, "explicacao": "b) 945,2"}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> ÷ 3 = 3 Responda com a letra.", "alternativas": ["1", "9", "6", "12", "3"], "certa": 1, "explicacao": "b) 9"}, {"enunciado": "Leia: “Em 25 ÷ 4 = 6, o resto é 1.” Nessa frase, <b>resto</b> quer dizer… Responda com a letra.", "alternativas": ["o mesmo sentido em que giram os ponteiros do relógio", "o resultado de juntar tudo", "o resultado da divisão", "o que sobra numa divisão que não é exata", "o resultado da multiplicação"], "certa": 3, "explicacao": "d) o que sobra numa divisão que não é exata. Não é “o resultado da divisão”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (7, 2)? Responda com a letra.", "alternativas": ["7 para a esquerda e 2 para baixo", "7 para a direita e 2 para cima", "7 para a direita e 2 para baixo", "9 para a direita", "2 para a direita e 7 para cima"], "certa": 1, "explicacao": "b) 7 para a direita e 2 para cima"}, {"enunciado": "Pensei num número, multipliquei por 2 e tirei 12. Deu 48. Em que número pensei? Responda com a letra.", "alternativas": ["108", "18", "24", "30", "60"], "certa": 3, "explicacao": "d) 30"}, {"enunciado": "Qual é a área de um retângulo de 6 cm por 14 cm? Responda com a letra.", "alternativas": ["20 cm²", "168 cm²", "84 cm", "84 cm²", "40 cm"], "certa": 3, "explicacao": "d) 84 cm²"}, {"enunciado": "Uma jaqueta custa R$ 500 e está com 30% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 650", "R$ 470", "R$ 150", "R$ 200", "R$ 350"], "certa": 4, "explicacao": "e) R$ 350"}, {"enunciado": "Leia: “Comprou por R$ 20 e vendeu por R$ 35: o lucro foi de R$ 15.” Nessa frase, <b>lucro</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 2 partes iguais de um inteiro", "o resultado de juntar tudo", "o que se ganha a mais: o preço de venda menos o que custou", "todo o dinheiro recebido na venda", "o resultado da subtração"], "certa": 2, "explicacao": "c) o que se ganha a mais: o preço de venda menos o que custou. Não é “todo o dinheiro recebido na venda”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
