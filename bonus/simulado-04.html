<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 4 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Um retângulo de 5 cm por 6 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["120 cm", "30 cm²", "44 cm", "60 cm²", "120 cm²"], "certa": 4, "explicacao": "e) 120 cm²"}, {"enunciado": "Uma lanchonete tem 3 tipos de pão, 4 de recheio e 2 de suco. Quantos lanches diferentes dá para montar com 1 pão, 1 recheio e 1 suco? Responda com a letra.", "alternativas": ["24", "23", "12", "9", "14"], "certa": 0, "explicacao": "a) 24"}, {"enunciado": "Quanto é 40% de 105? Responda com a letra.", "alternativas": ["420", "4.200", "42", "63", "145"], "certa": 2, "explicacao": "c) 42"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>20</span><span>8</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["3 <span class=\"fr\"><span>4</span><span>8</span></span>", "4 <span class=\"fr\"><span>2</span><span>8</span></span>", "2 <span class=\"fr\"><span>4</span><span>9</span></span>", "2 <span class=\"fr\"><span>4</span><span>8</span></span>", "2 <span class=\"fr\"><span>4</span><span>20</span></span>"], "certa": 3, "explicacao": "d) 2 <span class=\"fr\"><span>4</span><span>8</span></span>"}, {"enunciado": "O que quer dizer <b>coordenadas</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número com uma parte inteira e uma fração", "a medida do contorno de uma figura", "a linha onde duas faces de um sólido se encontram", "o par de números que diz onde um ponto está", "as cores de um mapa"], "certa": 3, "explicacao": "d) o par de números que diz onde um ponto está. Não é “as cores de um mapa”: essa é a pegadinha."}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>2</span><span>12</span></span>, <span class=\"fr\"><span>2</span><span>7</span></span>, <span class=\"fr\"><span>2</span><span>3</span></span>, <span class=\"fr\"><span>2</span><span>9</span></span> e <span class=\"fr\"><span>2</span><span>8</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>9</span></span>", "<span class=\"fr\"><span>2</span><span>7</span></span>", "<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>12</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>2</span><span>3</span></span>"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["14.811", "5.201", "5.210", "19.016", "5.120"], "certa": 4, "explicacao": "e) 5.120"}, {"enunciado": "Qual é a área de um retângulo de 16 cm por 10 cm? Responda com a letra.", "alternativas": ["52 cm", "26 cm²", "160 cm²", "320 cm²", "160 cm"], "certa": 2, "explicacao": "c) 160 cm²"}, {"enunciado": "O termômetro marcava 34 °C e a temperatura caiu 9 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["25 °C", "9 °C", "24 °C", "43 °C", "34 °C"], "certa": 0, "explicacao": "a) 25 °C"}, {"enunciado": "Leia: “O número 305 tem três algarismos: 3, 0 e 5.” Nessa frase, <b>algarismos</b> quer dizer… Responda com a letra.", "alternativas": ["quando os dois lados do sinal = valem o mesmo", "a medida de uma ponta à outra", "as informações que juntamos numa pesquisa", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "o mesmo que número"], "certa": 3, "explicacao": "d) cada um dos símbolos de 0 a 9 que usamos para escrever os números. Não é “o mesmo que número”: essa é a pegadinha."}, {"enunciado": "Simplifique <span class=\"fr\"><span>6</span><span>24</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>24</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>1</span></span>", "<span class=\"fr\"><span>3</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "A conta de luz custava R$ 220 e teve um aumento de 25%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 330", "R$ 275", "R$ 245", "R$ 165", "R$ 55"], "certa": 1, "explicacao": "b) R$ 275"}, {"enunciado": "Quanto é 96.080 ÷ 20? Responda com a letra.", "alternativas": ["48.004", "4.840", "4.804", "480", "484"], "certa": 2, "explicacao": "c) 4.804"}, {"enunciado": "Um chocolate foi dividido em 12 pedaços iguais e 11 foram comidos. Que fração do chocolate foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>11</span><span>23</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>12</span><span>11</span></span>", "<span class=\"fr\"><span>11</span><span>1</span></span>", "<span class=\"fr\"><span>11</span><span>12</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>11</span><span>12</span></span>"}, {"enunciado": "Leia: “Em 25 ÷ 4 = 6, o resto é 1.” Nessa frase, <b>resto</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 1.000 partes iguais de um inteiro", "o que sobra numa divisão que não é exata", "duas vezes o número", "o plano do dinheiro que entra e do que vai ser gasto", "o resultado da divisão"], "certa": 1, "explicacao": "b) o que sobra numa divisão que não é exata. Não é “o resultado da divisão”: essa é a pegadinha."}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>6</span></span>, <span class=\"fr\"><span>1</span><span>11</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span> e <span class=\"fr\"><span>1</span><span>3</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>11</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>3</span></span>"}, {"enunciado": "Quantos cubinhos enchem uma caixa de 2 cubinhos de comprimento, 4 de largura e 5 de altura? Responda com a letra.", "alternativas": ["76", "40", "11", "8", "32"], "certa": 1, "explicacao": "b) 40"}, {"enunciado": "A turma votou no animal preferido. Resultado — cachorro, 10; coelho, 15; gato, 19. Quantos alunos votaram? Responda com a letra.", "alternativas": ["34", "19", "54", "3", "44"], "certa": 4, "explicacao": "e) 44"}, {"enunciado": "Qual destes números é o maior? 4,15, 4,22, 4,139, 4,263 e 4,3 Responda com a letra.", "alternativas": ["4,22", "4,139", "4,3", "4,263", "4,15"], "certa": 2, "explicacao": "c) 4,3"}, {"enunciado": "Leia: “O produto de 6 por 4 é 24.” Nessa frase, <b>produto</b> quer dizer… Responda com a letra.", "alternativas": ["o par de números que diz onde um ponto está", "o número de cima da fração: quantas partes foram pegas", "o resultado da multiplicação", "cada número que se multiplica", "a medida do contorno de uma figura"], "certa": 2, "explicacao": "c) o resultado da multiplicação. Não é “cada número que se multiplica”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 6 bolas amarelas e 9 bolas azuis. Tirando uma sem olhar, qual é a chance de sair amarela? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>9</span></span>", "<span class=\"fr\"><span>15</span><span>6</span></span>", "<span class=\"fr\"><span>9</span><span>15</span></span>", "<span class=\"fr\"><span>1</span><span>15</span></span>", "<span class=\"fr\"><span>6</span><span>15</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>6</span><span>15</span></span>"}, {"enunciado": "9 figurinhas custam R$ 63. Quanto custam 3 figurinhas iguais? Responda com a letra.", "alternativas": ["R$ 7", "R$ 66", "R$ 57", "R$ 189", "R$ 21"], "certa": 4, "explicacao": "e) R$ 21"}, {"enunciado": "Quanto é 9,51 × 4? Responda com a letra.", "alternativas": ["3.804", "380,4", "38,04", "3,804", "36,204"], "certa": 2, "explicacao": "c) 38,04"}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> ÷ 6 = 10 Responda com a letra.", "alternativas": ["10", "16", "66", "4", "60"], "certa": 4, "explicacao": "e) 60"}, {"enunciado": "O que quer dizer <b>vértice</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o meio de um lado", "o ponto onde dois lados (ou arestas) se encontram", "um valor aproximado, calculado de cabeça", "o plano do dinheiro que entra e do que vai ser gasto", "um número com uma parte inteira e uma fração"], "certa": 1, "explicacao": "b) o ponto onde dois lados (ou arestas) se encontram. Não é “o meio de um lado”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (2, 8)? Responda com a letra.", "alternativas": ["2 para a esquerda e 8 para baixo", "8 para a direita e 2 para cima", "2 para a direita e 8 para baixo", "10 para a direita", "2 para a direita e 8 para cima"], "certa": 4, "explicacao": "e) 2 para a direita e 8 para cima"}, {"enunciado": "Pensei num número, somei 19 e dividi o resultado por 4. Deu 15. Em que número pensei? Responda com a letra.", "alternativas": ["79", "49", "34", "41", "60"], "certa": 3, "explicacao": "d) 41"}, {"enunciado": "Qual é o perímetro de um retângulo de 16 m por 13 m? Responda com a letra.", "alternativas": ["208 m²", "58 m²", "58 m", "29 m", "45 m"], "certa": 2, "explicacao": "c) 58 m"}, {"enunciado": "Quanto é 30% de 180? Responda com a letra.", "alternativas": ["150", "6", "54", "126", "5.400"], "certa": 2, "explicacao": "c) 54"}, {"enunciado": "O que quer dizer <b>inteiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quando os dois lados do sinal = valem o mesmo", "um valor aproximado, calculado de cabeça", "cada uma das 10 partes iguais de um inteiro", "um número muito grande", "a coisa toda, sem faltar nenhuma parte"], "certa": 4, "explicacao": "e) a coisa toda, sem faltar nenhuma parte. Não é “um número muito grande”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
