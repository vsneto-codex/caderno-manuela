<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 922 × 57? Responda com a letra.", "alternativas": ["52.554", "46.100", "5.344", "11.064", "6.454"], "certa": 0, "explicacao": "a) 52.554"}, {"enunciado": "Quanto é 50% de 52? Responda com a letra.", "alternativas": ["26", "102", "260", "2", "2.600"], "certa": 0, "explicacao": "a) 26"}, {"enunciado": "Quanto é 4.200 × 300? Responda com a letra.", "alternativas": ["12.600", "1.260.000", "126", "126.000", "12.600.000"], "certa": 1, "explicacao": "b) 1.260.000"}, {"enunciado": "Pensei num número, multipliquei por 6 e tirei 5. Deu 133. Em que número pensei? Responda com a letra.", "alternativas": ["127", "23", "138", "798", "803"], "certa": 1, "explicacao": "b) 23"}, {"enunciado": "O que quer dizer <b>comprimento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número que vem logo antes", "o ponto onde dois lados (ou arestas) se encontram", "o peso de um objeto", "o resultado de juntar tudo", "a medida de uma ponta à outra"], "certa": 4, "explicacao": "e) a medida de uma ponta à outra. Não é “o peso de um objeto”: essa é a pegadinha."}, {"enunciado": "Quanto é (13 + 9) × 3? Responda com a letra.", "alternativas": ["25", "88", "48", "66", "40"], "certa": 3, "explicacao": "d) 66"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 5; amarelo, 16; verde, 17. Quantos alunos votaram? Responda com a letra.", "alternativas": ["3", "17", "33", "48", "38"], "certa": 4, "explicacao": "e) 38"}, {"enunciado": "Quanto é 91,76 ÷ 1.000? Responda com a letra.", "alternativas": ["0,009176", "91,76", "0,09176", "91.760", "0,9176"], "certa": 2, "explicacao": "c) 0,09176"}, {"enunciado": "8 lápis custam R$ 120. Quanto custam 2 lápis iguais? Responda com a letra.", "alternativas": ["R$ 240", "R$ 30", "R$ 15", "R$ 114", "R$ 122"], "certa": 1, "explicacao": "b) R$ 30"}, {"enunciado": "Leia: “Na partilha das 12 balas, cada um dos 3 irmãos ficou com 4.” Nessa frase, <b>partilha</b> quer dizer… Responda com a letra.", "alternativas": ["a soma de várias partes", "um número que está na tabuada de outro", "a divisão de alguma coisa entre pessoas", "perto de, mais ou menos", "cada uma das 1.000 partes iguais de um inteiro"], "certa": 2, "explicacao": "c) a divisão de alguma coisa entre pessoas. Não é “a soma de várias partes”: essa é a pegadinha."}, {"enunciado": "Complete: 6,66 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["0,00666", "6.660", "66.600", "66,6", "666"], "certa": 1, "explicacao": "b) 6.660"}, {"enunciado": "Quanto é 7.248 ÷ 24? Responda com a letra.", "alternativas": ["320", "30", "3.002", "32", "302"], "certa": 4, "explicacao": "e) 302"}, {"enunciado": "Quanto é 68.957 + 26.573? Responda com a letra.", "alternativas": ["84.420", "814.141.210", "95.620", "95.530", "42.384"], "certa": 3, "explicacao": "d) 95.530"}, {"enunciado": "Bianca tem 7 camisetas e 4 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["27", "7", "28", "56", "11"], "certa": 2, "explicacao": "c) 28"}, {"enunciado": "O que quer dizer <b>lucro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a troca de uma unidade por outra, sem mudar a medida", "todo o dinheiro recebido na venda", "um número que está na tabuada de outro", "um valor aproximado, calculado de cabeça", "o que se ganha a mais: o preço de venda menos o que custou"], "certa": 4, "explicacao": "e) o que se ganha a mais: o preço de venda menos o que custou. Não é “todo o dinheiro recebido na venda”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>1875</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["1875,1000", "1.875", "1,875", "18,75", "0,1875"], "certa": 2, "explicacao": "c) 1,875"}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>4</span><span>5</span></span>, <span class=\"fr\"><span>4</span><span>11</span></span>, <span class=\"fr\"><span>4</span><span>15</span></span>, <span class=\"fr\"><span>4</span><span>10</span></span> e <span class=\"fr\"><span>4</span><span>7</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>4</span><span>10</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>11</span></span>", "<span class=\"fr\"><span>4</span><span>15</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "Uma parede foi dividida em 6 partes iguais e 5 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>11</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>5</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>5</span><span>6</span></span>"}, {"enunciado": "Saindo do ponto (2, 2), ande 4 para a direita e 2 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(4, 2)", "(8, 2)", "(6, 2)", "(4, 6)", "(6, 4)"], "certa": 4, "explicacao": "e) (6, 4)"}, {"enunciado": "O que quer dizer <b>crescente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["do menor para o maior", "o mesmo sentido em que giram os ponteiros do relógio", "que aumenta ou diminui na mesma medida", "o que sobra numa divisão que não é exata", "do maior para o menor"], "certa": 0, "explicacao": "a) do menor para o maior. Não é “do maior para o menor”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 5 bolas amarelas e 4 bolas azuis. Tirando uma sem olhar, qual é a chance de sair amarela? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>9</span></span>", "<span class=\"fr\"><span>5</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>5</span><span>9</span></span>"}, {"enunciado": "Quantos vértices tem um prisma de base hexagonal? Responda com a letra.", "alternativas": ["13", "11", "8", "18", "12"], "certa": 4, "explicacao": "e) 12"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>11</span><span>8</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["1 <span class=\"fr\"><span>5</span><span>8</span></span>", "1 <span class=\"fr\"><span>3</span><span>8</span></span>", "1 <span class=\"fr\"><span>3</span><span>11</span></span>", "3 <span class=\"fr\"><span>1</span><span>8</span></span>", "2 <span class=\"fr\"><span>3</span><span>8</span></span>"], "certa": 1, "explicacao": "b) 1 <span class=\"fr\"><span>3</span><span>8</span></span>"}, {"enunciado": "A turma votou no animal preferido. Resultado — cachorro, 24; peixe, 12; coelho, 13. Quantos votos coelho teve a mais que peixe? Responda com a letra.", "alternativas": ["2", "12", "13", "1", "25"], "certa": 3, "explicacao": "d) 1"}, {"enunciado": "O que quer dizer <b>centésimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número 100", "o segmento que liga dois vértices que não são vizinhos", "cada uma das 100 partes iguais de um inteiro", "a medida de uma ponta à outra", "cada grupo de 3 ordens de um número: unidades, milhares, milhões"], "certa": 2, "explicacao": "c) cada uma das 100 partes iguais de um inteiro. Não é “o número 100”: essa é a pegadinha."}, {"enunciado": "O que quer dizer 75%? Responda com a letra.", "alternativas": ["75 de cada 10", "1 de cada 75", "25 de cada 100", "75 de cada 100", "75 de cada 1.000"], "certa": 3, "explicacao": "d) 75 de cada 100"}, {"enunciado": "Quanto é <span class=\"fr\"><span>2</span><span>7</span></span> + <span class=\"fr\"><span>4</span><span>7</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>14</span></span>", "<span class=\"fr\"><span>8</span><span>7</span></span>", "<span class=\"fr\"><span>6</span><span>7</span></span>", "<span class=\"fr\"><span>6</span><span>49</span></span>", "<span class=\"fr\"><span>2</span><span>7</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>6</span><span>7</span></span>"}, {"enunciado": "A aula de natação começou às 7h10 e durou 3h55. A que horas terminou? Responda com a letra.", "alternativas": ["11h05", "11h10", "10h05", "10h65", "3h15"], "certa": 0, "explicacao": "a) 11h05"}, {"enunciado": "Saindo do ponto (5, 3), ande 4 para a direita e 3 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(12, 3)", "(8, 7)", "(9, 3)", "(6, 9)", "(9, 6)"], "certa": 4, "explicacao": "e) (9, 6)"}, {"enunciado": "Leia: “A diferença entre 50 e 38 é 12.” Nessa frase, <b>diferença</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da divisão", "o resultado da subtração", "cada uma das 10 partes iguais de um inteiro", "uma parte de cada 100", "o resultado da adição"], "certa": 1, "explicacao": "b) o resultado da subtração. Não é “o resultado da adição”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
