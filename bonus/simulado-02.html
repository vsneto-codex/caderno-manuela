<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 922 × 57? Responda com a letra.", "alternativas": ["52.554", "46.100", "5.344", "11.064", "6.454"], "certa": 0, "explicacao": "a) 52.554"}, {"enunciado": "Quanto é 50% de 52? Responda com a letra.", "alternativas": ["26", "102", "260", "2", "2.600"], "certa": 0, "explicacao": "a) 26"}, {"enunciado": "Quanto é 190 × 700? Responda com a letra.", "alternativas": ["1.330.000", "13.300", "133.000", "133", "1.330"], "certa": 2, "explicacao": "c) 133.000"}, {"enunciado": "Pensei num número, multipliquei por 5 e tirei 6. Deu 94. Em que número pensei? Responda com a letra.", "alternativas": ["476", "20", "470", "89", "100"], "certa": 1, "explicacao": "b) 20"}, {"enunciado": "Leia: “O corredor ganhou por três milésimos de segundo: 0,003 s.” Nessa frase, <b>milésimos</b> quer dizer… Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "cada uma das 1.000 partes iguais de um inteiro", "o que sobra numa divisão que não é exata", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o número 1.000"], "certa": 1, "explicacao": "b) cada uma das 1.000 partes iguais de um inteiro. Não é “o número 1.000”: essa é a pegadinha."}, {"enunciado": "Quanto é 8 × 8 − 9 × 3? Responda com a letra.", "alternativas": ["165", "52", "28", "91", "37"], "certa": 4, "explicacao": "e) 37"}, {"enunciado": "A turma votou no animal preferido. Resultado — cachorro, 24; coelho, 17; peixe, 14. Quantos alunos votaram? Responda com a letra.", "alternativas": ["55", "24", "41", "3", "65"], "certa": 0, "explicacao": "a) 55"}, {"enunciado": "Quanto é 7,69 × 6? Responda com a letra.", "alternativas": ["4.614", "42,414", "461,4", "4,614", "46,14"], "certa": 4, "explicacao": "e) 46,14"}, {"enunciado": "3 pães custam R$ 36. Quanto custam 7 pães iguais? Responda com a letra.", "alternativas": ["R$ 43", "R$ 252", "R$ 84", "R$ 40", "R$ 12"], "certa": 2, "explicacao": "c) R$ 84"}, {"enunciado": "O que quer dizer <b>escala</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a troca de uma unidade por outra, sem mudar a medida", "quantas vezes o desenho é maior ou menor que o tamanho real", "um valor aproximado, calculado de cabeça", "uma escada pequena", "um número que está na tabuada de outro"], "certa": 1, "explicacao": "b) quantas vezes o desenho é maior ou menor que o tamanho real. Não é “uma escada pequena”: essa é a pegadinha."}, {"enunciado": "Complete: 3.400 cm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["340", "34", "3.400", "340.000", "0,34"], "certa": 1, "explicacao": "b) 34"}, {"enunciado": "Quanto é 7.248 ÷ 24? Responda com a letra.", "alternativas": ["320", "30", "3.002", "32", "302"], "certa": 4, "explicacao": "e) 302"}, {"enunciado": "Quanto é 68.957 + 26.573? Responda com a letra.", "alternativas": ["84.420", "814.141.210", "95.620", "95.530", "42.384"], "certa": 3, "explicacao": "d) 95.530"}, {"enunciado": "Bianca tem 7 camisetas e 4 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["27", "7", "28", "56", "11"], "certa": 2, "explicacao": "c) 28"}, {"enunciado": "O que quer dizer <b>lucro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a troca de uma unidade por outra, sem mudar a medida", "todo o dinheiro recebido na venda", "um número com uma parte inteira e uma fração", "um número que está na tabuada de outro", "o que se ganha a mais: o preço de venda menos o que custou"], "certa": 4, "explicacao": "e) o que se ganha a mais: o preço de venda menos o que custou. Não é “todo o dinheiro recebido na venda”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>1875</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["1875,1000", "1.875", "1,875", "18,75", "0,1875"], "certa": 2, "explicacao": "c) 1,875"}, {"enunciado": "Entre as frações <span class=\"fr\"><span>4</span><span>5</span></span>, <span class=\"fr\"><span>4</span><span>11</span></span>, <span class=\"fr\"><span>4</span><span>15</span></span>, <span class=\"fr\"><span>4</span><span>10</span></span> e <span class=\"fr\"><span>4</span><span>7</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>4</span><span>10</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>11</span></span>", "<span class=\"fr\"><span>4</span><span>15</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "Uma parede foi dividida em 6 partes iguais e 5 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>11</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>5</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>5</span><span>6</span></span>"}, {"enunciado": "Saindo do ponto (2, 2), ande 4 para a direita e 2 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(4, 2)", "(8, 2)", "(6, 2)", "(4, 6)", "(6, 4)"], "certa": 4, "explicacao": "e) (6, 4)"}, {"enunciado": "O que quer dizer <b>crescente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["do menor para o maior", "o mesmo sentido em que giram os ponteiros do relógio", "quanto uma medida mudou", "o que se ganha a mais: o preço de venda menos o que custou", "do maior para o menor"], "certa": 0, "explicacao": "a) do menor para o maior. Não é “do maior para o menor”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 5 bolas amarelas e 4 bolas azuis. Tirando uma sem olhar, qual é a chance de sair amarela? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>4</span></span>", "<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>9</span></span>", "<span class=\"fr\"><span>5</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>5</span><span>9</span></span>"}, {"enunciado": "Quantos vértices tem uma pirâmide de base pentagonal? Responda com a letra.", "alternativas": ["6", "10", "12", "5", "7"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>29</span><span>5</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["4 <span class=\"fr\"><span>5</span><span>5</span></span>", "5 <span class=\"fr\"><span>4</span><span>5</span></span>", "6 <span class=\"fr\"><span>4</span><span>5</span></span>", "5 <span class=\"fr\"><span>4</span><span>29</span></span>", "5 <span class=\"fr\"><span>1</span><span>5</span></span>"], "certa": 1, "explicacao": "b) 5 <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "A turma votou na cor preferida. Resultado — azul, 3; verde, 19; amarelo, 21. Quantos alunos votaram? Responda com a letra.", "alternativas": ["40", "3", "21", "43", "53"], "certa": 3, "explicacao": "d) 43"}, {"enunciado": "O que quer dizer <b>dobro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número mais 2", "o dinheiro que volta quando se paga mais que o preço", "na Matemática, uma conta com várias operações", "um número com uma parte inteira e uma fração", "duas vezes o número"], "certa": 4, "explicacao": "e) duas vezes o número. Não é “o número mais 2”: essa é a pegadinha."}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 71 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["29%", "71%", "1%", "100%", "7,1%"], "certa": 1, "explicacao": "b) 71%"}, {"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>2</span></span> + <span class=\"fr\"><span>1</span><span>6</span></span>? (A resposta está simplificada.) Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>2</span><span>3</span></span>"}, {"enunciado": "Complete: 973 g = <span class=\"caixa\"></span> kg. Responda com a letra.", "alternativas": ["9,73", "97,3", "0,0973", "973.000", "0,973"], "certa": 4, "explicacao": "e) 0,973"}, {"enunciado": "Quantos vértices tem um quadrilátero? Responda com a letra.", "alternativas": ["4", "6", "5", "3", "8"], "certa": 0, "explicacao": "a) 4"}, {"enunciado": "O que quer dizer <b>dados</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto tempo algo dura, do começo ao fim", "duas vezes o número", "uma parte de cada 100", "as informações que juntamos numa pesquisa", "os cubinhos numerados usados em jogos"], "certa": 3, "explicacao": "d) as informações que juntamos numa pesquisa. Não é “os cubinhos numerados usados em jogos”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
