<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 2,3 + 5,75? Responda com a letra.", "alternativas": ["0,805", "80,5", "598", "5,98", "8,05"], "certa": 4, "explicacao": "e) 8,05"}, {"enunciado": "Arredonde 82.341 para o milhar mais próximo. Responda com a letra.", "alternativas": ["83.000", "82.340", "82.300", "82.000", "80.000"], "certa": 3, "explicacao": "d) 82.000"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (3, 4)? Responda com a letra.", "alternativas": ["3 para a direita e 4 para baixo", "3 para a direita e 4 para cima", "7 para a direita", "3 para a esquerda e 4 para baixo", "4 para a direita e 3 para cima"], "certa": 1, "explicacao": "b) 3 para a direita e 4 para cima"}, {"enunciado": "2 lápis custam R$ 14. Quanto custam 8 lápis iguais? Responda com a letra.", "alternativas": ["R$ 20", "R$ 7", "R$ 56", "R$ 22", "R$ 112"], "certa": 2, "explicacao": "c) R$ 56"}, {"enunciado": "Leia: “25% é uma porcentagem: 25 de cada 100.” Nessa frase, <b>porcentagem</b> quer dizer… Responda com a letra.", "alternativas": ["uma parte de cada 100", "cada número que se soma numa adição", "uma parte de cada 10", "quanto cabe dentro de um recipiente", "um número com uma parte inteira e uma fração"], "certa": 0, "explicacao": "a) uma parte de cada 100. Não é “uma parte de cada 10”: essa é a pegadinha."}, {"enunciado": "Como se escreve 59% em número decimal? Responda com a letra.", "alternativas": ["0,41", "0,59", "59", "0,059", "5,9"], "certa": 1, "explicacao": "b) 0,59"}, {"enunciado": "Quanto é 51.738 + 12.082? Responda com a letra.", "alternativas": ["63.710", "39.656", "63.910", "63.820", "6.371.110"], "certa": 3, "explicacao": "d) 63.820"}, {"enunciado": "O jogo começou às 15h41 e durou 1h37. A que horas terminou? Responda com a letra.", "alternativas": ["16h18", "17h41", "16h78", "17h18", "14h04"], "certa": 3, "explicacao": "d) 17h18"}, {"enunciado": "Uma torta foi dividida em 9 pedaços iguais e 3 foram comidos. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>9</span></span>", "<span class=\"fr\"><span>6</span><span>9</span></span>", "<span class=\"fr\"><span>9</span><span>3</span></span>", "<span class=\"fr\"><span>3</span><span>6</span></span>", "<span class=\"fr\"><span>3</span><span>12</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>3</span><span>9</span></span>"}, {"enunciado": "O que quer dizer <b>antecessor</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número que vem logo depois", "o número que vem logo antes", "quanto cabe dentro de um recipiente", "um número que está na tabuada de outro", "quanto uma medida mudou"], "certa": 1, "explicacao": "b) o número que vem logo antes. Não é “o número que vem logo depois”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (5, 3), ande 2 para a direita e 1 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(2, 1)", "(7, 4)", "(8, 3)", "(7, 3)", "(6, 5)"], "certa": 1, "explicacao": "b) (7, 4)"}, {"enunciado": "Simplifique <span class=\"fr\"><span>30</span><span>36</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>18</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>15</span><span>18</span></span>", "<span class=\"fr\"><span>5</span><span>36</span></span>", "<span class=\"fr\"><span>6</span><span>5</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>5</span><span>6</span></span>"}, {"enunciado": "Um videogame custa R$ 240 e está com 20% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 192", "R$ 48", "R$ 220", "R$ 144", "R$ 288"], "certa": 0, "explicacao": "a) R$ 192"}, {"enunciado": "A turma votou no animal preferido. Resultado — gato, 21; peixe, 12; coelho, 23. Quantos votos coelho teve a mais que gato? Responda com a letra.", "alternativas": ["23", "3", "2", "21", "44"], "certa": 2, "explicacao": "c) 2"}, {"enunciado": "O que quer dizer <b>aresta</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["duas vezes o número", "o espaço que um objeto ocupa", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "a parte plana de um sólido", "a linha onde duas faces de um sólido se encontram"], "certa": 4, "explicacao": "e) a linha onde duas faces de um sólido se encontram. Não é “a parte plana de um sólido”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisor de 64? Responda com a letra.", "alternativas": ["55", "128", "2", "192", "45"], "certa": 2, "explicacao": "c) 2"}, {"enunciado": "Como se escreve “cinco inteiros e um centésimo” com algarismos? Responda com a letra.", "alternativas": ["5,01", "6,01", "5,0001", "5,001", "5,1"], "certa": 0, "explicacao": "a) 5,01"}, {"enunciado": "O termômetro marcava 20 °C e a temperatura caiu 3 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["17 °C", "20 °C", "16 °C", "3 °C", "23 °C"], "certa": 0, "explicacao": "a) 17 °C"}, {"enunciado": "Qual destes números é o maior? 2,16, 2,26, 2,3, 2,157 e 2,17 Responda com a letra.", "alternativas": ["2,26", "2,16", "2,157", "2,3", "2,17"], "certa": 3, "explicacao": "d) 2,3"}, {"enunciado": "O que quer dizer <b>conversão</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o par de números que diz onde um ponto está", "a mudança do tamanho da medida", "a troca de uma unidade por outra, sem mudar a medida", "quantas vezes o desenho é maior ou menor que o tamanho real"], "certa": 3, "explicacao": "d) a troca de uma unidade por outra, sem mudar a medida. Não é “a mudança do tamanho da medida”: essa é a pegadinha."}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 73 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "7,3%", "73%", "27%", "100%"], "certa": 2, "explicacao": "c) 73%"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>97</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["97,100", "9,7", "0,097", "97", "0,97"], "certa": 4, "explicacao": "e) 0,97"}, {"enunciado": "Bianca tem 4 camisetas e 6 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["23", "24", "6", "48", "10"], "certa": 1, "explicacao": "b) 24"}, {"enunciado": "Quantos vértices tem um pentágono? Responda com a letra.", "alternativas": ["4", "6", "5", "7", "10"], "certa": 2, "explicacao": "c) 5"}, {"enunciado": "O que quer dizer <b>triplo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "três vezes o número", "o número mais 3", "o valor que se tira do preço"], "certa": 2, "explicacao": "c) três vezes o número. Não é “o número mais 3”: essa é a pegadinha."}, {"enunciado": "Um ventilador custa R$ 90 à vista, ou 5 vezes de R$ 21. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 195", "R$ 15", "R$ 105", "R$ 90", "R$ 69"], "certa": 1, "explicacao": "b) R$ 15"}, {"enunciado": "Quantos vértices tem um hexágono? Responda com a letra.", "alternativas": ["6", "12", "5", "7", "8"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Quanto é 636 × 55? Responda com a letra.", "alternativas": ["3.180", "34.980", "31.800", "550", "6.360"], "certa": 1, "explicacao": "b) 34.980"}, {"enunciado": "Complete: 8,6 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["86.000", "0,0086", "8.600", "860", "86"], "certa": 2, "explicacao": "c) 8.600"}, {"enunciado": "Leia: “Em 25 ÷ 4, o quociente é 6 e o resto é 1.” Nessa frase, <b>quociente</b> quer dizer… Responda com a letra.", "alternativas": ["o que sobra na divisão", "o número de cima da fração: quantas partes foram pegas", "o resultado de juntar tudo", "um valor aproximado, calculado de cabeça", "o resultado da divisão"], "certa": 4, "explicacao": "e) o resultado da divisão. Não é “o que sobra na divisão”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
