<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 1 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 48,2 − 8,05? Responda com a letra.", "alternativas": ["4,015", "401,5", "56,25", "40,25", "40,15"], "certa": 4, "explicacao": "e) 40,15"}, {"enunciado": "Arredonde 82.341 para o milhar mais próximo. Responda com a letra.", "alternativas": ["83.000", "82.340", "82.300", "82.000", "80.000"], "certa": 3, "explicacao": "d) 82.000"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (3, 4)? Responda com a letra.", "alternativas": ["3 para a direita e 4 para baixo", "3 para a direita e 4 para cima", "7 para a direita", "3 para a esquerda e 4 para baixo", "4 para a direita e 3 para cima"], "certa": 1, "explicacao": "b) 3 para a direita e 4 para cima"}, {"enunciado": "2 lápis custam R$ 14. Quanto custam 8 lápis iguais? Responda com a letra.", "alternativas": ["R$ 20", "R$ 7", "R$ 56", "R$ 22", "R$ 112"], "certa": 2, "explicacao": "c) R$ 56"}, {"enunciado": "Leia: “25% é uma porcentagem: 25 de cada 100.” Nessa frase, <b>porcentagem</b> quer dizer… Responda com a letra.", "alternativas": ["uma parte de cada 100", "cada número que se soma numa adição", "uma parte de cada 10", "quanto cabe dentro de um recipiente", "um número com uma parte inteira e uma fração"], "certa": 0, "explicacao": "a) uma parte de cada 100. Não é “uma parte de cada 10”: essa é a pegadinha."}, {"enunciado": "Como se escreve 32% em número decimal? Responda com a letra.", "alternativas": ["0,68", "32", "0,32", "3,2", "0,032"], "certa": 2, "explicacao": "c) 0,32"}, {"enunciado": "Quanto é 53.939 + 18.526? Responda com a letra.", "alternativas": ["61.114.515", "35.413", "61.455", "72.465", "72.555"], "certa": 3, "explicacao": "d) 72.465"}, {"enunciado": "O filme começou às 9h30 e durou 1h36. A que horas terminou? Responda com a letra.", "alternativas": ["11h30", "10h66", "11h06", "10h06", "7h54"], "certa": 2, "explicacao": "c) 11h06"}, {"enunciado": "Uma torta foi dividida em 12 pedaços iguais e 1 foi comido. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>11</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>11</span></span>", "<span class=\"fr\"><span>1</span><span>13</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>12</span><span>1</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>12</span></span>"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada número de uma sequência", "o dinheiro que volta quando se paga mais que o preço", "cada uma das 100 partes iguais de um inteiro", "um número que tem vírgula", "um número com uma parte inteira e uma fração"], "certa": 4, "explicacao": "e) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (4, 0), ande 2 para a direita e 1 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(1, 6)", "(7, 0)", "(6, 1)", "(6, 0)", "(5, 2)"], "certa": 2, "explicacao": "c) (6, 1)"}, {"enunciado": "Simplifique <span class=\"fr\"><span>9</span><span>45</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>15</span></span>", "<span class=\"fr\"><span>1</span><span>45</span></span>", "<span class=\"fr\"><span>3</span><span>15</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "Uma bicicleta custa R$ 164 e está com 25% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 205", "R$ 41", "R$ 139", "R$ 82", "R$ 123"], "certa": 4, "explicacao": "e) R$ 123"}, {"enunciado": "A turma votou no esporte preferido. Resultado — futebol, 23; natação, 9; vôlei, 4. Quantos votos futebol teve a mais que natação? Responda com a letra.", "alternativas": ["23", "32", "15", "14", "9"], "certa": 3, "explicacao": "d) 14"}, {"enunciado": "Leia: “No orçamento da semana, Bianca separou R$ 10 para o lanche.” Nessa frase, <b>orçamento</b> quer dizer… Responda com a letra.", "alternativas": ["quando os dois lados do sinal = valem o mesmo", "o dinheiro que sobra no fim do mês", "um número com uma parte inteira e uma fração", "cada número que se soma numa adição", "o plano do dinheiro que entra e do que vai ser gasto"], "certa": 4, "explicacao": "e) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisível por 2? Responda com a letra.", "alternativas": ["8.289", "8.381", "312", "4.033", "643"], "certa": 2, "explicacao": "c) 312"}, {"enunciado": "Como se escreve “seis inteiros e seis milésimos” com algarismos? Responda com a letra.", "alternativas": ["7,006", "6,006", "6.006", "6,6", "6,06"], "certa": 1, "explicacao": "b) 6,006"}, {"enunciado": "O termômetro marcava 31 °C e a temperatura subiu 12 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["31 °C", "44 °C", "43 °C", "19 °C", "12 °C"], "certa": 2, "explicacao": "c) 43 °C"}, {"enunciado": "Qual destes números é o maior? 6,3, 6,26, 6,15, 6,205 e 6,285 Responda com a letra.", "alternativas": ["6,205", "6,285", "6,15", "6,3", "6,26"], "certa": 3, "explicacao": "d) 6,3"}, {"enunciado": "Leia: “A operação inversa de somar 15 é subtrair 15.” Nessa frase, <b>operação inversa</b> quer dizer… Responda com a letra.", "alternativas": ["um valor aproximado, calculado de cabeça", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "quantas vezes algo aparece", "quando os dois lados do sinal = valem o mesmo", "a mesma conta feita de novo"], "certa": 1, "explicacao": "b) a conta que desfaz a outra: − desfaz +, ÷ desfaz ×. Não é “a mesma conta feita de novo”: essa é a pegadinha."}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 86 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "8,6%", "100%", "86%", "14%"], "certa": 3, "explicacao": "d) 86%"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>66</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["0,66", "66,100", "6,6", "66", "0,066"], "certa": 0, "explicacao": "a) 0,66"}, {"enunciado": "Jogando 4 moedas ao mesmo tempo, quantos resultados diferentes podem sair (cara ou coroa em cada uma)? Responda com a letra.", "alternativas": ["8", "16", "5", "2", "4"], "certa": 1, "explicacao": "b) 16"}, {"enunciado": "Leia: “O preço é proporcional à quantidade: 2 cadernos custam o dobro de 1.” Nessa frase, <b>proporcional</b> quer dizer… Responda com a letra.", "alternativas": ["quantas vezes o desenho é maior ou menor que o tamanho real", "que aumenta ou diminui na mesma medida", "cada uma das 100 partes iguais de um inteiro", "o que se ganha a mais: o preço de venda menos o que custou", "que aumenta sempre somando o mesmo tanto"], "certa": 1, "explicacao": "b) que aumenta ou diminui na mesma medida. Não é “que aumenta sempre somando o mesmo tanto”: essa é a pegadinha."}, {"enunciado": "Felipe quer comprar um livro de R$ 100 e guarda R$ 10 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["10", "11", "90", "110", "1.000"], "certa": 0, "explicacao": "a) 10"}, {"enunciado": "Quantas faces tem um cubo? Responda com a letra.", "alternativas": ["6", "12", "7", "5", "14"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Quanto é 187 × 16? Responda com a letra.", "alternativas": ["2.552", "1.309", "1.870", "2.992", "1.122"], "certa": 3, "explicacao": "d) 2.992"}, {"enunciado": "Complete: 4.502 m = <span class=\"caixa\"></span> km. Responda com a letra.", "alternativas": ["450,2", "0,4502", "4.502.000", "4,502", "45,02"], "certa": 3, "explicacao": "d) 4,502"}, {"enunciado": "O que quer dizer <b>legenda</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada número de uma sequência", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "quantas vezes algo aparece", "o título do gráfico", "quantas vezes o desenho é maior ou menor que o tamanho real"], "certa": 1, "explicacao": "b) o texto que explica o que cada cor ou símbolo do gráfico quer dizer. Não é “o título do gráfico”: essa é a pegadinha."}, {"enunciado": "Pensei num número, multipliquei por 6 e tirei 3. Deu 21. Em que número pensei? Responda com a letra.", "alternativas": ["129", "24", "15", "4", "3"], "certa": 3, "explicacao": "d) 4"}];
const CHAVE='simulado-bonus-mat-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
