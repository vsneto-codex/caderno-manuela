<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é 2,3 + 5,75? Responda com a letra.", "alternativas": ["0,805", "80,5", "598", "5,98", "8,05"], "certa": 4, "explicacao": "e) 8,05"}, {"enunciado": "Arredonde 82.341 para o milhar mais próximo. Responda com a letra.", "alternativas": ["83.000", "82.340", "82.300", "82.000", "80.000"], "certa": 3, "explicacao": "d) 82.000"}, {"enunciado": "Saindo do ponto (1, 5), ande 5 para a direita e 3 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(5, 3)", "(6, 5)", "(6, 8)", "(8, 6)", "(4, 10)"], "certa": 2, "explicacao": "c) (6, 8)"}, {"enunciado": "8 canetas custam R$ 104. Quanto custam 9 canetas iguais? Responda com a letra.", "alternativas": ["R$ 117", "R$ 13", "R$ 105", "R$ 113", "R$ 936"], "certa": 0, "explicacao": "a) R$ 117"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número que tem vírgula", "o resultado da subtração", "o espaço que um objeto ocupa", "um número com uma parte inteira e uma fração", "quantas vezes o desenho é maior ou menor que o tamanho real"], "certa": 3, "explicacao": "d) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "Como se escreve 34% em número decimal? Responda com a letra.", "alternativas": ["0,66", "0,34", "0,034", "3,4", "34"], "certa": 1, "explicacao": "b) 0,34"}, {"enunciado": "Quanto é 64.195 − 14.288? Responda com a letra.", "alternativas": ["49.917", "78.483", "50.917", "49.907", "50.113"], "certa": 3, "explicacao": "d) 49.907"}, {"enunciado": "A aula de natação começou às 19h23 e durou 3h41. A que horas terminou? Responda com a letra.", "alternativas": ["15h42", "23h04", "22h64", "23h23", "22h04"], "certa": 1, "explicacao": "b) 23h04"}, {"enunciado": "Um chocolate foi dividido em 10 pedaços iguais e 8 foram comidos. Que fração do chocolate foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>2</span></span>", "<span class=\"fr\"><span>8</span><span>10</span></span>", "<span class=\"fr\"><span>2</span><span>10</span></span>", "<span class=\"fr\"><span>8</span><span>18</span></span>", "<span class=\"fr\"><span>10</span><span>8</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>8</span><span>10</span></span>"}, {"enunciado": "Leia: “O volume da caixa é de 24 cubinhos.” Nessa frase, <b>volume</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "um número que está na tabuada de outro", "a área de uma das faces", "o espaço que um objeto ocupa"], "certa": 4, "explicacao": "e) o espaço que um objeto ocupa. Não é “a área de uma das faces”: essa é a pegadinha."}, {"enunciado": "Quantos lados tem um pentágono? Responda com a letra.", "alternativas": ["4", "6", "10", "7", "5"], "certa": 4, "explicacao": "e) 5"}, {"enunciado": "Simplifique <span class=\"fr\"><span>12</span><span>20</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>3</span></span>", "<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>3</span><span>20</span></span>", "<span class=\"fr\"><span>3</span><span>10</span></span>", "<span class=\"fr\"><span>6</span><span>10</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>3</span><span>5</span></span>"}, {"enunciado": "A mensalidade do clube custava R$ 130 e teve um aumento de 30%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 169", "R$ 91", "R$ 208", "R$ 39", "R$ 160"], "certa": 0, "explicacao": "a) R$ 169"}, {"enunciado": "A turma votou no animal preferido. Resultado — cachorro, 21; gato, 22; coelho, 14. Quantos alunos votaram? Responda com a letra.", "alternativas": ["67", "22", "43", "3", "57"], "certa": 4, "explicacao": "e) 57"}, {"enunciado": "O que quer dizer <b>proporcional</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o valor que se tira do preço", "cada uma das 2 partes iguais de um inteiro", "o par de números que diz onde um ponto está", "que aumenta ou diminui na mesma medida", "que aumenta sempre somando o mesmo tanto"], "certa": 3, "explicacao": "d) que aumenta ou diminui na mesma medida. Não é “que aumenta sempre somando o mesmo tanto”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisor de 36? Responda com a letra.", "alternativas": ["108", "15", "29", "6", "72"], "certa": 3, "explicacao": "d) 6"}, {"enunciado": "Como se escreve “quinze inteiros e dois centésimos” com algarismos? Responda com a letra.", "alternativas": ["15,2", "15,0002", "15,002", "15,02", "16,02"], "certa": 3, "explicacao": "d) 15,02"}, {"enunciado": "O termômetro marcava 31 °C e a temperatura caiu 11 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["20 °C", "11 °C", "31 °C", "42 °C", "19 °C"], "certa": 0, "explicacao": "a) 20 °C"}, {"enunciado": "Qual destes números é o maior? 0,229, 0,373, 0,17, 0,4 e 0,349 Responda com a letra.", "alternativas": ["0,4", "0,373", "0,349", "0,229", "0,17"], "certa": 0, "explicacao": "a) 0,4"}, {"enunciado": "O que quer dizer <b>probabilidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "a certeza de que vai acontecer", "o número de cima da fração: quantas partes foram pegas", "cada número que se soma numa adição", "a chance de algo acontecer"], "certa": 4, "explicacao": "e) a chance de algo acontecer. Não é “a certeza de que vai acontecer”: essa é a pegadinha."}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 38 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "3,8%", "100%", "62%", "38%"], "certa": 4, "explicacao": "e) 38%"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>25</span><span>10</span></span> em número decimal? Responda com a letra.", "alternativas": ["25", "2,5", "25,10", "0,25", "250"], "certa": 1, "explicacao": "b) 2,5"}, {"enunciado": "Jogando 4 moedas ao mesmo tempo, quantos resultados diferentes podem sair (cara ou coroa em cada uma)? Responda com a letra.", "alternativas": ["2", "8", "16", "4", "5"], "certa": 2, "explicacao": "c) 16"}, {"enunciado": "Qual é o perímetro de um retângulo de 6 cm por 4 cm? Responda com a letra.", "alternativas": ["20 cm", "20 cm²", "16 cm", "10 cm", "24 cm²"], "certa": 0, "explicacao": "a) 20 cm"}, {"enunciado": "O que quer dizer <b>centésimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 100 partes iguais de um inteiro", "quanto cabe dentro de um recipiente", "a coisa toda, sem faltar nenhuma parte", "o número 100", "cada número que se soma numa adição"], "certa": 0, "explicacao": "a) cada uma das 100 partes iguais de um inteiro. Não é “o número 100”: essa é a pegadinha."}, {"enunciado": "Uma bicicleta custa R$ 45 e está com 40% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 18", "R$ 5", "R$ 63", "R$ 9", "R$ 27"], "certa": 4, "explicacao": "e) R$ 27"}, {"enunciado": "Um retângulo de 2 cm por 4 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["24 cm²", "72 cm", "72 cm²", "36 cm", "8 cm²"], "certa": 2, "explicacao": "c) 72 cm²"}, {"enunciado": "Quanto é 206 × 53? Responda com a letra.", "alternativas": ["10.918", "10.300", "618", "1.648", "608"], "certa": 0, "explicacao": "a) 10.918"}, {"enunciado": "Qual é o perímetro de um retângulo de 10 m por 16 m? Responda com a letra.", "alternativas": ["36 m", "26 m", "52 m", "160 m²", "52 m²"], "certa": 2, "explicacao": "c) 52 m"}, {"enunciado": "Leia: “Na partilha das 12 balas, cada um dos 3 irmãos ficou com 4.” Nessa frase, <b>partilha</b> quer dizer… Responda com a letra.", "alternativas": ["a soma de várias partes", "a divisão de alguma coisa entre pessoas", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "a chance de algo acontecer", "a medida do contorno de uma figura"], "certa": 1, "explicacao": "b) a divisão de alguma coisa entre pessoas. Não é “a soma de várias partes”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
