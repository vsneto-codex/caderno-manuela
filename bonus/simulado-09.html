<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o perímetro de um retângulo de 8 m por 6 m? Responda com a letra.", "alternativas": ["48 m²", "28 m²", "22 m", "28 m", "14 m"], "certa": 3, "explicacao": "d) 28 m"}, {"enunciado": "A turma votou na fruta preferida. Resultado — maçã, 12; manga, 3; banana, 7; uva, 23. Quantos votos uva teve a mais que manga? Responda com a letra.", "alternativas": ["20", "26", "3", "23", "21"], "certa": 0, "explicacao": "a) 20"}, {"enunciado": "O termômetro marcava 35 °C e a temperatura subiu 7 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["35 °C", "42 °C", "7 °C", "28 °C", "43 °C"], "certa": 1, "explicacao": "b) 42 °C"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 11; amarelo, 17; verde, 3. Quantos votos roxo teve a mais que verde? Responda com a letra.", "alternativas": ["14", "9", "8", "3", "11"], "certa": 2, "explicacao": "c) 8"}, {"enunciado": "Leia: “Em ordem crescente: <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span>, <span class=\"fr\"><span>1</span><span>2</span></span>.” Nessa frase, <b>crescente</b> quer dizer… Responda com a letra.", "alternativas": ["do menor para o maior", "quanto tempo algo dura, do começo ao fim", "do maior para o menor", "o dinheiro que volta quando se paga mais que o preço", "a medida do contorno de uma figura"], "certa": 0, "explicacao": "a) do menor para o maior. Não é “do maior para o menor”: essa é a pegadinha."}, {"enunciado": "Pensei num número, multipliquei por 6 e tirei 13. Deu 47. Em que número pensei? Responda com a letra.", "alternativas": ["295", "10", "282", "41", "60"], "certa": 1, "explicacao": "b) 10"}, {"enunciado": "Como se chama uma abertura mais fechada que o canto de uma folha? Responda com a letra.", "alternativas": ["ângulo reto", "vértice", "paralelas", "ângulo menor que o reto", "ângulo maior que o reto"], "certa": 3, "explicacao": "d) ângulo menor que o reto"}, {"enunciado": "Como se escreve “seis inteiros e oito milésimos” com algarismos? Responda com a letra.", "alternativas": ["6,8", "6,008", "6.008", "6,08", "6,0008"], "certa": 1, "explicacao": "b) 6,008"}, {"enunciado": "Quanto é 739 × 39? Responda com a letra.", "alternativas": ["22.170", "8.868", "28.821", "2.341", "6.651"], "certa": 2, "explicacao": "c) 28.821"}, {"enunciado": "Leia: “O corredor ganhou por três milésimos de segundo: 0,003 s.” Nessa frase, <b>milésimos</b> quer dizer… Responda com a letra.", "alternativas": ["o número 1.000", "cada uma das 1.000 partes iguais de um inteiro", "quanto uma medida mudou", "quanto tempo algo dura, do começo ao fim", "o segmento que liga dois vértices que não são vizinhos"], "certa": 1, "explicacao": "b) cada uma das 1.000 partes iguais de um inteiro. Não é “o número 1.000”: essa é a pegadinha."}, {"enunciado": "Quanto é <span class=\"fr\"><span>2</span><span>8</span></span> + <span class=\"fr\"><span>5</span><span>8</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>7</span><span>64</span></span>", "<span class=\"fr\"><span>7</span><span>8</span></span>", "<span class=\"fr\"><span>10</span><span>8</span></span>", "<span class=\"fr\"><span>7</span><span>16</span></span>", "<span class=\"fr\"><span>3</span><span>8</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>7</span><span>8</span></span>"}, {"enunciado": "Arredonde 86.454 para o milhar mais próximo. Responda com a letra.", "alternativas": ["87.000", "90.000", "86.450", "86.500", "86.000"], "certa": 4, "explicacao": "e) 86.000"}, {"enunciado": "Qual destes números é divisor de 48? Responda com a letra.", "alternativas": ["96", "4", "7", "47", "144"], "certa": 1, "explicacao": "b) 4"}, {"enunciado": "Quantos lados tem um eneágono? Responda com a letra.", "alternativas": ["18", "11", "8", "9", "10"], "certa": 3, "explicacao": "d) 9"}, {"enunciado": "Leia: “A duração do filme foi de 1h50.” Nessa frase, <b>duração</b> quer dizer… Responda com a letra.", "alternativas": ["o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "a hora em que algo começa", "quando os dois lados do sinal = valem o mesmo", "números em ordem, seguindo uma regra", "quanto tempo algo dura, do começo ao fim"], "certa": 4, "explicacao": "e) quanto tempo algo dura, do começo ao fim. Não é “a hora em que algo começa”: essa é a pegadinha."}, {"enunciado": "Qual é a área de um retângulo de 7 cm por 10 cm? Responda com a letra.", "alternativas": ["17 cm²", "34 cm", "70 cm²", "140 cm²", "70 cm"], "certa": 2, "explicacao": "c) 70 cm²"}, {"enunciado": "Complete: 63,3 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["633", "63,3", "63.300", "0,0633", "6.330"], "certa": 2, "explicacao": "c) 63.300"}, {"enunciado": "Uma parede foi dividida em 4 partes iguais e 3 estão pintadas. Que fração da parede foi pintada? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>3</span><span>7</span></span>", "<span class=\"fr\"><span>3</span><span>1</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>3</span><span>4</span></span>"}, {"enunciado": "Qual destes números é o maior? 4,835, 4,859, 4,556, 4,9 e 4,51 Responda com a letra.", "alternativas": ["4,556", "4,835", "4,51", "4,859", "4,9"], "certa": 4, "explicacao": "e) 4,9"}, {"enunciado": "Leia: “25% é uma porcentagem: 25 de cada 100.” Nessa frase, <b>porcentagem</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado de juntar tudo", "o segmento que liga dois vértices que não são vizinhos", "um valor aproximado, calculado de cabeça", "uma parte de cada 10", "uma parte de cada 100"], "certa": 4, "explicacao": "e) uma parte de cada 100. Não é “uma parte de cada 10”: essa é a pegadinha."}, {"enunciado": "Uma compra custou R$ 17,58 e foi paga com uma nota de R$ 20,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 2,42", "R$ 37,58", "R$ 3,42", "R$ 17,58", "R$ 3,00"], "certa": 0, "explicacao": "a) R$ 2,42"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (3, 1)? Responda com a letra.", "alternativas": ["3 para a direita e 1 para cima", "1 para a direita e 3 para cima", "3 para a esquerda e 1 para baixo", "3 para a direita e 1 para baixo", "4 para a direita"], "certa": 0, "explicacao": "a) 3 para a direita e 1 para cima"}, {"enunciado": "Numa caixa há 3 bolas vermelhas e 5 bolas amarelas. Tirando uma sem olhar, qual é a chance de sair vermelha? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span>", "<span class=\"fr\"><span>3</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>3</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>3</span><span>8</span></span>"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["45.156", "14.565", "51.645", "9.100", "41.565"], "certa": 2, "explicacao": "c) 51.645"}, {"enunciado": "Leia: “A operação inversa de somar 15 é subtrair 15.” Nessa frase, <b>operação inversa</b> quer dizer… Responda com a letra.", "alternativas": ["a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "quanto uma medida mudou", "quando os dois lados do sinal = valem o mesmo", "a mesma conta feita de novo", "a divisão de alguma coisa entre pessoas"], "certa": 0, "explicacao": "a) a conta que desfaz a outra: − desfaz +, ÷ desfaz ×. Não é “a mesma conta feita de novo”: essa é a pegadinha."}, {"enunciado": "2 pães custam R$ 22. Quanto custam 7 pães iguais? Responda com a letra.", "alternativas": ["R$ 29", "R$ 154", "R$ 77", "R$ 11", "R$ 27"], "certa": 2, "explicacao": "c) R$ 77"}, {"enunciado": "Quanto é 3,14 × 8? Responda com a letra.", "alternativas": ["2,512", "251,2", "24,112", "25,12", "2.512"], "certa": 3, "explicacao": "d) 25,12"}, {"enunciado": "O jogo começou às 19h46 e durou 1h32. A que horas terminou? Responda com a letra.", "alternativas": ["21h46", "21h18", "18h14", "20h18", "20h78"], "certa": 1, "explicacao": "b) 21h18"}, {"enunciado": "Quanto é 20% de 85? Responda com a letra.", "alternativas": ["1.700", "68", "17", "105", "65"], "certa": 2, "explicacao": "c) 17"}, {"enunciado": "O que quer dizer <b>partilha</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado da subtração", "quantas vezes algo aparece", "a divisão de alguma coisa entre pessoas", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "a soma de várias partes"], "certa": 2, "explicacao": "c) a divisão de alguma coisa entre pessoas. Não é “a soma de várias partes”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
