<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o perímetro de um retângulo de 8 m por 6 m? Responda com a letra.", "alternativas": ["48 m²", "28 m²", "22 m", "28 m", "14 m"], "certa": 3, "explicacao": "d) 28 m"}, {"enunciado": "Complete: 6.224 cm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["62,24", "622.400", "6.224", "0,6224", "6,224"], "certa": 0, "explicacao": "a) 62,24"}, {"enunciado": "Como se escreve “nove inteiros e seis centésimos” com algarismos? Responda com a letra.", "alternativas": ["9,0006", "9,06", "9,006", "9,6", "10,06"], "certa": 1, "explicacao": "b) 9,06"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 11; amarelo, 17; verde, 3. Quantos votos roxo teve a mais que verde? Responda com a letra.", "alternativas": ["14", "9", "8", "3", "11"], "certa": 2, "explicacao": "c) 8"}, {"enunciado": "Leia: “A capacidade da garrafa é 2 L.” Nessa frase, <b>capacidade</b> quer dizer… Responda com a letra.", "alternativas": ["quanto cabe dentro de um recipiente", "quanto uma medida mudou", "quanto o recipiente pesa", "números em ordem, seguindo uma regra", "a medida do contorno de uma figura"], "certa": 0, "explicacao": "a) quanto cabe dentro de um recipiente. Não é “quanto o recipiente pesa”: essa é a pegadinha."}, {"enunciado": "90 balas foram divididas entre dois irmãos. Um ficou com o dobro do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["30", "90", "120", "60", "45"], "certa": 0, "explicacao": "a) 30"}, {"enunciado": "Um retângulo de 6 cm por 9 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é o perímetro do retângulo novo? Responda com a letra.", "alternativas": ["270 cm", "486 cm²", "30 cm", "45 cm", "90 cm"], "certa": 4, "explicacao": "e) 90 cm"}, {"enunciado": "De manhã fazia 14 °C. À tarde, 20 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["34 °C", "20 °C", "7 °C", "14 °C", "6 °C"], "certa": 4, "explicacao": "e) 6 °C"}, {"enunciado": "Quanto é 626 × 96? Responda com a letra.", "alternativas": ["56.340", "3.756", "9.390", "5.466", "60.096"], "certa": 4, "explicacao": "e) 60.096"}, {"enunciado": "O que quer dizer <b>proporcional</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o mesmo sentido em que giram os ponteiros do relógio", "cada número de uma sequência", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "que aumenta ou diminui na mesma medida", "que aumenta sempre somando o mesmo tanto"], "certa": 3, "explicacao": "d) que aumenta ou diminui na mesma medida. Não é “que aumenta sempre somando o mesmo tanto”: essa é a pegadinha."}, {"enunciado": "Quanto é <span class=\"fr\"><span>5</span><span>6</span></span> + <span class=\"fr\"><span>1</span><span>3</span></span>? (A resposta está simplificada.) Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>7</span><span>6</span></span>", "<span class=\"fr\"><span>7</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "1"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>7</span><span>6</span></span>"}, {"enunciado": "Arredonde 71.734 para a centena mais próxima. Responda com a letra.", "alternativas": ["71.700", "71.800", "71.730", "70.000", "72.000"], "certa": 0, "explicacao": "a) 71.700"}, {"enunciado": "Qual destes números é divisor de 28? Responda com a letra.", "alternativas": ["4", "25", "84", "56", "19"], "certa": 0, "explicacao": "a) 4"}, {"enunciado": "Leia: “O total da compra foi R$ 45.” Nessa frase, <b>total</b> quer dizer… Responda com a letra.", "alternativas": ["o valor que se tira do preço", "a linha onde duas faces de um sólido se encontram", "uma das partes", "o resultado de juntar tudo", "um número com uma parte inteira e uma fração"], "certa": 3, "explicacao": "d) o resultado de juntar tudo. Não é “uma das partes”: essa é a pegadinha."}, {"enunciado": "Uma compra custou R$ 30,49 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 80,49", "R$ 19,51", "R$ 20,51", "R$ 20,49", "R$ 20,00"], "certa": 1, "explicacao": "b) R$ 19,51"}, {"enunciado": "Pensei num número, somei 12 e dividi o resultado por 3. Deu 16. Em que número pensei? Responda com a letra.", "alternativas": ["4", "12", "36", "60", "48"], "certa": 2, "explicacao": "c) 36"}, {"enunciado": "Um chocolate foi dividido em 11 pedaços iguais e 1 foi comido. Que fração do chocolate foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>10</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>11</span></span>", "<span class=\"fr\"><span>11</span><span>1</span></span>", "<span class=\"fr\"><span>10</span><span>11</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>11</span></span>"}, {"enunciado": "Qual destes números é o maior? 8,243, 8,345, 8,4, 8,13 e 8,175 Responda com a letra.", "alternativas": ["8,175", "8,243", "8,345", "8,4", "8,13"], "certa": 3, "explicacao": "d) 8,4"}, {"enunciado": "Leia: “O corredor ganhou por três milésimos de segundo: 0,003 s.” Nessa frase, <b>milésimos</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 1.000 partes iguais de um inteiro", "uma parte de cada 100", "a chance de algo acontecer", "o número 1.000", "quanto uma medida mudou"], "certa": 0, "explicacao": "a) cada uma das 1.000 partes iguais de um inteiro. Não é “o número 1.000”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (5, 3), ande 4 para a direita e 5 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(4, 5)", "(14, 3)", "(9, 3)", "(9, 8)", "(10, 7)"], "certa": 3, "explicacao": "d) (9, 8)"}, {"enunciado": "Bianca tem 3 camisetas e 7 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["10", "7", "42", "20", "21"], "certa": 4, "explicacao": "e) 21"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["9.843", "19.402", "9.834", "17.124", "8.934"], "certa": 4, "explicacao": "e) 8.934"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>17</span><span>9</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["8 <span class=\"fr\"><span>1</span><span>9</span></span>", "2 <span class=\"fr\"><span>8</span><span>9</span></span>", "1 <span class=\"fr\"><span>1</span><span>9</span></span>", "1 <span class=\"fr\"><span>8</span><span>17</span></span>", "1 <span class=\"fr\"><span>8</span><span>9</span></span>"], "certa": 4, "explicacao": "e) 1 <span class=\"fr\"><span>8</span><span>9</span></span>"}, {"enunciado": "O que quer dizer <b>décimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 10 partes iguais de um inteiro", "o número 10", "quantas vezes algo aparece", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o dinheiro que volta quando se paga mais que o preço"], "certa": 0, "explicacao": "a) cada uma das 10 partes iguais de um inteiro. Não é “o número 10”: essa é a pegadinha."}, {"enunciado": "Quanto é 3,55 × 6? Responda com a letra.", "alternativas": ["18,330", "2.130", "21,3", "2,13", "213"], "certa": 2, "explicacao": "c) 21,3"}, {"enunciado": "A viagem começou às 9h30 e durou 1h36. A que horas terminou? Responda com a letra.", "alternativas": ["11h30", "7h54", "11h06", "10h66", "10h06"], "certa": 2, "explicacao": "c) 11h06"}, {"enunciado": "Quanto é 75% de 56? Responda com a letra.", "alternativas": ["42", "4.200", "420", "14", "131"], "certa": 0, "explicacao": "a) 42"}, {"enunciado": "Manuela quer comprar um livro de R$ 400 e guarda R$ 40 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["360", "440", "11", "10", "16.000"], "certa": 3, "explicacao": "d) 10"}, {"enunciado": "Leia: “A frequência do azul na pesquisa foi 8: oito pessoas escolheram azul.” Nessa frase, <b>frequência</b> quer dizer… Responda com a letra.", "alternativas": ["o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "a velocidade de alguma coisa", "um número que está na tabuada de outro", "quantas vezes algo aparece", "o número de cima da fração: quantas partes foram pegas"], "certa": 3, "explicacao": "d) quantas vezes algo aparece. Não é “a velocidade de alguma coisa”: essa é a pegadinha."}, {"enunciado": "Quanto é <span class=\"fr\"><span>2</span><span>9</span></span> de 54? Responda com a letra.", "alternativas": ["8", "108", "6", "12", "243"], "certa": 3, "explicacao": "d) 12"}];
const CHAVE='simulado-bonus-mat-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
