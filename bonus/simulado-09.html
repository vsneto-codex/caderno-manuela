<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o perímetro de um retângulo de 8 m por 6 m? Responda com a letra.", "alternativas": ["48 m²", "28 m²", "22 m", "28 m", "14 m"], "certa": 3, "explicacao": "d) 28 m"}, {"enunciado": "Complete: 6.224 cm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["62,24", "622.400", "6.224", "0,6224", "6,224"], "certa": 0, "explicacao": "a) 62,24"}, {"enunciado": "Como se escreve “nove inteiros e seis centésimos” com algarismos? Responda com a letra.", "alternativas": ["9,0006", "9,06", "9,006", "9,6", "10,06"], "certa": 1, "explicacao": "b) 9,06"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 11; amarelo, 17; verde, 3. Quantos votos roxo teve a mais que verde? Responda com a letra.", "alternativas": ["14", "9", "8", "3", "11"], "certa": 2, "explicacao": "c) 8"}, {"enunciado": "Leia: “1 centavo é um centésimo do real.” Nessa frase, <b>centésimo</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 100 partes iguais de um inteiro", "quanto uma medida mudou", "o número 100", "o dinheiro que volta quando se paga mais que o preço", "a medida do contorno de uma figura"], "certa": 0, "explicacao": "a) cada uma das 100 partes iguais de um inteiro. Não é “o número 100”: essa é a pegadinha."}, {"enunciado": "90 balas foram divididas entre dois irmãos. Um ficou com o dobro do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["30", "90", "120", "60", "45"], "certa": 0, "explicacao": "a) 30"}, {"enunciado": "Um retângulo de 6 cm por 9 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é o perímetro do retângulo novo? Responda com a letra.", "alternativas": ["270 cm", "486 cm²", "30 cm", "45 cm", "90 cm"], "certa": 4, "explicacao": "e) 90 cm"}, {"enunciado": "De manhã fazia 14 °C. À tarde, 20 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["34 °C", "20 °C", "7 °C", "14 °C", "6 °C"], "certa": 4, "explicacao": "e) 6 °C"}, {"enunciado": "Quanto é 626 × 96? Responda com a letra.", "alternativas": ["56.340", "3.756", "9.390", "5.466", "60.096"], "certa": 4, "explicacao": "e) 60.096"}, {"enunciado": "O que quer dizer <b>quociente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o mesmo sentido em que giram os ponteiros do relógio", "cada número de uma sequência", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "o resultado da divisão", "o que sobra na divisão"], "certa": 3, "explicacao": "d) o resultado da divisão. Não é “o que sobra na divisão”: essa é a pegadinha."}, {"enunciado": "Quanto é <span class=\"fr\"><span>5</span><span>6</span></span> + <span class=\"fr\"><span>1</span><span>3</span></span>? (A resposta está simplificada.) Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>7</span><span>6</span></span>", "<span class=\"fr\"><span>7</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "1"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>7</span><span>6</span></span>"}, {"enunciado": "Arredonde 71.734 para a centena mais próxima. Responda com a letra.", "alternativas": ["71.700", "71.800", "71.730", "70.000", "72.000"], "certa": 0, "explicacao": "a) 71.700"}, {"enunciado": "Qual destes números é divisível por 3? Responda com a letra.", "alternativas": ["4.099", "8.793", "6.499", "3.103", "6.299"], "certa": 1, "explicacao": "b) 8.793"}, {"enunciado": "O que quer dizer <b>diferença</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado da subtração", "cada uma das 2 partes iguais de um inteiro", "o segmento que liga dois vértices que não são vizinhos", "o resultado da adição", "quanto cabe dentro de um recipiente"], "certa": 0, "explicacao": "a) o resultado da subtração. Não é “o resultado da adição”: essa é a pegadinha."}, {"enunciado": "Uma compra custou R$ 12,74 e foi paga com uma nota de R$ 20,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 12,74", "R$ 8,00", "R$ 32,74", "R$ 8,26", "R$ 7,26"], "certa": 4, "explicacao": "e) R$ 7,26"}, {"enunciado": "Pensei num número, somei 18 e dividi o resultado por 6. Deu 27. Em que número pensei? Responda com a letra.", "alternativas": ["162", "9", "144", "180", "54"], "certa": 2, "explicacao": "c) 144"}, {"enunciado": "Uma torta foi dividida em 6 pedaços iguais e 2 foram comidos. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>2</span></span>", "<span class=\"fr\"><span>2</span><span>4</span></span>", "<span class=\"fr\"><span>2</span><span>6</span></span>", "<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>4</span><span>6</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>6</span></span>"}, {"enunciado": "Qual destes números é o maior? 1,26, 1,237, 1,3, 1,229 e 1,228 Responda com a letra.", "alternativas": ["1,229", "1,237", "1,26", "1,3", "1,228"], "certa": 3, "explicacao": "d) 1,3"}, {"enunciado": "Leia: “Em ordem crescente: <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span>, <span class=\"fr\"><span>1</span><span>2</span></span>.” Nessa frase, <b>crescente</b> quer dizer… Responda com a letra.", "alternativas": ["o número que vem logo antes", "que vale o mesmo", "cada número que se soma numa adição", "do menor para o maior", "do maior para o menor"], "certa": 3, "explicacao": "d) do menor para o maior. Não é “do maior para o menor”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (5, 1), ande 3 para a direita e 5 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(10, 4)", "(13, 1)", "(8, 6)", "(8, 1)", "(3, 5)"], "certa": 2, "explicacao": "c) (8, 6)"}, {"enunciado": "Bianca tem 4 camisetas e 6 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["48", "23", "24", "10", "6"], "certa": 2, "explicacao": "c) 24"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["36.176", "66.371", "31.667", "9.529", "71.636"], "certa": 4, "explicacao": "e) 71.636"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>13</span><span>4</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["4 <span class=\"fr\"><span>1</span><span>4</span></span>", "1 <span class=\"fr\"><span>3</span><span>4</span></span>", "3 <span class=\"fr\"><span>3</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>13</span></span>"], "certa": 3, "explicacao": "d) 3 <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "Leia: “Comprou por R$ 20 e vendeu por R$ 35: o lucro foi de R$ 15.” Nessa frase, <b>lucro</b> quer dizer… Responda com a letra.", "alternativas": ["o que se ganha a mais: o preço de venda menos o que custou", "todo o dinheiro recebido na venda", "na Matemática, uma conta com várias operações", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "a divisão de alguma coisa entre pessoas"], "certa": 0, "explicacao": "a) o que se ganha a mais: o preço de venda menos o que custou. Não é “todo o dinheiro recebido na venda”: essa é a pegadinha."}, {"enunciado": "Quanto é 9,632 ÷ 100? Responda com a letra.", "alternativas": ["963,2", "0,9632", "0,09632", "0,009632", "9,632"], "certa": 2, "explicacao": "c) 0,09632"}, {"enunciado": "A aula de natação começou às 16h26 e durou 1h44. A que horas terminou? Responda com a letra.", "alternativas": ["14h42", "18h26", "17h10", "17h70", "18h10"], "certa": 4, "explicacao": "e) 18h10"}, {"enunciado": "Quanto é 40% de 185? Responda com a letra.", "alternativas": ["7.400", "111", "145", "740", "74"], "certa": 4, "explicacao": "e) 74"}, {"enunciado": "Ricardo quer comprar um fone de R$ 45 e guarda R$ 15 por semana. Em quantas semanas junta o dinheiro? Responda com a letra.", "alternativas": ["3", "675", "60", "4", "30"], "certa": 0, "explicacao": "a) 3"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada grupo de 3 ordens de um número: unidades, milhares, milhões", "um número com uma parte inteira e uma fração", "um número que tem vírgula", "o ponto onde dois lados (ou arestas) se encontram", "na Matemática, uma conta com várias operações"], "certa": 1, "explicacao": "b) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "Quanto é <span class=\"fr\"><span>3</span><span>4</span></span> de 48? Responda com a letra.", "alternativas": ["12", "36", "64", "15", "144"], "certa": 1, "explicacao": "b) 36"}];
const CHAVE='simulado-bonus-mat-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
