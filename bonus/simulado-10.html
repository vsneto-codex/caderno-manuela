<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto vale o algarismo destacado em 69<span class=\"dest\">8</span>.543? Responda com a letra.", "alternativas": ["8.000", "8.543", "80.000", "8", "800"], "certa": 0, "explicacao": "a) 8.000"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (2, 4)? Responda com a letra.", "alternativas": ["2 para a direita e 4 para baixo", "2 para a direita e 4 para cima", "6 para a direita", "2 para a esquerda e 4 para baixo", "4 para a direita e 2 para cima"], "certa": 1, "explicacao": "b) 2 para a direita e 4 para cima"}, {"enunciado": "160 balas foram divididas entre dois irmãos. Um ficou com o quádruplo (4 vezes) do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["40", "192", "32", "160", "128"], "certa": 2, "explicacao": "c) 32"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>18</span><span>4</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["4 <span class=\"fr\"><span>2</span><span>4</span></span>", "4 <span class=\"fr\"><span>2</span><span>18</span></span>", "4 <span class=\"fr\"><span>2</span><span>5</span></span>", "5 <span class=\"fr\"><span>2</span><span>4</span></span>", "2 <span class=\"fr\"><span>4</span><span>4</span></span>"], "certa": 0, "explicacao": "a) 4 <span class=\"fr\"><span>2</span><span>4</span></span>"}, {"enunciado": "O que quer dizer <b>sequência</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o plano do dinheiro que entra e do que vai ser gasto", "do menor para o maior", "as informações que juntamos numa pesquisa", "números em ordem, seguindo uma regra", "números escolhidos ao acaso"], "certa": 3, "explicacao": "d) números em ordem, seguindo uma regra. Não é “números escolhidos ao acaso”: essa é a pegadinha."}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>2</span><span>13</span></span>, <span class=\"fr\"><span>2</span><span>4</span></span>, <span class=\"fr\"><span>2</span><span>6</span></span>, <span class=\"fr\"><span>2</span><span>8</span></span> e <span class=\"fr\"><span>2</span><span>5</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>13</span></span>", "<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>6</span></span>", "<span class=\"fr\"><span>2</span><span>4</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>2</span><span>4</span></span>"}, {"enunciado": "A turma votou no esporte preferido. Resultado — vôlei, 24; basquete, 16; futebol, 21. Quantos votos vôlei teve a mais que futebol? Responda com a letra.", "alternativas": ["4", "45", "3", "24", "21"], "certa": 2, "explicacao": "c) 3"}, {"enunciado": "Quanto é 6,94 × 9? Responda com a letra.", "alternativas": ["62,46", "624,6", "6,246", "6.246", "54,846"], "certa": 0, "explicacao": "a) 62,46"}, {"enunciado": "Quanto é 4 × 5 − 2 × 5? Responda com a letra.", "alternativas": ["13", "8", "10", "90", "60"], "certa": 2, "explicacao": "c) 10"}, {"enunciado": "Leia: “1 centavo é um centésimo do real.” Nessa frase, <b>centésimo</b> quer dizer… Responda com a letra.", "alternativas": ["números em ordem, seguindo uma regra", "o par de números que diz onde um ponto está", "o que sobra numa divisão que não é exata", "o número 100", "cada uma das 100 partes iguais de um inteiro"], "certa": 4, "explicacao": "e) cada uma das 100 partes iguais de um inteiro. Não é “o número 100”: essa é a pegadinha."}, {"enunciado": "Complete: 5.356 g = <span class=\"caixa\"></span> kg. Responda com a letra.", "alternativas": ["0,5356", "535,6", "53,56", "5,356", "5.356"], "certa": 3, "explicacao": "d) 5,356"}, {"enunciado": "Arredonde 76.870 para a centena mais próxima. Responda com a letra.", "alternativas": ["76.870", "76.970", "76.900", "77.000", "80.000"], "certa": 2, "explicacao": "c) 76.900"}, {"enunciado": "Quanto é 58.074 + 11.697? Responda com a letra.", "alternativas": ["46.377", "69.661", "69.771", "6.961.611", "69.861"], "certa": 2, "explicacao": "c) 69.771"}, {"enunciado": "Leia: “As linhas do sinal + são perpendiculares.” Nessa frase, <b>perpendiculares</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "que nunca encontra a outra reta", "quanto uma medida mudou", "as informações que juntamos numa pesquisa", "o que se ganha a mais: o preço de venda menos o que custou"], "certa": 0, "explicacao": "a) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Quantas arestas tem uma pirâmide de base quadrada? Responda com a letra.", "alternativas": ["7", "9", "10", "5", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Complete: 5.573 mm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["55,73", "5,573", "0,5573", "5.573", "557,3"], "certa": 1, "explicacao": "b) 5,573"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 17 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "1,7%", "17%", "83%", "100%"], "certa": 2, "explicacao": "c) 17%"}, {"enunciado": "Um retângulo de 7 cm por 9 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["252 cm²", "126 cm²", "63 cm²", "64 cm", "252 cm"], "certa": 0, "explicacao": "a) 252 cm²"}, {"enunciado": "Leia: “Em ordem crescente: <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span>, <span class=\"fr\"><span>1</span><span>2</span></span>.” Nessa frase, <b>crescente</b> quer dizer… Responda com a letra.", "alternativas": ["cada grupo de 3 ordens de um número: unidades, milhares, milhões", "o resultado da divisão", "do maior para o menor", "um número que está na tabuada de outro", "do menor para o maior"], "certa": 4, "explicacao": "e) do menor para o maior. Não é “do maior para o menor”: essa é a pegadinha."}, {"enunciado": "Calcule 3 × 44 de cabeça, separando 44 em 40 + 4. Quanto dá? Responda com a letra.", "alternativas": ["132", "480", "124", "24", "47"], "certa": 0, "explicacao": "a) 132"}, {"enunciado": "Quanto é 521 × 74? Responda com a letra.", "alternativas": ["5.731", "2.084", "38.554", "36.470", "5.554"], "certa": 2, "explicacao": "c) 38.554"}, {"enunciado": "Qual destes números é o maior? 6,12, 6,28, 6,4, 6,319 e 6,22 Responda com a letra.", "alternativas": ["6,4", "6,28", "6,12", "6,319", "6,22"], "certa": 0, "explicacao": "a) 6,4"}, {"enunciado": "A turma votou no animal preferido. Resultado — cachorro, 16; gato, 22; peixe, 19; coelho, 6. Quantos alunos votaram? Responda com a letra.", "alternativas": ["22", "73", "63", "4", "57"], "certa": 2, "explicacao": "c) 63"}, {"enunciado": "Leia: “No orçamento da semana, Bianca separou R$ 10 para o lanche.” Nessa frase, <b>orçamento</b> quer dizer… Responda com a letra.", "alternativas": ["o plano do dinheiro que entra e do que vai ser gasto", "o resultado da multiplicação", "três vezes o número", "quando os dois lados do sinal = valem o mesmo", "o dinheiro que sobra no fim do mês"], "certa": 0, "explicacao": "a) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}, {"enunciado": "Uma compra custou R$ 24,68 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 25,32", "R$ 74,68", "R$ 34,68", "R$ 26,32", "R$ 26,00"], "certa": 0, "explicacao": "a) R$ 25,32"}, {"enunciado": "Uma lanchonete tem 4 tipos de pão, 4 de recheio e 2 de suco. Quantos lanches diferentes dá para montar com 1 pão, 1 recheio e 1 suco? Responda com a letra.", "alternativas": ["16", "32", "10", "31", "18"], "certa": 1, "explicacao": "b) 32"}, {"enunciado": "Qual é a área de um retângulo de 4 m por 5 m? Responda com a letra.", "alternativas": ["20 m", "18 m", "40 m²", "9 m²", "20 m²"], "certa": 4, "explicacao": "e) 20 m²"}, {"enunciado": "O jogo começou às 11h23 e durou 2h44. A que horas terminou? Responda com a letra.", "alternativas": ["13h07", "14h23", "8h39", "14h07", "13h67"], "certa": 3, "explicacao": "d) 14h07"}, {"enunciado": "Leia: “Girou <span class=\"fr\"><span>1</span><span>4</span></span> de volta no sentido horário: para a direita.” Nessa frase, <b>sentido horário</b> quer dizer… Responda com a letra.", "alternativas": ["a divisão de alguma coisa entre pessoas", "a hora que o relógio marca", "a chance de algo acontecer", "o mesmo sentido em que giram os ponteiros do relógio", "o dinheiro que volta quando se paga mais que o preço"], "certa": 3, "explicacao": "d) o mesmo sentido em que giram os ponteiros do relógio. Não é “a hora que o relógio marca”: essa é a pegadinha."}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["19.514", "15.914", "11.954", "9.894", "41.915"], "certa": 4, "explicacao": "e) 41.915"}];
const CHAVE='simulado-bonus-mat-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
