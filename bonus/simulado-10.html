<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Como se escreve “duzentos e vinte e sete mil e oitenta e três” com algarismos? Responda com a letra.", "alternativas": ["227.000.083", "22.783", "227.083", "83.227", "227.830"], "certa": 2, "explicacao": "c) 227.083"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (6, 2)? Responda com a letra.", "alternativas": ["6 para a esquerda e 2 para baixo", "8 para a direita", "6 para a direita e 2 para cima", "2 para a direita e 6 para cima", "6 para a direita e 2 para baixo"], "certa": 2, "explicacao": "c) 6 para a direita e 2 para cima"}, {"enunciado": "128 balas foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["125", "160", "32", "128", "96"], "certa": 2, "explicacao": "c) 32"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>23</span><span>9</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["2 <span class=\"fr\"><span>4</span><span>9</span></span>", "2 <span class=\"fr\"><span>5</span><span>23</span></span>", "2 <span class=\"fr\"><span>5</span><span>9</span></span>", "5 <span class=\"fr\"><span>2</span><span>9</span></span>", "3 <span class=\"fr\"><span>5</span><span>9</span></span>"], "certa": 2, "explicacao": "c) 2 <span class=\"fr\"><span>5</span><span>9</span></span>"}, {"enunciado": "O que quer dizer <b>partilha</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número com uma parte inteira e uma fração", "a divisão de alguma coisa entre pessoas", "que aumenta ou diminui na mesma medida", "a troca de uma unidade por outra, sem mudar a medida", "a soma de várias partes"], "certa": 1, "explicacao": "b) a divisão de alguma coisa entre pessoas. Não é “a soma de várias partes”: essa é a pegadinha."}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>6</span></span>, <span class=\"fr\"><span>1</span><span>7</span></span>, <span class=\"fr\"><span>1</span><span>2</span></span> e <span class=\"fr\"><span>1</span><span>3</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>1</span><span>2</span></span>"}, {"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 9; natação, 14; vôlei, 10. Quantos alunos votaram? Responda com a letra.", "alternativas": ["43", "3", "14", "24", "33"], "certa": 4, "explicacao": "e) 33"}, {"enunciado": "Quanto é 6,43 × 7? Responda com a letra.", "alternativas": ["450,1", "4,501", "45,01", "42,301", "4.501"], "certa": 2, "explicacao": "c) 45,01"}, {"enunciado": "Quanto é (10 + 3) × 4? Responda com a letra.", "alternativas": ["17", "43", "22", "65", "52"], "certa": 4, "explicacao": "e) 52"}, {"enunciado": "Leia: “25% é uma porcentagem: 25 de cada 100.” Nessa frase, <b>porcentagem</b> quer dizer… Responda com a letra.", "alternativas": ["as informações que juntamos numa pesquisa", "uma parte de cada 10", "o resultado de juntar tudo", "o dinheiro que volta quando se paga mais que o preço", "uma parte de cada 100"], "certa": 4, "explicacao": "e) uma parte de cada 100. Não é “uma parte de cada 10”: essa é a pegadinha."}, {"enunciado": "Complete: 2.234 mL = <span class=\"caixa\"></span> L. Responda com a letra.", "alternativas": ["2,234", "22,34", "2.234", "0,2234", "2.234.000"], "certa": 0, "explicacao": "a) 2,234"}, {"enunciado": "Arredonde 76.870 para a centena mais próxima. Responda com a letra.", "alternativas": ["76.870", "76.970", "76.900", "77.000", "80.000"], "certa": 2, "explicacao": "c) 76.900"}, {"enunciado": "Quanto é 84.828 − 54.964? Responda com a letra.", "alternativas": ["139.792", "30.144", "30.964", "29.964", "29.864"], "certa": 4, "explicacao": "e) 29.864"}, {"enunciado": "Leia: “O perímetro do quadrado de lado 3 cm é 12 cm.” Nessa frase, <b>perímetro</b> quer dizer… Responda com a letra.", "alternativas": ["a medida do contorno de uma figura", "o espaço de dentro de uma figura", "que aumenta ou diminui na mesma medida", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "o que sobra numa divisão que não é exata"], "certa": 0, "explicacao": "a) a medida do contorno de uma figura. Não é “o espaço de dentro de uma figura”: essa é a pegadinha."}, {"enunciado": "Quantas arestas tem um cubo? Responda com a letra.", "alternativas": ["13", "12", "8", "11", "14"], "certa": 1, "explicacao": "b) 12"}, {"enunciado": "Complete: 0,89 m = <span class=\"caixa\"></span> cm. Responda com a letra.", "alternativas": ["89", "0,0089", "8.900", "8,9", "0,89"], "certa": 0, "explicacao": "a) 89"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 81 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["19%", "81%", "1%", "100%", "8,1%"], "certa": 1, "explicacao": "b) 81%"}, {"enunciado": "Um retângulo de 6 cm por 8 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["144 cm²", "432 cm²", "84 cm", "432 cm", "48 cm²"], "certa": 1, "explicacao": "b) 432 cm²"}, {"enunciado": "Leia: “0,7 são sete décimos.” Nessa frase, <b>décimos</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da divisão", "cada uma das 10 partes iguais de um inteiro", "quanto cabe dentro de um recipiente", "o número 10", "o par de números que diz onde um ponto está"], "certa": 1, "explicacao": "b) cada uma das 10 partes iguais de um inteiro. Não é “o número 10”: essa é a pegadinha."}, {"enunciado": "Calcule 6 × 17 de cabeça, separando 17 em 10 + 7. Quanto dá? Responda com a letra.", "alternativas": ["67", "48", "23", "420", "102"], "certa": 4, "explicacao": "e) 102"}, {"enunciado": "Quanto é 478 × 88? Responda com a letra.", "alternativas": ["38.240", "42.064", "7.648", "2.904", "3.824"], "certa": 1, "explicacao": "b) 42.064"}, {"enunciado": "Qual destes números é o maior? 7,28, 7,24, 7,22, 7,3 e 7,137 Responda com a letra.", "alternativas": ["7,3", "7,28", "7,137", "7,24", "7,22"], "certa": 0, "explicacao": "a) 7,3"}, {"enunciado": "A turma votou na fruta preferida. Resultado — uva, 22; maçã, 18; manga, 6. Quantos alunos votaram? Responda com a letra.", "alternativas": ["56", "40", "22", "3", "46"], "certa": 4, "explicacao": "e) 46"}, {"enunciado": "O que quer dizer <b>proporcional</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o que sobra numa divisão que não é exata", "um número com uma parte inteira e uma fração", "o número que vem logo antes", "que aumenta sempre somando o mesmo tanto", "que aumenta ou diminui na mesma medida"], "certa": 4, "explicacao": "e) que aumenta ou diminui na mesma medida. Não é “que aumenta sempre somando o mesmo tanto”: essa é a pegadinha."}, {"enunciado": "Uma compra custou R$ 13,67 e foi paga com uma nota de R$ 20,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 13,67", "R$ 7,33", "R$ 33,67", "R$ 7,00", "R$ 6,33"], "certa": 4, "explicacao": "e) R$ 6,33"}, {"enunciado": "Bianca tem 2 camisetas e 6 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["24", "11", "8", "12", "6"], "certa": 3, "explicacao": "d) 12"}, {"enunciado": "O filme começou às 15h19 e durou 1h47. A que horas terminou? Responda com a letra.", "alternativas": ["17h19", "13h32", "16h66", "16h06", "17h06"], "certa": 4, "explicacao": "e) 17h06"}, {"enunciado": "A festa começou às 8h42 e durou 3h52. A que horas terminou? Responda com a letra.", "alternativas": ["4h50", "12h34", "11h34", "11h94", "12h42"], "certa": 1, "explicacao": "b) 12h34"}, {"enunciado": "Leia: “As linhas do sinal + são perpendiculares.” Nessa frase, <b>perpendiculares</b> quer dizer… Responda com a letra.", "alternativas": ["quanto uma medida mudou", "o ponto onde dois lados (ou arestas) se encontram", "que cruza outra reta formando um ângulo reto", "que nunca encontra a outra reta", "a medida de uma ponta à outra"], "certa": 2, "explicacao": "c) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["12.478", "9.103", "17.689", "9.130", "9.310"], "certa": 1, "explicacao": "b) 9.103"}];
const CHAVE='simulado-bonus-mat-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
