<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> + 69 = 154 Responda com a letra.", "alternativas": ["69", "223", "85", "95", "154"], "certa": 2, "explicacao": "c) 85"}, {"enunciado": "Numa caixa há 6 bolas brancas e 2 bolas vermelhas. Tirando uma sem olhar, qual é a chance de sair branca? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>6</span><span>2</span></span>", "<span class=\"fr\"><span>6</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>6</span><span>8</span></span>"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (5, 7)? Responda com a letra.", "alternativas": ["5 para a direita e 7 para cima", "7 para a direita e 5 para cima", "12 para a direita", "5 para a esquerda e 7 para baixo", "5 para a direita e 7 para baixo"], "certa": 0, "explicacao": "a) 5 para a direita e 7 para cima"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>13</span><span>4</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["3 <span class=\"fr\"><span>3</span><span>4</span></span>", "1 <span class=\"fr\"><span>3</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>13</span></span>", "4 <span class=\"fr\"><span>1</span><span>4</span></span>"], "certa": 2, "explicacao": "c) 3 <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "O que quer dizer <b>parcela</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado da multiplicação", "um valor aproximado, calculado de cabeça", "cada número que se soma numa adição", "o resultado da adição", "o par de números que diz onde um ponto está"], "certa": 2, "explicacao": "c) cada número que se soma numa adição. Não é “o resultado da adição”: essa é a pegadinha."}, {"enunciado": "Entre as frações <span class=\"fr\"><span>1</span><span>7</span></span>, <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>12</span></span>, <span class=\"fr\"><span>1</span><span>4</span></span> e <span class=\"fr\"><span>1</span><span>2</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>2</span></span>"}, {"enunciado": "A turma votou no esporte preferido. Resultado — natação, 4; basquete, 6; futebol, 23. Quantos alunos votaram? Responda com a letra.", "alternativas": ["29", "23", "43", "33", "3"], "certa": 3, "explicacao": "d) 33"}, {"enunciado": "Quanto é 2,221 × 1.000? Responda com a letra.", "alternativas": ["0,002221", "22.210", "2.221", "222,1", "2,221000"], "certa": 2, "explicacao": "c) 2.221"}, {"enunciado": "Quanto é 39 + 8 × 7? Responda com a letra.", "alternativas": ["95", "54", "103", "329", "2.184"], "certa": 0, "explicacao": "a) 95"}, {"enunciado": "O que quer dizer <b>numerador</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um valor aproximado, calculado de cabeça", "o dinheiro que volta quando se paga mais que o preço", "o número de cima da fração: quantas partes foram pegas", "o número de baixo da fração", "que cruza outra reta formando um ângulo reto"], "certa": 2, "explicacao": "c) o número de cima da fração: quantas partes foram pegas. Não é “o número de baixo da fração”: essa é a pegadinha."}, {"enunciado": "Complete: 633 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["633", "6.330.000", "6.330", "63.300", "633.000"], "certa": 4, "explicacao": "e) 633.000"}, {"enunciado": "Arredonde 30.884 para a centena mais próxima. Responda com a letra.", "alternativas": ["30.984", "30.900", "30.880", "31.000", "30.000"], "certa": 1, "explicacao": "b) 30.900"}, {"enunciado": "Quanto é 73.362 − 28.400? Responda com a letra.", "alternativas": ["101.762", "55.162", "44.962", "55.962", "45.962"], "certa": 2, "explicacao": "c) 44.962"}, {"enunciado": "Quantos lados tem um quadrilátero? Responda com a letra.", "alternativas": ["6", "4", "5", "3", "8"], "certa": 1, "explicacao": "b) 4"}, {"enunciado": "Leia: “Em <span class=\"fr\"><span>3</span><span>8</span></span>, o denominador é 8.” Nessa frase, <b>denominador</b> quer dizer… Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "o par de números que diz onde um ponto está", "três vezes o número", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o número de cima da fração"], "certa": 3, "explicacao": "d) o número de baixo da fração: em quantas partes iguais o inteiro foi dividido. Não é “o número de cima da fração”: essa é a pegadinha."}, {"enunciado": "Quantos vértices tem um paralelepípedo? Responda com a letra.", "alternativas": ["6", "9", "12", "14", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Complete: 7.674 m = <span class=\"caixa\"></span> km. Responda com a letra.", "alternativas": ["76,74", "7,674", "767,4", "7.674", "7.674.000"], "certa": 1, "explicacao": "b) 7,674"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 75 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "7,5%", "75%", "100%", "25%"], "certa": 2, "explicacao": "c) 75%"}, {"enunciado": "O que quer dizer <b>capacidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto o recipiente pesa", "quanto cabe dentro de um recipiente", "a linha onde duas faces de um sólido se encontram", "a medida de uma ponta à outra", "o segmento que liga dois vértices que não são vizinhos"], "certa": 1, "explicacao": "b) quanto cabe dentro de um recipiente. Não é “quanto o recipiente pesa”: essa é a pegadinha."}, {"enunciado": "Quanto é 110 × 800? Responda com a letra.", "alternativas": ["88.000", "880.000", "88", "880", "8.800"], "certa": 0, "explicacao": "a) 88.000"}, {"enunciado": "Quanto é 884 × 29? Responda com a letra.", "alternativas": ["6.906", "9.724", "17.680", "25.636", "7.956"], "certa": 3, "explicacao": "d) 25.636"}, {"enunciado": "Qual destes números é o maior? 4,6, 4,38, 4,28, 4,36 e 4,339 Responda com a letra.", "alternativas": ["4,28", "4,36", "4,6", "4,38", "4,339"], "certa": 2, "explicacao": "c) 4,6"}, {"enunciado": "Numa caixa há 6 bolas verdes e 4 bolas amarelas. Tirando uma sem olhar, qual é a chance de sair verde? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>10</span></span>", "<span class=\"fr\"><span>6</span><span>10</span></span>", "<span class=\"fr\"><span>10</span><span>6</span></span>", "<span class=\"fr\"><span>4</span><span>10</span></span>", "<span class=\"fr\"><span>6</span><span>4</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>6</span><span>10</span></span>"}, {"enunciado": "Leia: “Uma pizza inteira tem <span class=\"fr\"><span>8</span><span>8</span></span>.” Nessa frase, <b>inteira</b> quer dizer… Responda com a letra.", "alternativas": ["quanto tempo algo dura, do começo ao fim", "o par de números que diz onde um ponto está", "a coisa toda, sem faltar nenhuma parte", "duas vezes o número", "um número muito grande"], "certa": 2, "explicacao": "c) a coisa toda, sem faltar nenhuma parte. Não é “um número muito grande”: essa é a pegadinha."}, {"enunciado": "Como se escreve “onze inteiros e vinte e três milésimos” com algarismos? Responda com a letra.", "alternativas": ["11.023", "11,0023", "11,23", "11,023", "11,032"], "certa": 3, "explicacao": "d) 11,023"}, {"enunciado": "Uma compra custou R$ 28,89 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 22,00", "R$ 21,11", "R$ 22,11", "R$ 38,89", "R$ 78,89"], "certa": 1, "explicacao": "b) R$ 21,11"}, {"enunciado": "Bianca tem 5 camisetas e 2 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["20", "9", "10", "5", "7"], "certa": 2, "explicacao": "c) 10"}, {"enunciado": "Qual é o perímetro de um retângulo de 19 m por 14 m? Responda com a letra.", "alternativas": ["66 m²", "33 m", "66 m", "266 m²", "52 m"], "certa": 2, "explicacao": "c) 66 m"}, {"enunciado": "O que quer dizer <b>produto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a linha onde duas faces de um sólido se encontram", "perto de, mais ou menos", "quantas vezes algo aparece", "cada número que se multiplica", "o resultado da multiplicação"], "certa": 4, "explicacao": "e) o resultado da multiplicação. Não é “cada número que se multiplica”: essa é a pegadinha."}, {"enunciado": "A turma votou na cor preferida. Resultado — amarelo, 22; azul, 9; roxo, 6. Quantos alunos votaram? Responda com a letra.", "alternativas": ["31", "3", "22", "47", "37"], "certa": 4, "explicacao": "e) 37"}];
const CHAVE='simulado-bonus-mat-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
