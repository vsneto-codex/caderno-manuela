<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>2</span></span> + <span class=\"fr\"><span>1</span><span>6</span></span>? (A resposta está simplificada.) Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>3</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>5</span><span>8</span></span> de 112? Responda com a letra.", "alternativas": ["19", "14", "560", "42", "70"], "certa": 4, "explicacao": "e) 70"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 14 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "1,4%", "100%", "14%", "86%"], "certa": 3, "explicacao": "d) 14%"}, {"enunciado": "9 canetas custam R$ 36. Quanto custam 2 canetas iguais? Responda com a letra.", "alternativas": ["R$ 38", "R$ 29", "R$ 8", "R$ 4", "R$ 72"], "certa": 2, "explicacao": "c) R$ 8"}, {"enunciado": "Leia: “Paguei com R$ 50,00 uma conta de R$ 37,85 e recebi R$ 12,15 de troco.” Nessa frase, <b>troco</b> quer dizer… Responda com a letra.", "alternativas": ["quanto cabe dentro de um recipiente", "o par de números que diz onde um ponto está", "o dinheiro que volta quando se paga mais que o preço", "o espaço que um objeto ocupa", "o preço da compra"], "certa": 2, "explicacao": "c) o dinheiro que volta quando se paga mais que o preço. Não é “o preço da compra”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 1<span class=\"dest\">2</span>6.348? Responda com a letra.", "alternativas": ["200.000", "2", "26.348", "2.000", "20.000"], "certa": 4, "explicacao": "e) 20.000"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["9.171", "15.034", "50.143", "10.543", "34.051"], "certa": 2, "explicacao": "c) 50.143"}, {"enunciado": "Como se escreve 49% em número decimal? Responda com a letra.", "alternativas": ["0,49", "4,9", "49", "0,049", "0,51"], "certa": 0, "explicacao": "a) 0,49"}, {"enunciado": "Bianca tem 2 camisetas e 4 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["6", "8", "16", "4", "7"], "certa": 1, "explicacao": "b) 8"}, {"enunciado": "O que quer dizer <b>termo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o último número da sequência", "que cruza outra reta formando um ângulo reto", "o número de cima da fração: quantas partes foram pegas", "o que sobra numa divisão que não é exata", "cada número de uma sequência"], "certa": 4, "explicacao": "e) cada número de uma sequência. Não é “o último número da sequência”: essa é a pegadinha."}, {"enunciado": "Um retângulo de 2 cm por 4 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["32 cm", "32 cm²", "16 cm²", "24 cm", "8 cm²"], "certa": 1, "explicacao": "b) 32 cm²"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>69</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["69", "0,69", "0,069", "6,9", "69,100"], "certa": 1, "explicacao": "b) 0,69"}, {"enunciado": "Quanto é 34 + 3 × 2? Responda com a letra.", "alternativas": ["74", "204", "40", "43", "39"], "certa": 2, "explicacao": "c) 40"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["75.802", "75.082", "9.708", "72.805", "70.258"], "certa": 0, "explicacao": "a) 75.802"}, {"enunciado": "O que quer dizer <b>conversão</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a mudança do tamanho da medida", "cada uma das 100 partes iguais de um inteiro", "a troca de uma unidade por outra, sem mudar a medida", "o que se ganha a mais: o preço de venda menos o que custou", "o resultado de juntar tudo"], "certa": 2, "explicacao": "c) a troca de uma unidade por outra, sem mudar a medida. Não é “a mudança do tamanho da medida”: essa é a pegadinha."}, {"enunciado": "O aluguel da quadra custava R$ 192 e teve um aumento de 25%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 288", "R$ 144", "R$ 48", "R$ 240", "R$ 217"], "certa": 3, "explicacao": "d) R$ 240"}, {"enunciado": "Como se escreve “quinze inteiros e cinco centésimos” com algarismos? Responda com a letra.", "alternativas": ["15,5", "15,05", "15,0005", "15,005", "16,05"], "certa": 1, "explicacao": "b) 15,05"}, {"enunciado": "Saindo do ponto (2, 5), ande 1 para a direita e 3 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(3, 8)", "(1, 3)", "(6, 5)", "(8, 3)", "(5, 6)"], "certa": 0, "explicacao": "a) (3, 8)"}, {"enunciado": "78 balas foram divididas entre dois irmãos. Um ficou com o dobro do outro. Com quantas ficou o que recebeu mais? Responda com a letra.", "alternativas": ["104", "78", "26", "39", "52"], "certa": 4, "explicacao": "e) 52"}, {"enunciado": "O que quer dizer <b>equivalente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que vale o mesmo", "o resultado de juntar tudo", "que tem os mesmos números", "o dinheiro que volta quando se paga mais que o preço", "um número com uma parte inteira e uma fração"], "certa": 0, "explicacao": "a) que vale o mesmo. Não é “que tem os mesmos números”: essa é a pegadinha."}, {"enunciado": "Uma torta foi dividida em 12 pedaços iguais e 5 foram comidos. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>7</span><span>12</span></span>", "<span class=\"fr\"><span>12</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>12</span></span>", "<span class=\"fr\"><span>5</span><span>17</span></span>", "<span class=\"fr\"><span>5</span><span>7</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>5</span><span>12</span></span>"}, {"enunciado": "Complete: 2,25 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["22.500", "0,00225", "225", "2,25", "2.250"], "certa": 4, "explicacao": "e) 2.250"}, {"enunciado": "Quanto é 34,3 − 7,23? Responda com a letra.", "alternativas": ["2,707", "270,7", "27,13", "27,07", "41,53"], "certa": 3, "explicacao": "d) 27,07"}, {"enunciado": "A turma votou na fruta preferida. Resultado — banana, 16; uva, 9; manga, 10. Quantos votos banana teve a mais que uva? Responda com a letra.", "alternativas": ["9", "7", "16", "8", "25"], "certa": 1, "explicacao": "b) 7"}, {"enunciado": "Leia: “Jogando uma moeda, há duas possibilidades: cara ou coroa.” Nessa frase, <b>possibilidades</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado que vai acontecer com certeza", "a divisão de alguma coisa entre pessoas", "a chance de algo acontecer", "quanto tempo algo dura, do começo ao fim", "cada resultado que pode acontecer"], "certa": 4, "explicacao": "e) cada resultado que pode acontecer. Não é “o resultado que vai acontecer com certeza”: essa é a pegadinha."}, {"enunciado": "Simplifique <span class=\"fr\"><span>6</span><span>30</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>30</span></span>", "<span class=\"fr\"><span>5</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>3</span><span>15</span></span>", "<span class=\"fr\"><span>1</span><span>15</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>5</span></span>"}, {"enunciado": "Qual destes números é o maior? 1,11, 1,142, 1,52, 1,6 e 1,25 Responda com a letra.", "alternativas": ["1,11", "1,25", "1,52", "1,6", "1,142"], "certa": 3, "explicacao": "d) 1,6"}, {"enunciado": "Pensei num número, multipliquei por 6 e tirei 11. Deu 49. Em que número pensei? Responda com a letra.", "alternativas": ["294", "43", "10", "305", "60"], "certa": 2, "explicacao": "c) 10"}, {"enunciado": "Numa caixa há 2 bolas brancas e 3 bolas pretas. Tirando uma sem olhar, qual é a chance de sair branca? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>5</span><span>2</span></span>", "<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>2</span><span>5</span></span>"}, {"enunciado": "Leia: “A frequência do azul na pesquisa foi 8: oito pessoas escolheram azul.” Nessa frase, <b>frequência</b> quer dizer… Responda com a letra.", "alternativas": ["quantas vezes algo aparece", "que vale o mesmo", "a velocidade de alguma coisa", "o resultado de juntar tudo", "quanto tempo algo dura, do começo ao fim"], "certa": 0, "explicacao": "a) quantas vezes algo aparece. Não é “a velocidade de alguma coisa”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
