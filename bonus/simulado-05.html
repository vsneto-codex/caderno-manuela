<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é <span class=\"fr\"><span>2</span><span>11</span></span> + <span class=\"fr\"><span>4</span><span>11</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>11</span></span>", "<span class=\"fr\"><span>6</span><span>22</span></span>", "<span class=\"fr\"><span>6</span><span>11</span></span>", "<span class=\"fr\"><span>6</span><span>121</span></span>", "<span class=\"fr\"><span>2</span><span>11</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>6</span><span>11</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>7</span><span>9</span></span> de 117? Responda com a letra.", "alternativas": ["26", "13", "91", "20", "819"], "certa": 2, "explicacao": "c) 91"}, {"enunciado": "O que quer dizer 20%? Responda com a letra.", "alternativas": ["20 de cada 100", "20 de cada 10", "1 de cada 20", "80 de cada 100", "20 de cada 1.000"], "certa": 0, "explicacao": "a) 20 de cada 100"}, {"enunciado": "2 figurinhas custam R$ 30. Quanto custam 7 figurinhas iguais? Responda com a letra.", "alternativas": ["R$ 35", "R$ 105", "R$ 15", "R$ 37", "R$ 210"], "certa": 1, "explicacao": "b) R$ 105"}, {"enunciado": "O que quer dizer <b>aproximadamente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o mesmo sentido em que giram os ponteiros do relógio", "perto de, mais ou menos", "exatamente, sem errar nada", "o valor que se tira do preço"], "certa": 2, "explicacao": "c) perto de, mais ou menos. Não é “exatamente, sem errar nada”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 59<span class=\"dest\">8</span>.673? Responda com a letra.", "alternativas": ["80.000", "800", "8.673", "8", "8.000"], "certa": 4, "explicacao": "e) 8.000"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["9.823", "10.411", "9.382", "11.901", "9.328"], "certa": 4, "explicacao": "e) 9.328"}, {"enunciado": "Como se escreve 67% em número decimal? Responda com a letra.", "alternativas": ["0,33", "0,67", "6,7", "67", "0,067"], "certa": 1, "explicacao": "b) 0,67"}, {"enunciado": "Bianca tem 6 camisetas e 3 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["6", "9", "18", "17", "36"], "certa": 2, "explicacao": "c) 18"}, {"enunciado": "Leia: “A expressão (45 − 15) ÷ 6 + 3 × 4 dá 17.” Nessa frase, <b>expressão</b> quer dizer… Responda com a letra.", "alternativas": ["na Matemática, uma conta com várias operações", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "cada uma das 2 partes iguais de um inteiro", "uma cara feita para mostrar o que sente", "que vale o mesmo"], "certa": 0, "explicacao": "a) na Matemática, uma conta com várias operações. Não é “uma cara feita para mostrar o que sente”: essa é a pegadinha."}, {"enunciado": "Um retângulo de 2 cm por 6 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["48 cm", "12 cm²", "108 cm", "36 cm²", "108 cm²"], "certa": 4, "explicacao": "e) 108 cm²"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>19</span><span>10</span></span> em número decimal? Responda com a letra.", "alternativas": ["190", "19,10", "19", "0,19", "1,9"], "certa": 4, "explicacao": "e) 1,9"}, {"enunciado": "Quanto é 8 × 8 − 6 × 9? Responda com a letra.", "alternativas": ["144", "10", "522", "49", "4"], "certa": 1, "explicacao": "b) 10"}, {"enunciado": "Arredonde 71.360 para a centena mais próxima. Responda com a letra.", "alternativas": ["71.400", "71.360", "71.300", "71.000", "71.460"], "certa": 0, "explicacao": "a) 71.400"}, {"enunciado": "O que quer dizer <b>dobro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto tempo algo dura, do começo ao fim", "o número mais 2", "duas vezes o número", "que cruza outra reta formando um ângulo reto", "um número com uma parte inteira e uma fração"], "certa": 2, "explicacao": "c) duas vezes o número. Não é “o número mais 2”: essa é a pegadinha."}, {"enunciado": "A passagem de ônibus do mês custava R$ 530 e teve um aumento de 30%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 159", "R$ 689", "R$ 848", "R$ 371", "R$ 560"], "certa": 1, "explicacao": "b) R$ 689"}, {"enunciado": "Como se escreve “onze inteiros e trinta e seis milésimos” com algarismos? Responda com a letra.", "alternativas": ["11,063", "11,36", "11,036", "11,0036", "11.036"], "certa": 2, "explicacao": "c) 11,036"}, {"enunciado": "Saindo do ponto (4, 2), ande 2 para a direita e 1 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(7, 2)", "(3, 6)", "(2, 1)", "(6, 3)", "(6, 2)"], "certa": 3, "explicacao": "d) (6, 3)"}, {"enunciado": "32 moedas foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["8", "40", "29", "24", "16"], "certa": 0, "explicacao": "a) 8"}, {"enunciado": "Leia: “O volume da caixa é de 24 cubinhos.” Nessa frase, <b>volume</b> quer dizer… Responda com a letra.", "alternativas": ["o espaço que um objeto ocupa", "a área de uma das faces", "um número com uma parte inteira e uma fração", "duas vezes o número", "quantas vezes algo aparece"], "certa": 0, "explicacao": "a) o espaço que um objeto ocupa. Não é “a área de uma das faces”: essa é a pegadinha."}, {"enunciado": "Uma pizza foi dividida em 8 pedaços iguais e 2 foram comidos. Que fração da pizza foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>10</span></span>", "<span class=\"fr\"><span>6</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>6</span></span>", "<span class=\"fr\"><span>8</span><span>2</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>8</span></span>"}, {"enunciado": "Complete: 7,21 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["72,1", "721", "7,21", "0,00721", "7.210"], "certa": 4, "explicacao": "e) 7.210"}, {"enunciado": "Quanto é 6,7 + 8,47? Responda com a letra.", "alternativas": ["9,14", "914", "1,517", "151,7", "15,17"], "certa": 4, "explicacao": "e) 15,17"}, {"enunciado": "A turma votou no animal preferido. Resultado — coelho, 7; cachorro, 16; gato, 11; peixe, 6. Quantos alunos votaram? Responda com a letra.", "alternativas": ["50", "4", "40", "34", "16"], "certa": 2, "explicacao": "c) 40"}, {"enunciado": "O que quer dizer <b>inteiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a coisa toda, sem faltar nenhuma parte", "um valor aproximado, calculado de cabeça", "quanto tempo algo dura, do começo ao fim", "o espaço que um objeto ocupa", "um número muito grande"], "certa": 0, "explicacao": "a) a coisa toda, sem faltar nenhuma parte. Não é “um número muito grande”: essa é a pegadinha."}, {"enunciado": "Simplifique <span class=\"fr\"><span>32</span><span>40</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>40</span></span>", "<span class=\"fr\"><span>4</span><span>20</span></span>", "<span class=\"fr\"><span>16</span><span>20</span></span>", "<span class=\"fr\"><span>5</span><span>4</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "Qual destes números é o maior? 3,55, 3,54, 3,249, 3,7 e 3,65 Responda com a letra.", "alternativas": ["3,65", "3,55", "3,249", "3,7", "3,54"], "certa": 3, "explicacao": "d) 3,7"}, {"enunciado": "Pensei num número, somei 17 e dividi o resultado por 3. Deu 23. Em que número pensei? Responda com a letra.", "alternativas": ["52", "6", "69", "86", "18"], "certa": 0, "explicacao": "a) 52"}, {"enunciado": "Numa caixa há 5 bolas azuis e 6 bolas pretas. Tirando uma sem olhar, qual é a chance de sair azul? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>11</span></span>", "<span class=\"fr\"><span>11</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>11</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>5</span><span>11</span></span>"}, {"enunciado": "Leia: “O produto de 6 por 4 é 24.” Nessa frase, <b>produto</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 100 partes iguais de um inteiro", "o dinheiro que volta quando se paga mais que o preço", "quantas vezes o desenho é maior ou menor que o tamanho real", "cada número que se multiplica", "o resultado da multiplicação"], "certa": 4, "explicacao": "e) o resultado da multiplicação. Não é “cada número que se multiplica”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
