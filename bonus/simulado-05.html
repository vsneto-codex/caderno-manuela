<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>9</span></span> + <span class=\"fr\"><span>5</span><span>9</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>9</span></span>", "<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>6</span><span>81</span></span>", "<span class=\"fr\"><span>6</span><span>18</span></span>", "<span class=\"fr\"><span>5</span><span>9</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>6</span><span>9</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>4</span><span>9</span></span> de 27? Responda com a letra.", "alternativas": ["15", "3", "7", "12", "108"], "certa": 3, "explicacao": "d) 12"}, {"enunciado": "Num quadro de 100 quadradinhos iguais, 56 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["56%", "1%", "5,6%", "100%", "44%"], "certa": 0, "explicacao": "a) 56%"}, {"enunciado": "2 figurinhas custam R$ 30. Quanto custam 7 figurinhas iguais? Responda com a letra.", "alternativas": ["R$ 35", "R$ 105", "R$ 15", "R$ 37", "R$ 210"], "certa": 1, "explicacao": "b) R$ 105"}, {"enunciado": "O que quer dizer <b>classe</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número de cima da fração: quantas partes foram pegas", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "a sala de aula", "o valor que se tira do preço"], "certa": 2, "explicacao": "c) cada grupo de 3 ordens de um número: unidades, milhares, milhões. Não é “a sala de aula”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 59<span class=\"dest\">8</span>.673? Responda com a letra.", "alternativas": ["80.000", "800", "8.673", "8", "8.000"], "certa": 4, "explicacao": "e) 8.000"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["17.958", "59.871", "57.198", "79.851", "9.943"], "certa": 3, "explicacao": "d) 79.851"}, {"enunciado": "Como se escreve 42% em número decimal? Responda com a letra.", "alternativas": ["4,2", "0,58", "0,042", "0,42", "42"], "certa": 3, "explicacao": "d) 0,42"}, {"enunciado": "Bianca tem 6 camisetas e 5 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["60", "11", "29", "6", "30"], "certa": 4, "explicacao": "e) 30"}, {"enunciado": "O que quer dizer <b>aproximadamente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exatamente, sem errar nada", "cada uma das 100 partes iguais de um inteiro", "perto de, mais ou menos", "a troca de uma unidade por outra, sem mudar a medida", "o par de números que diz onde um ponto está"], "certa": 2, "explicacao": "c) perto de, mais ou menos. Não é “exatamente, sem errar nada”: essa é a pegadinha."}, {"enunciado": "Como se chamam duas retas que se cruzam formando um canto igual ao canto de uma folha de papel? Responda com a letra.", "alternativas": ["vértice", "ângulo reto", "ângulo maior que o reto", "perpendiculares", "paralelas"], "certa": 3, "explicacao": "d) perpendiculares"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>1934</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["1,934", "19,34", "0,1934", "1.934", "1934,1000"], "certa": 0, "explicacao": "a) 1,934"}, {"enunciado": "Quanto é (6 + 17) × 5? Responda com a letra.", "alternativas": ["91", "138", "115", "47", "28"], "certa": 2, "explicacao": "c) 115"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["9.743", "40.629", "20.496", "29.604", "20.649"], "certa": 1, "explicacao": "b) 40.629"}, {"enunciado": "O que quer dizer <b>legenda</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o título do gráfico", "cada resultado que pode acontecer", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "do menor para o maior"], "certa": 3, "explicacao": "d) o texto que explica o que cada cor ou símbolo do gráfico quer dizer. Não é “o título do gráfico”: essa é a pegadinha."}, {"enunciado": "A conta de luz custava R$ 200 e teve um aumento de 25%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 225", "R$ 250", "R$ 50", "R$ 150", "R$ 300"], "certa": 1, "explicacao": "b) R$ 250"}, {"enunciado": "Como se escreve “quinze inteiros e um centésimo” com algarismos? Responda com a letra.", "alternativas": ["15,1", "15,0001", "15,01", "16,01", "15,001"], "certa": 2, "explicacao": "c) 15,01"}, {"enunciado": "Saindo do ponto (5, 2), ande 5 para a direita e 2 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(7, 7)", "(4, 10)", "(5, 2)", "(10, 4)", "(10, 2)"], "certa": 3, "explicacao": "d) (10, 4)"}, {"enunciado": "64 bolinhas de gude foram divididas entre dois irmãos. Um ficou com o triplo do outro. Com quantas ficou o que recebeu mais? Responda com a letra.", "alternativas": ["48", "61", "16", "32", "64"], "certa": 0, "explicacao": "a) 48"}, {"enunciado": "Leia: “De 12 °C para 27 °C, a variação foi de 15 °C.” Nessa frase, <b>variação</b> quer dizer… Responda com a letra.", "alternativas": ["números em ordem, seguindo uma regra", "o valor da medida no fim", "quanto uma medida mudou", "perto de, mais ou menos", "cada grupo de 3 ordens de um número: unidades, milhares, milhões"], "certa": 2, "explicacao": "c) quanto uma medida mudou. Não é “o valor da medida no fim”: essa é a pegadinha."}, {"enunciado": "Uma torta foi dividida em 12 pedaços iguais e 4 foram comidos. Que fração da torta foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>12</span></span>", "<span class=\"fr\"><span>4</span><span>12</span></span>", "<span class=\"fr\"><span>4</span><span>8</span></span>", "<span class=\"fr\"><span>4</span><span>16</span></span>", "<span class=\"fr\"><span>12</span><span>4</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>4</span><span>12</span></span>"}, {"enunciado": "A turma votou na cor preferida. Resultado — azul, 17; verde, 8; amarelo, 12; roxo, 20. Quantos votos roxo teve a mais que verde? Responda com a letra.", "alternativas": ["12", "28", "20", "8", "13"], "certa": 0, "explicacao": "a) 12"}, {"enunciado": "Quanto é 4,5 + 8,42? Responda com a letra.", "alternativas": ["129,2", "12,92", "887", "1,292", "8,87"], "certa": 1, "explicacao": "b) 12,92"}, {"enunciado": "A turma votou na fruta preferida. Resultado — banana, 4; maçã, 10; uva, 14; manga, 5. Quantos votos uva teve a mais que banana? Responda com a letra.", "alternativas": ["10", "14", "4", "11", "18"], "certa": 0, "explicacao": "a) 10"}, {"enunciado": "Leia: “A frequência do azul na pesquisa foi 8: oito pessoas escolheram azul.” Nessa frase, <b>frequência</b> quer dizer… Responda com a letra.", "alternativas": ["quantas vezes algo aparece", "a velocidade de alguma coisa", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o que sobra numa divisão que não é exata", "o par de números que diz onde um ponto está"], "certa": 0, "explicacao": "a) quantas vezes algo aparece. Não é “a velocidade de alguma coisa”: essa é a pegadinha."}, {"enunciado": "Simplifique <span class=\"fr\"><span>48</span><span>54</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>27</span></span>", "<span class=\"fr\"><span>8</span><span>54</span></span>", "<span class=\"fr\"><span>8</span><span>9</span></span>", "<span class=\"fr\"><span>24</span><span>27</span></span>", "<span class=\"fr\"><span>9</span><span>8</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>8</span><span>9</span></span>"}, {"enunciado": "Qual destes números é o maior? 7,64, 7,57, 7,107, 7,9 e 7,88 Responda com a letra.", "alternativas": ["7,64", "7,9", "7,88", "7,107", "7,57"], "certa": 1, "explicacao": "b) 7,9"}, {"enunciado": "Pensei num número, multipliquei por 5 e tirei 3. Deu 47. Em que número pensei? Responda com a letra.", "alternativas": ["238", "235", "10", "50", "42"], "certa": 2, "explicacao": "c) 10"}, {"enunciado": "Um retângulo de 4 cm por 7 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["28 cm²", "252 cm", "252 cm²", "66 cm", "84 cm²"], "certa": 2, "explicacao": "c) 252 cm²"}, {"enunciado": "O que quer dizer <b>possibilidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada resultado que pode acontecer", "o dinheiro que volta quando se paga mais que o preço", "a divisão de alguma coisa entre pessoas", "quanto uma medida mudou", "o resultado que vai acontecer com certeza"], "certa": 0, "explicacao": "a) cada resultado que pode acontecer. Não é “o resultado que vai acontecer com certeza”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
