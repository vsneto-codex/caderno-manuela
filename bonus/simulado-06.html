<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 6 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Pensei num número, somei 12 e dividi o resultado por 2. Deu 22. Em que número pensei? Responda com a letra.", "alternativas": ["32", "20", "10", "56", "44"], "certa": 0, "explicacao": "a) 32"}, {"enunciado": "Calcule 3 × 22 de cabeça, separando 22 em 20 + 2. Quanto dá? Responda com a letra.", "alternativas": ["62", "66", "120", "25", "12"], "certa": 1, "explicacao": "b) 66"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (2, 6)? Responda com a letra.", "alternativas": ["6 para a direita e 2 para cima", "2 para a direita e 6 para cima", "8 para a direita", "2 para a direita e 6 para baixo", "2 para a esquerda e 6 para baixo"], "certa": 1, "explicacao": "b) 2 para a direita e 6 para cima"}, {"enunciado": "Um retângulo de 8 cm por 2 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["144 cm", "60 cm", "16 cm²", "144 cm²", "48 cm²"], "certa": 3, "explicacao": "d) 144 cm²"}, {"enunciado": "O que quer dizer <b>variação</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o valor da medida no fim", "cada número de uma sequência", "as informações que juntamos numa pesquisa", "quanto uma medida mudou"], "certa": 4, "explicacao": "e) quanto uma medida mudou. Não é “o valor da medida no fim”: essa é a pegadinha."}, {"enunciado": "Saindo do ponto (3, 1), ande 5 para a direita e 4 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(7, 6)", "(5, 4)", "(8, 1)", "(8, 5)", "(5, 8)"], "certa": 3, "explicacao": "d) (8, 5)"}, {"enunciado": "A viagem começou às 10h38 e durou 1h24. A que horas terminou? Responda com a letra.", "alternativas": ["11h62", "12h02", "12h38", "11h02", "9h14"], "certa": 1, "explicacao": "b) 12h02"}, {"enunciado": "Quanto é 56,22 × 10? Responda com a letra.", "alternativas": ["56,220", "562,2", "56,22", "5,622", "5.622"], "certa": 1, "explicacao": "b) 562,2"}, {"enunciado": "Quanto é 252 × 79? Responda com a letra.", "alternativas": ["2.268", "5.398", "19.908", "17.640", "4.032"], "certa": 2, "explicacao": "c) 19.908"}, {"enunciado": "Leia: “Na escala do mapa, 1 cm vale 1 km.” Nessa frase, <b>escala</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da divisão", "a coisa toda, sem faltar nenhuma parte", "o valor que se tira do preço", "uma escada pequena", "quantas vezes o desenho é maior ou menor que o tamanho real"], "certa": 4, "explicacao": "e) quantas vezes o desenho é maior ou menor que o tamanho real. Não é “uma escada pequena”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>156</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["1,56", "156,1000", "0,156", "0,0156", "156"], "certa": 2, "explicacao": "c) 0,156"}, {"enunciado": "Quanto é 50% de 74? Responda com a letra.", "alternativas": ["124", "24", "37", "370", "3.700"], "certa": 2, "explicacao": "c) 37"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["9.457", "18.146", "9.547", "13.123", "9.475"], "certa": 0, "explicacao": "a) 9.457"}, {"enunciado": "O que quer dizer <b>capacidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quanto o recipiente pesa", "o par de números que diz onde um ponto está", "uma parte de cada 100", "quanto cabe dentro de um recipiente", "quando os dois lados do sinal = valem o mesmo"], "certa": 3, "explicacao": "d) quanto cabe dentro de um recipiente. Não é “quanto o recipiente pesa”: essa é a pegadinha."}, {"enunciado": "Na sequência 30; 35; 40; 45; … qual é o 13º número? Responda com a letra.", "alternativas": ["65", "95", "50", "90", "85"], "certa": 3, "explicacao": "d) 90"}, {"enunciado": "9 sorvetes custam R$ 27. Quanto custam 2 sorvetes iguais? Responda com a letra.", "alternativas": ["R$ 29", "R$ 20", "R$ 6", "R$ 3", "R$ 54"], "certa": 2, "explicacao": "c) R$ 6"}, {"enunciado": "Como se escreve “duzentos e oitenta e três mil e quarenta e oito” com algarismos? Responda com a letra.", "alternativas": ["283.048", "283.480", "283.000.048", "28.348", "48.283"], "certa": 0, "explicacao": "a) 283.048"}, {"enunciado": "De manhã fazia 20 °C. À tarde, 32 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["12 °C", "32 °C", "20 °C", "52 °C", "13 °C"], "certa": 0, "explicacao": "a) 12 °C"}, {"enunciado": "O que quer dizer <b>múltiplo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a linha onde duas faces de um sólido se encontram", "um número que está na tabuada de outro", "um número que divide o outro sem sobrar nada", "as informações que juntamos numa pesquisa", "um número com uma parte inteira e uma fração"], "certa": 1, "explicacao": "b) um número que está na tabuada de outro. Não é “um número que divide o outro sem sobrar nada”: essa é a pegadinha."}, {"enunciado": "Simplifique <span class=\"fr\"><span>48</span><span>54</span></span> até não dar mais. Qual é a fração mais simples? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>9</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>27</span></span>", "<span class=\"fr\"><span>24</span><span>27</span></span>", "<span class=\"fr\"><span>8</span><span>54</span></span>", "<span class=\"fr\"><span>8</span><span>9</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>8</span><span>9</span></span>"}, {"enunciado": "A turma votou no esporte preferido. Resultado — vôlei, 21; basquete, 24; futebol, 7; natação, 20. Quantos votos vôlei teve a mais que natação? Responda com a letra.", "alternativas": ["41", "20", "21", "2", "1"], "certa": 4, "explicacao": "e) 1"}, {"enunciado": "Saindo do ponto (3, 1), ande 2 para a direita e 3 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(4, 5)", "(6, 3)", "(2, 3)", "(5, 4)", "(5, 1)"], "certa": 3, "explicacao": "d) (5, 4)"}, {"enunciado": "Qual destes números é divisível por 5? Responda com a letra.", "alternativas": ["8.440", "5.688", "8.356", "5.977", "5.744"], "certa": 0, "explicacao": "a) 8.440"}, {"enunciado": "Leia: “O cubo tem 12 arestas.” Nessa frase, <b>arestas</b> quer dizer… Responda com a letra.", "alternativas": ["a linha onde duas faces de um sólido se encontram", "a parte plana de um sólido", "o resultado da divisão", "o espaço que um objeto ocupa", "o número que vem logo antes"], "certa": 0, "explicacao": "a) a linha onde duas faces de um sólido se encontram. Não é “a parte plana de um sólido”: essa é a pegadinha."}, {"enunciado": "Qual destes números é o maior? 0,256, 0,151, 0,15, 0,21 e 0,3 Responda com a letra.", "alternativas": ["0,21", "0,15", "0,151", "0,256", "0,3"], "certa": 4, "explicacao": "e) 0,3"}, {"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>6</span></span> + <span class=\"fr\"><span>4</span><span>6</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>36</span></span>", "<span class=\"fr\"><span>4</span><span>6</span></span>", "<span class=\"fr\"><span>3</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>12</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>5</span><span>6</span></span>"}, {"enunciado": "Arredonde 37.268 para o milhar mais próximo. Responda com a letra.", "alternativas": ["40.000", "37.300", "37.270", "38.000", "37.000"], "certa": 4, "explicacao": "e) 37.000"}, {"enunciado": "Quanto é 52.192 − 49.687? Responda com a letra.", "alternativas": ["2.505", "101.879", "17.515", "2.515", "13.515"], "certa": 0, "explicacao": "a) 2.505"}, {"enunciado": "O que quer dizer <b>milésimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o número 1.000", "uma parte de cada 100", "cada uma das 1.000 partes iguais de um inteiro", "o segmento que liga dois vértices que não são vizinhos", "cada uma das 100 partes iguais de um inteiro"], "certa": 2, "explicacao": "c) cada uma das 1.000 partes iguais de um inteiro. Não é “o número 1.000”: essa é a pegadinha."}, {"enunciado": "Complete: 9.086 cm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["0,9086", "908,6", "9.086", "908.600", "90,86"], "certa": 4, "explicacao": "e) 90,86"}];
const CHAVE='simulado-bonus-mat-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
