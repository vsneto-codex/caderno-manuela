<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (4, 5)? Responda com a letra.", "alternativas": ["5 para a direita e 4 para cima", "9 para a direita", "4 para a esquerda e 5 para baixo", "4 para a direita e 5 para baixo", "4 para a direita e 5 para cima"], "certa": 4, "explicacao": "e) 4 para a direita e 5 para cima"}, {"enunciado": "Quanto é 20 × 300? Responda com a letra.", "alternativas": ["6.000", "60.000", "6", "600", "60"], "certa": 0, "explicacao": "a) 6.000"}, {"enunciado": "Quanto é 10% de 340? Responda com a letra.", "alternativas": ["340", "330", "306", "350", "34"], "certa": 4, "explicacao": "e) 34"}, {"enunciado": "A turma votou na cor preferida. Resultado — roxo, 22; amarelo, 13; verde, 19. Quantos votos roxo teve a mais que amarelo? Responda com a letra.", "alternativas": ["10", "35", "22", "9", "13"], "certa": 3, "explicacao": "d) 9"}, {"enunciado": "O que quer dizer <b>paralelogramo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["quantas vezes o desenho é maior ou menor que o tamanho real", "a chance de algo acontecer", "o quadrilátero que tem 2 pares de lados paralelos", "quanto tempo algo dura, do começo ao fim", "qualquer figura de 4 lados"], "certa": 2, "explicacao": "c) o quadrilátero que tem 2 pares de lados paralelos. Não é “qualquer figura de 4 lados”: essa é a pegadinha."}, {"enunciado": "Um retângulo de 7 cm por 3 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["189 cm²", "189 cm", "60 cm", "21 cm²", "63 cm²"], "certa": 0, "explicacao": "a) 189 cm²"}, {"enunciado": "Quanto é 76.361 − 65.285? Responda com a letra.", "alternativas": ["11.086", "11.124", "11.076", "11.186", "141.646"], "certa": 2, "explicacao": "c) 11.076"}, {"enunciado": "De manhã fazia 18 °C. À tarde, 25 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["25 °C", "8 °C", "7 °C", "43 °C", "18 °C"], "certa": 2, "explicacao": "c) 7 °C"}, {"enunciado": "Quanto é 803 × 18? Responda com a letra.", "alternativas": ["8.434", "6.424", "7.227", "14.454", "8.030"], "certa": 3, "explicacao": "d) 14.454"}, {"enunciado": "Leia: “24 é múltiplo de 6, porque 6 × 4 = 24.” Nessa frase, <b>múltiplo</b> quer dizer… Responda com a letra.", "alternativas": ["um número que está na tabuada de outro", "um número que divide o outro sem sobrar nada", "o que sobra numa divisão que não é exata", "cada uma das 10 partes iguais de um inteiro", "cada grupo de 3 ordens de um número: unidades, milhares, milhões"], "certa": 0, "explicacao": "a) um número que está na tabuada de outro. Não é “um número que divide o outro sem sobrar nada”: essa é a pegadinha."}, {"enunciado": "Complete: 849 L = <span class=\"caixa\"></span> mL. Responda com a letra.", "alternativas": ["849.000", "8.490", "849", "8.490.000", "0,849"], "certa": 0, "explicacao": "a) 849.000"}, {"enunciado": "Na sequência 8; 10; 12; 14; … qual é o 17º número? Responda com a letra.", "alternativas": ["42", "16", "40", "38", "34"], "certa": 2, "explicacao": "c) 40"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["9.356", "12.701", "12.015", "9.365", "9.563"], "certa": 0, "explicacao": "a) 9.356"}, {"enunciado": "5 lápis custam R$ 35. Quanto custam 6 lápis iguais? Responda com a letra.", "alternativas": ["R$ 210", "R$ 36", "R$ 41", "R$ 7", "R$ 42"], "certa": 4, "explicacao": "e) R$ 42"}, {"enunciado": "O que quer dizer <b>aresta</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número com uma parte inteira e uma fração", "o quadrilátero que tem 2 pares de lados paralelos", "a linha onde duas faces de um sólido se encontram", "a parte plana de um sólido", "quando os dois lados do sinal = valem o mesmo"], "certa": 2, "explicacao": "c) a linha onde duas faces de um sólido se encontram. Não é “a parte plana de um sólido”: essa é a pegadinha."}, {"enunciado": "Quantos lados tem um hexágono? Responda com a letra.", "alternativas": ["7", "8", "6", "5", "12"], "certa": 2, "explicacao": "c) 6"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>69</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["69", "6,9", "0,69", "0,069", "69,100"], "certa": 2, "explicacao": "c) 0,69"}, {"enunciado": "Numa caixa há 6 bolas brancas e 7 bolas azuis. Tirando uma sem olhar, qual é a chance de sair branca? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>13</span></span>", "<span class=\"fr\"><span>13</span><span>6</span></span>", "<span class=\"fr\"><span>6</span><span>13</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>6</span><span>13</span></span>"}, {"enunciado": "Quanto vale o algarismo destacado em 5<span class=\"dest\">6</span>7.423? Responda com a letra.", "alternativas": ["6.000", "600.000", "67.423", "6", "60.000"], "certa": 4, "explicacao": "e) 60.000"}, {"enunciado": "Leia: “<span class=\"fr\"><span>1</span><span>2</span></span> e <span class=\"fr\"><span>2</span><span>4</span></span> são frações equivalentes.” Nessa frase, <b>equivalentes</b> quer dizer… Responda com a letra.", "alternativas": ["que tem os mesmos números", "que vale o mesmo", "o par de números que diz onde um ponto está", "três vezes o número", "o resultado da divisão"], "certa": 1, "explicacao": "b) que vale o mesmo. Não é “que tem os mesmos números”: essa é a pegadinha."}, {"enunciado": "Quanto é 9,41 × 9? Responda com a letra.", "alternativas": ["8.469", "81,369", "8,469", "84,69", "846,9"], "certa": 3, "explicacao": "d) 84,69"}, {"enunciado": "Um retângulo de 3 cm por 5 cm foi ampliado: cada lado ficou com o dobro do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["32 cm", "60 cm²", "15 cm²", "30 cm²", "60 cm"], "certa": 1, "explicacao": "b) 60 cm²"}, {"enunciado": "Qual fração é equivalente a <span class=\"fr\"><span>1</span><span>6</span></span> (vale o mesmo)? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>30</span></span>", "<span class=\"fr\"><span>6</span><span>11</span></span>", "<span class=\"fr\"><span>1</span><span>30</span></span>", "<span class=\"fr\"><span>6</span><span>1</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>5</span><span>30</span></span>"}, {"enunciado": "Numa caixa há 9 bolas vermelhas e 1 bola amarela. Tirando uma sem olhar, qual é a chance de sair vermelha? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>9</span><span>1</span></span>", "<span class=\"fr\"><span>1</span><span>10</span></span>", "<span class=\"fr\"><span>10</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>9</span><span>10</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>9</span><span>10</span></span>"}, {"enunciado": "O que quer dizer <b>comprimento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada uma das 10 partes iguais de um inteiro", "a medida de uma ponta à outra", "o ponto onde dois lados (ou arestas) se encontram", "duas vezes o número", "o peso de um objeto"], "certa": 1, "explicacao": "b) a medida de uma ponta à outra. Não é “o peso de um objeto”: essa é a pegadinha."}, {"enunciado": "Qual destes números é divisor de 45? Responda com a letra.", "alternativas": ["15", "32", "90", "18", "135"], "certa": 0, "explicacao": "a) 15"}, {"enunciado": "Como se escreve “dezesseis inteiros e cinquenta e oito milésimos” com algarismos? Responda com a letra.", "alternativas": ["16.058", "16,58", "16,0058", "16,058", "16,085"], "certa": 3, "explicacao": "d) 16,058"}, {"enunciado": "Qual destes números é o maior? 0,24, 0,21, 0,229, 0,3 e 0,28 Responda com a letra.", "alternativas": ["0,229", "0,21", "0,24", "0,3", "0,28"], "certa": 3, "explicacao": "d) 0,3"}, {"enunciado": "O filme começou às 10h47 e durou 1h21. A que horas terminou? Responda com a letra.", "alternativas": ["11h08", "11h68", "12h08", "12h47", "9h26"], "certa": 2, "explicacao": "c) 12h08"}, {"enunciado": "Leia: “O tênis de R$ 200 teve R$ 50 de desconto e saiu por R$ 150.” Nessa frase, <b>desconto</b> quer dizer… Responda com a letra.", "alternativas": ["o valor que se tira do preço", "as informações que juntamos numa pesquisa", "o preço que se paga no fim", "cada grupo de 3 ordens de um número: unidades, milhares, milhões", "a divisão de alguma coisa entre pessoas"], "certa": 0, "explicacao": "a) o valor que se tira do preço. Não é “o preço que se paga no fim”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
