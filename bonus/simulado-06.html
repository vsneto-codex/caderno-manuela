<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Pensei num número, somei 12 e dividi o resultado por 2. Deu 22. Em que número pensei? Responda com a letra.", "alternativas": ["32", "20", "10", "56", "44"], "certa": 0, "explicacao": "a) 32"}, {"enunciado": "Calcule 3 × 22 de cabeça, separando 22 em 20 + 2. Quanto dá? Responda com a letra.", "alternativas": ["62", "66", "120", "25", "12"], "certa": 1, "explicacao": "b) 66"}, {"enunciado": "Saindo do ponto (0, 0), como se chega ao ponto (2, 6)? Responda com a letra.", "alternativas": ["6 para a direita e 2 para cima", "2 para a direita e 6 para cima", "8 para a direita", "2 para a direita e 6 para baixo", "2 para a esquerda e 6 para baixo"], "certa": 1, "explicacao": "b) 2 para a direita e 6 para cima"}, {"enunciado": "Um retângulo de 8 cm por 2 cm foi ampliado: cada lado ficou com o triplo do tamanho. Qual é a área do retângulo novo? Responda com a letra.", "alternativas": ["144 cm", "60 cm", "16 cm²", "144 cm²", "48 cm²"], "certa": 3, "explicacao": "d) 144 cm²"}, {"enunciado": "O que quer dizer <b>variação</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida de uma ponta à outra", "o valor da medida no fim", "cada número de uma sequência", "as informações que juntamos numa pesquisa", "quanto uma medida mudou"], "certa": 4, "explicacao": "e) quanto uma medida mudou. Não é “o valor da medida no fim”: essa é a pegadinha."}, {"enunciado": "Quantos lados tem um eneágono? Responda com a letra.", "alternativas": ["8", "9", "11", "18", "10"], "certa": 1, "explicacao": "b) 9"}, {"enunciado": "A aula de natação começou às 15h22 e durou 1h44. A que horas terminou? Responda com a letra.", "alternativas": ["17h22", "16h06", "17h06", "13h38", "16h66"], "certa": 2, "explicacao": "c) 17h06"}, {"enunciado": "Quanto é 3,74 × 2? Responda com a letra.", "alternativas": ["0,748", "748", "6,148", "7,48", "74,8"], "certa": 3, "explicacao": "d) 7,48"}, {"enunciado": "Quanto é 221 × 45? Responda com a letra.", "alternativas": ["9.945", "8.840", "1.105", "8.845", "1.989"], "certa": 0, "explicacao": "a) 9.945"}, {"enunciado": "Leia: “Na partilha das 12 balas, cada um dos 3 irmãos ficou com 4.” Nessa frase, <b>partilha</b> quer dizer… Responda com a letra.", "alternativas": ["um valor aproximado, calculado de cabeça", "que vale o mesmo", "o dinheiro que volta quando se paga mais que o preço", "a soma de várias partes", "a divisão de alguma coisa entre pessoas"], "certa": 4, "explicacao": "e) a divisão de alguma coisa entre pessoas. Não é “a soma de várias partes”: essa é a pegadinha."}, {"enunciado": "Como se escreve <span class=\"fr\"><span>114</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["1,14", "114", "11,4", "114,100", "0,114"], "certa": 0, "explicacao": "a) 1,14"}, {"enunciado": "Quanto é 75% de 52? Responda com a letra.", "alternativas": ["13", "39", "3.900", "127", "390"], "certa": 1, "explicacao": "b) 39"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["47.284", "47.248", "42.874", "9.243", "47.428"], "certa": 4, "explicacao": "e) 47.428"}, {"enunciado": "O que quer dizer <b>equivalente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem os mesmos números", "que vale o mesmo", "um número com uma parte inteira e uma fração", "o resultado de juntar tudo", "do menor para o maior"], "certa": 1, "explicacao": "b) que vale o mesmo. Não é “que tem os mesmos números”: essa é a pegadinha."}, {"enunciado": "Na sequência 22; 25; 28; 31; … qual é o 11º número? Responda com a letra.", "alternativas": ["49", "33", "55", "34", "52"], "certa": 4, "explicacao": "e) 52"}, {"enunciado": "6 figurinhas custam R$ 84. Quanto custam 8 figurinhas iguais? Responda com a letra.", "alternativas": ["R$ 86", "R$ 14", "R$ 672", "R$ 92", "R$ 112"], "certa": 4, "explicacao": "e) R$ 112"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["54.203", "42.035", "32.540", "42.305", "9.604"], "certa": 0, "explicacao": "a) 54.203"}, {"enunciado": "De manhã fazia 12 °C. À tarde, 19 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["12 °C", "31 °C", "8 °C", "19 °C", "7 °C"], "certa": 4, "explicacao": "e) 7 °C"}, {"enunciado": "O que quer dizer <b>perímetro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida do contorno de uma figura", "quanto uma medida mudou", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "o espaço de dentro de uma figura", "o que se ganha a mais: o preço de venda menos o que custou"], "certa": 0, "explicacao": "a) a medida do contorno de uma figura. Não é “o espaço de dentro de uma figura”: essa é a pegadinha."}, {"enunciado": "Qual fração é equivalente a <span class=\"fr\"><span>1</span><span>4</span></span> (vale o mesmo)? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>4</span><span>1</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>2</span><span>8</span></span>"}, {"enunciado": "A turma votou na fruta preferida. Resultado — banana, 18; manga, 4; maçã, 5; uva, 13. Quantos votos banana teve a mais que manga? Responda com a letra.", "alternativas": ["18", "4", "15", "22", "14"], "certa": 4, "explicacao": "e) 14"}, {"enunciado": "Saindo do ponto (3, 4), ande 4 para a direita e 1 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(7, 5)", "(8, 4)", "(4, 1)", "(4, 8)", "(5, 7)"], "certa": 0, "explicacao": "a) (7, 5)"}, {"enunciado": "Qual destes números é divisor de 28? Responda com a letra.", "alternativas": ["84", "14", "20", "56", "27"], "certa": 1, "explicacao": "b) 14"}, {"enunciado": "O que quer dizer <b>algarismo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a medida do contorno de uma figura", "a chance de algo acontecer", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "o mesmo que número", "o resultado da subtração"], "certa": 2, "explicacao": "c) cada um dos símbolos de 0 a 9 que usamos para escrever os números. Não é “o mesmo que número”: essa é a pegadinha."}, {"enunciado": "Qual destes números é o maior? 6,5, 6,34, 6,376, 6,22 e 6,305 Responda com a letra.", "alternativas": ["6,22", "6,376", "6,5", "6,34", "6,305"], "certa": 2, "explicacao": "c) 6,5"}, {"enunciado": "Quanto é <span class=\"fr\"><span>4</span><span>8</span></span> + <span class=\"fr\"><span>2</span><span>8</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>8</span></span>", "<span class=\"fr\"><span>6</span><span>8</span></span>", "<span class=\"fr\"><span>6</span><span>64</span></span>", "<span class=\"fr\"><span>6</span><span>16</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>6</span><span>8</span></span>"}, {"enunciado": "Arredonde 24.369 para o milhar mais próximo. Responda com a letra.", "alternativas": ["24.000", "24.400", "20.000", "25.000", "24.370"], "certa": 0, "explicacao": "a) 24.000"}, {"enunciado": "Quanto é 17.805 + 7.770? Responda com a letra.", "alternativas": ["25.575", "14.575", "10.035", "34.575", "1.141.575"], "certa": 0, "explicacao": "a) 25.575"}, {"enunciado": "O que quer dizer <b>múltiplo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada número que se soma numa adição", "um número que divide o outro sem sobrar nada", "um número que está na tabuada de outro", "o que se ganha a mais: o preço de venda menos o que custou", "o que sobra numa divisão que não é exata"], "certa": 2, "explicacao": "c) um número que está na tabuada de outro. Não é “um número que divide o outro sem sobrar nada”: essa é a pegadinha."}, {"enunciado": "Complete: 8.182 cm = <span class=\"caixa\"></span> m. Responda com a letra.", "alternativas": ["818,2", "8.182", "81,82", "0,8182", "8,182"], "certa": 2, "explicacao": "c) 81,82"}];
const CHAVE='simulado-bonus-mat-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
