<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Num quadro de 100 quadradinhos iguais, 78 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "78%", "22%", "7,8%", "100%"], "certa": 1, "explicacao": "b) 78%"}, {"enunciado": "Qual destes números é divisível por 2? Responda com a letra.", "alternativas": ["5.240", "8.003", "8.935", "8.975", "4.483"], "certa": 0, "explicacao": "a) 5.240"}, {"enunciado": "A turma votou no animal preferido. Resultado — peixe, 19; gato, 18; coelho, 12; cachorro, 22. Quantos votos peixe teve a mais que gato? Responda com a letra.", "alternativas": ["18", "37", "2", "19", "1"], "certa": 4, "explicacao": "e) 1"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>13</span><span>4</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["3 <span class=\"fr\"><span>1</span><span>4</span></span>", "4 <span class=\"fr\"><span>1</span><span>4</span></span>", "3 <span class=\"fr\"><span>1</span><span>13</span></span>", "1 <span class=\"fr\"><span>3</span><span>4</span></span>", "3 <span class=\"fr\"><span>3</span><span>4</span></span>"], "certa": 0, "explicacao": "a) 3 <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "O que quer dizer <b>proporcional</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que aumenta sempre somando o mesmo tanto", "que vale o mesmo", "que aumenta ou diminui na mesma medida", "duas vezes o número", "números em ordem, seguindo uma regra"], "certa": 2, "explicacao": "c) que aumenta ou diminui na mesma medida. Não é “que aumenta sempre somando o mesmo tanto”: essa é a pegadinha."}, {"enunciado": "Calcule 7 × 45 de cabeça, separando 45 em 40 + 5. Quanto dá? Responda com a letra.", "alternativas": ["315", "63", "52", "1.400", "285"], "certa": 0, "explicacao": "a) 315"}, {"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 11; natação, 3; futebol, 15. Quantos votos futebol teve a mais que basquete? Responda com a letra.", "alternativas": ["15", "5", "26", "4", "11"], "certa": 3, "explicacao": "d) 4"}, {"enunciado": "Uma pizza foi dividida em 7 pedaços iguais e 3 foram comidos. Que fração da pizza foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>7</span></span>", "<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>", "<span class=\"fr\"><span>3</span><span>10</span></span>", "<span class=\"fr\"><span>7</span><span>3</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>3</span><span>7</span></span>"}, {"enunciado": "Leia: “As linhas do sinal + são perpendiculares.” Nessa frase, <b>perpendiculares</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da divisão", "quando os dois lados do sinal = valem o mesmo", "que cruza outra reta formando um ângulo reto", "quantas vezes o desenho é maior ou menor que o tamanho real", "que nunca encontra a outra reta"], "certa": 2, "explicacao": "c) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Uma lanchonete tem 4 tipos de pão, 4 de recheio e 3 de suco. Quantos lanches diferentes dá para montar com 1 pão, 1 recheio e 1 suco? Responda com a letra.", "alternativas": ["11", "47", "48", "16", "19"], "certa": 2, "explicacao": "c) 48"}, {"enunciado": "Uma compra custou R$ 37,76 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 27,76", "R$ 13,24", "R$ 87,76", "R$ 13,00", "R$ 12,24"], "certa": 4, "explicacao": "e) R$ 12,24"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>1</span><span>10</span></span> em número decimal? Responda com a letra.", "alternativas": ["0,01", "0,1", "1,10", "10", "1"], "certa": 1, "explicacao": "b) 0,1"}, {"enunciado": "Quantas arestas tem um prisma de base pentagonal? Responda com a letra.", "alternativas": ["17", "16", "14", "10", "15"], "certa": 4, "explicacao": "e) 15"}, {"enunciado": "Leia: “Na sequência 5, 10, 15, 20, a regra é somar 5.” Nessa frase, <b>sequência</b> quer dizer… Responda com a letra.", "alternativas": ["a medida do contorno de uma figura", "duas vezes o número", "números em ordem, seguindo uma regra", "o valor que se tira do preço", "números escolhidos ao acaso"], "certa": 2, "explicacao": "c) números em ordem, seguindo uma regra. Não é “números escolhidos ao acaso”: essa é a pegadinha."}, {"enunciado": "Como se escreve “onze inteiros e oitenta e cinco milésimos” com algarismos? Responda com a letra.", "alternativas": ["11,85", "11,085", "11,0085", "11.085", "11,058"], "certa": 1, "explicacao": "b) 11,085"}, {"enunciado": "Quanto é 13,2 − 9,03? Responda com a letra.", "alternativas": ["41,7", "4,17", "4,23", "0,417", "22,23"], "certa": 1, "explicacao": "b) 4,17"}, {"enunciado": "Complete: 48 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["48", "480", "0,048", "480.000", "48.000"], "certa": 4, "explicacao": "e) 48.000"}, {"enunciado": "Leia: “As coordenadas do ponto são (4, 2).” Nessa frase, <b>coordenadas</b> quer dizer… Responda com a letra.", "alternativas": ["o par de números que diz onde um ponto está", "cada número de uma sequência", "cada uma das 10 partes iguais de um inteiro", "na Matemática, uma conta com várias operações", "as cores de um mapa"], "certa": 0, "explicacao": "a) o par de números que diz onde um ponto está. Não é “as cores de um mapa”: essa é a pegadinha."}, {"enunciado": "Complete: 499 m = <span class=\"caixa\"></span> cm. Responda com a letra.", "alternativas": ["499", "49.900", "4,99", "4.990.000", "4.990"], "certa": 1, "explicacao": "b) 49.900"}, {"enunciado": "Uma bicicleta custa R$ 220 e está com 40% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 88", "R$ 308", "R$ 132", "R$ 180", "R$ 44"], "certa": 2, "explicacao": "c) R$ 132"}, {"enunciado": "De manhã fazia 17 °C. À tarde, 30 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["47 °C", "30 °C", "17 °C", "13 °C", "14 °C"], "certa": 3, "explicacao": "d) 13 °C"}, {"enunciado": "Um ventilador custa R$ 127 à vista, ou 2 vezes de R$ 83. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 127", "R$ 166", "R$ 293", "R$ 39", "R$ 44"], "certa": 3, "explicacao": "d) R$ 39"}, {"enunciado": "Leia: “No orçamento da semana, Bianca separou R$ 10 para o lanche.” Nessa frase, <b>orçamento</b> quer dizer… Responda com a letra.", "alternativas": ["o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "o dinheiro que sobra no fim do mês", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "quantas vezes o desenho é maior ou menor que o tamanho real", "o plano do dinheiro que entra e do que vai ser gasto"], "certa": 4, "explicacao": "e) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 9 bolas verdes e 4 bolas azuis. Tirando uma sem olhar, qual é a chance de sair verde? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>9</span><span>4</span></span>", "<span class=\"fr\"><span>9</span><span>13</span></span>", "<span class=\"fr\"><span>4</span><span>13</span></span>", "<span class=\"fr\"><span>1</span><span>13</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>9</span><span>13</span></span>"}, {"enunciado": "Quanto vale o algarismo destacado em 15<span class=\"dest\">9</span>.783? Responda com a letra.", "alternativas": ["90.000", "900", "9.000", "9", "9.783"], "certa": 2, "explicacao": "c) 9.000"}, {"enunciado": "Como se escreve 84% em número decimal? Responda com a letra.", "alternativas": ["0,16", "8,4", "84", "0,84", "0,084"], "certa": 3, "explicacao": "d) 0,84"}, {"enunciado": "Saindo do ponto (5, 0), ande 4 para a direita e 1 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(4, 1)", "(6, 4)", "(9, 0)", "(1, 9)", "(9, 1)"], "certa": 4, "explicacao": "e) (9, 1)"}, {"enunciado": "O que quer dizer <b>troco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o preço da compra", "quando os dois lados do sinal = valem o mesmo", "o dinheiro que volta quando se paga mais que o preço", "o par de números que diz onde um ponto está", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer"], "certa": 2, "explicacao": "c) o dinheiro que volta quando se paga mais que o preço. Não é “o preço da compra”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? 8 × <span class=\"caixa\"></span> = 32 Responda com a letra.", "alternativas": ["24", "256", "5", "4", "32"], "certa": 3, "explicacao": "d) 4"}, {"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>11</span></span> + <span class=\"fr\"><span>7</span><span>11</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>121</span></span>", "<span class=\"fr\"><span>8</span><span>22</span></span>", "<span class=\"fr\"><span>7</span><span>11</span></span>", "<span class=\"fr\"><span>8</span><span>11</span></span>", "<span class=\"fr\"><span>6</span><span>11</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>8</span><span>11</span></span>"}];
const CHAVE='simulado-bonus-mat-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
