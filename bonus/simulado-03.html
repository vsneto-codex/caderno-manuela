<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Num quadro de 100 quadradinhos iguais, 78 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "78%", "22%", "7,8%", "100%"], "certa": 1, "explicacao": "b) 78%"}, {"enunciado": "Qual destes números é divisível por 2? Responda com a letra.", "alternativas": ["5.240", "8.003", "8.935", "8.975", "4.483"], "certa": 0, "explicacao": "a) 5.240"}, {"enunciado": "Numa caixa há 6 bolas verdes e 9 bolas amarelas. Tirando uma sem olhar, qual é a chance de sair verde? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>15</span></span>", "<span class=\"fr\"><span>6</span><span>15</span></span>", "<span class=\"fr\"><span>15</span><span>6</span></span>", "<span class=\"fr\"><span>9</span><span>15</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>6</span><span>15</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>5</span><span>8</span></span> de 120? Responda com a letra.", "alternativas": ["600", "15", "45", "20", "75"], "certa": 4, "explicacao": "e) 75"}, {"enunciado": "O que quer dizer <b>produto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cada número que se multiplica", "duas vezes o número", "o resultado da multiplicação", "que cruza outra reta formando um ângulo reto", "uma parte de cada 100"], "certa": 2, "explicacao": "c) o resultado da multiplicação. Não é “cada número que se multiplica”: essa é a pegadinha."}, {"enunciado": "Calcule 7 × 45 de cabeça, separando 45 em 40 + 5. Quanto dá? Responda com a letra.", "alternativas": ["315", "63", "52", "1.400", "285"], "certa": 0, "explicacao": "a) 315"}, {"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 11; natação, 3; futebol, 15. Quantos votos futebol teve a mais que basquete? Responda com a letra.", "alternativas": ["15", "5", "26", "4", "11"], "certa": 3, "explicacao": "d) 4"}, {"enunciado": "Quantos lados tem um hexágono? Responda com a letra.", "alternativas": ["6", "5", "7", "12", "8"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "Um chocolate foi dividido em 9 pedaços iguais e 4 foram comidos. Que fração do chocolate foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>4</span><span>9</span></span>", "<span class=\"fr\"><span>9</span><span>4</span></span>", "<span class=\"fr\"><span>5</span><span>9</span></span>", "<span class=\"fr\"><span>4</span><span>13</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>4</span><span>9</span></span>"}, {"enunciado": "O que quer dizer <b>porcentagem</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o ponto onde dois lados (ou arestas) se encontram", "uma parte de cada 100", "que aumenta ou diminui na mesma medida", "uma parte de cada 10", "o valor que se tira do preço"], "certa": 1, "explicacao": "b) uma parte de cada 100. Não é “uma parte de cada 10”: essa é a pegadinha."}, {"enunciado": "Quantos cubinhos enchem uma caixa de 3 cubinhos de comprimento, 3 de largura e 2 de altura? Responda com a letra.", "alternativas": ["42", "9", "27", "8", "18"], "certa": 4, "explicacao": "e) 18"}, {"enunciado": "Uma compra custou R$ 26,22 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 24,78", "R$ 23,78", "R$ 24,00", "R$ 36,22", "R$ 76,22"], "certa": 1, "explicacao": "b) R$ 23,78"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>81</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["81", "8,1", "81,100", "0,081", "0,81"], "certa": 4, "explicacao": "e) 0,81"}, {"enunciado": "A aula de natação começou às 19h11 e durou 2h50. A que horas terminou? Responda com a letra.", "alternativas": ["21h61", "22h01", "16h21", "22h11", "21h01"], "certa": 1, "explicacao": "b) 22h01"}, {"enunciado": "O que quer dizer <b>antecessor</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["a divisão de alguma coisa entre pessoas", "o número que vem logo depois", "o número que vem logo antes", "o resultado da divisão", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido"], "certa": 2, "explicacao": "c) o número que vem logo antes. Não é “o número que vem logo depois”: essa é a pegadinha."}, {"enunciado": "Como se escreve “quatro inteiros e cinquenta e sete milésimos” com algarismos? Responda com a letra.", "alternativas": ["4,0057", "4.057", "4,075", "4,057", "4,57"], "certa": 3, "explicacao": "d) 4,057"}, {"enunciado": "Quanto é 32,5 − 1,37? Responda com a letra.", "alternativas": ["31,27", "31,13", "3,113", "33,87", "311,3"], "certa": 1, "explicacao": "b) 31,13"}, {"enunciado": "Quantos lados tem um quadrilátero? Responda com a letra.", "alternativas": ["5", "3", "4", "6", "8"], "certa": 2, "explicacao": "c) 4"}, {"enunciado": "Complete: 203 g = <span class=\"caixa\"></span> kg. Responda com a letra.", "alternativas": ["2,03", "203", "20,3", "203.000", "0,203"], "certa": 4, "explicacao": "e) 0,203"}, {"enunciado": "Leia: “O número 305 tem três algarismos: 3, 0 e 5.” Nessa frase, <b>algarismos</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 2 partes iguais de um inteiro", "o mesmo que número", "cada uma das 100 partes iguais de um inteiro", "o resultado da multiplicação", "cada um dos símbolos de 0 a 9 que usamos para escrever os números"], "certa": 4, "explicacao": "e) cada um dos símbolos de 0 a 9 que usamos para escrever os números. Não é “o mesmo que número”: essa é a pegadinha."}, {"enunciado": "Complete: 8.444 m = <span class=\"caixa\"></span> km. Responda com a letra.", "alternativas": ["844,4", "84,44", "0,8444", "8,444", "8.444"], "certa": 3, "explicacao": "d) 8,444"}, {"enunciado": "Um videogame custa R$ 460 e está com 10% de desconto. Quanto vai custar? Responda com a letra.", "alternativas": ["R$ 450", "R$ 46", "R$ 506", "R$ 414", "R$ 368"], "certa": 3, "explicacao": "d) R$ 414"}, {"enunciado": "De manhã fazia 12 °C. À tarde, 22 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["11 °C", "12 °C", "22 °C", "10 °C", "34 °C"], "certa": 3, "explicacao": "d) 10 °C"}, {"enunciado": "Um ventilador custa R$ 258 à vista, ou 5 vezes de R$ 58. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 290", "R$ 548", "R$ 200", "R$ 32", "R$ 258"], "certa": 3, "explicacao": "d) R$ 32"}, {"enunciado": "Leia: “A capacidade da garrafa é 2 L.” Nessa frase, <b>capacidade</b> quer dizer… Responda com a letra.", "alternativas": ["cada grupo de 3 ordens de um número: unidades, milhares, milhões", "quanto o recipiente pesa", "um número com uma parte inteira e uma fração", "quanto cabe dentro de um recipiente", "um número que está na tabuada de outro"], "certa": 3, "explicacao": "d) quanto cabe dentro de um recipiente. Não é “quanto o recipiente pesa”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 5 bolas vermelhas e 3 bolas verdes. Tirando uma sem olhar, qual é a chance de sair vermelha? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>8</span><span>5</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>5</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>5</span><span>8</span></span>"}, {"enunciado": "Quanto vale o algarismo destacado em 51<span class=\"dest\">9</span>.387? Responda com a letra.", "alternativas": ["9", "9.387", "90.000", "900", "9.000"], "certa": 4, "explicacao": "e) 9.000"}, {"enunciado": "Qual fração é igual a 25%? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>2</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>25</span></span>", "<span class=\"fr\"><span>25</span><span>1000</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>"], "certa": 1, "explicacao": "b) <span class=\"fr\"><span>1</span><span>4</span></span>"}, {"enunciado": "Saindo do ponto (1, 0), ande 4 para a direita e 2 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(7, 0)", "(4, 2)", "(5, 0)", "(3, 4)", "(5, 2)"], "certa": 4, "explicacao": "e) (5, 2)"}, {"enunciado": "O que quer dizer <b>orçamento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o dinheiro que sobra no fim do mês", "a chance de algo acontecer", "quanto cabe dentro de um recipiente", "o plano do dinheiro que entra e do que vai ser gasto", "três vezes o número"], "certa": 3, "explicacao": "d) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
