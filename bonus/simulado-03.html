<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Num quadro de 100 quadradinhos iguais, 78 estão pintados. Que porcentagem do quadro está pintada? Responda com a letra.", "alternativas": ["1%", "78%", "22%", "7,8%", "100%"], "certa": 1, "explicacao": "b) 78%"}, {"enunciado": "Qual destes números é divisor de 12? Responda com a letra.", "alternativas": ["6", "36", "24", "8", "11"], "certa": 0, "explicacao": "a) 6"}, {"enunciado": "A turma votou na fruta preferida. Resultado — uva, 13; maçã, 14; manga, 15; banana, 12. Quantos votos maçã teve a mais que banana? Responda com a letra.", "alternativas": ["26", "2", "12", "14", "3"], "certa": 1, "explicacao": "b) 2"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>29</span><span>5</span></span> como número misto (inteiros e fração)? Responda com a letra.", "alternativas": ["4 <span class=\"fr\"><span>5</span><span>5</span></span>", "6 <span class=\"fr\"><span>4</span><span>5</span></span>", "5 <span class=\"fr\"><span>4</span><span>29</span></span>", "5 <span class=\"fr\"><span>1</span><span>5</span></span>", "5 <span class=\"fr\"><span>4</span><span>5</span></span>"], "certa": 4, "explicacao": "e) 5 <span class=\"fr\"><span>4</span><span>5</span></span>"}, {"enunciado": "O que quer dizer <b>sequência</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["números em ordem, seguindo uma regra", "números escolhidos ao acaso", "o que se ganha a mais: o preço de venda menos o que custou", "cada um dos símbolos de 0 a 9 que usamos para escrever os números", "cada resultado que pode acontecer"], "certa": 0, "explicacao": "a) números em ordem, seguindo uma regra. Não é “números escolhidos ao acaso”: essa é a pegadinha."}, {"enunciado": "Calcule 3 × 18 de cabeça, separando 18 em 10 + 8. Quanto dá? Responda com a letra.", "alternativas": ["21", "240", "38", "54", "27"], "certa": 3, "explicacao": "d) 54"}, {"enunciado": "A turma votou na fruta preferida. Resultado — manga, 11; uva, 9; banana, 23. Quantos votos manga teve a mais que uva? Responda com a letra.", "alternativas": ["2", "20", "11", "9", "3"], "certa": 0, "explicacao": "a) 2"}, {"enunciado": "Uma pizza foi dividida em 7 pedaços iguais e 3 foram comidos. Que fração da pizza foi comida? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>3</span><span>7</span></span>", "<span class=\"fr\"><span>4</span><span>7</span></span>", "<span class=\"fr\"><span>3</span><span>4</span></span>", "<span class=\"fr\"><span>3</span><span>10</span></span>", "<span class=\"fr\"><span>7</span><span>3</span></span>"], "certa": 0, "explicacao": "a) <span class=\"fr\"><span>3</span><span>7</span></span>"}, {"enunciado": "Leia: “O perímetro do quadrado de lado 3 cm é 12 cm.” Nessa frase, <b>perímetro</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da multiplicação", "quantas vezes algo aparece", "a medida do contorno de uma figura", "quanto cabe dentro de um recipiente", "o espaço de dentro de uma figura"], "certa": 2, "explicacao": "c) a medida do contorno de uma figura. Não é “o espaço de dentro de uma figura”: essa é a pegadinha."}, {"enunciado": "Bianca tem 2 camisetas e 5 saias, todas diferentes. De quantos jeitos ela pode se vestir com uma camiseta e uma saia? Responda com a letra.", "alternativas": ["5", "7", "20", "10", "9"], "certa": 3, "explicacao": "d) 10"}, {"enunciado": "Uma compra custou R$ 17,74 e foi paga com uma nota de R$ 50,00. Qual é o troco? Responda com a letra.", "alternativas": ["R$ 33,26", "R$ 47,74", "R$ 33,00", "R$ 32,26", "R$ 67,74"], "certa": 3, "explicacao": "d) R$ 32,26"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>203</span><span>100</span></span> em número decimal? Responda com a letra.", "alternativas": ["0,203", "20,3", "203", "2,03", "203,100"], "certa": 3, "explicacao": "d) 2,03"}, {"enunciado": "Quantas arestas tem um prisma de base hexagonal? Responda com a letra.", "alternativas": ["18", "19", "8", "17", "12"], "certa": 0, "explicacao": "a) 18"}, {"enunciado": "O que quer dizer <b>perpendicular</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que cruza outra reta formando um ângulo reto", "quanto tempo algo dura, do começo ao fim", "que nunca encontra a outra reta", "que aumenta ou diminui na mesma medida", "o número de cima da fração: quantas partes foram pegas"], "certa": 0, "explicacao": "a) que cruza outra reta formando um ângulo reto. Não é “que nunca encontra a outra reta”: essa é a pegadinha."}, {"enunciado": "Como se escreve “dezenove inteiros e três milésimos” com algarismos? Responda com a letra.", "alternativas": ["19,03", "19,0003", "19,3", "19,003", "20,003"], "certa": 3, "explicacao": "d) 19,003"}, {"enunciado": "Quanto é 46,8 + 3,11? Responda com a letra.", "alternativas": ["49,91", "499,1", "779", "7,79", "4,991"], "certa": 0, "explicacao": "a) 49,91"}, {"enunciado": "Complete: 2,75 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["2,75", "27,5", "275", "27.500", "2.750"], "certa": 4, "explicacao": "e) 2.750"}, {"enunciado": "O que quer dizer <b>total</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o resultado de juntar tudo", "quantas vezes o desenho é maior ou menor que o tamanho real", "o resultado da divisão", "cada uma das 100 partes iguais de um inteiro", "uma das partes"], "certa": 0, "explicacao": "a) o resultado de juntar tudo. Não é “uma das partes”: essa é a pegadinha."}, {"enunciado": "Complete: 1.310 m = <span class=\"caixa\"></span> km. Responda com a letra.", "alternativas": ["1.310", "0,131", "13,1", "131", "1,31"], "certa": 4, "explicacao": "e) 1,31"}, {"enunciado": "A conta de luz custava R$ 330 e teve um aumento de 10%. Quanto vai ficar? Responda com a letra.", "alternativas": ["R$ 33", "R$ 363", "R$ 396", "R$ 340", "R$ 297"], "certa": 1, "explicacao": "b) R$ 363"}, {"enunciado": "O termômetro marcava 34 °C e a temperatura subiu 6 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["41 °C", "40 °C", "6 °C", "34 °C", "28 °C"], "certa": 1, "explicacao": "b) 40 °C"}, {"enunciado": "Um tablet custa R$ 320 à vista, ou 5 vezes de R$ 65. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 645", "R$ 320", "R$ 255", "R$ 5", "R$ 325"], "certa": 3, "explicacao": "d) R$ 5"}, {"enunciado": "Leia: “A viagem leva aproximadamente 3 horas.” Nessa frase, <b>aproximadamente</b> quer dizer… Responda com a letra.", "alternativas": ["do menor para o maior", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "cada uma das 1.000 partes iguais de um inteiro", "perto de, mais ou menos", "exatamente, sem errar nada"], "certa": 3, "explicacao": "d) perto de, mais ou menos. Não é “exatamente, sem errar nada”: essa é a pegadinha."}, {"enunciado": "Numa caixa há 7 bolas pretas e 1 bola azul. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>8</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>8</span></span>", "<span class=\"fr\"><span>7</span><span>1</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>7</span><span>8</span></span>"}, {"enunciado": "Quanto vale o algarismo destacado em 15<span class=\"dest\">6</span>.938? Responda com a letra.", "alternativas": ["6", "6.938", "60.000", "6.000", "600"], "certa": 3, "explicacao": "d) 6.000"}, {"enunciado": "Como se escreve 92% em número decimal? Responda com a letra.", "alternativas": ["9,2", "0,092", "0,92", "92", "0,08"], "certa": 2, "explicacao": "c) 0,92"}, {"enunciado": "Saindo do ponto (2, 5), ande 1 para a direita e 4 para cima. Em que ponto chegou? Responda com a letra.", "alternativas": ["(1, 4)", "(7, 5)", "(3, 5)", "(9, 3)", "(3, 9)"], "certa": 4, "explicacao": "e) (3, 9)"}, {"enunciado": "O que quer dizer <b>expressão</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["uma cara feita para mostrar o que sente", "na Matemática, uma conta com várias operações", "um valor aproximado, calculado de cabeça", "quando os dois lados do sinal = valem o mesmo", "o espaço que um objeto ocupa"], "certa": 1, "explicacao": "b) na Matemática, uma conta com várias operações. Não é “uma cara feita para mostrar o que sente”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> ÷ 3 = 6 Responda com a letra.", "alternativas": ["6", "21", "9", "18", "2"], "certa": 3, "explicacao": "d) 18"}, {"enunciado": "Quanto é <span class=\"fr\"><span>1</span><span>8</span></span> + <span class=\"fr\"><span>5</span><span>8</span></span>? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>6</span><span>64</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span>", "<span class=\"fr\"><span>6</span><span>16</span></span>", "<span class=\"fr\"><span>4</span><span>8</span></span>", "<span class=\"fr\"><span>6</span><span>8</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>6</span><span>8</span></span>"}];
const CHAVE='simulado-bonus-mat-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
