<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 21; vôlei, 3; natação, 20; futebol, 12. Quantos alunos votaram? Responda com a letra.", "alternativas": ["66", "21", "53", "4", "56"], "certa": 4, "explicacao": "e) 56"}, {"enunciado": "Arredonde 98.198 para a centena mais próxima. Responda com a letra.", "alternativas": ["98.200", "98.000", "100.000", "98.298", "98.100"], "certa": 0, "explicacao": "a) 98.200"}, {"enunciado": "Qual destes números é divisível por 3? Responda com a letra.", "alternativas": ["7.769", "1.079", "9.073", "4.099", "5.727"], "certa": 4, "explicacao": "e) 5.727"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>2571</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["2571,1000", "0,2571", "2.571", "25,71", "2,571"], "certa": 4, "explicacao": "e) 2,571"}, {"enunciado": "Leia: “Em 25 ÷ 4, o quociente é 6 e o resto é 1.” Nessa frase, <b>quociente</b> quer dizer… Responda com a letra.", "alternativas": ["quantas vezes algo aparece", "o que sobra na divisão", "cada uma das 2 partes iguais de um inteiro", "quando os dois lados do sinal = valem o mesmo", "o resultado da divisão"], "certa": 4, "explicacao": "e) o resultado da divisão. Não é “o que sobra na divisão”: essa é a pegadinha."}, {"enunciado": "110 balas foram divididas entre dois irmãos. Um ficou com o quádruplo (4 vezes) do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["22", "106", "132", "55", "110"], "certa": 0, "explicacao": "a) 22"}, {"enunciado": "Quantos cubinhos enchem uma caixa de 6 cubinhos de comprimento, 3 de largura e 7 de altura? Responda com a letra.", "alternativas": ["16", "18", "108", "162", "126"], "certa": 4, "explicacao": "e) 126"}, {"enunciado": "Quanto é 2,109 × 10? Responda com a letra.", "alternativas": ["2,109", "210,9", "0,2109", "21,09", "2,1090"], "certa": 3, "explicacao": "d) 21,09"}, {"enunciado": "Como se escreve 82% em número decimal? Responda com a letra.", "alternativas": ["0,82", "82", "8,2", "0,082", "0,18"], "certa": 0, "explicacao": "a) 0,82"}, {"enunciado": "O que quer dizer <b>legenda</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "quantas vezes algo aparece", "quanto tempo algo dura, do começo ao fim", "o número de baixo da fração: em quantas partes iguais o inteiro foi dividido", "o título do gráfico"], "certa": 0, "explicacao": "a) o texto que explica o que cada cor ou símbolo do gráfico quer dizer. Não é “o título do gráfico”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> − 15 = 93 Responda com a letra.", "alternativas": ["78", "98", "15", "93", "108"], "certa": 4, "explicacao": "e) 108"}, {"enunciado": "Como se escreve “onze inteiros e sete centésimos” com algarismos? Responda com a letra.", "alternativas": ["11,7", "11,07", "12,07", "11,0007", "11,007"], "certa": 1, "explicacao": "b) 11,07"}, {"enunciado": "Numa caixa há 8 bolas pretas e 4 bolas amarelas. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>12</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>12</span></span>", "<span class=\"fr\"><span>8</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>8</span><span>12</span></span>"}, {"enunciado": "Leia: “Os dados da pesquisa mostraram que a banana venceu.” Nessa frase, <b>dados</b> quer dizer… Responda com a letra.", "alternativas": ["cada resultado que pode acontecer", "as informações que juntamos numa pesquisa", "números em ordem, seguindo uma regra", "os cubinhos numerados usados em jogos", "que aumenta ou diminui na mesma medida"], "certa": 1, "explicacao": "b) as informações que juntamos numa pesquisa. Não é “os cubinhos numerados usados em jogos”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 9<span class=\"dest\">2</span>6.781? Responda com a letra.", "alternativas": ["2.000", "2", "26.781", "200.000", "20.000"], "certa": 4, "explicacao": "e) 20.000"}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["65.325", "55.632", "65.235", "9.683", "35.526"], "certa": 0, "explicacao": "a) 65.325"}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>1</span><span>3</span></span>, <span class=\"fr\"><span>1</span><span>11</span></span>, <span class=\"fr\"><span>1</span><span>8</span></span>, <span class=\"fr\"><span>1</span><span>2</span></span> e <span class=\"fr\"><span>1</span><span>12</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>11</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>1</span><span>2</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>2</span><span>3</span></span> de 24? Responda com a letra.", "alternativas": ["16", "10", "36", "48", "8"], "certa": 0, "explicacao": "a) 16"}, {"enunciado": "O que quer dizer <b>aresta</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["perto de, mais ou menos", "a parte plana de um sólido", "um valor aproximado, calculado de cabeça", "a linha onde duas faces de um sólido se encontram", "uma parte de cada 100"], "certa": 3, "explicacao": "d) a linha onde duas faces de um sólido se encontram. Não é “a parte plana de um sólido”: essa é a pegadinha."}, {"enunciado": "Quanto é 180.560 ÷ 20? Responda com a letra.", "alternativas": ["902", "90.028", "9.280", "928", "9.028"], "certa": 4, "explicacao": "e) 9.028"}, {"enunciado": "Na sequência 1; 10; 19; 28; … qual é o 10º número? Responda com a letra.", "alternativas": ["90", "37", "82", "73", "91"], "certa": 2, "explicacao": "c) 82"}, {"enunciado": "Qual é o perímetro de um retângulo de 16 cm por 2 cm? Responda com a letra.", "alternativas": ["34 cm", "18 cm", "32 cm²", "36 cm²", "36 cm"], "certa": 4, "explicacao": "e) 36 cm"}, {"enunciado": "9 canetas custam R$ 45. Quanto custam 7 canetas iguais? Responda com a letra.", "alternativas": ["R$ 43", "R$ 52", "R$ 35", "R$ 5", "R$ 315"], "certa": 2, "explicacao": "c) R$ 35"}, {"enunciado": "Leia: “A duração do filme foi de 1h50.” Nessa frase, <b>duração</b> quer dizer… Responda com a letra.", "alternativas": ["a hora em que algo começa", "a linha onde duas faces de um sólido se encontram", "o plano do dinheiro que entra e do que vai ser gasto", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "quanto tempo algo dura, do começo ao fim"], "certa": 4, "explicacao": "e) quanto tempo algo dura, do começo ao fim. Não é “a hora em que algo começa”: essa é a pegadinha."}, {"enunciado": "Arredonde 75.586 para o milhar mais próximo. Responda com a letra.", "alternativas": ["75.000", "76.000", "80.000", "75.590", "75.600"], "certa": 1, "explicacao": "b) 76.000"}, {"enunciado": "O termômetro marcava 20 °C e a temperatura subiu 6 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["6 °C", "26 °C", "14 °C", "20 °C", "27 °C"], "certa": 1, "explicacao": "b) 26 °C"}, {"enunciado": "Um ventilador custa R$ 208 à vista, ou 4 vezes de R$ 55. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 153", "R$ 12", "R$ 208", "R$ 428", "R$ 220"], "certa": 1, "explicacao": "b) R$ 12"}, {"enunciado": "Complete: 6,9 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["0,0069", "690", "69.000", "6.900", "6,9"], "certa": 3, "explicacao": "d) 6.900"}, {"enunciado": "O que quer dizer <b>número misto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número que está na tabuada de outro", "o valor que se tira do preço", "um número que tem vírgula", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "um número com uma parte inteira e uma fração"], "certa": 4, "explicacao": "e) um número com uma parte inteira e uma fração. Não é “um número que tem vírgula”: essa é a pegadinha."}, {"enunciado": "Calcule 4 × 26 de cabeça, separando 26 em 20 + 6. Quanto dá? Responda com a letra.", "alternativas": ["480", "30", "104", "32", "86"], "certa": 2, "explicacao": "c) 104"}];
const CHAVE='simulado-bonus-mat-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
