<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Matemática</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 8 · Matemática</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 21; vôlei, 3; natação, 20; futebol, 12. Quantos alunos votaram? Responda com a letra.", "alternativas": ["66", "21", "53", "4", "56"], "certa": 4, "explicacao": "e) 56"}, {"enunciado": "Arredonde 98.198 para a centena mais próxima. Responda com a letra.", "alternativas": ["98.200", "98.000", "100.000", "98.298", "98.100"], "certa": 0, "explicacao": "a) 98.200"}, {"enunciado": "Qual destes números é divisor de 42? Responda com a letra.", "alternativas": ["23", "25", "84", "126", "14"], "certa": 4, "explicacao": "e) 14"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>1918</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["0,1918", "1918,1000", "1.918", "1,918", "19,18"], "certa": 3, "explicacao": "d) 1,918"}, {"enunciado": "O que quer dizer <b>dados</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["as informações que juntamos numa pesquisa", "a chance de algo acontecer", "um número com uma parte inteira e uma fração", "que aumenta ou diminui na mesma medida", "os cubinhos numerados usados em jogos"], "certa": 0, "explicacao": "a) as informações que juntamos numa pesquisa. Não é “os cubinhos numerados usados em jogos”: essa é a pegadinha."}, {"enunciado": "40 bolinhas de gude foram divididas entre dois irmãos. Um ficou com o quádruplo (4 vezes) do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["32", "48", "40", "20", "8"], "certa": 4, "explicacao": "e) 8"}, {"enunciado": "Quantos cubinhos enchem uma caixa de 7 cubinhos de comprimento, 4 de largura e 2 de altura? Responda com a letra.", "alternativas": ["56", "84", "28", "100", "13"], "certa": 0, "explicacao": "a) 56"}, {"enunciado": "Quanto é 1,54 × 8? Responda com a letra.", "alternativas": ["8,432", "1.232", "12,32", "1,232", "123,2"], "certa": 2, "explicacao": "c) 12,32"}, {"enunciado": "Como se escreve 28% em número decimal? Responda com a letra.", "alternativas": ["0,028", "28", "0,72", "0,28", "2,8"], "certa": 3, "explicacao": "d) 0,28"}, {"enunciado": "O que quer dizer <b>comprimento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["duas vezes o número", "a medida de uma ponta à outra", "o resultado da multiplicação", "o peso de um objeto", "o dinheiro que volta quando se paga mais que o preço"], "certa": 1, "explicacao": "b) a medida de uma ponta à outra. Não é “o peso de um objeto”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? <span class=\"caixa\"></span> − 55 = 31 Responda com a letra.", "alternativas": ["31", "86", "76", "55", "24"], "certa": 1, "explicacao": "b) 86"}, {"enunciado": "Como se escreve “dois inteiros e oito milésimos” com algarismos? Responda com a letra.", "alternativas": ["2,008", "2.008", "2,0008", "3,008", "2,8"], "certa": 0, "explicacao": "a) 2,008"}, {"enunciado": "Numa caixa há 3 bolas amarelas e 5 bolas brancas. Tirando uma sem olhar, qual é a chance de sair amarela? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>8</span></span>", "<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>3</span><span>8</span></span>"], "certa": 4, "explicacao": "e) <span class=\"fr\"><span>3</span><span>8</span></span>"}, {"enunciado": "Leia: “Em <span class=\"fr\"><span>3</span><span>8</span></span>, o numerador é 3.” Nessa frase, <b>numerador</b> quer dizer… Responda com a letra.", "alternativas": ["o resultado da subtração", "o número de baixo da fração", "o número que vem logo antes", "o número de cima da fração: quantas partes foram pegas", "a divisão de alguma coisa entre pessoas"], "certa": 3, "explicacao": "d) o número de cima da fração: quantas partes foram pegas. Não é “o número de baixo da fração”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 5<span class=\"dest\">7</span>1.893? Responda com a letra.", "alternativas": ["7.000", "7", "700.000", "70.000", "71.893"], "certa": 3, "explicacao": "d) 70.000"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["9.623", "17.309", "9.263", "9.362", "13.036"], "certa": 2, "explicacao": "c) 9.263"}, {"enunciado": "Qual destas frações é a maior? <span class=\"fr\"><span>1</span><span>12</span></span>, <span class=\"fr\"><span>1</span><span>9</span></span>, <span class=\"fr\"><span>1</span><span>7</span></span>, <span class=\"fr\"><span>1</span><span>3</span></span> e <span class=\"fr\"><span>1</span><span>2</span></span> Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>9</span></span>", "<span class=\"fr\"><span>1</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>7</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>"], "certa": 2, "explicacao": "c) <span class=\"fr\"><span>1</span><span>2</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>2</span><span>7</span></span> de 28? Responda com a letra.", "alternativas": ["98", "4", "6", "8", "20"], "certa": 3, "explicacao": "d) 8"}, {"enunciado": "O que quer dizer <b>probabilidade</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["três vezes o número", "o resultado da multiplicação", "a certeza de que vai acontecer", "cada número que se soma numa adição", "a chance de algo acontecer"], "certa": 4, "explicacao": "e) a chance de algo acontecer. Não é “a certeza de que vai acontecer”: essa é a pegadinha."}, {"enunciado": "Quanto é 180.560 ÷ 20? Responda com a letra.", "alternativas": ["902", "90.028", "9.280", "928", "9.028"], "certa": 4, "explicacao": "e) 9.028"}, {"enunciado": "Na sequência 1; 10; 19; 28; … qual é o 10º número? Responda com a letra.", "alternativas": ["90", "37", "82", "73", "91"], "certa": 2, "explicacao": "c) 82"}, {"enunciado": "Qual é a área de um retângulo de 16 cm por 2 cm? Responda com a letra.", "alternativas": ["32 cm", "18 cm²", "36 cm", "64 cm²", "32 cm²"], "certa": 4, "explicacao": "e) 32 cm²"}, {"enunciado": "9 canetas custam R$ 45. Quanto custam 7 canetas iguais? Responda com a letra.", "alternativas": ["R$ 43", "R$ 52", "R$ 35", "R$ 5", "R$ 315"], "certa": 2, "explicacao": "c) R$ 35"}, {"enunciado": "Leia: “Pela legenda, a cor cinza mostra os meninos.” Nessa frase, <b>legenda</b> quer dizer… Responda com a letra.", "alternativas": ["o título do gráfico", "a linha onde duas faces de um sólido se encontram", "o plano do dinheiro que entra e do que vai ser gasto", "a conta que desfaz a outra: − desfaz +, ÷ desfaz ×", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer"], "certa": 4, "explicacao": "e) o texto que explica o que cada cor ou símbolo do gráfico quer dizer. Não é “o título do gráfico”: essa é a pegadinha."}, {"enunciado": "Arredonde 75.586 para o milhar mais próximo. Responda com a letra.", "alternativas": ["75.000", "76.000", "80.000", "75.590", "75.600"], "certa": 1, "explicacao": "b) 76.000"}, {"enunciado": "O termômetro marcava 20 °C e a temperatura subiu 6 °C. Quanto marca agora? Responda com a letra.", "alternativas": ["6 °C", "26 °C", "14 °C", "20 °C", "27 °C"], "certa": 1, "explicacao": "b) 26 °C"}, {"enunciado": "Um ventilador custa R$ 208 à vista, ou 4 vezes de R$ 55. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 153", "R$ 12", "R$ 208", "R$ 428", "R$ 220"], "certa": 1, "explicacao": "b) R$ 12"}, {"enunciado": "Complete: 6,9 kg = <span class=\"caixa\"></span> g. Responda com a letra.", "alternativas": ["0,0069", "690", "69.000", "6.900", "6,9"], "certa": 3, "explicacao": "d) 6.900"}, {"enunciado": "O que quer dizer <b>orçamento</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um número que está na tabuada de outro", "perto de, mais ou menos", "o dinheiro que sobra no fim do mês", "o valor que se tira do preço", "o plano do dinheiro que entra e do que vai ser gasto"], "certa": 4, "explicacao": "e) o plano do dinheiro que entra e do que vai ser gasto. Não é “o dinheiro que sobra no fim do mês”: essa é a pegadinha."}, {"enunciado": "Calcule 4 × 26 de cabeça, separando 26 em 20 + 6. Quanto dá? Responda com a letra.", "alternativas": ["480", "30", "104", "32", "86"], "certa": 2, "explicacao": "c) 104"}];
const CHAVE='simulado-bonus-mat-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
