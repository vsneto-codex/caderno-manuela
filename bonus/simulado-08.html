<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Matemática 5º ano</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Matemática 5º ano</h1>
<p class="sub">30 questões de Matemática no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "A turma votou no esporte preferido. Resultado — basquete, 21; vôlei, 3; natação, 20; futebol, 12. Quantos alunos votaram? Responda com a letra.", "alternativas": ["66", "21", "53", "4", "56"], "certa": 4, "explicacao": "e) 56"}, {"enunciado": "Arredonde 98.198 para a centena mais próxima. Responda com a letra.", "alternativas": ["98.200", "98.000", "100.000", "98.298", "98.100"], "certa": 0, "explicacao": "a) 98.200"}, {"enunciado": "Qual destes números é divisível por 3? Responda com a letra.", "alternativas": ["7.769", "1.079", "9.073", "4.099", "5.727"], "certa": 4, "explicacao": "e) 5.727"}, {"enunciado": "Como se escreve <span class=\"fr\"><span>2571</span><span>1000</span></span> em número decimal? Responda com a letra.", "alternativas": ["2571,1000", "0,2571", "2.571", "25,71", "2,571"], "certa": 4, "explicacao": "e) 2,571"}, {"enunciado": "Leia: “O triplo de 8 é 24.” Nessa frase, <b>triplo</b> quer dizer… Responda com a letra.", "alternativas": ["perto de, mais ou menos", "o número mais 3", "cada uma das 2 partes iguais de um inteiro", "o valor que se tira do preço", "três vezes o número"], "certa": 4, "explicacao": "e) três vezes o número. Não é “o número mais 3”: essa é a pegadinha."}, {"enunciado": "110 balas foram divididas entre dois irmãos. Um ficou com o quádruplo (4 vezes) do outro. Com quantas ficou o que recebeu menos? Responda com a letra.", "alternativas": ["22", "106", "132", "55", "110"], "certa": 0, "explicacao": "a) 22"}, {"enunciado": "Uma lanchonete tem 3 tipos de pão, 4 de recheio e 3 de suco. Quantos lanches diferentes dá para montar com 1 pão, 1 recheio e 1 suco? Responda com a letra.", "alternativas": ["36", "10", "15", "12", "35"], "certa": 0, "explicacao": "a) 36"}, {"enunciado": "Quanto é 9,097 ÷ 100? Responda com a letra.", "alternativas": ["9,097", "909,7", "0,9097", "0,09097", "0,009097"], "certa": 3, "explicacao": "d) 0,09097"}, {"enunciado": "Como se escreve 3% em número decimal? Responda com a letra.", "alternativas": ["0,03", "3", "0,97", "0,003", "0,3"], "certa": 0, "explicacao": "a) 0,03"}, {"enunciado": "O que quer dizer <b>troco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o preço da compra", "o resultado da multiplicação", "o dinheiro que volta quando se paga mais que o preço", "o texto que explica o que cada cor ou símbolo do gráfico quer dizer", "três vezes o número"], "certa": 2, "explicacao": "c) o dinheiro que volta quando se paga mais que o preço. Não é “o preço da compra”: essa é a pegadinha."}, {"enunciado": "Qual é o número que falta? 3 × <span class=\"caixa\"></span> = 33 Responda com a letra.", "alternativas": ["30", "12", "11", "33", "99"], "certa": 2, "explicacao": "c) 11"}, {"enunciado": "Quantos lados tem um eneágono? Responda com a letra.", "alternativas": ["18", "11", "10", "9", "8"], "certa": 3, "explicacao": "d) 9"}, {"enunciado": "Como se escreve “catorze inteiros e vinte e seis milésimos” com algarismos? Responda com a letra.", "alternativas": ["14.026", "14,0026", "14,26", "14,026", "14,062"], "certa": 3, "explicacao": "d) 14,026"}, {"enunciado": "Numa caixa há 7 bolas pretas e 4 bolas verdes. Tirando uma sem olhar, qual é a chance de sair preta? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>4</span><span>11</span></span>", "<span class=\"fr\"><span>11</span><span>7</span></span>", "<span class=\"fr\"><span>7</span><span>11</span></span>", "<span class=\"fr\"><span>1</span><span>11</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>7</span><span>11</span></span>"}, {"enunciado": "O que quer dizer <b>coordenadas</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["perto de, mais ou menos", "cada uma das 100 partes iguais de um inteiro", "uma parte de cada 100", "o par de números que diz onde um ponto está", "as cores de um mapa"], "certa": 3, "explicacao": "d) o par de números que diz onde um ponto está. Não é “as cores de um mapa”: essa é a pegadinha."}, {"enunciado": "Quanto vale o algarismo destacado em 956.<span class=\"dest\">4</span>38? Responda com a letra.", "alternativas": ["40", "4.000", "438", "400", "4"], "certa": 3, "explicacao": "d) 400"}, {"enunciado": "Qual destes números é o menor? Responda com a letra.", "alternativas": ["18.013", "5.498", "9.584", "9.458", "16.476"], "certa": 1, "explicacao": "b) 5.498"}, {"enunciado": "Entre as frações <span class=\"fr\"><span>5</span><span>11</span></span>, <span class=\"fr\"><span>5</span><span>6</span></span>, <span class=\"fr\"><span>5</span><span>12</span></span>, <span class=\"fr\"><span>5</span><span>14</span></span> e <span class=\"fr\"><span>5</span><span>7</span></span>, qual é a maior? Responda com a letra.", "alternativas": ["<span class=\"fr\"><span>5</span><span>14</span></span>", "<span class=\"fr\"><span>5</span><span>7</span></span>", "<span class=\"fr\"><span>5</span><span>12</span></span>", "<span class=\"fr\"><span>5</span><span>6</span></span>", "<span class=\"fr\"><span>5</span><span>11</span></span>"], "certa": 3, "explicacao": "d) <span class=\"fr\"><span>5</span><span>6</span></span>"}, {"enunciado": "Quanto é <span class=\"fr\"><span>3</span><span>8</span></span> de 56? Responda com a letra.", "alternativas": ["7", "21", "168", "10", "35"], "certa": 1, "explicacao": "b) 21"}, {"enunciado": "Leia: “A expressão (45 − 15) ÷ 6 + 3 × 4 dá 17.” Nessa frase, <b>expressão</b> quer dizer… Responda com a letra.", "alternativas": ["o número que vem logo antes", "uma cara feita para mostrar o que sente", "que aumenta ou diminui na mesma medida", "quanto uma medida mudou", "na Matemática, uma conta com várias operações"], "certa": 4, "explicacao": "e) na Matemática, uma conta com várias operações. Não é “uma cara feita para mostrar o que sente”: essa é a pegadinha."}, {"enunciado": "Quanto é 44.253 ÷ 11? Responda com a letra.", "alternativas": ["423", "402", "4.023", "4.230", "40.023"], "certa": 2, "explicacao": "c) 4.023"}, {"enunciado": "Na sequência 28; 40; 52; 64; … qual é o 17º número? Responda com a letra.", "alternativas": ["208", "232", "220", "76", "204"], "certa": 2, "explicacao": "c) 220"}, {"enunciado": "De manhã fazia 14 °C. À tarde, 25 °C. Quantos graus a temperatura subiu? Responda com a letra.", "alternativas": ["11 °C", "12 °C", "39 °C", "14 °C", "25 °C"], "certa": 0, "explicacao": "a) 11 °C"}, {"enunciado": "4 sorvetes custam R$ 36. Quanto custam 7 sorvetes iguais? Responda com a letra.", "alternativas": ["R$ 39", "R$ 252", "R$ 43", "R$ 9", "R$ 63"], "certa": 4, "explicacao": "e) R$ 63"}, {"enunciado": "Leia: “Girou <span class=\"fr\"><span>1</span><span>4</span></span> de volta no sentido horário: para a direita.” Nessa frase, <b>sentido horário</b> quer dizer… Responda com a letra.", "alternativas": ["a hora que o relógio marca", "a medida do contorno de uma figura", "um número com uma parte inteira e uma fração", "o mesmo sentido em que giram os ponteiros do relógio", "cada número que se soma numa adição"], "certa": 3, "explicacao": "d) o mesmo sentido em que giram os ponteiros do relógio. Não é “a hora que o relógio marca”: essa é a pegadinha."}, {"enunciado": "Qual destes números é o maior? Responda com a letra.", "alternativas": ["37.109", "10.397", "37.019", "9.347", "17.039"], "certa": 0, "explicacao": "a) 37.109"}, {"enunciado": "A aula de natação começou às 15h42 e durou 3h26. A que horas terminou? Responda com a letra.", "alternativas": ["18h68", "19h08", "19h42", "18h08", "12h16"], "certa": 1, "explicacao": "b) 19h08"}, {"enunciado": "Uma cadeira custa R$ 326 à vista, ou 6 vezes de R$ 56. Quanto se economiza pagando à vista? Responda com a letra.", "alternativas": ["R$ 10", "R$ 326", "R$ 336", "R$ 662", "R$ 270"], "certa": 0, "explicacao": "a) R$ 10"}, {"enunciado": "Complete: 8.630 mm = <span class=\"caixa\"></span> cm. Responda com a letra.", "alternativas": ["86.300", "86,3", "8.630", "863", "0,863"], "certa": 3, "explicacao": "d) 863"}, {"enunciado": "Leia: “0,7 são sete décimos.” Nessa frase, <b>décimos</b> quer dizer… Responda com a letra.", "alternativas": ["cada uma das 10 partes iguais de um inteiro", "o par de números que diz onde um ponto está", "o número 10", "a chance de algo acontecer", "cada número que se soma numa adição"], "certa": 0, "explicacao": "a) cada uma das 10 partes iguais de um inteiro. Não é “o número 10”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-mat-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
