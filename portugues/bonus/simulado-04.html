<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Ricardo vai a praia.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à praia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O mau tempo cancelou o passeio de barco.", "O desenho ficou mau feito porque a mesa balançava.", "Ricardo escreveu mal o nome da rua no envelope.", "O museu fica a dois quarteirões da praça.", "Aonde você vai levar o cachorro?"], "certa": 1, "explicacao": "b) o certo é “mal”"}, {"enunciado": "Por que a palavra <b>pé</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em us leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "paroxítona terminada em um ou uns leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "paroxítona terminada em r leva acento"], "certa": 1, "explicacao": "b) monossílabo forte terminado em a, e ou o (com ou sem s) leva acento (pé)."}, {"enunciado": "O que quer dizer <b>inaudito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "breve e direto", "baixo demais para ouvir", "exibido, que usa palavras difíceis só para se mostrar", "nunca visto antes, extraordinário"], "certa": 4, "explicacao": "e) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>agradável</b>? Responda com a letra.", "alternativas": ["agradavelíssimo", "capacíssimo", "friíssimo", "agradavélimo", "agradabilíssimo"], "certa": 4, "explicacao": "e) agradabilíssimo"}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["vazio", "glacial", "cientista", "sair", "laranjeira"], "certa": 4, "explicacao": "e) laranjeira — la-ran-jei-ra"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela, venha jantar!", "Manuela e Bianca, limparam o quarto.", "São Paulo, 16 de outubro de 2026.", "Ontem, choveu muito.", "Ricardo, meu primo, chegou cedo."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>90º</b> por extenso? Responda com a letra.", "alternativas": ["nonagésimo", "centésimo", "octogésimo", "noventésimo", "nonagésimo primeiro"], "certa": 0, "explicacao": "a) nonagésimo"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "estranho, fora do comum", "combinado sem precisar falar, subentendido", "digno de confiança, verdadeiro", "solitário, sozinho"], "certa": 1, "explicacao": "b) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["Comprei pão e comprei leite.", "Eu levo o bolo caso você levar o suco.", "A ponte caiu, por isso tivemos de voltar.", "O dia estava nublado, porém não choveu.", "Escove os dentes, já que você comeu doce."], "certa": 0, "explicacao": "a) Comprei pão e comprei leite."}, {"enunciado": "Quem nasce em <b>Ceará</b> é… Responda com a letra.", "alternativas": ["cuiabano", "fortalezense", "uruguaio", "cearense", "mexicano"], "certa": 3, "explicacao": "d) cearense"}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["enchuto", "chuveiro", "magestade", "pagé", "champu"], "certa": 1, "explicacao": "b) chuveiro — com ch, de cor."}, {"enunciado": "Qual é a junção de <b>de + aquilo</b>? Responda com a letra.", "alternativas": ["daquilo", "de aquilo", "àaquilo", "naquilo", "doaquilo"], "certa": 0, "explicacao": "a) daquilo"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "que fala pouco, de poucas palavras", "feito de leite", "tão bom que não dá para descrever com palavras", "que acontece fora de hora"], "certa": 1, "explicacao": "b) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "“Minha amiguinha do coração!”<br>Que sentido tem <b>amiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "desprezo", "admiração", "pressa", "carinho"], "certa": 4, "explicacao": "e) carinho"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>corajoso</b>? Responda com a letra.", "alternativas": ["medroso", "fraco", "agitado", "fechado", "valente"], "certa": 0, "explicacao": "a) medroso — cuidado: “valente” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece por acaso", "honroso, que dá orgulho", "totalmente fechado; difícil de entender", "lento para entender", "caro, que custa muito"], "certa": 4, "explicacao": "e) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Situação: Felipe bateu o dedo na porta.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Viva!", "Que horror!", "Ai!", "Graças a Deus!", "Oh!"], "certa": 2, "explicacao": "c) Ai! — dor."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Há muitas estrelas no céu.", "Resistimos ao doce.", "Havia um bilhete na mesa.", "Bianca aprendeu uma música nova.", "Ricardo e a irmã esconderam o presente."], "certa": 4, "explicacao": "e) Ricardo e a irmã esconderam o presente."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "Bebi meia garrafa de água.", "Alice estava meio confusa.", "Helena ficou meia preocupada.", "Já é meio-dia e meia."], "certa": 3, "explicacao": "d) — o certo é “Helena ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "firme e calmo diante do sofrimento", "oportunidade, ocasião", "defesa, elogio de uma ideia", "que merece aplausos"], "certa": 0, "explicacao": "a) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "“Apareceu de repente a professora de música.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Apareceu", "de", "o sujeito está escondido (oculto)", "não tem sujeito", "a professora de música"], "certa": 4, "explicacao": "e) a professora de música — o sujeito veio depois do verbo. Pergunte: quem apareceu?"}, {"enunciado": "Qual é o coletivo de <b>estrelas</b>? Responda com a letra.", "alternativas": ["galáxia", "constelação", "pombal", "arquipélago", "cordilheira"], "certa": 1, "explicacao": "b) constelação — galáxia é de outro grupo."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitas crianças brincavam no parque.", "A sopa estava muito quente.", "Havia muita gente na praia.", "Fizemos muitas perguntas.", "Comprei muitos livros."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["gênio, muito inteligente", "esfriar, perder a força", "esbanjador, que gasta demais", "rigoroso e sem luxo", "tão bom que não dá para descrever com palavras"], "certa": 2, "explicacao": "c) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "“Felipe queria jogar, entretanto estava com febre.”<br>Qual conjunção pode ficar no lugar de <b>entretanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["mas", "se", "logo", "já que", "portanto"], "certa": 0, "explicacao": "a) mas — as duas dão ideia de oposição."}, {"enunciado": "Por que a palavra <b>rosa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o s tem som de z", "depois de consoante, um s só já tem som de s", "no começo da palavra, o s tem som de s", "entre vogais, o som de s se escreve com ss", "ss pode começar uma palavra"], "certa": 0, "explicacao": "a) entre vogais, o s tem som de z"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o tema", "a tribo", "o pijama", "o champanhe", "a eclipse"], "certa": 4, "explicacao": "e) a eclipse — o certo é “o eclipse”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["abacaxi", "assistir", "tórax", "pontapé", "lençóis"], "certa": 2, "explicacao": "c) tórax — tó-rax: é paroxítona."}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "vencer, controlar (um incêndio, uma crise)", "mínimo, o menor de todos", "onde é muito difícil viver", "infinito, enorme"], "certa": 2, "explicacao": "c) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
