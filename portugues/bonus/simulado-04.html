<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O verbo <b>pressupor</b> é de que conjugação? Responda com a letra.", "alternativas": ["4ª conjugação (-or)", "2ª conjugação (-er)", "1ª conjugação (-ar)", "3ª conjugação (-ir)", "não tem conjugação"], "certa": 1, "explicacao": "b) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Não entendi por que o filme acabou daquele jeito.", "Fale baixo, por quê o bebê está dormindo.", "A rua por que ele passa todo dia é barulhenta.", "— Vou guardar este desenho. — Por quê?", "— Não vou à praia. — Por quê?"], "certa": 1, "explicacao": "b) — o certo é “Fale baixo, porque o bebê está dormindo.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["couberam", "cabiam", "caberam", "cabem", "caberão"], "certa": 0, "explicacao": "a) couberam"}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["excessão", "eceção", "exceção", "esseção", "excesão"], "certa": 2, "explicacao": "c) exceção — com xc, como exceto."}, {"enunciado": "O que quer dizer <b>inaudito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["baixo demais para ouvir", "dispensar, não precisar de algo", "nunca visto antes, extraordinário", "fora da época certa", "combinado sem precisar falar, subentendido"], "certa": 2, "explicacao": "c) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}, {"enunciado": "Tomara que nós ___ um presente. (verbo dar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["déssemos", "dar", "demos", "dermos", "damos"], "certa": 2, "explicacao": "c) demos"}, {"enunciado": "Por que a palavra <b>peixe</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["depois de en- se usa x", "palavras que vêm de outras com ch usam x", "depois de ditongo se usa ch", "depois de ditongo se usa x", "depois de me- se usa x"], "certa": 3, "explicacao": "d) depois de ditongo se usa x"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "remédio para todos os males", "solitário, sozinho", "oportunidade, ocasião", "estranho, fora do comum"], "certa": 4, "explicacao": "e) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>lindo</b>? Responda com a letra.", "alternativas": ["lindérrimo", "lindílimo", "amabilíssimo", "lindíssimo", "comuníssimo"], "certa": 3, "explicacao": "d) lindíssimo"}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles partirão cedo.", "No ano que vem, eles pescarão no lago.", "Ontem, eles resistiram ao doce.", "Amanhã, eles voltaram para casa.", "Ontem, eles comeram pizza."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "esfriar, perder a força", "que não se apaga", "que passa num instante", "feito de leite"], "certa": 0, "explicacao": "a) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pas-sa-re-la", "cre-scer", "rai-va", "cap-tu-ra", "de-grau"], "certa": 1, "explicacao": "b) cre-scer — o certo é cres-cer: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Na frase “Manuela riu <b>porque</b> o palhaço caiu.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual", "o motivo", "pois", "por isso", "motivo para"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Por que a palavra <b>música</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["depois de consoante, um s só já tem som de s", "no começo da palavra, o s tem som de s", "entre vogais, o som de s se escreve com ss", "ss pode começar uma palavra", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["incrível", "enxoval", "mingau", "refém", "lençóis"], "certa": 0, "explicacao": "a) incrível — in-crí-vel: é paroxítona."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["honroso, que dá orgulho", "caro, que custa muito", "rigoroso e sem luxo", "totalmente fechado; difícil de entender", "que não se apaga"], "certa": 1, "explicacao": "b) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["mexerica", "bochexa", "relâmpago", "xampu", "cochilo"], "certa": 1, "explicacao": "b) bochexa — o certo é bochecha: com ch nas duas sílabas."}, {"enunciado": "Por que a palavra <b>bufê</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em x leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona terminada em e leva acento", "paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento"], "certa": 3, "explicacao": "d) oxítona terminada em e leva acento (bu-fê)."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["fogão", "vazio", "biscoito", "coisa", "bombeiro"], "certa": 1, "explicacao": "b) vazio — va-zi-o"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o dia", "a problema", "o clã", "a cal", "o clima"], "certa": 1, "explicacao": "b) a problema — o certo é “o problema”."}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["preciso, feito com muito cuidado", "exibido, que usa palavras difíceis só para se mostrar", "mentira, golpe para enganar", "que merece aplausos", "que dá para acreditar, razoável"], "certa": 4, "explicacao": "e) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Campo Grande</b> é… Responda com a letra.", "alternativas": ["moçambicano", "soteropolitano", "alagoano", "russo", "campo-grandense"], "certa": 4, "explicacao": "e) campo-grandense"}, {"enunciado": "Como se escreve <b>22º</b> por extenso? Responda com a letra.", "alternativas": ["décimo segundo", "trigésimo segundo", "vintésimo segundo", "vigésimo terceiro", "vigésimo segundo"], "certa": 4, "explicacao": "e) vigésimo segundo"}, {"enunciado": "Hoje de manhã, eles ___ para a prova. Qual forma completa a frase? Responda com a letra.", "alternativas": ["estudarão", "estudavam", "estudariam", "estudam", "estudaram"], "certa": 4, "explicacao": "e) estudaram — passado: -am."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "fora da época certa", "gênio, muito inteligente", "arrogância, ar de superioridade", "que fala ou escreve demais, enrolando"], "certa": 0, "explicacao": "a) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["foguete", "guerra", "aguentar", "queijo", "foguinho"], "certa": 2, "explicacao": "c) aguentar — em “aguentar” a gente fala o u"}, {"enunciado": "Como se diz o macho da <b>formiga</b>? Responda com a letra.", "alternativas": ["o formiga", "a formigazinho", "a formiga macho", "o formiga macho", "o formigo"], "certa": 2, "explicacao": "c) a formiga macho — formiga é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "infinito, enorme", "mínimo, o menor de todos", "proveitoso, que dá bons resultados", "arrependido"], "certa": 2, "explicacao": "c) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>mala</b>? Responda com a letra.", "alternativas": ["gotícula", "maleta", "mulherzinha", "flautim", "sineta"], "certa": 1, "explicacao": "b) maleta"}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "carinho", "pressa", "tamanho", "admiração"], "certa": 0, "explicacao": "a) desprezo"}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
