<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Felipe voltou a piscina.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à piscina”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo comeu mais pipoca do que todo mundo.", "Não sei onde o gato se escondeu.", "A porta foi mal pintada e descascou logo.", "O cachorro estava de mau humor por causa do calor.", "Onde o carteiro vai entregar a carta?"], "certa": 4, "explicacao": "e) o certo é “Aonde”"}, {"enunciado": "Como se lê <b>D. Pedro I</b>? Responda com a letra.", "alternativas": ["1", "terceiro", "segundo", "primeiro", "um"], "certa": 3, "explicacao": "d) primeiro — até o décimo, lê-se como ordinal."}, {"enunciado": "Por que a palavra <b>fóruns</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em um ou uns leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "oxítona terminada em e leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "oxítona terminada em em ou ens leva acento"], "certa": 0, "explicacao": "a) paroxítona terminada em um ou uns leva acento (fó-runs)."}, {"enunciado": "O que quer dizer <b>inaudito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["resistente (ao calor, a mudanças)", "exibido, que usa palavras difíceis só para se mostrar", "baixo demais para ouvir", "nunca visto antes, extraordinário", "arrogância, ar de superioridade"], "certa": 3, "explicacao": "d) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>ágil</b>? Responda com a letra.", "alternativas": ["agilérrimo", "agradabilíssimo", "agílimo", "rapidíssimo", "libérrimo"], "certa": 2, "explicacao": "c) agílimo"}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["mãe", "irmão", "cereal", "balão", "feira"], "certa": 2, "explicacao": "c) cereal — ce-re-al"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Meu avô, procurou a bola.", "Felipe, o mais alto da turma, chegou cedo.", "São Paulo, 16 de outubro de 2026.", "Manuela, cuidado com o degrau!", "Comprei caderno, régua e borracha."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Meu avô) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>90º</b> por extenso? Responda com a letra.", "alternativas": ["noventésimo", "nonagésimo", "centésimo", "nonagésimo primeiro", "octogésimo"], "certa": 1, "explicacao": "b) nonagésimo"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "solitário, sozinho", "isca, armadilha para enganar", "totalmente fechado; difícil de entender", "estranho, fora do comum"], "certa": 4, "explicacao": "e) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Treinamos bastante, entretanto perdemos o jogo.", "Volte cedo, já que amanhã tem aula.", "Bianca comprou pão e Felipe comprou leite.", "Bianca leu o livro inteiro, logo sabe a história de cor.", "A planta cresce caso receba água."], "certa": 3, "explicacao": "d) Bianca leu o livro inteiro, logo sabe a história de cor."}, {"enunciado": "Quem nasce em <b>Maceió</b> é… Responda com a letra.", "alternativas": ["brasiliense", "marroquino", "holandês", "pessoense", "maceioense"], "certa": 4, "explicacao": "e) maceioense"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["canjica", "engraxate", "berinjela", "jeito", "boxecha"], "certa": 4, "explicacao": "e) boxecha — o certo é bochecha: com ch nas duas sílabas."}, {"enunciado": "De que duas palavras se forma <b>nesta</b>? Responda com a letra.", "alternativas": ["em + aquilo", "em + estas", "ne + esta", "de + esta", "em + esta"], "certa": 4, "explicacao": "e) em + esta"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "que acontece por acaso", "que fala pouco, de poucas palavras", "firme e calmo diante do sofrimento", "feito de leite"], "certa": 2, "explicacao": "c) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["pressa", "desprezo", "admiração", "tamanho", "carinho"], "certa": 1, "explicacao": "b) desprezo"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["farinha", "pezinho", "livrinho", "gatinho", "carrinho"], "certa": 0, "explicacao": "a) farinha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>subir</b>? Responda com a letra.", "alternativas": ["sair", "descer", "infeliz", "difícil", "esconder"], "certa": 1, "explicacao": "b) descer"}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "estranho, fora do comum", "honroso, que dá orgulho", "caro, que custa muito", "grosseiro, muito grave (um erro)"], "certa": 3, "explicacao": "d) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Situação: O time fez o gol da vitória.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Oba!", "Uau!", "Parabéns!", "Hum!", "Que pena!"], "certa": 0, "explicacao": "a) Oba! — alegria."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Havia um bilhete na mesa.", "Trovejou durante o jogo.", "Felipe voltou para casa.", "Os alunos e a diretora nadaram na piscina.", "Escutei música."], "certa": 3, "explicacao": "d) Os alunos e a diretora nadaram na piscina."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["As portas estavam meio abertas.", "Lívia ficou meia cansada.", "Alice estava meio nervosa.", "Comi meia pizza.", "Bebi meia garrafa de água."], "certa": 1, "explicacao": "b) — o certo é “Lívia ficou meio cansada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um governador</b>? Responda com a letra.", "alternativas": ["Vossa Senhoria", "Vossa Excelência", "Vossa Majestade", "você", "Vossa Reverendíssima"], "certa": 1, "explicacao": "b) Vossa Excelência"}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "pouco, escasso", "mínimo, o menor de todos", "que merece aplausos", "urgente"], "certa": 0, "explicacao": "a) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["saci", "viagem", "vento", "árvore", "sapato"], "certa": 1, "explicacao": "b) viagem — só existe se alguém fizer ou sentir."}, {"enunciado": "“Chegou cedo o dono da padaria.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "o sujeito está escondido (oculto)", "Chegou", "o dono da padaria", "cedo"], "certa": 3, "explicacao": "d) o dono da padaria — o sujeito veio depois do verbo. Pergunte: quem chegou?"}, {"enunciado": "Qual é o coletivo de <b>músicos</b>? Responda com a letra.", "alternativas": ["time", "elenco", "repertório", "coro", "banda"], "certa": 4, "explicacao": "e) banda — coro é de outro grupo."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["As flores eram muito cheirosas.", "Eles riram muito.", "Choveu muito ontem.", "Ele tem muitos amigos.", "Felipe dormiu muito."], "certa": 3, "explicacao": "d) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "esbanjador, que gasta demais", "gênio, muito inteligente", "muito pequeno, escasso", "sem medo, destemido"], "certa": 1, "explicacao": "b) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "“A ponte caiu, por isso tivemos de voltar.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["entretanto", "porque", "contudo", "logo", "todavia"], "certa": 3, "explicacao": "d) logo — as duas dão ideia de conclusão."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
