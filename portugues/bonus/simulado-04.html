<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Felipe voltou a biblioteca.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à biblioteca”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo comeu mais pipoca do que todo mundo.", "Não sei onde o gato se escondeu.", "A porta foi mal pintada e descascou logo.", "O cachorro estava de mau humor por causa do calor.", "Aonde se esconde o polvo?"], "certa": 4, "explicacao": "e) o certo é “Onde”"}, {"enunciado": "Como se lê <b>D. Pedro I</b>? Responda com a letra.", "alternativas": ["1", "terceiro", "segundo", "primeiro", "um"], "certa": 3, "explicacao": "d) primeiro — até o décimo, lê-se como ordinal."}, {"enunciado": "Por que a palavra <b>fóruns</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em um ou uns leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "oxítona terminada em e leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "oxítona terminada em em ou ens leva acento"], "certa": 0, "explicacao": "a) paroxítona terminada em um ou uns leva acento (fó-runs)."}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "arrependido", "muito educado e gentil", "caro, que custa muito", "oportunidade, ocasião"], "certa": 0, "explicacao": "a) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>livre</b>? Responda com a letra.", "alternativas": ["livrérrimo", "mínimo", "libérrimo", "libríssimo", "agradabilíssimo"], "certa": 2, "explicacao": "c) libérrimo"}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["rua", "coroa", "macarrão", "joaninha", "fantasia"], "certa": 2, "explicacao": "c) macarrão — ma-car-rão"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo, venha jantar!", "São Paulo, 16 de outubro de 2026.", "Os alunos e a diretora, receberam visitas.", "Ricardo, cuidado com o degrau!", "Comprei tesoura, caderno e lápis."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (Os alunos e a diretora) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>55º</b> por extenso? Responda com a letra.", "alternativas": ["quinquagésimo sexto", "cinquentésimo quinto", "quinquagésimo quinto", "sexagésimo quinto", "quadragésimo quinto"], "certa": 2, "explicacao": "c) quinquagésimo quinto"}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se apaga", "resistente (ao calor, a mudanças)", "generoso, de coração grande", "fácil de apagar", "estranho, fora do comum"], "certa": 0, "explicacao": "a) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["A loja fechou, por isso voltamos para casa.", "A gente joga bola caso a lição acabe cedo.", "Beba água, já que está muito calor.", "O dia estava nublado, mas não choveu.", "Felipe cantou e Bianca dançou."], "certa": 1, "explicacao": "b) A gente joga bola caso a lição acabe cedo."}, {"enunciado": "Quem nasce em <b>Recife</b> é… Responda com a letra.", "alternativas": ["marroquino", "florianopolitano", "recifense", "mato-grossense", "escocês"], "certa": 2, "explicacao": "c) recifense"}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["jengibre", "lagarticha", "enchergar", "relânpago", "laranjeira"], "certa": 4, "explicacao": "e) laranjeira — vem de laranja: j."}, {"enunciado": "De que duas palavras se forma <b>àquele</b>? Responda com a letra.", "alternativas": ["a + aquele", "a + aquilo", "de + aquele", "àq + aquele", "a + aqueles"], "certa": 0, "explicacao": "a) a + aquele"}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mentira, golpe para enganar", "perigoso, venenoso", "que não faz mal, sem efeito", "que fala ou escreve demais, enrolando", "esperto, que percebe tudo rápido"], "certa": 2, "explicacao": "c) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "“Que filmeco sem graça!”<br>Que sentido tem <b>filmeco</b> nessa frase? Responda com a letra.", "alternativas": ["pressa", "carinho", "desprezo", "tamanho", "admiração"], "certa": 2, "explicacao": "c) desprezo"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["caminho", "mesinha", "livrinho", "casinha", "carrinho"], "certa": 0, "explicacao": "a) caminho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>paz</b>? Responda com a letra.", "alternativas": ["sujo", "guerra", "silêncio", "morrer", "depois"], "certa": 1, "explicacao": "b) guerra"}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["novato, iniciante", "especialista, veterano", "que fala ou escreve demais, enrolando", "nunca visto antes, extraordinário", "que acontece fora de hora"], "certa": 0, "explicacao": "a) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Situação: O time fez o gol da vitória.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Oba!", "Ora bolas!", "Ei!", "Alô!", "Apoiado!"], "certa": 0, "explicacao": "a) Oba! — alegria."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio plantou uma árvore.", "O cachorro e o gato aprenderam uma música nova.", "Bianca escreveu uma carta.", "Há duas laranjas na fruteira.", "Comemos pizza."], "certa": 4, "explicacao": "e) Comemos pizza."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "A professora ficou meia sonolenta.", "Bebi meia garrafa de água.", "Já é meio-dia e meia.", "As portas estavam meio abertas."], "certa": 1, "explicacao": "b) — o certo é “A professora ficou meio sonolenta”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>uma rainha</b>? Responda com a letra.", "alternativas": ["Vossa Senhoria", "Vossa Majestade", "Vossa Excelência", "você", "Vossa Magnificência"], "certa": 1, "explicacao": "b) Vossa Majestade"}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "vencer, controlar (um incêndio, uma crise)", "que dura pouco, passageiro", "esfriar, perder a força", "rigoroso e sem luxo"], "certa": 0, "explicacao": "a) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["mesa", "monstro", "fome", "ar", "água"], "certa": 2, "explicacao": "c) fome — só existe se alguém fizer ou sentir."}, {"enunciado": "“Sumiu do quintal meu avô.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "não tem sujeito", "Sumiu", "do", "meu avô"], "certa": 4, "explicacao": "e) meu avô — o sujeito veio depois do verbo. Pergunte: quem sumiu?"}, {"enunciado": "Qual é o coletivo de <b>atores</b>? Responda com a letra.", "alternativas": ["coro", "manada", "banda", "elenco", "turma"], "certa": 3, "explicacao": "d) elenco — coro é de outro grupo."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Comemos muitos pastéis.", "Havia muita gente na praia.", "Bebi muita água.", "Eles riram muito.", "Fizemos muitas perguntas."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "proveitoso, que dá bons resultados", "grosseiro, muito grave (um erro)", "descuidado, que cai fácil em armadilhas", "precisar muito de algo"], "certa": 0, "explicacao": "a) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "“Fale baixo, já que o bebê está dormindo.”<br>Qual conjunção pode ficar no lugar de <b>já que</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["todavia", "e", "logo", "pois", "contudo"], "certa": 3, "explicacao": "d) pois — as duas dão ideia de explicação."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
