<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Felipe voltou a festa.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à festa”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O desenho ficou mal feito porque a mesa balançava.", "O mal tempo cancelou o passeio de barco.", "O vilão do filme era muito mau.", "O museu fica a dois quarteirões da praça.", "A praia onde passamos o verão tem areia branca."], "certa": 1, "explicacao": "b) o certo é “mau”"}, {"enunciado": "Por que a palavra <b>pé</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em us leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "paroxítona terminada em um ou uns leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "paroxítona terminada em r leva acento"], "certa": 1, "explicacao": "b) monossílabo forte terminado em a, e ou o (com ou sem s) leva acento (pé)."}, {"enunciado": "O que quer dizer <b>inaudito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "breve e direto", "baixo demais para ouvir", "exibido, que usa palavras difíceis só para se mostrar", "nunca visto antes, extraordinário"], "certa": 4, "explicacao": "e) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>agradável</b>? Responda com a letra.", "alternativas": ["agradavelíssimo", "capacíssimo", "friíssimo", "agradavélimo", "agradabilíssimo"], "certa": 4, "explicacao": "e) agradabilíssimo"}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["vazio", "glacial", "cientista", "sair", "laranjeira"], "certa": 4, "explicacao": "e) laranjeira — la-ran-jei-ra"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela, venha jantar!", "A girafa do zoológico, limpou o quarto.", "São Paulo, 16 de outubro de 2026.", "Ontem, choveu muito.", "Ricardo, meu primo, chegou cedo."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (A girafa do zoológico) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>90º</b> por extenso? Responda com a letra.", "alternativas": ["nonagésimo", "centésimo", "octogésimo", "noventésimo", "nonagésimo primeiro"], "certa": 0, "explicacao": "a) nonagésimo"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "estranho, fora do comum", "combinado sem precisar falar, subentendido", "digno de confiança, verdadeiro", "solitário, sozinho"], "certa": 1, "explicacao": "b) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Volte cedo, já que amanhã tem aula.", "Comprei pão e comprei leite.", "Felipe queria jogar, contudo estava com febre.", "O time ganha se treinar bastante.", "O cachorro latiu a noite toda, por isso ninguém dormiu."], "certa": 4, "explicacao": "e) O cachorro latiu a noite toda, por isso ninguém dormiu."}, {"enunciado": "Quem nasce em <b>Aracaju</b> é… Responda com a letra.", "alternativas": ["aracajuano", "fluminense", "palmense", "paulista", "venezuelano"], "certa": 0, "explicacao": "a) aracajuano"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pajé", "jeito", "majestade", "enxergar", "bochexa"], "certa": 4, "explicacao": "e) bochexa — o certo é bochecha: com ch nas duas sílabas."}, {"enunciado": "De que duas palavras se forma <b>àquela</b>? Responda com a letra.", "alternativas": ["a + aquilo", "a + aquelas", "àq + aquela", "de + aquela", "a + aquela"], "certa": 4, "explicacao": "e) a + aquela"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "aliviar, diminuir (uma dor, um problema)", "sem medo, destemido", "feito de leite", "que fala pouco, de poucas palavras"], "certa": 4, "explicacao": "e) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "“A formiguinha cabe na unha.”<br>Que sentido tem <b>formiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "admiração", "pressa", "tamanho", "carinho"], "certa": 3, "explicacao": "d) tamanho"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>fácil</b>? Responda com a letra.", "alternativas": ["ódio", "desligar", "difícil", "simples", "menos"], "certa": 2, "explicacao": "c) difícil — cuidado: “simples” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "caro, que custa muito", "que passa num instante", "honroso, que dá orgulho", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 1, "explicacao": "b) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>simples</b>? Responda com a letra.", "alternativas": ["Aprendemos uma música nova.", "A vovó e o vovô bateram na porta.", "Escureceu de repente.", "Trovejou durante o jogo.", "O time de Felipe pescou no lago."], "certa": 4, "explicacao": "e) O time de Felipe pescou no lago."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "Alice estava meio triste.", "A professora ficou meia sonolenta.", "Comi meia pizza.", "As portas estavam meio abertas."], "certa": 2, "explicacao": "c) — o certo é “A professora ficou meio sonolenta”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "totalmente fechado; difícil de entender", "preciso, feito com muito cuidado", "que dá para acreditar, razoável", "que merece aplausos"], "certa": 3, "explicacao": "d) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "“Saiu correndo o vizinho do lado.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Saiu", "o sujeito está escondido (oculto)", "correndo", "o vizinho do lado"], "certa": 4, "explicacao": "e) o vizinho do lado — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Qual é o coletivo de <b>navios</b>? Responda com a letra.", "alternativas": ["esquadrilha", "frota", "pinhal", "cardume", "tropa"], "certa": 1, "explicacao": "b) frota — esquadrilha é de outro grupo."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "gênio, muito inteligente", "lento para entender", "nunca visto antes, extraordinário", "generoso, de coração grande"], "certa": 0, "explicacao": "a) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "“Beba água, já que está muito calor.”<br>Qual conjunção pode ficar no lugar de <b>já que</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["pois", "todavia", "entretanto", "caso", "se"], "certa": 0, "explicacao": "a) pois — as duas dão ideia de explicação."}, {"enunciado": "Por que a palavra <b>música</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s"], "certa": 1, "explicacao": "b) entre vogais, o s tem som de z"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a couve", "a moto", "o clã", "o diadema", "a eclipse"], "certa": 4, "explicacao": "e) a eclipse — o certo é “o eclipse”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["órfã", "morango", "famoso", "cair", "países"], "certa": 3, "explicacao": "d) cair — ca-ir: é oxítona."}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["infinito, enorme", "mínimo, o menor de todos", "que está em toda parte", "digno de confiança, verdadeiro", "espantado, sem reação"], "certa": 1, "explicacao": "b) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["pac-tuar", "dis-ci-pli-na", "ac-res-cen-tar", "su-bso-lo", "bu-rro"], "certa": 1, "explicacao": "b) dis-ci-pli-na — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "A palavra <b>o polvo</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "epiceno", "não tem gênero", "comum de dois"], "certa": 2, "explicacao": "c) epiceno — animal: o polvo macho / o polvo fêmea."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
