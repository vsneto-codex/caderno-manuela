<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 4 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 4 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Fui ao clube e à piscina.", "Felipe voltou a festa.", "Fui à praia a pé."], "certa": 3, "explicacao": "d) — o certo é “à festa”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O desenho ficou mal feito porque a mesa balançava.", "O mal tempo cancelou o passeio de barco.", "O vilão do filme era muito mau.", "O museu fica a dois quarteirões da praça.", "A praia onde passamos o verão tem areia branca."], "certa": 1, "explicacao": "b) o certo é “mau”"}, {"enunciado": "Por que a palavra <b>pé</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em us leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "paroxítona terminada em um ou uns leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "paroxítona terminada em r leva acento"], "certa": 1, "explicacao": "b) monossílabo forte terminado em a, e ou o (com ou sem s) leva acento (pé)."}, {"enunciado": "O que quer dizer <b>inaudito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "breve e direto", "baixo demais para ouvir", "exibido, que usa palavras difíceis só para se mostrar", "nunca visto antes, extraordinário"], "certa": 4, "explicacao": "e) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>agradável</b>? Responda com a letra.", "alternativas": ["agradavelíssimo", "capacíssimo", "friíssimo", "agradavélimo", "agradabilíssimo"], "certa": 4, "explicacao": "e) agradabilíssimo"}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["vazio", "glacial", "cientista", "sair", "laranjeira"], "certa": 4, "explicacao": "e) laranjeira — la-ran-jei-ra"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela, venha jantar!", "Meu avô, limpou o quarto.", "São Paulo, 16 de outubro de 2026.", "Ontem, choveu muito.", "Ricardo, meu primo, chegou cedo."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (Meu avô) do verbo com vírgula."}, {"enunciado": "Como se escreve <b>71º</b> por extenso? Responda com a letra.", "alternativas": ["septuagésimo primeiro", "sexagésimo primeiro", "septuagésimo segundo", "setentésimo primeiro", "octogésimo primeiro"], "certa": 0, "explicacao": "a) septuagésimo primeiro"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "dispensar, não precisar de algo", "solitário, sozinho", "firme e calmo diante do sofrimento", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 0, "explicacao": "a) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Guarde os brinquedos, pois a visita vai chegar.", "Eu levo o bolo se você levar o suco.", "Felipe queria jogar, contudo estava com febre.", "O cachorro latiu e o gato miou.", "A loja fechou, portanto voltamos para casa."], "certa": 2, "explicacao": "c) Felipe queria jogar, contudo estava com febre."}, {"enunciado": "Quem nasce na <b>China</b> é… Responda com a letra.", "alternativas": ["escocês", "teresinense", "venezuelano", "curitibano", "chinês"], "certa": 4, "explicacao": "e) chinês"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["relâmpago", "jeito", "gesto", "coxilo", "sujeira"], "certa": 3, "explicacao": "d) coxilo — o certo é cochilo: com ch, de cor."}, {"enunciado": "Qual é a junção de <b>de + aquilo</b>? Responda com a letra.", "alternativas": ["àaquilo", "naquilo", "doaquilo", "de aquilo", "daquilo"], "certa": 4, "explicacao": "e) daquilo"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muitas vezes, com frequência", "que fala pouco, de poucas palavras", "feito de leite", "que traz boas notícias", "esperto, que percebe tudo rápido"], "certa": 1, "explicacao": "b) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "“Meu amorzinho!”<br>Que sentido tem <b>amorzinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "desprezo", "carinho", "admiração", "pressa"], "certa": 2, "explicacao": "c) carinho"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>vencer</b>? Responda com a letra.", "alternativas": ["sujo", "mentira", "perder", "tristeza", "fim"], "certa": 2, "explicacao": "c) perder"}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "fora da época certa", "honroso, que dá orgulho", "resistente (ao calor, a mudanças)", "urgente"], "certa": 0, "explicacao": "a) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Manuela e Bianca sonharam com dragões.", "Havia um bilhete na mesa.", "A girafa do zoológico estudou para a prova.", "As crianças da escola dançaram na quadrilha.", "Escrevemos uma carta."], "certa": 1, "explicacao": "b) Havia um bilhete na mesa."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Bebi meia garrafa de água.", "Comi meia pizza.", "Comprei meio quilo de uva.", "Já é meio-dia e meia.", "A vovó ficou meia triste."], "certa": 4, "explicacao": "e) — o certo é “A vovó ficou meio triste”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>plausível</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "espantado, sem reação", "que merece aplausos", "que não se apaga", "que dá para acreditar, razoável"], "certa": 4, "explicacao": "e) que dá para acreditar, razoável. Não é “que merece aplausos”: essa é a pegadinha."}, {"enunciado": "“Chegaram cedo Manuela e Bianca.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Manuela e Bianca", "cedo", "o sujeito está escondido (oculto)", "Chegaram"], "certa": 1, "explicacao": "b) Manuela e Bianca — o sujeito veio depois do verbo. Pergunte: quem chegaram?"}, {"enunciado": "Qual é o coletivo de <b>estrelas</b>? Responda com a letra.", "alternativas": ["constelação", "repertório", "cordilheira", "arquipélago", "galáxia"], "certa": 0, "explicacao": "a) constelação — galáxia é de outro grupo."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "espantado, sem reação", "esbanjador, que gasta demais", "exibido, que usa palavras difíceis só para se mostrar", "gênio, muito inteligente"], "certa": 2, "explicacao": "c) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "“Estudei muito, logo tirei dez.”<br>Qual conjunção pode ficar no lugar de <b>logo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["contudo", "todavia", "porém", "portanto", "e"], "certa": 3, "explicacao": "d) portanto — as duas dão ideia de conclusão."}, {"enunciado": "Por que a palavra <b>música</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o s tem som de z", "ss pode começar uma palavra", "depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss", "no começo da palavra, o s tem som de s"], "certa": 0, "explicacao": "a) entre vogais, o s tem som de z"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a guaraná", "o diadema", "a alface", "o telefonema", "a sentinela"], "certa": 0, "explicacao": "a) a guaraná — o certo é “o guaraná”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["pônei", "cântico", "lágrima", "título", "público"], "certa": 0, "explicacao": "a) pônei — pô-nei: é paroxítona."}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "infinito, enorme", "que não se apaga", "mínimo, o menor de todos", "aliviar, diminuir (uma dor, um problema)"], "certa": 3, "explicacao": "d) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["cab-ri-to", "ét-ni-co", "pa-de-i-ro", "pe-sso-a", "pac-tuar"], "certa": 1, "explicacao": "b) ét-ni-co — a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "A palavra <b>o/a motorista</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "sobrecomum", "tem feminino diferente (biforme)", "epiceno", "comum de dois"], "certa": 4, "explicacao": "e) comum de dois — o motorista / a motorista: a palavra é igual, o artigo muda."}];
const CHAVE='simulado-bonus-4';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
