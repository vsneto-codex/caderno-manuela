<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comi meia pizza.", "Lívia ficou meia cansada.", "Alice estava meio nervosa.", "As portas estavam meio abertas.", "Comprei meio quilo de uva."], "certa": 1, "explicacao": "b) — o certo é “Lívia ficou meio cansada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "As amigas de Lívia, resistiram ao doce.", "Ricardo, cuidado com o degrau!", "Ricardo, venha jantar!", "São Paulo, 16 de outubro de 2026."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (As amigas de Lívia) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["A ponte por que atravessamos é muito antiga.", "O bolo afundou e ninguém sabe por quê.", "Não sei por que ela saiu tão cedo.", "O gelo derreteu porque o dia estava quente?", "A rua porquê ele passa todo dia é barulhenta."], "certa": 4, "explicacao": "e) — o certo é “A rua por que ele passa todo dia é barulhenta.”: troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "que está em toda parte", "que dá para acreditar, razoável", "que não está em lugar nenhum", "proveitoso, que dá bons resultados"], "certa": 1, "explicacao": "b) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["coisa", "canção", "vazio", "biscoito", "lousa"], "certa": 2, "explicacao": "c) vazio — va-zi-o"}, {"enunciado": "A palavra <b>o/a gerente</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "não tem gênero", "comum de dois", "epiceno", "sobrecomum"], "certa": 2, "explicacao": "c) comum de dois — o gerente / a gerente: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "que traz más notícias", "que traz boas notícias", "que acontece fora de hora", "confusão, situação enrolada"], "certa": 2, "explicacao": "c) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>simples</b>? Responda com a letra.", "alternativas": ["Escureceu de repente.", "Chuviscou no fim da tarde.", "Felipe mostrou o desenho.", "O cachorro e o gato mostraram o desenho.", "Toquei violão."], "certa": 2, "explicacao": "c) Felipe mostrou o desenho."}, {"enunciado": "Na semana passada, eles ___ com dragões. Qual forma completa a frase? Responda com a letra.", "alternativas": ["sonham", "sonharam", "sonharão", "sonhariam", "sonhavam"], "certa": 1, "explicacao": "b) sonharam — passado: -am."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["giboia", "enchaqueca", "salgado", "ameicha", "relânpago"], "certa": 2, "explicacao": "c) salgado — vem de sal: l."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "sem medo, destemido", "que fala ou escreve demais, enrolando", "que discute e argumenta demais", "esperto, que percebe tudo rápido"], "certa": 4, "explicacao": "e) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar.", "Bianca trouxe a revista para mim ver.", "Ela deu o recado para eu levar.", "Isso é para eu ler."], "certa": 2, "explicacao": "c) — o certo é “para eu ver”."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabem", "cabiam", "caberam", "caberão", "couberam"], "certa": 4, "explicacao": "e) couberam"}, {"enunciado": "— Psiu! Não acorde o vovô.<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar dor", "mostrar nojo", "pedir silêncio", "mostrar alegria", "chamar alguém"], "certa": 2, "explicacao": "c) pedir silêncio — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["herói", "enjôo", "item", "órfã", "chapéu"], "certa": 1, "explicacao": "b) enjôo — o certo é enjoo: oo e eem NÃO levam acento (voo, enjoo, leem, veem) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "espantado, sem reação", "generoso, de coração grande", "que não faz mal, sem efeito", "cheio de detalhes"], "certa": 0, "explicacao": "a) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>senso</b>? Responda com a letra.", "alternativas": ["contagem da população", "mergulhar", "reserva, ser discreto", "nó", "juízo"], "certa": 4, "explicacao": "e) juízo — não confunda com “censo” (contagem da população)."}, {"enunciado": "Na frase “<b>Por que</b> os gatos ronronam?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "por qual motivo", "o motivo", "pelo qual / pela qual", "pois"], "certa": 1, "explicacao": "b) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>estar nas nuvens</b>? Responda com a letra.", "alternativas": ["implicar com alguém", "acertar em cheio", "estar distraído", "estar distraído ou muito feliz", "passar por muita dificuldade"], "certa": 3, "explicacao": "d) estar distraído ou muito feliz"}, {"enunciado": "“Corri muito, contudo perdi o ônibus.”<br>Qual conjunção pode ficar no lugar de <b>contudo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["entretanto", "já que", "se", "portanto", "por isso"], "certa": 0, "explicacao": "a) entretanto — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que dura pouco tempo", "arrogância, ar de superioridade", "totalmente fechado; difícil de entender", "que é frágil, que quebra fácil"], "certa": 1, "explicacao": "b) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["a-e-ro-por-to", "ad-je-ti-vo", "pes-so-a", "fi-cção", "flau-ta"], "certa": 3, "explicacao": "d) fi-cção — o certo é fic-ção: a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles acordarão cedo.", "Daqui a dois dias, eles escutarão música.", "Amanhã, eles discutirão o assunto.", "Hoje de manhã, eles nadarão na piscina.", "Ontem, eles decidiram o jogo."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Desenhei à fazenda.", "Chegamos às oito horas.", "Começou a chover à noite.", "Fui à praia a pé.", "Viajei a Roma e à Itália."], "certa": 0, "explicacao": "a) — o certo é “a fazenda”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["chorão, que reclama de tudo", "esbanjador, que gasta demais", "excelente, muito habilidoso", "sem medo, destemido", "firme e calmo diante do sofrimento"], "certa": 4, "explicacao": "e) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Lívia, levou três materiais: régua, borracha e lápis.", "Lívia levou três materiais: régua, borracha, e lápis.", "Lívia levou três materiais: régua borracha e lápis.", "Lívia levou três materiais: régua, borracha e lápis.", "Lívia levou três materiais régua, borracha e lápis."], "certa": 3, "explicacao": "d) Lívia levou três materiais: régua, borracha e lápis. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Lívia e o verbo."}, {"enunciado": "Na locução verbal <b>quero procurar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["quero", "os dois são principais", "procurar", "não há verbo principal", "o sujeito"], "certa": 2, "explicacao": "c) procurar — o principal é o último, o que diz a ação."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["piloto", "partir", "irmão", "abraçar", "guaraná"], "certa": 0, "explicacao": "a) piloto — pi-lo-to: é paroxítona."}, {"enunciado": "Ontem eu ___ (verbo <b>contradizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["contradizeru", "contradizi", "contradizei", "contradiz", "contradisse"], "certa": 4, "explicacao": "e) contradisse — contradizer segue dizer: eu disse → eu contradisse."}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "incomum, surpreendente", "que passa num instante", "que dura muito, que não acaba", "que brilha muito forte"], "certa": 2, "explicacao": "c) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
