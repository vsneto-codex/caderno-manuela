<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós assistimos ao jogo pela televisão.", "A gente chega cedo à escola.", "A gente escrevemos cartas para a vovó.", "Nós cantamos no coral da escola.", "A gente desenha muito bem."], "certa": 2, "explicacao": "c) — o certo é “A gente escreve”: a gente pede o verbo como “ele”."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Lívia ficou meia preocupada.", "As portas estavam meio abertas.", "Já é meio-dia e meia.", "Alice estava meio tímida.", "Comprei meio quilo de uva."], "certa": 0, "explicacao": "a) — o certo é “Lívia ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela e Bianca, limparam o quarto.", "Ontem, choveu muito.", "São Paulo, 16 de outubro de 2026.", "Bianca, venha jantar!", "Comprei uva, maçã e manga."], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ela chorou e não disse por quê.", "Diga por que você está triste.", "Ele riu e, não sei por quê, todos riram junto.", "Porque o leite ferve e sobe?", "Ele chorou porque caiu da bicicleta?"], "certa": 3, "explicacao": "d) — o certo é “Por que o leite ferve e sobe?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "que traz boas notícias", "esbanjador, que gasta demais", "resistente (ao calor, a mudanças)", "gênio, muito inteligente"], "certa": 2, "explicacao": "c) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["pão", "ciúme", "lição", "laranjeira", "poção"], "certa": 1, "explicacao": "b) ciúme — ci-ú-me"}, {"enunciado": "A palavra <b>a pantera</b> é… Responda com a letra.", "alternativas": ["comum de dois", "tem feminino diferente (biforme)", "não tem gênero", "epiceno", "sobrecomum"], "certa": 3, "explicacao": "d) epiceno — animal: a pantera macho / a pantera fêmea."}, {"enunciado": "Como se lê <b>século XVIII</b>? Responda com a letra.", "alternativas": ["dezenove", "dezoito", "18", "décimo oitavo", "dezessete"], "certa": 1, "explicacao": "b) dezoito — depois do décimo, lê-se como cardinal."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um governador</b>? Responda com a letra.", "alternativas": ["Vossa Alteza", "você", "Vossa Majestade", "Vossa Excelência", "Vossa Magnificência"], "certa": 3, "explicacao": "d) Vossa Excelência"}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "que não toma partido, que é justo com todos os lados", "sem nenhum machucado, ileso", "mínimo, o menor de todos", "infinito, enorme"], "certa": 3, "explicacao": "d) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Começou à chover forte.", "Fui ao clube e à piscina.", "Fiz uma visita àquele museu.", "Aprendi a nadar."], "certa": 1, "explicacao": "b) — o certo é “a chover”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Garoou de manhã.", "Uni as peças.", "Os primos de Ricardo uniram as peças.", "Havia três gatos no telhado.", "Manuela e Bianca brincaram no parque."], "certa": 1, "explicacao": "b) Uni as peças."}, {"enunciado": "Hoje de manhã, eles ___ música. Qual forma completa a frase? Responda com a letra.", "alternativas": ["escutam", "escutavam", "escutariam", "escutaram", "escutarão"], "certa": 3, "explicacao": "d) escutaram — passado: -am."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["fachina", "jeito", "chuxu", "genjibre", "saugado"], "certa": 1, "explicacao": "b) jeito — com j, de cor."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "sem nenhum machucado, ileso", "muito antigo e valioso", "fora da época certa", "incomum, surpreendente"], "certa": 3, "explicacao": "d) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Sem mim, a festa não teria graça.", "Isso é para eu ler.", "Ela deu o recado para eu levar.", "A professora deu a tarefa para mim fazer."], "certa": 4, "explicacao": "e) — o certo é “para eu fazer”."}, {"enunciado": "Ontem eu ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trazi", "trazia", "trouxe", "trago", "trarei"], "certa": 2, "explicacao": "c) trouxe"}, {"enunciado": "— Psiu! Estamos na biblioteca.<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["chamar alguém", "mostrar nojo", "mostrar alegria", "mostrar dor", "pedir silêncio"], "certa": 4, "explicacao": "e) pedir silêncio — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["feiura", "polens", "vírus", "tórax", "geléia"], "certa": 4, "explicacao": "e) geléia — o certo é geleia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["atento, prestando atenção", "remédio para todos os males", "espantado, sem reação", "muito pequeno, escasso", "que acontece por acaso"], "certa": 2, "explicacao": "c) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>comprimento</b>? Responda com a letra.", "alternativas": ["sinal gráfico", "prestes a acontecer", "saudação", "evidente, na hora do ato", "medida"], "certa": 4, "explicacao": "e) medida — não confunda com “cumprimento” (saudação)."}, {"enunciado": "Na frase “<b>Por que</b> o leite ferve e sobe?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "porém", "por qual motivo", "pelo qual / pela qual", "por isso"], "certa": 2, "explicacao": "c) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>ser a ovelha negra</b>? Responda com a letra.", "alternativas": ["levar a culpa sozinho", "acertar em cheio", "ser o diferente do grupo", "desistir de tudo com raiva", "contar a verdade"], "certa": 2, "explicacao": "c) ser o diferente do grupo"}, {"enunciado": "“A sopa estava quente, porém comi rapidinho.”<br>Qual conjunção pode ficar no lugar de <b>porém</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["por isso", "portanto", "caso", "contudo", "porque"], "certa": 3, "explicacao": "d) contudo — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "confusão, situação enrolada", "espantado, sem reação", "desmentir, contradizer", "confirmar, reforçar uma ideia"], "certa": 4, "explicacao": "e) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ar-roz", "pas-sa-gei-ro", "ne-gro", "ci-en-tis-ta", "car-te-i-ra"], "certa": 4, "explicacao": "e) car-te-i-ra — o certo é car-tei-ra: no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os cachorro-quentes", "os fósseis", "os pires", "os funis", "os pães"], "certa": 0, "explicacao": "a) os cachorro-quentes — o certo é os cachorros-quentes."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles uniram as peças.", "Na semana passada, eles jogaram bola.", "Na semana passada, eles beberam suco.", "Daqui a dois dias, eles andaram de bicicleta.", "No ano que vem, eles assistirão a um filme."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos ao meio-dia.", "Às vezes, durmo à tarde.", "Dei um abraço a diretora.", "Ficaram frente a frente.", "Começou a chover à noite."], "certa": 2, "explicacao": "c) — o certo é “à diretora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "remédio para todos os males", "arrogância, ar de superioridade", "pena, compaixão pelos outros", "mentira, golpe para enganar"], "certa": 2, "explicacao": "c) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
