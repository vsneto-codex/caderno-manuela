<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comi meia pizza.", "Bianca ficou meia triste.", "Bebi meia garrafa de água.", "Já é meio-dia e meia.", "Comprei meio quilo de uva."], "certa": 1, "explicacao": "b) — o certo é “Bianca ficou meio triste”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela, cuidado com o degrau!", "Comprei uva, manga e laranja.", "Ontem, choveu muito.", "Otávio, o goleiro, chegou cedo.", "Bianca, vendeu limonada."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (Bianca) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ela estava feliz, não sei por quê.", "O bolo queimou porque ficou muito tempo no forno?", "O cientista descobriu porque os vulcões entram em erupção.", "O gato fugiu, não sei por quê, e voltou à noite.", "Não há por que chorar: o cachorro voltou."], "certa": 2, "explicacao": "c) — o certo é “O cientista descobriu por que os vulcões entram em erupção.”: é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Leia: “Hoje o celular é ubíquo: está em todas as mãos.” Nessa frase, <b>ubíquo</b> quer dizer… Responda com a letra.", "alternativas": ["onde é muito difícil viver", "digno de confiança, verdadeiro", "que não está em lugar nenhum", "exibido, que usa palavras difíceis só para se mostrar", "que está em toda parte"], "certa": 4, "explicacao": "e) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["passear", "navio", "biscoito", "toalha", "vazio"], "certa": 2, "explicacao": "c) biscoito — bis-coi-to"}, {"enunciado": "A palavra <b>a zebra</b> é… Responda com a letra.", "alternativas": ["epiceno", "comum de dois", "sobrecomum", "não tem gênero", "tem feminino diferente (biforme)"], "certa": 0, "explicacao": "a) epiceno — animal: a zebra macho / a zebra fêmea."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que traz más notícias", "urgente", "excelente, muito habilidoso", "novato, iniciante", "que traz boas notícias"], "certa": 4, "explicacao": "e) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>simples</b>? Responda com a letra.", "alternativas": ["Os alunos e a diretora acordaram cedo.", "Os primos de Ricardo tocaram violão.", "Desenhamos um castelo.", "Ventou forte a noite toda.", "Faz muito calor no verão."], "certa": 1, "explicacao": "b) Os primos de Ricardo tocaram violão."}, {"enunciado": "Na semana passada, eles ___ na piscina. Qual forma completa a frase? Responda com a letra.", "alternativas": ["nadariam", "nadavam", "nadaram", "nadarão", "nadam"], "certa": 2, "explicacao": "c) nadaram — passado: -am."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["gengibre", "jiboia", "boxecha", "chuchu", "chuveiro"], "certa": 2, "explicacao": "c) boxecha — o certo é bochecha: com ch nas duas sílabas."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "que discute e argumenta demais", "esperto, que percebe tudo rápido", "espantado, sem reação", "que não faz mal, sem efeito"], "certa": 2, "explicacao": "c) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Trouxe o lápis para eu desenhar.", "Isso é para eu ler.", "Para mim, fazer isso é fácil.", "Ela deu o recado para eu levar.", "Mamãe trouxe o livro para mim desenhar."], "certa": 4, "explicacao": "e) — o certo é “para eu desenhar”."}, {"enunciado": "Ontem eu ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["disse", "dizia", "dizi", "digo", "direi"], "certa": 0, "explicacao": "a) disse"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jiboia", "enjôo", "pólen", "feiura", "hífen"], "certa": 1, "explicacao": "b) enjôo — o certo é enjoo: oo e eem NÃO levam acento (voo, enjoo, leem, veem) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "tão bom que não dá para descrever com palavras", "cheio de detalhes", "breve e direto", "caro, que custa muito"], "certa": 3, "explicacao": "d) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "Na frase “<b>Por que</b> a Lua muda de forma?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "pelo qual / pela qual", "o motivo", "por qual motivo", "motivo para"], "certa": 3, "explicacao": "d) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>pagar o pato</b>? Responda com a letra.", "alternativas": ["levar a culpa sozinho", "confiar totalmente", "ficar muito bravo", "fazer igual", "agir com muito cuidado"], "certa": 0, "explicacao": "a) levar a culpa sozinho"}, {"enunciado": "“Esqueci o guarda-chuva, por isso fiquei molhado.”<br>Qual conjunção pode ficar no lugar de <b>por isso</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["mas", "contudo", "portanto", "porém", "já que"], "certa": 2, "explicacao": "c) portanto — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "confirmar, reforçar uma ideia", "que dura pouco tempo", "rigoroso e sem luxo", "que é frágil, que quebra fácil"], "certa": 2, "explicacao": "c) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["af-ta", "su-jei-ra", "jo-e-lho", "ped-ra", "a-cres-cen-tar"], "certa": 3, "explicacao": "d) ped-ra — o certo é pe-dra: encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Daqui a dois dias, eles venderão limonada.", "Hoje de manhã, eles sonharam com dragões.", "Ontem, eles tocaram violão.", "Ontem, eles aprenderam uma música nova.", "No ano que vem, eles comeram pizza."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Às vezes, durmo à tarde.", "Falei a pessoas da fila.", "Começou à chover.", "Entreguei o presente a ela."], "certa": 3, "explicacao": "d) — o certo é “a chover”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["chorão, que reclama de tudo", "remédio para todos os males", "que dá para acreditar, razoável", "firme e calmo diante do sofrimento", "dispensar, não precisar de algo"], "certa": 3, "explicacao": "d) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Caio comprou três frutas: laranja maçã e uva.", "Caio comprou três frutas laranja, maçã e uva.", "Caio comprou três frutas: laranja, maçã e uva.", "Caio, comprou três frutas: laranja, maçã e uva.", "Caio comprou três frutas: laranja, maçã, e uva."], "certa": 2, "explicacao": "c) Caio comprou três frutas: laranja, maçã e uva. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Caio e o verbo."}, {"enunciado": "Na locução verbal <b>estou partindo</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "o sujeito", "partindo", "estou", "os dois são principais"], "certa": 2, "explicacao": "c) partindo — o principal é o último, o que diz a ação."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["nêutron", "época", "tônica", "óculos", "pássaro"], "certa": 0, "explicacao": "a) nêutron — nêu-tron: é paroxítona."}, {"enunciado": "Ontem eu ___ (verbo <b>predizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["prediz", "predisse", "predizeru", "predizi", "predizei"], "certa": 1, "explicacao": "b) predisse — predizer segue dizer: eu disse → eu predisse."}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "que passa num instante", "firme e calmo diante do sofrimento", "que brilha muito forte", "esperto, que percebe tudo rápido"], "certa": 1, "explicacao": "b) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>barriga</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["depois de n, l e s, o r tem som forte com uma letra só", "no começo da palavra, o r já tem som forte", "entre vogais, o som forte do r se escreve com rr", "entre vogais, um r só tem som forte", "rr aparece só no começo das palavras"], "certa": 2, "explicacao": "c) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "Como se escreve <b>81º</b> por extenso? Responda com a letra.", "alternativas": ["octogésimo segundo", "oitentésimo primeiro", "nonagésimo primeiro", "octogésimo primeiro", "septuagésimo primeiro"], "certa": 3, "explicacao": "d) octogésimo primeiro"}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
