<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "A palavra <b>o/a dentista</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "não tem gênero", "epiceno", "comum de dois", "sobrecomum"], "certa": 3, "explicacao": "d) comum de dois — o dentista / a dentista: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "esbanjador, que gasta demais", "muitas vezes, com frequência", "que não está em lugar nenhum", "grosseiro, muito grave (um erro)"], "certa": 0, "explicacao": "a) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["gesto", "enchergar", "cachecol", "gengibre", "xampu"], "certa": 1, "explicacao": "b) enchergar — o certo é enxergar: depois de en- se usa x."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a alface", "a sentinela", "a mão", "a couve", "o omelete"], "certa": 4, "explicacao": "e) o omelete — o certo é “a omelete”."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que traz más notícias", "caro, que custa muito", "inconveniente; fora do assunto", "intenso, enérgico", "que traz boas notícias"], "certa": 4, "explicacao": "e) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Desenhei à escola.", "Ficaram frente a frente.", "Começou a chover à noite.", "Entreguei o presente a ela."], "certa": 1, "explicacao": "b) — o certo é “a escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O vovô trouxe o livro para mim copiar.", "Trouxe o lápis para eu desenhar.", "Isso é para eu ler.", "Para mim, fazer isso é fácil.", "Para mim, estudar à noite é melhor."], "certa": 0, "explicacao": "a) — o certo é “para eu copiar”."}, {"enunciado": "Ontem, eles ___ com dragões. Qual forma completa a frase? Responda com a letra.", "alternativas": ["sonharão", "sonham", "sonhariam", "sonhavam", "sonharam"], "certa": 4, "explicacao": "e) sonharam — passado: -am."}, {"enunciado": "Por que a palavra <b>japonesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["palavras que indicam país terminam em -eza", "femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem", "substantivos que vêm de adjetivos terminam em -eza", "o final -esa sempre se escreve com z"], "certa": 1, "explicacao": "b) femininos e palavras de origem terminam em -esa"}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "esperto, que percebe tudo rápido", "que discute e argumenta demais", "que arma truques para enganar", "que dá para acreditar, razoável"], "certa": 1, "explicacao": "b) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>intervir</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["intervei", "interviru", "interviu", "intervi", "intervim"], "certa": 4, "explicacao": "e) intervim — intervir segue vir: eu vim → eu intervim."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles tocaram violão.", "Daqui a dois dias, eles venderam limonada.", "No ano que vem, eles guardarão os brinquedos.", "Hoje de manhã, eles comeram pizza.", "No ano que vem, eles lavarão o carro."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Por que a palavra <b>barriga</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, o som forte do r se escreve com rr", "rr aparece só no começo das palavras", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, um r só tem som forte", "no começo da palavra, o r já tem som forte"], "certa": 0, "explicacao": "a) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["nunca visto antes, extraordinário", "totalmente fechado; difícil de entender", "breve e direto", "remédio para todos os males", "cheio de detalhes"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["glacial", "mamão", "encharcar", "língua", "gambá"], "certa": 3, "explicacao": "d) língua — lín-gua: é paroxítona."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["desça", "camponesa", "picina", "assobio", "exceto"], "certa": 2, "explicacao": "c) picina — o certo é piscina: com sc, como descer."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "pouco, escasso", "que é frágil, que quebra fácil", "grosseiro, muito grave (um erro)", "intenso, enérgico"], "certa": 0, "explicacao": "a) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>61º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo primeiro", "septuagésimo primeiro", "quinquagésimo primeiro", "sessentésimo primeiro", "sexagésimo segundo"], "certa": 0, "explicacao": "a) sexagésimo primeiro"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aonde o rio vai chegar?", "O time jogou mal e perdeu o campeonato.", "Onde ficam os menores ossos do corpo?", "Onde o ônibus vai nos levar?", "Onde a tartaruga bota os ovos?"], "certa": 3, "explicacao": "d) o certo é “Aonde”"}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "chorão, que reclama de tudo", "firme e calmo diante do sofrimento", "onde é muito difícil viver", "que dá para acreditar, razoável"], "certa": 2, "explicacao": "c) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>família</b> tem acento? Responda com a letra.", "alternativas": ["oxítona (força na última sílaba) terminada em a leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "oxítona terminada em o leva acento", "paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento", "oxítona terminada em em ou ens leva acento"], "certa": 3, "explicacao": "d) paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento (fa-mí-li-a)."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["pinguim", "máquina", "mangueira", "caranguejo", "sangue"], "certa": 0, "explicacao": "a) pinguim — em “pinguim” a gente fala o u"}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "arrogância, ar de superioridade", "que brilha muito forte", "que não faz mal, sem efeito", "que passa num instante"], "certa": 4, "explicacao": "e) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Venezuela</b> é… Responda com a letra.", "alternativas": ["venezuelano", "indiano", "gaúcho", "inglês", "russo"], "certa": 0, "explicacao": "a) venezuelano"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Quero entender por que a Lua muda de forma.", "O bolo afundou e ninguém sabe por quê.", "Você não comeu porque estava sem fome?", "A rua por que ele passa todo dia é barulhenta.", "Leve o casaco, por que vai esfriar."], "certa": 4, "explicacao": "e) — o certo é “Leve o casaco, porque vai esfriar.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["açúcar", "órfã", "jabutí", "ideia", "veem"], "certa": 2, "explicacao": "c) jabutí — o certo é jabuti: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Leia: “O time fez algo inaudito: ganhou de dez a zero.” Nessa frase, <b>inaudito</b> quer dizer… Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "arrependido", "nunca visto antes, extraordinário", "baixo demais para ouvir", "onde é muito difícil viver"], "certa": 2, "explicacao": "c) nunca visto antes, extraordinário. Não é “baixo demais para ouvir”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["rua", "mau", "sessão", "dinossauro", "exceções"], "certa": 0, "explicacao": "a) rua — ru-a"}, {"enunciado": "Na locução verbal <b>vamos pescar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["pescar", "o sujeito", "os dois são principais", "não há verbo principal", "vamos"], "certa": 0, "explicacao": "a) pescar — o principal é o último, o que diz a ação."}, {"enunciado": "Leia: “Um pinguim na praia de Copacabana é uma cena insólita.” Nessa frase, <b>insólita</b> quer dizer… Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "ligado à vida simples e tranquila do campo", "estranho, fora do comum", "esfriar, perder a força", "solitário, sozinho"], "certa": 2, "explicacao": "c) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
