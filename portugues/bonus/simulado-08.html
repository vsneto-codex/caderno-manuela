<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Já é meio-dia e meia.", "A vovó ficou meia tímida.", "Bebi meia garrafa de água.", "Comi meia pizza.", "Alice estava meio confusa."], "certa": 1, "explicacao": "b) — o certo é “A vovó ficou meio tímida”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo, cuidado com o degrau!", "Ricardo, venha jantar!", "Ricardo, meu primo, chegou cedo.", "Ontem, choveu muito.", "As crianças da escola, trabalharam na horta."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (As crianças da escola) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você faltou porque estava doente?", "Explique por que a planta precisa de sol.", "Quero entender o porque dessa regra.", "O gelo derreteu porque o dia estava quente?", "Você faltou por quê, afinal?"], "certa": 2, "explicacao": "c) — o certo é “Quero entender o porquê dessa regra.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Leia: “Hoje o celular é ubíquo: está em todas as mãos.” Nessa frase, <b>ubíquo</b> quer dizer… Responda com a letra.", "alternativas": ["intenso, enérgico", "que está em toda parte", "que não está em lugar nenhum", "muitas vezes, com frequência", "digno de confiança, verdadeiro"], "certa": 1, "explicacao": "b) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["lua", "mau", "enfermeira", "degrau", "treinar"], "certa": 0, "explicacao": "a) lua — lu-a"}, {"enunciado": "A palavra <b>a pessoa</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "tem feminino diferente (biforme)", "sobrecomum", "epiceno", "comum de dois"], "certa": 2, "explicacao": "c) sobrecomum — a pessoa serve para menino e menina, sem mudar nada."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "resistente (ao calor, a mudanças)", "que dura pouco tempo", "que traz boas notícias", "que traz más notícias"], "certa": 3, "explicacao": "d) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Trovejou durante o jogo.", "Os alunos e a diretora mostraram o desenho.", "Joguei bola.", "Felipe discutiu o assunto.", "Manuela e Bianca acordaram cedo."], "certa": 2, "explicacao": "c) Joguei bola."}, {"enunciado": "Na semana passada, eles ___ na quadrilha. Qual forma completa a frase? Responda com a letra.", "alternativas": ["dançavam", "dançaram", "dançam", "dançarão", "dançariam"], "certa": 1, "explicacao": "b) dançaram — passado: -am."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["ameicha", "sugeira", "beringela", "relâmpago", "enchaqueca"], "certa": 3, "explicacao": "d) relâmpago — m antes de p."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito pequeno, escasso", "preciso, feito com muito cuidado", "que discute e argumenta demais", "esperto, que percebe tudo rápido", "nunca visto antes, extraordinário"], "certa": 3, "explicacao": "d) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "O bolo é para mim.", "Felipe trouxe a revista para mim ler.", "Ela deu o recado para eu levar."], "certa": 3, "explicacao": "d) — o certo é “para eu ler”."}, {"enunciado": "Ontem eles ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["querem", "quiseram", "queriam", "quererão", "quereram"], "certa": 1, "explicacao": "b) quiseram"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["raiz", "países", "álbum", "caír", "feiura"], "certa": 3, "explicacao": "d) caír — o certo é cair: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cheio de detalhes", "combinado sem precisar falar, subentendido", "breve e direto", "arrogância, ar de superioridade", "mentira, golpe para enganar"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "Na frase “<b>Por que</b> a Lua muda de forma?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "pois", "por qual motivo", "pelo qual / pela qual", "o motivo"], "certa": 2, "explicacao": "c) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>ficar de olho</b>? Responda com a letra.", "alternativas": ["falar demais", "fingir que não é com ele", "agir com muito cuidado", "fazer com facilidade", "vigiar"], "certa": 4, "explicacao": "e) vigiar"}, {"enunciado": "“Coma a salada, pois faz bem à saúde.”<br>Qual conjunção pode ficar no lugar de <b>pois</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["contudo", "e", "porque", "entretanto", "por isso"], "certa": 2, "explicacao": "c) porque — as duas dão ideia de explicação."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "combinado sem precisar falar, subentendido", "que é frágil, que quebra fácil", "que dura pouco tempo", "esperto, que percebe tudo rápido"], "certa": 3, "explicacao": "d) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["at-mos-fe-ra", "re-crei-o", "tig-re", "ex-ce-to", "a-le-gri-a"], "certa": 2, "explicacao": "c) tig-re — o certo é ti-gre: encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Daqui a dois dias, eles cantarão na festa.", "No ano que vem, eles assistirão a um filme.", "Amanhã, eles falarão com a vovó.", "Na semana passada, eles desenharão um castelo.", "No ano que vem, eles pescarão no lago."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou a chover à noite.", "Aprendi a nadar.", "Fui à praia a pé.", "Voltei a loja.", "Fui ao clube e à piscina."], "certa": 3, "explicacao": "d) — o certo é “à loja”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["chorão, que reclama de tudo", "firme e calmo diante do sofrimento", "estranho, fora do comum", "muitas vezes, com frequência", "rigoroso e sem luxo"], "certa": 1, "explicacao": "b) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Enzo escolheu três cores: amarelo, laranja e verde.", "Enzo escolheu três cores: amarelo laranja e verde.", "Enzo, escolheu três cores: amarelo, laranja e verde.", "Enzo escolheu três cores amarelo, laranja e verde.", "Enzo escolheu três cores: amarelo, laranja, e verde."], "certa": 0, "explicacao": "a) Enzo escolheu três cores: amarelo, laranja e verde. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Enzo e o verbo."}, {"enunciado": "Na locução verbal <b>tenho de começar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["o sujeito", "tenho", "os dois são principais", "não há verbo principal", "começar"], "certa": 4, "explicacao": "e) começar — o principal é o último, o que diz a ação."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["açúcar", "passarela", "táxi", "tartaruga", "feliz"], "certa": 4, "explicacao": "e) feliz — fe-liz: é oxítona."}, {"enunciado": "Ontem eu ___ (verbo <b>convir</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["convim", "convi", "conviru", "conviu", "convei"], "certa": 0, "explicacao": "a) convim — convir segue vir: eu vim → eu convim."}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "oportunidade, ocasião", "que arma truques para enganar", "que brilha muito forte", "que não se apaga"], "certa": 0, "explicacao": "a) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>mexer</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["depois de me- se usa x", "depois de en- se usa x", "depois de ditongo se usa x", "depois de ditongo se usa ch", "palavras que vêm de outras com ch usam x"], "certa": 0, "explicacao": "a) depois de me- se usa x"}, {"enunciado": "Como se escreve <b>81º</b> por extenso? Responda com a letra.", "alternativas": ["septuagésimo primeiro", "octogésimo primeiro", "octogésimo segundo", "oitentésimo primeiro", "nonagésimo primeiro"], "certa": 1, "explicacao": "b) octogésimo primeiro"}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
