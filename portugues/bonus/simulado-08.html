<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "Clara estava meio tímida.", "As portas estavam meio abertas.", "Lívia ficou meia preocupada.", "Bebi meia garrafa de água."], "certa": 3, "explicacao": "d) — o certo é “Lívia ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Bianca, a capitã do time, chegou cedo.", "Comprei tesoura, lápis e borracha.", "O vizinho do lado, assistiu a um filme.", "São Paulo, 16 de outubro de 2026.", "Ricardo, venha jantar!"], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (O vizinho do lado) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ele chorou porque caiu da bicicleta?", "Você está bravo porque perdeu o jogo?", "Não sei por que ela saiu tão cedo.", "— Não vou à praia. — Por quê?", "Porquê razão o bolo afundou?"], "certa": 4, "explicacao": "e) — o certo é “Por que razão o bolo afundou?”: vem antes de uma palavra como motivo ou razão: troque por “por qual”."}, {"enunciado": "Leia: “Hoje o celular é ubíquo: está em todas as mãos.” Nessa frase, <b>ubíquo</b> quer dizer… Responda com a letra.", "alternativas": ["urgente", "esbanjador, que gasta demais", "que não está em lugar nenhum", "inconveniente; fora do assunto", "que está em toda parte"], "certa": 4, "explicacao": "e) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["queixo", "passear", "trovão", "faixa", "mãe"], "certa": 1, "explicacao": "b) passear — pas-se-ar"}, {"enunciado": "A palavra <b>a pessoa</b> é… Responda com a letra.", "alternativas": ["comum de dois", "não tem gênero", "sobrecomum", "epiceno", "tem feminino diferente (biforme)"], "certa": 2, "explicacao": "c) sobrecomum — a pessoa serve para menino e menina, sem mudar nada."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "que traz más notícias", "que traz boas notícias", "oportunidade, ocasião", "urgente"], "certa": 2, "explicacao": "c) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["A vovó e o vovô tocaram violão.", "Ventou forte a noite toda.", "Pulei corda.", "Ricardo e a irmã jogaram bola.", "A turma do quinto ano tocou violão."], "certa": 1, "explicacao": "b) Ventou forte a noite toda."}, {"enunciado": "Hoje de manhã, eles ___ uma música nova. Qual forma completa a frase? Responda com a letra.", "alternativas": ["aprendiam", "aprenderão", "aprenderiam", "aprenderam", "aprendem"], "certa": 3, "explicacao": "d) aprenderam — passado: -am."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["gorgeta", "chimarrão", "ameicha", "xuchu", "mecherica"], "certa": 1, "explicacao": "b) chimarrão — com ch; som forte entre vogais: rr."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "esfriar, perder a força", "generoso, de coração grande", "que não faz mal, sem efeito", "que discute e argumenta demais"], "certa": 0, "explicacao": "a) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela deu o recado para eu levar.", "Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "Trouxe o lápis para eu desenhar.", "O vovô trouxe o livro para mim copiar."], "certa": 4, "explicacao": "e) — o certo é “para eu copiar”."}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["quererei", "queri", "quero", "queria", "quis"], "certa": 4, "explicacao": "e) quis"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jabutí", "itens", "feiura", "saúde", "açúcar"], "certa": 0, "explicacao": "a) jabutí — o certo é jabuti: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "cheio de detalhes", "breve e direto", "generoso, de coração grande", "confirmar, reforçar uma ideia"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>emigrante</b>? Responda com a letra.", "alternativas": ["quem entra no país", "prestes a acontecer", "aumentar", "quem sai do país", "reparo"], "certa": 3, "explicacao": "d) quem sai do país — não confunda com “imigrante” (quem entra no país)."}, {"enunciado": "Na frase “Leve o casaco, <b>porque</b> vai esfriar.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual", "porém", "pois", "motivo para", "o motivo"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>chutar o balde</b>? Responda com a letra.", "alternativas": ["lamentar o que não tem volta", "perder a chance por distração", "fazer com facilidade", "lembrar de tudo", "desistir de tudo com raiva"], "certa": 4, "explicacao": "e) desistir de tudo com raiva"}, {"enunciado": "“O dia estava nublado, entretanto não choveu.”<br>Qual conjunção pode ficar no lugar de <b>entretanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porque", "logo", "já que", "caso", "contudo"], "certa": 4, "explicacao": "e) contudo — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "que não faz mal, sem efeito", "ligado à vida simples e tranquila do campo", "que é frágil, que quebra fácil", "que passa num instante"], "certa": 0, "explicacao": "a) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["mu-se-u", "goi-a-ba", "a-dmi-rar", "nob-re-za", "ciú-me"], "certa": 1, "explicacao": "b) goi-a-ba — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles trabalharam na horta.", "Hoje de manhã, eles andaram de bicicleta.", "No ano que vem, eles lavarão o carro.", "No ano que vem, eles assistiram a um filme.", "Amanhã, eles nadarão na piscina."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Fui a fazenda.", "Falei a pessoas da fila.", "Vou à Bahia.", "Chegamos ao meio-dia."], "certa": 1, "explicacao": "b) — o certo é “à fazenda”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "chorão, que reclama de tudo", "incomum, surpreendente", "breve e direto", "firme e calmo diante do sofrimento"], "certa": 4, "explicacao": "e) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Cecília comprou três frutas: uva, laranja, e manga.", "Cecília comprou três frutas: uva laranja e manga.", "Cecília, comprou três frutas: uva, laranja e manga.", "Cecília comprou três frutas uva, laranja e manga.", "Cecília comprou três frutas: uva, laranja e manga."], "certa": 4, "explicacao": "e) Cecília comprou três frutas: uva, laranja e manga. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Cecília e o verbo."}, {"enunciado": "Na locução verbal <b>posso comer</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["comer", "os dois são principais", "posso", "o sujeito", "não há verbo principal"], "certa": 0, "explicacao": "a) comer — o principal é o último, o que diz a ação."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["pântano", "câmera", "amável", "helicóptero", "fósforo"], "certa": 2, "explicacao": "c) amável — a-má-vel: é paroxítona."}, {"enunciado": "Ontem eu ___ (verbo <b>convir</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["convei", "conviru", "convi", "convim", "conviu"], "certa": 3, "explicacao": "d) convim — convir segue vir: eu vim → eu convim."}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "que traz boas notícias", "que brilha muito forte", "esforço, vontade forte de fazer algo", "que passa num instante"], "certa": 4, "explicacao": "e) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>peixe</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["palavras que vêm de outras com ch usam x", "depois de ditongo se usa ch", "depois de ditongo se usa x", "depois de me- se usa x", "depois de en- se usa x"], "certa": 2, "explicacao": "c) depois de ditongo se usa x"}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
