<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós precisamos de ajuda.", "A gente canta no coral da escola.", "Nós estudamos juntos todo dia.", "A gente escreve cartas para a vovó.", "A gente comemos muita fruta."], "certa": 4, "explicacao": "e) — o certo é “A gente come”: a gente pede o verbo como “ele”."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Bebi meia garrafa de água.", "Alice estava meio sonolenta.", "As portas estavam meio abertas.", "Comprei meio quilo de uva.", "Manuela ficou meia preocupada."], "certa": 4, "explicacao": "e) — o certo é “Manuela ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Manuela, cuidado com o degrau!", "Comprei borracha, caderno e tesoura.", "Manuela, venha jantar!", "O cachorro e o gato, discutiram o assunto."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (O cachorro e o gato) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O túnel por que o trem passa é escuro.", "— Hoje não tem aula. — Por quê?", "Porquê o mar tem ondas", "Quero entender por que a Lua muda de forma.", "O cachorro fugiu porque o portão estava aberto?"], "certa": 2, "explicacao": "c) — o certo é “Por que o mar tem ondas”: é uma pergunta em forma de título: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "aliviar, diminuir (uma dor, um problema)", "mentira, golpe para enganar", "oportunidade, ocasião", "gênio, muito inteligente"], "certa": 0, "explicacao": "a) esbanjador, que gasta demais. Não é “gênio, muito inteligente”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["fantasia", "rouxinol", "sair", "voar", "assobiar"], "certa": 1, "explicacao": "b) rouxinol — rou-xi-nol"}, {"enunciado": "A palavra <b>o hipopótamo</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "comum de dois", "não tem gênero", "epiceno", "tem feminino diferente (biforme)"], "certa": 3, "explicacao": "d) epiceno — animal: o hipopótamo macho / o hipopótamo fêmea."}, {"enunciado": "Como se lê <b>papa Pio XII</b>? Responda com a letra.", "alternativas": ["treze", "12", "onze", "décimo segundo", "doze"], "certa": 4, "explicacao": "e) doze — depois do décimo, lê-se como cardinal."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um prefeito</b>? Responda com a letra.", "alternativas": ["Vossa Magnificência", "Vossa Excelência", "Vossa Senhoria", "Vossa Reverendíssima", "você"], "certa": 1, "explicacao": "b) Vossa Excelência"}, {"enunciado": "O que quer dizer <b>ínfimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "nunca visto antes, extraordinário", "fora da época certa", "infinito, enorme", "descuidado, que cai fácil em armadilhas"], "certa": 0, "explicacao": "a) mínimo, o menor de todos. Não é “infinito, enorme”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Às vezes, durmo à tarde.", "Chegamos às oito horas.", "Entreguei o presente a ela.", "Ficaram cara à cara.", "Chegamos ao meio-dia."], "certa": 3, "explicacao": "d) — o certo é “cara a cara”: entre palavras repetidas (cara a cara, gota a gota) não tem crase."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Escureceu de repente.", "Toquei violão.", "A professora de música resistiu ao doce.", "As amigas de Lívia estudaram para a prova.", "O cachorro e o gato bateram na porta."], "certa": 1, "explicacao": "b) Toquei violão."}, {"enunciado": "Ontem, eles ___ cedo. Qual forma completa a frase? Responda com a letra.", "alternativas": ["acordavam", "acordarão", "acordaram", "acordam", "acordariam"], "certa": 2, "explicacao": "c) acordaram — passado: -am."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["xuveiro", "faxina", "berinjela", "salgado", "chimarrão"], "certa": 0, "explicacao": "a) xuveiro — o certo é chuveiro: com ch, de cor."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "espantado, sem reação", "generoso, de coração grande", "fora da época certa", "muito antigo e valioso"], "certa": 3, "explicacao": "d) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem.", "Mamãe trouxe a revista para mim copiar.", "O bolo é para mim."], "certa": 3, "explicacao": "d) — o certo é “para eu copiar”."}, {"enunciado": "Ontem eles ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["querem", "quereram", "quererão", "quiseram", "queriam"], "certa": 3, "explicacao": "d) quiseram"}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar alegria", "chamar alguém", "pedir silêncio", "mostrar nojo", "mostrar dor"], "certa": 1, "explicacao": "b) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["itens", "rainha", "ideia", "papéis", "colméia"], "certa": 4, "explicacao": "e) colméia — o certo é colmeia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem medo, destemido", "atento, prestando atenção", "generoso, de coração grande", "que arma truques para enganar", "espantado, sem reação"], "certa": 4, "explicacao": "e) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>dilatar</b>? Responda com a letra.", "alternativas": ["denunciar", "quem sai do país", "aumentar", "quem assiste", "que não dá para ler"], "certa": 2, "explicacao": "c) aumentar — não confunda com “delatar” (denunciar)."}, {"enunciado": "Na frase “A rua alagou <b>porque</b> choveu muito.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "motivo para", "pois", "o motivo", "por isso"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>procurar pelo em ovo</b>? Responda com a letra.", "alternativas": ["estar distraído", "contar a verdade", "fazer as coisas fora de ordem", "acertar em cheio", "procurar defeito onde não há"], "certa": 4, "explicacao": "e) procurar defeito onde não há"}, {"enunciado": "“Coma a salada, já que faz bem à saúde.”<br>Qual conjunção pode ficar no lugar de <b>já que</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["logo", "todavia", "mas", "entretanto", "porque"], "certa": 4, "explicacao": "e) porque — as duas dão ideia de explicação."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "que dá para acreditar, razoável", "oportunidade, ocasião", "desmentir, contradizer", "confirmar, reforçar uma ideia"], "certa": 4, "explicacao": "e) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["le-o-par-do", "ob-je-to", "li-vro", "la-ran-je-i-ra", "cha-péu"], "certa": 3, "explicacao": "d) la-ran-je-i-ra — o certo é la-ran-jei-ra: no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os pires", "os cidadãos", "os hifens", "os funis", "os jovems"], "certa": 4, "explicacao": "e) os jovems — o certo é os jovens."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles estudaram para a prova.", "Na semana passada, eles tocaram violão.", "Daqui a dois dias, eles comprarão pão.", "Na semana passada, eles voltarão para casa.", "No ano que vem, eles andarão de bicicleta."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Viajei a Roma e à Itália.", "Falei a pessoas da fila.", "Entreguei o bilhete a avó.", "Começou a chover à noite.", "Passeamos a cavalo."], "certa": 2, "explicacao": "c) — o certo é “à avó”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "pena, compaixão pelos outros", "sem medo, destemido", "arrogância, ar de superioridade", "mentira, golpe para enganar"], "certa": 3, "explicacao": "d) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
