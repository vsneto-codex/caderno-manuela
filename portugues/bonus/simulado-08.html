<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 8 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 8 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós assistimos ao jogo pela televisão.", "A gente chega cedo à escola.", "A gente escrevemos cartas para a vovó.", "Nós cantamos no coral da escola.", "A gente desenha muito bem."], "certa": 2, "explicacao": "c) — o certo é “A gente escreve”: a gente pede o verbo como “ele”."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "Já é meio-dia e meia.", "As portas estavam meio abertas.", "A professora ficou meia sonolenta.", "Bebi meia garrafa de água."], "certa": 3, "explicacao": "d) — o certo é “A professora ficou meio sonolenta”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela e Bianca, mostraram o desenho.", "Comprei lápis, caderno e régua.", "Ricardo, venha jantar!", "Bianca, a capitã do time, chegou cedo.", "Ricardo, cuidado com o degrau!"], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você não comeu por que estava sem fome?", "O pneu furou; eis por que chegamos atrasados.", "O ônibus parou no meio da estrada, e o motorista não sabe por quê.", "— Não vou à praia. — Por quê?", "Ele chorou porque caiu da bicicleta?"], "certa": 0, "explicacao": "a) — o certo é “Você não comeu porque estava sem fome?”: a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "que está em toda parte", "preciso, feito com muito cuidado", "que acontece fora de hora", "que não está em lugar nenhum"], "certa": 1, "explicacao": "b) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["bombeiro", "gaivota", "zoológico", "ouvir", "bandeira"], "certa": 2, "explicacao": "c) zoológico — zo-o-ló-gi-co"}, {"enunciado": "A palavra <b>o ídolo</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "epiceno", "não tem gênero", "sobrecomum", "comum de dois"], "certa": 3, "explicacao": "d) sobrecomum — o ídolo serve para menino e menina, sem mudar nada."}, {"enunciado": "Como se lê <b>século XIX</b>? Responda com a letra.", "alternativas": ["décimo nono", "dezenove", "19", "dezoito", "vinte"], "certa": 1, "explicacao": "b) dezenove — depois do décimo, lê-se como cardinal."}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>o papa</b>? Responda com a letra.", "alternativas": ["Vossa Excelência", "Vossa Senhoria", "Vossa Majestade", "Vossa Alteza", "Vossa Santidade"], "certa": 4, "explicacao": "e) Vossa Santidade"}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem medo, destemido", "que passa num instante", "que traz boas notícias", "generoso, de coração grande", "que traz más notícias"], "certa": 2, "explicacao": "c) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Entreguei o bilhete a professora.", "Falei a pessoas da fila.", "Aprendi a nadar.", "Comemos bife à milanesa."], "certa": 1, "explicacao": "b) — o certo é “à professora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["O dono da padaria escondeu o presente.", "Ventou forte a noite toda.", "O cachorro e o gato pintaram um quadro.", "Havia um bilhete na mesa.", "Falei com a vovó."], "certa": 2, "explicacao": "c) O cachorro e o gato pintaram um quadro."}, {"enunciado": "Amanhã, eles ___ uma árvore. Qual forma completa a frase? Responda com a letra.", "alternativas": ["plantariam", "plantavam", "plantarão", "plantaram", "plantam"], "certa": 2, "explicacao": "c) plantarão — futuro: -ão."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["laranjeira", "majestade", "ameixa", "genjibre", "jiboia"], "certa": 3, "explicacao": "d) genjibre — o certo é gengibre: com g nas duas sílabas, de cor."}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que discute e argumenta demais", "urgente", "que fala pouco, de poucas palavras", "esperto, que percebe tudo rápido", "mentira, golpe para enganar"], "certa": 3, "explicacao": "d) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela trouxe o mapa para eu.", "Sem mim, a festa não teria graça.", "Entre mim e você, tudo bem.", "Ela deu o recado para eu levar.", "Para mim, fazer isso é fácil."], "certa": 0, "explicacao": "a) — o certo é “para mim”."}, {"enunciado": "Ontem eles ___ (verbo <b>saber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["sabiam", "sabem", "saberão", "souberam", "saberam"], "certa": 3, "explicacao": "d) souberam"}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar alegria", "chamar alguém", "pedir silêncio", "mostrar dor", "mostrar nojo"], "certa": 1, "explicacao": "b) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["baú", "hífen", "hífens", "jiboia", "rainha"], "certa": 2, "explicacao": "c) hífens — o certo é hifens: paroxítona terminada em em ou ens não leva acento (item, itens, jovem)."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "sem nenhum machucado, ileso", "breve e direto", "sem medo, destemido", "cheio de detalhes"], "certa": 2, "explicacao": "c) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>concerto</b>? Responda com a letra.", "alternativas": ["prestes a acontecer", "reparo", "assento do cavalo", "apresentação musical", "passada"], "certa": 3, "explicacao": "d) apresentação musical — não confunda com “conserto” (reparo)."}, {"enunciado": "Na frase “<b>Por que</b> a zebra tem listras?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "por qual", "por qual motivo", "por isso", "pois"], "certa": 2, "explicacao": "c) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>ter uma memória de elefante</b>? Responda com a letra.", "alternativas": ["vigiar", "fingir que não é com ele", "lembrar de tudo", "fazer igual", "piorar uma briga"], "certa": 2, "explicacao": "c) lembrar de tudo"}, {"enunciado": "“Choveu a noite toda, portanto a rua alagou.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porque", "todavia", "entretanto", "caso", "logo"], "certa": 4, "explicacao": "e) logo — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "confirmar, reforçar uma ideia", "que é frágil, que quebra fácil", "caro, que custa muito", "arrogância, ar de superioridade"], "certa": 0, "explicacao": "a) que dura pouco tempo. Não é “que é frágil, que quebra fácil”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["nob-re-za", "a-bra-çar", "le-i-te", "ciú-me", "ca-ptu-ra"], "certa": 1, "explicacao": "b) a-bra-çar — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os álbuns", "os hifens", "os capitões", "os ônibus", "os cidadãos"], "certa": 2, "explicacao": "c) os capitões — o certo é os capitães."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Daqui a dois dias, eles receberão visitas.", "Hoje de manhã, eles estudaram para a prova.", "Amanhã, eles guardarão os brinquedos.", "Amanhã, eles voltaram para casa.", "Hoje de manhã, eles esconderam o presente."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Chegamos às oito horas.", "Aprendi a nadar.", "Chegamos ao meio-dia.", "Cheguei a praça."], "certa": 4, "explicacao": "e) — o certo é “à praça”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "mínimo, o menor de todos", "firme e calmo diante do sofrimento", "muito pequeno, escasso", "chorão, que reclama de tudo"], "certa": 2, "explicacao": "c) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-8';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
