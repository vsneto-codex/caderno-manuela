<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Tainá comprou três frutas: maçã laranja e pera.", "Tainá comprou três frutas: maçã, laranja, e pera.", "Tainá comprou três frutas: maçã, laranja e pera.", "Tainá comprou três frutas maçã, laranja e pera.", "Tainá, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Tainá comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Tainá e o verbo."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["florzinha", "bolinha", "gatinho", "pezinho", "cozinha"], "certa": 4, "explicacao": "e) cozinha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "De que duas palavras se forma <b>àquela</b>? Responda com a letra.", "alternativas": ["a + aquelas", "àq + aquela", "de + aquela", "a + aquela", "a + aquilo"], "certa": 3, "explicacao": "d) a + aquela"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Fui à praia a pé.", "Chegamos às oito horas.", "Vou a Bahia nas férias.", "Vire à esquerda."], "certa": 3, "explicacao": "d) — o certo é “à Bahia”: macete: “vou a, volto da: crase há”."}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não tem habilidade", "que acontece fora de hora", "excelente, muito habilidoso", "arrogância, ar de superioridade", "esfriar, perder a força"], "certa": 2, "explicacao": "c) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["sequência", "queijo", "pequeno", "figueira", "guizo"], "certa": 0, "explicacao": "a) sequência — em “sequência” a gente fala o u"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós dançamos na festa junina.", "Nós brincamos no parque.", "A gente ajudamos a vovó na cozinha.", "A gente estuda juntos todo dia.", "A gente canta no coral da escola."], "certa": 2, "explicacao": "c) — o certo é “A gente ajuda”: a gente pede o verbo como “ele”."}, {"enunciado": "Ontem ele ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabe", "cabeu", "caberá", "coube", "cabia"], "certa": 3, "explicacao": "d) coube"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>doce</b>? Responda com a letra.", "alternativas": ["paupérrimo", "felicíssimo", "dulcérrimo", "docérrimo", "dulcíssimo"], "certa": 4, "explicacao": "e) dulcíssimo"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["remédio para todos os males", "que arma truques para enganar", "confusão, situação enrolada", "um tipo de comida italiana", "descuidado, que cai fácil em armadilhas"], "certa": 2, "explicacao": "c) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>flauta</b>? Responda com a letra.", "alternativas": ["camiseta", "maleta", "florzinha", "flautim", "menininho"], "certa": 3, "explicacao": "d) flautim"}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["As flores eram muito cheirosas.", "Havia muita gente na praia.", "Ganhei muitos presentes.", "Muitos alunos faltaram.", "Muitas pessoas vieram à festa."], "certa": 0, "explicacao": "a) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["A rua por que ele passa todo dia é barulhenta.", "Não há por que ter medo do escuro.", "Ele riu e, não sei por quê, todos riram junto.", "A ponte porque atravessamos é muito antiga.", "Ninguém sabe por que o gato sumiu."], "certa": 3, "explicacao": "d) — o certo é “A ponte por que atravessamos é muito antiga.”: troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles correram no parque.", "No ano que vem, eles lavarão o carro.", "Na semana passada, eles bateram na porta.", "No ano que vem, eles andarão de bicicleta.", "Na semana passada, eles procurarão a bola."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "isca, armadilha para enganar", "cuidadoso, precavido", "que acontece por acaso", "descuidado, que cai fácil em armadilhas"], "certa": 4, "explicacao": "e) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Na frase “<b>Por que</b> o arco-íris aparece depois da chuva?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "porém", "pelo qual / pela qual", "pois", "motivo para"], "certa": 0, "explicacao": "a) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "São Paulo, 16 de outubro de 2026.", "A turma do quinto ano, olhou as estrelas.", "Ricardo, venha jantar!", "Ricardo, cuidado com o degrau!"], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (A turma do quinto ano) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Isso é para eu ler.", "Entre mim e você, tudo bem.", "Mamãe trouxe o caderno para mim ler.", "Sem mim, a festa não teria graça."], "certa": 3, "explicacao": "d) — o certo é “para eu ler”."}, {"enunciado": "A palavra <b>o rinoceronte</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "sobrecomum", "comum de dois", "epiceno", "não tem gênero"], "certa": 3, "explicacao": "d) epiceno — animal: o rinoceronte macho / o rinoceronte fêmea."}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["onde é muito difícil viver", "que arma truques para enganar", "intenso, enérgico", "que causa tempestade", "que acontece fora de hora"], "certa": 4, "explicacao": "e) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Quem nasce no <b>Japão</b> é… Responda com a letra.", "alternativas": ["japonês", "chileno", "fortalezense", "francês", "pessoense"], "certa": 0, "explicacao": "a) japonês"}, {"enunciado": "“Minha amiguinha do coração!”<br>Que sentido tem <b>amiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "pressa", "tamanho", "admiração", "carinho"], "certa": 4, "explicacao": "e) carinho"}, {"enunciado": "Como se diz a fêmea do <b>rinoceronte</b>? Responda com a letra.", "alternativas": ["o rinocerontezinha", "a rinocerontea", "o rinoceronte fêmea", "a rinoceronte fêmea", "a rinoceronte"], "certa": 2, "explicacao": "c) o rinoceronte fêmea — rinoceronte é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Situação: O cantor terminou e a plateia quer mais uma música.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Alô!", "Eca!", "Oxalá!", "Puxa!", "Bis!"], "certa": 4, "explicacao": "e) Bis! — aplauso."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "esperto, que percebe tudo rápido", "muito rico e poderoso", "ligado à vida simples e tranquila do campo", "generoso, de coração grande"], "certa": 4, "explicacao": "e) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>vaivém</b>? Responda com a letra.", "alternativas": ["os vaivém", "vaivémes", "vaivémis", "vaivéms", "vaivéns"], "certa": 4, "explicacao": "e) vaivéns"}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["resistir", "responder", "garoar", "meter", "escutar"], "certa": 2, "explicacao": "c) garoar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual é o coletivo de <b>chaves</b>? Responda com a letra.", "alternativas": ["molho", "penca", "feixe", "cacho", "esquadrilha"], "certa": 0, "explicacao": "a) molho — penca é de outro grupo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Ele tem dois irmãos.", "As caixas contém doze lápis.", "Os alunos têm aula hoje.", "Hoje ela pode jogar.", "Vou pôr o casaco."], "certa": 1, "explicacao": "b) — o certo é “As caixas contêm…”."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["remédio para todos os males", "sem nenhum machucado, ileso", "doença sem cura", "caro, que custa muito", "que dura muito, que não acaba"], "certa": 0, "explicacao": "a) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
