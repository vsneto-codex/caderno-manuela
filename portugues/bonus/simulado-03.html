<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Ontem eu ___ (verbo <b>prever</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["previ", "prevei", "preveu", "preveru", "prevejei"], "certa": 0, "explicacao": "a) previ — prever segue ver: eu vi → eu previ."}, {"enunciado": "Como se escreve <b>90º</b> por extenso? Responda com a letra.", "alternativas": ["nonagésimo primeiro", "octogésimo", "noventésimo", "nonagésimo", "centésimo"], "certa": 3, "explicacao": "d) nonagésimo"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "descuidado, que cai fácil em armadilhas", "digno de confiança, verdadeiro", "duvidoso, suspeito", "sem medo, destemido"], "certa": 2, "explicacao": "c) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "De que duas palavras se forma <b>naquele</b>? Responda com a letra.", "alternativas": ["em + aquilo", "de + aquele", "na + aquele", "em + aquele", "em + aqueles"], "certa": 3, "explicacao": "d) em + aquele"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou a chover à noite.", "Falei a pessoas da fila.", "Fui ao clube e à piscina.", "Vou à Bahia.", "Contei a novidade a bibliotecária."], "certa": 4, "explicacao": "e) — o certo é “à bibliotecária”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "“A formiguinha cabe na unha.”<br>Que sentido tem <b>formiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["carinho", "desprezo", "admiração", "tamanho", "pressa"], "certa": 3, "explicacao": "d) tamanho"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Porquê o mar tem ondas", "— Não vou à praia. — Por quê?", "Não entendi por que o filme acabou daquele jeito.", "As cidades por que viajamos eram lindas.", "O gato fugiu, não sei por quê, e voltou à noite."], "certa": 0, "explicacao": "a) — o certo é “Por que o mar tem ondas”: é uma pergunta em forma de título: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "que está em toda parte", "muito educado e gentil", "estranho, fora do comum", "sem medo, destemido"], "certa": 0, "explicacao": "a) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles lavarão o carro.", "Hoje de manhã, eles limparam o quarto.", "Amanhã, eles mandaram uma mensagem.", "Ontem, eles guardaram os brinquedos.", "No ano que vem, eles abrirão a janela."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Espero que ele ___ sair cedo. (verbo poder)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["pudesse", "possa", "pode", "pôde", "poder"], "certa": 1, "explicacao": "b) possa"}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["troféu", "ajeitar", "oceano", "coisa", "mãe"], "certa": 2, "explicacao": "c) oceano — o-ce-a-no"}, {"enunciado": "A palavra <b>o/a intérprete</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "não tem gênero", "tem feminino diferente (biforme)", "comum de dois", "epiceno"], "certa": 3, "explicacao": "d) comum de dois — o intérprete / a intérprete: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "que dá para acreditar, razoável", "caro, que custa muito", "que não se apaga", "fácil de apagar"], "certa": 3, "explicacao": "d) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>fiel</b>? Responda com a letra.", "alternativas": ["fidelíssimo", "sapientíssimo", "fielíssima", "fielérrimo", "máximo"], "certa": 0, "explicacao": "a) fidelíssimo"}, {"enunciado": "Qual é o coletivo de <b>estrelas</b>? Responda com a letra.", "alternativas": ["galáxia", "arquipélago", "júri", "cordilheira", "constelação"], "certa": 4, "explicacao": "e) constelação — galáxia é de outro grupo."}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "que não faz mal, sem efeito", "perigoso, venenoso", "sem medo, destemido", "espantado, sem reação"], "certa": 1, "explicacao": "b) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o diadema", "o cometa", "a clima", "o dia", "a foto"], "certa": 2, "explicacao": "c) a clima — o certo é “o clima”."}, {"enunciado": "Quem nasce em <b>Japão</b> é… Responda com a letra.", "alternativas": ["pessoense", "roraimense", "brasiliense", "paranaense", "japonês"], "certa": 4, "explicacao": "e) japonês"}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "que passa num instante", "novato, iniciante", "especialista, veterano", "confirmar, reforçar uma ideia"], "certa": 2, "explicacao": "c) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>devo entender</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["os dois são principais", "devo", "o sujeito", "entender", "não há verbo principal"], "certa": 3, "explicacao": "d) entender — o principal é o último, o que diz a ação."}, {"enunciado": "Por que a palavra <b>também</b> tem acento? Responda com a letra.", "alternativas": ["oxítona terminada em em ou ens leva acento", "paroxítona terminada em ps leva acento", "paroxítona terminada em x leva acento", "paroxítona terminada em l leva acento", "oxítona (força na última sílaba) terminada em a leva acento"], "certa": 0, "explicacao": "a) oxítona terminada em em ou ens leva acento (tam-bém)."}, {"enunciado": "Ontem eu ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trouxe", "trazia", "trago", "trazi", "trarei"], "certa": 0, "explicacao": "a) trouxe"}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "que acontece fora de hora", "que dura pouco, passageiro", "mentira, golpe para enganar", "incomum, surpreendente"], "certa": 0, "explicacao": "a) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>bandeira</b>? Responda com a letra.", "alternativas": ["bandeirola", "bolinha", "cafezinho", "chuvisco", "mesinha"], "certa": 0, "explicacao": "a) bandeirola"}, {"enunciado": "Por que a palavra <b>ferro</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["rr aparece só no começo das palavras", "no começo da palavra, o r já tem som forte", "entre vogais, o som forte do r se escreve com rr", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, um r só tem som forte"], "certa": 2, "explicacao": "c) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["esceto", "desça", "assobio", "travesseiro", "necessário"], "certa": 0, "explicacao": "a) esceto — o certo é exceto: com xc, como exceção."}, {"enunciado": "Qual é o plural de <b>leão</b>? Responda com a letra.", "alternativas": ["leões", "leãoes", "leãos", "leoes", "leães"], "certa": 0, "explicacao": "a) leões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inútil, perda de tempo", "esbanjador, que gasta demais", "novato, iniciante", "proveitoso, que dá bons resultados", "incomum, surpreendente"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["foguete", "quintal", "tranquilo", "quilo", "esquilo"], "certa": 2, "explicacao": "c) tranquilo — em “tranquilo” a gente fala o u"}, {"enunciado": "O verbo <b>propor</b> é de que conjugação? Responda com a letra.", "alternativas": ["3ª conjugação (-ir)", "4ª conjugação (-or)", "2ª conjugação (-er)", "1ª conjugação (-ar)", "não tem conjugação"], "certa": 2, "explicacao": "c) 2ª conjugação — pôr vem do antigo “poer”."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
