<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Pedro comprou três frutas: maçã laranja e pera.", "Pedro comprou três frutas: maçã, laranja, e pera.", "Pedro comprou três frutas: maçã, laranja e pera.", "Pedro comprou três frutas maçã, laranja e pera.", "Pedro, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Pedro comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Pedro e o verbo."}, {"enunciado": "De que duas palavras se forma <b>àquela</b>? Responda com a letra.", "alternativas": ["a + aquelas", "a + aquilo", "àq + aquela", "a + aquela", "de + aquela"], "certa": 3, "explicacao": "d) a + aquela"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "digno de confiança, verdadeiro", "esperto, que percebe tudo rápido", "oportunidade, ocasião", "duvidoso, suspeito"], "certa": 1, "explicacao": "b) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["queijo", "foguinho", "bilíngue", "quente", "guerra"], "certa": 2, "explicacao": "c) bilíngue — em “bilíngue” a gente fala o u"}, {"enunciado": "Ontem eles ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["poderão", "podiam", "puderam", "podem", "poderam"], "certa": 2, "explicacao": "c) puderam"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>rápido</b>? Responda com a letra.", "alternativas": ["libérrimo", "rapidílimo", "rapidérrimo", "rapidíssimo", "péssimo"], "certa": 3, "explicacao": "d) rapidíssimo"}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito educado e gentil", "inconveniente; fora do assunto", "que acontece por acaso", "mínimo, o menor de todos", "urgente"], "certa": 1, "explicacao": "b) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>rua</b>? Responda com a letra.", "alternativas": ["bandeirola", "ruela", "papelzinho", "carrinho", "bonequinha"], "certa": 1, "explicacao": "b) ruela"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ninguém explicou por que a aula acabou mais cedo.", "Ninguém sabe por que o gato sumiu.", "O túnel por que o trem passa é escuro.", "Ela estava feliz, não sei por quê.", "Mas porquê a girafa tem o pescoço tão comprido?"], "certa": 4, "explicacao": "e) — o certo é “Mas por que a girafa tem o pescoço tão comprido?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles olharam as estrelas.", "Hoje de manhã, eles tocaram violão.", "Hoje de manhã, eles varrerão o quintal.", "Na semana passada, eles assistiram a um filme.", "Daqui a dois dias, eles guardarão os brinquedos."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se apaga", "esbanjador, que gasta demais", "pouco, escasso", "fácil de apagar", "que não faz mal, sem efeito"], "certa": 0, "explicacao": "a) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Na frase “O caminho <b>por que</b> passei estava cheio de flores.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "pelo qual / pela qual", "por qual motivo", "pois", "o motivo"], "certa": 1, "explicacao": "b) pelo qual / pela qual — troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela, cuidado com o degrau!", "O time de Felipe, mandou uma mensagem.", "Ricardo, meu primo, chegou cedo.", "São Paulo, 16 de outubro de 2026.", "Comprei manga, laranja e uva."], "certa": 1, "explicacao": "b) — nunca se separa o sujeito (O time de Felipe) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "Isso é para eu ler.", "Traga o caderno para mim copiar a lição."], "certa": 4, "explicacao": "e) — o certo é “para eu copiar”."}, {"enunciado": "A palavra <b>o besouro</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "epiceno", "tem feminino diferente (biforme)", "sobrecomum", "comum de dois"], "certa": 1, "explicacao": "b) epiceno — animal: o besouro macho / o besouro fêmea."}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["perigoso, venenoso", "proveitoso, que dá bons resultados", "que arma truques para enganar", "esforço, vontade forte de fazer algo", "que não faz mal, sem efeito"], "certa": 4, "explicacao": "e) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Natal</b> é… Responda com a letra.", "alternativas": ["egípcio", "acriano", "peruano", "amapaense", "natalense"], "certa": 4, "explicacao": "e) natalense"}, {"enunciado": "“Vovô, dá um abracinho!”<br>Que sentido tem <b>abracinho</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "admiração", "carinho", "pressa", "tamanho"], "certa": 2, "explicacao": "c) carinho"}, {"enunciado": "Como se diz a fêmea do <b>pernilongo</b>? Responda com a letra.", "alternativas": ["a pernilongo", "a pernilonga", "o pernilongozinha", "a pernilongo fêmea", "o pernilongo fêmea"], "certa": 4, "explicacao": "e) o pernilongo fêmea — pernilongo é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muitas vezes, com frequência", "especialista, veterano", "mentira, golpe para enganar", "resistente (ao calor, a mudanças)", "novato, iniciante"], "certa": 4, "explicacao": "e) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Qual é o coletivo de <b>navios</b>? Responda com a letra.", "alternativas": ["multidão", "cardume", "frota", "tropa", "esquadrilha"], "certa": 2, "explicacao": "c) frota — esquadrilha é de outro grupo."}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "proveitoso, que dá bons resultados", "que dura muito, que não acaba", "dispensar, não precisar de algo", "que dura pouco, passageiro"], "certa": 2, "explicacao": "c) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ficaram frente a frente.", "Viajei a Roma e à Itália.", "Comemos bife à milanesa.", "Fui a festa.", "Passeamos a cavalo."], "certa": 3, "explicacao": "d) — o certo é “à festa”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["o final -esa sempre se escreve com z", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "substantivos que vêm de adjetivos terminam em -eza", "femininos e palavras de origem terminam em -esa"], "certa": 3, "explicacao": "d) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Espero que ele ___ o filme. (verbo ver)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["vê", "ver", "viu", "visse", "veja"], "certa": 4, "explicacao": "e) veja"}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "inútil, perda de tempo", "aliviar, diminuir (uma dor, um problema)", "que não se apaga", "proveitoso, que dá bons resultados"], "certa": 4, "explicacao": "e) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "“Apareceram de repente as crianças da escola.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["de", "as crianças da escola", "o sujeito está escondido (oculto)", "não tem sujeito", "Apareceram"], "certa": 1, "explicacao": "b) as crianças da escola — o sujeito veio depois do verbo. Pergunte: quem apareceram?"}, {"enunciado": "Por que a palavra <b>hambúrguer</b> tem acento? Responda com a letra.", "alternativas": ["oxítona terminada em o leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "paroxítona terminada em r leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento"], "certa": 3, "explicacao": "d) paroxítona terminada em r leva acento (ham-búr-guer)."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As crianças da escola aprendemos uma música nova.", "As crianças da escola aprendi uma música nova.", "As crianças da escola aprendeu uma música nova.", "As crianças da escola aprende uma música nova.", "As crianças da escola aprenderam uma música nova."], "certa": 4, "explicacao": "e) As crianças da escola aprenderam uma música nova. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "que não está em lugar nenhum", "arrogância, ar de superioridade", "sem medo, destemido", "dispensar, não precisar de algo"], "certa": 0, "explicacao": "a) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
