<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Kátia comprou três frutas: maçã laranja e pera.", "Kátia comprou três frutas: maçã, laranja, e pera.", "Kátia comprou três frutas: maçã, laranja e pera.", "Kátia comprou três frutas maçã, laranja e pera.", "Kátia, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Kátia comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Kátia e o verbo."}, {"enunciado": "De que duas palavras se forma <b>àquilo</b>? Responda com a letra.", "alternativas": ["a + aquila", "a + isso", "àq + aquilo", "a + aquilo", "de + aquilo"], "certa": 3, "explicacao": "d) a + aquilo"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "digno de confiança, verdadeiro", "esperto, que percebe tudo rápido", "oportunidade, ocasião", "duvidoso, suspeito"], "certa": 1, "explicacao": "b) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["queijo", "foguinho", "bilíngue", "quente", "guerra"], "certa": 2, "explicacao": "c) bilíngue — em “bilíngue” a gente fala o u"}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dirão", "diziam", "disseram", "dizem", "dizeram"], "certa": 2, "explicacao": "c) disseram"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>lindo</b>? Responda com a letra.", "alternativas": ["libérrimo", "lindílimo", "lindérrimo", "lindíssimo", "péssimo"], "certa": 3, "explicacao": "d) lindíssimo"}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito educado e gentil", "inconveniente; fora do assunto", "que acontece por acaso", "mínimo, o menor de todos", "urgente"], "certa": 1, "explicacao": "b) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>rua</b>? Responda com a letra.", "alternativas": ["bandeirola", "ruela", "papelzinho", "carrinho", "bonequinha"], "certa": 1, "explicacao": "b) ruela"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["As cidades porquê viajamos eram lindas.", "O ônibus parou no meio da estrada, e o motorista não sabe por quê.", "A janela por que o gato fugiu ficou aberta.", "Não sei por que ela saiu tão cedo.", "A rua por que ele passa todo dia é barulhenta."], "certa": 0, "explicacao": "a) — o certo é “As cidades por que viajamos eram lindas.”: troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles dançarão na quadrilha.", "No ano que vem, eles aprenderam uma música nova.", "Na semana passada, eles abriram a janela.", "Daqui a dois dias, eles sonharão com dragões.", "Amanhã, eles voltarão para casa."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["fora da época certa", "que não se apaga", "urgente", "fácil de apagar", "que está em toda parte"], "certa": 1, "explicacao": "b) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Na frase “Não entendi <b>por que</b> o filme acabou daquele jeito.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "pois", "por qual motivo", "por qual", "o motivo"], "certa": 2, "explicacao": "c) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Felipe, o mais alto da turma, chegou cedo.", "Comprei uva, laranja e pera.", "Os meninos da rua, bateram na porta.", "São Paulo, 16 de outubro de 2026.", "Manuela, cuidado com o degrau!"], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (Os meninos da rua) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem.", "Ele pediu para mim ajudar na mudança.", "Isso é para eu ler."], "certa": 3, "explicacao": "d) — o certo é “para eu ajudar”."}, {"enunciado": "A palavra <b>o condor</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "epiceno", "não tem gênero", "comum de dois", "sobrecomum"], "certa": 1, "explicacao": "b) epiceno — animal: o condor macho / o condor fêmea."}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "firme e calmo diante do sofrimento", "que não faz mal, sem efeito", "perigoso, venenoso", "muitas vezes, com frequência"], "certa": 2, "explicacao": "c) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Distrito Federal</b> é… Responda com a letra.", "alternativas": ["suíço", "brasiliense", "paulistano", "russo", "goiano"], "certa": 1, "explicacao": "b) brasiliense"}, {"enunciado": "“Meu amorzinho!”<br>Que sentido tem <b>amorzinho</b> nessa frase? Responda com a letra.", "alternativas": ["carinho", "desprezo", "pressa", "admiração", "tamanho"], "certa": 0, "explicacao": "a) carinho"}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "especialista, veterano", "que passa num instante", "novato, iniciante", "totalmente fechado; difícil de entender"], "certa": 3, "explicacao": "d) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Qual é o coletivo de <b>estrelas</b>? Responda com a letra.", "alternativas": ["arquipélago", "cordilheira", "galáxia", "constelação", "milharal"], "certa": 3, "explicacao": "d) constelação — galáxia é de outro grupo."}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["onde é muito difícil viver", "que dura pouco, passageiro", "que fala pouco, de poucas palavras", "que dura muito, que não acaba", "descuidado, que cai fácil em armadilhas"], "certa": 3, "explicacao": "d) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Pedi ajuda a bibliotecária.", "Ficaram frente a frente.", "Fui ao clube e à piscina.", "Aprendi a nadar.", "Comemos bife à milanesa."], "certa": 0, "explicacao": "a) — o certo é “à bibliotecária”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["toda palavra terminada em -eza é feminino de origem", "substantivos que vêm de adjetivos terminam em -eza", "femininos e palavras de origem terminam em -esa", "o final -esa sempre se escreve com z", "palavras que indicam país terminam em -eza"], "certa": 1, "explicacao": "b) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Espero que ele ___ sair cedo. (verbo poder)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["pudesse", "pôde", "poder", "possa", "pode"], "certa": 3, "explicacao": "d) possa"}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "que dura pouco tempo", "que acontece fora de hora", "proveitoso, que dá bons resultados", "inútil, perda de tempo"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "“Saíram correndo o cachorro e o gato.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["correndo", "não tem sujeito", "Saíram", "o sujeito está escondido (oculto)", "o cachorro e o gato"], "certa": 4, "explicacao": "e) o cachorro e o gato — o sujeito veio depois do verbo. Pergunte: quem saíram?"}, {"enunciado": "Por que a palavra <b>sofá</b> tem acento? Responda com a letra.", "alternativas": ["oxítona terminada em e leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "paroxítona terminada em x leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "paroxítona terminada em um ou uns leva acento"], "certa": 3, "explicacao": "d) oxítona (força na última sílaba) terminada em a leva acento (so-fá)."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Ricardo e a irmã une as peças.", "Ricardo e a irmã uniu as peças.", "Ricardo e a irmã uni as peças.", "Ricardo e a irmã uniram as peças.", "Ricardo e a irmã unimos as peças."], "certa": 3, "explicacao": "d) Ricardo e a irmã uniram as peças. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "tão bom que não dá para descrever com palavras", "que passa num instante", "que está em toda parte", "que não está em lugar nenhum"], "certa": 3, "explicacao": "d) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o cometa", "a mapa", "o telefonema", "o clima", "o pijama"], "certa": 1, "explicacao": "b) a mapa — o certo é “o mapa”."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
