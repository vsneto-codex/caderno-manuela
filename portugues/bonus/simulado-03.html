<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Kátia comprou três frutas: maçã laranja e pera.", "Kátia comprou três frutas: maçã, laranja, e pera.", "Kátia comprou três frutas: maçã, laranja e pera.", "Kátia comprou três frutas maçã, laranja e pera.", "Kátia, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Kátia comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Kátia e o verbo."}, {"enunciado": "De que duas palavras se forma <b>àquilo</b>? Responda com a letra.", "alternativas": ["a + aquila", "a + isso", "àq + aquilo", "a + aquilo", "de + aquilo"], "certa": 3, "explicacao": "d) a + aquilo"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "digno de confiança, verdadeiro", "esperto, que percebe tudo rápido", "oportunidade, ocasião", "duvidoso, suspeito"], "certa": 1, "explicacao": "b) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["queijo", "foguinho", "bilíngue", "quente", "guerra"], "certa": 2, "explicacao": "c) bilíngue — em “bilíngue” a gente fala o u"}, {"enunciado": "Ontem eles ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["quererão", "queriam", "quiseram", "querem", "quereram"], "certa": 2, "explicacao": "c) quiseram"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>lindo</b>? Responda com a letra.", "alternativas": ["libérrimo", "lindílimo", "lindérrimo", "lindíssimo", "péssimo"], "certa": 3, "explicacao": "d) lindíssimo"}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito educado e gentil", "inconveniente; fora do assunto", "que acontece por acaso", "mínimo, o menor de todos", "urgente"], "certa": 1, "explicacao": "b) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>rua</b>? Responda com a letra.", "alternativas": ["bandeirola", "ruela", "papelzinho", "carrinho", "bonequinha"], "certa": 1, "explicacao": "b) ruela"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["As cidades porquê viajamos eram lindas.", "O ônibus parou no meio da estrada, e o motorista não sabe por quê.", "A janela por que o gato fugiu ficou aberta.", "Não sei por que ela saiu tão cedo.", "A rua por que ele passa todo dia é barulhenta."], "certa": 0, "explicacao": "a) — o certo é “As cidades por que viajamos eram lindas.”: troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles dançarão na quadrilha.", "No ano que vem, eles aprenderam uma música nova.", "Na semana passada, eles abriram a janela.", "Daqui a dois dias, eles sonharão com dragões.", "Amanhã, eles voltarão para casa."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["fora da época certa", "que não se apaga", "urgente", "fácil de apagar", "que está em toda parte"], "certa": 1, "explicacao": "b) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Na frase “Não entendi <b>por que</b> o filme acabou daquele jeito.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "pois", "por qual motivo", "por qual", "o motivo"], "certa": 2, "explicacao": "c) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Felipe, o mais alto da turma, chegou cedo.", "Comprei uva, laranja e pera.", "A girafa do zoológico, bateu na porta.", "São Paulo, 16 de outubro de 2026.", "Manuela, cuidado com o degrau!"], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (A girafa do zoológico) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem.", "Guarde um pedaço de bolo para eu.", "Isso é para eu ler."], "certa": 3, "explicacao": "d) — o certo é “para mim”."}, {"enunciado": "A palavra <b>o rinoceronte</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "epiceno", "tem feminino diferente (biforme)", "sobrecomum", "comum de dois"], "certa": 1, "explicacao": "b) epiceno — animal: o rinoceronte macho / o rinoceronte fêmea."}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "que não faz mal, sem efeito", "perigoso, venenoso", "esfriar, perder a força", "confirmar, reforçar uma ideia"], "certa": 1, "explicacao": "b) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "Quem nasce na <b>Argentina</b> é… Responda com a letra.", "alternativas": ["goiano", "francês", "russo", "baiano", "argentino"], "certa": 4, "explicacao": "e) argentino"}, {"enunciado": "“Vovô, dá um abracinho!”<br>Que sentido tem <b>abracinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "admiração", "desprezo", "pressa", "carinho"], "certa": 4, "explicacao": "e) carinho"}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["especialista, veterano", "que acontece por acaso", "aliviar, diminuir (uma dor, um problema)", "esperto, que percebe tudo rápido", "novato, iniciante"], "certa": 4, "explicacao": "e) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Qual é o coletivo de <b>navios</b>? Responda com a letra.", "alternativas": ["esquadrilha", "frota", "cacho", "cardume", "tropa"], "certa": 1, "explicacao": "b) frota — esquadrilha é de outro grupo."}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "esforço, vontade forte de fazer algo", "exibido, que usa palavras difíceis só para se mostrar", "que dura muito, que não acaba", "que dura pouco, passageiro"], "certa": 3, "explicacao": "d) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Viajei a Roma e à Itália.", "Fui ao clube e à piscina.", "Ricardo vai a praça.", "Entreguei o presente a ela.", "Passeamos a cavalo."], "certa": 2, "explicacao": "c) — o certo é “à praça”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Por que a palavra <b>mesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "depois de consoante, um s só já tem som de s", "ss pode começar uma palavra", "entre vogais, o s tem som de z", "no começo da palavra, o s tem som de s"], "certa": 3, "explicacao": "d) entre vogais, o s tem som de z"}, {"enunciado": "Tomara que nós ___ o lanche. (verbo trazer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["trazemos", "trazer", "tragamos", "trouxemos", "trouxéssemos"], "certa": 2, "explicacao": "c) tragamos"}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["novato, iniciante", "firme e calmo diante do sofrimento", "esperto, que percebe tudo rápido", "inútil, perda de tempo", "proveitoso, que dá bons resultados"], "certa": 4, "explicacao": "e) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "“Sumiu do quintal o time de Felipe.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Sumiu", "do", "não tem sujeito", "o time de Felipe", "o sujeito está escondido (oculto)"], "certa": 3, "explicacao": "d) o time de Felipe — o sujeito veio depois do verbo. Pergunte: quem sumiu?"}, {"enunciado": "Por que a palavra <b>paletó</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em x leva acento", "paroxítona terminada em ditongo (ia, io, ua, ea…) leva acento", "paroxítona terminada em us leva acento", "oxítona terminada em o leva acento", "paroxítona terminada em r leva acento"], "certa": 3, "explicacao": "d) oxítona terminada em o leva acento (pa-le-tó)."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os primos de Ricardo escondeu o presente.", "Os primos de Ricardo escondemos o presente.", "Os primos de Ricardo esconderam o presente.", "Os primos de Ricardo escondi o presente.", "Os primos de Ricardo esconde o presente."], "certa": 2, "explicacao": "c) Os primos de Ricardo esconderam o presente. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não está em lugar nenhum", "esperto, que percebe tudo rápido", "que está em toda parte", "rigoroso e sem luxo", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 2, "explicacao": "c) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o cometa", "a dia", "o planeta", "o clima", "a derme"], "certa": 1, "explicacao": "b) a dia — o certo é “o dia”."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
