<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Lucas comprou três frutas: maçã laranja e pera.", "Lucas comprou três frutas: maçã, laranja, e pera.", "Lucas comprou três frutas: maçã, laranja e pera.", "Lucas comprou três frutas maçã, laranja e pera.", "Lucas, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Lucas comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Lucas e o verbo."}, {"enunciado": "De que duas palavras se forma <b>àquela</b>? Responda com a letra.", "alternativas": ["a + aquelas", "a + aquilo", "àq + aquela", "a + aquela", "de + aquela"], "certa": 3, "explicacao": "d) a + aquela"}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "digno de confiança, verdadeiro", "esperto, que percebe tudo rápido", "oportunidade, ocasião", "duvidoso, suspeito"], "certa": 1, "explicacao": "b) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["queijo", "foguinho", "bilíngue", "quente", "guerra"], "certa": 2, "explicacao": "c) bilíngue — em “bilíngue” a gente fala o u"}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizeram", "disseram", "dizem", "dirão", "diziam"], "certa": 1, "explicacao": "b) disseram"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>fiel</b>? Responda com a letra.", "alternativas": ["fielérrimo", "felicíssimo", "fidelíssimo", "fielíssima", "altíssimo"], "certa": 2, "explicacao": "c) fidelíssimo"}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "que arma truques para enganar", "muito educado e gentil", "inconveniente; fora do assunto", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 3, "explicacao": "d) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>flauta</b>? Responda com a letra.", "alternativas": ["chavezinha", "bolinha", "flautim", "mulherzinha", "peixinho"], "certa": 2, "explicacao": "c) flautim"}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Ele tem muitos amigos.", "Ela leu muitos livros.", "Muitas crianças brincavam no parque.", "O cachorro late muito.", "Bebi muita água."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ele chorou por quê caiu da bicicleta?", "O gelo derreteu porque o dia estava quente?", "O caminho por que passei estava cheio de flores.", "O bolo afundou e ninguém sabe por quê.", "Choveu muito; eis por que o jogo parou."], "certa": 0, "explicacao": "a) — o certo é “Ele chorou porque caiu da bicicleta?”: a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles pescaram no lago.", "No ano que vem, eles abrirão a janela.", "Na semana passada, eles receberam visitas.", "No ano que vem, eles limparão o quarto.", "Hoje de manhã, eles varrerão o quintal."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "que dura pouco tempo", "que não faz mal, sem efeito", "que não se apaga", "fácil de apagar"], "certa": 3, "explicacao": "d) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Na frase “Leve o casaco, <b>porque</b> vai esfriar.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["o motivo", "porém", "pois", "pelo qual / pela qual", "por qual"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Otávio, o goleiro, chegou cedo.", "Comprei banana, laranja e maçã.", "Manuela, cuidado com o degrau!", "A girafa do zoológico, brincou no parque."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (A girafa do zoológico) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Felipe trouxe a revista para mim ler.", "Sem mim, a festa não teria graça.", "Ela deu o recado para eu levar.", "O bolo é para mim."], "certa": 1, "explicacao": "b) — o certo é “para eu ler”."}, {"enunciado": "A palavra <b>a mosca</b> é… Responda com a letra.", "alternativas": ["epiceno", "sobrecomum", "tem feminino diferente (biforme)", "comum de dois", "não tem gênero"], "certa": 0, "explicacao": "a) epiceno — animal: a mosca macho / a mosca fêmea."}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "perigoso, venenoso", "excelente, muito habilidoso", "que não faz mal, sem efeito", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 3, "explicacao": "d) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Cuba</b> é… Responda com a letra.", "alternativas": ["catarinense", "argentino", "cubano", "venezuelano", "recifense"], "certa": 2, "explicacao": "c) cubano"}, {"enunciado": "“A formiguinha cabe na unha.”<br>Que sentido tem <b>formiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "carinho", "admiração", "pressa", "tamanho"], "certa": 4, "explicacao": "e) tamanho"}, {"enunciado": "Como se diz o macho da <b>formiga</b>? Responda com a letra.", "alternativas": ["o formiga macho", "o formiga", "a formigazinho", "o formigo", "a formiga macho"], "certa": 4, "explicacao": "e) a formiga macho — formiga é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Situação: O mágico tirou um coelho da cartola.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Uau!", "Fora!", "Eca!", "Alô!", "Ui!"], "certa": 0, "explicacao": "a) Uau! — espanto."}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "firme e calmo diante do sofrimento", "especialista, veterano", "novato, iniciante", "incomum, surpreendente"], "certa": 3, "explicacao": "d) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Qual é o coletivo de <b>animais</b>? Responda com a letra.", "alternativas": ["fauna", "esquadrilha", "zoológico", "manada", "flora"], "certa": 0, "explicacao": "a) fauna — flora é de outro grupo."}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se apaga", "preciso, feito com muito cuidado", "que dura pouco, passageiro", "que dura muito, que não acaba", "vencer, controlar (um incêndio, uma crise)"], "certa": 3, "explicacao": "d) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Chegamos ao meio-dia.", "Aprendi a nadar.", "Bianca foi a sorveteria.", "Ficaram frente a frente."], "certa": 3, "explicacao": "d) — o certo é “à sorveteria”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Por que a palavra <b>mesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss", "ss pode começar uma palavra", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "Se eu ___ o lanche, ficaria contente. (verbo trazer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["trago", "traga", "trouxe", "trouxesse", "trazer"], "certa": 3, "explicacao": "d) trouxesse"}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "inútil, perda de tempo", "ligado à vida simples e tranquila do campo", "proveitoso, que dá bons resultados", "vencer, controlar (um incêndio, uma crise)"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "“Saiu correndo o vizinho do lado.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "o vizinho do lado", "não tem sujeito", "correndo", "Saiu"], "certa": 1, "explicacao": "b) o vizinho do lado — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Por que a palavra <b>vândalo</b> tem acento? Responda com a letra.", "alternativas": ["toda proparoxítona (a força na antepenúltima sílaba) tem acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "paroxítona terminada em ão ou ã leva acento", "paroxítona terminada em ps leva acento", "paroxítona terminada em us leva acento"], "certa": 0, "explicacao": "a) toda proparoxítona (a força na antepenúltima sílaba) tem acento (vân-da-lo)."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
