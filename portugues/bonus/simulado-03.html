<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 3 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 3 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Rafaela comprou três frutas: maçã laranja e pera.", "Rafaela comprou três frutas: maçã, laranja, e pera.", "Rafaela comprou três frutas: maçã, laranja e pera.", "Rafaela comprou três frutas maçã, laranja e pera.", "Rafaela, comprou três frutas: maçã, laranja e pera."], "certa": 2, "explicacao": "c) Rafaela comprou três frutas: maçã, laranja e pera. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Rafaela e o verbo."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["florzinha", "bolinha", "gatinho", "pezinho", "cozinha"], "certa": 4, "explicacao": "e) cozinha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "De que duas palavras se forma <b>àquilo</b>? Responda com a letra.", "alternativas": ["a + aquila", "àq + aquilo", "de + aquilo", "a + aquilo", "a + isso"], "certa": 3, "explicacao": "d) a + aquilo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Fui à praia a pé.", "Chegamos às oito horas.", "Vou a Bahia nas férias.", "Vire à esquerda."], "certa": 3, "explicacao": "d) — o certo é “à Bahia”: macete: “vou a, volto da: crase há”."}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["proveitoso, que dá bons resultados", "duvidoso, suspeito", "rigoroso e sem luxo", "digno de confiança, verdadeiro", "arrependido"], "certa": 3, "explicacao": "d) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["mosquito", "foguinho", "sequência", "quente", "preguiça"], "certa": 2, "explicacao": "c) sequência — em “sequência” a gente fala o u"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente canta no coral da escola.", "A gente assistimos ao jogo pela televisão.", "A gente dança na festa junina.", "Nós ajudamos a vovó na cozinha.", "Nós brincamos no parque."], "certa": 1, "explicacao": "b) — o certo é “A gente assiste”: a gente pede o verbo como “ele”."}, {"enunciado": "Ontem eu ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["poderei", "podia", "pude", "podi", "posso"], "certa": 2, "explicacao": "c) pude"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>antigo</b>? Responda com a letra.", "alternativas": ["antigérrimo", "antiquíssimo", "crudelíssimo", "antiguíssimo", "friíssimo"], "certa": 1, "explicacao": "b) antiquíssimo"}, {"enunciado": "O que quer dizer <b>impertinente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito educado e gentil", "urgente", "que fala pouco, de poucas palavras", "arrependido", "inconveniente; fora do assunto"], "certa": 4, "explicacao": "e) inconveniente; fora do assunto. Não é “muito educado e gentil”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>parte</b>? Responda com a letra.", "alternativas": ["chapeuzinho", "peixinho", "copinho", "cachorrinho", "partícula"], "certa": 4, "explicacao": "e) partícula"}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Ganhei muitos presentes.", "Muitos peixes nadavam no lago.", "Muitas pessoas vieram à festa.", "Comemos muitos pastéis.", "O bolo estava muito gostoso."], "certa": 4, "explicacao": "e) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["— Não vou à praia. — Por quê?", "Explique por que a planta precisa de sol.", "Não sei por que motivo ele saiu.", "Você sabe por que a girafa tem o pescoço comprido?", "Felipe ficou feliz por que ganhou a corrida."], "certa": 4, "explicacao": "e) — o certo é “Felipe ficou feliz porque ganhou a corrida.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["No ano que vem, eles decidiram o jogo.", "Amanhã, eles beberão suco.", "Ontem, eles lavaram o carro.", "Na semana passada, eles aprenderam uma música nova.", "Ontem, eles estudaram para a prova."], "certa": 0, "explicacao": "a) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>indelével</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que não se apaga", "sem nenhum machucado, ileso", "fácil de apagar", "que arma truques para enganar"], "certa": 1, "explicacao": "b) que não se apaga. Não é “fácil de apagar”: essa é a pegadinha."}, {"enunciado": "Na frase “A janela <b>por que</b> o gato fugiu ficou aberta.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "por qual motivo", "motivo para", "por isso", "porém"], "certa": 0, "explicacao": "a) pelo qual / pela qual — troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comprei maçã, pera e uva.", "São Paulo, 16 de outubro de 2026.", "Bianca, a capitã do time, chegou cedo.", "Bianca, cuidado com o degrau!", "O dono da padaria, uniu as peças."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (O dono da padaria) do verbo com vírgula."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Isso é para eu ler.", "Sem mim, a festa não teria graça.", "Ela deu o recado para eu levar.", "Mamãe trouxe o mapa para mim estudar."], "certa": 4, "explicacao": "e) — o certo é “para eu estudar”."}, {"enunciado": "A palavra <b>o/a turista</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "epiceno", "tem feminino diferente (biforme)", "sobrecomum", "comum de dois"], "certa": 4, "explicacao": "e) comum de dois — o turista / a turista: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>inócuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "que dura muito, que não acaba", "perigoso, venenoso", "urgente", "proveitoso, que dá bons resultados"], "certa": 0, "explicacao": "a) que não faz mal, sem efeito. Não é “perigoso, venenoso”: essa é a pegadinha."}, {"enunciado": "Quem nasce na <b>Rússia</b> é… Responda com a letra.", "alternativas": ["francês", "chinês", "sul-mato-grossense", "russo", "piauiense"], "certa": 3, "explicacao": "d) russo"}, {"enunciado": "“Meu filhinho querido!”<br>Que sentido tem <b>filhinho</b> nessa frase? Responda com a letra.", "alternativas": ["admiração", "pressa", "carinho", "desprezo", "tamanho"], "certa": 2, "explicacao": "c) carinho"}, {"enunciado": "Como se diz o macho da <b>sardinha</b>? Responda com a letra.", "alternativas": ["o sardinha macho", "o sardinho", "o sardinha", "a sardinhazinho", "a sardinha macho"], "certa": 4, "explicacao": "e) a sardinha macho — sardinha é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Situação: Bianca atende o telefone.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Uau!", "Oba!", "Arre!", "Alô!", "Cuidado!"], "certa": 3, "explicacao": "d) Alô! — chamado."}, {"enunciado": "O que quer dizer <b>neófito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "novato, iniciante", "que não se apaga", "especialista, veterano", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 1, "explicacao": "b) novato, iniciante. Não é “especialista, veterano”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>obra-prima</b>? Responda com a letra.", "alternativas": ["obra-primaes", "obra-prima", "obras-primas", "obras-prima", "obra-primas"], "certa": 2, "explicacao": "c) obras-primas"}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["pescar", "chuviscar", "dançar", "tocar", "trabalhar"], "certa": 1, "explicacao": "b) chuviscar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual é o coletivo de <b>atores</b>? Responda com a letra.", "alternativas": ["coro", "turma", "banda", "elenco", "cordilheira"], "certa": 3, "explicacao": "d) elenco — coro é de outro grupo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Meu avô é pescador.", "Elas veem o mar da janela.", "As caixas contém doze lápis.", "Vamos para casa.", "Ele tem dois irmãos."], "certa": 2, "explicacao": "c) — o certo é “As caixas contêm…”."}, {"enunciado": "O que quer dizer <b>perene</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "que dura pouco, passageiro", "estranho, fora do comum", "caro, que custa muito", "esfriar, perder a força"], "certa": 0, "explicacao": "a) que dura muito, que não acaba. Não é “que dura pouco, passageiro”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-3';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
