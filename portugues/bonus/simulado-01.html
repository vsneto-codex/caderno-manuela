<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Os alunos e a diretora escreveram uma carta.", "Mostrei o desenho.", "Faz uma semana que ele viajou.", "O vizinho do lado respondeu às perguntas.", "Voltei para casa."], "certa": 0, "explicacao": "a) Os alunos e a diretora escreveram uma carta."}, {"enunciado": "Na frase “<b>Por que</b> o camaleão muda de cor?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "por isso", "pelo qual / pela qual", "motivo para", "porém"], "certa": 0, "explicacao": "a) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>paço</b>? Responda com a letra.", "alternativas": ["longo", "reserva, ser discreto", "palácio", "passada", "saudação"], "certa": 2, "explicacao": "c) palácio — não confunda com “passo” (passada)."}, {"enunciado": "Como se diz a fêmea do <b>polvo</b>? Responda com a letra.", "alternativas": ["a polvo", "o polvozinha", "o polvo fêmea", "a polvo fêmea", "a polva"], "certa": 2, "explicacao": "c) o polvo fêmea — polvo é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["triste, melancólico", "que dura muito, que não acaba", "ligado à vida simples e tranquila do campo", "que acontece fora de hora", "que está em toda parte"], "certa": 2, "explicacao": "c) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a criança</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "comum de dois", "tem feminino diferente (biforme)", "sobrecomum", "epiceno"], "certa": 3, "explicacao": "d) sobrecomum — a criança serve para menino e menina, sem mudar nada."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["itens", "hifens", "saguí", "tórax", "álbum"], "certa": 2, "explicacao": "c) saguí — o certo é sagui: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a diadema", "a cal", "o clima", "o planeta", "o champanhe"], "certa": 0, "explicacao": "a) a diadema — o certo é “o diadema”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Ufa!</b> expressa? Responda com a letra.", "alternativas": ["decepção", "pena", "chamado", "alívio", "impaciência"], "certa": 3, "explicacao": "d) alívio"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem medo, destemido", "começar, provocar", "vencer, controlar (um incêndio, uma crise)", "sem nenhum machucado, ileso", "nunca visto antes, extraordinário"], "certa": 2, "explicacao": "c) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["O cachorro latiu e o gato miou.", "A festa será no quintal se não chover.", "A loja fechou, portanto voltamos para casa.", "Beba água, porque está muito calor.", "O bolo era bonito, contudo estava sem açúcar."], "certa": 0, "explicacao": "a) O cachorro latiu e o gato miou."}, {"enunciado": "Qual é o plural de <b>água-viva</b>? Responda com a letra.", "alternativas": ["águas-vivas", "águas-viva", "água-vivas", "água-viva", "água-vivaes"], "certa": 0, "explicacao": "a) águas-vivas"}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio pintou um quadro.", "Por que a vovó e o vovô pularam corda?", "Nossa, que frio!", "Os alunos e a diretora receberam visitas.", "Dance na quadrilha!"], "certa": 1, "explicacao": "b) Por que a vovó e o vovô pularam corda?"}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um amigo</b>? Responda com a letra.", "alternativas": ["Vossa Alteza", "Vossa Santidade", "Vossa Senhoria", "você", "Vossa Magnificência"], "certa": 3, "explicacao": "d) você"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arma truques para enganar", "desejo, vontade", "esperto, que percebe tudo rápido", "que não faz mal, sem efeito", "oportunidade, ocasião"], "certa": 4, "explicacao": "e) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["calor", "ar", "dragão", "areia", "janela"], "certa": 0, "explicacao": "a) calor — só existe se alguém fizer ou sentir."}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["quero", "queri", "quererei", "queria", "quis"], "certa": 4, "explicacao": "e) quis"}, {"enunciado": "Ontem eu ___ (verbo <b>conter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["contive", "contei", "conteu", "conteru", "conti"], "certa": 0, "explicacao": "a) contive — conter segue ter: eu tive → eu contive."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Clara estava meio triste.", "Bebi meia garrafa de água.", "A vovó ficou meia tímida.", "As portas estavam meio abertas.", "Comi meia pizza."], "certa": 2, "explicacao": "c) — o certo é “A vovó ficou meio tímida”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece por acaso", "intenso, enérgico", "gratuito, de graça", "novato, iniciante", "digno de confiança, verdadeiro"], "certa": 0, "explicacao": "a) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Quem nasce no <b>Japão</b> é… Responda com a letra.", "alternativas": ["japonês", "campo-grandense", "alemão", "português", "indiano"], "certa": 0, "explicacao": "a) japonês"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós cantamos no coral da escola.", "A gente estudamos juntos todo dia.", "A gente mora perto da praia.", "A gente joga bola no recreio.", "Nós aprendemos rápido."], "certa": 1, "explicacao": "b) — o certo é “A gente estuda”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["móvel", "zebra", "água", "óculos", "delicadeza"], "certa": 3, "explicacao": "d) óculos — ó-cu-los: é proparoxítona."}, {"enunciado": "— Psiu! Moça, esqueceu a sacola!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["chamar alguém", "mostrar nojo", "mostrar alegria", "mostrar dor", "pedir silêncio"], "certa": 0, "explicacao": "a) chamar alguém — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pálido, sem cor", "urgente", "sem medo, destemido", "que fala ou escreve demais, enrolando", "novato, iniciante"], "certa": 2, "explicacao": "c) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“A formiguinha cabe na unha.”<br>Que sentido tem <b>formiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "carinho", "admiração", "pressa", "tamanho"], "certa": 4, "explicacao": "e) tamanho"}, {"enunciado": "“Ele treinou todo dia, portanto ganhou a corrida.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porém", "mas", "se", "por isso", "já que"], "certa": 3, "explicacao": "d) por isso — as duas dão ideia de conclusão."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>grande</b>? Responda com a letra.", "alternativas": ["longe", "molhado", "frio", "pequeno", "verão"], "certa": 3, "explicacao": "d) pequeno"}, {"enunciado": "Como se lê <b>século XVIII</b>? Responda com a letra.", "alternativas": ["dezenove", "18", "dezoito", "décimo oitavo", "dezessete"], "certa": 2, "explicacao": "c) dezoito — depois do décimo, lê-se como cardinal."}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz efeito", "isca, armadilha para enganar", "que traz boas notícias", "muitas vezes, com frequência", "tão bom que não dá para descrever com palavras"], "certa": 4, "explicacao": "e) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
