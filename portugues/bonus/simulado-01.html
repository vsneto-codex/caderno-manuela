<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “Manuela riu <b>porque</b> o palhaço caiu.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "o motivo", "motivo para", "por qual", "pois"], "certa": 4, "explicacao": "e) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>emigrante</b>? Responda com a letra.", "alternativas": ["quem sai do país", "prestes a acontecer", "quem entra no país", "anular um direito", "quem anda a cavalo"], "certa": 0, "explicacao": "a) quem sai do país — não confunda com “imigrante” (quem entra no país)."}, {"enunciado": "Como se diz o macho da <b>baleia</b>? Responda com a letra.", "alternativas": ["a baleia macho", "o baleia macho", "o baleio", "a baleiazinho", "o baleia"], "certa": 0, "explicacao": "a) a baleia macho — baleia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "ligado à vida simples e tranquila do campo", "rigoroso e sem luxo", "confirmar, reforçar uma ideia", "triste, melancólico"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a baleia</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "não tem gênero", "comum de dois", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: a baleia macho / a baleia fêmea."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["juiz", "países", "papéis", "estóico", "hifens"], "certa": 3, "explicacao": "d) estóico — o certo é estoico: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a alface", "a telefonema", "a foto", "a sentinela", "o sistema"], "certa": 1, "explicacao": "b) a telefonema — o certo é “o telefonema”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Que horror!</b> expressa? Responda com a letra.", "alternativas": ["dúvida", "dor", "chamado", "medo", "alívio"], "certa": 3, "explicacao": "d) medo"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "onde é muito difícil viver", "que não se apaga", "mentira, golpe para enganar", "começar, provocar"], "certa": 0, "explicacao": "a) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["Treinamos bastante, contudo perdemos o jogo.", "Plantamos a semente, portanto nasceu uma árvore.", "Volte cedo, porque amanhã tem aula.", "Felipe cantou e Bianca dançou.", "A festa será no quintal se não chover."], "certa": 4, "explicacao": "e) A festa será no quintal se não chover."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Fale com a vovó.", "Bianca guardou os brinquedos?", "Que festa animada!", "Esconda o presente.", "O time de Felipe lavou o carro."], "certa": 1, "explicacao": "b) Bianca guardou os brinquedos?"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["desejo, vontade", "oportunidade, ocasião", "que dura muito, que não acaba", "arrependido", "generoso, de coração grande"], "certa": 1, "explicacao": "b) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trazia", "trarei", "trago", "trazi", "trouxe"], "certa": 4, "explicacao": "e) trouxe"}, {"enunciado": "Ontem eu ___ (verbo <b>propor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["proponhei", "propi", "propori", "propôs", "propus"], "certa": 4, "explicacao": "e) propus — propor segue pôr: eu pus → eu propus."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["As portas estavam meio abertas.", "Comi meia pizza.", "Bebi meia garrafa de água.", "Já é meio-dia e meia.", "Bianca ficou meia cansada."], "certa": 4, "explicacao": "e) — o certo é “Bianca ficou meio cansada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "muitas vezes, com frequência", "que acontece por acaso", "gratuito, de graça", "defesa, elogio de uma ideia"], "certa": 2, "explicacao": "c) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Minas Gerais</b> é… Responda com a letra.", "alternativas": ["capixaba", "egípcio", "marroquino", "paranaense", "mineiro"], "certa": 4, "explicacao": "e) mineiro"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["dentista", "câmera", "toalha", "órfã", "fênix"], "certa": 1, "explicacao": "b) câmera — câ-me-ra: é proparoxítona."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pálido, sem cor", "tão bom que não dá para descrever com palavras", "sem medo, destemido", "aliviar, diminuir (uma dor, um problema)", "firme e calmo diante do sofrimento"], "certa": 2, "explicacao": "c) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["admiração", "pressa", "tamanho", "desprezo", "carinho"], "certa": 3, "explicacao": "d) desprezo"}, {"enunciado": "“O filme era longo, contudo ninguém dormiu.”<br>Qual conjunção pode ficar no lugar de <b>contudo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["já que", "entretanto", "porque", "caso", "logo"], "certa": 1, "explicacao": "b) entretanto — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>vencer</b>? Responda com a letra.", "alternativas": ["dormindo", "vazio", "pior", "ausente", "perder"], "certa": 4, "explicacao": "e) perder"}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["preciso, feito com muito cuidado", "que não faz efeito", "tão bom que não dá para descrever com palavras", "sem nenhum machucado, ileso", "isca, armadilha para enganar"], "certa": 2, "explicacao": "c) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "“— Eu tenho medo do escuro aqui — respondeu a professora.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["A professora respondeu que tem medo do escuro aqui.", "A professora respondeu que eu tinha medo do escuro ali.", "A professora respondeu que tinha medo do escuro ali.", "A professora respondeu que tinha medo do escuro aqui.", "A professora respondeu que eu tenho medo do escuro aqui."], "certa": 2, "explicacao": "c) A professora respondeu que tinha medo do escuro ali."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["e-xce-to", "jo-a-ni-nha", "mu-seu", "ma-gro", "os-so"], "certa": 0, "explicacao": "a) e-xce-to — o certo é ex-ce-to: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Qual é o plural de <b>leão</b>? Responda com a letra.", "alternativas": ["leães", "leoes", "leãos", "leões", "leãoes"], "certa": 3, "explicacao": "d) leões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Daqui a dois dias, eles plantaram uma árvore.", "Amanhã, eles decidirão o jogo.", "Daqui a dois dias, eles falarão com a vovó.", "No ano que vem, eles correrão no parque.", "Na semana passada, eles varreram o quintal."], "certa": 0, "explicacao": "a) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "isca, armadilha para enganar", "acolhedor, confortável", "resistente (ao calor, a mudanças)", "onde é muito difícil viver"], "certa": 4, "explicacao": "e) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Se vocês ___ a mesa, avisem. (verbo pôr)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["pôr", "põem", "puseram", "puserem", "ponham"], "certa": 3, "explicacao": "d) puserem"}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
