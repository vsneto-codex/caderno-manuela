<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “Esse <b>porquê</b> não me convenceu.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "o motivo", "por qual", "por qual motivo", "motivo para"], "certa": 1, "explicacao": "b) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "O que quer dizer <b>cumprido</b>? Responda com a letra.", "alternativas": ["quem entra no país", "realizado", "ato de ceder", "bebida", "longo"], "certa": 1, "explicacao": "b) realizado — não confunda com “comprido” (longo)."}, {"enunciado": "Como se diz a fêmea do <b>pernilongo</b>? Responda com a letra.", "alternativas": ["a pernilongo", "o pernilongozinha", "o pernilongo fêmea", "a pernilongo fêmea", "a pernilonga"], "certa": 2, "explicacao": "c) o pernilongo fêmea — pernilongo é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["triste, melancólico", "que dura muito, que não acaba", "ligado à vida simples e tranquila do campo", "que acontece fora de hora", "que está em toda parte"], "certa": 2, "explicacao": "c) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o/a pianista</b> é… Responda com a letra.", "alternativas": ["epiceno", "sobrecomum", "comum de dois", "tem feminino diferente (biforme)", "não tem gênero"], "certa": 2, "explicacao": "c) comum de dois — o pianista / a pianista: a palavra é igual, o artigo muda."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["caír", "hifens", "voo", "vírus", "saúde"], "certa": 0, "explicacao": "a) caír — o certo é cair: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a mapa", "a cal", "o guaraná", "a sentinela", "o diadema"], "certa": 0, "explicacao": "a) a mapa — o certo é “o mapa”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Viva!</b> expressa? Responda com a letra.", "alternativas": ["aplauso", "alegria", "chamado", "pena", "afastamento"], "certa": 1, "explicacao": "b) alegria"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "aliviar, diminuir (uma dor, um problema)", "grosseiro, muito grave (um erro)", "que dura pouco tempo", "começar, provocar"], "certa": 0, "explicacao": "a) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chover.", "Felipe cantou e Bianca dançou.", "A loja fechou, logo voltamos para casa.", "Felipe queria jogar, entretanto estava com febre.", "Não corra no corredor, já que o chão está molhado."], "certa": 0, "explicacao": "a) A festa será no quintal caso não chover."}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["A vovó e o vovô trabalharam na horta.", "Que gol bonito!", "Jogue bola.", "Minhas tias discutiram o assunto.", "O vizinho do lado guardou os brinquedos?"], "certa": 2, "explicacao": "c) Jogue bola."}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arma truques para enganar", "que acontece por acaso", "esfriar, perder a força", "desejo, vontade", "oportunidade, ocasião"], "certa": 4, "explicacao": "e) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Ontem eles ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["faziam", "farão", "fazem", "fazeram", "fizeram"], "certa": 4, "explicacao": "e) fizeram"}, {"enunciado": "Ontem eu ___ (verbo <b>supor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["supôs", "suponhei", "supi", "supus", "supori"], "certa": 3, "explicacao": "d) supus — supor segue pôr: eu pus → eu supus."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comprei meio quilo de uva.", "Bebi meia garrafa de água.", "Manuela ficou meia tímida.", "Comi meia pizza.", "Já é meio-dia e meia."], "certa": 2, "explicacao": "c) — o certo é “Manuela ficou meio tímida”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "gratuito, de graça", "esfriar, perder a força", "estranho, fora do comum", "que acontece por acaso"], "certa": 4, "explicacao": "e) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Holanda</b> é… Responda com a letra.", "alternativas": ["acriano", "carioca", "holandês", "mato-grossense", "brasileiro"], "certa": 2, "explicacao": "c) holandês"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["lápis", "vovó", "horta", "réptil", "rede"], "certa": 1, "explicacao": "b) vovó — vo-vó: é oxítona."}, {"enunciado": "— Psiu! Moça, esqueceu a sacola!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["chamar alguém", "mostrar nojo", "mostrar alegria", "mostrar dor", "pedir silêncio"], "certa": 0, "explicacao": "a) chamar alguém — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "pálido, sem cor", "arrogância, ar de superioridade", "sem medo, destemido", "combinado sem precisar falar, subentendido"], "certa": 3, "explicacao": "d) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "carinho", "desprezo", "pressa", "admiração"], "certa": 2, "explicacao": "c) desprezo"}, {"enunciado": "“Ricardo é tímido, todavia adora cantar.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["portanto", "porque", "se", "entretanto", "pois"], "certa": 3, "explicacao": "d) entretanto — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>mais</b>? Responda com a letra.", "alternativas": ["partir", "depois", "menos", "fim", "empurrar"], "certa": 2, "explicacao": "c) menos"}, {"enunciado": "Como se lê <b>século XX</b>? Responda com a letra.", "alternativas": ["dezenove", "vinte", "20", "vigésimo", "vinte e um"], "certa": 1, "explicacao": "b) vinte — depois do décimo, lê-se como cardinal."}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "confusão, situação enrolada", "ligado à vida simples e tranquila do campo", "que não faz efeito", "grosseiro, muito grave (um erro)"], "certa": 0, "explicacao": "a) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "“— Eu preciso de ajuda hoje — avisou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo avisou que eu precisava de ajuda naquele dia.", "Ricardo avisou que precisava de ajuda naquele dia.", "Ricardo avisou que eu preciso de ajuda hoje.", "Ricardo avisou que precisa de ajuda hoje.", "Ricardo avisou que precisava de ajuda hoje."], "certa": 1, "explicacao": "b) Ricardo avisou que precisava de ajuda naquele dia."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["dis-ci-pli-na", "a-ma-ssar", "ap-ren-der", "ae-ro-por-to", "de-gra-u"], "certa": 0, "explicacao": "a) dis-ci-pli-na — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Qual é o plural de <b>botão</b>? Responda com a letra.", "alternativas": ["botãos", "botães", "botãoes", "botões", "botoes"], "certa": 3, "explicacao": "d) botões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles escreveram uma carta.", "Daqui a dois dias, eles cantarão na festa.", "Daqui a dois dias, eles brincarão no parque.", "Hoje de manhã, eles aprenderam uma música nova.", "No ano que vem, eles acordaram cedo."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
