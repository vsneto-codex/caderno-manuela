<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “Esse <b>porquê</b> não me convenceu.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "o motivo", "por qual", "por qual motivo", "motivo para"], "certa": 1, "explicacao": "b) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "O que quer dizer <b>senso</b>? Responda com a letra.", "alternativas": ["antigo rei do Irã", "ilustre", "contagem da população", "juízo", "produzir efeito"], "certa": 3, "explicacao": "d) juízo — não confunda com “censo” (contagem da população)."}, {"enunciado": "Como se diz o macho da <b>formiga</b>? Responda com a letra.", "alternativas": ["a formigazinho", "a formiga macho", "o formigo", "o formiga macho", "o formiga"], "certa": 1, "explicacao": "b) a formiga macho — formiga é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "confirmar, reforçar uma ideia", "que passa num instante", "que fala ou escreve demais, enrolando", "triste, melancólico"], "certa": 0, "explicacao": "a) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o/a pianista</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "comum de dois", "não tem gênero", "epiceno", "sobrecomum"], "certa": 1, "explicacao": "b) comum de dois — o pianista / a pianista: a palavra é igual, o artigo muda."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["veem", "órfã", "aínda", "lápis", "ruim"], "certa": 2, "explicacao": "c) aínda — o certo é ainda: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a eclipse", "o tema", "o mapa", "a mão", "o clã"], "certa": 0, "explicacao": "a) a eclipse — o certo é “o eclipse”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Que horror!</b> expressa? Responda com a letra.", "alternativas": ["medo", "pena", "dúvida", "aplauso", "desejo"], "certa": 0, "explicacao": "a) medo"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "começar, provocar", "que não se apaga", "mentira, golpe para enganar", "totalmente fechado; difícil de entender"], "certa": 0, "explicacao": "a) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Estudei muito, entretanto achei a prova difícil.", "Volte cedo, porque amanhã tem aula.", "A loja fechou, por isso voltamos para casa.", "O gato pulou e derrubou o vaso.", "A planta cresce caso receba água."], "certa": 0, "explicacao": "a) Estudei muito, entretanto achei a prova difícil."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Que susto!", "Volte para casa!", "Minhas tias discutiram o assunto.", "Compre pão.", "Os primos de Ricardo falaram com a vovó?"], "certa": 4, "explicacao": "e) Os primos de Ricardo falaram com a vovó?"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "desejo, vontade", "oportunidade, ocasião", "aliviar, diminuir (uma dor, um problema)", "que arma truques para enganar"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Ontem ele ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trará", "traz", "trazeu", "trouxe", "trazia"], "certa": 3, "explicacao": "d) trouxe"}, {"enunciado": "Ontem eu ___ (verbo <b>deter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["detei", "deteu", "deti", "deteru", "detive"], "certa": 4, "explicacao": "e) detive — deter segue ter: eu tive → eu detive."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["As portas estavam meio abertas.", "A vovó ficou meia triste.", "Clara estava meio tímida.", "Já é meio-dia e meia.", "Bebi meia garrafa de água."], "certa": 1, "explicacao": "b) — o certo é “A vovó ficou meio triste”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["gratuito, de graça", "mentira, golpe para enganar", "novato, iniciante", "que acontece por acaso", "descuidado, que cai fácil em armadilhas"], "certa": 3, "explicacao": "d) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Inglaterra</b> é… Responda com a letra.", "alternativas": ["paranaense", "mineiro", "pernambucano", "piauiense", "inglês"], "certa": 4, "explicacao": "e) inglês"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["bufê", "assistir", "armazém", "crescimento", "ganhar"], "certa": 3, "explicacao": "d) crescimento — cres-ci-men-to: é paroxítona."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "ligado à vida simples e tranquila do campo", "sem medo, destemido", "pálido, sem cor", "pouco, escasso"], "certa": 2, "explicacao": "c) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Minha amiguinha do coração!”<br>Que sentido tem <b>amiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["admiração", "carinho", "desprezo", "pressa", "tamanho"], "certa": 1, "explicacao": "b) carinho"}, {"enunciado": "“Estudei muito, entretanto achei a prova difícil.”<br>Qual conjunção pode ficar no lugar de <b>entretanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["já que", "pois", "porque", "porém", "caso"], "certa": 3, "explicacao": "d) porém — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>verdade</b>? Responda com a letra.", "alternativas": ["perder", "descer", "recusar", "ausente", "mentira"], "certa": 4, "explicacao": "e) mentira"}, {"enunciado": "Como se lê <b>século XX</b>? Responda com a letra.", "alternativas": ["vigésimo", "dezenove", "vinte e um", "20", "vinte"], "certa": 4, "explicacao": "e) vinte — depois do décimo, lê-se como cardinal."}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz efeito", "ligado à vida simples e tranquila do campo", "tão bom que não dá para descrever com palavras", "que traz boas notícias", "que dura pouco tempo"], "certa": 2, "explicacao": "c) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "“— Eu adoro dinossauros hoje — respondeu Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca respondeu que eu adoro dinossauros hoje.", "Bianca respondeu que adorava dinossauros naquele dia.", "Bianca respondeu que adorava dinossauros hoje.", "Bianca respondeu que adora dinossauros hoje.", "Bianca respondeu que eu adorava dinossauros naquele dia."], "certa": 1, "explicacao": "b) Bianca respondeu que adorava dinossauros naquele dia."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["gen-gi-bre", "sub-so-lo", "tro-féu", "ba-le-i-a", "nos-so"], "certa": 3, "explicacao": "d) ba-le-i-a — o certo é ba-lei-a: no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Qual é o plural de <b>capitão</b>? Responda com a letra.", "alternativas": ["capitões", "capitãoes", "capitoes", "capitãos", "capitães"], "certa": 4, "explicacao": "e) capitães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles pularão corda.", "Daqui a dois dias, eles olharão as estrelas.", "No ano que vem, eles nadarão na piscina.", "Amanhã, eles plantarão uma árvore.", "Na semana passada, eles comerão pizza."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["acolhedor, confortável", "que arma truques para enganar", "isca, armadilha para enganar", "onde é muito difícil viver", "que acontece por acaso"], "certa": 3, "explicacao": "d) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
