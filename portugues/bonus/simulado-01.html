<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Como se diz o macho da <b>baleia</b>? Responda com a letra.", "alternativas": ["a baleia macho", "o baleio", "a baleiazinho", "o baleia", "o baleia macho"], "certa": 0, "explicacao": "a) a baleia macho — baleia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos ao meio-dia.", "Fiz uma visita àquele museu.", "Mostrei o desenho a treinadora.", "Fui ao clube e à piscina.", "Fui à praia a pé."], "certa": 2, "explicacao": "c) — o certo é “à treinadora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Ontem ele ___ (verbo <b>saber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["sabe", "sabeu", "sabia", "saberá", "soube"], "certa": 4, "explicacao": "e) soube"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["países", "orelha", "preciso", "fubá", "tríceps"], "certa": 3, "explicacao": "d) fubá — fu-bá: é oxítona."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "ligado à vida simples e tranquila do campo", "nunca visto antes, extraordinário", "triste, melancólico", "mentira, golpe para enganar"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["glacial", "assobiar", "navio", "cereal", "raiva"], "certa": 4, "explicacao": "e) raiva — rai-va"}, {"enunciado": "Por que a palavra <b>francesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["substantivos que vêm de adjetivos terminam em -eza", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "toda palavra terminada em -eza é feminino de origem", "femininos e palavras de origem terminam em -esa"], "certa": 4, "explicacao": "e) femininos e palavras de origem terminam em -esa"}, {"enunciado": "Qual é o coletivo de <b>animais</b>? Responda com a letra.", "alternativas": ["matilha", "flora", "zoológico", "manada", "fauna"], "certa": 4, "explicacao": "e) fauna — flora é de outro grupo."}, {"enunciado": "No ano que vem, eles ___ na festa. Qual forma completa a frase? Responda com a letra.", "alternativas": ["cantariam", "cantam", "cantaram", "cantavam", "cantarão"], "certa": 4, "explicacao": "e) cantarão — futuro: -ão."}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "começar, provocar", "remédio para todos os males", "que acontece por acaso", "vencer, controlar (um incêndio, uma crise)"], "certa": 4, "explicacao": "e) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>faixa</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["depois de ditongo se usa ch", "palavras que vêm de outras com ch usam x", "depois de ditongo se usa x", "depois de en- se usa x", "depois de me- se usa x"], "certa": 2, "explicacao": "c) depois de ditongo se usa x"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o eclipse", "o guaraná", "a clã", "o tema", "o dia"], "certa": 2, "explicacao": "c) a clã — o certo é “o clã”."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["xícara", "berinjela", "gengibre", "jiboia", "larangeira"], "certa": 4, "explicacao": "e) larangeira — o certo é laranjeira: vem de laranja: j."}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["oportunidade, ocasião", "desejo, vontade", "que arma truques para enganar", "arrogância, ar de superioridade", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 0, "explicacao": "a) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>capitão</b>? Responda com a letra.", "alternativas": ["capitãos", "capitães", "capitões", "capitoes", "capitãoes"], "certa": 1, "explicacao": "b) capitães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Como se lê <b>século XX</b>? Responda com a letra.", "alternativas": ["20", "dezenove", "vinte e um", "vigésimo", "vinte"], "certa": 4, "explicacao": "e) vinte — depois do décimo, lê-se como cardinal."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "gratuito, de graça", "pouco, escasso", "tão bom que não dá para descrever com palavras", "que acontece por acaso"], "certa": 4, "explicacao": "e) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o jacaré</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "comum de dois", "não tem gênero", "epiceno", "sobrecomum"], "certa": 3, "explicacao": "d) epiceno — animal: o jacaré macho / o jacaré fêmea."}, {"enunciado": "Na frase “<b>Por que</b> os gatos ronronam?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "pelo qual / pela qual", "o motivo", "por qual motivo", "por isso"], "certa": 3, "explicacao": "d) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "Felipe trouxe o caderno para mim desenhar.", "Trouxe o lápis para eu desenhar."], "certa": 3, "explicacao": "d) — o certo é “para eu desenhar”."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "nunca visto antes, extraordinário", "pálido, sem cor", "sem medo, destemido", "que não faz mal, sem efeito"], "certa": 3, "explicacao": "d) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>85º</b> por extenso? Responda com a letra.", "alternativas": ["octogésimo sexto", "oitentésimo quinto", "octogésimo quinto", "nonagésimo quinto", "septuagésimo quinto"], "certa": 2, "explicacao": "c) octogésimo quinto"}, {"enunciado": "Quando eu ___ o filme, conto para você. (verbo ver)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["vejo", "veja", "ver", "vir", "vi"], "certa": 3, "explicacao": "d) vir"}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "que não faz efeito", "fora da época certa", "mentira, golpe para enganar", "muitas vezes, com frequência"], "certa": 0, "explicacao": "a) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>estava escondendo</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["estava", "escondendo", "o sujeito", "os dois são principais", "não há verbo principal"], "certa": 1, "explicacao": "b) escondendo — o principal é o último, o que diz a ação."}, {"enunciado": "Qual é a junção de <b>de + aquilo</b>? Responda com a letra.", "alternativas": ["àaquilo", "de aquilo", "daquilo", "doaquilo", "naquilo"], "certa": 2, "explicacao": "c) daquilo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que o mar tem ondas", "Quero entender por que a Lua muda de forma.", "O pneu furou; eis por que chegamos atrasados.", "Por que motivo você faltou?", "O peixe subiu por que viu a comida."], "certa": 4, "explicacao": "e) — o certo é “O peixe subiu porque viu a comida.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "lento para entender", "onde é muito difícil viver", "acolhedor, confortável", "excelente, muito habilidoso"], "certa": 2, "explicacao": "c) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O ninho onde os filhotes dormem é de palha.", "O rádio funcionava mau por causa da chuva.", "Aquele não foi um mau jogo: o time jogou direitinho.", "A estação fica a cem metros daqui.", "A cidade onde nasci é pequena."], "certa": 1, "explicacao": "b) o certo é “mal”"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["travesseiro", "nassimento", "exceção", "açúcar", "piscina"], "certa": 1, "explicacao": "b) nassimento — o certo é nascimento: com sc, como nascer."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
