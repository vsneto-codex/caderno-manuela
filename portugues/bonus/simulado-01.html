<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “Não há <b>por que</b> correr: ainda é cedo.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "motivo para", "por qual", "por qual motivo", "o motivo"], "certa": 1, "explicacao": "b) motivo para — “não há por que” quer dizer “não há motivo para”: troque e veja que dá certo."}, {"enunciado": "O que quer dizer <b>paço</b>? Responda com a letra.", "alternativas": ["que não dá para ler", "palácio", "ato de ceder", "bebida", "passada"], "certa": 1, "explicacao": "b) palácio — não confunda com “passo” (passada)."}, {"enunciado": "Como se diz o macho da <b>onça</b>? Responda com a letra.", "alternativas": ["a onçazinho", "o onça", "o onço", "o onça macho", "a onça macho"], "certa": 4, "explicacao": "e) a onça macho — onça é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "triste, melancólico", "oportunidade, ocasião", "que dá para acreditar, razoável", "que acontece fora de hora"], "certa": 0, "explicacao": "a) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a zebra</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "epiceno", "comum de dois", "não tem gênero"], "certa": 2, "explicacao": "c) epiceno — animal: a zebra macho / a zebra fêmea."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["órfã", "países", "itens", "feiura", "heróico"], "certa": 4, "explicacao": "e) heróico — o certo é heroico: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a moto", "a cal", "o clima", "o champanhe", "a cometa"], "certa": 4, "explicacao": "e) a cometa — o certo é “o cometa”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Argh!</b> expressa? Responda com a letra.", "alternativas": ["chamado", "alegria", "nojo", "afastamento", "espanto"], "certa": 2, "explicacao": "c) nojo"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["começar, provocar", "que acontece por acaso", "esperto, que percebe tudo rápido", "vencer, controlar (um incêndio, uma crise)", "que acontece fora de hora"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Leve o casaco, porque vai esfriar.", "Plantamos a semente, logo nasceu uma árvore.", "Felipe cantou e Bianca dançou.", "Eu te ajudo caso você peça.", "Ricardo é tímido, contudo adora cantar."], "certa": 0, "explicacao": "a) Leve o casaco, porque vai esfriar."}, {"enunciado": "Qual é o plural de <b>abaixo-assinado</b>? Responda com a letra.", "alternativas": ["abaixo-assinados", "abaixos-assinado", "abaixos-assinados", "abaixo-assinado", "abaixo-assinadoes"], "certa": 0, "explicacao": "a) abaixo-assinados"}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio pintou um quadro.", "Por que a vovó e o vovô pularam corda?", "Nossa, que frio!", "Os alunos e a diretora receberam visitas.", "Dance na quadrilha!"], "certa": 1, "explicacao": "b) Por que a vovó e o vovô pularam corda?"}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um amigo</b>? Responda com a letra.", "alternativas": ["Vossa Magnificência", "Vossa Senhoria", "Vossa Santidade", "você", "Vossa Reverendíssima"], "certa": 3, "explicacao": "d) você"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["desejo, vontade", "esfriar, perder a força", "oportunidade, ocasião", "muito esquisito, absurdo", "arrependido"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["planta", "duende", "monstro", "grito", "bicicleta"], "certa": 3, "explicacao": "d) grito — só existe se alguém fizer ou sentir."}, {"enunciado": "Ontem eu ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizi", "digo", "direi", "dizia", "disse"], "certa": 4, "explicacao": "e) disse"}, {"enunciado": "Ontem eu ___ (verbo <b>desdizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["desdizi", "desdisse", "desdizei", "desdiz", "desdizeru"], "certa": 1, "explicacao": "b) desdisse — desdizer segue dizer: eu disse → eu desdisse."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Alice estava meio assustada.", "Bebi meia garrafa de água.", "Comprei meio quilo de uva.", "Comi meia pizza.", "A professora ficou meia preocupada."], "certa": 4, "explicacao": "e) — o certo é “A professora ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que não se apaga", "duvidoso, suspeito", "defesa, elogio de uma ideia", "que passa num instante"], "certa": 0, "explicacao": "a) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Salvador</b> é… Responda com a letra.", "alternativas": ["paraense", "belo-horizontino", "soteropolitano", "mineiro", "porto-alegrense"], "certa": 2, "explicacao": "c) soteropolitano"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente aprendemos rápido.", "A gente brinca no parque.", "A gente come muita fruta.", "Nós acordamos cedo no domingo.", "Nós ajudamos a vovó na cozinha."], "certa": 0, "explicacao": "a) — o certo é “A gente aprende”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["órfã", "músico", "médico", "príncipe", "tímido"], "certa": 0, "explicacao": "a) órfã — ór-fã: é paroxítona."}, {"enunciado": "— Psiu! Estamos na biblioteca.<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar nojo", "mostrar alegria", "chamar alguém", "mostrar dor", "pedir silêncio"], "certa": 4, "explicacao": "e) pedir silêncio — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não toma partido, que é justo com todos os lados", "pouco, escasso", "que traz boas notícias", "que está pela metade", "esforço, vontade forte de fazer algo"], "certa": 0, "explicacao": "a) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "“Vovô, dá um abracinho!”<br>Que sentido tem <b>abracinho</b> nessa frase? Responda com a letra.", "alternativas": ["carinho", "admiração", "pressa", "desprezo", "tamanho"], "certa": 0, "explicacao": "a) carinho"}, {"enunciado": "“Felipe queria jogar, entretanto estava com febre.”<br>Qual conjunção pode ficar no lugar de <b>entretanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["caso", "e", "por isso", "contudo", "já que"], "certa": 3, "explicacao": "d) contudo — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>ligar</b>? Responda com a letra.", "alternativas": ["desligar", "escuro", "descer", "comprido", "infeliz"], "certa": 0, "explicacao": "a) desligar"}, {"enunciado": "Como se lê <b>século III</b>? Responda com a letra.", "alternativas": ["quarto", "3", "segundo", "três", "terceiro"], "certa": 4, "explicacao": "e) terceiro — até o décimo, lê-se como ordinal."}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "combinado sem precisar falar, subentendido", "sem nenhum machucado, ileso", "sem cor, incolor", "que passa num instante"], "certa": 2, "explicacao": "c) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
