<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “<b>Por que</b> a gente sonha?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "por qual", "porém", "o motivo", "motivo para"], "certa": 0, "explicacao": "a) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>imergir</b>? Responda com a letra.", "alternativas": ["saudação", "comércio ilegal", "mergulhar", "vir à tona", "violação de regra"], "certa": 2, "explicacao": "c) mergulhar — não confunda com “emergir” (vir à tona)."}, {"enunciado": "Como se diz a fêmea do <b>polvo</b>? Responda com a letra.", "alternativas": ["a polvo", "o polvozinha", "o polvo fêmea", "a polvo fêmea", "a polva"], "certa": 2, "explicacao": "c) o polvo fêmea — polvo é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "ligado à vida simples e tranquila do campo", "que passa num instante", "que está em toda parte", "triste, melancólico"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a criança</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "comum de dois", "tem feminino diferente (biforme)", "epiceno", "sobrecomum"], "certa": 4, "explicacao": "e) sobrecomum — a criança serve para menino e menina, sem mudar nada."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["álbum", "herói", "tórax", "abacaxí", "hifens"], "certa": 3, "explicacao": "d) abacaxí — o certo é abacaxi: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o planeta", "a telefonema", "o champanhe", "a moto", "o clima"], "certa": 1, "explicacao": "b) a telefonema — o certo é “o telefonema”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Eba!</b> expressa? Responda com a letra.", "alternativas": ["decepção", "pedido de silêncio", "impaciência", "alegria", "chamado"], "certa": 3, "explicacao": "d) alegria"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["começar, provocar", "que acontece por acaso", "esperto, que percebe tudo rápido", "vencer, controlar (um incêndio, uma crise)", "que acontece fora de hora"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Leve o casaco, porque vai esfriar.", "Plantamos a semente, logo nasceu uma árvore.", "Felipe cantou e Bianca dançou.", "Eu te ajudo caso você peça.", "Ricardo é tímido, contudo adora cantar."], "certa": 0, "explicacao": "a) Leve o casaco, porque vai esfriar."}, {"enunciado": "Qual é o plural de <b>água-viva</b>? Responda com a letra.", "alternativas": ["águas-vivas", "águas-viva", "água-vivas", "água-viva", "água-vivaes"], "certa": 0, "explicacao": "a) águas-vivas"}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio pintou um quadro.", "Por que a vovó e o vovô pularam corda?", "Nossa, que frio!", "Os alunos e a diretora receberam visitas.", "Dance na quadrilha!"], "certa": 1, "explicacao": "b) Por que a vovó e o vovô pularam corda?"}, {"enunciado": "Que pronome de tratamento se usa para falar com <b>um amigo</b>? Responda com a letra.", "alternativas": ["Vossa Alteza", "Vossa Santidade", "Vossa Senhoria", "você", "Vossa Magnificência"], "certa": 3, "explicacao": "d) você"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["desejo, vontade", "esfriar, perder a força", "oportunidade, ocasião", "muito esquisito, absurdo", "arrependido"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["planta", "duende", "monstro", "grito", "bicicleta"], "certa": 3, "explicacao": "d) grito — só existe se alguém fizer ou sentir."}, {"enunciado": "Ontem eu ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["podi", "posso", "poderei", "podia", "pude"], "certa": 4, "explicacao": "e) pude"}, {"enunciado": "Ontem eu ___ (verbo <b>predizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["predizi", "predisse", "predizei", "prediz", "predizeru"], "certa": 1, "explicacao": "b) predisse — predizer segue dizer: eu disse → eu predisse."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["Comi meia pizza.", "Alice estava meio assustada.", "Comprei meio quilo de uva.", "A vovó ficou meia sonolenta.", "Bebi meia garrafa de água."], "certa": 3, "explicacao": "d) — o certo é “A vovó ficou meio sonolenta”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fidedigno</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "que acontece fora de hora", "resistente (ao calor, a mudanças)", "duvidoso, suspeito", "caro, que custa muito"], "certa": 0, "explicacao": "a) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Quem nasce no <b>Uruguai</b> é… Responda com a letra.", "alternativas": ["uruguaio", "espanhol", "mexicano", "egípcio", "pessoense"], "certa": 0, "explicacao": "a) uruguaio"}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós dançamos na festa junina.", "Nós ajudamos a vovó na cozinha.", "A gente assistimos ao jogo pela televisão.", "A gente escreve cartas para a vovó.", "A gente acorda cedo no domingo."], "certa": 2, "explicacao": "c) — o certo é “A gente assiste”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["itens", "tricô", "passageiro", "viúva", "sanduíche"], "certa": 1, "explicacao": "b) tricô — tri-cô: é oxítona."}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar nojo", "pedir silêncio", "chamar alguém", "mostrar alegria", "mostrar dor"], "certa": 2, "explicacao": "c) chamar alguém — o contexto decide o sentido."}, {"enunciado": "O que quer dizer <b>imparcial</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está pela metade", "onde é muito difícil viver", "que não faz mal, sem efeito", "que não toma partido, que é justo com todos os lados", "grosseiro, muito grave (um erro)"], "certa": 3, "explicacao": "d) que não toma partido, que é justo com todos os lados. Não é “que está pela metade”: essa é a pegadinha."}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "pressa", "admiração", "carinho", "tamanho"], "certa": 0, "explicacao": "a) desprezo"}, {"enunciado": "“Guarde os brinquedos, já que a visita vai chegar.”<br>Qual conjunção pode ficar no lugar de <b>já que</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["entretanto", "porém", "caso", "pois", "mas"], "certa": 3, "explicacao": "d) pois — as duas dão ideia de explicação."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>mostrar</b>? Responda com a letra.", "alternativas": ["último", "exibir", "noite", "baixo", "esconder"], "certa": 4, "explicacao": "e) esconder — cuidado: “exibir” é sinônimo, não antônimo."}, {"enunciado": "Como se lê <b>D. Pedro II</b>? Responda com a letra.", "alternativas": ["segundo", "dois", "primeiro", "2", "terceiro"], "certa": 0, "explicacao": "a) segundo — até o décimo, lê-se como ordinal."}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "que fala pouco, de poucas palavras", "oportunidade, ocasião", "sem cor, incolor", "esforço, vontade forte de fazer algo"], "certa": 0, "explicacao": "a) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
