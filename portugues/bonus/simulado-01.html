<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 1 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 1 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Mostramos o desenho.", "Faz muito calor no verão.", "A girafa do zoológico aprendeu uma música nova.", "O cachorro e o gato plantaram uma árvore.", "Falamos com a vovó."], "certa": 1, "explicacao": "b) Faz muito calor no verão."}, {"enunciado": "Na frase “Manuela riu <b>porque</b> o palhaço caiu.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "o motivo", "motivo para", "por qual", "pois"], "certa": 4, "explicacao": "e) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>sortir</b>? Responda com a letra.", "alternativas": ["abastecer", "denunciar", "antigo rei do Irã", "produzir efeito", "aluno"], "certa": 0, "explicacao": "a) abastecer — não confunda com “surtir” (produzir efeito)."}, {"enunciado": "Como se diz o macho da <b>baleia</b>? Responda com a letra.", "alternativas": ["o baleia macho", "o baleia", "a baleiazinho", "o baleio", "a baleia macho"], "certa": 4, "explicacao": "e) a baleia macho — baleia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "triste, melancólico", "ligado à vida simples e tranquila do campo", "que está em toda parte", "arrogância, ar de superioridade"], "certa": 2, "explicacao": "c) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a pessoa</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "epiceno", "comum de dois", "tem feminino diferente (biforme)", "não tem gênero"], "certa": 0, "explicacao": "a) sobrecomum — a pessoa serve para menino e menina, sem mudar nada."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["juíz", "tórax", "jiboia", "polens", "chapéu"], "certa": 0, "explicacao": "a) juíz — o certo é juiz: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a clã", "o tema", "o guaraná", "a dinamite", "a cal"], "certa": 0, "explicacao": "a) a clã — o certo é “o clã”."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Ui!</b> expressa? Responda com a letra.", "alternativas": ["alegria", "desejo", "advertência", "dor", "impaciência"], "certa": 3, "explicacao": "d) dor"}, {"enunciado": "O que quer dizer <b>debelar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não se apaga", "totalmente fechado; difícil de entender", "mentira, golpe para enganar", "começar, provocar", "vencer, controlar (um incêndio, uma crise)"], "certa": 4, "explicacao": "e) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["O time ganha caso treine bastante.", "Volte cedo, pois amanhã tem aula.", "Treinamos bastante, mas perdemos o jogo.", "Esqueci o guarda-chuva, portanto fiquei molhado.", "O cachorro latiu e o gato miou."], "certa": 2, "explicacao": "c) Treinamos bastante, mas perdemos o jogo."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["A girafa do zoológico bateu na porta.", "Receba visitas.", "Como está quente hoje!", "Minhas tias pescaram no lago.", "A turma do quinto ano escutou música?"], "certa": 4, "explicacao": "e) A turma do quinto ano escutou música?"}, {"enunciado": "O que quer dizer <b>ensejo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["desejo, vontade", "que não faz mal, sem efeito", "oportunidade, ocasião", "remédio para todos os males", "que dura muito, que não acaba"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Ontem ele ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trouxe", "trará", "traz", "trazeu", "trazia"], "certa": 0, "explicacao": "a) trouxe"}, {"enunciado": "Ontem eu ___ (verbo <b>contradizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["contradisse", "contradiz", "contradizeru", "contradizei", "contradizi"], "certa": 0, "explicacao": "a) contradisse — contradizer segue dizer: eu disse → eu contradisse."}, {"enunciado": "Em qual frase há um erro com <b>meio/meia</b>? Responda com a letra.", "alternativas": ["As portas estavam meio abertas.", "Clara estava meio nervosa.", "Bebi meia garrafa de água.", "Bianca ficou meia preocupada.", "Já é meio-dia e meia."], "certa": 3, "explicacao": "d) — o certo é “Bianca ficou meio preocupada”: meio (= um pouco) é advérbio e não varia."}, {"enunciado": "O que quer dizer <b>fortuito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "vencer, controlar (um incêndio, uma crise)", "incomum, surpreendente", "gratuito, de graça", "que acontece por acaso"], "certa": 4, "explicacao": "e) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Quem nasce no <b>Distrito Federal</b> é… Responda com a letra.", "alternativas": ["goiano", "cubano", "sul-mato-grossense", "brasiliense", "cearense"], "certa": 3, "explicacao": "d) brasiliense"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["sábado", "desdém", "agir", "sessão", "papel"], "certa": 0, "explicacao": "a) sábado — sá-ba-do: é proparoxítona."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "sem medo, destemido", "pálido, sem cor", "arrependido", "que fala ou escreve demais, enrolando"], "certa": 1, "explicacao": "b) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Que jornaleco sem notícia!”<br>Que sentido tem <b>jornaleco</b> nessa frase? Responda com a letra.", "alternativas": ["pressa", "tamanho", "carinho", "desprezo", "admiração"], "certa": 3, "explicacao": "d) desprezo"}, {"enunciado": "“A sopa estava quente, porém comi rapidinho.”<br>Qual conjunção pode ficar no lugar de <b>porém</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["pois", "contudo", "se", "portanto", "e"], "certa": 1, "explicacao": "b) contudo — as duas dão ideia de oposição."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>fácil</b>? Responda com a letra.", "alternativas": ["simples", "idoso", "molhado", "difícil", "agitado"], "certa": 3, "explicacao": "d) difícil — cuidado: “simples” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz efeito", "novato, iniciante", "tão bom que não dá para descrever com palavras", "que traz boas notícias", "estranho, fora do comum"], "certa": 2, "explicacao": "c) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "“— Eu estou com fome agora — contou Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca contou que estava com fome agora.", "Bianca contou que eu estou com fome agora.", "Bianca contou que eu estava com fome naquele momento.", "Bianca contou que estava com fome naquele momento.", "Bianca contou que está com fome agora."], "certa": 3, "explicacao": "d) Bianca contou que estava com fome naquele momento."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["en-fer-mei-ra", "fe-rro", "su-bma-ri-no", "moe-da", "fe-i-ra"], "certa": 0, "explicacao": "a) en-fer-mei-ra — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Qual é o plural de <b>botão</b>? Responda com a letra.", "alternativas": ["botãos", "botãoes", "botoes", "botões", "botães"], "certa": 3, "explicacao": "d) botões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles olharam as estrelas.", "No ano que vem, eles limparão o quarto.", "Amanhã, eles plantarão uma árvore.", "Amanhã, eles unirão as peças.", "Na semana passada, eles tocarão violão."], "certa": 4, "explicacao": "e) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["incomum, surpreendente", "onde é muito difícil viver", "lento para entender", "acolhedor, confortável", "preciso, feito com muito cuidado"], "certa": 1, "explicacao": "b) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Se eu ___ sair cedo, ficaria contente. (verbo poder)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["possa", "poder", "pude", "pudesse", "posso"], "certa": 3, "explicacao": "d) pudesse"}];
const CHAVE='simulado-bonus-1';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
