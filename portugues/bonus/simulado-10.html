<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“O irmão mais velho de Otávio cantou na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio", "Otávio", "na festa", "cantou na festa", "irmão"], "certa": 0, "explicacao": "a) O irmão mais velho de Otávio — cuidado: “irmão” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>torre</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, o som forte do r se escreve com rr", "rr aparece só no começo das palavras", "no começo da palavra, o r já tem som forte", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, um r só tem som forte"], "certa": 0, "explicacao": "a) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chova.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "ligado à vida simples e tranquila do campo", "triste, melancólico", "espantado, sem reação", "esforço, vontade forte de fazer algo"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["campainha", "cafezinho", "gatinho", "mesinha", "bolinha"], "certa": 0, "explicacao": "a) campainha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "A palavra <b>a mosca</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "comum de dois", "não tem gênero", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: a mosca macho / a mosca fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Entreguei o presente a ela.", "Fiz uma visita àquele museu.", "Vou à Bahia.", "Contei a novidade a amiga."], "certa": 4, "explicacao": "e) — o certo é “à amiga”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Daqui a dois dias, eles ___ de bicicleta. Qual forma completa a frase? Responda com a letra.", "alternativas": ["andavam", "andarão", "andaram", "andariam", "andam"], "certa": 1, "explicacao": "b) andarão — futuro: -ão."}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["mentira, golpe para enganar", "vencer, controlar (um incêndio, uma crise)", "isca, armadilha para enganar", "incomum, surpreendente", "começar, provocar"], "certa": 1, "explicacao": "b) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>bem-te-vi</b>? Responda com a letra.", "alternativas": ["bem-te-vis", "bem-te-vi", "bems-te-vi", "bem-te-vies", "bems-te-vis"], "certa": 0, "explicacao": "a) bem-te-vis"}, {"enunciado": "“O filme era longo, mas ninguém dormiu.”<br>Qual conjunção pode ficar no lugar de <b>mas</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["pois", "por isso", "e", "todavia", "porque"], "certa": 3, "explicacao": "d) todavia — as duas dão ideia de oposição."}, {"enunciado": "Qual é o diminutivo de <b>bandeira</b>? Responda com a letra.", "alternativas": ["livrinho", "bandeirola", "ovinho", "riacho", "copinho"], "certa": 1, "explicacao": "b) bandeirola"}, {"enunciado": "Por que a palavra <b>há</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em us leva acento", "paroxítona terminada em r leva acento", "paroxítona terminada em x leva acento", "paroxítona terminada em i ou is leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento"], "certa": 4, "explicacao": "e) monossílabo forte terminado em a, e ou o (com ou sem s) leva acento (há)."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "desejo, vontade", "que dura pouco tempo", "que dura muito, que não acaba", "oportunidade, ocasião"], "certa": 4, "explicacao": "e) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os lápis", "os fósseis", "os álbuns", "os cidadões", "os hifens"], "certa": 3, "explicacao": "d) os cidadões — o certo é os cidadãos."}, {"enunciado": "Quem nasce na <b>Índia</b> é… Responda com a letra.", "alternativas": ["macapaense", "roraimense", "palmense", "indiano", "italiano"], "certa": 3, "explicacao": "d) indiano"}, {"enunciado": "Qual é o coletivo de <b>peixes</b>? Responda com a letra.", "alternativas": ["cardume", "time", "enxame", "frota", "rebanho"], "certa": 0, "explicacao": "a) cardume — enxame é de outro grupo."}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Havia um bilhete na mesa.", "A girafa do zoológico mandou uma mensagem.", "Guardei os brinquedos.", "Os meninos da rua brincaram no parque.", "O cachorro e o gato abriram a janela."], "certa": 0, "explicacao": "a) Havia um bilhete na mesa."}, {"enunciado": "Leia: “Foi um encontro fortuito: nos esbarramos no mercado.” Nessa frase, <b>fortuito</b> quer dizer… Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "lento para entender", "confirmar, reforçar uma ideia", "gratuito, de graça", "que acontece por acaso"], "certa": 4, "explicacao": "e) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>japonesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["substantivos que vêm de adjetivos terminam em -eza", "femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem", "o final -esa sempre se escreve com z", "palavras que indicam país terminam em -eza"], "certa": 1, "explicacao": "b) femininos e palavras de origem terminam em -esa"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Na meteorologia, querem prever o tempo de amanhã.", "O juiz decidiu caçar o mandato do político.", "O corpo discente é formado pelos alunos.", "Esqueci o acento da palavra “avó”.", "Andei dois quilômetros: dei mais um passo."], "certa": 1, "explicacao": "b) — o certo é “cassar” (anular um direito)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Comemos muitos pastéis.", "Bebi muita água.", "Muitos alunos faltaram.", "Estudei muito ontem.", "Ele tem muitos amigos."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "O verbo <b>dispor</b> é de que conjugação? Responda com a letra.", "alternativas": ["1ª conjugação (-ar)", "2ª conjugação (-er)", "não tem conjugação", "4ª conjugação (-or)", "3ª conjugação (-ir)"], "certa": 1, "explicacao": "b) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "pálido, sem cor", "muito pequeno, escasso", "fora da época certa", "sem medo, destemido"], "certa": 4, "explicacao": "e) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Apareceram de repente as amigas de Lívia.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["as amigas de Lívia", "de", "o sujeito está escondido (oculto)", "não tem sujeito", "Apareceram"], "certa": 0, "explicacao": "a) as amigas de Lívia — o sujeito veio depois do verbo. Pergunte: quem apareceram?"}, {"enunciado": "Como se lê <b>papa João XXIII</b>? Responda com a letra.", "alternativas": ["vinte e três", "vigésimo terceiro", "vinte e dois", "23", "vinte e quatro"], "certa": 0, "explicacao": "a) vinte e três — depois do décimo, lê-se como cardinal."}, {"enunciado": "Na frase “O cientista descobriu <b>por que</b> os vulcões entram em erupção.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "o motivo", "por isso", "pelo qual / pela qual", "por qual motivo"], "certa": 4, "explicacao": "e) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizeram", "dirão", "diziam", "dizem", "disseram"], "certa": 4, "explicacao": "e) disseram"}, {"enunciado": "Leia: “Ver o mar pela primeira vez foi uma alegria inefável.” Nessa frase, <b>inefável</b> quer dizer… Responda com a letra.", "alternativas": ["confusão, situação enrolada", "mentira, golpe para enganar", "que não faz efeito", "tão bom que não dá para descrever com palavras", "que arma truques para enganar"], "certa": 3, "explicacao": "d) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
