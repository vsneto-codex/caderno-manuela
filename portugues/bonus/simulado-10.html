<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“A turma do quinto ano cantou na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["A turma do quinto ano", "ano", "na festa", "cantou na festa", "turma"], "certa": 0, "explicacao": "a) A turma do quinto ano — cuidado: “turma” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>ferro</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, um r só tem som forte", "rr aparece só no começo das palavras", "no começo da palavra, o r já tem som forte", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, o som forte do r se escreve com rr"], "certa": 4, "explicacao": "e) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "“— Eu estou com fome agora — explicou Felipe.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Felipe explicou que eu estou com fome agora.", "Felipe explicou que estava com fome agora.", "Felipe explicou que eu estava com fome naquele momento.", "Felipe explicou que estava com fome naquele momento.", "Felipe explicou que está com fome agora."], "certa": 3, "explicacao": "d) Felipe explicou que estava com fome naquele momento."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["Feche a janela, pois vai chover.", "A planta cresce se receber água.", "Bianca comprou pão e Felipe comprou leite.", "O pneu furou, logo chegamos atrasados.", "Choveu, porém fomos à praia."], "certa": 2, "explicacao": "c) Bianca comprou pão e Felipe comprou leite."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "triste, melancólico", "mínimo, o menor de todos", "ligado à vida simples e tranquila do campo", "muitas vezes, com frequência"], "certa": 3, "explicacao": "d) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o/a motorista</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "comum de dois", "não tem gênero", "tem feminino diferente (biforme)", "epiceno"], "certa": 1, "explicacao": "b) comum de dois — o motorista / a motorista: a palavra é igual, o artigo muda."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui ao clube e à piscina.", "Contei a novidade a prima.", "Falei a pessoas da fila.", "Vou à Bahia.", "Fui à praia a pé."], "certa": 1, "explicacao": "b) — o certo é “à prima”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Ontem, eles ___ a um filme. Qual forma completa a frase? Responda com a letra.", "alternativas": ["assistem", "assistiriam", "assistiram", "assistiam", "assistirão"], "certa": 2, "explicacao": "c) assistiram — passado: -am."}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["incomum, surpreendente", "vencer, controlar (um incêndio, uma crise)", "breve e direto", "preciso, feito com muito cuidado", "começar, provocar"], "certa": 1, "explicacao": "b) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "“Não corra no corredor, já que o chão está molhado.”<br>Qual conjunção pode ficar no lugar de <b>já que</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["todavia", "por isso", "porque", "contudo", "portanto"], "certa": 2, "explicacao": "c) porque — as duas dão ideia de explicação."}, {"enunciado": "Qual é o diminutivo de <b>chuva</b>? Responda com a letra.", "alternativas": ["menininha", "chuvisco", "festinha", "ilhota", "bandeirola"], "certa": 1, "explicacao": "b) chuvisco"}, {"enunciado": "Por que a palavra <b>tamanduá</b> tem acento? Responda com a letra.", "alternativas": ["oxítona (força na última sílaba) terminada em a leva acento", "oxítona terminada em e leva acento", "paroxítona terminada em i ou is leva acento", "paroxítona terminada em ei ou eis leva acento", "paroxítona terminada em ão ou ã leva acento"], "certa": 0, "explicacao": "a) oxítona (força na última sílaba) terminada em a leva acento (ta-man-du-á)."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "resistente (ao calor, a mudanças)", "oportunidade, ocasião", "que não faz mal, sem efeito", "desejo, vontade"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Rio Grande do Sul</b> é… Responda com a letra.", "alternativas": ["uruguaio", "australiano", "gaúcho", "inglês", "natalense"], "certa": 2, "explicacao": "c) gaúcho"}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Felipe jogou bola.", "Varremos o quintal.", "A girafa do zoológico sonhou com dragões.", "Há duas laranjas na fruteira.", "O cachorro e o gato pescaram no lago."], "certa": 1, "explicacao": "b) Varremos o quintal."}, {"enunciado": "Leia: “Foi um encontro fortuito: nos esbarramos no mercado.” Nessa frase, <b>fortuito</b> quer dizer… Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "que acontece por acaso", "gratuito, de graça", "que não se apaga", "que dura pouco tempo"], "certa": 1, "explicacao": "b) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>mesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "ss pode começar uma palavra", "depois de consoante, um s só já tem som de s", "no começo da palavra, o s tem som de s", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O prazo foi comprido à risca.", "A inflação deixou tudo mais caro no mercado.", "Esqueci o acento da palavra “avó”.", "A festa será na sexta-feira.", "Ele fez um cumprimento para a plateia."], "certa": 0, "explicacao": "a) — o certo é “cumprido” (realizado)."}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["sem medo, destemido", "mínimo, o menor de todos", "vencer, controlar (um incêndio, uma crise)", "firme e calmo diante do sofrimento", "pálido, sem cor"], "certa": 0, "explicacao": "a) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Chegaram cedo o cachorro e o gato.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o cachorro e o gato", "o sujeito está escondido (oculto)", "cedo", "Chegaram", "não tem sujeito"], "certa": 0, "explicacao": "a) o cachorro e o gato — o sujeito veio depois do verbo. Pergunte: quem chegaram?"}, {"enunciado": "Na frase “Sem um <b>porquê</b>, ninguém muda de ideia.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "pelo qual / pela qual", "o motivo", "porém", "por qual"], "certa": 2, "explicacao": "c) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Ontem eles ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dizem", "dirão", "diziam", "dizeram", "disseram"], "certa": 4, "explicacao": "e) disseram"}, {"enunciado": "Leia: “Ver o mar pela primeira vez foi uma alegria inefável.” Nessa frase, <b>inefável</b> quer dizer… Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "que não faz efeito", "tão bom que não dá para descrever com palavras", "esforço, vontade forte de fazer algo", "defesa, elogio de uma ideia"], "certa": 2, "explicacao": "c) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O vovô trouxe a receita para mim desenhar.", "Para mim, estudar à noite é melhor.", "Para mim, fazer isso é fácil.", "Isso é para eu ler.", "O bolo é para mim."], "certa": 0, "explicacao": "a) — o certo é “para eu desenhar”."}, {"enunciado": "Como se escreve <b>72º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo segundo", "octogésimo segundo", "septuagésimo segundo", "setentésimo segundo", "septuagésimo terceiro"], "certa": 2, "explicacao": "c) septuagésimo segundo"}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Parabéns!</b> expressa? Responda com a letra.", "alternativas": ["dor", "afastamento", "advertência", "aplauso", "ânimo"], "certa": 3, "explicacao": "d) aplauso"}, {"enunciado": "Leia: “O deserto é um lugar inóspito: quase não tem água.” Nessa frase, <b>inóspito</b> quer dizer… Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "muito pequeno, escasso", "onde é muito difícil viver", "acolhedor, confortável", "pouco, escasso"], "certa": 2, "explicacao": "c) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["hífen", "ideia", "pólen", "álbum", "raíz"], "certa": 4, "explicacao": "e) raíz — o certo é raiz: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Matheus levou três materiais régua, borracha e cola.", "Matheus levou três materiais: régua, borracha, e cola.", "Matheus levou três materiais: régua, borracha e cola.", "Matheus, levou três materiais: régua, borracha e cola.", "Matheus levou três materiais: régua borracha e cola."], "certa": 2, "explicacao": "c) Matheus levou três materiais: régua, borracha e cola. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Matheus e o verbo."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>lindo</b>? Responda com a letra.", "alternativas": ["agradabilíssimo", "lindílimo", "lindérrimo", "fidelíssimo", "lindíssimo"], "certa": 4, "explicacao": "e) lindíssimo"}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
