<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“Os alunos e a diretora cantaram na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Os alunos e a diretora", "diretora", "na festa", "cantaram na festa", "alunos, diretora"], "certa": 0, "explicacao": "a) Os alunos e a diretora — cuidado: “alunos, diretora” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>ferro</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, o som forte do r se escreve com rr", "rr aparece só no começo das palavras", "no começo da palavra, o r já tem som forte", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, um r só tem som forte"], "certa": 0, "explicacao": "a) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chova.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esquentar, ficar mais forte", "muito esquisito, absurdo", "esfriar, perder a força", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["livrinho", "moinho", "florzinha", "gatinho", "cafezinho"], "certa": 1, "explicacao": "b) moinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "A palavra <b>a andorinha</b> é… Responda com a letra.", "alternativas": ["comum de dois", "tem feminino diferente (biforme)", "epiceno", "não tem gênero", "sobrecomum"], "certa": 2, "explicacao": "c) epiceno — animal: a andorinha macho / a andorinha fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Às vezes, durmo à tarde.", "Fiz uma visita àquele museu.", "Bianca foi a festa.", "Começou a chover à noite."], "certa": 3, "explicacao": "d) — o certo é “à festa”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Ontem, eles ___ para casa. Qual forma completa a frase? Responda com a letra.", "alternativas": ["voltavam", "voltaram", "voltarão", "voltariam", "voltam"], "certa": 1, "explicacao": "b) voltaram — passado: -am."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "arrependido", "que passa num instante", "que está em toda parte", "do contra, teimoso"], "certa": 1, "explicacao": "b) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>obra-prima</b>? Responda com a letra.", "alternativas": ["obras-prima", "obra-primas", "obras-primas", "obra-primaes", "obra-prima"], "certa": 2, "explicacao": "c) obras-primas"}, {"enunciado": "“Ele treinou todo dia, logo ganhou a corrida.”<br>Qual conjunção pode ficar no lugar de <b>logo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["mas", "se", "portanto", "caso", "porque"], "certa": 2, "explicacao": "c) portanto — as duas dão ideia de conclusão."}, {"enunciado": "Qual é o aumentativo de <b>caixa</b>? Responda com a letra.", "alternativas": ["mulherão", "papelão", "mesão", "caixote", "gatão"], "certa": 3, "explicacao": "d) caixote"}, {"enunciado": "Por que a palavra <b>egoísta</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em l leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "paroxítona terminada em ps leva acento", "oxítona terminada em em ou ens leva acento"], "certa": 1, "explicacao": "b) i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento (e-go-ís-ta)."}, {"enunciado": "Leia: “O “remédio milagroso” era um embuste.” Nessa frase, <b>embuste</b> quer dizer… Responda com a letra.", "alternativas": ["que acontece fora de hora", "mínimo, o menor de todos", "empurrão", "esfriar, perder a força", "mentira, golpe para enganar"], "certa": 4, "explicacao": "e) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os mamões", "os pastéis", "os arco-íris", "os guarda-chuvas", "os pãos"], "certa": 4, "explicacao": "e) os pãos — o certo é os pães."}, {"enunciado": "Quem nasce em <b>Angola</b> é… Responda com a letra.", "alternativas": ["campo-grandense", "angolano", "recifense", "russo", "alemão"], "certa": 1, "explicacao": "b) angolano"}, {"enunciado": "Qual é o coletivo de <b>elefantes</b>? Responda com a letra.", "alternativas": ["vara", "alcateia", "cabeleira", "rebanho", "manada"], "certa": 4, "explicacao": "e) manada — rebanho é de outro grupo."}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Mandei uma mensagem.", "Ricardo e a irmã bateram na porta.", "A vovó e o vovô olharam as estrelas.", "Nevou no sul.", "Meu avô falou com a vovó."], "certa": 0, "explicacao": "a) Mandei uma mensagem."}, {"enunciado": "Leia: “Manuela foi estoica: tomou a vacina sem dar um pio.” Nessa frase, <b>estoica</b> quer dizer… Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "firme e calmo diante do sofrimento", "lento para entender", "chorão, que reclama de tudo", "que dura pouco tempo"], "certa": 1, "explicacao": "b) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>mesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["depois de consoante, um s só já tem som de s", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ao dormir, é preciso cerrar os olhos.", "Com 18 anos, ele já é ilegível para vereador.", "O preso dormia na cela.", "O cozinheiro despejou a calda de chocolate no sorvete.", "Depois do almoço, o vovô tira uma sesta."], "certa": 1, "explicacao": "b) — o certo é “elegível” (que pode ser eleito)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["As meninas estavam muito felizes.", "Felipe dormiu muito.", "As flores eram muito cheirosas.", "Estudei muito ontem.", "Comemos muitos pastéis."], "certa": 4, "explicacao": "e) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "O verbo <b>dispor</b> é de que conjugação? Responda com a letra.", "alternativas": ["2ª conjugação (-er)", "3ª conjugação (-ir)", "4ª conjugação (-or)", "não tem conjugação", "1ª conjugação (-ar)"], "certa": 0, "explicacao": "a) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Leia: “A estrela cadente deixou um brilho fugaz no céu.” Nessa frase, <b>fugaz</b> quer dizer… Responda com a letra.", "alternativas": ["muitas vezes, com frequência", "que passa num instante", "que brilha muito forte", "o público que assiste a um espetáculo", "que acontece fora de hora"], "certa": 1, "explicacao": "b) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "“Saiu correndo a turma do quinto ano.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "não tem sujeito", "Saiu", "correndo", "a turma do quinto ano"], "certa": 4, "explicacao": "e) a turma do quinto ano — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Como se lê <b>século XX</b>? Responda com a letra.", "alternativas": ["dezenove", "vigésimo", "vinte e um", "vinte", "20"], "certa": 3, "explicacao": "d) vinte — depois do décimo, lê-se como cardinal."}, {"enunciado": "Na frase “O cachorro latiu <b>porque</b> ouviu a campainha.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual", "pois", "porém", "pelo qual / pela qual", "motivo para"], "certa": 1, "explicacao": "b) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["teram", "tinham", "terão", "têm", "tiveram"], "certa": 4, "explicacao": "e) tiveram"}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["breve e direto", "pálido, sem cor", "resistente (ao calor, a mudanças)", "sem medo, destemido", "generoso, de coração grande"], "certa": 3, "explicacao": "d) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
