<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“O dono da padaria cantou na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["O dono da padaria", "padaria", "na festa", "cantou na festa", "dono"], "certa": 0, "explicacao": "a) O dono da padaria — cuidado: “dono” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>lâmpada</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["antes de p e b se usa m", "no fim da palavra se usa n", "antes de qualquer consoante se usa n", "antes de t e d se usa n", "depois de vogal com acento se usa m"], "certa": 0, "explicacao": "a) antes de p e b se usa m"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chover.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "ligado à vida simples e tranquila do campo", "triste, melancólico", "espantado, sem reação", "esforço, vontade forte de fazer algo"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o/a motorista</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "comum de dois", "não tem gênero", "tem feminino diferente (biforme)", "epiceno"], "certa": 1, "explicacao": "b) comum de dois — o motorista / a motorista: a palavra é igual, o artigo muda."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui ao clube e à piscina.", "Contei a novidade a tia.", "Falei a pessoas da fila.", "Vou à Bahia.", "Fui à praia a pé."], "certa": 1, "explicacao": "b) — o certo é “à tia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Ontem, eles ___ cedo. Qual forma completa a frase? Responda com a letra.", "alternativas": ["acordam", "acordariam", "acordaram", "acordavam", "acordarão"], "certa": 2, "explicacao": "c) acordaram — passado: -am."}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["incomum, surpreendente", "vencer, controlar (um incêndio, uma crise)", "breve e direto", "preciso, feito com muito cuidado", "começar, provocar"], "certa": 1, "explicacao": "b) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "“Volte cedo, pois amanhã tem aula.”<br>Qual conjunção pode ficar no lugar de <b>pois</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["todavia", "por isso", "porque", "contudo", "portanto"], "certa": 2, "explicacao": "c) porque — as duas dão ideia de explicação."}, {"enunciado": "Qual é o diminutivo de <b>chuva</b>? Responda com a letra.", "alternativas": ["menininha", "chuvisco", "festinha", "ilhota", "bandeirola"], "certa": 1, "explicacao": "b) chuvisco"}, {"enunciado": "Por que a palavra <b>tamanduá</b> tem acento? Responda com a letra.", "alternativas": ["oxítona (força na última sílaba) terminada em a leva acento", "oxítona terminada em e leva acento", "paroxítona terminada em i ou is leva acento", "paroxítona terminada em ei ou eis leva acento", "paroxítona terminada em ão ou ã leva acento"], "certa": 0, "explicacao": "a) oxítona (força na última sílaba) terminada em a leva acento (ta-man-du-á)."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "resistente (ao calor, a mudanças)", "oportunidade, ocasião", "que não faz mal, sem efeito", "desejo, vontade"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Escócia</b> é… Responda com a letra.", "alternativas": ["espanhol", "campo-grandense", "escocês", "soteropolitano", "pernambucano"], "certa": 2, "explicacao": "c) escocês"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Respondemos às perguntas.", "O cachorro e o gato pularam corda.", "Escureceu de repente.", "Felipe guardou os brinquedos.", "As crianças da escola andaram de bicicleta."], "certa": 1, "explicacao": "b) O cachorro e o gato pularam corda."}, {"enunciado": "Leia: “Foi um encontro fortuito: nos esbarramos no mercado.” Nessa frase, <b>fortuito</b> quer dizer… Responda com a letra.", "alternativas": ["que acontece por acaso", "que dura muito, que não acaba", "gratuito, de graça", "totalmente fechado; difícil de entender", "resistente (ao calor, a mudanças)"], "certa": 0, "explicacao": "a) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>francesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["palavras que indicam país terminam em -eza", "femininos e palavras de origem terminam em -esa", "substantivos que vêm de adjetivos terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "o final -esa sempre se escreve com z"], "certa": 1, "explicacao": "b) femininos e palavras de origem terminam em -esa"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Com 18 anos, ele já é ilegível para vereador.", "O médico deu dispensa da aula para o menino doente.", "É perigoso acender fogo dentro de casa.", "A orquestra fez um lindo concerto no teatro.", "A polícia combate o tráfico de animais silvestres."], "certa": 0, "explicacao": "a) — o certo é “elegível” (que pode ser eleito)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Eles riram muito.", "A sopa estava muito quente.", "O cachorro late muito.", "Comprei muitos livros.", "Felipe dormiu muito."], "certa": 3, "explicacao": "d) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["sem medo, destemido", "esforço, vontade forte de fazer algo", "vencer, controlar (um incêndio, uma crise)", "aliviar, diminuir (uma dor, um problema)", "pálido, sem cor"], "certa": 0, "explicacao": "a) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Saiu correndo meu avô.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["meu avô", "correndo", "não tem sujeito", "Saiu", "o sujeito está escondido (oculto)"], "certa": 0, "explicacao": "a) meu avô — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Na frase “Você não comeu <b>porque</b> estava sem fome?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "porém", "motivo para", "pois", "pelo qual / pela qual"], "certa": 3, "explicacao": "d) pois — a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["têm", "tinham", "tiveram", "teram", "terão"], "certa": 2, "explicacao": "c) tiveram"}, {"enunciado": "Leia: “Ver o mar pela primeira vez foi uma alegria inefável.” Nessa frase, <b>inefável</b> quer dizer… Responda com a letra.", "alternativas": ["breve e direto", "tão bom que não dá para descrever com palavras", "intenso, enérgico", "nunca visto antes, extraordinário", "que não faz efeito"], "certa": 1, "explicacao": "b) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Situação: O bebê está dormindo e alguém fala alto.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Oxalá!", "Graças a Deus!", "Silêncio!", "Eba!", "Tomara!"], "certa": 2, "explicacao": "c) Silêncio! — pedido de silêncio."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela trouxe o livro para eu.", "Para mim, estudar à noite é melhor.", "Isso é para eu ler.", "O bolo é para mim.", "Ela deu o recado para eu levar."], "certa": 0, "explicacao": "a) — o certo é “para mim”."}, {"enunciado": "Como se escreve <b>61º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo segundo", "sexagésimo primeiro", "quinquagésimo primeiro", "sessentésimo primeiro", "septuagésimo primeiro"], "certa": 1, "explicacao": "b) sexagésimo primeiro"}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Silêncio!</b> expressa? Responda com a letra.", "alternativas": ["pedido de silêncio", "pena", "impaciência", "medo", "nojo"], "certa": 0, "explicacao": "a) pedido de silêncio"}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["onde é muito difícil viver", "preciso, feito com muito cuidado", "esforço, vontade forte de fazer algo", "ligado à vida simples e tranquila do campo", "acolhedor, confortável"], "certa": 0, "explicacao": "a) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["rainha", "tatú", "voo", "saúde", "itens"], "certa": 1, "explicacao": "b) tatú — o certo é tatu: oxítona terminada em i ou u não leva acento (caju, saci)."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
