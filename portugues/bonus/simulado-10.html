<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“O irmão mais velho de Otávio cantou na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["O irmão mais velho de Otávio", "Otávio", "na festa", "cantou na festa", "irmão"], "certa": 0, "explicacao": "a) O irmão mais velho de Otávio — cuidado: “irmão” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>lâmpada</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["antes de p e b se usa m", "no fim da palavra se usa n", "antes de qualquer consoante se usa n", "antes de t e d se usa n", "depois de vogal com acento se usa m"], "certa": 0, "explicacao": "a) antes de p e b se usa m"}, {"enunciado": "“— Eu vou plantar uma árvore amanhã — disse Bianca.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Bianca disse que ia plantar uma árvore amanhã.", "Bianca disse que eu ia plantar uma árvore no dia seguinte.", "Bianca disse que vai plantar uma árvore amanhã.", "Bianca disse que ia plantar uma árvore no dia seguinte.", "Bianca disse que eu vou plantar uma árvore amanhã."], "certa": 3, "explicacao": "d) Bianca disse que ia plantar uma árvore no dia seguinte."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A festa será no quintal caso não chova.", "Feche a janela, porque vai chover.", "Estudei muito, portanto tirei dez.", "O cachorro latiu e o gato miou.", "Corri muito, contudo perdi o ônibus."], "certa": 4, "explicacao": "e) Corri muito, contudo perdi o ônibus."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esquentar, ficar mais forte", "muito esquisito, absurdo", "esfriar, perder a força", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["livrinho", "rainha", "florzinha", "gatinho", "cafezinho"], "certa": 1, "explicacao": "b) rainha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "A palavra <b>a foca</b> é… Responda com a letra.", "alternativas": ["comum de dois", "tem feminino diferente (biforme)", "epiceno", "não tem gênero", "sobrecomum"], "certa": 2, "explicacao": "c) epiceno — animal: a foca macho / a foca fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Às vezes, durmo à tarde.", "Fiz uma visita àquele museu.", "Bianca foi a sorveteria.", "Começou a chover à noite."], "certa": 3, "explicacao": "d) — o certo é “à sorveteria”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Daqui a dois dias, eles ___ suco. Qual forma completa a frase? Responda com a letra.", "alternativas": ["bebiam", "beberão", "beberam", "beberiam", "bebem"], "certa": 1, "explicacao": "b) beberão — futuro: -ão."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "arrependido", "que passa num instante", "que está em toda parte", "do contra, teimoso"], "certa": 1, "explicacao": "b) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>segunda-feira</b>? Responda com a letra.", "alternativas": ["segundas-feiras", "segunda-feira", "segundas-feira", "segunda-feiraes", "segunda-feiras"], "certa": 0, "explicacao": "a) segundas-feiras"}, {"enunciado": "“O filme era longo, mas ninguém dormiu.”<br>Qual conjunção pode ficar no lugar de <b>mas</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["pois", "por isso", "e", "todavia", "porque"], "certa": 3, "explicacao": "d) todavia — as duas dão ideia de oposição."}, {"enunciado": "Qual é o diminutivo de <b>burro</b>? Responda com a letra.", "alternativas": ["livrinho", "burrico", "ovinho", "riacho", "copinho"], "certa": 1, "explicacao": "b) burrico"}, {"enunciado": "Por que a palavra <b>pontapé</b> tem acento? Responda com a letra.", "alternativas": ["monossílabo forte terminado em a, e ou o (com ou sem s) leva acento", "oxítona terminada em e leva acento", "paroxítona terminada em n leva acento", "oxítona terminada em o leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento"], "certa": 1, "explicacao": "b) oxítona terminada em e leva acento (pon-ta-pé)."}, {"enunciado": "Leia: “O “remédio milagroso” era um embuste.” Nessa frase, <b>embuste</b> quer dizer… Responda com a letra.", "alternativas": ["empurrão", "mentira, golpe para enganar", "mínimo, o menor de todos", "ligado à vida simples e tranquila do campo", "firme e calmo diante do sofrimento"], "certa": 1, "explicacao": "b) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os hifens", "os pires", "os arco-íris", "os fósseis", "os cidadões"], "certa": 4, "explicacao": "e) os cidadões — o certo é os cidadãos."}, {"enunciado": "Quem nasce na <b>Bahia</b> é… Responda com a letra.", "alternativas": ["florianopolitano", "belo-horizontino", "mineiro", "baiano", "piauiense"], "certa": 3, "explicacao": "d) baiano"}, {"enunciado": "Qual é o coletivo de <b>uvas</b>? Responda com a letra.", "alternativas": ["cacho", "atlas", "buquê", "penca", "ramo"], "certa": 0, "explicacao": "a) cacho — penca é de outro grupo."}, {"enunciado": "Em qual frase o sujeito é <b>simples</b>? Responda com a letra.", "alternativas": ["Nadamos na piscina.", "A turma do quinto ano acordou cedo.", "Manuela e Bianca pescaram no lago.", "Há duas laranjas na fruteira.", "Faz frio no inverno."], "certa": 1, "explicacao": "b) A turma do quinto ano acordou cedo."}, {"enunciado": "Leia: “Manuela foi estoica: tomou a vacina sem dar um pio.” Nessa frase, <b>estoica</b> quer dizer… Responda com a letra.", "alternativas": ["arrependido", "mentira, golpe para enganar", "espantado, sem reação", "chorão, que reclama de tudo", "firme e calmo diante do sofrimento"], "certa": 4, "explicacao": "e) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>cidade</b> se escreve com <b>c</b>? Responda com a letra.", "alternativas": ["ç só se usa antes de a, o e u", "antes de a, o e u, o c tem som de k", "antes de e e i se usa ç", "antes de e e i, o c já tem som de s", "ç pode aparecer no começo da palavra"], "certa": 3, "explicacao": "d) antes de e e i, o c já tem som de s"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O rei morava no passo real.", "A sessão de cinema começa às oito.", "Paguei a conta com um cheque.", "Ele tem um ótimo senso de humor.", "A chuva era iminente: o céu escureceu."], "certa": 0, "explicacao": "a) — o certo é “paço” (palácio)."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitos peixes nadavam no lago.", "Eles riram muito.", "Ela leu muitos livros.", "Vi muitos pássaros.", "Ele tem muitos amigos."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Leia: “A estrela cadente deixou um brilho fugaz no céu.” Nessa frase, <b>fugaz</b> quer dizer… Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "que brilha muito forte", "descuidado, que cai fácil em armadilhas", "que passa num instante", "muito esquisito, absurdo"], "certa": 3, "explicacao": "d) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "“Saíram correndo Ricardo e a irmã.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Saíram", "Ricardo e a irmã", "o sujeito está escondido (oculto)", "não tem sujeito", "correndo"], "certa": 1, "explicacao": "b) Ricardo e a irmã — o sujeito veio depois do verbo. Pergunte: quem saíram?"}, {"enunciado": "Como se lê <b>Henrique VIII</b>? Responda com a letra.", "alternativas": ["oitavo", "nono", "8", "oito", "sétimo"], "certa": 0, "explicacao": "a) oitavo — até o décimo, lê-se como ordinal."}, {"enunciado": "Na frase “Ela perguntou <b>por que</b> o céu é azul.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "pelo qual / pela qual", "motivo para", "por qual", "o motivo"], "certa": 0, "explicacao": "a) por qual motivo — é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "Ontem ele ___ (verbo <b>estar</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["estava", "estará", "esteve", "esteu", "está"], "certa": 2, "explicacao": "c) esteve"}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["pálido, sem cor", "nunca visto antes, extraordinário", "sem medo, destemido", "intenso, enérgico", "pouco, escasso"], "certa": 2, "explicacao": "c) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Mostre o desenho para mim ver.", "Sem mim, a festa não teria graça.", "Ela deu o recado para eu levar.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem."], "certa": 0, "explicacao": "a) — o certo é “para eu ver”."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
