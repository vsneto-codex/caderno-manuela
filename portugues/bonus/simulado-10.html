<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["hífen", "rainha", "estóico", "chapéu", "leem"], "certa": 2, "explicacao": "c) estóico — o certo é estoico: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Na semana passada, eles ___ pizza. Qual forma completa a frase? Responda com a letra.", "alternativas": ["comerão", "comeram", "comiam", "comem", "comeriam"], "certa": 1, "explicacao": "b) comeram — passado: -am."}, {"enunciado": "Ontem eu ___ (verbo <b>deter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["detei", "deteu", "deti", "deteru", "detive"], "certa": 4, "explicacao": "e) detive — deter segue ter: eu tive → eu detive."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["triste, melancólico", "ligado à vida simples e tranquila do campo", "defesa, elogio de uma ideia", "caro, que custa muito", "rigoroso e sem luxo"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>tríceps</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em ps leva acento", "oxítona terminada em em ou ens leva acento", "oxítona (força na última sílaba) terminada em a leva acento", "oxítona terminada em e leva acento", "monossílabo forte terminado em a, e ou o (com ou sem s) leva acento"], "certa": 0, "explicacao": "a) paroxítona terminada em ps leva acento (trí-ceps)."}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "mentira, golpe para enganar", "grosseiro, muito grave (um erro)", "aliviar, diminuir (uma dor, um problema)", "começar, provocar"], "certa": 0, "explicacao": "a) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a zebra</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "sobrecomum", "comum de dois", "tem feminino diferente (biforme)", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: a zebra macho / a zebra fêmea."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["oportunidade, ocasião", "que passa num instante", "que está em toda parte", "desejo, vontade", "resistente (ao calor, a mudanças)"], "certa": 0, "explicacao": "a) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["sussesso", "franceza", "canponesa", "defesa", "essesso"], "certa": 3, "explicacao": "d) defesa — s entre vogais com som de z, de cor."}, {"enunciado": "Na frase “— Por que você correu? — <b>Porque</b> estava atrasado.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "por qual", "o motivo", "pois", "por qual motivo"], "certa": 3, "explicacao": "d) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Leia: “Foi um encontro fortuito: nos esbarramos no mercado.” Nessa frase, <b>fortuito</b> quer dizer… Responda com a letra.", "alternativas": ["gratuito, de graça", "que acontece por acaso", "que fala pouco, de poucas palavras", "caro, que custa muito", "mínimo, o menor de todos"], "certa": 1, "explicacao": "b) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Florianópolis</b> é… Responda com a letra.", "alternativas": ["florianopolitano", "campo-grandense", "alagoano", "maranhense", "boliviano"], "certa": 0, "explicacao": "a) florianopolitano"}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["coxilo", "chapéu", "pagé", "jesto", "xuchu"], "certa": 1, "explicacao": "b) chapéu — com ch e u no fim (chapeuzinho)."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["frequente", "requeijão", "mosquito", "quintal", "foguinho"], "certa": 0, "explicacao": "a) frequente — em “frequente” a gente fala o u"}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["que acontece fora de hora", "pálido, sem cor", "sem medo, destemido", "urgente", "digno de confiança, verdadeiro"], "certa": 2, "explicacao": "c) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["verde", "viajar", "jiló", "feijão", "encontrar"], "certa": 0, "explicacao": "a) verde — ver-de: é paroxítona."}, {"enunciado": "Por que a palavra <b>camisa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z", "depois de consoante, um s só já tem som de s", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s"], "certa": 1, "explicacao": "b) entre vogais, o s tem som de z"}, {"enunciado": "Leia: “Ver o mar pela primeira vez foi uma alegria inefável.” Nessa frase, <b>inefável</b> quer dizer… Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "tão bom que não dá para descrever com palavras", "que passa num instante", "esperto, que percebe tudo rápido", "que não faz efeito"], "certa": 1, "explicacao": "b) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a derme", "o guaraná", "a cal", "a foto", "a diadema"], "certa": 4, "explicacao": "e) a diadema — o certo é “o diadema”."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles comeram pizza.", "Na semana passada, eles pintaram um quadro.", "Ontem, eles guardaram os brinquedos.", "Ontem, eles falaram com a vovó.", "Hoje de manhã, eles partiram cedo."], "certa": 0, "explicacao": "a) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Leia: “O deserto é um lugar inóspito: quase não tem água.” Nessa frase, <b>inóspito</b> quer dizer… Responda com a letra.", "alternativas": ["espantado, sem reação", "vencer, controlar (um incêndio, uma crise)", "acolhedor, confortável", "onde é muito difícil viver", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 3, "explicacao": "d) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>42º</b> por extenso? Responda com a letra.", "alternativas": ["quadragésimo segundo", "quinquagésimo segundo", "quarentésimo segundo", "trigésimo segundo", "quadragésimo terceiro"], "certa": 0, "explicacao": "a) quadragésimo segundo"}, {"enunciado": "De que duas palavras se forma <b>àquela</b>? Responda com a letra.", "alternativas": ["a + aquela", "àq + aquela", "a + aquelas", "de + aquela", "a + aquilo"], "certa": 0, "explicacao": "a) a + aquela"}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["baixo", "jeito", "enfermeira", "faixa", "sorveteria"], "certa": 4, "explicacao": "e) sorveteria — sor-ve-te-ri-a"}, {"enunciado": "Leia: “Não seja obtuso: a resposta está bem na sua frente.” Nessa frase, <b>obtuso</b> quer dizer… Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "esperto, que entende rápido", "descuidado, que cai fácil em armadilhas", "lento para entender", "espantado, sem reação"], "certa": 3, "explicacao": "d) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["de-i-xar", "cac-to", "a-le-gri-a", "pei-xe", "pas-se-ar"], "certa": 0, "explicacao": "a) de-i-xar — o certo é dei-xar: no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou a chover à noite.", "Chegamos às oito horas.", "Fui a floresta.", "Fui à praia a pé.", "Entreguei o presente a ela."], "certa": 2, "explicacao": "c) — o certo é “à floresta”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Tomara que nós ___ à festa. (verbo vir)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["vimos", "venhamos", "viemos", "vir", "viéssemos"], "certa": 1, "explicacao": "b) venhamos"}, {"enunciado": "Leia: “O colega pernóstico disse “ósculo” em vez de “beijo” só para impressionar.” Nessa frase, <b>pernóstico</b> quer dizer… Responda com a letra.", "alternativas": ["que dura pouco tempo", "urgente", "exibido, que usa palavras difíceis só para se mostrar", "que tem as pernas compridas", "inconveniente; fora do assunto"], "certa": 2, "explicacao": "c) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["polens", "hífen", "raíz", "feiura", "rainha"], "certa": 2, "explicacao": "c) raíz — o certo é raiz: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
