<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 10 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 10 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“A vovó e o vovô cantaram na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["A vovó e o vovô", "vovô", "na festa", "cantaram na festa", "vovó, vovô"], "certa": 0, "explicacao": "a) A vovó e o vovô — cuidado: “vovó, vovô” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Por que a palavra <b>ferro</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, um r só tem som forte", "rr aparece só no começo das palavras", "no começo da palavra, o r já tem som forte", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, o som forte do r se escreve com rr"], "certa": 4, "explicacao": "e) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "“— Eu estou com fome agora — explicou Felipe.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Felipe explicou que eu estou com fome agora.", "Felipe explicou que estava com fome agora.", "Felipe explicou que eu estava com fome naquele momento.", "Felipe explicou que estava com fome naquele momento.", "Felipe explicou que está com fome agora."], "certa": 3, "explicacao": "d) Felipe explicou que estava com fome naquele momento."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["Feche a janela, pois vai chover.", "A planta cresce se receber água.", "Bianca comprou pão e Felipe comprou leite.", "O pneu furou, logo chegamos atrasados.", "Choveu, porém fomos à praia."], "certa": 2, "explicacao": "c) Bianca comprou pão e Felipe comprou leite."}, {"enunciado": "O que quer dizer <b>bucólico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "triste, melancólico", "mínimo, o menor de todos", "ligado à vida simples e tranquila do campo", "muitas vezes, com frequência"], "certa": 3, "explicacao": "d) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o polvo</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "comum de dois", "tem feminino diferente (biforme)", "sobrecomum", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: o polvo macho / o polvo fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Fui ao clube e à piscina.", "Contei a novidade a treinadora.", "Fui à praia a pé.", "Começou a chover à noite."], "certa": 2, "explicacao": "c) — o certo é “à treinadora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Hoje de manhã, eles ___ bola. Qual forma completa a frase? Responda com a letra.", "alternativas": ["jogariam", "jogam", "jogavam", "jogarão", "jogaram"], "certa": 4, "explicacao": "e) jogaram — passado: -am."}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["começar, provocar", "vencer, controlar (um incêndio, uma crise)", "arrependido", "digno de confiança, verdadeiro", "confirmar, reforçar uma ideia"], "certa": 1, "explicacao": "b) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "“Bianca leu o livro inteiro, portanto sabe a história de cor.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["se", "mas", "já que", "logo", "caso"], "certa": 3, "explicacao": "d) logo — as duas dão ideia de conclusão."}, {"enunciado": "Qual é o diminutivo de <b>gota</b>? Responda com a letra.", "alternativas": ["cachorrinho", "maleta", "gotícula", "gatinho", "cãozinho"], "certa": 2, "explicacao": "c) gotícula"}, {"enunciado": "Por que a palavra <b>conteúdo</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em r leva acento", "paroxítona terminada em n leva acento", "oxítona terminada em em ou ens leva acento", "paroxítona terminada em l leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento"], "certa": 4, "explicacao": "e) i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento (con-te-ú-do)."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["caro, que custa muito", "nunca visto antes, extraordinário", "oportunidade, ocasião", "desejo, vontade", "esfriar, perder a força"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "Quem nasce no <b>Amapá</b> é… Responda com a letra.", "alternativas": ["paranaense", "português", "amapaense", "maranhense", "soteropolitano"], "certa": 2, "explicacao": "c) amapaense"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Os meninos da rua resistiram ao doce.", "A professora de música nadou na piscina.", "Chuviscou no fim da tarde.", "Pesquei no lago.", "Os alunos e a diretora guardaram os brinquedos."], "certa": 4, "explicacao": "e) Os alunos e a diretora guardaram os brinquedos."}, {"enunciado": "Leia: “Foi um encontro fortuito: nos esbarramos no mercado.” Nessa frase, <b>fortuito</b> quer dizer… Responda com a letra.", "alternativas": ["gratuito, de graça", "que arma truques para enganar", "incomum, surpreendente", "novato, iniciante", "que acontece por acaso"], "certa": 4, "explicacao": "e) que acontece por acaso. Não é “gratuito, de graça”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Depois do almoço, o vovô tira uma sesta.", "O ladrão foi pego em flagrante.", "O calor faz o metal delatar.", "O rei da Pérsia era chamado de xá.", "O cavaleiro montou o cavalo e partiu."], "certa": 2, "explicacao": "c) — o certo é “dilatar” (aumentar)."}, {"enunciado": "Leia: “Impávido, o goleiro encarou o pênalti.” Nessa frase, <b>Impávido</b> quer dizer… Responda com a letra.", "alternativas": ["que traz boas notícias", "descuidado, que cai fácil em armadilhas", "pálido, sem cor", "sem medo, destemido", "arrependido"], "certa": 3, "explicacao": "d) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "“Chegaram cedo os primos de Ricardo.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "cedo", "não tem sujeito", "Chegaram", "os primos de Ricardo"], "certa": 4, "explicacao": "e) os primos de Ricardo — o sujeito veio depois do verbo. Pergunte: quem chegaram?"}, {"enunciado": "Na frase “Felipe ficou feliz <b>porque</b> ganhou a corrida.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["motivo para", "por qual", "pois", "por isso", "o motivo"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Ontem eu ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["queri", "quis", "quero", "quererei", "queria"], "certa": 1, "explicacao": "b) quis"}, {"enunciado": "Leia: “Ver o mar pela primeira vez foi uma alegria inefável.” Nessa frase, <b>inefável</b> quer dizer… Responda com a letra.", "alternativas": ["onde é muito difícil viver", "que não faz efeito", "nunca visto antes, extraordinário", "tão bom que não dá para descrever com palavras", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela trouxe o livro para mim ler.", "Sem mim, a festa não teria graça.", "Isso é para eu ler.", "Entre mim e você, tudo bem.", "Para mim, fazer isso é fácil."], "certa": 0, "explicacao": "a) — o certo é “para eu ler”."}, {"enunciado": "Como se escreve <b>25º</b> por extenso? Responda com a letra.", "alternativas": ["vigésimo sexto", "vigésimo quinto", "décimo quinto", "trigésimo quinto", "vintésimo quinto"], "certa": 1, "explicacao": "b) vigésimo quinto"}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Tomara!</b> expressa? Responda com a letra.", "alternativas": ["nojo", "alívio", "decepção", "chamado", "desejo"], "certa": 4, "explicacao": "e) desejo"}, {"enunciado": "Leia: “O deserto é um lugar inóspito: quase não tem água.” Nessa frase, <b>inóspito</b> quer dizer… Responda com a letra.", "alternativas": ["esfriar, perder a força", "espantado, sem reação", "onde é muito difícil viver", "acolhedor, confortável", "ligado à vida simples e tranquila do campo"], "certa": 2, "explicacao": "c) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["javalí", "hífen", "feiura", "órfã", "saúde"], "certa": 0, "explicacao": "a) javalí — o certo é javali: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Arthur escolheu três cores: roxo, laranja, e verde.", "Arthur, escolheu três cores: roxo, laranja e verde.", "Arthur escolheu três cores: roxo laranja e verde.", "Arthur escolheu três cores roxo, laranja e verde.", "Arthur escolheu três cores: roxo, laranja e verde."], "certa": 4, "explicacao": "e) Arthur escolheu três cores: roxo, laranja e verde. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Arthur e o verbo."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>fiel</b>? Responda com a letra.", "alternativas": ["magríssimo", "fielérrimo", "crudelíssimo", "fielíssima", "fidelíssimo"], "certa": 4, "explicacao": "e) fidelíssimo"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Daqui a uma hora começa o jogo.", "O ônibus passa daqui a dez minutos.", "Tentei abrir o pote, mas a tampa estava presa.", "Onde você vai com essa mochila?", "Aquele foi um mau sinal: o céu ficou preto."], "certa": 3, "explicacao": "d) o certo é “Aonde”"}];
const CHAVE='simulado-bonus-10';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
