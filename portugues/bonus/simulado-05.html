<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "No ano que vem, eles ___ pizza. Qual forma completa a frase? Responda com a letra.", "alternativas": ["comem", "comerão", "comeram", "comiam", "comeriam"], "certa": 1, "explicacao": "b) comerão — futuro: -ão."}, {"enunciado": "De que duas palavras se forma <b>neste</b>? Responda com a letra.", "alternativas": ["em + aquilo", "em + este", "ne + este", "em + estes", "de + este"], "certa": 1, "explicacao": "b) em + este"}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "que está em toda parte", "confirmar, reforçar uma ideia", "que nunca foi usado, novinho", "incomum, surpreendente"], "certa": 4, "explicacao": "e) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>forte</b>? Responda com a letra.", "alternativas": ["guerra", "agitado", "perder", "robusto", "fraco"], "certa": 4, "explicacao": "e) fraco — cuidado: “robusto” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "fora de uso, ultrapassado", "que está em toda parte", "esfriar, perder a força", "muito cuidadoso com os detalhes"], "certa": 2, "explicacao": "c) que está em toda parte"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pa-ssa-re-la", "ex-cep-ci-o-nal", "ex-ce-len-te", "ba-nhei-ro", "a-le-gre"], "certa": 0, "explicacao": "a) pa-ssa-re-la — o certo é pas-sa-re-la: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["joaninha", "coroa", "broa", "manjericão", "cereal"], "certa": 3, "explicacao": "d) manjericão — man-je-ri-cão"}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "aliviar, diminuir (uma dor, um problema)", "oportunidade, ocasião", "que dá para acreditar, razoável", "aumentar, piorar"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["— Não vou à praia. — Por quê?", "Você está bravo porque perdeu o jogo?", "— Hoje não tem aula. — Porque?", "Ele foi embora cedo, mas não explicou por quê.", "Por que dormimos à noite"], "certa": 2, "explicacao": "c) — o certo é “— Hoje não tem aula. — Por quê?”: a pergunta é só ela, sozinha: aí ganha acento."}, {"enunciado": "Como se escreve <b>75º</b> por extenso? Responda com a letra.", "alternativas": ["setentésimo quinto", "septuagésimo sexto", "octogésimo quinto", "septuagésimo quinto", "sexagésimo quinto"], "certa": 3, "explicacao": "d) septuagésimo quinto"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["países", "papéis", "vírus", "raíz", "baú"], "certa": 3, "explicacao": "d) raíz — o certo é raiz: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Feche a janela, pois vai chover.", "Ele treinou todo dia, portanto ganhou a corrida.", "O sol saiu e as flores abriram.", "Choveu, entretanto fomos à praia.", "Vamos à praia caso faça sol."], "certa": 3, "explicacao": "d) Choveu, entretanto fomos à praia."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["remédio para todos os males", "pouco, escasso", "farto, abundante", "exibido, que usa palavras difíceis só para se mostrar", "que fala ou escreve demais, enrolando"], "certa": 1, "explicacao": "b) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Onde os ursos passam o inverno?", "A cidade onde nasci é pequena.", "O mau cheiro vinha da lata de lixo.", "A sopa estava mau temperada.", "Aonde o vovô foi tão cedo?"], "certa": 3, "explicacao": "d) o certo é “mal”"}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "que dura pouco tempo", "dispensar, não precisar de algo", "precisar muito de algo", "que acontece por acaso"], "certa": 2, "explicacao": "c) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a foca</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "epiceno", "tem feminino diferente (biforme)", "sobrecomum", "comum de dois"], "certa": 1, "explicacao": "b) epiceno — animal: a foca macho / a foca fêmea."}, {"enunciado": "O que quer dizer <b>senso</b>? Responda com a letra.", "alternativas": ["medida", "contagem da população", "pôr fogo", "soneca depois do almoço", "juízo"], "certa": 4, "explicacao": "e) juízo — não confunda com “censo” (contagem da população)."}, {"enunciado": "O que quer dizer <b>tácito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "dito com todas as letras", "muito pequeno, escasso", "estranho, fora do comum", "combinado sem precisar falar, subentendido"], "certa": 4, "explicacao": "e) combinado sem precisar falar, subentendido. Não é “dito com todas as letras”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Para mim, fazer isso é fácil.", "Sem mim, a festa não teria graça.", "Trouxe o lápis para eu desenhar.", "A professora trouxe o mapa para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}, {"enunciado": "O verbo <b>dispor</b> é de que conjugação? Responda com a letra.", "alternativas": ["3ª conjugação (-ir)", "4ª conjugação (-or)", "não tem conjugação", "2ª conjugação (-er)", "1ª conjugação (-ar)"], "certa": 3, "explicacao": "d) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "esforço, vontade forte de fazer algo", "resistente (ao calor, a mudanças)", "cansaço depois de trabalhar", "que dura pouco tempo"], "certa": 1, "explicacao": "b) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O juiz decidiu cassar o mandato do político.", "O mergulhador vai emergir no mar profundo.", "Os brinquedos ficam na seção infantil da loja.", "Com 18 anos, ele já é elegível para vereador.", "O cabelo dela é comprido e liso."], "certa": 1, "explicacao": "b) — o certo é “imergir” (mergulhar)."}, {"enunciado": "“Vovô, dá um abracinho!”<br>Que sentido tem <b>abracinho</b> nessa frase? Responda com a letra.", "alternativas": ["desprezo", "carinho", "admiração", "pressa", "tamanho"], "certa": 1, "explicacao": "b) carinho"}, {"enunciado": "“Ricardo se escondeu <b>entre</b> as caixas.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["finalidade", "causa", "lugar", "companhia", "matéria"], "certa": 2, "explicacao": "c) lugar"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o planeta", "o pijama", "a clã", "a alface", "a mão"], "certa": 2, "explicacao": "c) a clã — o certo é “o clã”."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arma truques para enganar", "que fala pouco, de poucas palavras", "que está em toda parte", "que arde, que queima", "estranho, fora do comum"], "certa": 0, "explicacao": "a) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "“Seu Antônio, o padeiro, chegou cedo.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o aposto (uma explicação sobre o nome)", "separa os itens de uma lista", "separa o sujeito do verbo", "separa o lugar e a data", "separa o vocativo (quem é chamado)"], "certa": 0, "explicacao": "a) separa o aposto (uma explicação sobre o nome) — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "Quem nasce em <b>França</b> é… Responda com a letra.", "alternativas": ["australiano", "francês", "gaúcho", "paraense", "chinês"], "certa": 1, "explicacao": "b) francês"}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "triste, melancólico", "aliviar, diminuir (uma dor, um problema)", "que não faz mal, sem efeito", "sem nenhum machucado, ileso"], "certa": 0, "explicacao": "a) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Benício escolheu três cores: roxo, amarelo e laranja.", "Benício, escolheu três cores: roxo, amarelo e laranja.", "Benício escolheu três cores: roxo amarelo e laranja.", "Benício escolheu três cores: roxo, amarelo, e laranja.", "Benício escolheu três cores roxo, amarelo e laranja."], "certa": 0, "explicacao": "a) Benício escolheu três cores: roxo, amarelo e laranja. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Benício e o verbo."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
