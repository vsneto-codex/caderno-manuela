<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você faltou por quê, afinal?", "Por que dormimos à noite", "As cidades por que viajamos eram lindas.", "Por que o mar tem ondas", "O detetive descobriu o porque do sumiço do colar."], "certa": 4, "explicacao": "e) — o certo é “O detetive descobriu o porquê do sumiço do colar.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Ontem eu ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["direi", "dizi", "digo", "disse", "dizia"], "certa": 3, "explicacao": "d) disse"}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "incomum, surpreendente", "que arma truques para enganar", "que nunca foi usado, novinho", "estranho, fora do comum"], "certa": 1, "explicacao": "b) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "“Meu amorzinho!”<br>Que sentido tem <b>amorzinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "admiração", "pressa", "desprezo", "carinho"], "certa": 4, "explicacao": "e) carinho"}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "que acontece por acaso", "grosseiro, muito grave (um erro)", "aliviar, diminuir (uma dor, um problema)", "aumentar, piorar"], "certa": 3, "explicacao": "d) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A escola fica há dez minutos de casa.", "Onde nasce o rio Amazonas?", "Aonde você foi ontem à tarde?", "Quero mais um pedaço de bolo, por favor.", "O filme começa daqui a meia hora."], "certa": 0, "explicacao": "a) o certo é “a”"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["car-ne-i-ro", "a-bso-lu-to", "goia-ba", "pá-ssa-ro", "he-li-cóp-te-ro"], "certa": 4, "explicacao": "e) he-li-cóp-te-ro — a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Na locução verbal <b>vou meter</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["meter", "não há verbo principal", "vou", "os dois são principais", "o sujeito"], "certa": 0, "explicacao": "a) meter — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "esperto, que percebe tudo rápido", "pouco, escasso", "farto, abundante", "estranho, fora do comum"], "certa": 2, "explicacao": "c) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>jóquei</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em ei ou eis leva acento", "oxítona terminada em em ou ens leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "oxítona terminada em o leva acento", "oxítona (força na última sílaba) terminada em a leva acento"], "certa": 0, "explicacao": "a) paroxítona terminada em ei ou eis leva acento (jó-quei)."}, {"enunciado": "Se eu ___ a mesa, ficaria contente. (verbo pôr)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["pôr", "ponho", "ponha", "pus", "pusesse"], "certa": 4, "explicacao": "e) pusesse"}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "descuidado, que cai fácil em armadilhas", "precisar muito de algo", "lento para entender", "incomum, surpreendente"], "certa": 0, "explicacao": "a) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o condor</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "sobrecomum", "tem feminino diferente (biforme)", "comum de dois", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: o condor macho / o condor fêmea."}, {"enunciado": "Por que a palavra <b>lâmpada</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["no fim da palavra se usa n", "antes de p e b se usa m", "antes de qualquer consoante se usa n", "depois de vogal com acento se usa m", "antes de t e d se usa n"], "certa": 1, "explicacao": "b) antes de p e b se usa m"}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles jogaram bola.", "Daqui a dois dias, eles responderão às perguntas.", "Hoje de manhã, eles pintaram um quadro.", "Amanhã, eles decidirão o jogo.", "Ontem, eles beberam suco."], "certa": 0, "explicacao": "a) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Daqui a dois dias, eles ___ no parque. Qual forma completa a frase? Responda com a letra.", "alternativas": ["correm", "correrão", "corriam", "correriam", "correram"], "certa": 1, "explicacao": "b) correrão — futuro: -ão."}, {"enunciado": "O que quer dizer <b>tácito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dito com todas as letras", "descuidado, que cai fácil em armadilhas", "combinado sem precisar falar, subentendido", "confusão, situação enrolada", "resistente (ao calor, a mudanças)"], "certa": 2, "explicacao": "c) combinado sem precisar falar, subentendido. Não é “dito com todas as letras”: essa é a pegadinha."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["fogueira", "quilo", "aguentar", "quintal", "queijo"], "certa": 2, "explicacao": "c) aguentar — em “aguentar” a gente fala o u"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>agradável</b>? Responda com a letra.", "alternativas": ["agradabilíssimo", "agradavélimo", "máximo", "agradavelíssimo", "friíssimo"], "certa": 0, "explicacao": "a) agradabilíssimo"}, {"enunciado": "Como se diz a fêmea do <b>pernilongo</b>? Responda com a letra.", "alternativas": ["a pernilonga", "o pernilongozinha", "a pernilongo fêmea", "a pernilongo", "o pernilongo fêmea"], "certa": 4, "explicacao": "e) o pernilongo fêmea — pernilongo é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "que acontece fora de hora", "esforço, vontade forte de fazer algo", "esfriar, perder a força", "espantado, sem reação"], "certa": 2, "explicacao": "c) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "Na frase “O sorvete derreteu <b>porque</b> ficou no sol.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "porém", "pois", "por isso", "por qual motivo"], "certa": 2, "explicacao": "c) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "De que duas palavras se forma <b>daquilo</b>? Responda com a letra.", "alternativas": ["da + aquilo", "de + aquila", "em + aquilo", "de + isso", "de + aquilo"], "certa": 4, "explicacao": "e) de + aquilo"}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "que arde, que queima", "que arma truques para enganar", "aliviar, diminuir (uma dor, um problema)", "firme e calmo diante do sofrimento"], "certa": 2, "explicacao": "c) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pesquisa", "deça", "piscina", "francesa", "adolescente"], "certa": 1, "explicacao": "b) deça — o certo é desça: do verbo descer: sç."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["xuveiro", "ameixa", "chapél", "giboia", "lagarticha"], "certa": 1, "explicacao": "b) ameixa — depois de ditongo se usa x."}, {"enunciado": "Qual é o diminutivo de <b>rua</b>? Responda com a letra.", "alternativas": ["chapeuzinho", "camiseta", "papelzinho", "bolinha", "ruela"], "certa": 4, "explicacao": "e) ruela"}, {"enunciado": "Por que a palavra <b>mesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o s tem som de z", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss"], "certa": 0, "explicacao": "a) entre vogais, o s tem som de z"}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "ligado à vida simples e tranquila do campo", "triste, melancólico", "que dura muito, que não acaba", "que está em toda parte"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "A professora trouxe a revista para eu.", "Para mim, estudar à noite é melhor.", "Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil."], "certa": 1, "explicacao": "b) — o certo é “para mim”."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
