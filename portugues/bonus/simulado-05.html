<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Amanhã, eles ___ para casa. Qual forma completa a frase? Responda com a letra.", "alternativas": ["voltam", "voltarão", "voltaram", "voltariam", "voltavam"], "certa": 1, "explicacao": "b) voltarão — futuro: -ão."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente acorda cedo no domingo.", "A gente gosta de pizza.", "A gente comemos muita fruta.", "Nós jogamos bola no recreio.", "Nós viajamos nas férias."], "certa": 2, "explicacao": "c) — o certo é “A gente come”: a gente pede o verbo como “ele”."}, {"enunciado": "De que duas palavras se forma <b>neste</b>? Responda com a letra.", "alternativas": ["ne + este", "em + aquilo", "de + este", "em + este", "em + estes"], "certa": 3, "explicacao": "d) em + este"}, {"enunciado": "Situação: O bebê está dormindo e alguém fala alto.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Uau!", "Silêncio!", "Ui!", "Cuidado!", "Coitado!"], "certa": 1, "explicacao": "b) Silêncio! — pedido de silêncio."}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "totalmente fechado; difícil de entender", "proveitoso, que dá bons resultados", "incomum, surpreendente", "que nunca foi usado, novinho"], "certa": 3, "explicacao": "d) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>começo</b>? Responda com a letra.", "alternativas": ["fim", "guerra", "chorar", "vender", "escuro"], "certa": 0, "explicacao": "a) fim"}, {"enunciado": "O que quer dizer <b>contrito</b>? Responda com a letra.", "alternativas": ["agravar, piorar", "arrependido", "começar", "diferente, especial", "fraco, fino, delicado"], "certa": 1, "explicacao": "b) arrependido"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["ac-res-cen-tar", "pa-ssa-ri-nho", "joe-lho", "é-tni-co", "op-ção"], "certa": 4, "explicacao": "e) op-ção — a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["cheiroso", "saudade", "pai", "alegria", "bairro"], "certa": 3, "explicacao": "d) alegria — a-le-gri-a"}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aumentar, piorar", "que está em toda parte", "muitas vezes, com frequência", "aliviar, diminuir (uma dor, um problema)", "remédio para todos os males"], "certa": 3, "explicacao": "d) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ele foi embora cedo, mas não explicou porque.", "Não entendi por que o filme acabou daquele jeito.", "Não há por que correr: ainda é cedo.", "Ele riu e, não sei por quê, todos riram junto.", "Saiu sem dizer por quê."], "certa": 0, "explicacao": "a) — o certo é “Ele foi embora cedo, mas não explicou por quê.”: vem logo antes de uma pausa (vírgula ou ponto): aí ganha acento."}, {"enunciado": "Como se escreve <b>72º</b> por extenso? Responda com a letra.", "alternativas": ["septuagésimo segundo", "setentésimo segundo", "sexagésimo segundo", "septuagésimo terceiro", "octogésimo segundo"], "certa": 0, "explicacao": "a) septuagésimo segundo"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["hífen", "item", "estréia", "leem", "lápis"], "certa": 2, "explicacao": "c) estréia — o certo é estreia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Não fui à aula, já que estava com febre.", "Ele treinou todo dia, portanto ganhou a corrida.", "Comprei pão e comprei leite.", "O filme era longo, todavia ninguém dormiu.", "O time ganha caso treine bastante."], "certa": 0, "explicacao": "a) Não fui à aula, já que estava com febre."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muitas vezes, com frequência", "breve e direto", "pouco, escasso", "rigoroso e sem luxo", "farto, abundante"], "certa": 2, "explicacao": "c) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>guarda-chuva</b>? Responda com a letra.", "alternativas": ["guarda-chuva", "guarda-chuvas", "guardas-chuva", "guarda-chuvaes", "guardas-chuvas"], "certa": 1, "explicacao": "b) guarda-chuvas"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A escola fica a dez minutos de casa.", "Onde os pinguins vivem?", "A festa da escola será daqui há dez dias.", "O gato é pequeno, mas é muito corajoso.", "Ele teve um mau dia na escola."], "certa": 2, "explicacao": "c) o certo é “a”"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["padrinho", "casinha", "pezinho", "florzinha", "cafezinho"], "certa": 0, "explicacao": "a) padrinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala pouco, de poucas palavras", "esbanjador, que gasta demais", "generoso, de coração grande", "precisar muito de algo", "dispensar, não precisar de algo"], "certa": 4, "explicacao": "e) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["anjo", "grito", "telefone", "fada", "livro"], "certa": 1, "explicacao": "b) grito — só existe se alguém fizer ou sentir."}, {"enunciado": "A palavra <b>a criatura</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "não tem gênero", "epiceno", "tem feminino diferente (biforme)", "comum de dois"], "certa": 0, "explicacao": "a) sobrecomum — a criatura serve para menino e menina, sem mudar nada."}, {"enunciado": "O que quer dizer <b>seção</b>? Responda com a letra.", "alternativas": ["antigo rei do Irã", "comércio ilegal", "reunião, exibição", "realizado", "departamento, parte"], "certa": 4, "explicacao": "e) departamento, parte — não confunda com “sessão” (reunião, exibição)."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os jovems", "os arco-íris", "as couves-flores", "os pastéis", "os hifens"], "certa": 0, "explicacao": "a) os jovems — o certo é os jovens."}, {"enunciado": "O que quer dizer <b>tácito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "dito com todas as letras", "que não faz mal, sem efeito", "generoso, de coração grande", "incomum, surpreendente"], "certa": 0, "explicacao": "a) combinado sem precisar falar, subentendido. Não é “dito com todas as letras”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>rinoceronte</b>? Responda com a letra.", "alternativas": ["a rinoceronte fêmea", "o rinocerontezinha", "o rinoceronte fêmea", "a rinocerontea", "a rinoceronte"], "certa": 2, "explicacao": "c) o rinoceronte fêmea — rinoceronte é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "O bolo é para mim.", "Mamãe trouxe a receita para mim guardar.", "Para mim, estudar à noite é melhor.", "Ela deu o recado para eu levar."], "certa": 2, "explicacao": "c) — o certo é “para eu guardar”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Mostrei o desenho à você.", "Comemos bife à milanesa.", "Fiz uma visita àquele museu.", "Aprendi a nadar.", "Viajei a Roma e à Itália."], "certa": 0, "explicacao": "a) — o certo é “a você”: antes de ela, você, todos e Vossa Excelência não tem crase."}, {"enunciado": "O verbo <b>supor</b> é de que conjugação? Responda com a letra.", "alternativas": ["4ª conjugação (-or)", "3ª conjugação (-ir)", "1ª conjugação (-ar)", "2ª conjugação (-er)", "não tem conjugação"], "certa": 3, "explicacao": "d) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["novato, iniciante", "esbanjador, que gasta demais", "cansaço depois de trabalhar", "esforço, vontade forte de fazer algo", "espantado, sem reação"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Depois do almoço, o vovô tira uma sesta.", "O cavaleiro montou o cavalo e partiu.", "Os brinquedos ficam na sessão infantil da loja.", "O assento do ônibus estava rasgado.", "A sessão de cinema começa às oito."], "certa": 2, "explicacao": "c) — o certo é “seção” (departamento, parte)."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
