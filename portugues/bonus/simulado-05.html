<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "No ano que vem, eles ___ pizza. Qual forma completa a frase? Responda com a letra.", "alternativas": ["comem", "comerão", "comeram", "comiam", "comeriam"], "certa": 1, "explicacao": "b) comerão — futuro: -ão."}, {"enunciado": "De que duas palavras se forma <b>daquilo</b>? Responda com a letra.", "alternativas": ["de + isso", "da + aquilo", "de + aquila", "em + aquilo", "de + aquilo"], "certa": 4, "explicacao": "e) de + aquilo"}, {"enunciado": "Situação: O vovô torce para não chover na festa.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Fora!", "Hum!", "Parabéns!", "Tomara!", "Silêncio!"], "certa": 3, "explicacao": "d) Tomara! — desejo."}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que nunca foi usado, novinho", "caro, que custa muito", "espantado, sem reação", "estranho, fora do comum", "incomum, surpreendente"], "certa": 4, "explicacao": "e) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>cheio</b>? Responda com a letra.", "alternativas": ["lento", "vazio", "fechado", "velho", "empurrar"], "certa": 1, "explicacao": "b) vazio"}, {"enunciado": "O que quer dizer <b>afã</b>? Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "onde é muito difícil viver", "descuidado, que cai fácil em armadilhas", "esforço, vontade forte de fazer algo", "lento para entender"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["sob-ran-ce-lha", "ca-ptu-ra", "ce-real", "ban-de-i-ra", "en-fer-mei-ra"], "certa": 4, "explicacao": "e) en-fer-mei-ra — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["joaninha", "curioso", "rua", "degrau", "lua"], "certa": 3, "explicacao": "d) degrau — de-grau"}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "aumentar, piorar", "excelente, muito habilidoso", "que fala ou escreve demais, enrolando", "confirmar, reforçar uma ideia"], "certa": 0, "explicacao": "a) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você não comeu porque estava sem fome?", "Ninguém sabe por que o gato sumiu.", "— Não vou à praia. — Por que?", "O túnel por que o trem passa é escuro.", "Ninguém explicou por que a aula acabou mais cedo."], "certa": 2, "explicacao": "c) — o certo é “— Não vou à praia. — Por quê?”: a pergunta é só ela, sozinha: aí ganha acento."}, {"enunciado": "Como se escreve <b>72º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo segundo", "setentésimo segundo", "octogésimo segundo", "septuagésimo segundo", "septuagésimo terceiro"], "certa": 3, "explicacao": "d) septuagésimo segundo"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pólen", "herói", "ruím", "heroico", "raiz"], "certa": 2, "explicacao": "c) ruím — o certo é ruim: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["Desligue a luz, porque vamos economizar energia.", "A ponte caiu, por isso tivemos de voltar.", "Vamos à praia se fizer sol.", "O gato pulou e derrubou o vaso.", "Corri muito, porém perdi o ônibus."], "certa": 2, "explicacao": "c) Vamos à praia se fizer sol."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["farto, abundante", "pouco, escasso", "que arma truques para enganar", "confirmar, reforçar uma ideia", "preciso, feito com muito cuidado"], "certa": 1, "explicacao": "b) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aonde o ônibus vai nos levar?", "Onde fica a biblioteca?", "Aquele foi um mau sinal: o céu ficou preto.", "Aonde você quer chegar com essa conversa?", "A casa aonde moro tem um jardim."], "certa": 4, "explicacao": "e) o certo é “onde”"}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "dispensar, não precisar de algo", "que passa num instante", "que não se apaga", "precisar muito de algo"], "certa": 1, "explicacao": "b) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "A palavra <b>a pessoa</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "comum de dois", "sobrecomum", "epiceno", "tem feminino diferente (biforme)"], "certa": 2, "explicacao": "c) sobrecomum — a pessoa serve para menino e menina, sem mudar nada."}, {"enunciado": "O que quer dizer <b>eminente</b>? Responda com a letra.", "alternativas": ["pôr fogo", "prestes a acontecer", "lance no xadrez", "quem anda a cavalo", "ilustre"], "certa": 4, "explicacao": "e) ilustre — não confunda com “iminente” (prestes a acontecer)."}, {"enunciado": "O que quer dizer <b>tácito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "que fala ou escreve demais, enrolando", "caro, que custa muito", "rigoroso e sem luxo", "dito com todas as letras"], "certa": 0, "explicacao": "a) combinado sem precisar falar, subentendido. Não é “dito com todas as letras”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Mamãe trouxe o livro para mim desenhar.", "Para mim, fazer isso é fácil.", "Sem mim, a festa não teria graça.", "Para mim, estudar à noite é melhor.", "Isso é para eu ler."], "certa": 0, "explicacao": "a) — o certo é “para eu desenhar”."}, {"enunciado": "O verbo <b>pressupor</b> é de que conjugação? Responda com a letra.", "alternativas": ["2ª conjugação (-er)", "4ª conjugação (-or)", "1ª conjugação (-ar)", "3ª conjugação (-ir)", "não tem conjugação"], "certa": 0, "explicacao": "a) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "excelente, muito habilidoso", "cansaço depois de trabalhar", "pouco, escasso", "rigoroso e sem luxo"], "certa": 0, "explicacao": "a) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O espectador assistiu ao jogo da arquibancada.", "O prazo foi comprido à risca.", "A rosa fragrante perfumou a sala.", "Depois do almoço, o vovô tira uma sesta.", "O ladrão foi pego em flagrante."], "certa": 1, "explicacao": "b) — o certo é “cumprido” (realizado)."}, {"enunciado": "“Meu amorzinho!”<br>Que sentido tem <b>amorzinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "admiração", "desprezo", "carinho", "pressa"], "certa": 3, "explicacao": "d) carinho"}, {"enunciado": "“Treinei <b>para</b> vencer.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["meio", "falta", "matéria", "finalidade", "causa"], "certa": 3, "explicacao": "d) finalidade"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o planeta", "o pijama", "a dia", "o clima", "o sistema"], "certa": 2, "explicacao": "c) a dia — o certo é “o dia”."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "que arma truques para enganar", "que arde, que queima", "remédio para todos os males", "mínimo, o menor de todos"], "certa": 1, "explicacao": "b) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "“São Paulo, 16 de outubro de 2026.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o aposto (uma explicação sobre o nome)", "separa o sujeito do verbo", "separa o vocativo (quem é chamado)", "separa o lugar e a data", "separa os itens de uma lista"], "certa": 3, "explicacao": "d) separa o lugar e a data — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "Quem nasce em <b>Estados Unidos</b> é… Responda com a letra.", "alternativas": ["inglês", "maranhense", "estadunidense", "italiano", "maceioense"], "certa": 2, "explicacao": "c) estadunidense"}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["triste, melancólico", "ligado à vida simples e tranquila do campo", "sem medo, destemido", "que passa num instante", "excelente, muito habilidoso"], "certa": 1, "explicacao": "b) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
