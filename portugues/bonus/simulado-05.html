<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "No ano que vem, eles ___ pão. Qual forma completa a frase? Responda com a letra.", "alternativas": ["compram", "comprarão", "compraram", "compravam", "comprariam"], "certa": 1, "explicacao": "b) comprarão — futuro: -ão."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente gostamos de pizza.", "A gente chega cedo à escola.", "A gente canta no coral da escola.", "Nós brincamos no parque.", "Nós chegamos cedo à escola."], "certa": 0, "explicacao": "a) — o certo é “A gente gosta”: a gente pede o verbo como “ele”."}, {"enunciado": "Qual é a junção de <b>em + esse</b>? Responda com a letra.", "alternativas": ["desse", "eoesse", "em esse", "nesse", "àesse"], "certa": 3, "explicacao": "d) nesse"}, {"enunciado": "Situação: O bebê está dormindo e alguém fala alto.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Uhu!", "Silêncio!", "Bravo!", "Apoiado!", "Hum!"], "certa": 1, "explicacao": "b) Silêncio! — pedido de silêncio."}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "estranho, fora do comum", "solitário, sozinho", "muitas vezes, com frequência", "totalmente fechado; difícil de entender"], "certa": 1, "explicacao": "b) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>aberto</b>? Responda com a letra.", "alternativas": ["comprido", "tarde", "perder", "fechado", "dormindo"], "certa": 3, "explicacao": "d) fechado"}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Responda com a letra.", "alternativas": ["investigar a fundo", "que traz boas notícias", "agravar, piorar", "aliviar, diminuir (uma dor, um problema)", "remédio para todos os males"], "certa": 1, "explicacao": "b) que traz boas notícias"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["at-mos-fe-ra", "e-clip-se", "dis-cip-li-na", "ex-ce-ção", "chei-o"], "certa": 2, "explicacao": "c) dis-cip-li-na — o certo é dis-ci-pli-na: encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["curioso", "enfermeira", "tapioca", "cientista", "glacial"], "certa": 1, "explicacao": "b) enfermeira — en-fer-mei-ra"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["feito de leite", "excelente, muito habilidoso", "que fala pouco, de poucas palavras", "fora da época certa", "que dá para acreditar, razoável"], "certa": 2, "explicacao": "c) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Não entendi por que o filme acabou daquele jeito.", "Saiu sem dizer por quê.", "Você está bravo porque perdeu o jogo?", "Ninguém sabe o por que do sumiço do gato.", "Por que os dinossauros desapareceram"], "certa": 3, "explicacao": "d) — o certo é “Ninguém sabe o porquê do sumiço do gato.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Como se escreve <b>75º</b> por extenso? Responda com a letra.", "alternativas": ["octogésimo quinto", "septuagésimo sexto", "setentésimo quinto", "septuagésimo quinto", "sexagésimo quinto"], "certa": 3, "explicacao": "d) septuagésimo quinto"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jiboia", "açúcar", "tórax", "aínda", "polens"], "certa": 3, "explicacao": "d) aínda — o certo é ainda: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Não fui à aula, já que estava com febre.", "Ricardo é tímido, porém adora cantar.", "O cachorro latiu e o gato miou.", "Esqueci o guarda-chuva, portanto fiquei molhado.", "Você chega cedo caso pegue o ônibus das sete."], "certa": 0, "explicacao": "a) Não fui à aula, já que estava com febre."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["honroso, que dá orgulho", "caro, que custa muito", "que fala ou escreve demais, enrolando", "que não toma partido, que é justo com todos os lados", "que passa num instante"], "certa": 1, "explicacao": "b) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>bem-te-vi</b>? Responda com a letra.", "alternativas": ["bem-te-vies", "bems-te-vis", "bem-te-vis", "bem-te-vi", "bems-te-vi"], "certa": 2, "explicacao": "c) bem-te-vis"}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A árvore onde o macaco subiu é muito alta.", "Quem treina mais costuma jogar melhor.", "O museu fica a dois quarteirões da praça.", "A três dias que o gato não aparece.", "Moro a cinco minutos da escola."], "certa": 3, "explicacao": "d) o certo é “Há”"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["mesinha", "rainha", "cafezinho", "dedinho", "casinha"], "certa": 1, "explicacao": "b) rainha — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "O que quer dizer <b>plateia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o público que assiste a um espetáculo", "confusão, situação enrolada", "exibido, que usa palavras difíceis só para se mostrar", "o palco onde os atores se apresentam", "dispensar, não precisar de algo"], "certa": 0, "explicacao": "a) o público que assiste a um espetáculo. Não é “o palco onde os atores se apresentam”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["viagem", "bruxa", "sereia", "lua", "dragão"], "certa": 0, "explicacao": "a) viagem — só existe se alguém fizer ou sentir."}, {"enunciado": "A palavra <b>a zebra</b> é… Responda com a letra.", "alternativas": ["epiceno", "tem feminino diferente (biforme)", "não tem gênero", "sobrecomum", "comum de dois"], "certa": 0, "explicacao": "a) epiceno — animal: a zebra macho / a zebra fêmea."}, {"enunciado": "O que quer dizer <b>cheque</b>? Responda com a letra.", "alternativas": ["passada", "ordem de pagamento", "lance no xadrez", "realizado", "longo"], "certa": 1, "explicacao": "b) ordem de pagamento — não confunda com “xeque” (lance no xadrez)."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os funis", "os animals", "os tórax", "os pastéis", "os guarda-chuvas"], "certa": 1, "explicacao": "b) os animals — o certo é os animais."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "caprichado e bem-arrumado", "aliviar, diminuir (uma dor, um problema)", "muito pequeno, escasso", "combinado sem precisar falar, subentendido"], "certa": 0, "explicacao": "a) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>gorila</b>? Responda com a letra.", "alternativas": ["a gorila fêmea", "o gorila fêmea", "a gorila", "a gorilaona", "o gorilazinha"], "certa": 1, "explicacao": "b) o gorila fêmea — gorila é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela deu o recado para eu levar.", "Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar.", "O vovô trouxe o mapa para mim ver.", "Isso é para eu ler."], "certa": 3, "explicacao": "d) — o certo é “para eu ver”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comemos bife à milanesa.", "Chegamos às oito horas.", "Entreguei o bilhete a professora.", "Começou a chover à noite.", "Vou à Bahia."], "certa": 2, "explicacao": "c) — o certo é “à professora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O verbo <b>contrapor</b> é de que conjugação? Responda com a letra.", "alternativas": ["2ª conjugação (-er)", "não tem conjugação", "4ª conjugação (-or)", "1ª conjugação (-ar)", "3ª conjugação (-ir)"], "certa": 0, "explicacao": "a) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "veloz, apressado", "intenso, enérgico", "isca, armadilha para enganar", "remédio para todos os males"], "certa": 2, "explicacao": "c) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O médico deu dispensa da aula para o menino doente.", "Ele tem um ótimo senso de humor.", "Andei dois quilômetros: dei mais um passo.", "A sessão de cinema começa às oito.", "Tomei um xá de camomila."], "certa": 4, "explicacao": "e) — o certo é “chá” (bebida)."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
