<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "No ano que vem, eles ___ no parque. Qual forma completa a frase? Responda com a letra.", "alternativas": ["correm", "correrão", "correram", "corriam", "correriam"], "certa": 1, "explicacao": "b) correrão — futuro: -ão."}, {"enunciado": "De que duas palavras se forma <b>àquilo</b>? Responda com a letra.", "alternativas": ["a + isso", "àq + aquilo", "a + aquila", "de + aquilo", "a + aquilo"], "certa": 4, "explicacao": "e) a + aquilo"}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que nunca foi usado, novinho", "vencer, controlar (um incêndio, uma crise)", "tão bom que não dá para descrever com palavras", "confirmar, reforçar uma ideia", "incomum, surpreendente"], "certa": 4, "explicacao": "e) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>forte</b>? Responda com a letra.", "alternativas": ["fraco", "robusto", "sair", "amargo", "baixo"], "certa": 0, "explicacao": "a) fraco — cuidado: “robusto” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>relutante</b>? Responda com a letra.", "alternativas": ["esfriar, perder a força", "que não quer fazer, hesitante", "que traz desgraça", "diferente, especial", "confusão, situação enrolada"], "certa": 1, "explicacao": "b) que não quer fazer, hesitante"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["chei-o", "jar-di-ne-i-ro", "di-a-gnós-ti-co", "mag-ro", "fan-ta-sia"], "certa": 0, "explicacao": "a) chei-o — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["beijinho", "broa", "cientista", "curiosidade", "macio"], "certa": 0, "explicacao": "a) beijinho — bei-ji-nho"}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aumentar, piorar", "rigoroso e sem luxo", "caro, que custa muito", "esforço, vontade forte de fazer algo", "aliviar, diminuir (uma dor, um problema)"], "certa": 4, "explicacao": "e) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O bolo afundou e ninguém sabe por quê.", "Porque os gatos ronronam?", "Quero entender por que a Lua muda de forma.", "Escreva o que você levaria na viagem e por quê.", "Ela perguntou por que o céu é azul."], "certa": 1, "explicacao": "b) — o certo é “Por que os gatos ronronam?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Como se escreve <b>55º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo quinto", "quinquagésimo sexto", "quadragésimo quinto", "quinquagésimo quinto", "cinquentésimo quinto"], "certa": 3, "explicacao": "d) quinquagésimo quinto"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["idéia", "jiboia", "hífen", "baú", "tórax"], "certa": 0, "explicacao": "a) idéia — o certo é ideia: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Eu levo o bolo se você levar o suco.", "O dia estava nublado, porém não choveu.", "Feche a janela, porque vai chover.", "Comprei pão e comprei leite.", "A ponte caiu, por isso tivemos de voltar."], "certa": 1, "explicacao": "b) O dia estava nublado, porém não choveu."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arma truques para enganar", "farto, abundante", "pouco, escasso", "vencer, controlar (um incêndio, uma crise)", "isca, armadilha para enganar"], "certa": 2, "explicacao": "c) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A prova vai ser daqui a uma semana.", "O parque onde brincamos fechou.", "Coloque mais sal na pipoca.", "A casa aonde moro tem um jardim.", "Aquele não foi um mau jogo: o time jogou direitinho."], "certa": 3, "explicacao": "d) o certo é “onde”"}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["precisar muito de algo", "dispensar, não precisar de algo", "esbanjador, que gasta demais", "novato, iniciante", "pouco, escasso"], "certa": 1, "explicacao": "b) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o polvo</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "não tem gênero", "comum de dois", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: o polvo macho / o polvo fêmea."}, {"enunciado": "O que quer dizer <b>sortir</b>? Responda com a letra.", "alternativas": ["que pode ser eleito", "produzir efeito", "nó", "abastecer", "quem assiste"], "certa": 3, "explicacao": "d) abastecer — não confunda com “surtir” (produzir efeito)."}, {"enunciado": "O que quer dizer <b>tácito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aliviar, diminuir (uma dor, um problema)", "dito com todas as letras", "mínimo, o menor de todos", "que está em toda parte", "combinado sem precisar falar, subentendido"], "certa": 4, "explicacao": "e) combinado sem precisar falar, subentendido. Não é “dito com todas as letras”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Esse presente é para eu.", "Para mim, fazer isso é fácil.", "Sem mim, a festa não teria graça.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem."], "certa": 0, "explicacao": "a) — o certo é “para mim”."}, {"enunciado": "O verbo <b>pressupor</b> é de que conjugação? Responda com a letra.", "alternativas": ["não tem conjugação", "2ª conjugação (-er)", "4ª conjugação (-or)", "3ª conjugação (-ir)", "1ª conjugação (-ar)"], "certa": 1, "explicacao": "b) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "esbanjador, que gasta demais", "sem medo, destemido", "esforço, vontade forte de fazer algo", "esperto, que percebe tudo rápido"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O jogador deu xeque no rei adversário.", "O cabelo dela é cumprido e liso.", "O assento do ônibus estava rasgado.", "A polícia combate o tráfico de animais silvestres.", "Os pais devem prover o sustento dos filhos."], "certa": 1, "explicacao": "b) — o certo é “comprido” (longo)."}, {"enunciado": "“Meu amorzinho!”<br>Que sentido tem <b>amorzinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "desprezo", "pressa", "carinho", "admiração"], "certa": 3, "explicacao": "d) carinho"}, {"enunciado": "“Ficamos <b>sem</b> luz.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["matéria", "causa", "meio", "falta", "companhia"], "certa": 3, "explicacao": "d) falta"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a alface", "o dia", "o clã", "o pijama", "a guaraná"], "certa": 4, "explicacao": "e) a guaraná — o certo é “o guaraná”."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arde, que queima", "que arma truques para enganar", "arrogância, ar de superioridade", "que acontece por acaso", "esforço, vontade forte de fazer algo"], "certa": 1, "explicacao": "b) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "“Dona Lúcia, a vizinha, chegou cedo.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o vocativo (quem é chamado)", "separa o aposto (uma explicação sobre o nome)", "separa o lugar e a data", "separa o sujeito do verbo", "separa os itens de uma lista"], "certa": 1, "explicacao": "b) separa o aposto (uma explicação sobre o nome) — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "Quem nasce em <b>Goiânia</b> é… Responda com a letra.", "alternativas": ["goiano", "goianiense", "tocantinense", "paraguaio", "moçambicano"], "certa": 1, "explicacao": "b) goianiense"}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "nunca visto antes, extraordinário", "triste, melancólico", "que acontece por acaso", "esperto, que percebe tudo rápido"], "certa": 0, "explicacao": "a) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Nicolas escolheu três cores: amarelo, vermelho e azul.", "Nicolas escolheu três cores amarelo, vermelho e azul.", "Nicolas, escolheu três cores: amarelo, vermelho e azul.", "Nicolas escolheu três cores: amarelo, vermelho, e azul.", "Nicolas escolheu três cores: amarelo vermelho e azul."], "certa": 0, "explicacao": "a) Nicolas escolheu três cores: amarelo, vermelho e azul. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Nicolas e o verbo."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
