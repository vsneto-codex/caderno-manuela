<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "No ano que vem, eles ___ pizza. Qual forma completa a frase? Responda com a letra.", "alternativas": ["comem", "comerão", "comeram", "comiam", "comeriam"], "certa": 1, "explicacao": "b) comerão — futuro: -ão."}, {"enunciado": "De que duas palavras se forma <b>àquela</b>? Responda com a letra.", "alternativas": ["a + aquilo", "àq + aquela", "a + aquelas", "de + aquela", "a + aquela"], "certa": 4, "explicacao": "e) a + aquela"}, {"enunciado": "O que quer dizer <b>inusitado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "isca, armadilha para enganar", "intenso, enérgico", "incomum, surpreendente", "que nunca foi usado, novinho"], "certa": 3, "explicacao": "d) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>forte</b>? Responda com a letra.", "alternativas": ["robusto", "silêncio", "empurrar", "infeliz", "fraco"], "certa": 4, "explicacao": "e) fraco — cuidado: “robusto” é sinônimo, não antônimo."}, {"enunciado": "O que quer dizer <b>efêmero</b>? Responda com a letra.", "alternativas": ["que dura pouco tempo", "ligado à vida simples e tranquila do campo", "que arma truques para enganar", "enganoso, feito para induzir ao erro", "espalhar-se (doença, boato)"], "certa": 0, "explicacao": "a) que dura pouco tempo"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["goia-ba", "tig-re", "bur-ro", "e-cli-pse", "bis-co-i-to"], "certa": 2, "explicacao": "c) bur-ro — rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["dragão", "voar", "rua", "coroa", "zoológico"], "certa": 0, "explicacao": "a) dragão — dra-gão"}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "aumentar, piorar", "que dura muito, que não acaba", "aliviar, diminuir (uma dor, um problema)", "grosseiro, muito grave (um erro)"], "certa": 3, "explicacao": "d) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que choveu, o jogo foi adiado.", "E você foi embora por que motivo?", "Por que motivo você faltou?", "Você sabe por que a girafa tem o pescoço comprido?", "Ela perguntou por que o céu é azul."], "certa": 0, "explicacao": "a) — o certo é “Porque choveu, o jogo foi adiado.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Como se escreve <b>75º</b> por extenso? Responda com a letra.", "alternativas": ["septuagésimo quinto", "setentésimo quinto", "octogésimo quinto", "septuagésimo sexto", "sexagésimo quinto"], "certa": 0, "explicacao": "a) septuagésimo quinto"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["países", "pólen", "feiúra", "ruim", "saúde"], "certa": 2, "explicacao": "c) feiúra — o certo é feiura: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>condição</b>? Responda com a letra.", "alternativas": ["O time ganha se treinar bastante.", "O dia estava nublado, contudo não choveu.", "Choveu e ventou.", "Guarde os brinquedos, já que a visita vai chegar.", "Estudei muito, logo tirei dez."], "certa": 0, "explicacao": "a) O time ganha se treinar bastante."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "farto, abundante", "muito pequeno, escasso", "que dá para acreditar, razoável", "pouco, escasso"], "certa": 4, "explicacao": "e) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Onde mora o seu primo?", "Aonde o vovô foi tão cedo?", "Onde está o meu tênis?", "Eu queria brincar, mas tinha lição.", "Os dinossauros viveram a milhões de anos."], "certa": 4, "explicacao": "e) o certo é “há”"}, {"enunciado": "O que quer dizer <b>prescindir</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["precisar muito de algo", "digno de confiança, verdadeiro", "generoso, de coração grande", "dispensar, não precisar de algo", "oportunidade, ocasião"], "certa": 3, "explicacao": "d) dispensar, não precisar de algo. Não é “precisar muito de algo”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o/a intérprete</b> é… Responda com a letra.", "alternativas": ["comum de dois", "tem feminino diferente (biforme)", "epiceno", "não tem gênero", "sobrecomum"], "certa": 0, "explicacao": "a) comum de dois — o intérprete / a intérprete: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>senso</b>? Responda com a letra.", "alternativas": ["ato de ceder", "denunciar", "contagem da população", "soneca depois do almoço", "juízo"], "certa": 4, "explicacao": "e) juízo — não confunda com “censo” (contagem da população)."}, {"enunciado": "O que quer dizer <b>tácito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rigoroso e sem luxo", "digno de confiança, verdadeiro", "grosseiro, muito grave (um erro)", "combinado sem precisar falar, subentendido", "dito com todas as letras"], "certa": 3, "explicacao": "d) combinado sem precisar falar, subentendido. Não é “dito com todas as letras”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Ela deu o recado para eu levar.", "O vovô trouxe a revista para eu.", "Trouxe o lápis para eu desenhar.", "Sem mim, a festa não teria graça."], "certa": 2, "explicacao": "c) — o certo é “para mim”."}, {"enunciado": "O verbo <b>pressupor</b> é de que conjugação? Responda com a letra.", "alternativas": ["2ª conjugação (-er)", "não tem conjugação", "3ª conjugação (-ir)", "1ª conjugação (-ar)", "4ª conjugação (-or)"], "certa": 0, "explicacao": "a) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "cansaço depois de trabalhar", "esforço, vontade forte de fazer algo", "que dura muito, que não acaba", "caro, que custa muito"], "certa": 2, "explicacao": "c) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O ladrão quis delatar o colega à polícia.", "A seção de cinema começa às oito.", "O cachorro abanou a cauda de alegria.", "Ao dormir, é preciso cerrar os olhos.", "O imigrante chegou ao Brasil vindo da Itália."], "certa": 1, "explicacao": "b) — o certo é “sessão” (reunião, exibição)."}, {"enunciado": "“A formiguinha cabe na unha.”<br>Que sentido tem <b>formiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["admiração", "pressa", "desprezo", "carinho", "tamanho"], "certa": 4, "explicacao": "e) tamanho"}, {"enunciado": "“Bianca mandou o recado <b>por</b> telefone.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["meio", "finalidade", "causa", "matéria", "posse"], "certa": 0, "explicacao": "a) meio"}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a moto", "o diadema", "a omelete", "a problema", "o cometa"], "certa": 3, "explicacao": "d) a problema — o certo é “o problema”."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arde, que queima", "que arma truques para enganar", "digno de confiança, verdadeiro", "rigoroso e sem luxo", "intenso, enérgico"], "certa": 1, "explicacao": "b) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "“Comprei manga, banana e uva.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o lugar e a data", "separa o aposto (uma explicação sobre o nome)", "separa o vocativo (quem é chamado)", "separa o sujeito do verbo", "separa os itens de uma lista"], "certa": 4, "explicacao": "e) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "Quem nasce em <b>Maceió</b> é… Responda com a letra.", "alternativas": ["suíço", "maceioense", "mato-grossense", "argentino", "roraimense"], "certa": 1, "explicacao": "b) maceioense"}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["caro, que custa muito", "muitas vezes, com frequência", "ligado à vida simples e tranquila do campo", "incomum, surpreendente", "triste, melancólico"], "certa": 2, "explicacao": "c) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Igor escolheu três cores: roxo, laranja e verde.", "Igor escolheu três cores: roxo laranja e verde.", "Igor escolheu três cores roxo, laranja e verde.", "Igor escolheu três cores: roxo, laranja, e verde.", "Igor, escolheu três cores: roxo, laranja e verde."], "certa": 0, "explicacao": "a) Igor escolheu três cores: roxo, laranja e verde. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Igor e o verbo."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
