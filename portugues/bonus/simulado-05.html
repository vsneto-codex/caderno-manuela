<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 5 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 5 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Amanhã, eles ___ para a praia. Qual forma completa a frase? Responda com a letra.", "alternativas": ["viajam", "viajarão", "viajaram", "viajariam", "viajavam"], "certa": 1, "explicacao": "b) viajarão — futuro: -ão."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente acorda cedo no domingo.", "A gente gosta de pizza.", "A gente brincamos no parque.", "Nós assistimos ao jogo pela televisão.", "Nós viajamos nas férias."], "certa": 2, "explicacao": "c) — o certo é “A gente brinca”: a gente pede o verbo como “ele”."}, {"enunciado": "De que duas palavras se forma <b>neste</b>? Responda com a letra.", "alternativas": ["ne + este", "em + aquilo", "de + este", "em + este", "em + estes"], "certa": 3, "explicacao": "d) em + este"}, {"enunciado": "O que quer dizer <b>insólito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "lento para entender", "que passa num instante", "mentira, golpe para enganar", "solitário, sozinho"], "certa": 0, "explicacao": "a) estranho, fora do comum. Não é “solitário, sozinho”: essa é a pegadinha."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>primeiro</b>? Responda com a letra.", "alternativas": ["mentira", "oeste", "último", "ódio", "fora"], "certa": 2, "explicacao": "c) último"}, {"enunciado": "O que quer dizer <b>exortar</b>? Responda com a letra.", "alternativas": ["espantado, sem reação", "que pode sofrer algo; melindroso", "excelente, muito habilidoso", "incomum, surpreendente", "encorajar, aconselhar com insistência"], "certa": 4, "explicacao": "e) encorajar, aconselhar com insistência"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["deg-rau", "pes-so-a", "as-so-biar", "fe-i-ra", "pa-cto"], "certa": 1, "explicacao": "b) pes-so-a — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["aeroporto", "queixo", "joelho", "cair", "cientista"], "certa": 1, "explicacao": "b) queixo — quei-xo"}, {"enunciado": "O que quer dizer <b>lacônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "feito de leite", "que fala pouco, de poucas palavras", "muito esquisito, absurdo", "sem nenhum machucado, ileso"], "certa": 2, "explicacao": "c) que fala pouco, de poucas palavras. Não é “feito de leite”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Porque os gatos ronronam?", "A rua por que ele passa todo dia é barulhenta.", "Ninguém explicou por que a aula acabou mais cedo.", "Choveu muito; eis por que o jogo parou.", "— Hoje não tem aula. — Por quê?"], "certa": 0, "explicacao": "a) — o certo é “Por que os gatos ronronam?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Como se escreve <b>30º</b> por extenso? Responda com a letra.", "alternativas": ["vigésimo", "quadragésimo", "trigésimo", "trigésimo primeiro", "trintésimo"], "certa": 2, "explicacao": "c) trigésimo"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["bambú", "item", "herói", "raiz", "heroico"], "certa": 0, "explicacao": "a) bambú — o certo é bambu: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["O gato pulou e derrubou o vaso.", "Eu te ajudo caso você peça.", "Escove os dentes, pois você comeu doce.", "Estudei muito, contudo achei a prova difícil.", "A loja fechou, portanto voltamos para casa."], "certa": 2, "explicacao": "c) Escove os dentes, pois você comeu doce."}, {"enunciado": "O que quer dizer <b>oneroso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["honroso, que dá orgulho", "digno de confiança, verdadeiro", "combinado sem precisar falar, subentendido", "onde é muito difícil viver", "caro, que custa muito"], "certa": 4, "explicacao": "e) caro, que custa muito. Não é “honroso, que dá orgulho”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>água-viva</b>? Responda com a letra.", "alternativas": ["água-viva", "água-vivaes", "águas-viva", "água-vivas", "águas-vivas"], "certa": 4, "explicacao": "e) águas-vivas"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Eles leem um livro por semana.", "Vou pôr o casaco.", "O voo atrasou.", "A caixa contém doze lápis.", "Os guardas mantém a calma."], "certa": 4, "explicacao": "e) — o certo é “Os guardas mantêm…”."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ricardo comeu mais pipoca do que todo mundo.", "Ele teve um mau dia na escola.", "Aonde o rio vai chegar?", "Tentei ligar, mais ninguém atendeu.", "Júpiter é o planeta mais grande do Sistema Solar."], "certa": 3, "explicacao": "d) o certo é “mas”"}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["caminho", "casinha", "cafezinho", "livrinho", "florzinha"], "certa": 0, "explicacao": "a) caminho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "O que quer dizer <b>plateia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o público que assiste a um espetáculo", "confusão, situação enrolada", "incomum, surpreendente", "o palco onde os atores se apresentam", "que está em toda parte"], "certa": 0, "explicacao": "a) o público que assiste a um espetáculo. Não é “o palco onde os atores se apresentam”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["gnomo", "abraço", "calor", "tosse", "sorte"], "certa": 0, "explicacao": "a) gnomo — existe por si, mesmo que seja imaginário."}, {"enunciado": "A palavra <b>o/a agente</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "epiceno", "comum de dois", "tem feminino diferente (biforme)", "sobrecomum"], "certa": 2, "explicacao": "c) comum de dois — o agente / a agente: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>emigrante</b>? Responda com a letra.", "alternativas": ["quem anda a cavalo", "quem entra no país", "quem sai do país", "liberação", "aluno"], "certa": 2, "explicacao": "c) quem sai do país — não confunda com “imigrante” (quem entra no país)."}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os hifens", "os répteis", "os mamões", "os pães", "as couve-flores"], "certa": 4, "explicacao": "e) as couve-flores — o certo é as couves-flores."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece por acaso", "que fala ou escreve demais, enrolando", "grosseiro, muito grave (um erro)", "esperto, que percebe tudo rápido", "caprichado e bem-arrumado"], "certa": 1, "explicacao": "b) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>gorila</b>? Responda com a letra.", "alternativas": ["o gorila fêmea", "a gorilaona", "a gorila fêmea", "o gorilazinha", "a gorila"], "certa": 0, "explicacao": "a) o gorila fêmea — gorila é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Ela deu o recado para eu levar.", "O bolo é para mim.", "Felipe trouxe o livro para eu.", "Isso é para eu ler."], "certa": 3, "explicacao": "d) — o certo é “para mim”."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Chegamos às oito horas.", "Começou à chover forte.", "Chegamos ao meio-dia.", "Fiz uma visita àquele museu."], "certa": 2, "explicacao": "c) — o certo é “a chover”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "O verbo <b>expor</b> é de que conjugação? Responda com a letra.", "alternativas": ["4ª conjugação (-or)", "2ª conjugação (-er)", "1ª conjugação (-ar)", "3ª conjugação (-ir)", "não tem conjugação"], "certa": 1, "explicacao": "b) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["veloz, apressado", "esperto, que percebe tudo rápido", "que fala ou escreve demais, enrolando", "intenso, enérgico", "isca, armadilha para enganar"], "certa": 3, "explicacao": "d) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Andei dois quilômetros: dei mais um passo.", "Tomei um chá de camomila.", "O rei morava no paço real.", "O cabelo dela é cumprido e liso.", "Paguei a conta com um cheque."], "certa": 3, "explicacao": "d) — o certo é “comprido” (longo)."}];
const CHAVE='simulado-bonus-5';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
