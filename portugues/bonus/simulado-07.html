<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["giboia", "gesto", "enxergar", "canjica", "mexerica"], "certa": 0, "explicacao": "a) giboia — o certo é jiboia: palavra de origem tupi: j."}, {"enunciado": "“Saíram correndo minhas tias.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Saíram", "minhas tias", "não tem sujeito", "correndo", "o sujeito está escondido (oculto)"], "certa": 1, "explicacao": "b) minhas tias — o sujeito veio depois do verbo. Pergunte: quem saíram?"}, {"enunciado": "Leia: “Consertar o vazamento era premente: a cozinha estava alagando.” Nessa frase, <b>premente</b> quer dizer… Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "que pode esperar", "onde é muito difícil viver", "muitas vezes, com frequência", "urgente"], "certa": 4, "explicacao": "e) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["ro-u-xi-nol", "toa-lha", "nob-re-za", "lou-sa", "o-sso"], "certa": 3, "explicacao": "d) lou-sa — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabiam", "couberam", "cabem", "caberão", "caberam"], "certa": 1, "explicacao": "b) couberam"}, {"enunciado": "Na semana passada, eles ___ no parque. Qual forma completa a frase? Responda com a letra.", "alternativas": ["correriam", "correm", "corriam", "correram", "correrão"], "certa": 3, "explicacao": "d) correram — passado: -am."}, {"enunciado": "“Ele treinou todo dia, portanto ganhou a corrida.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porém", "pois", "caso", "mas", "logo"], "certa": 4, "explicacao": "e) logo — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["resistente (ao calor, a mudanças)", "que derrete fácil", "que acontece por acaso", "mentira, golpe para enganar", "confusão, situação enrolada"], "certa": 0, "explicacao": "a) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["Estudamos a lição e fizemos o desenho.", "Feche a janela, porque vai chover.", "Estudei muito, logo tirei dez.", "Corri muito, contudo perdi o ônibus.", "A festa será no quintal caso não chova."], "certa": 0, "explicacao": "a) Estudamos a lição e fizemos o desenho."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["requeijão", "preguiça", "quintal", "caranguejo", "tranquilo"], "certa": 4, "explicacao": "e) tranquilo — em “tranquilo” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Diga por que você está triste.", "O gelo derreteu porque o dia estava quente?", "Porque o cachorro abana o rabo?", "O gato fugiu, não sei por quê, e voltou à noite.", "Por que razão o bolo afundou?"], "certa": 2, "explicacao": "c) — o certo é “Por que o cachorro abana o rabo?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que não faz mal, sem efeito", "confusão, situação enrolada", "generoso, de coração grande", "preciso, feito com muito cuidado", "curado de uma doença"], "certa": 3, "explicacao": "d) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "Entre mim e você, tudo bem.", "O vovô trouxe o mapa para mim ver.", "Para mim, fazer isso é fácil.", "Para mim, estudar à noite é melhor."], "certa": 2, "explicacao": "c) — o certo é “para eu ver”."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["raíz", "veem", "heroico", "ideia", "chapéu"], "certa": 0, "explicacao": "a) raíz — o certo é raiz: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "“Comprei cola, caderno e régua.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o aposto (uma explicação sobre o nome)", "separa os itens de uma lista", "separa o vocativo (quem é chamado)", "separa o lugar e a data", "separa o sujeito do verbo"], "certa": 1, "explicacao": "b) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "intenso, enérgico", "crítica, ataque", "que passa num instante", "muito pequeno, escasso"], "certa": 0, "explicacao": "a) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>tenho de escrever</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["os dois são principais", "escrever", "não há verbo principal", "tenho", "o sujeito"], "certa": 1, "explicacao": "b) escrever — o principal é o último, o que diz a ação."}, {"enunciado": "Espero que ele ___ à festa. (verbo vir)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["veio", "vem", "viesse", "venha", "vir"], "certa": 3, "explicacao": "d) venha"}, {"enunciado": "Quem nasce no <b>Ceará</b> é… Responda com a letra.", "alternativas": ["indiano", "italiano", "chinês", "grego", "cearense"], "certa": 4, "explicacao": "e) cearense"}, {"enunciado": "O que quer dizer <b>austero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "rico e cheio de enfeites", "rigoroso e sem luxo", "que dura pouco tempo", "que dura muito, que não acaba"], "certa": 2, "explicacao": "c) rigoroso e sem luxo. Não é “rico e cheio de enfeites”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["substantivos que vêm de adjetivos terminam em -eza", "femininos e palavras de origem terminam em -esa", "palavras que indicam país terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "o final -esa sempre se escreve com z"], "certa": 0, "explicacao": "a) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui à praia a pé.", "Fui ao clube e à piscina.", "Chegamos ao meio-dia.", "Chegamos às oito horas.", "Mandei um recado a treinadora."], "certa": 4, "explicacao": "e) — o certo é “à treinadora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "urgente", "grosseiro, muito grave (um erro)", "pequeno, sem importância", "dispensar, não precisar de algo"], "certa": 2, "explicacao": "c) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>fugaz</b>? Responda com a letra.", "alternativas": ["que está em toda parte", "urgente", "honesto, confiável; adequado", "apagar, destruir por completo", "que passa num instante"], "certa": 4, "explicacao": "e) que passa num instante"}, {"enunciado": "Qual palavra quer dizer “alcance, abrangência”? Responda com a letra.", "alternativas": ["ensejo", "arcabouço", "paradigma", "escopo", "contrito"], "certa": 3, "explicacao": "d) escopo"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>verdade</b>? Responda com a letra.", "alternativas": ["mentira", "partir", "empurrar", "noite", "amargo"], "certa": 0, "explicacao": "a) mentira"}, {"enunciado": "Qual é o plural de <b>capitão</b>? Responda com a letra.", "alternativas": ["capitãos", "capitões", "capitãoes", "capitoes", "capitães"], "certa": 4, "explicacao": "e) capitães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>engodo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que traz boas notícias", "que dura pouco tempo", "comida que engorda", "esforço, vontade forte de fazer algo", "isca, armadilha para enganar"], "certa": 4, "explicacao": "e) isca, armadilha para enganar. Não é “comida que engorda”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aonde o rio vai chegar?", "A praia fica a duas horas da cidade.", "Onde os pinguins vivem?", "O bruxo mau transformou o príncipe em sapo.", "Aonde nasce o rio Amazonas?"], "certa": 4, "explicacao": "e) o certo é “Onde”"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
