<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["enchuto", "enchurrada", "larangeira", "salgado", "cangica"], "certa": 3, "explicacao": "d) salgado — vem de sal: l."}, {"enunciado": "“Saiu correndo o time de Felipe.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["correndo", "o time de Felipe", "não tem sujeito", "Saiu", "o sujeito está escondido (oculto)"], "certa": 1, "explicacao": "b) o time de Felipe — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "que tem as pernas compridas", "digno de confiança, verdadeiro", "nunca visto antes, extraordinário", "que não faz mal, sem efeito"], "certa": 0, "explicacao": "a) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["pa-ctu-ar", "de-li-cio-so", "so-sse-go", "a-le-gre", "je-i-to-so"], "certa": 3, "explicacao": "d) a-le-gre — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Ontem ele ___ (verbo <b>dizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["dirá", "dizia", "diz", "disse", "dizeu"], "certa": 3, "explicacao": "d) disse"}, {"enunciado": "Daqui a dois dias, eles ___ ao doce. Qual forma completa a frase? Responda com a letra.", "alternativas": ["resistiam", "resistem", "resistirão", "resistiriam", "resistiram"], "certa": 2, "explicacao": "c) resistirão — futuro: -ão."}, {"enunciado": "“O sorvete ficou no sol, portanto derreteu.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["todavia", "e", "entretanto", "contudo", "logo"], "certa": 4, "explicacao": "e) logo — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["proveitoso, que dá bons resultados", "inútil, perda de tempo", "descuidado, que cai fácil em armadilhas", "esperto, que percebe tudo rápido", "sem nenhum machucado, ileso"], "certa": 0, "explicacao": "a) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["A sopa estava quente, contudo comi rapidinho.", "O time ganha se treinar bastante.", "Não fui à aula, porque estava com febre.", "A ponte caiu, por isso tivemos de voltar.", "Bianca comprou pão e Felipe comprou leite."], "certa": 0, "explicacao": "a) A sopa estava quente, contudo comi rapidinho."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["mangueira", "requeijão", "sequência", "quilo", "mosquito"], "certa": 2, "explicacao": "c) sequência — em “sequência” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O bolo queimou porque ficou muito tempo no forno?", "Porquê o pão cresce no forno?", "Você faltou por quê, afinal?", "O gato fugiu, não sei por quê, e voltou à noite.", "O túnel por que o trem passa é escuro."], "certa": 1, "explicacao": "b) — o certo é “Por que o pão cresce no forno?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Qual é o coletivo de <b>bananas</b>? Responda com a letra.", "alternativas": ["buquê", "penca", "atlas", "molho", "cacho"], "certa": 1, "explicacao": "b) penca — cacho é de outro grupo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "arrogância, ar de superioridade", "totalmente fechado; difícil de entender", "que não está em lugar nenhum", "que está em toda parte"], "certa": 4, "explicacao": "e) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela trouxe o mapa para eu.", "Entre mim e você, tudo bem.", "Sem mim, a festa não teria graça.", "Ela deu o recado para eu levar.", "O bolo é para mim."], "certa": 0, "explicacao": "a) — o certo é “para mim”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Ele tem muitos amigos.", "Havia muita gente na praia.", "Ganhei muitos presentes.", "Comemos muitos pastéis.", "O bolo estava muito gostoso."], "certa": 4, "explicacao": "e) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["hifens", "países", "tórax", "chapéu", "asteróide"], "certa": 4, "explicacao": "e) asteróide — o certo é asteroide: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "“Comprei maçã, pera e banana.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o vocativo (quem é chamado)", "separa o lugar e a data", "separa o aposto (uma explicação sobre o nome)", "separa o sujeito do verbo", "separa os itens de uma lista"], "certa": 4, "explicacao": "e) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "novato, iniciante", "que traz más notícias", "digno de confiança, verdadeiro", "que traz boas notícias"], "certa": 4, "explicacao": "e) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>vou mostrar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "o sujeito", "vou", "mostrar", "os dois são principais"], "certa": 3, "explicacao": "d) mostrar — o principal é o último, o que diz a ação."}, {"enunciado": "Se eu ___ a mesa, ficaria contente. (verbo pôr)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["ponha", "pusesse", "ponho", "pôr", "pus"], "certa": 1, "explicacao": "b) pusesse"}, {"enunciado": "Situação: Bianca atende o telefone.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Credo!", "Alô!", "Cuidado!", "Cruzes!", "Argh!"], "certa": 1, "explicacao": "b) Alô! — chamado."}, {"enunciado": "Quem nasce no <b>Amapá</b> é… Responda com a letra.", "alternativas": ["canadense", "amapaense", "palmense", "pessoense", "francês"], "certa": 1, "explicacao": "b) amapaense"}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que discute e argumenta demais", "esperto, que percebe tudo rápido", "urgente", "arrependido", "grosseiro, muito grave (um erro)"], "certa": 1, "explicacao": "b) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>guarda-chuva</b>? Responda com a letra.", "alternativas": ["guardas-chuva", "guardas-chuvas", "guarda-chuvas", "guarda-chuvaes", "guarda-chuva"], "certa": 2, "explicacao": "c) guarda-chuvas"}, {"enunciado": "Por que a palavra <b>rosa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s", "ss pode começar uma palavra", "entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "Como se lê <b>papa João XXIII</b>? Responda com a letra.", "alternativas": ["vinte e quatro", "23", "vigésimo terceiro", "vinte e dois", "vinte e três"], "certa": 4, "explicacao": "e) vinte e três — depois do décimo, lê-se como cardinal."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Ricardo vai a sorveteria.", "Passeamos a cavalo.", "Comemos bife à milanesa.", "Fui ao clube e à piscina."], "certa": 1, "explicacao": "b) — o certo é “à sorveteria”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "breve e direto", "caro, que custa muito", "dispensar, não precisar de algo", "cheio de detalhes"], "certa": 1, "explicacao": "b) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>voraz</b>? Responda com a letra.", "alternativas": ["que se recupera depois das dificuldades", "vencer, controlar (um incêndio, uma crise)", "totalmente fechado; difícil de entender", "que come muito, faminto", "oportunidade, ocasião"], "certa": 3, "explicacao": "d) que come muito, faminto"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
