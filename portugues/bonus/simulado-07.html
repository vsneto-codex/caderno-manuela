<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["saugado", "geito", "gorgeta", "xampu", "boxecha"], "certa": 3, "explicacao": "d) xampu — com x, de cor; m antes de p."}, {"enunciado": "“Chegou cedo o irmão mais velho de Otávio.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "Chegou", "o irmão mais velho de Otávio", "cedo", "não tem sujeito"], "certa": 2, "explicacao": "c) o irmão mais velho de Otávio — o sujeito veio depois do verbo. Pergunte: quem chegou?"}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esbanjador, que gasta demais", "que pode esperar", "arrependido", "urgente"], "certa": 4, "explicacao": "e) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["as-so-bi-o", "a-sso-bi-ar", "sor-ve-te-ria", "pob-re-za", "ré-ptil"], "certa": 0, "explicacao": "a) as-so-bi-o — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Ontem eles ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["queriam", "quererão", "quereram", "quiseram", "querem"], "certa": 3, "explicacao": "d) quiseram"}, {"enunciado": "No ano que vem, eles ___ corda. Qual forma completa a frase? Responda com a letra.", "alternativas": ["pulavam", "pularam", "pulariam", "pularão", "pulam"], "certa": 3, "explicacao": "d) pularão — futuro: -ão."}, {"enunciado": "“A casa é velha, todavia é muito bonita.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porque", "entretanto", "logo", "caso", "já que"], "certa": 1, "explicacao": "b) entretanto — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que derrete fácil", "tão bom que não dá para descrever com palavras", "resistente (ao calor, a mudanças)", "caro, que custa muito", "espantado, sem reação"], "certa": 2, "explicacao": "c) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Ele treinou todo dia, portanto ganhou a corrida.", "Desligue a luz, porque vamos economizar energia.", "A planta cresce caso receba água.", "O sol saiu e as flores abriram.", "Felipe queria jogar, porém estava com febre."], "certa": 0, "explicacao": "a) Ele treinou todo dia, portanto ganhou a corrida."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["cinquenta", "esquilo", "quilo", "mosquito", "figueira"], "certa": 0, "explicacao": "a) cinquenta — em “cinquenta” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que o mar tem ondas", "A janela por que o gato fugiu ficou aberta.", "Você está bravo porque perdeu o jogo?", "Aquele porque era o mais estranho de todos.", "O pneu furou; eis por que chegamos atrasados."], "certa": 3, "explicacao": "d) — o certo é “Aquele porquê era o mais estranho de todos.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Qual é o coletivo de <b>navios</b>? Responda com a letra.", "alternativas": ["frota", "cardume", "tropa", "esquadrilha", "arquipélago"], "certa": 0, "explicacao": "a) frota — esquadrilha é de outro grupo."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "preciso, feito com muito cuidado", "curado de uma doença", "nunca visto antes, extraordinário", "esbanjador, que gasta demais"], "certa": 1, "explicacao": "b) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Trouxe o lápis para eu desenhar.", "Para mim, fazer isso é fácil.", "Isso é para eu ler.", "Felipe trouxe o livro para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Ganhei muitos presentes.", "Choveu muito ontem.", "Ele tem muitos amigos.", "Havia muita gente na praia.", "Muitos alunos faltaram."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ideia", "veem", "álbum", "papéis", "estóico"], "certa": 4, "explicacao": "e) estóico — o certo é estoico: ei e oi abertos NÃO levam acento quando a força está na penúltima sílaba (ideia, jiboia) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "“Bianca, venha jantar!”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o vocativo (quem é chamado)", "separa o sujeito do verbo", "separa os itens de uma lista", "separa o lugar e a data", "separa o aposto (uma explicação sobre o nome)"], "certa": 0, "explicacao": "a) separa o vocativo (quem é chamado) — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["crítica, ataque", "defesa, elogio de uma ideia", "confusão, situação enrolada", "pouco, escasso", "intenso, enérgico"], "certa": 1, "explicacao": "b) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>quero plantar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["o sujeito", "os dois são principais", "quero", "não há verbo principal", "plantar"], "certa": 4, "explicacao": "e) plantar — o principal é o último, o que diz a ação."}, {"enunciado": "Quando eu ___ a mesa, conto para você. (verbo pôr)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["puser", "pus", "ponha", "ponho", "pôr"], "certa": 0, "explicacao": "a) puser"}, {"enunciado": "Situação: Um carro vem rápido e o amigo vai atravessar a rua.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Eca!", "Ora bolas!", "Cuidado!", "Socorro!", "Apoiado!"], "certa": 2, "explicacao": "c) Cuidado! — advertência."}, {"enunciado": "Quem nasce em <b>Campo Grande</b> é… Responda com a letra.", "alternativas": ["chinês", "cearense", "colombiano", "campo-grandense", "mineiro"], "certa": 3, "explicacao": "d) campo-grandense"}, {"enunciado": "O que quer dizer <b>austero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["resistente (ao calor, a mudanças)", "que não faz mal, sem efeito", "rigoroso e sem luxo", "rico e cheio de enfeites", "aliviar, diminuir (uma dor, um problema)"], "certa": 2, "explicacao": "c) rigoroso e sem luxo. Não é “rico e cheio de enfeites”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>música</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z", "depois de consoante, um s só já tem som de s"], "certa": 3, "explicacao": "d) entre vogais, o s tem som de z"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui a praça.", "Viajei a Roma e à Itália.", "Começou a chover à noite.", "Comemos bife à milanesa.", "Fiz uma visita àquele museu."], "certa": 0, "explicacao": "a) — o certo é “à praça”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "nunca visto antes, extraordinário", "pequeno, sem importância", "arrogância, ar de superioridade", "grosseiro, muito grave (um erro)"], "certa": 4, "explicacao": "e) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>epíteto</b>? Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "remédio para todos os males", "fraco, fino, delicado", "generoso, de coração grande", "apelido ou qualificativo"], "certa": 4, "explicacao": "e) apelido ou qualificativo"}, {"enunciado": "Qual palavra quer dizer “rigoroso e sem luxo”? Responda com a letra.", "alternativas": ["profícuo", "pródigo", "austero", "fleuma", "recrudescer"], "certa": 2, "explicacao": "c) austero"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>começo</b>? Responda com a letra.", "alternativas": ["fim", "comprido", "impossível", "sair", "noite"], "certa": 0, "explicacao": "a) fim"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
