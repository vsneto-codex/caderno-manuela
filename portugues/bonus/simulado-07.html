<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["giboia", "gesto", "enxergar", "canjica", "mexerica"], "certa": 0, "explicacao": "a) giboia — o certo é jiboia: palavra de origem tupi: j."}, {"enunciado": "“Saiu correndo o irmão mais velho de Otávio.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Saiu", "o irmão mais velho de Otávio", "não tem sujeito", "correndo", "o sujeito está escondido (oculto)"], "certa": 1, "explicacao": "b) o irmão mais velho de Otávio — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Leia: “Consertar o vazamento era premente: a cozinha estava alagando.” Nessa frase, <b>premente</b> quer dizer… Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "que pode esperar", "onde é muito difícil viver", "muitas vezes, com frequência", "urgente"], "certa": 4, "explicacao": "e) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["ro-u-xi-nol", "toa-lha", "nob-re-za", "lou-sa", "o-sso"], "certa": 3, "explicacao": "d) lou-sa — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Ontem eles ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["faziam", "fizeram", "fazem", "farão", "fazeram"], "certa": 1, "explicacao": "b) fizeram"}, {"enunciado": "Amanhã, eles ___ música. Qual forma completa a frase? Responda com a letra.", "alternativas": ["escutavam", "escutarão", "escutariam", "escutaram", "escutam"], "certa": 1, "explicacao": "b) escutarão — futuro: -ão."}, {"enunciado": "“Bianca leu o livro inteiro, portanto sabe a história de cor.”<br>Qual conjunção pode ficar no lugar de <b>portanto</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["já que", "mas", "contudo", "entretanto", "por isso"], "certa": 4, "explicacao": "e) por isso — as duas dão ideia de conclusão."}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que traz boas notícias", "que derrete fácil", "incomum, surpreendente", "breve e direto", "resistente (ao calor, a mudanças)"], "certa": 4, "explicacao": "e) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["O gato é pequeno, porém é muito corajoso.", "O cachorro latiu e o gato miou.", "Coma a salada, porque faz bem à saúde.", "Você chega cedo caso pegue o ônibus das sete.", "O pneu furou, logo chegamos atrasados."], "certa": 1, "explicacao": "b) O cachorro latiu e o gato miou."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["guitarra", "esquilo", "mosquito", "requeijão", "cinquenta"], "certa": 4, "explicacao": "e) cinquenta — em “cinquenta” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Não há por que ter medo do escuro.", "O ônibus parou no meio da estrada, e o motorista não sabe por quê.", "— Não vou à praia. — Por quê?", "Porque motivo você faltou?", "O caminho por que passei estava cheio de flores."], "certa": 3, "explicacao": "d) — o certo é “Por que motivo você faltou?”: vem antes de uma palavra como motivo ou razão: troque por “por qual”."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["curado de uma doença", "arrependido", "confusão, situação enrolada", "grosseiro, muito grave (um erro)", "preciso, feito com muito cuidado"], "certa": 4, "explicacao": "e) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "Trouxe o lápis para eu desenhar.", "O bolo é para mim.", "Para mim, fazer isso é fácil.", "A professora trouxe o livro para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["juiz", "voo", "saúde", "item", "tatú"], "certa": 4, "explicacao": "e) tatú — o certo é tatu: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "“Comprei caderno, régua e cola.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa os itens de uma lista", "separa o vocativo (quem é chamado)", "separa o lugar e a data", "separa o sujeito do verbo", "separa o aposto (uma explicação sobre o nome)"], "certa": 0, "explicacao": "a) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito pequeno, escasso", "oportunidade, ocasião", "defesa, elogio de uma ideia", "crítica, ataque", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 2, "explicacao": "c) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>comecei a desenhar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["os dois são principais", "não há verbo principal", "o sujeito", "desenhar", "comecei"], "certa": 3, "explicacao": "d) desenhar — o principal é o último, o que diz a ação."}, {"enunciado": "Quando eu ___ o filme, conto para você. (verbo ver)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["vejo", "ver", "vi", "vir", "veja"], "certa": 3, "explicacao": "d) vir"}, {"enunciado": "Quem nasce em <b>Itália</b> é… Responda com a letra.", "alternativas": ["egípcio", "italiano", "maceioense", "espanhol", "piauiense"], "certa": 1, "explicacao": "b) italiano"}, {"enunciado": "O que quer dizer <b>austero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muitas vezes, com frequência", "que arma truques para enganar", "rico e cheio de enfeites", "intenso, enérgico", "rigoroso e sem luxo"], "certa": 4, "explicacao": "e) rigoroso e sem luxo. Não é “rico e cheio de enfeites”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>camisa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["ss pode começar uma palavra", "entre vogais, o s tem som de z", "entre vogais, o som de s se escreve com ss", "depois de consoante, um s só já tem som de s", "no começo da palavra, o s tem som de s"], "certa": 1, "explicacao": "b) entre vogais, o s tem som de z"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos às oito horas.", "Fotografei à praia.", "Comemos bife à milanesa.", "Às vezes, durmo à tarde.", "Fiz uma visita àquele museu."], "certa": 1, "explicacao": "b) — o certo é “a praia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "nunca visto antes, extraordinário", "remédio para todos os males", "resistente (ao calor, a mudanças)", "pequeno, sem importância"], "certa": 0, "explicacao": "a) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>tácito</b>? Responda com a letra.", "alternativas": ["combinado sem precisar falar, subentendido", "resistente (ao calor, a mudanças)", "que não se pode impedir, implacável", "lindo, perfeito", "covarde"], "certa": 0, "explicacao": "a) combinado sem precisar falar, subentendido"}, {"enunciado": "Qual palavra quer dizer “investigar a fundo”? Responda com a letra.", "alternativas": ["panaceia", "inóspito", "inerente", "perscrutar", "epíteto"], "certa": 3, "explicacao": "d) perscrutar"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>verdade</b>? Responda com a letra.", "alternativas": ["desligar", "desonesto", "empurrar", "mentira", "guerra"], "certa": 3, "explicacao": "d) mentira"}, {"enunciado": "Qual é o plural de <b>capitão</b>? Responda com a letra.", "alternativas": ["capitões", "capitoes", "capitãoes", "capitãos", "capitães"], "certa": 4, "explicacao": "e) capitães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>engodo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "vencer, controlar (um incêndio, uma crise)", "que acontece fora de hora", "comida que engorda", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 0, "explicacao": "a) isca, armadilha para enganar. Não é “comida que engorda”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O gato é pequeno, mas é muito corajoso.", "O carro estava mal estacionado na calçada.", "Tentei abrir o pote, mais a tampa estava presa.", "O guepardo é o animal terrestre mais rápido do mundo.", "Felipe dormiu mal porque o vizinho fez barulho."], "certa": 2, "explicacao": "c) o certo é “mas”"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
