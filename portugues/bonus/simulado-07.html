<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Se vocês ___ em casa, avisem. (verbo estar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["estiveram", "estiverem", "estejam", "estão", "estar"], "certa": 1, "explicacao": "b) estiverem"}, {"enunciado": "A palavra <b>o/a pianista</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "epiceno", "tem feminino diferente (biforme)", "não tem gênero", "comum de dois"], "certa": 4, "explicacao": "e) comum de dois — o pianista / a pianista: a palavra é igual, o artigo muda."}, {"enunciado": "Ontem ele ___ (verbo <b>trazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["trazia", "traz", "trazeu", "trouxe", "trará"], "certa": 3, "explicacao": "d) trouxe"}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "urgente", "confirmar, reforçar uma ideia", "digno de confiança, verdadeiro", "oportunidade, ocasião"], "certa": 1, "explicacao": "b) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>cabeça</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["antes de e e i, o c já tem som de s", "ç pode aparecer no começo da palavra", "antes de e e i se usa ç", "ç só se usa antes de a, o e u", "antes de a, o e u, o c tem som de k"], "certa": 3, "explicacao": "d) ç só se usa antes de a, o e u"}, {"enunciado": "Amanhã, eles ___ o quarto. Qual forma completa a frase? Responda com a letra.", "alternativas": ["limpavam", "limpam", "limpariam", "limparão", "limparam"], "certa": 3, "explicacao": "d) limparão — futuro: -ão."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Começou a chover à noite.", "Comemos bife à milanesa.", "Bianca foi a praça.", "Ficaram frente a frente.", "Às vezes, durmo à tarde."], "certa": 2, "explicacao": "c) — o certo é “à praça”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que derrete fácil", "esforço, vontade forte de fazer algo", "preciso, feito com muito cuidado", "dispensar, não precisar de algo", "resistente (ao calor, a mudanças)"], "certa": 4, "explicacao": "e) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["baú", "hifens", "órfã", "tórax", "ruím"], "certa": 4, "explicacao": "e) ruím — o certo é ruim: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["pac-tuar", "ou-vir", "ga-rra-fa", "bi-cic-le-ta", "se-is-cen-tos"], "certa": 1, "explicacao": "b) ou-vir — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["preciso, feito com muito cuidado", "curado de uma doença", "esperto, que percebe tudo rápido", "excelente, muito habilidoso", "esforço, vontade forte de fazer algo"], "certa": 0, "explicacao": "a) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["exceto", "esceto", "eceto", "eseto", "esseto"], "certa": 0, "explicacao": "a) exceto — com xc, como exceção."}, {"enunciado": "De que duas palavras se forma <b>nisso</b>? Responda com a letra.", "alternativas": ["em + aquilo", "em + issa", "em + isso", "ni + isso", "de + isso"], "certa": 2, "explicacao": "c) em + isso"}, {"enunciado": "Na locução verbal <b>comecei a varrer</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["varrer", "os dois são principais", "comecei", "não há verbo principal", "o sujeito"], "certa": 0, "explicacao": "a) varrer — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "exibido, que usa palavras difíceis só para se mostrar", "crítica, ataque", "defesa, elogio de uma ideia", "confusão, situação enrolada"], "certa": 3, "explicacao": "d) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>95º</b> por extenso? Responda com a letra.", "alternativas": ["octogésimo quinto", "nonagésimo sexto", "centésimo quinto", "noventésimo quinto", "nonagésimo quinto"], "certa": 4, "explicacao": "e) nonagésimo quinto"}, {"enunciado": "Ontem eu ___ (verbo <b>propor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["propori", "propôs", "propi", "propus", "proponhei"], "certa": 3, "explicacao": "d) propus — propor segue pôr: eu pus → eu propus."}, {"enunciado": "O que quer dizer <b>austero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rico e cheio de enfeites", "combinado sem precisar falar, subentendido", "defesa, elogio de uma ideia", "preciso, feito com muito cuidado", "rigoroso e sem luxo"], "certa": 4, "explicacao": "e) rigoroso e sem luxo. Não é “rico e cheio de enfeites”: essa é a pegadinha."}, {"enunciado": "Na frase “A vela apagou <b>porque</b> bateu um vento.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "por isso", "porém", "por qual", "o motivo"], "certa": 0, "explicacao": "a) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Por que a palavra <b>mexer</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["palavras que vêm de outras com ch usam x", "depois de ditongo se usa x", "depois de ditongo se usa ch", "depois de en- se usa x", "depois de me- se usa x"], "certa": 4, "explicacao": "e) depois de me- se usa x"}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "esbanjador, que gasta demais", "mínimo, o menor de todos", "pequeno, sem importância", "dispensar, não precisar de algo"], "certa": 0, "explicacao": "a) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles nadarão na piscina.", "Na semana passada, eles limparam o quarto.", "Hoje de manhã, eles voltaram para casa.", "Na semana passada, eles pintaram um quadro.", "No ano que vem, eles tocarão violão."], "certa": 0, "explicacao": "a) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Por que a palavra <b>chapéu</b> tem acento? Responda com a letra.", "alternativas": ["oxítona (força na última sílaba) terminada em a leva acento", "éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói)", "toda proparoxítona (a força na antepenúltima sílaba) tem acento", "oxítona terminada em em ou ens leva acento", "paroxítona terminada em um ou uns leva acento"], "certa": 1, "explicacao": "b) éi, éu e ói abertos levam acento na última sílaba (papéis, chapéu, herói) (cha-péu)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["a dia", "o diadema", "a cal", "o tema", "a tribo"], "certa": 0, "explicacao": "a) a dia — o certo é “o dia”."}, {"enunciado": "O que quer dizer <b>engodo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "caro, que custa muito", "comida que engorda", "tão bom que não dá para descrever com palavras", "firme e calmo diante do sofrimento"], "certa": 0, "explicacao": "a) isca, armadilha para enganar. Não é “comida que engorda”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["sólido", "mágico", "máscara", "órfãos", "bússola"], "certa": 3, "explicacao": "d) órfãos — ór-fãos: é paroxítona."}, {"enunciado": "Leia: “Procure informações em sites fidedignos.” Nessa frase, <b>fidedignos</b> quer dizer… Responda com a letra.", "alternativas": ["nunca visto antes, extraordinário", "defesa, elogio de uma ideia", "digno de confiança, verdadeiro", "duvidoso, suspeito", "que acontece por acaso"], "certa": 2, "explicacao": "c) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Para mim, estudar à noite é melhor.", "Sem mim, a festa não teria graça.", "O vovô trouxe o mapa para mim ver.", "Entre mim e você, tudo bem."], "certa": 3, "explicacao": "d) — o certo é “para eu ver”."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>bom</b>? Responda com a letra.", "alternativas": ["melhoríssimo", "ótimo", "magríssimo", "agílimo", "paupérrimo"], "certa": 1, "explicacao": "b) ótimo"}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["guizo", "cinquenta", "quente", "esquerda", "foguete"], "certa": 1, "explicacao": "b) cinquenta — em “cinquenta” a gente fala o u"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
