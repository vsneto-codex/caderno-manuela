<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["saugado", "geito", "gorgeta", "jiboia", "boxecha"], "certa": 3, "explicacao": "d) jiboia — palavra de origem tupi: j."}, {"enunciado": "“Venceu o campeonato o irmão mais velho de Otávio.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Venceu", "o", "o irmão mais velho de Otávio", "o sujeito está escondido (oculto)"], "certa": 3, "explicacao": "d) o irmão mais velho de Otávio — o sujeito veio depois do verbo. Pergunte: quem venceu?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Eles leem um livro por semana.", "Eles creem em fadas.", "Passamos por uma ponte.", "Ontem ele não pode sair.", "O polo norte é gelado."], "certa": 3, "explicacao": "d) — o certo é “Ontem ele não pôde…”."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem as pernas compridas", "exibido, que usa palavras difíceis só para se mostrar", "ligado à vida simples e tranquila do campo", "que dura muito, que não acaba", "esbanjador, que gasta demais"], "certa": 1, "explicacao": "b) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["su-bma-ri-no", "ex-ce-to", "ra-i-va", "fe-rru-gem", "joa-ni-nha"], "certa": 1, "explicacao": "b) ex-ce-to — rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Ontem eles ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["farão", "fazem", "faziam", "fizeram", "fazeram"], "certa": 3, "explicacao": "d) fizeram"}, {"enunciado": "Hoje de manhã, eles ___ o quintal. Qual forma completa a frase? Responda com a letra.", "alternativas": ["varrerão", "varriam", "varreram", "varrem", "varreriam"], "certa": 2, "explicacao": "c) varreram — passado: -am."}, {"enunciado": "“Leve o casaco, pois vai esfriar.”<br>Qual conjunção pode ficar no lugar de <b>pois</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["portanto", "por isso", "já que", "mas", "entretanto"], "certa": 2, "explicacao": "c) já que — as duas dão ideia de explicação."}, {"enunciado": "O que quer dizer <b>profícuo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "inútil, perda de tempo", "que arma truques para enganar", "proveitoso, que dá bons resultados", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 3, "explicacao": "d) proveitoso, que dá bons resultados. Não é “inútil, perda de tempo”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>adição</b>? Responda com a letra.", "alternativas": ["A planta cresce se receber água.", "Bianca comprou pão e Felipe comprou leite.", "O gato é pequeno, entretanto é muito corajoso.", "O cachorro latiu a noite toda, portanto ninguém dormiu.", "Coma a salada, porque faz bem à saúde."], "certa": 1, "explicacao": "b) Bianca comprou pão e Felipe comprou leite."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["cinquenta", "quilo", "quente", "requeijão", "guitarra"], "certa": 0, "explicacao": "a) cinquenta — em “cinquenta” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você não comeu porque estava sem fome?", "Porque você não veio à festa?", "Ninguém explicou por que a aula acabou mais cedo.", "O gato fugiu, não sei por quê, e voltou à noite.", "Você faltou por quê, afinal?"], "certa": 1, "explicacao": "b) — o certo é “Por que você não veio à festa?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Qual é o coletivo de <b>soldados</b>? Responda com a letra.", "alternativas": ["frota", "tropa", "constelação", "multidão", "bando"], "certa": 1, "explicacao": "b) tropa — frota é de outro grupo."}, {"enunciado": "O que quer dizer <b>ubíquo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["o público que assiste a um espetáculo", "generoso, de coração grande", "que não está em lugar nenhum", "que está em toda parte", "que passa num instante"], "certa": 3, "explicacao": "d) que está em toda parte. Não é “que não está em lugar nenhum”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Trouxe o lápis para eu desenhar.", "Para mim, fazer isso é fácil.", "Ela trouxe o livro para eu.", "Isso é para eu ler.", "Entre mim e você, tudo bem."], "certa": 2, "explicacao": "c) — o certo é “para mim”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitos alunos faltaram.", "Felipe dormiu muito.", "Ele tem muitos amigos.", "Ela leu muitos livros.", "Vi muitos pássaros."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["vírus", "órfã", "hifens", "lápis", "abacaxí"], "certa": 4, "explicacao": "e) abacaxí — o certo é abacaxi: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "“Ricardo, meu primo, chegou cedo.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o sujeito do verbo", "separa o aposto (uma explicação sobre o nome)", "separa os itens de uma lista", "separa o lugar e a data", "separa o vocativo (quem é chamado)"], "certa": 1, "explicacao": "b) separa o aposto (uma explicação sobre o nome) — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>alvissareiro</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arma truques para enganar", "que traz más notícias", "que fala ou escreve demais, enrolando", "proveitoso, que dá bons resultados", "que traz boas notícias"], "certa": 4, "explicacao": "e) que traz boas notícias. Não é “que traz más notícias”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>quero morar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["morar", "o sujeito", "não há verbo principal", "quero", "os dois são principais"], "certa": 0, "explicacao": "a) morar — o principal é o último, o que diz a ação."}, {"enunciado": "Quando eu ___ a resposta, conto para você. (verbo saber)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["souber", "sei", "saiba", "soube", "saber"], "certa": 0, "explicacao": "a) souber"}, {"enunciado": "Quem nasce no <b>Paraguai</b> é… Responda com a letra.", "alternativas": ["florianopolitano", "carioca", "mineiro", "paraguaio", "irlandês"], "certa": 3, "explicacao": "d) paraguaio"}, {"enunciado": "O que quer dizer <b>arguto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["vencer, controlar (um incêndio, uma crise)", "esperto, que percebe tudo rápido", "que fala pouco, de poucas palavras", "ligado à vida simples e tranquila do campo", "que discute e argumenta demais"], "certa": 1, "explicacao": "b) esperto, que percebe tudo rápido. Não é “que discute e argumenta demais”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>arco-íris</b>? Responda com a letra.", "alternativas": ["arcos-íris", "arcos-íriss", "arco-írises", "arco-íris", "arco-íriss"], "certa": 3, "explicacao": "d) arco-íris"}, {"enunciado": "Por que a palavra <b>açúcar</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["antes de e e i se usa ç", "antes de e e i, o c já tem som de s", "antes de a, o e u, o c tem som de k", "ç pode aparecer no começo da palavra", "ç só se usa antes de a, o e u"], "certa": 4, "explicacao": "e) ç só se usa antes de a, o e u"}, {"enunciado": "Como se lê <b>século XXI</b>? Responda com a letra.", "alternativas": ["vinte", "vinte e dois", "vinte e um", "vigésimo primeiro", "21"], "certa": 2, "explicacao": "c) vinte e um — depois do décimo, lê-se como cardinal."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Entreguei o presente a ela.", "Falei a pessoas da fila.", "Voltei a farmácia.", "Fui ao clube e à piscina."], "certa": 3, "explicacao": "d) — o certo é “à farmácia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>conciso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "lento para entender", "exibido, que usa palavras difíceis só para se mostrar", "breve e direto", "cheio de detalhes"], "certa": 3, "explicacao": "d) breve e direto. Não é “cheio de detalhes”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>sagaz</b>? Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "isca, armadilha para enganar", "que acontece fora de hora", "esperto, astuto", "ver de longe, perceber um pouco"], "certa": 3, "explicacao": "d) esperto, astuto"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
