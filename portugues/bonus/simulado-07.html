<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["saugado", "geito", "gorgeta", "xampu", "boxecha"], "certa": 3, "explicacao": "d) xampu — com x, de cor; m antes de p."}, {"enunciado": "“Venceu o campeonato o irmão mais velho de Otávio.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Venceu", "o", "o irmão mais velho de Otávio", "o sujeito está escondido (oculto)"], "certa": 3, "explicacao": "d) o irmão mais velho de Otávio — o sujeito veio depois do verbo. Pergunte: quem venceu?"}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem nenhum machucado, ileso", "esbanjador, que gasta demais", "que pode esperar", "arrependido", "urgente"], "certa": 4, "explicacao": "e) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["as-so-bi-o", "a-sso-bi-ar", "sor-ve-te-ria", "pob-re-za", "ré-ptil"], "certa": 0, "explicacao": "a) as-so-bi-o — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Ontem eles ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabiam", "caberão", "caberam", "couberam", "cabem"], "certa": 3, "explicacao": "d) couberam"}, {"enunciado": "No ano que vem, eles ___ corda. Qual forma completa a frase? Responda com a letra.", "alternativas": ["pulavam", "pularam", "pulariam", "pularão", "pulam"], "certa": 3, "explicacao": "d) pularão — futuro: -ão."}, {"enunciado": "“A sopa estava quente, todavia comi rapidinho.”<br>Qual conjunção pode ficar no lugar de <b>todavia</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porque", "entretanto", "logo", "caso", "já que"], "certa": 1, "explicacao": "b) entretanto — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que derrete fácil", "tão bom que não dá para descrever com palavras", "resistente (ao calor, a mudanças)", "caro, que custa muito", "espantado, sem reação"], "certa": 2, "explicacao": "c) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Ele treinou todo dia, portanto ganhou a corrida.", "Desligue a luz, porque vamos economizar energia.", "A planta cresce caso receba água.", "O sol saiu e as flores abriram.", "Felipe queria jogar, porém estava com febre."], "certa": 0, "explicacao": "a) Ele treinou todo dia, portanto ganhou a corrida."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["cinquenta", "esquilo", "quilo", "mosquito", "figueira"], "certa": 0, "explicacao": "a) cinquenta — em “cinquenta” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Por que o mar tem ondas", "A janela por que o gato fugiu ficou aberta.", "Você está bravo porque perdeu o jogo?", "Aquele porque era o mais estranho de todos.", "O pneu furou; eis por que chegamos atrasados."], "certa": 3, "explicacao": "d) — o certo é “Aquele porquê era o mais estranho de todos.”: quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "Qual é o coletivo de <b>estrelas</b>? Responda com a letra.", "alternativas": ["constelação", "arquipélago", "cordilheira", "galáxia", "frota"], "certa": 0, "explicacao": "a) constelação — galáxia é de outro grupo."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "preciso, feito com muito cuidado", "curado de uma doença", "nunca visto antes, extraordinário", "esbanjador, que gasta demais"], "certa": 1, "explicacao": "b) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Trouxe o lápis para eu desenhar.", "Para mim, fazer isso é fácil.", "Isso é para eu ler.", "Felipe trouxe o caderno para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["juíz", "item", "saúde", "órfã", "países"], "certa": 0, "explicacao": "a) juíz — o certo é juiz: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "“Comprei manga, maçã e laranja.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o aposto (uma explicação sobre o nome)", "separa o vocativo (quem é chamado)", "separa o lugar e a data", "separa os itens de uma lista", "separa o sujeito do verbo"], "certa": 3, "explicacao": "d) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "crítica, ataque", "mínimo, o menor de todos", "defesa, elogio de uma ideia", "muito pequeno, escasso"], "certa": 3, "explicacao": "d) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>vou meter</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["meter", "vou", "os dois são principais", "o sujeito", "não há verbo principal"], "certa": 0, "explicacao": "a) meter — o principal é o último, o que diz a ação."}, {"enunciado": "Espero que ele ___ o primeiro da fila. (verbo ser)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["seje", "seja", "foi", "ser", "é"], "certa": 1, "explicacao": "b) seja"}, {"enunciado": "Quem nasce em <b>Rio de Janeiro (cidade)</b> é… Responda com a letra.", "alternativas": ["carioca", "angolano", "espanhol", "fluminense", "roraimense"], "certa": 0, "explicacao": "a) carioca"}, {"enunciado": "O que quer dizer <b>austero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rigoroso e sem luxo", "rico e cheio de enfeites", "combinado sem precisar falar, subentendido", "vencer, controlar (um incêndio, uma crise)", "inconveniente; fora do assunto"], "certa": 0, "explicacao": "a) rigoroso e sem luxo. Não é “rico e cheio de enfeites”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>camisa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["depois de consoante, um s só já tem som de s", "ss pode começar uma palavra", "entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z", "no começo da palavra, o s tem som de s"], "certa": 3, "explicacao": "d) entre vogais, o s tem som de z"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Viajei a Roma e à Itália.", "Vamos a fazenda.", "Entreguei o presente a ela.", "Falei a pessoas da fila."], "certa": 2, "explicacao": "c) — o certo é “à fazenda”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "muito pequeno, escasso", "pequeno, sem importância", "grosseiro, muito grave (um erro)", "arrogância, ar de superioridade"], "certa": 3, "explicacao": "d) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>premente</b>? Responda com a letra.", "alternativas": ["jeito próprio de alguém", "que passa num instante", "esbanjador, que gasta demais", "fora da época certa", "urgente"], "certa": 4, "explicacao": "e) urgente"}, {"enunciado": "Qual palavra quer dizer “frieza, calma inabalável”? Responda com a letra.", "alternativas": ["efêmero", "arrefecer", "fleuma", "tergiversar", "ostracismo"], "certa": 2, "explicacao": "c) fleuma"}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>puxar</b>? Responda com a letra.", "alternativas": ["esconder", "avarento", "empurrar", "longe", "mentira"], "certa": 2, "explicacao": "c) empurrar"}, {"enunciado": "Qual é o plural de <b>leão</b>? Responda com a letra.", "alternativas": ["leões", "leães", "leãos", "leoes", "leãoes"], "certa": 0, "explicacao": "a) leões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>engodo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "isca, armadilha para enganar", "comida que engorda", "ligado à vida simples e tranquila do campo", "aliviar, diminuir (uma dor, um problema)"], "certa": 1, "explicacao": "b) isca, armadilha para enganar. Não é “comida que engorda”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
