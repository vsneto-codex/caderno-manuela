<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 7 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 7 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "“— Eu preciso de ajuda aqui — contou Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo contou que precisa de ajuda aqui.", "Ricardo contou que eu precisava de ajuda ali.", "Ricardo contou que eu preciso de ajuda aqui.", "Ricardo contou que precisava de ajuda aqui.", "Ricardo contou que precisava de ajuda ali."], "certa": 4, "explicacao": "e) Ricardo contou que precisava de ajuda ali."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["saugado", "geito", "gorgeta", "jiboia", "boxecha"], "certa": 3, "explicacao": "d) jiboia — palavra de origem tupi: j."}, {"enunciado": "“Apareceu de repente Felipe.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Apareceu", "o sujeito está escondido (oculto)", "de", "Felipe", "não tem sujeito"], "certa": 3, "explicacao": "d) Felipe — o sujeito veio depois do verbo. Pergunte: quem apareceu?"}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["urgente", "ligado à vida simples e tranquila do campo", "que pode esperar", "incomum, surpreendente", "lento para entender"], "certa": 0, "explicacao": "a) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["ca-cto", "sob-ran-ce-lha", "se-ssão", "ba-leia", "a-pren-der"], "certa": 4, "explicacao": "e) a-pren-der — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["terão", "tiveram", "têm", "tinham", "teram"], "certa": 1, "explicacao": "b) tiveram"}, {"enunciado": "Amanhã, eles ___ um quadro. Qual forma completa a frase? Responda com a letra.", "alternativas": ["pintarão", "pintavam", "pintam", "pintaram", "pintariam"], "certa": 0, "explicacao": "a) pintarão — futuro: -ão."}, {"enunciado": "“O bolo era bonito, contudo estava sem açúcar.”<br>Qual conjunção pode ficar no lugar de <b>contudo</b> sem mudar o sentido? Responda com a letra.", "alternativas": ["porque", "todavia", "por isso", "pois", "logo"], "certa": 1, "explicacao": "b) todavia — as duas dão ideia de oposição."}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "resistente (ao calor, a mudanças)", "que fala pouco, de poucas palavras", "mínimo, o menor de todos", "que derrete fácil"], "certa": 1, "explicacao": "b) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["O time ganha caso treine bastante.", "O sorvete ficou no sol, por isso derreteu.", "Choveu e ventou.", "O filme era longo, porém ninguém dormiu.", "Volte cedo, pois amanhã tem aula."], "certa": 3, "explicacao": "d) O filme era longo, porém ninguém dormiu."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["queijo", "esquerda", "esquilo", "preguiça", "bilíngue"], "certa": 4, "explicacao": "e) bilíngue — em “bilíngue” a gente fala o u"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O cachorro fugiu por quê o portão estava aberto?", "Por que os dinossauros desapareceram", "O gelo derreteu porque o dia estava quente?", "A rua por que ele passa todo dia é barulhenta.", "Saiu sem dizer por quê."], "certa": 0, "explicacao": "a) — o certo é “O cachorro fugiu porque o portão estava aberto?”: a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "Qual é o coletivo de <b>navios</b>? Responda com a letra.", "alternativas": ["esquadrilha", "cardume", "alcateia", "tropa", "frota"], "certa": 4, "explicacao": "e) frota — esquadrilha é de outro grupo."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["curado de uma doença", "preciso, feito com muito cuidado", "defesa, elogio de uma ideia", "pouco, escasso", "mentira, golpe para enganar"], "certa": 1, "explicacao": "b) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "Mamãe trouxe o jogo para mim ver.", "Trouxe o lápis para eu desenhar.", "Para mim, estudar à noite é melhor.", "O bolo é para mim."], "certa": 1, "explicacao": "b) — o certo é “para eu ver”."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Fizemos muitas perguntas.", "Choveu muito ontem.", "Comprei muitos livros.", "Havia muitas estrelas no céu.", "Comemos muitos pastéis."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["heroico", "colibrí", "item", "feiura", "veem"], "certa": 1, "explicacao": "b) colibrí — o certo é colibri: oxítona terminada em i ou u não leva acento (caju, saci)."}, {"enunciado": "“Comprei maçã, manga e uva.”<br>Por que há vírgula nessa frase? Responda com a letra.", "alternativas": ["separa o aposto (uma explicação sobre o nome)", "separa o vocativo (quem é chamado)", "separa o sujeito do verbo", "separa os itens de uma lista", "separa o lugar e a data"], "certa": 3, "explicacao": "d) separa os itens de uma lista — e cuidado: vírgula entre sujeito e verbo é sempre erro."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "caro, que custa muito", "que fala ou escreve demais, enrolando", "crítica, ataque", "que arma truques para enganar"], "certa": 0, "explicacao": "a) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>estava jogando</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["jogando", "estava", "não há verbo principal", "os dois são principais", "o sujeito"], "certa": 0, "explicacao": "a) jogando — o principal é o último, o que diz a ação."}, {"enunciado": "Se eu ___ em casa, ficaria contente. (verbo estar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["estive", "esteja", "estar", "estivesse", "estou"], "certa": 3, "explicacao": "d) estivesse"}, {"enunciado": "Situação: A cantora terminou o show.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Avante!", "Ora bolas!", "Vamos!", "Viva!", "Bravo!"], "certa": 4, "explicacao": "e) Bravo! — aplauso."}, {"enunciado": "Quem nasce na <b>Bahia</b> é… Responda com a letra.", "alternativas": ["baiano", "cuiabano", "peruano", "tocantinense", "cubano"], "certa": 0, "explicacao": "a) baiano"}, {"enunciado": "O que quer dizer <b>austero</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rico e cheio de enfeites", "arrependido", "rigoroso e sem luxo", "combinado sem precisar falar, subentendido", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 2, "explicacao": "c) rigoroso e sem luxo. Não é “rico e cheio de enfeites”: essa é a pegadinha."}, {"enunciado": "Qual é o plural de <b>vaivém</b>? Responda com a letra.", "alternativas": ["vaivéns", "vaivémis", "os vaivém", "vaivéms", "vaivémes"], "certa": 0, "explicacao": "a) vaivéns"}, {"enunciado": "Por que a palavra <b>cabeça</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç pode aparecer no começo da palavra", "antes de a, o e u, o c tem som de k", "antes de e e i se usa ç", "antes de e e i, o c já tem som de s", "ç só se usa antes de a, o e u"], "certa": 4, "explicacao": "e) ç só se usa antes de a, o e u"}, {"enunciado": "Como se lê <b>século XX</b>? Responda com a letra.", "alternativas": ["vigésimo", "vinte", "20", "dezenove", "vinte e um"], "certa": 1, "explicacao": "b) vinte — depois do décimo, lê-se como cardinal."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fotografei à farmácia.", "Entreguei o presente a ela.", "Comemos bife à milanesa.", "Chegamos às oito horas.", "Vou à Bahia."], "certa": 0, "explicacao": "a) — o certo é “a farmácia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>crasso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["fora da época certa", "arrogância, ar de superioridade", "arrependido", "grosseiro, muito grave (um erro)", "pequeno, sem importância"], "certa": 3, "explicacao": "d) grosseiro, muito grave (um erro). Não é “pequeno, sem importância”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>empático</b>? Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "orgulho exagerado do próprio país", "ligado à vida simples e tranquila do campo", "jeito suave de dizer algo pesado", "que se coloca no lugar do outro"], "certa": 4, "explicacao": "e) que se coloca no lugar do outro"}];
const CHAVE='simulado-bonus-7';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
