<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "De que duas palavras se forma <b>àquilo</b>? Responda com a letra.", "alternativas": ["àq + aquilo", "a + isso", "a + aquila", "de + aquilo", "a + aquilo"], "certa": 4, "explicacao": "e) a + aquilo"}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito antigo e valioso", "esbanjador, que gasta demais", "fora da época certa", "espantado, sem reação", "generoso, de coração grande"], "certa": 2, "explicacao": "c) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>sala</b>? Responda com a letra.", "alternativas": ["saiote", "mesinha", "saleta", "riacho", "bandeirola"], "certa": 2, "explicacao": "c) saleta"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Trouxe o lápis para eu desenhar.", "Para mim, estudar à noite é melhor.", "A professora deu a tarefa para mim fazer.", "Isso é para eu ler."], "certa": 3, "explicacao": "d) — o certo é “para eu fazer”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["âncora", "fábula", "máximo", "década", "elétron"], "certa": 4, "explicacao": "e) elétron — e-lé-tron: é paroxítona."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["deça", "açúcar", "pesquiza", "susesso", "floreser"], "certa": 1, "explicacao": "b) açúcar — ç antes de u."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["fora da época certa", "espantado, sem reação", "atento, prestando atenção", "que está em toda parte", "tão bom que não dá para descrever com palavras"], "certa": 1, "explicacao": "b) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles pularão corda.", "Ontem, eles tocaram violão.", "Hoje de manhã, eles aprenderão uma música nova.", "Daqui a dois dias, eles esconderão o presente.", "Ontem, eles desenharam um castelo."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "espantado, sem reação", "novato, iniciante", "desmentir, contradizer", "mentira, golpe para enganar"], "certa": 0, "explicacao": "a) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>quero admitir</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["não há verbo principal", "admitir", "os dois são principais", "quero", "o sujeito"], "certa": 1, "explicacao": "b) admitir — o principal é o último, o que diz a ação."}, {"enunciado": "Na frase “<b>Por que</b> a Lua muda de forma?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual", "pois", "porém", "por qual motivo", "pelo qual / pela qual"], "certa": 3, "explicacao": "d) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Se vocês ___ sair cedo, avisem. (verbo poder)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["possam", "poder", "puderem", "podem", "puderam"], "certa": 2, "explicacao": "c) puderem"}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "que não se apaga", "fora da época certa", "pena, compaixão pelos outros", "totalmente fechado; difícil de entender"], "certa": 0, "explicacao": "a) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Chile</b> é… Responda com a letra.", "alternativas": ["chileno", "japonês", "paraibano", "potiguar", "porto-alegrense"], "certa": 0, "explicacao": "a) chileno"}, {"enunciado": "Na semana passada, eles ___ para casa. Qual forma completa a frase? Responda com a letra.", "alternativas": ["voltaram", "voltariam", "voltavam", "voltam", "voltarão"], "certa": 0, "explicacao": "a) voltaram — passado: -am."}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esforço, vontade forte de fazer algo", "excelente, muito habilidoso", "oportunidade, ocasião", "descuidado, que cai fácil em armadilhas", "que não tem habilidade"], "certa": 1, "explicacao": "b) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["con-vi-cção", "téc-ni-co", "che-i-ro-so", "pê-sse-go", "pes-soa"], "certa": 1, "explicacao": "b) téc-ni-co — a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Por que a palavra <b>rosa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z", "no começo da palavra, o s tem som de s", "ss pode começar uma palavra", "depois de consoante, um s só já tem som de s"], "certa": 1, "explicacao": "b) entre vogais, o s tem som de z"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["um tipo de comida italiana", "caro, que custa muito", "esforço, vontade forte de fazer algo", "lento para entender", "confusão, situação enrolada"], "certa": 4, "explicacao": "e) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Onde caiu a bola?", "A um gato dormindo no telhado.", "O lobo mau assustou os três porquinhos.", "Ricardo comeu mais pipoca do que todo mundo.", "Quem treina mais costuma jogar melhor."], "certa": 1, "explicacao": "b) o certo é “Há”"}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["açúcar", "chapéu", "herói", "enjôo", "polens"], "certa": 3, "explicacao": "d) enjôo — o certo é enjoo: oo e eem NÃO levam acento (voo, enjoo, leem, veem) — o acento caiu com o Acordo Ortográfico."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["fogueira", "esquerda", "cinquenta", "foguinho", "pequeno"], "certa": 2, "explicacao": "c) cinquenta — em “cinquenta” a gente fala o u"}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "sem nenhum machucado, ileso", "remédio para todos os males", "sem cor, incolor", "tão bom que não dá para descrever com palavras"], "certa": 1, "explicacao": "b) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Felipe voltou a escola.", "Fiz uma visita àquele museu.", "Comemos bife à milanesa.", "Aprendi a nadar.", "Às vezes, durmo à tarde."], "certa": 0, "explicacao": "a) — o certo é “à escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Como se escreve <b>71º</b> por extenso? Responda com a letra.", "alternativas": ["septuagésimo segundo", "setentésimo primeiro", "septuagésimo primeiro", "octogésimo primeiro", "sexagésimo primeiro"], "certa": 2, "explicacao": "c) septuagésimo primeiro"}, {"enunciado": "Leia: “Pizza de chocolate com banana? Que sabor inusitado!” Nessa frase, <b>inusitado</b> quer dizer… Responda com a letra.", "alternativas": ["que acontece por acaso", "onde é muito difícil viver", "que nunca foi usado, novinho", "incomum, surpreendente", "rigoroso e sem luxo"], "certa": 3, "explicacao": "d) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o diadema", "o cometa", "o guaraná", "o telefonema", "o dinamite"], "certa": 4, "explicacao": "e) o dinamite — o certo é “a dinamite”."}, {"enunciado": "Por que a palavra <b>órgãos</b> tem acento? Responda com a letra.", "alternativas": ["paroxítona terminada em ão ou ã leva acento", "oxítona terminada em em ou ens leva acento", "i e u fortes, sozinhos na sílaba depois de outra vogal (hiato), levam acento", "oxítona (força na última sílaba) terminada em a leva acento", "toda proparoxítona (a força na antepenúltima sílaba) tem acento"], "certa": 0, "explicacao": "a) paroxítona terminada em ão ou ã leva acento (ór-gãos)."}, {"enunciado": "Ontem eles ___ (verbo <b>querer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["queriam", "quereram", "quererão", "quiseram", "querem"], "certa": 3, "explicacao": "d) quiseram"}, {"enunciado": "Leia: “O gelo mitigou a dor da pancada.” Nessa frase, <b>mitigou</b> quer dizer… Responda com a letra.", "alternativas": ["oportunidade, ocasião", "aumentar, piorar", "aliviar, diminuir (uma dor, um problema)", "vencer, controlar (um incêndio, uma crise)", "grosseiro, muito grave (um erro)"], "certa": 2, "explicacao": "c) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
