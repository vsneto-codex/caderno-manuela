<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>comprido</b>? Responda com a letra.", "alternativas": ["nó", "longo", "prestes a acontecer", "realizado", "aumento de preços"], "certa": 1, "explicacao": "b) longo — não confunda com “cumprido” (realizado)."}, {"enunciado": "Qual é o plural de <b>cachorro-quente</b>? Responda com a letra.", "alternativas": ["cachorro-quentes", "cachorro-quentees", "cachorros-quentes", "cachorros-quente", "cachorro-quente"], "certa": 2, "explicacao": "c) cachorros-quentes"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["tônica", "relâmpago", "países", "mágoa", "plástico"], "certa": 2, "explicacao": "c) países — pa-í-ses: é paroxítona."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "que dá para acreditar, razoável", "que acontece fora de hora", "esforço, vontade forte de fazer algo", "dispensar, não precisar de algo"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>engolir sapo</b>? Responda com a letra.", "alternativas": ["estar distraído", "descansar para se recuperar", "aguentar algo ruim calado", "sentir muita dor", "contar um segredo"], "certa": 2, "explicacao": "c) aguentar algo ruim calado"}, {"enunciado": "Se vocês ___ tempo, avisem. (verbo ter)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["ter", "tiveram", "tenham", "têm", "tiverem"], "certa": 4, "explicacao": "e) tiverem"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Faz frio no inverno.", "Manuela e Bianca desenharam um castelo.", "O time de Felipe tocou violão.", "A turma do quinto ano sonhou com dragões.", "Pescamos no lago."], "certa": 1, "explicacao": "b) Manuela e Bianca desenharam um castelo."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["jesto", "enxurrada", "cochilo", "jiboia", "sujeira"], "certa": 0, "explicacao": "a) jesto — o certo é gesto: com g, de cor."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "mínimo, o menor de todos", "que arde, que queima", "que arma truques para enganar", "inconveniente; fora do assunto"], "certa": 3, "explicacao": "d) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>pronome</b>? Responda com a letra.", "alternativas": ["Comemos muitos pastéis.", "As meninas estavam muito felizes.", "A girafa é muito alta.", "O cachorro late muito.", "Felipe dormiu muito."], "certa": 0, "explicacao": "a) — pronome: acompanha um substantivo e varia (muitos, muita)."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o derme", "a omelete", "a alface", "o eclipse", "o pijama"], "certa": 0, "explicacao": "a) o derme — o certo é “a derme”."}, {"enunciado": "A palavra <b>o/a atleta</b> é… Responda com a letra.", "alternativas": ["tem feminino diferente (biforme)", "sobrecomum", "comum de dois", "epiceno", "não tem gênero"], "certa": 2, "explicacao": "c) comum de dois — o atleta / a atleta: a palavra é igual, o artigo muda."}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["triste, melancólico", "firme e calmo diante do sofrimento", "que fala pouco, de poucas palavras", "intenso, enérgico", "ligado à vida simples e tranquila do campo"], "certa": 4, "explicacao": "e) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["carrinho", "casinha", "livrinho", "vinho", "gatinho"], "certa": 3, "explicacao": "d) vinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "— Psiu, moço! Aqui, aqui!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar nojo", "mostrar alegria", "chamar alguém", "pedir silêncio", "mostrar dor"], "certa": 2, "explicacao": "c) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Por que a palavra <b>ferro</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, um r só tem som forte", "rr aparece só no começo das palavras", "depois de n, l e s, o r tem som forte com uma letra só", "no começo da palavra, o r já tem som forte", "entre vogais, o som forte do r se escreve com rr"], "certa": 4, "explicacao": "e) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["palavras que indicam país terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "femininos e palavras de origem terminam em -esa", "substantivos que vêm de adjetivos terminam em -eza", "o final -esa sempre se escreve com z"], "certa": 3, "explicacao": "d) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["começar, provocar", "sem nenhum machucado, ileso", "tão bom que não dá para descrever com palavras", "vencer, controlar (um incêndio, uma crise)", "resistente (ao calor, a mudanças)"], "certa": 3, "explicacao": "d) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["e-clip-se", "mis-são", "chi-cle-te", "e-xce-ções", "a-e-ro-por-to"], "certa": 3, "explicacao": "d) e-xce-ções — o certo é ex-ce-ções: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Na locução verbal <b>devo existir</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["devo", "o sujeito", "não há verbo principal", "os dois são principais", "existir"], "certa": 4, "explicacao": "e) existir — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>São Paulo (cidade)</b> é… Responda com a letra.", "alternativas": ["escocês", "paulistano", "paulista", "coreano", "soteropolitano"], "certa": 1, "explicacao": "b) paulistano"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vire à esquerda.", "Ela aprendeu à nadar.", "Fui ao clube e à piscina.", "Chegamos ao meio-dia.", "Às vezes, durmo à tarde."], "certa": 1, "explicacao": "b) — o certo é “a nadar”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "oportunidade, ocasião", "arrependido", "nunca visto antes, extraordinário", "desejo, vontade"], "certa": 1, "explicacao": "b) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "“Apareceu de repente Bianca.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "não tem sujeito", "Bianca", "Apareceu", "de"], "certa": 2, "explicacao": "c) Bianca — o sujeito veio depois do verbo. Pergunte: quem apareceu?"}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["proscesso", "proceso", "prossesso", "processo", "proceço"], "certa": 3, "explicacao": "d) processo — com c (antes de e) e ss (entre vogais)."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles mostraram o desenho.", "No ano que vem, eles discutiram o assunto.", "Na semana passada, eles responderam às perguntas.", "No ano que vem, eles esconderão o presente.", "Daqui a dois dias, eles estudarão para a prova."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>rio</b>? Responda com a letra.", "alternativas": ["riacho", "glóbulo", "papelzinho", "ovinho", "mãozinha"], "certa": 0, "explicacao": "a) riacho"}, {"enunciado": "Leia: “Procure informações em sites fidedignos.” Nessa frase, <b>fidedignos</b> quer dizer… Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "totalmente fechado; difícil de entender", "que está em toda parte", "duvidoso, suspeito", "remédio para todos os males"], "certa": 0, "explicacao": "a) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["mostrar", "tocar", "falar", "anoitecer", "entender"], "certa": 3, "explicacao": "d) anoitecer — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["A vovó e o vovô pescaram no lago?", "Que gol bonito!", "Abra a janela.", "A professora de música olhou as estrelas.", "Que dia lindo!"], "certa": 0, "explicacao": "a) A vovó e o vovô pescaram no lago?"}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
