<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>imigrante</b>? Responda com a letra.", "alternativas": ["nó", "quem entra no país", "mergulhar", "quem sai do país", "aumento de preços"], "certa": 1, "explicacao": "b) quem entra no país — não confunda com “emigrante” (quem sai do país)."}, {"enunciado": "Qual é o plural de <b>beija-flor</b>? Responda com a letra.", "alternativas": ["beijas-flors", "beija-flor", "beija-flors", "beija-flores", "beijas-flor"], "certa": 3, "explicacao": "d) beija-flores"}, {"enunciado": "O verbo <b>pôr</b> é de que conjugação? Responda com a letra.", "alternativas": ["3ª conjugação (-ir)", "não tem conjugação", "4ª conjugação (-or)", "1ª conjugação (-ar)", "2ª conjugação (-er)"], "certa": 4, "explicacao": "e) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["sombra", "purê", "perder", "canção", "girassol"], "certa": 0, "explicacao": "a) sombra — som-bra: é paroxítona."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito antigo e valioso", "que arma truques para enganar", "fora da época certa", "arrependido", "sem medo, destemido"], "certa": 2, "explicacao": "c) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>cada macaco no seu galho</b>? Responda com a letra.", "alternativas": ["agir com muito cuidado", "cada um cuida do que é seu", "procurar defeito onde não há", "achar-se melhor que os outros", "levar a culpa sozinho"], "certa": 1, "explicacao": "b) cada um cuida do que é seu"}, {"enunciado": "Espero que ele ___ a resposta. (verbo saber)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["soube", "sabe", "soubesse", "saber", "saiba"], "certa": 4, "explicacao": "e) saiba"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Meu avô sonhou com dragões.", "Trovejou durante o jogo.", "O cachorro e o gato olharam as estrelas.", "Plantamos uma árvore.", "Discuti o assunto."], "certa": 2, "explicacao": "c) O cachorro e o gato olharam as estrelas."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["enchuto", "lagartixa", "xuchu", "chapél", "mecherica"], "certa": 1, "explicacao": "b) lagartixa — com x, de cor."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "que arma truques para enganar", "atento, prestando atenção", "aliviar, diminuir (uma dor, um problema)", "espantado, sem reação"], "certa": 4, "explicacao": "e) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Eles riram muito.", "Bebi muita água.", "Muitos alunos faltaram.", "Vi muitos pássaros.", "Muitas pessoas vieram à festa."], "certa": 0, "explicacao": "a) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o planeta", "o problema", "o dinamite", "a derme", "o clã"], "certa": 2, "explicacao": "c) o dinamite — o certo é “a dinamite”."}, {"enunciado": "Situação: Um carro vem rápido e o amigo vai atravessar a rua.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Oh!", "Fora!", "Cuidado!", "Eba!", "Caramba!"], "certa": 2, "explicacao": "c) Cuidado! — advertência."}, {"enunciado": "A palavra <b>a pessoa</b> é… Responda com a letra.", "alternativas": ["epiceno", "sobrecomum", "não tem gênero", "comum de dois", "tem feminino diferente (biforme)"], "certa": 1, "explicacao": "b) sobrecomum — a pessoa serve para menino e menina, sem mudar nada."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "mentira, golpe para enganar", "vencer, controlar (um incêndio, uma crise)", "desmentir, contradizer", "confirmar, reforçar uma ideia"], "certa": 4, "explicacao": "e) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["gatinho", "carrinho", "florzinha", "casinha", "caminho"], "certa": 4, "explicacao": "e) caminho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "— Psiu! Você deixou cair a carteira!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar nojo", "pedir silêncio", "chamar alguém", "mostrar alegria", "mostrar dor"], "certa": 2, "explicacao": "c) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Por que a palavra <b>tempo</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["no fim da palavra se usa n", "depois de vogal com acento se usa m", "antes de qualquer consoante se usa n", "antes de p e b se usa m", "antes de t e d se usa n"], "certa": 3, "explicacao": "d) antes de p e b se usa m"}, {"enunciado": "Por que a palavra <b>travesseiro</b> se escreve com <b>ss</b>? Responda com a letra.", "alternativas": ["entre vogais, o som de s se escreve com ss", "ss pode começar uma palavra", "depois de consoante, um s só já tem som de s", "entre vogais, o s tem som de z", "no começo da palavra, o s tem som de s"], "certa": 0, "explicacao": "a) entre vogais, o som de s se escreve com ss"}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "que passa num instante", "exibido, que usa palavras difíceis só para se mostrar", "ligado à vida simples e tranquila do campo", "pena, compaixão pelos outros"], "certa": 0, "explicacao": "a) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["a-dvo-ga-do", "bi-cic-le-ta", "ga-rra-fa", "qua-dro", "be-so-u-ro"], "certa": 3, "explicacao": "d) qua-dro — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Na locução verbal <b>vamos permitir</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["o sujeito", "permitir", "não há verbo principal", "vamos", "os dois são principais"], "certa": 1, "explicacao": "b) permitir — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>Angola</b> é… Responda com a letra.", "alternativas": ["argentino", "gaúcho", "angolano", "peruano", "alagoano"], "certa": 2, "explicacao": "c) angolano"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos às oito horas.", "Fui ao clube e à piscina.", "Entreguei o presente a ela.", "Às vezes, durmo à tarde.", "O passeio à cavalo foi lindo."], "certa": 4, "explicacao": "e) — o certo é “a cavalo”: antes de palavra masculina nunca tem crase."}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["sem medo, destemido", "generoso, de coração grande", "esfriar, perder a força", "que não tem habilidade", "excelente, muito habilidoso"], "certa": 4, "explicacao": "e) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "“Chegaram cedo os primos de Ricardo.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["cedo", "os primos de Ricardo", "não tem sujeito", "o sujeito está escondido (oculto)", "Chegaram"], "certa": 1, "explicacao": "b) os primos de Ricardo — o sujeito veio depois do verbo. Pergunte: quem chegaram?"}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["almosso", "almoso", "aumoço", "aumoso", "almoço"], "certa": 4, "explicacao": "e) almoço — l no fim da sílaba e ç antes de o."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles tocarão violão.", "Daqui a dois dias, eles mandarão uma mensagem.", "Daqui a dois dias, eles pularam corda.", "Amanhã, eles sonharão com dragões.", "Na semana passada, eles plantaram uma árvore."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>mala</b>? Responda com a letra.", "alternativas": ["chapeuzinho", "menininha", "maleta", "camiseta", "ruela"], "certa": 2, "explicacao": "c) maleta"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "caro, que custa muito", "um tipo de comida italiana", "incomum, surpreendente", "onde é muito difícil viver"], "certa": 0, "explicacao": "a) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
