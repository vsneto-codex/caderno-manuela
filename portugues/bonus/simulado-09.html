<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O verbo <b>propor</b> é de que conjugação? Responda com a letra.", "alternativas": ["4ª conjugação (-or)", "3ª conjugação (-ir)", "2ª conjugação (-er)", "1ª conjugação (-ar)", "não tem conjugação"], "certa": 2, "explicacao": "c) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["abelha", "vírus", "bíceps", "gráfico", "cofre"], "certa": 3, "explicacao": "d) gráfico — grá-fi-co: é proparoxítona."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito pequeno, escasso", "muito antigo e valioso", "pouco, escasso", "isca, armadilha para enganar", "fora da época certa"], "certa": 4, "explicacao": "e) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>falar pelos cotovelos</b>? Responda com a letra.", "alternativas": ["fazer com facilidade", "procurar defeito onde não há", "passar por muita dificuldade", "falar demais", "esquecer de repente"], "certa": 3, "explicacao": "d) falar demais"}, {"enunciado": "Espero que ele ___ tempo. (verbo ter)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["tivesse", "teve", "tem", "ter", "tenha"], "certa": 4, "explicacao": "e) tenha"}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Garoou de manhã.", "Faz uma semana que ele viajou.", "O cachorro e o gato aprenderam uma música nova.", "Os primos de Ricardo pularam corda.", "Decidimos o jogo."], "certa": 4, "explicacao": "e) Decidimos o jogo."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["xapéu", "gesto", "enxaqueca", "enxuto", "xampu"], "certa": 0, "explicacao": "a) xapéu — o certo é chapéu: com ch e u no fim (chapeuzinho)."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["atento, prestando atenção", "estranho, fora do comum", "sem medo, destemido", "mínimo, o menor de todos", "espantado, sem reação"], "certa": 4, "explicacao": "e) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o planeta", "o eclipse", "a dia", "o telefonema", "a omelete"], "certa": 2, "explicacao": "c) a dia — o certo é “o dia”."}, {"enunciado": "A palavra <b>o/a estudante</b> é… Responda com a letra.", "alternativas": ["comum de dois", "não tem gênero", "tem feminino diferente (biforme)", "epiceno", "sobrecomum"], "certa": 0, "explicacao": "a) comum de dois — o estudante / a estudante: a palavra é igual, o artigo muda."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "que dura muito, que não acaba", "intenso, enérgico", "desmentir, contradizer", "confirmar, reforçar uma ideia"], "certa": 4, "explicacao": "e) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>lâmpada</b> se escreve com <b>m</b>? Responda com a letra.", "alternativas": ["depois de vogal com acento se usa m", "no fim da palavra se usa n", "antes de t e d se usa n", "antes de p e b se usa m", "antes de qualquer consoante se usa n"], "certa": 3, "explicacao": "d) antes de p e b se usa m"}, {"enunciado": "Por que a palavra <b>música</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z", "no começo da palavra, o s tem som de s", "ss pode começar uma palavra"], "certa": 2, "explicacao": "c) entre vogais, o s tem som de z"}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pena, compaixão pelos outros", "esbanjador, que gasta demais", "muitas vezes, com frequência", "digno de confiança, verdadeiro", "arrogância, ar de superioridade"], "certa": 4, "explicacao": "e) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["sub-so-lo", "man-tei-ga", "jo-a-ni-nha", "no-sso", "cor-ri-da"], "certa": 3, "explicacao": "d) no-sso — o certo é nos-so: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Na locução verbal <b>quero nadar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["nadar", "o sujeito", "não há verbo principal", "os dois são principais", "quero"], "certa": 0, "explicacao": "a) nadar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>Tocantins</b> é… Responda com a letra.", "alternativas": ["holandês", "belo-horizontino", "tocantinense", "belenense", "venezuelano"], "certa": 2, "explicacao": "c) tocantinense"}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "rigoroso e sem luxo", "isca, armadilha para enganar", "que não tem habilidade", "excelente, muito habilidoso"], "certa": 4, "explicacao": "e) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "“Venceram o campeonato minhas tias.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["o sujeito está escondido (oculto)", "o", "não tem sujeito", "Venceram", "minhas tias"], "certa": 4, "explicacao": "e) minhas tias — o sujeito veio depois do verbo. Pergunte: quem venceram?"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["suceço", "princesa", "defesa", "surpresa", "cresça"], "certa": 0, "explicacao": "a) suceço — o certo é sucesso: com c (antes de e) e ss (entre vogais)."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Amanhã, eles resistirão ao doce.", "No ano que vem, eles olharão as estrelas.", "Na semana passada, eles compraram pão.", "Daqui a dois dias, eles uniram as peças.", "Daqui a dois dias, eles acordarão cedo."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>flauta</b>? Responda com a letra.", "alternativas": ["bonequinha", "flautim", "passarinho", "animalzinho", "camiseta"], "certa": 1, "explicacao": "b) flautim"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rigoroso e sem luxo", "confusão, situação enrolada", "grosseiro, muito grave (um erro)", "um tipo de comida italiana", "defesa, elogio de uma ideia"], "certa": 1, "explicacao": "b) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Por que o time de Felipe assistiu a um filme?", "Venda limonada!", "Que dia lindo!", "A turma do quinto ano andou de bicicleta.", "Que gol bonito!"], "certa": 0, "explicacao": "a) Por que o time de Felipe assistiu a um filme?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar.", "Felipe trouxe a revista para mim ler.", "Sem mim, a festa não teria graça.", "O bolo é para mim."], "certa": 2, "explicacao": "c) — o certo é “para eu ler”."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>acender</b>? Responda com a letra.", "alternativas": ["chorar", "silêncio", "esconder", "perder", "apagar"], "certa": 4, "explicacao": "e) apagar"}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "sem cor, incolor", "breve e direto", "dispensar, não precisar de algo", "sem nenhum machucado, ileso"], "certa": 4, "explicacao": "e) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}, {"enunciado": "“Cheguei <b>após</b> o almoço.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["causa", "posse", "matéria", "companhia", "tempo"], "certa": 4, "explicacao": "e) tempo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Não há por que ter medo do escuro.", "Porquê a gente sonha?", "Saiu sem dizer por quê.", "O pneu furou; eis por que chegamos atrasados.", "Por que razão o bolo afundou?"], "certa": 1, "explicacao": "b) — o certo é “Por que a gente sonha?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Leia: “Pizza de chocolate com banana? Que sabor inusitado!” Nessa frase, <b>inusitado</b> quer dizer… Responda com a letra.", "alternativas": ["breve e direto", "incomum, surpreendente", "que nunca foi usado, novinho", "confusão, situação enrolada", "que dá para acreditar, razoável"], "certa": 1, "explicacao": "b) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
