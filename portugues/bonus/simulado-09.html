<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>despensa</b>? Responda com a letra.", "alternativas": ["nó", "lugar de guardar comida", "prestes a acontecer", "liberação", "aumento de preços"], "certa": 1, "explicacao": "b) lugar de guardar comida — não confunda com “dispensa” (liberação)."}, {"enunciado": "O verbo <b>propor</b> é de que conjugação? Responda com a letra.", "alternativas": ["2ª conjugação (-er)", "3ª conjugação (-ir)", "4ª conjugação (-or)", "não tem conjugação", "1ª conjugação (-ar)"], "certa": 0, "explicacao": "a) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["óculos", "médico", "faísca", "número", "econômico"], "certa": 2, "explicacao": "c) faísca — fa-ís-ca: é paroxítona."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["espantado, sem reação", "que fala pouco, de poucas palavras", "onde é muito difícil viver", "fora da época certa", "muito antigo e valioso"], "certa": 3, "explicacao": "d) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>ficar uma fera</b>? Responda com a letra.", "alternativas": ["desconfiar de algo", "ficar muito bravo", "fazer igual", "exagerar um problema pequeno", "levar a culpa sozinho"], "certa": 1, "explicacao": "b) ficar muito bravo"}, {"enunciado": "Se vocês ___ sair cedo, avisem. (verbo poder)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["poder", "podem", "puderam", "puderem", "possam"], "certa": 3, "explicacao": "d) puderem"}, {"enunciado": "Qual oração está <b>sem sujeito</b>? Responda com a letra.", "alternativas": ["Ventou forte a noite toda.", "A vovó e o vovô responderam às perguntas.", "Tocamos violão.", "Manuela e Bianca nadaram na piscina.", "O dono da padaria discutiu o assunto."], "certa": 0, "explicacao": "a) Ventou forte a noite toda."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["engraxate", "enxurrada", "relânpago", "cochilo", "tigela"], "certa": 2, "explicacao": "c) relânpago — o certo é relâmpago: m antes de p."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caro, que custa muito", "que dá para acreditar, razoável", "sem nenhum machucado, ileso", "atento, prestando atenção", "espantado, sem reação"], "certa": 4, "explicacao": "e) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitas pessoas vieram à festa.", "Havia muita gente na praia.", "A girafa é muito alta.", "Muitos peixes nadavam no lago.", "Muitas crianças brincavam no parque."], "certa": 2, "explicacao": "c) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o telefonema", "o omelete", "o sistema", "o dia", "a couve"], "certa": 1, "explicacao": "b) o omelete — o certo é “a omelete”."}, {"enunciado": "Situação: A cantora terminou o show.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Avante!", "Coitado!", "Fora!", "Socorro!", "Bravo!"], "certa": 4, "explicacao": "e) Bravo! — aplauso."}, {"enunciado": "A palavra <b>o condor</b> é… Responda com a letra.", "alternativas": ["sobrecomum", "tem feminino diferente (biforme)", "não tem gênero", "epiceno", "comum de dois"], "certa": 3, "explicacao": "d) epiceno — animal: o condor macho / o condor fêmea."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confirmar, reforçar uma ideia", "desmentir, contradizer", "resistente (ao calor, a mudanças)", "oportunidade, ocasião", "excelente, muito habilidoso"], "certa": 0, "explicacao": "a) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "— Psiu! Ei, você, aqui do lado!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["pedir silêncio", "chamar alguém", "mostrar alegria", "mostrar dor", "mostrar nojo"], "certa": 1, "explicacao": "b) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Por que a palavra <b>mexer</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["depois de me- se usa x", "depois de ditongo se usa x", "depois de ditongo se usa ch", "depois de en- se usa x", "palavras que vêm de outras com ch usam x"], "certa": 0, "explicacao": "a) depois de me- se usa x"}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "substantivos que vêm de adjetivos terminam em -eza", "o final -esa sempre se escreve com z", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza"], "certa": 1, "explicacao": "b) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "pena, compaixão pelos outros", "isca, armadilha para enganar", "tão bom que não dá para descrever com palavras", "oportunidade, ocasião"], "certa": 0, "explicacao": "a) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["tos-se", "ce-re-jei-ra", "pac-to", "a-tlas", "chic-le-te"], "certa": 4, "explicacao": "e) chic-le-te — o certo é chi-cle-te: encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Na locução verbal <b>tenho de mandar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["mandar", "não há verbo principal", "o sujeito", "tenho", "os dois são principais"], "certa": 0, "explicacao": "a) mandar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>Aracaju</b> é… Responda com a letra.", "alternativas": ["mexicano", "paraguaio", "aracajuano", "japonês", "chileno"], "certa": 2, "explicacao": "c) aracajuano"}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "sem nenhum machucado, ileso", "esbanjador, que gasta demais", "digno de confiança, verdadeiro", "que não tem habilidade"], "certa": 0, "explicacao": "a) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "“Venceram o campeonato Ricardo e a irmã.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["Ricardo e a irmã", "não tem sujeito", "o sujeito está escondido (oculto)", "Venceram", "o"], "certa": 0, "explicacao": "a) Ricardo e a irmã — o sujeito veio depois do verbo. Pergunte: quem venceram?"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["defesa", "surpresa", "sucesso", "asobio", "excesso"], "certa": 3, "explicacao": "d) asobio — o certo é assobio: som de s entre vogais: ss."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles assistiram a um filme.", "Amanhã, eles olharão as estrelas.", "Na semana passada, eles venderão limonada.", "Daqui a dois dias, eles tocarão violão.", "Na semana passada, eles cantaram na festa."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>bandeira</b>? Responda com a letra.", "alternativas": ["flautim", "peixinho", "corpúsculo", "bandeirola", "coraçãozinho"], "certa": 3, "explicacao": "d) bandeirola"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["dispensar, não precisar de algo", "que passa num instante", "espantado, sem reação", "um tipo de comida italiana", "confusão, situação enrolada"], "certa": 4, "explicacao": "e) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["Nossa, que frio!", "A girafa do zoológico pescou no lago.", "Limpe o quarto.", "Quem resistiu ao doce?", "A vovó e o vovô tocaram violão."], "certa": 2, "explicacao": "c) Limpe o quarto."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Entre mim e você, tudo bem.", "Para mim, estudar à noite é melhor.", "Isso é para eu ler.", "Para mim, fazer isso é fácil.", "A professora deu a tarefa para mim fazer."], "certa": 4, "explicacao": "e) — o certo é “para eu fazer”."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>cedo</b>? Responda com a letra.", "alternativas": ["ódio", "longe", "tarde", "avarento", "lento"], "certa": 2, "explicacao": "c) tarde"}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
