<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>despensa</b>? Responda com a letra.", "alternativas": ["nó", "lugar de guardar comida", "prestes a acontecer", "liberação", "aumento de preços"], "certa": 1, "explicacao": "b) lugar de guardar comida — não confunda com “dispensa” (liberação)."}, {"enunciado": "Qual é o plural de <b>arco-íris</b>? Responda com a letra.", "alternativas": ["arcos-íriss", "arco-írises", "arco-íris", "arco-íriss", "arcos-íris"], "certa": 2, "explicacao": "c) arco-íris"}, {"enunciado": "O verbo <b>pôr</b> é de que conjugação? Responda com a letra.", "alternativas": ["1ª conjugação (-ar)", "não tem conjugação", "2ª conjugação (-er)", "4ª conjugação (-or)", "3ª conjugação (-ir)"], "certa": 2, "explicacao": "c) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["biquíni", "onça", "cavalo", "caráter", "atum"], "certa": 4, "explicacao": "e) atum — a-tum: é oxítona."}, {"enunciado": "O que quer dizer <b>afã</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cansaço depois de trabalhar", "exibido, que usa palavras difíceis só para se mostrar", "sem nenhum machucado, ileso", "esforço, vontade forte de fazer algo", "arrogância, ar de superioridade"], "certa": 3, "explicacao": "d) esforço, vontade forte de fazer algo. Não é “cansaço depois de trabalhar”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>ficar a ver navios</b>? Responda com a letra.", "alternativas": ["ficar muito bravo", "aguentar algo ruim calado", "ficar sem nada, esperando", "vigiar", "ser o diferente do grupo"], "certa": 2, "explicacao": "c) ficar sem nada, esperando"}, {"enunciado": "Quando eu ___ o primeiro da fila, conto para você. (verbo ser)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["fui", "sou", "seja", "ser", "for"], "certa": 4, "explicacao": "e) for"}, {"enunciado": "Em qual frase o sujeito é <b>oculto</b>? Responda com a letra.", "alternativas": ["Resistimos ao doce.", "A turma do quinto ano mandou uma mensagem.", "O dono da padaria escondeu o presente.", "Ricardo e a irmã olharam as estrelas.", "Nevou no sul."], "certa": 0, "explicacao": "a) Resistimos ao doce."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["faxina", "gorgeta", "engraxate", "mexerica", "relâmpago"], "certa": 1, "explicacao": "b) gorgeta — o certo é gorjeta: com j, de cor."}, {"enunciado": "O que quer dizer <b>ardiloso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que arde, que queima", "incomum, surpreendente", "que arma truques para enganar", "confusão, situação enrolada", "mentira, golpe para enganar"], "certa": 2, "explicacao": "c) que arma truques para enganar. Não é “que arde, que queima”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Comemos muitos pastéis.", "Muitas crianças brincavam no parque.", "Muitos peixes nadavam no lago.", "Choveu muito ontem.", "Havia muitas estrelas no céu."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o alface", "o clã", "o telefonema", "a moto", "a sentinela"], "certa": 0, "explicacao": "a) o alface — o certo é “a alface”."}, {"enunciado": "Situação: A cantora terminou o show.<br>Qual interjeição combina? Responda com a letra.", "alternativas": ["Argh!", "Coragem!", "Nossa!", "Credo!", "Bravo!"], "certa": 4, "explicacao": "e) Bravo! — aplauso."}, {"enunciado": "A palavra <b>a criatura</b> é… Responda com a letra.", "alternativas": ["comum de dois", "sobrecomum", "tem feminino diferente (biforme)", "epiceno", "não tem gênero"], "certa": 1, "explicacao": "b) sobrecomum — a criatura serve para menino e menina, sem mudar nada."}, {"enunciado": "Leia: “O quadro mostrava uma cena bucólica: vacas, um riacho e uma casinha.” Nessa frase, <b>bucólica</b> quer dizer… Responda com a letra.", "alternativas": ["generoso, de coração grande", "incomum, surpreendente", "lento para entender", "triste, melancólico", "ligado à vida simples e tranquila do campo"], "certa": 4, "explicacao": "e) ligado à vida simples e tranquila do campo. Não é “triste, melancólico”: essa é a pegadinha."}, {"enunciado": "Todas terminam em -inho ou -inha, mas uma <b>NÃO</b> é diminutivo. Qual? Responda com a letra.", "alternativas": ["bolinha", "dedinho", "padrinho", "florzinha", "pezinho"], "certa": 2, "explicacao": "c) padrinho — não quer dizer “pequeno”: é uma palavra própria."}, {"enunciado": "— Psiu! Moça, esqueceu a sacola!<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["chamar alguém", "mostrar dor", "mostrar nojo", "pedir silêncio", "mostrar alegria"], "certa": 0, "explicacao": "a) chamar alguém — o contexto decide o sentido."}, {"enunciado": "Por que a palavra <b>torre</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["rr aparece só no começo das palavras", "entre vogais, um r só tem som forte", "depois de n, l e s, o r tem som forte com uma letra só", "entre vogais, o som forte do r se escreve com rr", "no começo da palavra, o r já tem som forte"], "certa": 3, "explicacao": "d) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["toda palavra terminada em -eza é feminino de origem", "substantivos que vêm de adjetivos terminam em -eza", "o final -esa sempre se escreve com z", "femininos e palavras de origem terminam em -esa", "palavras que indicam país terminam em -eza"], "certa": 1, "explicacao": "b) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Leia: “Os bombeiros debelaram o incêndio em meia hora.” Nessa frase, <b>debelaram</b> quer dizer… Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "vencer, controlar (um incêndio, uma crise)", "combinado sem precisar falar, subentendido", "começar, provocar", "oportunidade, ocasião"], "certa": 1, "explicacao": "b) vencer, controlar (um incêndio, uma crise). Não é “começar, provocar”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["a-rroz", "ab-dô-men", "su-bma-ri-no", "cof-re", "fro-u-xo"], "certa": 1, "explicacao": "b) ab-dô-men — a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Na locução verbal <b>preciso viajar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["o sujeito", "viajar", "preciso", "os dois são principais", "não há verbo principal"], "certa": 1, "explicacao": "b) viajar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>Mato Grosso do Sul</b> é… Responda com a letra.", "alternativas": ["mato-grossense", "cearense", "uruguaio", "sul-mato-grossense", "teresinense"], "certa": 3, "explicacao": "d) sul-mato-grossense"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vou à Bahia.", "Falei a pessoas da fila.", "Aprendi a nadar.", "Passeamos a cavalo.", "A aula começa as oito horas."], "certa": 4, "explicacao": "e) — o certo é “às oito”: antes de horas tem crase (às oito, à uma hora, à meia-noite)."}, {"enunciado": "Leia: “Aproveito o ensejo para agradecer a todos.” Nessa frase, <b>ensejo</b> quer dizer… Responda com a letra.", "alternativas": ["desejo, vontade", "esperto, que percebe tudo rápido", "oportunidade, ocasião", "combinado sem precisar falar, subentendido", "que acontece por acaso"], "certa": 2, "explicacao": "c) oportunidade, ocasião. Não é “desejo, vontade”: essa é a pegadinha."}, {"enunciado": "“Apareceu de repente o dono da padaria.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Apareceu", "o sujeito está escondido (oculto)", "o dono da padaria", "de"], "certa": 3, "explicacao": "d) o dono da padaria — o sujeito veio depois do verbo. Pergunte: quem apareceu?"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["surpresa", "acessório", "necessário", "empresa", "asúcar"], "certa": 4, "explicacao": "e) asúcar — o certo é açúcar: ç antes de u."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Na semana passada, eles voltaram para casa.", "Daqui a dois dias, eles jogarão bola.", "Amanhã, eles pescarão no lago.", "Ontem, eles trabalharão na horta.", "Amanhã, eles baterão na porta."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>espada</b>? Responda com a letra.", "alternativas": ["bolinha", "cãozinho", "passarinho", "saleta", "espadim"], "certa": 4, "explicacao": "e) espadim"}, {"enunciado": "Leia: “Procure informações em sites fidedignos.” Nessa frase, <b>fidedignos</b> quer dizer… Responda com a letra.", "alternativas": ["que acontece fora de hora", "urgente", "digno de confiança, verdadeiro", "generoso, de coração grande", "duvidoso, suspeito"], "certa": 2, "explicacao": "c) digno de confiança, verdadeiro. Não é “duvidoso, suspeito”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
