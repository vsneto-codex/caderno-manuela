<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["fôlego", "relâmpago", "lâmina", "bônus", "mínimo"], "certa": 3, "explicacao": "d) bônus — bô-nus: é paroxítona."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito antigo e valioso", "arrependido", "que não faz mal, sem efeito", "firme e calmo diante do sofrimento", "fora da época certa"], "certa": 4, "explicacao": "e) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>pagar o pato</b>? Responda com a letra.", "alternativas": ["finalmente entender", "passar por muita dificuldade", "levar a culpa sozinho", "perder a chance por distração", "aguentar algo ruim calado"], "certa": 2, "explicacao": "c) levar a culpa sozinho"}, {"enunciado": "Se eu ___ ajudar, ficaria contente. (verbo querer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["quero", "quisesse", "queira", "quis", "querer"], "certa": 1, "explicacao": "b) quisesse"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Escutamos música.", "Trovejou durante o jogo.", "Meu avô limpou o quarto.", "Manuela e Bianca lavaram o carro.", "A professora de música varreu o quintal."], "certa": 3, "explicacao": "d) Manuela e Bianca lavaram o carro."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pagé", "xícara", "gorjeta", "relâmpago", "chuveiro"], "certa": 0, "explicacao": "a) pagé — o certo é pajé: palavra de origem tupi: j."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["onde é muito difícil viver", "esfriar, perder a força", "espantado, sem reação", "esbanjador, que gasta demais", "atento, prestando atenção"], "certa": 2, "explicacao": "c) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o telefonema", "o clã", "a sentinela", "a guaraná", "a alface"], "certa": 3, "explicacao": "d) a guaraná — o certo é “o guaraná”."}, {"enunciado": "A palavra <b>a mosca</b> é… Responda com a letra.", "alternativas": ["comum de dois", "epiceno", "não tem gênero", "sobrecomum", "tem feminino diferente (biforme)"], "certa": 1, "explicacao": "b) epiceno — animal: a mosca macho / a mosca fêmea."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "desmentir, contradizer", "confirmar, reforçar uma ideia", "que não se apaga", "remédio para todos os males"], "certa": 2, "explicacao": "c) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>barriga</b> se escreve com <b>rr</b>? Responda com a letra.", "alternativas": ["entre vogais, um r só tem som forte", "rr aparece só no começo das palavras", "no começo da palavra, o r já tem som forte", "entre vogais, o som forte do r se escreve com rr", "depois de n, l e s, o r tem som forte com uma letra só"], "certa": 3, "explicacao": "d) entre vogais, o som forte do r se escreve com rr"}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrogância, ar de superioridade", "que está em toda parte", "que fala pouco, de poucas palavras", "pena, compaixão pelos outros", "esfriar, perder a força"], "certa": 0, "explicacao": "a) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["e-xcep-ci-o-nal", "a-jei-tar", "be-so-u-ro", "goia-ba", "té-cni-co"], "certa": 1, "explicacao": "b) a-jei-tar — no ditongo, as duas vogais ficam juntas na mesma sílaba."}, {"enunciado": "Na locução verbal <b>comecei a escutar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["escutar", "o sujeito", "os dois são principais", "não há verbo principal", "comecei"], "certa": 0, "explicacao": "a) escutar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce em <b>Escócia</b> é… Responda com a letra.", "alternativas": ["egípcio", "cuiabano", "belenense", "cubano", "escocês"], "certa": 4, "explicacao": "e) escocês"}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pouco, escasso", "esperto, que percebe tudo rápido", "que não tem habilidade", "excelente, muito habilidoso", "que acontece por acaso"], "certa": 3, "explicacao": "d) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "“Apareceram de repente as crianças da escola.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["não tem sujeito", "Apareceram", "de", "as crianças da escola", "o sujeito está escondido (oculto)"], "certa": 3, "explicacao": "d) as crianças da escola — o sujeito veio depois do verbo. Pergunte: quem apareceram?"}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["assobio", "piscina", "empreza", "travesseiro", "defesa"], "certa": 2, "explicacao": "c) empreza — o certo é empresa: s entre vogais com som de z, de cor."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Ontem, eles venderam limonada.", "Na semana passada, eles tocaram violão.", "No ano que vem, eles varrerão o quintal.", "Daqui a dois dias, eles sonharam com dragões.", "Amanhã, eles desenharão um castelo."], "certa": 3, "explicacao": "d) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>bandeira</b>? Responda com a letra.", "alternativas": ["papelzinho", "copinho", "bolinha", "bandeirola", "partícula"], "certa": 3, "explicacao": "d) bandeirola"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "esperto, que percebe tudo rápido", "um tipo de comida italiana", "isca, armadilha para enganar", "confusão, situação enrolada"], "certa": 4, "explicacao": "e) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["A girafa do zoológico pintou um quadro?", "A girafa do zoológico lavou o carro.", "Corra no parque.", "Como você cresceu!", "Minhas tias viajaram para a praia."], "certa": 0, "explicacao": "a) A girafa do zoológico pintou um quadro?"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Ela deu o recado para eu levar.", "Para mim, estudar à noite é melhor.", "O bolo é para mim.", "Felipe trouxe o caderno para mim desenhar.", "Trouxe o lápis para eu desenhar."], "certa": 3, "explicacao": "d) — o certo é “para eu desenhar”."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>puxar</b>? Responda com a letra.", "alternativas": ["escuro", "empurrar", "não", "separar", "recusar"], "certa": 1, "explicacao": "b) empurrar"}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "oportunidade, ocasião", "que fala ou escreve demais, enrolando", "sem nenhum machucado, ileso", "sem cor, incolor"], "certa": 3, "explicacao": "d) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}, {"enunciado": "“Bianca mora <b>em</b> Salvador.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["tempo", "posse", "causa", "finalidade", "lugar"], "certa": 4, "explicacao": "e) lugar"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O pneu furou; eis por que chegamos atrasados.", "E você foi embora por que motivo?", "O cachorro fugiu porque o portão estava aberto?", "Ela estava feliz, não sei por quê.", "Porquê os gatos ronronam?"], "certa": 4, "explicacao": "e) — o certo é “Por que os gatos ronronam?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Leia: “Pizza de chocolate com banana? Que sabor inusitado!” Nessa frase, <b>inusitado</b> quer dizer… Responda com a letra.", "alternativas": ["que nunca foi usado, novinho", "mentira, golpe para enganar", "esperto, que percebe tudo rápido", "esbanjador, que gasta demais", "incomum, surpreendente"], "certa": 4, "explicacao": "e) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>explicação</b>? Responda com a letra.", "alternativas": ["Coma a salada, já que faz bem à saúde.", "O bolo era bonito, todavia estava sem açúcar.", "Choveu a noite toda, por isso a rua alagou.", "O time ganha se treinar bastante.", "Bianca comprou pão e Felipe comprou leite."], "certa": 0, "explicacao": "a) Coma a salada, já que faz bem à saúde."}, {"enunciado": "Ontem, eles ___ o assunto. Qual forma completa a frase? Responda com a letra.", "alternativas": ["discutiam", "discutiriam", "discutem", "discutiram", "discutirão"], "certa": 3, "explicacao": "d) discutiram — passado: -am."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
