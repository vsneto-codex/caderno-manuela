<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 9 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 9 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["fôlego", "relâmpago", "lâmina", "bônus", "mínimo"], "certa": 3, "explicacao": "d) bônus — bô-nus: é paroxítona."}, {"enunciado": "O que quer dizer <b>anacrônico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["muito antigo e valioso", "arrependido", "que não faz mal, sem efeito", "firme e calmo diante do sofrimento", "fora da época certa"], "certa": 4, "explicacao": "e) fora da época certa. Não é “muito antigo e valioso”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>pôr lenha na fogueira</b>? Responda com a letra.", "alternativas": ["fingir que não é com ele", "agir de um jeito estranho", "perder a chance por distração", "levar a culpa sozinho", "piorar uma briga"], "certa": 4, "explicacao": "e) piorar uma briga"}, {"enunciado": "Quando eu ___ a lição, conto para você. (verbo fazer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["faça", "fiz", "fizer", "fazer", "faço"], "certa": 2, "explicacao": "c) fizer"}, {"enunciado": "Em qual frase o sujeito é <b>composto</b>? Responda com a letra.", "alternativas": ["Os alunos e a diretora abriram a janela.", "Jogamos bola.", "Trovejou e relampejou.", "Meu avô brincou no parque.", "Minhas tias escutaram música."], "certa": 0, "explicacao": "a) Os alunos e a diretora abriram a janela."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["cangica", "ameicha", "jiboia", "engrachate", "xuchu"], "certa": 2, "explicacao": "c) jiboia — palavra de origem tupi: j."}, {"enunciado": "O que quer dizer <b>atônito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["proveitoso, que dá bons resultados", "exibido, que usa palavras difíceis só para se mostrar", "espantado, sem reação", "onde é muito difícil viver", "atento, prestando atenção"], "certa": 2, "explicacao": "c) espantado, sem reação. Não é “atento, prestando atenção”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o guaraná", "o clã", "a sentinela", "a telefonema", "a alface"], "certa": 3, "explicacao": "d) a telefonema — o certo é “o telefonema”."}, {"enunciado": "A palavra <b>a tartaruga</b> é… Responda com a letra.", "alternativas": ["comum de dois", "epiceno", "não tem gênero", "sobrecomum", "tem feminino diferente (biforme)"], "certa": 1, "explicacao": "b) epiceno — animal: a tartaruga macho / a tartaruga fêmea."}, {"enunciado": "O que quer dizer <b>corroborar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "desmentir, contradizer", "confirmar, reforçar uma ideia", "que não se apaga", "remédio para todos os males"], "certa": 2, "explicacao": "c) confirmar, reforçar uma ideia. Não é “desmentir, contradizer”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>faixa</b> se escreve com <b>x</b>? Responda com a letra.", "alternativas": ["depois de me- se usa x", "palavras que vêm de outras com ch usam x", "depois de en- se usa x", "depois de ditongo se usa ch", "depois de ditongo se usa x"], "certa": 4, "explicacao": "e) depois de ditongo se usa x"}, {"enunciado": "O que quer dizer <b>empáfia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "pena, compaixão pelos outros", "mentira, golpe para enganar", "resistente (ao calor, a mudanças)", "arrogância, ar de superioridade"], "certa": 4, "explicacao": "e) arrogância, ar de superioridade. Não é “pena, compaixão pelos outros”: essa é a pegadinha."}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["cé-re-bro", "cha-péu", "op-ção", "fas-ci-nan-te", "chic-le-te"], "certa": 4, "explicacao": "e) chic-le-te — o certo é chi-cle-te: encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Na locução verbal <b>preciso mandar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["mandar", "preciso", "os dois são principais", "não há verbo principal", "o sujeito"], "certa": 0, "explicacao": "a) mandar — o principal é o último, o que diz a ação."}, {"enunciado": "Quem nasce no <b>Amazonas</b> é… Responda com a letra.", "alternativas": ["amazonense", "russo", "teresinense", "baiano", "capixaba"], "certa": 0, "explicacao": "a) amazonense"}, {"enunciado": "O que quer dizer <b>exímio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["digno de confiança, verdadeiro", "excelente, muito habilidoso", "arrependido", "que não faz mal, sem efeito", "que não tem habilidade"], "certa": 1, "explicacao": "b) excelente, muito habilidoso. Não é “que não tem habilidade”: essa é a pegadinha."}, {"enunciado": "“Saiu correndo o dono da padaria.”<br>Qual é o sujeito? Responda com a letra.", "alternativas": ["correndo", "o sujeito está escondido (oculto)", "o dono da padaria", "não tem sujeito", "Saiu"], "certa": 2, "explicacao": "c) o dono da padaria — o sujeito veio depois do verbo. Pergunte: quem saiu?"}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["francesa", "assúcar", "pesquissa", "escelente", "asobio"], "certa": 0, "explicacao": "a) francesa — origem em -esa: s."}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles cantaram na festa.", "No ano que vem, eles jogarão bola.", "No ano que vem, eles mostraram o desenho.", "Amanhã, eles abrirão a janela.", "Amanhã, eles voltarão para casa."], "certa": 2, "explicacao": "c) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual é o diminutivo de <b>chuva</b>? Responda com a letra.", "alternativas": ["colherzinha", "narizinho", "sapatinho", "livrinho", "chuvisco"], "certa": 4, "explicacao": "e) chuvisco"}, {"enunciado": "O que quer dizer <b>imbróglio</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["proveitoso, que dá bons resultados", "um tipo de comida italiana", "excelente, muito habilidoso", "descuidado, que cai fácil em armadilhas", "confusão, situação enrolada"], "certa": 4, "explicacao": "e) confusão, situação enrolada. Não é “um tipo de comida italiana”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>exclamativa</b>? Responda com a letra.", "alternativas": ["Por que o cachorro e o gato decidiram o jogo?", "Como está quente hoje!", "A vovó e o vovô falaram com a vovó.", "Quem olhou as estrelas?", "Procure a bola."], "certa": 1, "explicacao": "b) Como está quente hoje!"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["A professora trouxe a receita para mim copiar.", "Ela deu o recado para eu levar.", "Isso é para eu ler.", "Entre mim e você, tudo bem.", "Para mim, estudar à noite é melhor."], "certa": 0, "explicacao": "a) — o certo é “para eu copiar”."}, {"enunciado": "Qual é o <b>antônimo</b> (o contrário) de <b>puxar</b>? Responda com a letra.", "alternativas": ["empurrar", "último", "pequeno", "fim", "fraco"], "certa": 0, "explicacao": "a) empurrar"}, {"enunciado": "O que quer dizer <b>incólume</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["resistente (ao calor, a mudanças)", "sem nenhum machucado, ileso", "dispensar, não precisar de algo", "sem cor, incolor", "que não faz mal, sem efeito"], "certa": 1, "explicacao": "b) sem nenhum machucado, ileso. Não é “sem cor, incolor”: essa é a pegadinha."}, {"enunciado": "“O caderno <b>de</b> Manuela é novo.”<br>A preposição destacada dá ideia de… Responda com a letra.", "alternativas": ["matéria", "lugar", "falta", "causa", "posse"], "certa": 4, "explicacao": "e) posse"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você está bravo porque perdeu o jogo?", "— Por que você correu? — Por quê estava atrasado.", "Por que os dinossauros desapareceram", "A ponte por que atravessamos é muito antiga.", "Ela estava feliz, não sei por quê."], "certa": 1, "explicacao": "b) — o certo é “— Por que você correu? — Porque estava atrasado.”: explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "Leia: “Pizza de chocolate com banana? Que sabor inusitado!” Nessa frase, <b>inusitado</b> quer dizer… Responda com a letra.", "alternativas": ["caro, que custa muito", "que nunca foi usado, novinho", "incomum, surpreendente", "oportunidade, ocasião", "totalmente fechado; difícil de entender"], "certa": 2, "explicacao": "c) incomum, surpreendente. Não é “que nunca foi usado, novinho”: essa é a pegadinha."}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["A ponte caiu, portanto tivemos de voltar.", "Você chega cedo se pegar o ônibus das sete.", "Beba água, porque está muito calor.", "A sopa estava quente, todavia comi rapidinho.", "O gato pulou e derrubou o vaso."], "certa": 0, "explicacao": "a) A ponte caiu, portanto tivemos de voltar."}, {"enunciado": "No ano que vem, eles ___ um quadro. Qual forma completa a frase? Responda com a letra.", "alternativas": ["pintariam", "pintarão", "pintavam", "pintaram", "pintam"], "certa": 1, "explicacao": "b) pintarão — futuro: -ão."}];
const CHAVE='simulado-bonus-9';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
