<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>dicotomia</b>? Responda com a letra.", "alternativas": ["urgente", "pouco, escasso", "único, sem igual", "divisão em duas partes opostas", "enganoso, feito para induzir ao erro"], "certa": 3, "explicacao": "d) divisão em duas partes opostas"}, {"enunciado": "Por que a palavra <b>princesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["substantivos que vêm de adjetivos terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "femininos e palavras de origem terminam em -esa"], "certa": 4, "explicacao": "e) femininos e palavras de origem terminam em -esa"}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os jovems", "os álbuns", "as couves-flores", "os lápis", "os ônibus"], "certa": 0, "explicacao": "a) os jovems — o certo é os jovens."}, {"enunciado": "“— Eu gosto de chocolate aqui — respondeu a professora.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["A professora respondeu que eu gostava de chocolate ali.", "A professora respondeu que gostava de chocolate ali.", "A professora respondeu que eu gosto de chocolate aqui.", "A professora respondeu que gostava de chocolate aqui.", "A professora respondeu que gosta de chocolate aqui."], "certa": 1, "explicacao": "b) A professora respondeu que gostava de chocolate ali."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aumentar, piorar", "aliviar, diminuir (uma dor, um problema)", "que está em toda parte", "confusão, situação enrolada", "que arma truques para enganar"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "O verbo <b>propor</b> é de que conjugação? Responda com a letra.", "alternativas": ["1ª conjugação (-ar)", "não tem conjugação", "2ª conjugação (-er)", "4ª conjugação (-or)", "3ª conjugação (-ir)"], "certa": 2, "explicacao": "c) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o aumentativo de <b>time</b>? Responda com a letra.", "alternativas": ["cachorrão", "timaço", "festão", "chapelão", "rapagão"], "certa": 1, "explicacao": "b) timaço"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Manuela e Bianca come pizza.", "Manuela e Bianca comi pizza.", "Manuela e Bianca comemos pizza.", "Manuela e Bianca comeram pizza.", "Manuela e Bianca comeu pizza."], "certa": 3, "explicacao": "d) Manuela e Bianca comeram pizza. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Cecília comprou três frutas uva, banana e manga.", "Cecília comprou três frutas: uva, banana, e manga.", "Cecília, comprou três frutas: uva, banana e manga.", "Cecília comprou três frutas: uva banana e manga.", "Cecília comprou três frutas: uva, banana e manga."], "certa": 4, "explicacao": "e) Cecília comprou três frutas: uva, banana e manga. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Cecília e o verbo."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "farto, abundante", "esperto, que percebe tudo rápido", "urgente", "pouco, escasso"], "certa": 4, "explicacao": "e) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["nasimento", "defesa", "surpreza", "deça", "cansaso"], "certa": 1, "explicacao": "b) defesa — s entre vogais com som de z, de cor."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente estudamos juntos todo dia.", "A gente precisa de ajuda.", "A gente dança na festa junina.", "Nós ajudamos a vovó na cozinha.", "Nós cantamos no coral da escola."], "certa": 0, "explicacao": "a) — o certo é “A gente estuda”: a gente pede o verbo como “ele”."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["fada", "lua", "espirro", "cadeira", "monstro"], "certa": 2, "explicacao": "c) espirro — só existe se alguém fizer ou sentir."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "dispensar, não precisar de algo", "urgente", "onde é muito difícil viver", "fora da época certa"], "certa": 2, "explicacao": "c) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>águia</b>? Responda com a letra.", "alternativas": ["o águia macho", "o águio", "o águia", "a águia macho", "a águiazinho"], "certa": 3, "explicacao": "d) a águia macho — águia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Como se escreve <b>32º</b> por extenso? Responda com a letra.", "alternativas": ["vigésimo segundo", "quadragésimo segundo", "trigésimo terceiro", "trigésimo segundo", "trintésimo segundo"], "certa": 3, "explicacao": "d) trigésimo segundo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Entreguei o bilhete a diretora.", "Chegamos às oito horas.", "Chegamos ao meio-dia.", "Falei a pessoas da fila."], "certa": 1, "explicacao": "b) — o certo é “à diretora”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “conseguir; também enganar”? Responda com a letra.", "alternativas": ["idiossincrasia", "indelével", "pernicioso", "lograr", "inaudito"], "certa": 3, "explicacao": "d) lograr"}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que derrete fácil", "exibido, que usa palavras difíceis só para se mostrar", "mentira, golpe para enganar", "que acontece fora de hora", "resistente (ao calor, a mudanças)"], "certa": 4, "explicacao": "e) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Jogue bola.", "Os primos de Ricardo dançaram na quadrilha?", "A turma do quinto ano brincou no parque.", "Quem vendeu limonada?", "Que bolo gostoso!"], "certa": 2, "explicacao": "c) A turma do quinto ano brincou no parque."}, {"enunciado": "Tomara que nós ___ ajudar. (verbo querer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["queiramos", "quisemos", "querer", "queremos", "quiséssemos"], "certa": 0, "explicacao": "a) queiramos"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ela guardou o segredo com discrição.", "O jogador deu xeque no rei adversário.", "Os brinquedos ficam na seção infantil da loja.", "A chuva era iminente: o céu escureceu.", "Ele fez um comprimento para a plateia."], "certa": 4, "explicacao": "e) — o certo é “cumprimento” (saudação)."}, {"enunciado": "Ontem eu ___ (verbo <b>satisfazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["satisfazei", "satisfazeru", "satisfez", "satisfiz", "satisfazi"], "certa": 3, "explicacao": "d) satisfiz — satisfazer segue fazer: eu fiz → eu satisfiz."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["curado de uma doença", "preciso, feito com muito cuidado", "que fala pouco, de poucas palavras", "fora da época certa", "que acontece por acaso"], "certa": 1, "explicacao": "b) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["cidadão", "pescar", "rouxinol", "fubá", "matemática"], "certa": 4, "explicacao": "e) matemática — ma-te-má-ti-ca: é proparoxítona."}, {"enunciado": "Se “ele provém”, então… Responda com a letra.", "alternativas": ["eles provém", "eles provêem", "eles provens", "eles provem", "eles provêm"], "certa": 4, "explicacao": "e) eles provêm — ter, vir e os que vêm deles ganham chapeuzinho no plural (têm, vêm, contêm)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comprei maçã, manga e uva.", "Bianca, cuidado com o degrau!", "Os meninos da rua, varreram o quintal.", "Bianca, venha jantar!", "Ontem, choveu muito."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (Os meninos da rua) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>comecei a mexer</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["mexer", "os dois são principais", "comecei", "não há verbo principal", "o sujeito"], "certa": 0, "explicacao": "a) mexer — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "isca, armadilha para enganar", "crítica, ataque", "que arma truques para enganar", "muito pequeno, escasso"], "certa": 0, "explicacao": "a) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["boxecha", "chícara", "chuchu", "tijela", "enchuto"], "certa": 2, "explicacao": "c) chuchu — com ch nas duas sílabas."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
