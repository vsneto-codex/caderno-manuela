<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>ínterim</b>? Responda com a letra.", "alternativas": ["o mais importante", "diferente, especial", "enganoso, feito para induzir ao erro", "intervalo, \"enquanto isso\"", "grosseiro, muito grave (um erro)"], "certa": 3, "explicacao": "d) intervalo, \"enquanto isso\""}, {"enunciado": "Por que a palavra <b>francesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["substantivos que vêm de adjetivos terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "femininos e palavras de origem terminam em -esa"], "certa": 4, "explicacao": "e) femininos e palavras de origem terminam em -esa"}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os animals", "os álbuns", "as couves-flores", "os lápis", "os ônibus"], "certa": 0, "explicacao": "a) os animals — o certo é os animais."}, {"enunciado": "“— Eu gosto de chocolate aqui — respondeu a professora.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["A professora respondeu que eu gostava de chocolate ali.", "A professora respondeu que gostava de chocolate ali.", "A professora respondeu que eu gosto de chocolate aqui.", "A professora respondeu que gostava de chocolate aqui.", "A professora respondeu que gosta de chocolate aqui."], "certa": 1, "explicacao": "b) A professora respondeu que gostava de chocolate ali."}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que entende rápido", "lento para entender", "preciso, feito com muito cuidado", "incomum, surpreendente", "breve e direto"], "certa": 1, "explicacao": "b) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "O verbo <b>propor</b> é de que conjugação? Responda com a letra.", "alternativas": ["1ª conjugação (-ar)", "não tem conjugação", "2ª conjugação (-er)", "4ª conjugação (-or)", "3ª conjugação (-ir)"], "certa": 2, "explicacao": "c) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o aumentativo de <b>time</b>? Responda com a letra.", "alternativas": ["cachorrão", "timaço", "festão", "chapelão", "rapagão"], "certa": 1, "explicacao": "b) timaço"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Manuela e Bianca come pizza.", "Manuela e Bianca comi pizza.", "Manuela e Bianca comemos pizza.", "Manuela e Bianca comeram pizza.", "Manuela e Bianca comeu pizza."], "certa": 3, "explicacao": "d) Manuela e Bianca comeram pizza. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Cecília comprou três frutas uva, banana e manga.", "Cecília comprou três frutas: uva, banana, e manga.", "Cecília, comprou três frutas: uva, banana e manga.", "Cecília comprou três frutas: uva banana e manga.", "Cecília comprou três frutas: uva, banana e manga."], "certa": 4, "explicacao": "e) Cecília comprou três frutas: uva, banana e manga. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Cecília e o verbo."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "que tem as pernas compridas", "defesa, elogio de uma ideia", "muito pequeno, escasso", "exibido, que usa palavras difíceis só para se mostrar"], "certa": 4, "explicacao": "e) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["nasimento", "empresa", "surpreza", "deça", "cansaso"], "certa": 1, "explicacao": "b) empresa — s entre vogais com som de z, de cor."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente chegamos cedo à escola.", "A gente precisa de ajuda.", "A gente dança na festa junina.", "Nós ajudamos a vovó na cozinha.", "Nós cantamos no coral da escola."], "certa": 0, "explicacao": "a) — o certo é “A gente chega”: a gente pede o verbo como “ele”."}, {"enunciado": "Só uma destas palavras é um substantivo <b>ABSTRATO</b>. Qual? Responda com a letra.", "alternativas": ["fada", "lua", "espirro", "cadeira", "monstro"], "certa": 2, "explicacao": "c) espirro — só existe se alguém fizer ou sentir."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caprichado e bem-arrumado", "combinado sem precisar falar, subentendido", "que fala ou escreve demais, enrolando", "exibido, que usa palavras difíceis só para se mostrar", "digno de confiança, verdadeiro"], "certa": 2, "explicacao": "c) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>águia</b>? Responda com a letra.", "alternativas": ["o águia macho", "o águio", "o águia", "a águia macho", "a águiazinho"], "certa": 3, "explicacao": "d) a águia macho — águia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Como se escreve <b>32º</b> por extenso? Responda com a letra.", "alternativas": ["vigésimo segundo", "quadragésimo segundo", "trigésimo terceiro", "trigésimo segundo", "trintésimo segundo"], "certa": 3, "explicacao": "d) trigésimo segundo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aprendi a nadar.", "Entreguei o bilhete a vizinha.", "Chegamos às oito horas.", "Chegamos ao meio-dia.", "Falei a pessoas da fila."], "certa": 1, "explicacao": "b) — o certo é “à vizinha”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “apagar, destruir por completo”? Responda com a letra.", "alternativas": ["inócuo", "incólume", "obliterar", "perscrutar", "idôneo"], "certa": 2, "explicacao": "c) obliterar"}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["veloz, apressado", "descuidado, que cai fácil em armadilhas", "espantado, sem reação", "fora da época certa", "intenso, enérgico"], "certa": 4, "explicacao": "e) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Jogue bola.", "Os primos de Ricardo dançaram na quadrilha?", "A turma do quinto ano brincou no parque.", "Quem vendeu limonada?", "Que bolo gostoso!"], "certa": 2, "explicacao": "c) A turma do quinto ano brincou no parque."}, {"enunciado": "Tomara que nós ___ ajudar. (verbo querer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["queiramos", "quisemos", "querer", "queremos", "quiséssemos"], "certa": 0, "explicacao": "a) queiramos"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ela guardou o segredo com discrição.", "O jogador deu xeque no rei adversário.", "Os brinquedos ficam na seção infantil da loja.", "A chuva era iminente: o céu escureceu.", "O cabelo dela é cumprido e liso."], "certa": 4, "explicacao": "e) — o certo é “comprido” (longo)."}, {"enunciado": "Ontem eu ___ (verbo <b>desdizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["desdizei", "desdizeru", "desdiz", "desdisse", "desdizi"], "certa": 3, "explicacao": "d) desdisse — desdizer segue dizer: eu disse → eu desdisse."}, {"enunciado": "O que quer dizer <b>amiúde</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aos pouquinhos, em pedaços miúdos", "muitas vezes, com frequência", "inconveniente; fora do assunto", "digno de confiança, verdadeiro", "fora da época certa"], "certa": 1, "explicacao": "b) muitas vezes, com frequência. Não é “aos pouquinhos, em pedaços miúdos”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["cidadão", "pescar", "rouxinol", "fubá", "matemática"], "certa": 4, "explicacao": "e) matemática — ma-te-má-ti-ca: é proparoxítona."}, {"enunciado": "Se “ele provém”, então… Responda com a letra.", "alternativas": ["eles provém", "eles provêem", "eles provens", "eles provem", "eles provêm"], "certa": 4, "explicacao": "e) eles provêm — ter, vir e os que vêm deles ganham chapeuzinho no plural (têm, vêm, contêm)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comprei maçã, manga e uva.", "Bianca, cuidado com o degrau!", "A girafa do zoológico, varreu o quintal.", "Bianca, venha jantar!", "Ontem, choveu muito."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (A girafa do zoológico) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>comecei a mexer</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["mexer", "os dois são principais", "comecei", "não há verbo principal", "o sujeito"], "certa": 0, "explicacao": "a) mexer — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que está em toda parte", "esquentar, ficar mais forte", "esfriar, perder a força", "grosseiro, muito grave (um erro)", "proveitoso, que dá bons resultados"], "certa": 2, "explicacao": "c) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["xampu", "engrachate", "lagartixa", "relâmpago", "chuveiro"], "certa": 1, "explicacao": "b) engrachate — o certo é engraxate: vem de graxa: x."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
