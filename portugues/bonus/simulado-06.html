<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>conciso</b>? Responda com a letra.", "alternativas": ["urgente", "pouco, escasso", "único, sem igual", "breve e direto", "enganoso, feito para induzir ao erro"], "certa": 3, "explicacao": "d) breve e direto"}, {"enunciado": "Por que a palavra <b>pobreza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "substantivos que vêm de adjetivos terminam em -eza"], "certa": 4, "explicacao": "e) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Atenção: quatro destes plurais estão CERTOS, mesmo parecendo estranhos. Qual está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["os hífens", "os lápis", "os répteis", "os ônibus", "os guarda-chuvas"], "certa": 0, "explicacao": "a) os hífens — o certo é os hifens."}, {"enunciado": "“— Eu gosto de chocolate aqui — respondeu a professora.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["A professora respondeu que eu gostava de chocolate ali.", "A professora respondeu que gostava de chocolate ali.", "A professora respondeu que eu gosto de chocolate aqui.", "A professora respondeu que gostava de chocolate aqui.", "A professora respondeu que gosta de chocolate aqui."], "certa": 1, "explicacao": "b) A professora respondeu que gostava de chocolate ali."}, {"enunciado": "O que quer dizer <b>mitigar</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aumentar, piorar", "aliviar, diminuir (uma dor, um problema)", "que está em toda parte", "confusão, situação enrolada", "que arma truques para enganar"], "certa": 1, "explicacao": "b) aliviar, diminuir (uma dor, um problema). Não é “aumentar, piorar”: essa é a pegadinha."}, {"enunciado": "O verbo <b>repor</b> é de que conjugação? Responda com a letra.", "alternativas": ["3ª conjugação (-ir)", "não tem conjugação", "2ª conjugação (-er)", "4ª conjugação (-or)", "1ª conjugação (-ar)"], "certa": 2, "explicacao": "c) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o aumentativo de <b>barco</b>? Responda com a letra.", "alternativas": ["bocarra", "pedação", "muralha", "cachorrão", "barcaça"], "certa": 4, "explicacao": "e) barcaça"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As amigas de Lívia beberam suco.", "As amigas de Lívia bebeu suco.", "As amigas de Lívia bebemos suco.", "As amigas de Lívia bebe suco.", "As amigas de Lívia bebi suco."], "certa": 0, "explicacao": "a) As amigas de Lívia beberam suco. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Ana comprou três frutas: maçã, laranja e banana.", "Ana comprou três frutas maçã, laranja e banana.", "Ana comprou três frutas: maçã laranja e banana.", "Ana comprou três frutas: maçã, laranja, e banana.", "Ana, comprou três frutas: maçã, laranja e banana."], "certa": 0, "explicacao": "a) Ana comprou três frutas: maçã, laranja e banana. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Ana e o verbo."}, {"enunciado": "O que quer dizer <b>parco</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["defesa, elogio de uma ideia", "proveitoso, que dá bons resultados", "que traz boas notícias", "pouco, escasso", "farto, abundante"], "certa": 3, "explicacao": "d) pouco, escasso. Não é “farto, abundante”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["travesceiro", "adolescente", "pesquisa", "francesa", "surpresa"], "certa": 0, "explicacao": "a) travesceiro — o certo é travesseiro: som de s entre vogais: ss."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós jogamos bola no recreio.", "A gente gosta de pizza.", "A gente escrevemos cartas para a vovó.", "Nós brincamos no parque.", "A gente desenha muito bem."], "certa": 2, "explicacao": "c) — o certo é “A gente escreve”: a gente pede o verbo como “ele”."}, {"enunciado": "Só uma destas palavras é um substantivo <b>CONCRETO</b>. Qual? Responda com a letra.", "alternativas": ["pulo", "dragão", "beleza", "frio", "tristeza"], "certa": 1, "explicacao": "b) dragão — existe por si, mesmo que seja imaginário."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Elas veem o mar da janela.", "Eles lêem um livro por semana.", "Vou pôr o casaco.", "Eles creem em fadas.", "Passamos por uma ponte."], "certa": 1, "explicacao": "b) — o certo é “Eles leem…”."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "isca, armadilha para enganar", "que pode esperar", "confusão, situação enrolada", "urgente"], "certa": 4, "explicacao": "e) urgente. Não é “que pode esperar”: essa é a pegadinha."}, {"enunciado": "Como se diz a fêmea do <b>jacaré</b>? Responda com a letra.", "alternativas": ["a jacaréa", "a jacaré", "a jacaré fêmea", "o jacarézinha", "o jacaré fêmea"], "certa": 4, "explicacao": "e) o jacaré fêmea — jacaré é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Como se escreve <b>95º</b> por extenso? Responda com a letra.", "alternativas": ["noventésimo quinto", "nonagésimo sexto", "centésimo quinto", "nonagésimo quinto", "octogésimo quinto"], "certa": 3, "explicacao": "d) nonagésimo quinto"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Às vezes, durmo à tarde.", "Fui à praia a pé.", "Ficaram frente a frente.", "Passeamos a cavalo.", "Ricardo vai a loja."], "certa": 4, "explicacao": "e) — o certo é “à loja”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “notável, que chama a atenção”? Responda com a letra.", "alternativas": ["incólume", "mitigar", "capcioso", "conspícuo", "impávido"], "certa": 3, "explicacao": "d) conspícuo"}, {"enunciado": "O que quer dizer <b>refratário</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que derrete fácil", "resistente (ao calor, a mudanças)", "fora da época certa", "que não se apaga", "que passa num instante"], "certa": 1, "explicacao": "b) resistente (ao calor, a mudanças). Não é “que derrete fácil”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Por que os meninos da rua procuraram a bola?", "Que festa animada!", "Responda às perguntas!", "Beba suco.", "As amigas de Lívia assistiram a um filme."], "certa": 4, "explicacao": "e) As amigas de Lívia assistiram a um filme."}, {"enunciado": "Espero que ele ___ em casa. (verbo estar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["está", "esteja", "esteje", "esteve", "estar"], "certa": 1, "explicacao": "b) esteja"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O ladrão quis delatar o colega à polícia.", "O cachorro abanou a calda de alegria.", "O prazo foi cumprido à risca.", "Ele tem um ótimo senso de humor.", "Medi o comprimento da mesa com a fita métrica."], "certa": 1, "explicacao": "b) — o certo é “cauda” (rabo)."}, {"enunciado": "Ontem eu ___ (verbo <b>reter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["retive", "reteu", "reti", "retei", "reteru"], "certa": 0, "explicacao": "a) retive — reter segue ter: eu tive → eu retive."}, {"enunciado": "O que quer dizer <b>acurado</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["grosseiro, muito grave (um erro)", "curado de uma doença", "muitas vezes, com frequência", "rigoroso e sem luxo", "preciso, feito com muito cuidado"], "certa": 4, "explicacao": "e) preciso, feito com muito cuidado. Não é “curado de uma doença”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["cuscuz", "irmã", "bebê", "policial", "pônei"], "certa": 4, "explicacao": "e) pônei — pô-nei: é paroxítona."}, {"enunciado": "Se “ele vê”, então… Responda com a letra.", "alternativas": ["eles veem", "eles vêm", "eles vêem", "eles vê", "eles veen"], "certa": 0, "explicacao": "a) eles veem — ler, ver, crer e os que vêm deles têm “ee” sem acento no plural (leem, veem, creem)."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "São Paulo, 16 de outubro de 2026.", "Comprei manga, banana e pera.", "Manuela e Bianca, aprenderam uma música nova.", "Felipe, cuidado com o degrau!"], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>devo meter</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["devo", "o sujeito", "meter", "os dois são principais", "não há verbo principal"], "certa": 2, "explicacao": "c) meter — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>apologia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que percebe tudo rápido", "mínimo, o menor de todos", "crítica, ataque", "confusão, situação enrolada", "defesa, elogio de uma ideia"], "certa": 4, "explicacao": "e) defesa, elogio de uma ideia. Não é “crítica, ataque”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
