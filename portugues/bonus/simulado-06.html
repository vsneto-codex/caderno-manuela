<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Daqui a dois dias, eles correrão no parque.", "No ano que vem, eles mandaram uma mensagem.", "Daqui a dois dias, eles aprenderão uma música nova.", "Daqui a dois dias, eles voltarão para casa.", "No ano que vem, eles guardarão os brinquedos."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["levantar", "paletó", "colher", "proíbe", "porém"], "certa": 3, "explicacao": "d) proíbe — pro-í-be: é paroxítona."}, {"enunciado": "Qual é o diminutivo de <b>parte</b>? Responda com a letra.", "alternativas": ["copinho", "menininho", "maleta", "partícula", "camiseta"], "certa": 3, "explicacao": "d) partícula"}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "esperto, que entende rápido", "nunca visto antes, extraordinário", "firme e calmo diante do sofrimento", "lento para entender"], "certa": 4, "explicacao": "e) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "Ontem eles ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["têm", "teram", "tiveram", "terão", "tinham"], "certa": 2, "explicacao": "c) tiveram"}, {"enunciado": "Na frase “O caminho <b>por que</b> passei estava cheio de flores.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["o motivo", "por qual", "pois", "pelo qual / pela qual", "por qual motivo"], "certa": 3, "explicacao": "d) pelo qual / pela qual — troque por “pelo qual” ou “pela qual” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem as pernas compridas", "inconveniente; fora do assunto", "confusão, situação enrolada", "exibido, que usa palavras difíceis só para se mostrar", "esbanjador, que gasta demais"], "certa": 3, "explicacao": "d) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Na locução verbal <b>preciso começar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["preciso", "começar", "os dois são principais", "não há verbo principal", "o sujeito"], "certa": 1, "explicacao": "b) começar — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["caprichado e bem-arrumado", "muito pequeno, escasso", "oportunidade, ocasião", "que fala ou escreve demais, enrolando", "muitas vezes, com frequência"], "certa": 3, "explicacao": "d) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Para mim, fazer isso é fácil.", "Trouxe o lápis para eu desenhar.", "Entre mim e você, tudo bem.", "Para mim, estudar à noite é melhor.", "Ela trouxe a revista para eu."], "certa": 4, "explicacao": "e) — o certo é “para mim”."}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["jar-di-ne-i-ro", "via-gem", "liv-ro", "o-ce-a-no", "o-bje-to"], "certa": 3, "explicacao": "d) o-ce-a-no — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Ontem eu ___ (verbo <b>supor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["supi", "supori", "supus", "supôs", "suponhei"], "certa": 2, "explicacao": "c) supus — supor segue pôr: eu pus → eu supus."}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "excelente, muito habilidoso", "inconveniente; fora do assunto", "esforço, vontade forte de fazer algo", "veloz, apressado"], "certa": 0, "explicacao": "a) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Holanda</b> é… Responda com a letra.", "alternativas": ["holandês", "peruano", "cuiabano", "colombiano", "baiano"], "certa": 0, "explicacao": "a) holandês"}, {"enunciado": "O que quer dizer <b>amiúde</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["aos pouquinhos, em pedaços miúdos", "dispensar, não precisar de algo", "mentira, golpe para enganar", "excelente, muito habilidoso", "muitas vezes, com frequência"], "certa": 4, "explicacao": "e) muitas vezes, com frequência. Não é “aos pouquinhos, em pedaços miúdos”: essa é a pegadinha."}, {"enunciado": "A palavra <b>o polvo</b> é… Responda com a letra.", "alternativas": ["não tem gênero", "tem feminino diferente (biforme)", "sobrecomum", "comum de dois", "epiceno"], "certa": 4, "explicacao": "e) epiceno — animal: o polvo macho / o polvo fêmea."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["cachecol", "xuveiro", "gorjeta", "chuchu", "gengibre"], "certa": 1, "explicacao": "b) xuveiro — o certo é chuveiro: com ch, de cor."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ficaram frente a frente.", "Vire à esquerda.", "Fui a cozinha.", "Falei a pessoas da fila.", "Fui ao clube e à piscina."], "certa": 2, "explicacao": "c) — o certo é “à cozinha”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Você chegou atrasado por que?", "O bolo queimou porque ficou muito tempo no forno?", "O cachorro fugiu porque o portão estava aberto?", "O gato fugiu, não sei por quê, e voltou à noite.", "Não há por que correr: ainda é cedo."], "certa": 0, "explicacao": "a) — o certo é “Você chegou atrasado por quê?”: está no fim da frase, logo antes do ponto: aí ganha acento."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "esfriar, perder a força", "proveitoso, que dá bons resultados", "firme e calmo diante do sofrimento", "esquentar, ficar mais forte"], "certa": 1, "explicacao": "b) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["leopardo", "vulcão", "alegria", "joaninha", "coroa"], "certa": 1, "explicacao": "b) vulcão — vul-cão"}, {"enunciado": "Qual é a junção de <b>em + essa</b>? Responda com a letra.", "alternativas": ["dessa", "àessa", "eoessa", "nessa", "em essa"], "certa": 3, "explicacao": "d) nessa"}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "mínimo, o menor de todos", "que está em toda parte", "lento para entender", "do contra, teimoso"], "certa": 0, "explicacao": "a) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas estão CERTAS, mesmo parecendo estranhas. Em qual o artigo está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["o mapa", "o eclipse", "a cal", "o tema", "a guaraná"], "certa": 4, "explicacao": "e) a guaraná — o certo é “o guaraná”."}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["pequeno", "foguinho", "requeijão", "frequente", "caranguejo"], "certa": 3, "explicacao": "d) frequente — em “frequente” a gente fala o u"}, {"enunciado": "“Vovô, dá um abracinho!”<br>Que sentido tem <b>abracinho</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "pressa", "desprezo", "carinho", "admiração"], "certa": 3, "explicacao": "d) carinho"}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>rápido</b>? Responda com a letra.", "alternativas": ["fidelíssimo", "rapidílimo", "rapidérrimo", "rapidíssimo", "sacratíssimo"], "certa": 3, "explicacao": "d) rapidíssimo"}, {"enunciado": "Leia: “O “remédio milagroso” era um embuste.” Nessa frase, <b>embuste</b> quer dizer… Responda com a letra.", "alternativas": ["empurrão", "confusão, situação enrolada", "que passa num instante", "lento para entender", "mentira, golpe para enganar"], "certa": 4, "explicacao": "e) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>certeza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "palavras que indicam país terminam em -eza", "o final -esa sempre se escreve com z", "substantivos que vêm de adjetivos terminam em -eza", "toda palavra terminada em -eza é feminino de origem"], "certa": 3, "explicacao": "d) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "Espero que ele ___ a resposta. (verbo saber)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["soube", "saiba", "soubesse", "saber", "sabe"], "certa": 1, "explicacao": "b) saiba"}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
