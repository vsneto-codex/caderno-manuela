<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>desídia</b>? Responda com a letra.", "alternativas": ["definitivo, que não admite discussão", "confusão, situação enrolada", "proveitoso, que dá bons resultados", "enganoso, feito para induzir ao erro", "preguiça, desleixo"], "certa": 4, "explicacao": "e) preguiça, desleixo"}, {"enunciado": "Por que a palavra <b>mesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o s tem som de z", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss"], "certa": 0, "explicacao": "a) entre vogais, o s tem som de z"}, {"enunciado": "“— Eu adoro dinossauros aqui — respondeu Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo respondeu que eu adorava dinossauros ali.", "Ricardo respondeu que adora dinossauros aqui.", "Ricardo respondeu que adorava dinossauros aqui.", "Ricardo respondeu que adorava dinossauros ali.", "Ricardo respondeu que eu adoro dinossauros aqui."], "certa": 3, "explicacao": "d) Ricardo respondeu que adorava dinossauros ali."}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que entende rápido", "lento para entender", "breve e direto", "combinado sem precisar falar, subentendido", "espantado, sem reação"], "certa": 1, "explicacao": "b) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "O verbo <b>pressupor</b> é de que conjugação? Responda com a letra.", "alternativas": ["3ª conjugação (-ir)", "2ª conjugação (-er)", "não tem conjugação", "1ª conjugação (-ar)", "4ª conjugação (-or)"], "certa": 1, "explicacao": "b) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o diminutivo de <b>sala</b>? Responda com a letra.", "alternativas": ["burrico", "cafezinho", "partícula", "saleta", "bolinha"], "certa": 3, "explicacao": "d) saleta"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os meninos da rua mandou uma mensagem.", "Os meninos da rua mandei uma mensagem.", "Os meninos da rua mandamos uma mensagem.", "Os meninos da rua manda uma mensagem.", "Os meninos da rua mandaram uma mensagem."], "certa": 4, "explicacao": "e) Os meninos da rua mandaram uma mensagem. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Samuel viu três animais: tigre, zebra e leão.", "Samuel viu três animais: tigre zebra e leão.", "Samuel, viu três animais: tigre, zebra e leão.", "Samuel viu três animais: tigre, zebra, e leão.", "Samuel viu três animais tigre, zebra e leão."], "certa": 0, "explicacao": "a) Samuel viu três animais: tigre, zebra e leão. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Samuel e o verbo."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que tem as pernas compridas", "sem nenhum machucado, ileso", "novato, iniciante", "exibido, que usa palavras difíceis só para se mostrar", "pouco, escasso"], "certa": 3, "explicacao": "d) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["asobio", "excelente", "exceção", "açúcar", "travesseiro"], "certa": 0, "explicacao": "a) asobio — o certo é assobio: som de s entre vogais: ss."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "caprichado e bem-arrumado", "lento para entender", "novato, iniciante", "sem medo, destemido"], "certa": 0, "explicacao": "a) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>31º</b> por extenso? Responda com a letra.", "alternativas": ["trigésimo segundo", "trigésimo primeiro", "quadragésimo primeiro", "vigésimo primeiro", "trintésimo primeiro"], "certa": 1, "explicacao": "b) trigésimo primeiro"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Vou à Bahia.", "Aprendi a nadar.", "Chegamos às oito horas.", "Cheguei a cidade.", "Falei a pessoas da fila."], "certa": 3, "explicacao": "d) — o certo é “à cidade”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “que dura muito, que não acaba”? Responda com a letra.", "alternativas": ["cizânia", "relutante", "ardiloso", "escopo", "perene"], "certa": 4, "explicacao": "e) perene"}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "muitas vezes, com frequência", "veloz, apressado", "que não faz mal, sem efeito", "fora da época certa"], "certa": 0, "explicacao": "a) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Nossa, que frio!", "O time de Felipe guardou os brinquedos?", "Plante uma árvore.", "A vovó e o vovô varreram o quintal.", "Beba suco!"], "certa": 3, "explicacao": "d) A vovó e o vovô varreram o quintal."}, {"enunciado": "Espero que ele ___ um presente. (verbo dar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["deu", "dê", "desse", "dá", "dar"], "certa": 1, "explicacao": "b) dê"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O mergulhador vai imergir no mar profundo.", "A orquestra fez um lindo concerto no teatro.", "O piano foi para o conserto porque estava desafinado.", "O rei da Pérsia era chamado de chá.", "Ao dormir, é preciso cerrar os olhos."], "certa": 3, "explicacao": "d) — o certo é “xá” (antigo rei do Irã)."}, {"enunciado": "Ontem eu ___ (verbo <b>predizer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["prediz", "predizi", "predizei", "predizeru", "predisse"], "certa": 4, "explicacao": "e) predisse — predizer segue dizer: eu disse → eu predisse."}, {"enunciado": "O que quer dizer <b>amiúde</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "incomum, surpreendente", "muitas vezes, com frequência", "aos pouquinhos, em pedaços miúdos", "digno de confiança, verdadeiro"], "certa": 2, "explicacao": "c) muitas vezes, com frequência. Não é “aos pouquinhos, em pedaços miúdos”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["lágrima", "xícara", "tríceps", "tráfego", "sábado"], "certa": 2, "explicacao": "c) tríceps — trí-ceps: é paroxítona."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["São Paulo, 16 de outubro de 2026.", "Comprei pera, uva e maçã.", "Felipe, venha jantar!", "Manuela e Bianca, abriram a janela.", "Felipe, o mais alto da turma, chegou cedo."], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>posso jogar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["posso", "não há verbo principal", "jogar", "o sujeito", "os dois são principais"], "certa": 2, "explicacao": "c) jogar — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esquentar, ficar mais forte", "rigoroso e sem luxo", "esbanjador, que gasta demais", "esfriar, perder a força", "que acontece por acaso"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["beringela", "gengibre", "gorjeta", "mexerica", "cachecol"], "certa": 0, "explicacao": "a) beringela — o certo é berinjela: com j, de cor."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Tomara!</b> expressa? Responda com a letra.", "alternativas": ["afastamento", "pedido de silêncio", "medo", "advertência", "desejo"], "certa": 4, "explicacao": "e) desejo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Quero entender por que a Lua muda de forma.", "Ninguém explicou porque a aula acabou mais cedo.", "Ela estava feliz, não sei por quê.", "As cidades por que viajamos eram lindas.", "Ela chorou e não disse por quê."], "certa": 1, "explicacao": "b) — o certo é “Ninguém explicou por que a aula acabou mais cedo.”: é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "proveitoso, que dá bons resultados", "do contra, teimoso", "urgente", "preciso, feito com muito cuidado"], "certa": 0, "explicacao": "a) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A casa era velha, mas muito bonita.", "Há três dias que o gato não aparece.", "Coloque mais sal na pipoca.", "O parque onde brincamos fechou.", "A três gatos dormindo no sofá."], "certa": 4, "explicacao": "e) o certo é “Há”"}, {"enunciado": "Quem nasce em <b>Pernambuco</b> é… Responda com a letra.", "alternativas": ["gaúcho", "pernambucano", "amapaense", "inglês", "venezuelano"], "certa": 1, "explicacao": "b) pernambucano"}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
