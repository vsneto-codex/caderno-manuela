<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>deletério</b>? Responda com a letra.", "alternativas": ["definitivo, que não admite discussão", "confusão, situação enrolada", "proveitoso, que dá bons resultados", "enganoso, feito para induzir ao erro", "nocivo, prejudicial (não é \"que se apaga\")"], "certa": 4, "explicacao": "e) nocivo, prejudicial (não é \"que se apaga\")"}, {"enunciado": "Por que a palavra <b>japonesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "toda palavra terminada em -eza é feminino de origem", "o final -esa sempre se escreve com z", "palavras que indicam país terminam em -eza", "substantivos que vêm de adjetivos terminam em -eza"], "certa": 0, "explicacao": "a) femininos e palavras de origem terminam em -esa"}, {"enunciado": "“— Eu gosto de chocolate agora — contou Felipe.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Felipe contou que eu gostava de chocolate naquele momento.", "Felipe contou que gosta de chocolate agora.", "Felipe contou que gostava de chocolate agora.", "Felipe contou que gostava de chocolate naquele momento.", "Felipe contou que eu gosto de chocolate agora."], "certa": 3, "explicacao": "d) Felipe contou que gostava de chocolate naquele momento."}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "fora da época certa", "lento para entender", "aliviar, diminuir (uma dor, um problema)", "esperto, que entende rápido"], "certa": 2, "explicacao": "c) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "O verbo <b>dispor</b> é de que conjugação? Responda com a letra.", "alternativas": ["2ª conjugação (-er)", "não tem conjugação", "4ª conjugação (-or)", "1ª conjugação (-ar)", "3ª conjugação (-ir)"], "certa": 0, "explicacao": "a) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o diminutivo de <b>mala</b>? Responda com a letra.", "alternativas": ["maleta", "menininho", "casebre", "copinho", "chuvisco"], "certa": 0, "explicacao": "a) maleta"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As amigas de Lívia decidiu o jogo.", "As amigas de Lívia decide o jogo.", "As amigas de Lívia decidimos o jogo.", "As amigas de Lívia decidi o jogo.", "As amigas de Lívia decidiram o jogo."], "certa": 4, "explicacao": "e) As amigas de Lívia decidiram o jogo. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Marina escolheu três cores: azul, laranja, e amarelo.", "Marina escolheu três cores: azul laranja e amarelo.", "Marina escolheu três cores azul, laranja e amarelo.", "Marina escolheu três cores: azul, laranja e amarelo.", "Marina, escolheu três cores: azul, laranja e amarelo."], "certa": 3, "explicacao": "d) Marina escolheu três cores: azul, laranja e amarelo. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Marina e o verbo."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "exibido, que usa palavras difíceis só para se mostrar", "aliviar, diminuir (uma dor, um problema)", "sem nenhum machucado, ileso", "que tem as pernas compridas"], "certa": 1, "explicacao": "b) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["excesão", "eceção", "excessão", "exceção", "esceção"], "certa": 3, "explicacao": "d) exceção — com xc, como exceto."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["onde é muito difícil viver", "que dura pouco tempo", "que fala ou escreve demais, enrolando", "caprichado e bem-arrumado", "nunca visto antes, extraordinário"], "certa": 2, "explicacao": "c) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>25º</b> por extenso? Responda com a letra.", "alternativas": ["vigésimo quinto", "vintésimo quinto", "vigésimo sexto", "décimo quinto", "trigésimo quinto"], "certa": 0, "explicacao": "a) vigésimo quinto"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui a escola.", "Entreguei o presente a ela.", "Chegamos ao meio-dia.", "Passeamos a cavalo.", "Fui ao clube e à piscina."], "certa": 0, "explicacao": "a) — o certo é “à escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “espalhar-se (doença, boato)”? Responda com a letra.", "alternativas": ["tácito", "grassar", "vigoroso", "peremptório", "prescindir"], "certa": 1, "explicacao": "b) grassar"}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que traz boas notícias", "que dura muito, que não acaba", "intenso, enérgico", "veloz, apressado", "tão bom que não dá para descrever com palavras"], "certa": 2, "explicacao": "c) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>imperativa</b>? Responda com a letra.", "alternativas": ["O vizinho do lado mostrou o desenho.", "Que bolo gostoso!", "Compre pão!", "Por que os primos de Ricardo uniram as peças?", "A vovó e o vovô responderam às perguntas."], "certa": 2, "explicacao": "c) Compre pão!"}, {"enunciado": "Se eu ___ a lição, ficaria contente. (verbo fazer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["fizesse", "faço", "fiz", "faça", "fazer"], "certa": 0, "explicacao": "a) fizesse"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Guardei o arroz na despensa.", "A polícia combate o tráfico de animais silvestres.", "O emigrante saiu de Portugal para morar no Brasil.", "Ele fez um cumprimento para a plateia.", "Furar o sinal vermelho é uma inflação."], "certa": 4, "explicacao": "e) — o certo é “infração” (violação de regra)."}, {"enunciado": "Ontem eu ___ (verbo <b>satisfazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["satisfazi", "satisfazeru", "satisfiz", "satisfez", "satisfazei"], "certa": 2, "explicacao": "c) satisfiz — satisfazer segue fazer: eu fiz → eu satisfiz."}, {"enunciado": "O que quer dizer <b>amiúde</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["estranho, fora do comum", "totalmente fechado; difícil de entender", "muitas vezes, com frequência", "aos pouquinhos, em pedaços miúdos", "dispensar, não precisar de algo"], "certa": 2, "explicacao": "c) muitas vezes, com frequência. Não é “aos pouquinhos, em pedaços miúdos”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["guardar", "levantar", "irmão", "heroico", "caratê"], "certa": 3, "explicacao": "d) heroico — he-roi-co: é paroxítona."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Ontem, choveu muito.", "Bianca, venha jantar!", "Os primos de Ricardo, limparam o quarto.", "São Paulo, 16 de outubro de 2026.", "Felipe, o mais alto da turma, chegou cedo."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (Os primos de Ricardo) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>vamos esconder</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["o sujeito", "não há verbo principal", "esconder", "os dois são principais", "vamos"], "certa": 2, "explicacao": "c) esconder — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "esquentar, ficar mais forte", "arrependido", "tão bom que não dá para descrever com palavras", "nunca visto antes, extraordinário"], "certa": 0, "explicacao": "a) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["pagé", "engraxate", "gorjeta", "relâmpago", "xícara"], "certa": 0, "explicacao": "a) pagé — o certo é pajé: palavra de origem tupi: j."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Oh!</b> expressa? Responda com a letra.", "alternativas": ["espanto", "tristeza", "dor", "aplauso", "medo"], "certa": 0, "explicacao": "a) espanto"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["O cachorro fugiu porque o portão estava aberto?", "— Hoje não tem aula. — Por quê?", "O bolo queimou por que ficou muito tempo no forno?", "Ninguém explicou por que a aula acabou mais cedo.", "Ele riu e, não sei por quê, todos riram junto."], "certa": 2, "explicacao": "c) — o certo é “O bolo queimou porque ficou muito tempo no forno?”: a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "espantado, sem reação", "do contra, teimoso", "arrependido", "vencer, controlar (um incêndio, uma crise)"], "certa": 3, "explicacao": "d) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "— Psiu! A professora está explicando.<br>Nessa fala, “Psiu!” serve para… Responda com a letra.", "alternativas": ["mostrar alegria", "mostrar nojo", "chamar alguém", "mostrar dor", "pedir silêncio"], "certa": 4, "explicacao": "e) pedir silêncio — o contexto decide o sentido."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Aonde esse caminho leva?", "Aonde vocês foram nas férias?", "Aonde dorme o morcego?", "Onde nasce o rio Amazonas?", "Daqui a uma hora começa o jogo."], "certa": 2, "explicacao": "c) o certo é “Onde”"}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
