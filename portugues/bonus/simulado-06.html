<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 6 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 6 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "O que quer dizer <b>ínfimo</b>? Responda com a letra.", "alternativas": ["mínimo, o menor de todos", "que está em toda parte", "preguiça, desleixo", "amargura, aspereza no trato", "lento para entender"], "certa": 0, "explicacao": "a) mínimo, o menor de todos"}, {"enunciado": "Por que a palavra <b>camisa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["entre vogais, o s tem som de z", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "depois de consoante, um s só já tem som de s", "entre vogais, o som de s se escreve com ss"], "certa": 0, "explicacao": "a) entre vogais, o s tem som de z"}, {"enunciado": "“— Eu adoro dinossauros aqui — respondeu Ricardo.”<br>Qual é a passagem certa para o discurso indireto? Responda com a letra.", "alternativas": ["Ricardo respondeu que eu adorava dinossauros ali.", "Ricardo respondeu que adora dinossauros aqui.", "Ricardo respondeu que adorava dinossauros aqui.", "Ricardo respondeu que adorava dinossauros ali.", "Ricardo respondeu que eu adoro dinossauros aqui."], "certa": 3, "explicacao": "d) Ricardo respondeu que adorava dinossauros ali."}, {"enunciado": "O que quer dizer <b>obtuso</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esperto, que entende rápido", "lento para entender", "breve e direto", "combinado sem precisar falar, subentendido", "espantado, sem reação"], "certa": 1, "explicacao": "b) lento para entender. Não é “esperto, que entende rápido”: essa é a pegadinha."}, {"enunciado": "O verbo <b>dispor</b> é de que conjugação? Responda com a letra.", "alternativas": ["1ª conjugação (-ar)", "4ª conjugação (-or)", "não tem conjugação", "2ª conjugação (-er)", "3ª conjugação (-ir)"], "certa": 3, "explicacao": "d) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o diminutivo de <b>bandeira</b>? Responda com a letra.", "alternativas": ["bandeirola", "aviãozinho", "livrinho", "peixinho", "chapeuzinho"], "certa": 0, "explicacao": "a) bandeirola"}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["A vovó e o vovô resisti ao doce.", "A vovó e o vovô resistimos ao doce.", "A vovó e o vovô resistiram ao doce.", "A vovó e o vovô resistiu ao doce.", "A vovó e o vovô resiste ao doce."], "certa": 2, "explicacao": "c) A vovó e o vovô resistiram ao doce. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Qual frase está pontuada corretamente? Responda com a letra.", "alternativas": ["Gabriela, escolheu três cores: amarelo, laranja e vermelho.", "Gabriela escolheu três cores: amarelo laranja e vermelho.", "Gabriela escolheu três cores amarelo, laranja e vermelho.", "Gabriela escolheu três cores: amarelo, laranja e vermelho.", "Gabriela escolheu três cores: amarelo, laranja, e vermelho."], "certa": 3, "explicacao": "d) Gabriela escolheu três cores: amarelo, laranja e vermelho. — dois-pontos antes da lista, vírgula entre os itens, nada antes do “e” e nada entre Gabriela e o verbo."}, {"enunciado": "O que quer dizer <b>pernóstico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exibido, que usa palavras difíceis só para se mostrar", "breve e direto", "inconveniente; fora do assunto", "que tem as pernas compridas", "sem medo, destemido"], "certa": 0, "explicacao": "a) exibido, que usa palavras difíceis só para se mostrar. Não é “que tem as pernas compridas”: essa é a pegadinha."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["exceto", "nescessário", "camponeza", "enpresa", "susesso"], "certa": 0, "explicacao": "a) exceto — com xc, como exceção."}, {"enunciado": "O que quer dizer <b>prolixo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que fala ou escreve demais, enrolando", "confirmar, reforçar uma ideia", "caprichado e bem-arrumado", "generoso, de coração grande", "rigoroso e sem luxo"], "certa": 0, "explicacao": "a) que fala ou escreve demais, enrolando. Não é “caprichado e bem-arrumado”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>55º</b> por extenso? Responda com a letra.", "alternativas": ["sexagésimo quinto", "quadragésimo quinto", "quinquagésimo sexto", "cinquentésimo quinto", "quinquagésimo quinto"], "certa": 4, "explicacao": "e) quinquagésimo quinto"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Passeamos a cavalo.", "Vire à esquerda.", "Falei a pessoas da fila.", "Fui à praia a pé.", "Voltei a praia."], "certa": 4, "explicacao": "e) — o certo é “à praia”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Qual palavra quer dizer “que dura muito, que não acaba”? Responda com a letra.", "alternativas": ["cizânia", "relutante", "ardiloso", "escopo", "perene"], "certa": 4, "explicacao": "e) perene"}, {"enunciado": "O que quer dizer <b>veemente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["intenso, enérgico", "muitas vezes, com frequência", "veloz, apressado", "que não faz mal, sem efeito", "fora da época certa"], "certa": 0, "explicacao": "a) intenso, enérgico. Não é “veloz, apressado”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Nossa, que frio!", "O time de Felipe guardou os brinquedos?", "Plante uma árvore.", "A vovó e o vovô varreram o quintal.", "Beba suco!"], "certa": 3, "explicacao": "d) A vovó e o vovô varreram o quintal."}, {"enunciado": "Espero que ele ___ um presente. (verbo dar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["deu", "dê", "desse", "dá", "dar"], "certa": 1, "explicacao": "b) dê"}, {"enunciado": "Em qual frase uma palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["O mergulhador vai imergir no mar profundo.", "A orquestra fez um lindo concerto no teatro.", "O piano foi para o conserto porque estava desafinado.", "O rei da Pérsia era chamado de chá.", "Ao dormir, é preciso cerrar os olhos."], "certa": 3, "explicacao": "d) — o certo é “xá” (antigo rei do Irã)."}, {"enunciado": "Ontem eu ___ (verbo <b>supor</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["suponhei", "supori", "supôs", "supi", "supus"], "certa": 4, "explicacao": "e) supus — supor segue pôr: eu pus → eu supus."}, {"enunciado": "O que quer dizer <b>amiúde</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["confusão, situação enrolada", "incomum, surpreendente", "muitas vezes, com frequência", "aos pouquinhos, em pedaços miúdos", "digno de confiança, verdadeiro"], "certa": 2, "explicacao": "c) muitas vezes, com frequência. Não é “aos pouquinhos, em pedaços miúdos”: essa é a pegadinha."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é proparoxítona? Responda com a letra.", "alternativas": ["lágrima", "xícara", "tríceps", "tráfego", "sábado"], "certa": 2, "explicacao": "c) tríceps — trí-ceps: é paroxítona."}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["São Paulo, 16 de outubro de 2026.", "Comprei pera, uva e maçã.", "Felipe, venha jantar!", "As crianças da escola, abriram a janela.", "Felipe, o mais alto da turma, chegou cedo."], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (As crianças da escola) do verbo com vírgula."}, {"enunciado": "Na locução verbal <b>posso jogar</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["posso", "não há verbo principal", "jogar", "o sujeito", "os dois são principais"], "certa": 2, "explicacao": "c) jogar — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>arrefecer</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esquentar, ficar mais forte", "rigoroso e sem luxo", "esbanjador, que gasta demais", "esfriar, perder a força", "que acontece por acaso"], "certa": 3, "explicacao": "d) esfriar, perder a força. Não é “esquentar, ficar mais forte”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["beringela", "gengibre", "gorjeta", "mexerica", "cachecol"], "certa": 0, "explicacao": "a) beringela — o certo é berinjela: com j, de cor."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Oxalá!</b> expressa? Responda com a letra.", "alternativas": ["afastamento", "pedido de silêncio", "medo", "advertência", "desejo"], "certa": 4, "explicacao": "e) desejo"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Quero entender por que a Lua muda de forma.", "Ninguém explicou porque a aula acabou mais cedo.", "Ela estava feliz, não sei por quê.", "As cidades por que viajamos eram lindas.", "Ela chorou e não disse por quê."], "certa": 1, "explicacao": "b) — o certo é “Ninguém explicou por que a aula acabou mais cedo.”: é uma pergunta escondida, sem ponto de interrogação: troque por “por qual motivo”."}, {"enunciado": "O que quer dizer <b>contrito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["arrependido", "proveitoso, que dá bons resultados", "do contra, teimoso", "urgente", "preciso, feito com muito cuidado"], "certa": 0, "explicacao": "a) arrependido. Não é “do contra, teimoso”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra foi usada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A casa era velha, mas muito bonita.", "A prova vai ser daqui a uma semana.", "O elefante é mais pesado que o hipopótamo.", "O parque onde brincamos fechou.", "A três gatos dormindo no sofá."], "certa": 4, "explicacao": "e) o certo é “Há”"}, {"enunciado": "Quem nasce em <b>Minas Gerais</b> é… Responda com a letra.", "alternativas": ["gaúcho", "mineiro", "amapaense", "inglês", "venezuelano"], "certa": 1, "explicacao": "b) mineiro"}];
const CHAVE='simulado-bonus-6';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
