<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o plural de <b>passatempo</b>? Responda com a letra.", "alternativas": ["passatempois", "passatempons", "passatempoes", "passatempos", "os passatempo"], "certa": 3, "explicacao": "d) passatempos"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["a-le-gre", "ad-je-ti-vo", "ba-lei-a", "min-gau", "e-cli-pse"], "certa": 4, "explicacao": "e) e-cli-pse — o certo é e-clip-se: a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["As amigas de Lívia limpa o quarto.", "As amigas de Lívia limpamos o quarto.", "As amigas de Lívia limpou o quarto.", "As amigas de Lívia limparam o quarto.", "As amigas de Lívia limpei o quarto."], "certa": 3, "explicacao": "d) As amigas de Lívia limparam o quarto. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Na frase “<b>Por que</b> o cachorro abana o rabo?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "motivo para", "por qual motivo", "por qual", "o motivo"], "certa": 2, "explicacao": "c) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["mentira, golpe para enganar", "exibido, que usa palavras difíceis só para se mostrar", "empurrão", "esbanjador, que gasta demais", "arrependido"], "certa": 0, "explicacao": "a) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Meu avô é pescador.", "As andorinhas vêm no verão.", "Eles crêem em fadas.", "O polo norte é gelado.", "O voo atrasou."], "certa": 2, "explicacao": "c) — o certo é “Eles creem…”."}, {"enunciado": "Qual é o substantivo primitivo de <b>marinheiro</b> (a palavra de onde ela nasceu)? Responda com a letra.", "alternativas": ["noite", "mar", "marinho", "maré", "marinha"], "certa": 1, "explicacao": "b) mar — marinheiro é quem trabalha com mar ou o que vem de mar."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["broa", "mamão", "voar", "navio", "cientista"], "certa": 1, "explicacao": "b) mamão — ma-mão"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["O bolo é para mim.", "Entre mim e você, tudo bem.", "Para mim, fazer isso é fácil.", "Para mim, estudar à noite é melhor.", "Felipe trouxe a receita para mim estudar."], "certa": 4, "explicacao": "e) — o certo é “para eu estudar”."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["firme e calmo diante do sofrimento", "preciso, feito com muito cuidado", "que não toma partido, que é justo com todos os lados", "ligado à vida simples e tranquila do campo", "chorão, que reclama de tudo"], "certa": 0, "explicacao": "a) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós gostamos de pizza.", "A gente escreve cartas para a vovó.", "Nós estudamos juntos todo dia.", "A gente chegamos cedo à escola.", "A gente assiste ao jogo pela televisão."], "certa": 3, "explicacao": "d) — o certo é “A gente chega”: a gente pede o verbo como “ele”."}, {"enunciado": "Como se diz o macho da <b>sardinha</b>? Responda com a letra.", "alternativas": ["o sardinha macho", "o sardinho", "a sardinhazinho", "a sardinha macho", "o sardinha"], "certa": 3, "explicacao": "d) a sardinha macho — sardinha é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Chegamos ao meio-dia.", "Chegamos às oito horas.", "Fui à praia a pé.", "Fui ao clube e à piscina.", "Mostrei o desenho à você."], "certa": 4, "explicacao": "e) — o certo é “a você”: antes de ela, você, todos e Vossa Excelência não tem crase."}, {"enunciado": "Por que a palavra <b>japonesa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["femininos e palavras de origem terminam em -esa", "o final -esa sempre se escreve com z", "substantivos que vêm de adjetivos terminam em -eza", "toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza"], "certa": 0, "explicacao": "a) femininos e palavras de origem terminam em -esa"}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "que dura pouco tempo", "descuidado, que cai fácil em armadilhas", "inconveniente; fora do assunto", "que brilha muito forte"], "certa": 0, "explicacao": "a) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Una as peças.", "Que susto!", "As amigas de Lívia abriram a janela.", "O irmão mais velho de Otávio trabalhou na horta?", "Fale com a vovó."], "certa": 2, "explicacao": "c) As amigas de Lívia abriram a janela."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Alô!</b> expressa? Responda com a letra.", "alternativas": ["ânimo", "chamado", "dor", "decepção", "nojo"], "certa": 1, "explicacao": "b) chamado"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["macarrão", "refém", "científico", "comprar", "timidez"], "certa": 2, "explicacao": "c) científico — ci-en-tí-fi-co: é proparoxítona."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["creça", "camponesa", "florescer", "defesa", "cebola"], "certa": 0, "explicacao": "a) creça — o certo é cresça: do verbo crescer: sç."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["pálido, sem cor", "que está em toda parte", "aliviar, diminuir (uma dor, um problema)", "confirmar, reforçar uma ideia", "sem medo, destemido"], "certa": 4, "explicacao": "e) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Comemos muitos pastéis.", "Muitas crianças brincavam no parque.", "As meninas estavam muito felizes.", "Comprei muitos livros.", "Muitos alunos faltaram."], "certa": 2, "explicacao": "c) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Ontem ele ___ (verbo <b>ter</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["tem", "tinha", "teve", "teu", "terá"], "certa": 2, "explicacao": "c) teve"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comprei uva, pera e manga.", "Otávio, o goleiro, chegou cedo.", "Ricardo, cuidado com o degrau!", "Ontem, choveu muito.", "A professora de música, pescou no lago."], "certa": 4, "explicacao": "e) — nunca se separa o sujeito (A professora de música) do verbo com vírgula."}, {"enunciado": "O que quer dizer <b>conciso</b>? Responda com a letra.", "alternativas": ["ponto de apoio, ponto central", "diferente, especial", "ligado à vida simples e tranquila do campo", "apagar, destruir por completo", "breve e direto"], "certa": 4, "explicacao": "e) breve e direto"}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["preciso, feito com muito cuidado", "que está em toda parte", "tão bom que não dá para descrever com palavras", "que não faz efeito", "oportunidade, ocasião"], "certa": 2, "explicacao": "c) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>52º</b> por extenso? Responda com a letra.", "alternativas": ["quadragésimo segundo", "sexagésimo segundo", "cinquentésimo segundo", "quinquagésimo terceiro", "quinquagésimo segundo"], "certa": 4, "explicacao": "e) quinquagésimo segundo"}, {"enunciado": "Amanhã, eles ___ corda. Qual forma completa a frase? Responda com a letra.", "alternativas": ["pularão", "pulavam", "pulariam", "pularam", "pulam"], "certa": 0, "explicacao": "a) pularão — futuro: -ão."}, {"enunciado": "“As amigas de Lívia cantaram na festa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["cantaram na festa", "As amigas de Lívia", "amigas", "na festa", "Lívia"], "certa": 1, "explicacao": "b) As amigas de Lívia — cuidado: “amigas” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["existir", "começar", "chuviscar", "jogar", "plantar"], "certa": 2, "explicacao": "c) chuviscar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["acolhedor, confortável", "onde é muito difícil viver", "que não toma partido, que é justo com todos os lados", "que está em toda parte", "que não faz mal, sem efeito"], "certa": 1, "explicacao": "b) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
