<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o plural de <b>passatempo</b>? Responda com a letra.", "alternativas": ["passatempois", "passatempons", "passatempoes", "passatempos", "os passatempo"], "certa": 3, "explicacao": "d) passatempos"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["a-le-gre", "ad-je-ti-vo", "ba-lei-a", "min-gau", "e-cli-pse"], "certa": 4, "explicacao": "e) e-cli-pse — o certo é e-clip-se: a consoante sem vogal (como o d de advogado) fica na sílaba de antes."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Ricardo e a irmã limpa o quarto.", "Ricardo e a irmã limpamos o quarto.", "Ricardo e a irmã limpou o quarto.", "Ricardo e a irmã limparam o quarto.", "Ricardo e a irmã limpei o quarto."], "certa": 3, "explicacao": "d) Ricardo e a irmã limparam o quarto. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Na frase “<b>Por que</b> você não veio à festa?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "motivo para", "por qual motivo", "por qual", "o motivo"], "certa": 2, "explicacao": "c) por qual motivo — é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["nunca visto antes, extraordinário", "sem nenhum machucado, ileso", "aliviar, diminuir (uma dor, um problema)", "mentira, golpe para enganar", "empurrão"], "certa": 3, "explicacao": "d) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Elas veem o mar da janela.", "O polo norte é gelado.", "Vamos pára casa.", "Meu avô é pescador.", "Ele tem dois irmãos."], "certa": 2, "explicacao": "c) — o certo é “Vamos para…”."}, {"enunciado": "Qual é o substantivo primitivo de <b>marinheiro</b> (a palavra de onde ela nasceu)? Responda com a letra.", "alternativas": ["noite", "mar", "marinho", "maré", "marinha"], "certa": 1, "explicacao": "b) mar — marinheiro é quem trabalha com mar ou o que vem de mar."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["broa", "mamão", "voar", "navio", "cientista"], "certa": 1, "explicacao": "b) mamão — ma-mão"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Bianca trouxe a revista para mim ver.", "O bolo é para mim.", "Sem mim, a festa não teria graça.", "Para mim, estudar à noite é melhor.", "Trouxe o lápis para eu desenhar."], "certa": 0, "explicacao": "a) — o certo é “para eu ver”."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "muito pequeno, escasso", "novato, iniciante", "que passa num instante", "exigente"], "certa": 1, "explicacao": "b) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["A gente desenha muito bem.", "Nós comemos muita fruta.", "A gente gostamos de pizza.", "Nós jogamos bola no recreio.", "A gente acorda cedo no domingo."], "certa": 2, "explicacao": "c) — o certo é “A gente gosta”: a gente pede o verbo como “ele”."}, {"enunciado": "Como se diz o macho da <b>formiga</b>? Responda com a letra.", "alternativas": ["o formiga macho", "a formiga macho", "o formiga", "a formigazinho", "o formigo"], "certa": 1, "explicacao": "b) a formiga macho — formiga é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Falei a pessoas da fila.", "Entreguei o presente a ela.", "Fui à praia a pé.", "Começou a chover à noite.", "Ela aprendeu à nadar."], "certa": 4, "explicacao": "e) — o certo é “a nadar”: antes de verbo (andar, chover, nadar) nunca tem crase."}, {"enunciado": "Por que a palavra <b>rosa</b> se escreve com <b>s</b>? Responda com a letra.", "alternativas": ["depois de consoante, um s só já tem som de s", "ss pode começar uma palavra", "no começo da palavra, o s tem som de s", "entre vogais, o som de s se escreve com ss", "entre vogais, o s tem som de z"], "certa": 4, "explicacao": "e) entre vogais, o s tem som de z"}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dura pouco tempo", "totalmente fechado; difícil de entender", "que fala pouco, de poucas palavras", "novato, iniciante", "aberto e fácil de entender"], "certa": 1, "explicacao": "b) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Una as peças.", "Que bolo gostoso!", "Quem bateu na porta?", "A professora de música trabalhou na horta.", "Trabalhe na horta."], "certa": 2, "explicacao": "c) Quem bateu na porta?"}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Alô!</b> expressa? Responda com a letra.", "alternativas": ["ânimo", "chamado", "dor", "decepção", "nojo"], "certa": 1, "explicacao": "b) chamado"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["macarrão", "refém", "científico", "comprar", "timidez"], "certa": 2, "explicacao": "c) científico — ci-en-tí-fi-co: é proparoxítona."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["necessário", "creça", "sebola", "pesquissa", "assúcar"], "certa": 0, "explicacao": "a) necessário — com c (antes de e) e ss (entre vogais)."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["cuidadoso, precavido", "descuidado, que cai fácil em armadilhas", "que fala pouco, de poucas palavras", "esperto, que percebe tudo rápido", "grosseiro, muito grave (um erro)"], "certa": 1, "explicacao": "b) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Bebi muita água.", "Muitos peixes nadavam no lago.", "Comprei muitos livros.", "As meninas estavam muito felizes.", "Fizemos muitas perguntas."], "certa": 3, "explicacao": "d) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Ontem eu ___ (verbo <b>fazer</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["fazia", "faço", "fazi", "fiz", "farei"], "certa": 3, "explicacao": "d) fiz"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Comprei borracha, caderno e tesoura.", "Felipe, o mais alto da turma, chegou cedo.", "São Paulo, 16 de outubro de 2026.", "Os primos de Ricardo, acordaram cedo.", "Manuela, cuidado com o degrau!"], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Os primos de Ricardo) do verbo com vírgula."}, {"enunciado": "O que quer dizer <b>pródigo</b>? Responda com a letra.", "alternativas": ["generoso, de coração grande", "esbanjador, que gasta demais", "que se coloca no lugar do outro", "com muita vontade", "descuidado, que cai fácil em armadilhas"], "certa": 1, "explicacao": "b) esbanjador, que gasta demais"}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "que traz boas notícias", "que causa tempestade", "que fala pouco, de poucas palavras", "resistente (ao calor, a mudanças)"], "certa": 0, "explicacao": "a) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>31º</b> por extenso? Responda com a letra.", "alternativas": ["trintésimo primeiro", "vigésimo primeiro", "trigésimo segundo", "quadragésimo primeiro", "trigésimo primeiro"], "certa": 4, "explicacao": "e) trigésimo primeiro"}, {"enunciado": "Daqui a dois dias, eles ___ pão. Qual forma completa a frase? Responda com a letra.", "alternativas": ["comprarão", "compraram", "comprariam", "compram", "compravam"], "certa": 0, "explicacao": "a) comprarão — futuro: -ão."}, {"enunciado": "“O time de Felipe voltou para casa.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["para casa", "voltou para casa", "O time de Felipe", "time", "Felipe"], "certa": 2, "explicacao": "c) O time de Felipe — cuidado: “time” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["mostrar", "decidir", "andar", "mexer", "garoar"], "certa": 4, "explicacao": "e) garoar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["inconveniente; fora do assunto", "muito rico e poderoso", "mínimo, o menor de todos", "sem medo, destemido", "generoso, de coração grande"], "certa": 4, "explicacao": "e) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
