<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["a-dmi-tir", "e-xce-to", "vi-a-gem", "se-is-cen-tos", "pes-soa"], "certa": 2, "explicacao": "c) vi-a-gem — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os alunos e a diretora limparam o quarto.", "Os alunos e a diretora limpa o quarto.", "Os alunos e a diretora limpou o quarto.", "Os alunos e a diretora limpamos o quarto.", "Os alunos e a diretora limpei o quarto."], "certa": 0, "explicacao": "a) Os alunos e a diretora limparam o quarto. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Na frase “Ele chorou <b>porque</b> caiu da bicicleta?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pois", "por qual motivo", "o motivo", "pelo qual / pela qual", "por qual"], "certa": 0, "explicacao": "a) pois — a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "mentira, golpe para enganar", "empurrão", "inconveniente; fora do assunto", "que traz boas notícias"], "certa": 1, "explicacao": "b) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["mandioca", "jeito", "herói", "biscoito", "dragão"], "certa": 0, "explicacao": "a) mandioca — man-di-o-ca"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Isso é para eu ler.", "Felipe trouxe o jogo para mim guardar.", "Para mim, fazer isso é fácil.", "O bolo é para mim."], "certa": 2, "explicacao": "c) — o certo é “para eu guardar”."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exigente", "que dá para acreditar, razoável", "incomum, surpreendente", "muito pequeno, escasso", "oportunidade, ocasião"], "certa": 3, "explicacao": "d) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>baleia</b>? Responda com a letra.", "alternativas": ["o baleia", "a baleiazinho", "a baleia macho", "o baleio", "o baleia macho"], "certa": 2, "explicacao": "c) a baleia macho — baleia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Por que a palavra <b>cabeça</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç pode aparecer no começo da palavra", "antes de e e i, o c já tem som de s", "antes de e e i se usa ç", "antes de a, o e u, o c tem som de k", "ç só se usa antes de a, o e u"], "certa": 4, "explicacao": "e) ç só se usa antes de a, o e u"}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "aberto e fácil de entender", "tão bom que não dá para descrever com palavras", "esperto, que percebe tudo rápido", "esbanjador, que gasta demais"], "certa": 0, "explicacao": "a) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Bianca voltou para casa?", "Quem voltou para casa?", "Minhas tias falaram com a vovó.", "Sonhe com dragões!", "Como está quente hoje!"], "certa": 2, "explicacao": "c) Minhas tias falaram com a vovó."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Nossa!</b> expressa? Responda com a letra.", "alternativas": ["alegria", "tristeza", "ânimo", "espanto", "alívio"], "certa": 3, "explicacao": "d) espanto"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["perna", "chapéu", "nêutron", "viúva", "padaria"], "certa": 1, "explicacao": "b) chapéu — cha-péu: é oxítona."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["ascessório", "defeza", "açúcar", "empressa", "nasimento"], "certa": 2, "explicacao": "c) açúcar — ç antes de u."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "cuidadoso, precavido", "que não se apaga", "totalmente fechado; difícil de entender", "arrependido"], "certa": 0, "explicacao": "a) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Muitos peixes nadavam no lago.", "O filme era muito longo.", "Muitas pessoas vieram à festa.", "Fizemos muitas perguntas.", "Muitos alunos faltaram."], "certa": 1, "explicacao": "b) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Ontem eu ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["posso", "podia", "podi", "pude", "poderei"], "certa": 3, "explicacao": "d) pude"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Lívia, minha melhor amiga, chegou cedo.", "Ricardo, cuidado com o degrau!", "Ontem, choveu muito.", "Meu avô, procurou a bola.", "Comprei borracha, caderno e lápis."], "certa": 3, "explicacao": "d) — nunca se separa o sujeito (Meu avô) do verbo com vírgula."}, {"enunciado": "O que quer dizer <b>capcioso</b>? Responda com a letra.", "alternativas": ["que cuida com carinho", "proveitoso, que dá bons resultados", "dispensar, não precisar de algo", "enganoso, feito para induzir ao erro", "frieza, calma inabalável"], "certa": 3, "explicacao": "d) enganoso, feito para induzir ao erro"}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "que causa tempestade", "que não faz mal, sem efeito", "inconveniente; fora do assunto", "dispensar, não precisar de algo"], "certa": 0, "explicacao": "a) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>35º</b> por extenso? Responda com a letra.", "alternativas": ["trintésimo quinto", "trigésimo quinto", "trigésimo sexto", "vigésimo quinto", "quadragésimo quinto"], "certa": 1, "explicacao": "b) trigésimo quinto"}, {"enunciado": "Ontem, eles ___ o presente. Qual forma completa a frase? Responda com a letra.", "alternativas": ["esconderam", "esconderão", "escondiam", "esconderiam", "escondem"], "certa": 0, "explicacao": "a) esconderam — passado: -am."}, {"enunciado": "“Ricardo e a irmã correram no parque.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Ricardo, irmã", "Ricardo e a irmã", "correram no parque", "irmã", "no parque"], "certa": 1, "explicacao": "b) Ricardo e a irmã — cuidado: “Ricardo, irmã” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["generoso, de coração grande", "estranho, fora do comum", "pouco, escasso", "muito rico e poderoso", "digno de confiança, verdadeiro"], "certa": 0, "explicacao": "a) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o diminutivo de <b>sala</b>? Responda com a letra.", "alternativas": ["pãozinho", "aviãozinho", "saleta", "bolinha", "peixinho"], "certa": 2, "explicacao": "c) saleta"}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["tranquilo", "mangueira", "máquina", "periquito", "quintal"], "certa": 0, "explicacao": "a) tranquilo — em “tranquilo” a gente fala o u"}, {"enunciado": "Qual é o plural de <b>capitão</b>? Responda com a letra.", "alternativas": ["capitãos", "capitãoes", "capitões", "capitães", "capitoes"], "certa": 3, "explicacao": "d) capitães — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "remédio para todos os males", "doença sem cura", "esforço, vontade forte de fazer algo", "inconveniente; fora do assunto"], "certa": 1, "explicacao": "b) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>estar com a corda toda</b>? Responda com a letra.", "alternativas": ["ficar muito bravo", "contar um segredo", "estar cheio de energia", "achar-se melhor que os outros", "repetir o que todo mundo já sabe"], "certa": 2, "explicacao": "c) estar cheio de energia"}, {"enunciado": "Se vocês ___ um presente, avisem. (verbo dar)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["dão", "derem", "deram", "dar", "deem"], "certa": 1, "explicacao": "b) derem"}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
