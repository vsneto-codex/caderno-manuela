<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Qual é o plural de <b>obra-prima</b>? Responda com a letra.", "alternativas": ["obra-primaes", "obras-prima", "obra-primas", "obra-prima", "obras-primas"], "certa": 4, "explicacao": "e) obras-primas"}, {"enunciado": "Qual palavra está separada de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["a-ssa-do", "bair-ro", "ob-ser-var", "a-tle-ta", "pes-so-a"], "certa": 0, "explicacao": "a) a-ssa-do — o certo é as-sa-do: rr, ss, sc, sç e xc se separam: uma letra fica em cada sílaba."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os meninos da rua esconde o presente.", "Os meninos da rua escondi o presente.", "Os meninos da rua escondeu o presente.", "Os meninos da rua esconderam o presente.", "Os meninos da rua escondemos o presente."], "certa": 3, "explicacao": "d) Os meninos da rua esconderam o presente. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Na frase “Ricardo dormiu cedo <b>porque</b> estava cansado.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["por qual motivo", "motivo para", "porém", "pois", "por qual"], "certa": 3, "explicacao": "d) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "mentira, golpe para enganar", "empurrão", "proveitoso, que dá bons resultados", "onde é muito difícil viver"], "certa": 1, "explicacao": "b) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS. Em qual há um erro de acento? Responda com a letra.", "alternativas": ["Eles leem um livro por semana.", "Ele têm dois irmãos.", "Eles mantêm a calma.", "Passamos por uma ponte.", "Os alunos têm aula hoje."], "certa": 1, "explicacao": "b) — o certo é “Ele tem…”."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["coração", "toalha", "assobio", "vazio", "coroa"], "certa": 0, "explicacao": "a) coração — co-ra-ção"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Isso é para eu ler.", "O vovô trouxe o mapa para eu.", "Trouxe o lápis para eu desenhar.", "O bolo é para mim.", "Sem mim, a festa não teria graça."], "certa": 1, "explicacao": "b) — o certo é “para mim”."}, {"enunciado": "O que quer dizer <b>estoico</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["isca, armadilha para enganar", "caro, que custa muito", "firme e calmo diante do sofrimento", "chorão, que reclama de tudo", "resistente (ao calor, a mudanças)"], "certa": 2, "explicacao": "c) firme e calmo diante do sofrimento. Não é “chorão, que reclama de tudo”: essa é a pegadinha."}, {"enunciado": "Em qual frase há um erro de concordância? Responda com a letra.", "alternativas": ["Nós cantamos no coral da escola.", "A gente aprende rápido.", "A gente gosta de pizza.", "Nós gostamos de pizza.", "A gente desenhamos muito bem."], "certa": 4, "explicacao": "e) — o certo é “A gente desenha”: a gente pede o verbo como “ele”."}, {"enunciado": "Como se diz a fêmea do <b>rinoceronte</b>? Responda com a letra.", "alternativas": ["o rinoceronte fêmea", "a rinocerontea", "a rinoceronte fêmea", "o rinocerontezinha", "a rinoceronte"], "certa": 0, "explicacao": "a) o rinoceronte fêmea — rinoceronte é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Falei a pessoas da fila.", "Fui a escola de bicicleta.", "Fui ao clube e à piscina.", "Viajei a Roma e à Itália.", "Chegamos ao meio-dia."], "certa": 1, "explicacao": "b) — o certo é “à escola”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "Por que a palavra <b>beleza</b> se escreve com <b>z</b>? Responda com a letra.", "alternativas": ["toda palavra terminada em -eza é feminino de origem", "palavras que indicam país terminam em -eza", "substantivos que vêm de adjetivos terminam em -eza", "femininos e palavras de origem terminam em -esa", "o final -esa sempre se escreve com z"], "certa": 2, "explicacao": "c) substantivos que vêm de adjetivos terminam em -eza"}, {"enunciado": "O que quer dizer <b>fugaz</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que passa num instante", "mínimo, o menor de todos", "que brilha muito forte", "onde é muito difícil viver", "grosseiro, muito grave (um erro)"], "certa": 0, "explicacao": "a) que passa num instante. Não é “que brilha muito forte”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["O cachorro e o gato desenharam um castelo?", "Nossa, que frio!", "Bianca abriu a janela.", "Discuta o assunto!", "O time de Felipe bebeu suco?"], "certa": 2, "explicacao": "c) Bianca abriu a janela."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Oba!</b> expressa? Responda com a letra.", "alternativas": ["chamado", "alegria", "nojo", "dor", "medo"], "certa": 1, "explicacao": "b) alegria"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["acidez", "estação", "escritor", "anéis", "mínimo"], "certa": 4, "explicacao": "e) mínimo — mí-ni-mo: é proparoxítona."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["defeza", "exceção", "empresa", "nasça", "assobio"], "certa": 0, "explicacao": "a) defeza — o certo é defesa: s entre vogais com som de z, de cor."}, {"enunciado": "O que quer dizer <b>impávido</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["preciso, feito com muito cuidado", "sem medo, destemido", "defesa, elogio de uma ideia", "arrependido", "pálido, sem cor"], "certa": 1, "explicacao": "b) sem medo, destemido. Não é “pálido, sem cor”: essa é a pegadinha."}, {"enunciado": "Em qual frase a palavra muito (ou muita, muitos) é <b>advérbio</b>? Responda com a letra.", "alternativas": ["Ela corre muito rápido.", "Havia muita gente na praia.", "Muitos peixes nadavam no lago.", "Comprei muitos livros.", "Ganhei muitos presentes."], "certa": 0, "explicacao": "a) — advérbio: liga-se a adjetivo ou verbo e não varia."}, {"enunciado": "Ontem eu ___ (verbo <b>caber</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["cabi", "cabia", "caberei", "caibo", "coube"], "certa": 4, "explicacao": "e) coube"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["A professora de música, procurou a bola.", "Ontem, choveu muito.", "Felipe, o mais alto da turma, chegou cedo.", "São Paulo, 16 de outubro de 2026.", "Felipe, cuidado com o degrau!"], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (A professora de música) do verbo com vírgula."}, {"enunciado": "O que quer dizer <b>peremptório</b>? Responda com a letra.", "alternativas": ["modelo, padrão", "alcance, abrangência", "argumento que parece certo, mas engana", "que dá para acreditar, razoável", "definitivo, que não admite discussão"], "certa": 4, "explicacao": "e) definitivo, que não admite discussão"}, {"enunciado": "O que quer dizer <b>inefável</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["tão bom que não dá para descrever com palavras", "que não se apaga", "que não faz efeito", "espantado, sem reação", "resistente (ao calor, a mudanças)"], "certa": 0, "explicacao": "a) tão bom que não dá para descrever com palavras. Não é “que não faz efeito”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>91º</b> por extenso? Responda com a letra.", "alternativas": ["octogésimo primeiro", "nonagésimo primeiro", "nonagésimo segundo", "noventésimo primeiro", "centésimo primeiro"], "certa": 1, "explicacao": "b) nonagésimo primeiro"}, {"enunciado": "No ano que vem, eles ___ limonada. Qual forma completa a frase? Responda com a letra.", "alternativas": ["vendiam", "venderiam", "venderam", "venderão", "vendem"], "certa": 3, "explicacao": "d) venderão — futuro: -ão."}, {"enunciado": "“O vizinho do lado comeu pizza.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["lado", "comeu pizza", "O vizinho do lado", "pizza", "vizinho"], "certa": 2, "explicacao": "c) O vizinho do lado — cuidado: “vizinho” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "Qual destes verbos indica um <b>fenômeno da natureza</b>? Responda com a letra.", "alternativas": ["plantar", "ventar", "escutar", "bater", "unir"], "certa": 1, "explicacao": "b) ventar — fenômeno da natureza (a frase nem tem quem faz a ação: “Choveu”)."}, {"enunciado": "O que quer dizer <b>inóspito</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["lento para entender", "dispensar, não precisar de algo", "acolhedor, confortável", "sem medo, destemido", "onde é muito difícil viver"], "certa": 4, "explicacao": "e) onde é muito difícil viver. Não é “acolhedor, confortável”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>vento</b>? Responda com a letra.", "alternativas": ["canzarrão", "panelão", "ventania", "golaço", "chapelão"], "certa": 2, "explicacao": "c) ventania"}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
