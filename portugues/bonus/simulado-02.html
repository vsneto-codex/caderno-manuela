<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["a-dmi-tir", "e-xce-to", "vi-a-gem", "se-is-cen-tos", "pes-soa"], "certa": 2, "explicacao": "c) vi-a-gem — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["A vovó e o vovô resistiram ao doce.", "A vovó e o vovô resiste ao doce.", "A vovó e o vovô resistiu ao doce.", "A vovó e o vovô resisti ao doce.", "A vovó e o vovô resistimos ao doce."], "certa": 0, "explicacao": "a) A vovó e o vovô resistiram ao doce. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Na frase “Aquele <b>porquê</b> era o mais estranho de todos.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "o motivo", "por isso", "por qual motivo", "pois"], "certa": 1, "explicacao": "b) o motivo — quer dizer “o motivo”: tem o, um, esse… antes, e dá para pôr no plural (os porquês)."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "muito pequeno, escasso", "estranho, fora do comum", "mentira, golpe para enganar", "empurrão"], "certa": 3, "explicacao": "d) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["mandioca", "jeito", "herói", "biscoito", "dragão"], "certa": 0, "explicacao": "a) mandioca — man-di-o-ca"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Isso é para eu ler.", "Felipe trouxe o jogo para mim guardar.", "Para mim, fazer isso é fácil.", "O bolo é para mim."], "certa": 2, "explicacao": "c) — o certo é “para eu guardar”."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exigente", "que dá para acreditar, razoável", "incomum, surpreendente", "muito pequeno, escasso", "oportunidade, ocasião"], "certa": 3, "explicacao": "d) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "Como se diz o macho da <b>baleia</b>? Responda com a letra.", "alternativas": ["o baleia", "a baleiazinho", "a baleia macho", "o baleio", "o baleia macho"], "certa": 2, "explicacao": "c) a baleia macho — baleia é epiceno: o artigo não muda; junta-se macho ou fêmea."}, {"enunciado": "Por que a palavra <b>cabeça</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç pode aparecer no começo da palavra", "antes de e e i, o c já tem som de s", "antes de e e i se usa ç", "antes de a, o e u, o c tem som de k", "ç só se usa antes de a, o e u"], "certa": 4, "explicacao": "e) ç só se usa antes de a, o e u"}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["totalmente fechado; difícil de entender", "aberto e fácil de entender", "tão bom que não dá para descrever com palavras", "esperto, que percebe tudo rápido", "esbanjador, que gasta demais"], "certa": 0, "explicacao": "a) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>declarativa</b>? Responda com a letra.", "alternativas": ["Bianca voltou para casa?", "Quem voltou para casa?", "Minhas tias falaram com a vovó.", "Sonhe com dragões!", "Como está quente hoje!"], "certa": 2, "explicacao": "c) Minhas tias falaram com a vovó."}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Ui!</b> expressa? Responda com a letra.", "alternativas": ["alegria", "tristeza", "ânimo", "dor", "alívio"], "certa": 3, "explicacao": "d) dor"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é paroxítona? Responda com a letra.", "alternativas": ["perna", "chapéu", "nêutron", "viúva", "padaria"], "certa": 1, "explicacao": "b) chapéu — cha-péu: é oxítona."}, {"enunciado": "Só uma destas palavras está escrita <b>corretamente</b>. Qual? Responda com a letra.", "alternativas": ["ascessório", "defeza", "açúcar", "empressa", "nasimento"], "certa": 2, "explicacao": "c) açúcar — ç antes de u."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "cuidadoso, precavido", "que não se apaga", "totalmente fechado; difícil de entender", "arrependido"], "certa": 0, "explicacao": "a) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Ontem eles ___ (verbo <b>estar</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["estão", "estiveram", "estarão", "esteram", "estavam"], "certa": 1, "explicacao": "b) estiveram"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela, venha jantar!", "São Paulo, 16 de outubro de 2026.", "Minhas tias, pularam corda.", "Ontem, choveu muito.", "Rex, o cachorro de Manuela, chegou cedo."], "certa": 2, "explicacao": "c) — nunca se separa o sujeito (Minhas tias) do verbo com vírgula."}, {"enunciado": "O que quer dizer <b>desídia</b>? Responda com a letra.", "alternativas": ["breve e direto", "esbanjador, que gasta demais", "preguiça, desleixo", "intervalo, \"enquanto isso\"", "inconveniente; fora do assunto"], "certa": 2, "explicacao": "c) preguiça, desleixo"}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que acontece fora de hora", "arrogância, ar de superioridade", "que está em toda parte", "que causa tempestade", "combinado sem precisar falar, subentendido"], "certa": 0, "explicacao": "a) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>42º</b> por extenso? Responda com a letra.", "alternativas": ["quarentésimo segundo", "quadragésimo terceiro", "trigésimo segundo", "quinquagésimo segundo", "quadragésimo segundo"], "certa": 4, "explicacao": "e) quadragésimo segundo"}, {"enunciado": "Daqui a dois dias, eles ___ cedo. Qual forma completa a frase? Responda com a letra.", "alternativas": ["acordaram", "acordam", "acordavam", "acordariam", "acordarão"], "certa": 4, "explicacao": "e) acordarão — futuro: -ão."}, {"enunciado": "“As amigas de Lívia assistiram a um filme.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["Lívia", "assistiram a um filme", "As amigas de Lívia", "a um filme", "amigas"], "certa": 2, "explicacao": "c) As amigas de Lívia — cuidado: “amigas” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esfriar, perder a força", "muito rico e poderoso", "inconveniente; fora do assunto", "incomum, surpreendente", "generoso, de coração grande"], "certa": 4, "explicacao": "e) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>gol</b>? Responda com a letra.", "alternativas": ["golaço", "fogaréu", "peixão", "chapelão", "bocarra"], "certa": 0, "explicacao": "a) golaço"}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["fogueira", "periquito", "linguiça", "esquilo", "esquerda"], "certa": 2, "explicacao": "c) linguiça — em “linguiça” a gente fala o u"}, {"enunciado": "Qual é o plural de <b>botão</b>? Responda com a letra.", "alternativas": ["botões", "botães", "botãoes", "botãos", "botoes"], "certa": 0, "explicacao": "a) botões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["remédio para todos os males", "generoso, de coração grande", "que arma truques para enganar", "lento para entender", "doença sem cura"], "certa": 0, "explicacao": "a) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>acertar na mosca</b>? Responda com a letra.", "alternativas": ["desconfiar de algo", "sentir muita dor", "ser o diferente do grupo", "esquecer de repente", "acertar em cheio"], "certa": 4, "explicacao": "e) acertar em cheio"}, {"enunciado": "Quando eu ___ a lição, conto para você. (verbo fazer)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["faço", "fizer", "fiz", "fazer", "faça"], "certa": 1, "explicacao": "b) fizer"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>oposição</b>? Responda com a letra.", "alternativas": ["Guarde os brinquedos, já que a visita vai chegar.", "Plantamos a semente, por isso nasceu uma árvore.", "Estudamos a lição e fizemos o desenho.", "Vamos à praia caso faça sol.", "O gato é pequeno, porém é muito corajoso."], "certa": 4, "explicacao": "e) O gato é pequeno, porém é muito corajoso."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
