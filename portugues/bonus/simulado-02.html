<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px}</style></head><body><main>
<img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE">
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["a-dmi-tir", "e-xce-to", "vi-a-gem", "se-is-cen-tos", "pes-soa"], "certa": 2, "explicacao": "c) vi-a-gem — no hiato, as duas vogais ficam em sílabas diferentes."}, {"enunciado": "Qual frase está com o verbo no <b>passado</b> e combinando com o sujeito? Responda com a letra.", "alternativas": ["Os alunos e a diretora resistiram ao doce.", "Os alunos e a diretora resiste ao doce.", "Os alunos e a diretora resistiu ao doce.", "Os alunos e a diretora resisti ao doce.", "Os alunos e a diretora resistimos ao doce."], "certa": 0, "explicacao": "a) Os alunos e a diretora resistiram ao doce. — o sujeito é plural, então o verbo vai para o plural."}, {"enunciado": "Na frase “O cachorro fugiu <b>porque</b> o portão estava aberto?”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["pelo qual / pela qual", "pois", "por isso", "por qual motivo", "o motivo"], "certa": 1, "explicacao": "b) pois — a pessoa já diz a causa e só quer saber se é verdade; troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["ligado à vida simples e tranquila do campo", "muito pequeno, escasso", "estranho, fora do comum", "mentira, golpe para enganar", "empurrão"], "certa": 3, "explicacao": "d) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Qual palavra tem <b>hiato</b> (as duas vogais ficam em sílabas diferentes)? Responda com a letra.", "alternativas": ["banheiro", "saudade", "tapioca", "herói", "biscoito"], "certa": 2, "explicacao": "c) tapioca — ta-pi-o-ca"}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Felipe trouxe o jogo para eu.", "Ela deu o recado para eu levar.", "Sem mim, a festa não teria graça.", "Para mim, estudar à noite é melhor.", "O bolo é para mim."], "certa": 0, "explicacao": "a) — o certo é “para mim”."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["exigente", "muito pequeno, escasso", "resistente (ao calor, a mudanças)", "grosseiro, muito grave (um erro)", "pouco, escasso"], "certa": 1, "explicacao": "b) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "Por que a palavra <b>cabeça</b> se escreve com <b>ç</b>? Responda com a letra.", "alternativas": ["ç só se usa antes de a, o e u", "antes de a, o e u, o c tem som de k", "ç pode aparecer no começo da palavra", "antes de e e i, o c já tem som de s", "antes de e e i se usa ç"], "certa": 0, "explicacao": "a) ç só se usa antes de a, o e u"}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["breve e direto", "aberto e fácil de entender", "excelente, muito habilidoso", "fora da época certa", "totalmente fechado; difícil de entender"], "certa": 4, "explicacao": "e) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "Qual destas frases é <b>interrogativa</b>? Responda com a letra.", "alternativas": ["Felipe escondeu o presente.", "Olhe as estrelas.", "Por que os primos de Ricardo brincaram no parque?", "Como você cresceu!", "A girafa do zoológico olhou as estrelas."], "certa": 2, "explicacao": "c) Por que os primos de Ricardo brincaram no parque?"}, {"enunciado": "Que sentimento ou intenção a interjeição <b>Graças a Deus!</b> expressa? Responda com a letra.", "alternativas": ["tristeza", "alívio", "advertência", "pena", "dor"], "certa": 1, "explicacao": "b) alívio"}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["timidez", "recém", "medalha", "escritor", "limão"], "certa": 2, "explicacao": "c) medalha — me-da-lha: é paroxítona."}, {"enunciado": "Qual palavra está escrita <b>corretamente</b>? Responda com a letra.", "alternativas": ["aumoço", "almoço", "aumosso", "almoso", "almosso"], "certa": 1, "explicacao": "b) almoço — l no fim da sílaba e ç antes de o."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que traz boas notícias", "esforço, vontade forte de fazer algo", "descuidado, que cai fácil em armadilhas", "cuidadoso, precavido", "esbanjador, que gasta demais"], "certa": 2, "explicacao": "c) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Ontem eu ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["podia", "posso", "pude", "podi", "poderei"], "certa": 2, "explicacao": "c) pude"}, {"enunciado": "Em qual frase a vírgula está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Manuela e Bianca, pintaram um quadro.", "Comprei manga, banana e maçã.", "Seu Antônio, o padeiro, chegou cedo.", "São Paulo, 16 de outubro de 2026.", "Manuela, venha jantar!"], "certa": 0, "explicacao": "a) — nunca se separa o sujeito (Manuela e Bianca) do verbo com vírgula."}, {"enunciado": "O que quer dizer <b>parco</b>? Responda com a letra.", "alternativas": ["que dura muito, que não acaba", "estranho, fora do comum", "fora da época certa", "pouco, escasso", "encorajar, aconselhar com insistência"], "certa": 3, "explicacao": "d) pouco, escasso"}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que causa tempestade", "generoso, de coração grande", "grosseiro, muito grave (um erro)", "defesa, elogio de uma ideia", "que acontece fora de hora"], "certa": 4, "explicacao": "e) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Como se escreve <b>90º</b> por extenso? Responda com a letra.", "alternativas": ["nonagésimo primeiro", "noventésimo", "nonagésimo", "centésimo", "octogésimo"], "certa": 2, "explicacao": "c) nonagésimo"}, {"enunciado": "Amanhã, eles ___ para a prova. Qual forma completa a frase? Responda com a letra.", "alternativas": ["estudam", "estudarão", "estudavam", "estudariam", "estudaram"], "certa": 1, "explicacao": "b) estudarão — futuro: -ão."}, {"enunciado": "“Os primos de Ricardo decidiram o jogo.”<br>Qual é o <b>sujeito</b> (inteiro) da frase? Responda com a letra.", "alternativas": ["o jogo", "decidiram o jogo", "Os primos de Ricardo", "primos", "Ricardo"], "certa": 2, "explicacao": "c) Os primos de Ricardo — cuidado: “primos” é só o núcleo; o sujeito é tudo o que responde a “quem?”."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["esbanjador, que gasta demais", "esperto, que percebe tudo rápido", "ligado à vida simples e tranquila do campo", "generoso, de coração grande", "muito rico e poderoso"], "certa": 3, "explicacao": "d) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o aumentativo de <b>gol</b>? Responda com a letra.", "alternativas": ["facão", "bichão", "golaço", "amigão", "cestão"], "certa": 2, "explicacao": "c) golaço"}, {"enunciado": "Em qual palavra o <b>qu</b> ou o <b>gu</b> <b>NÃO</b> é dígrafo, porque o <b>u</b> é pronunciado? Responda com a letra.", "alternativas": ["aquilo", "foguete", "linguiça", "quilo", "esquerda"], "certa": 2, "explicacao": "c) linguiça — em “linguiça” a gente fala o u"}, {"enunciado": "Qual é o plural de <b>leão</b>? Responda com a letra.", "alternativas": ["leãos", "leães", "leãoes", "leões", "leoes"], "certa": 3, "explicacao": "d) leões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["doença sem cura", "nunca visto antes, extraordinário", "remédio para todos os males", "exibido, que usa palavras difíceis só para se mostrar", "que passa num instante"], "certa": 2, "explicacao": "c) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "O que quer dizer <b>ter o rei na barriga</b>? Responda com a letra.", "alternativas": ["estar distraído", "ajudar num aperto", "lamentar o que não tem volta", "achar-se melhor que os outros", "repetir o que todo mundo já sabe"], "certa": 3, "explicacao": "d) achar-se melhor que os outros"}, {"enunciado": "Espero que ele ___ o primeiro da fila. (verbo ser)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["seje", "ser", "é", "seja", "foi"], "certa": 3, "explicacao": "d) seja"}, {"enunciado": "Em qual frase a conjunção dá ideia de <b>conclusão</b>? Responda com a letra.", "alternativas": ["Vamos à praia se fizer sol.", "Comprei pão e comprei leite.", "O gato é pequeno, todavia é muito corajoso.", "A loja fechou, por isso voltamos para casa.", "Não corra no corredor, porque o chão está molhado."], "certa": 3, "explicacao": "d) A loja fechou, por isso voltamos para casa."}, {"enunciado": "O que quer dizer <b>premente</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que pode esperar", "ligado à vida simples e tranquila do campo", "dispensar, não precisar de algo", "urgente", "lento para entender"], "certa": 3, "explicacao": "d) urgente. Não é “que pode esperar”: essa é a pegadinha."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
