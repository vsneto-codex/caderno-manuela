<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado bônus 2 · Português</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#d9d4ca;--cartao:#fff;--marca:#1d2330;--certo:#1e7d46;--errado:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--cartao:#1f2125;--marca:#ececec;--certo:#6fcf97;--errado:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--suave);margin:0 0 18px}
.q{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin:0 0 14px}
.n{font-weight:800}.alts{display:grid;gap:8px;margin-top:10px}
.alt{text-align:left;font:inherit;padding:10px 12px;border:1.5px solid var(--borda);border-radius:10px;background:none;color:var(--texto);cursor:pointer}
.alt.marcada{border-color:var(--marca);font-weight:700;outline:2px solid var(--marca)}
.alt.certa{border-color:var(--certo);outline:2px solid var(--certo)}.alt.errada{border-color:var(--errado);text-decoration:line-through}
.expl{display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.12);font-size:.95rem}
.mostrar .expl{display:block}
#resultado{position:sticky;bottom:0;background:var(--fundo);padding:12px 0;border-top:1px solid var(--borda)}
#ver{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--marca);color:var(--fundo);cursor:pointer}
#nota{font-weight:800;font-size:1.1rem;margin:8px 0 0;min-height:1.4em}
button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
</style></head><body><main>
<h1>Simulado bônus 2 · Português</h1>
<p class="sub">30 questões de Português no estilo dos concursos públicos de ensino fundamental. Toque na
alternativa que achar certa. No fim, toque em <b>Ver meu resultado</b>.</p>
<div id="lista"></div>
<div id="resultado"><button id="ver">Ver meu resultado</button><p id="nota" role="status"></p></div>
</main>
<script>
const Q=[{"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["florescer", "exceto", "açúcar", "cresça", "necesário"], "certa": 4, "explicacao": "e) necesário — o certo é necessário: com c (antes de e) e ss (entre vogais)."}, {"enunciado": "“Minha amiguinha do coração!”<br>Que sentido tem <b>amiguinha</b> nessa frase? Responda com a letra.", "alternativas": ["tamanho", "admiração", "carinho", "desprezo", "pressa"], "certa": 2, "explicacao": "c) carinho"}, {"enunciado": "O que quer dizer <b>embuste</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["empurrão", "sem nenhum machucado, ileso", "mentira, golpe para enganar", "que dura pouco tempo", "digno de confiança, verdadeiro"], "certa": 2, "explicacao": "c) mentira, golpe para enganar. Não é “empurrão”: essa é a pegadinha."}, {"enunciado": "Quem nasce em <b>Brasil</b> é… Responda com a letra.", "alternativas": ["pessoense", "colombiano", "brasileiro", "alemão", "inglês"], "certa": 2, "explicacao": "c) brasileiro"}, {"enunciado": "Só uma palavra está separada <b>CORRETAMENTE</b>. Qual? Responda com a letra.", "alternativas": ["sob-ran-ce-lha", "e-cli-pse", "ba-nhe-i-ro", "qua-dro", "a-ssis-tir"], "certa": 3, "explicacao": "d) qua-dro — encontros como br, pl, tr e cl ficam juntos na mesma sílaba."}, {"enunciado": "Atenção: quatro destas palavras estão CERTAS, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["ideia", "hífen", "chapéu", "campaínha", "itens"], "certa": 3, "explicacao": "d) campaínha — o certo é campainha: i e u do hiato NÃO levam acento antes de nh (rainha) ou quando a sílaba termina em l, m, n, r, z (ruim, juiz, ainda)."}, {"enunciado": "Qual destas palavras <b>NÃO</b> é oxítona? Responda com a letra.", "alternativas": ["também", "fechar", "máquina", "amassar", "feijão"], "certa": 2, "explicacao": "c) máquina — má-qui-na: é proparoxítona."}, {"enunciado": "O que quer dizer <b>exíguo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rigoroso e sem luxo", "que fala pouco, de poucas palavras", "muito pequeno, escasso", "exigente", "intenso, enérgico"], "certa": 2, "explicacao": "c) muito pequeno, escasso. Não é “exigente”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual há um erro? Responda com a letra.", "alternativas": ["Sem mim, a festa não teria graça.", "Para mim, fazer isso é fácil.", "Para mim, estudar à noite é melhor.", "Bianca trouxe o mapa para eu.", "Isso é para eu ler."], "certa": 3, "explicacao": "d) — o certo é “para mim”."}, {"enunciado": "Qual é o aumentativo de <b>gol</b>? Responda com a letra.", "alternativas": ["vozeirão", "pezão", "panelão", "salão", "golaço"], "certa": 4, "explicacao": "e) golaço"}, {"enunciado": "O que quer dizer <b>hermético</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["excelente, muito habilidoso", "caro, que custa muito", "aberto e fácil de entender", "totalmente fechado; difícil de entender", "rigoroso e sem luxo"], "certa": 3, "explicacao": "d) totalmente fechado; difícil de entender. Não é “aberto e fácil de entender”: essa é a pegadinha."}, {"enunciado": "O verbo <b>dispor</b> é de que conjugação? Responda com a letra.", "alternativas": ["1ª conjugação (-ar)", "não tem conjugação", "4ª conjugação (-or)", "2ª conjugação (-er)", "3ª conjugação (-ir)"], "certa": 3, "explicacao": "d) 2ª conjugação — pôr vem do antigo “poer”."}, {"enunciado": "Qual é o plural de <b>botão</b>? Responda com a letra.", "alternativas": ["botoes", "botães", "botãoes", "botões", "botãos"], "certa": 3, "explicacao": "d) botões — o plural de ão (ões, ães ou ãos) se aprende de cor."}, {"enunciado": "Todas estas palavras têm duas vogais juntas. Em qual delas as vogais ficam na <b>mesma sílaba</b> (ditongo, e não hiato)? Responda com a letra.", "alternativas": ["voar", "broa", "sair", "lua", "dragão"], "certa": 4, "explicacao": "e) dragão — dra-gão"}, {"enunciado": "Na frase “Felipe ficou feliz <b>porque</b> ganhou a corrida.”, a palavra destacada quer dizer… Responda com a letra.", "alternativas": ["porém", "pois", "por qual motivo", "por isso", "o motivo"], "certa": 1, "explicacao": "b) pois — explica a causa: troque por “pois” e veja que dá certo."}, {"enunciado": "O que quer dizer <b>incauto</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["descuidado, que cai fácil em armadilhas", "arrependido", "combinado sem precisar falar, subentendido", "cuidadoso, precavido", "pouco, escasso"], "certa": 0, "explicacao": "a) descuidado, que cai fácil em armadilhas. Não é “cuidadoso, precavido”: essa é a pegadinha."}, {"enunciado": "Espero que ele ___ o primeiro da fila. (verbo ser)<br>Qual forma completa a frase? Responda com a letra.", "alternativas": ["é", "ser", "seje", "foi", "seja"], "certa": 4, "explicacao": "e) seja"}, {"enunciado": "Em qual frase o verbo está no tempo <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Hoje de manhã, eles tocaram violão.", "Amanhã, eles procuraram a bola.", "Na semana passada, eles brincaram no parque.", "No ano que vem, eles mandarão uma mensagem.", "Na semana passada, eles responderam às perguntas."], "certa": 1, "explicacao": "b) — a palavra de tempo e o verbo não combinam."}, {"enunciado": "Ontem eu ___ (verbo <b>poder</b>). Qual forma completa a frase? Responda com a letra.", "alternativas": ["pude", "podia", "poderei", "podi", "posso"], "certa": 0, "explicacao": "a) pude"}, {"enunciado": "Na locução verbal <b>preciso receber</b>, qual é o verbo principal? Responda com a letra.", "alternativas": ["os dois são principais", "não há verbo principal", "receber", "preciso", "o sujeito"], "certa": 2, "explicacao": "c) receber — o principal é o último, o que diz a ação."}, {"enunciado": "O que quer dizer <b>intempestivo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["rigoroso e sem luxo", "generoso, de coração grande", "que causa tempestade", "caro, que custa muito", "que acontece fora de hora"], "certa": 4, "explicacao": "e) que acontece fora de hora. Não é “que causa tempestade”: essa é a pegadinha."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual a crase está <b>ERRADA</b>? Responda com a letra.", "alternativas": ["Fui ao clube e à piscina.", "Vire à esquerda.", "Visitei à fazenda.", "Ficaram frente a frente.", "Fui à praia a pé."], "certa": 2, "explicacao": "c) — o certo é “a fazenda”: faça a troca pelo masculino: se aparecer “ao”, tem crase; se aparecer “o”, não tem."}, {"enunciado": "O que quer dizer <b>magnânimo</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["novato, iniciante", "breve e direto", "muito rico e poderoso", "dispensar, não precisar de algo", "generoso, de coração grande"], "certa": 4, "explicacao": "e) generoso, de coração grande. Não é “muito rico e poderoso”: essa é a pegadinha."}, {"enunciado": "Qual é o coletivo de <b>navios</b>? Responda com a letra.", "alternativas": ["cardume", "frota", "tropa", "casario", "esquadrilha"], "certa": 1, "explicacao": "b) frota — esquadrilha é de outro grupo."}, {"enunciado": "Atenção: quatro destas frases estão CERTAS, mesmo parecendo estranhas. Em qual o porquê está <b>ERRADO</b>? Responda com a letra.", "alternativas": ["Porquê o leite ferve e sobe?", "Não sei por que ela saiu tão cedo.", "E você foi embora por que motivo?", "Por que dormimos à noite", "A rua por que ele passa todo dia é barulhenta."], "certa": 0, "explicacao": "a) — o certo é “Por que o leite ferve e sobe?”: é pergunta: troque por “por qual motivo” e veja que dá certo."}, {"enunciado": "Qual é o superlativo culto (o “muito, muito”) de <b>triste</b>? Responda com a letra.", "alternativas": ["tristérrimo", "ótimo", "tristíssimo", "tristílimo", "paupérrimo"], "certa": 2, "explicacao": "c) tristíssimo"}, {"enunciado": "O que quer dizer <b>panaceia</b>? Cuidado com a pegadinha. Responda com a letra.", "alternativas": ["que dá para acreditar, razoável", "que arma truques para enganar", "doença sem cura", "remédio para todos os males", "excelente, muito habilidoso"], "certa": 3, "explicacao": "d) remédio para todos os males. Não é “doença sem cura”: essa é a pegadinha."}, {"enunciado": "De que duas palavras se forma <b>nesse</b>? Responda com a letra.", "alternativas": ["em + esse", "de + esse", "em + aquilo", "em + esses", "ne + esse"], "certa": 0, "explicacao": "a) em + esse"}, {"enunciado": "Ontem, eles ___ os brinquedos. Qual forma completa a frase? Responda com a letra.", "alternativas": ["guardaram", "guardariam", "guardarão", "guardavam", "guardam"], "certa": 0, "explicacao": "a) guardaram — passado: -am."}, {"enunciado": "Atenção: quatro destas palavras estão certas, mesmo parecendo estranhas. Qual está escrita de forma <b>ERRADA</b>? Responda com a letra.", "alternativas": ["mexerica", "pajé", "enxergar", "ameicha", "salgado"], "certa": 3, "explicacao": "d) ameicha — o certo é ameixa: depois de ditongo se usa x."}];
const CHAVE='simulado-bonus-2';
let marcadas={};try{marcadas=JSON.parse(localStorage.getItem(CHAVE)||'{}')}catch(e){}
const lista=document.getElementById('lista');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div><span class="n">'+(i+1)+'.</span> '+q.enunciado+'</div><div class="alts"></div><div class="expl"></div>';
  const alts=d.querySelector('.alts');
  q.alternativas.forEach((a,j)=>{const b=document.createElement('button');b.className='alt';
    b.innerHTML='<b>'+'abcde'[j]+')</b> '+a;b.onclick=()=>{marcadas[i]=j;salvar();pintar(i)};alts.appendChild(b)});
  d.querySelector('.expl').innerHTML='Resposta: '+q.explicacao;lista.appendChild(d);pintar(i)});
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(marcadas))}catch(e){}}
function pintar(i){document.querySelectorAll('#q'+i+' .alt').forEach((b,j)=>b.classList.toggle('marcada',marcadas[i]===j))}
document.getElementById('ver').onclick=()=>{let c=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);d.classList.add('mostrar');
  d.querySelectorAll('.alt').forEach((b,j)=>{b.classList.toggle('certa',j===q.certa);b.classList.toggle('errada',marcadas[i]===j&&j!==q.certa)});
  if(marcadas[i]===q.certa)c++});
  document.getElementById('nota').textContent='Você acertou '+c+' de '+Q.length+'. Leia as explicações das que errou.'};
</script></body></html>
