<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ditado · 1.3 S, SS, Ç, C, Z, SC e XC</title>
<style>
:root{--fundo:#fbfaf7;--texto:#1d2330;--suave:#5f6878;--borda:#e2ddd3;--acento:#d4650f;--cartao:#fff}
@media (prefers-color-scheme:dark){:root{--fundo:#16171a;--texto:#ececec;--suave:#a9b0bb;--borda:#33363c;--acento:#f2a15a;--cartao:#1f2125}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:18px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.25rem;margin:0 0 4px}
p{color:var(--suave);margin:0 0 16px}
#tudo{width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:14px;background:var(--acento);color:#fff;cursor:pointer}
#estado{min-height:1.6em;margin:10px 0;font-weight:700;color:var(--acento)}
ol{list-style:none;padding:0;margin:0;display:grid;gap:8px}
li{display:flex;align-items:center;justify-content:space-between;background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:10px 14px}
li.agora{outline:3px solid var(--acento)}.n{font-weight:800}
.b{font:inherit;font-weight:700;padding:6px 14px;border:1px solid var(--acento);border-radius:999px;background:none;color:var(--acento);cursor:pointer}
button:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
</style></head><body><main>
<h1>Ditado · 1.3 S, SS, Ç, C, Z, SC e XC</h1>
<p>Capítulo 1 · Toque em <b>Começar o ditado</b>. Cada item é falado duas vezes, com tempo para
escrever. Para ouvir um item de novo, toque em ▶ Ouvir.</p>
<button id="tudo">Começar o ditado</button>
<div id="estado" role="status"></div>
<ol><li data-src="audio/afa2ad5163ad.mp3" data-pausa="8"><span class="n">566a)</span><button class="b" aria-label="Ouvir o item 566a">▶ Ouvir</button></li><li data-src="audio/b0c51b47343c.mp3" data-pausa="8"><span class="n">566b)</span><button class="b" aria-label="Ouvir o item 566b">▶ Ouvir</button></li><li data-src="audio/1247a068a0b0.mp3" data-pausa="8"><span class="n">566c)</span><button class="b" aria-label="Ouvir o item 566c">▶ Ouvir</button></li><li data-src="audio/ca7d10cb0b35.mp3" data-pausa="8"><span class="n">566d)</span><button class="b" aria-label="Ouvir o item 566d">▶ Ouvir</button></li><li data-src="audio/88956510cf35.mp3" data-pausa="8"><span class="n">566e)</span><button class="b" aria-label="Ouvir o item 566e">▶ Ouvir</button></li><li data-src="audio/18b80eae0a09.mp3" data-pausa="8"><span class="n">566f)</span><button class="b" aria-label="Ouvir o item 566f">▶ Ouvir</button></li><li data-src="audio/57d36b380745.mp3" data-pausa="8"><span class="n">566g)</span><button class="b" aria-label="Ouvir o item 566g">▶ Ouvir</button></li><li data-src="audio/e8dc592efba6.mp3" data-pausa="8"><span class="n">566h)</span><button class="b" aria-label="Ouvir o item 566h">▶ Ouvir</button></li><li data-src="audio/c03791b754d7.mp3" data-pausa="16"><span class="n">567a)</span><button class="b" aria-label="Ouvir o item 567a">▶ Ouvir</button></li><li data-src="audio/0e7709aca56e.mp3" data-pausa="16"><span class="n">567b)</span><button class="b" aria-label="Ouvir o item 567b">▶ Ouvir</button></li></ol>
</main>
<script>
const itens=[...document.querySelectorAll('li')];const estado=document.getElementById('estado');
const audio=new Audio();let parar=false,rodando=false;
function tocar(src){return new Promise(r=>{audio.src=src;audio.onended=r;audio.onerror=r;audio.play().catch(r);});}
const espera=s=>new Promise(r=>setTimeout(r,s*1000));
itens.forEach(li=>li.querySelector('.b').onclick=()=>{parar=true;tocar(li.dataset.src);});
document.getElementById('tudo').onclick=async()=>{if(rodando)return;rodando=true;parar=false;
 for(const li of itens){if(parar)break;itens.forEach(x=>x.classList.remove('agora'));li.classList.add('agora');
  estado.textContent='Item '+li.querySelector('.n').textContent;
  await tocar(li.dataset.src);await espera(2);if(parar)break;await tocar(li.dataset.src);
  estado.textContent='Escreva…';await espera(+li.dataset.pausa);}
 estado.textContent=parar?'':'Fim do ditado! Confira as respostas no fim do livro.';rodando=false;};
</script></body></html>
