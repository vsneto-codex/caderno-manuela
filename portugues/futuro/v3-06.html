<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bônus futuro 6 · Português 5º ano · Volume 3</title>
<style>
:root{--fundo:#f6f7f9;--texto:#1d2330;--suave:#5f6878;--borda:#dfe3ea;--cartao:#fff;
 --faixa:#eef1f5;--acento:#2b62b8;--acento-claro:#e6eefb;--certo:#1f7a4a;--certo-claro:#e5f4ec;
 --dica:#8a5a00;--dica-claro:#fff6e0;--erro:#b3261e;
 --letra:"Nunito","Segoe UI",system-ui,sans-serif;--numero:"Nunito","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fundo:#14171c;--texto:#e8ebf0;
 --suave:#a3acba;--borda:#2e3440;--cartao:#1c2027;--faixa:#252a33;--acento:#86aef0;--acento-claro:#1f2c44;
 --certo:#7fd3a4;--certo-claro:#173326;--dica:#f0c36a;--dica-claro:#3a2f15;--erro:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--fundo:#14171c;--texto:#e8ebf0;--suave:#a3acba;--borda:#2e3440;--cartao:#1c2027;
 --faixa:#252a33;--acento:#86aef0;--acento-claro:#1f2c44;--certo:#7fd3a4;--certo-claro:#173326;
 --dica:#f0c36a;--dica-claro:#3a2f15;--erro:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.55 var(--letra);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;background:var(--fundo);border-bottom:1px solid var(--borda);padding:12px 16px;z-index:2}
header h1{font-size:1.15rem;margin:0 0 2px}
header p{margin:0 0 8px;color:var(--suave);font-size:.9rem}
form{display:flex;gap:8px;max-width:440px}
input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--borda);border-radius:10px;background:var(--cartao);color:var(--texto)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
button{font:inherit;font-weight:700;padding:8px 16px;border:0;border-radius:10px;background:var(--acento);color:var(--cartao);cursor:pointer}
#aviso{color:var(--erro);font-size:.9rem;margin-top:4px;min-height:1.2em}
main{max-width:780px;margin:0 auto;padding:12px 16px 80px}
h2.nivel{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:32px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--borda)}
article{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:16px 18px;margin:14px 0;scroll-margin-top:140px}
article.achado{outline:3px solid var(--acento)}
.num{display:inline-block;font-weight:800;color:var(--acento);margin-right:8px}
.cmd{margin:0 0 8px;font-weight:600}
.exemplo{margin:0 0 10px;padding:8px 12px;background:var(--faixa);border:1px solid var(--borda);border-radius:10px}
.item{border-top:1px dashed var(--borda);padding:12px 0 6px;scroll-margin-top:140px}
.item:first-of-type{border-top:0;padding-top:4px}
.item.achado{background:var(--acento-claro);border-radius:10px;padding-inline:10px}
.letra{font-weight:800;margin-right:6px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--acento);font-weight:700;font-size:.95rem;list-style:none;display:inline-block;padding:4px 12px;border:1px solid var(--acento);border-radius:999px}
summary::-webkit-details-marker{display:none}
details[open] summary{background:var(--acento);color:var(--cartao)}
.solucao{margin-top:12px;display:grid;gap:12px}
.passo{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.passo .n{width:28px;height:28px;border-radius:50%;background:var(--acento-claro);color:var(--acento);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.passo .corpo{min-width:0;display:grid;gap:8px;padding-top:2px}
.passo p{margin:0}
.dica{padding:8px 12px;border-radius:10px;background:var(--dica-claro);color:var(--texto);border-left:4px solid var(--dica);font-size:.95rem}
.dica b{color:var(--dica)}
.final{padding:10px 14px;border-radius:12px;background:var(--certo-claro);border:1px solid var(--certo);font-size:1.05rem}
.final b{color:var(--certo)}
.rolagem{overflow-x:auto}
table.quadro{border-collapse:collapse;font-size:1rem;text-align:center}
table.quadro th{font-size:.72rem;font-weight:700;color:var(--suave);padding:3px 8px;border:1px solid var(--borda);background:var(--faixa)}
table.quadro th.cls{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.quadro td{border:1px solid var(--borda);padding:5px 10px;min-width:34px;font-weight:700;font-size:1.1rem}
table.quadro td.rot{font-weight:600;font-size:.85rem;text-align:left;color:var(--suave);min-width:0}
table.quadro td.v{font-weight:400;font-size:.78rem;color:var(--suave)}
table.quadro .sep{border-left:3px solid var(--suave)}
table.quadro td.hl{background:var(--texto);color:var(--cartao);border-radius:4px}
table.quadro th.hl{background:var(--acento-claro);color:var(--acento)}
.legenda{font-size:.78rem;color:var(--suave);margin-top:4px}
table.conta{border-collapse:collapse;font-size:1.2rem;font-weight:700;margin-left:4px}
table.conta td{padding:1px 2px;text-align:center;min-width:.7em}
table.conta td.pt{min-width:0;padding:1px 0}
table.conta td.op{color:var(--acento);text-align:center;width:26px;padding-right:6px}
table.conta tr.res td{border-top:2px solid var(--texto);padding-top:3px}
table.conta tr.res td.op{border-top:0}
table.conta tr.reserva td{font-size:.75rem;color:var(--erro);font-weight:800;padding-bottom:0}
.lista{display:flex;flex-wrap:wrap;gap:6px}
.lista span{padding:3px 10px;border-radius:999px;background:var(--faixa);border:1px solid var(--borda);font-size:.95rem}
.lista-titulo{font-size:.85rem;color:var(--suave)}
.regra{background:var(--cartao);border:2px solid var(--texto);border-radius:14px;padding:12px 14px;margin:0 0 18px}
.regra h2{margin:0 0 6px;font-size:1.05rem;letter-spacing:.03em}
.regra h3{margin:12px 0 4px;font-size:.9rem;letter-spacing:.04em;color:var(--suave)}
.regra p{margin:0}.regra table{border-collapse:collapse;width:100%;font-size:.92rem}
.regra td,.regra th{border:1px solid var(--borda);padding:5px 7px;text-align:left;vertical-align:top}
.regra th{background:var(--faixa);font-size:.78rem}
.regra .cuidado{margin-top:10px;padding:8px 12px;border-radius:10px;border-left:4px solid var(--erro)}
.erros{padding:8px 12px;border-radius:10px;border:1px solid var(--borda);border-left:4px solid var(--erro);font-size:.95rem}
.erros b{color:var(--erro)}.erros ul{margin:4px 0 0;padding-left:1.1em}.erros li{margin:3px 0}
.dest{display:inline-block;background:var(--texto);color:var(--cartao);font-weight:800;border-radius:4px;padding:0 4px;line-height:1.3}
.caixa{display:inline-block;width:1.1em;height:1.1em;border:1.5px solid currentColor;border-radius:3px;vertical-align:-.2em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .15em;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.fr .caixa{width:.9em;height:.9em}
svg{max-width:100%;height:auto;display:block;color:var(--texto)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.logo{display:block;height:30px;width:auto;margin:0 0 8px;background:#fff;padding:4px 8px;border-radius:8px} main{max-width:720px;margin:0 auto;padding:16px;text-align:center}</style></head>
<body><header><img class="logo" src="https://vsneto-codex.github.io/caderno-manuela/logo-superbase.png" alt="SUPERBASE"><h1>Bônus futuro 6</h1><p>Português 5º ano · Volume 3</p></header>
<main><p style="font-size:1.3em"><b>QR CODE reservado para uma futura ideia genial</b></p>
<p>Volte de vez em quando: quando a novidade for liberada, ela aparece aqui.</p></main></body></html>
